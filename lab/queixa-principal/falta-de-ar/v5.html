<!-- VERSION: 5 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Falta de Ar — Avaliação Estruturada</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg-deep:#0f172a;--bg-card:#1e293b;--bg-input:#0f172a;
    --border:#334155;--border-light:#475569;
    --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-dim:#64748b;--text-faint:#475569;
    --accent:#3b82f6;--accent-light:#60a5fa;--accent-pale:#93c5fd;--accent-bg:#1e3a5f;
    --danger:#ef4444;--danger-dark:#7f1d1d;--danger-bg:#450a0a;--danger-light:#fca5a5;
    --warning:#f59e0b;--warning-dark:#78350f;--warning-bg:#451a03;--warning-light:#fcd34d;
    --success:#22c55e;--success-dark:#14532d;--success-bg:#052e16;--success-light:#86efac;
    --radius:1rem;--radius-sm:.75rem;--radius-xs:.5rem;
    --shadow-card:0 4px 24px rgba(0,0,0,.25);--shadow-btn:0 2px 8px rgba(0,0,0,.15);
    --font-mono:'SF Mono','Fira Code','Consolas',monospace;
    --transition-fast:.15s ease;--transition-normal:.25s ease;--transition-slow:.35s ease;
  }
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg-deep);color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
  header{background:linear-gradient(135deg,#1e293b 0%,#334155 100%);width:100%;padding:1.5rem;padding-top:max(1.5rem,env(safe-area-inset-top));text-align:center;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  header h1{font-size:1.5rem;font-weight:700;color:var(--text-primary);letter-spacing:-.01em}
  header p{font-size:.8rem;color:var(--text-secondary);margin-top:.2rem;opacity:.85}
  .back-link{position:absolute;left:1.5rem;top:50%;transform:translateY(-50%);color:var(--text-secondary);text-decoration:none;font-size:.85rem;font-weight:500;transition:color var(--transition-fast);padding:.5rem .3rem;touch-action:manipulation;display:flex;align-items:center;gap:.3rem}
  .back-link:hover{color:var(--text-primary)}
  .eval-timer{position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:.75rem;color:var(--text-dim);display:flex;align-items:center;gap:.4rem}
  .eval-timer .timer-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:timer-blink 2s ease-in-out infinite}
  @keyframes timer-blink{0%,100%{opacity:1}50%{opacity:.3}}
  .container{max-width:700px;width:100%;padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem}
  .progress-bar{display:flex;align-items:center;gap:.35rem;padding:0 .5rem}
  .progress-step{flex:1;height:6px;border-radius:3px;background:#1e293b;transition:background .4s ease,box-shadow .4s ease}
  .progress-step.done{background:var(--accent)}.progress-step.active{background:var(--accent-light);box-shadow:0 0 8px rgba(96,165,250,.4);animation:pulse-bar 1.8s ease-in-out infinite}
  @keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.5}}
  .progress-labels{display:flex;justify-content:space-between;font-size:.55rem;color:var(--text-dim);padding:0 .5rem}
  .progress-labels span{transition:color var(--transition-normal)}
  .progress-labels span.active-label{color:var(--accent-pale);font-weight:600}.progress-labels span.done-label{color:var(--accent)}
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;animation:fadeSlideIn .35s ease;box-shadow:var(--shadow-card)}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-size:1.15rem;color:#f8fafc;margin-bottom:.35rem;display:flex;align-items:center;gap:.5rem;letter-spacing:-.01em}
  .card h2 .step-badge{font-size:.65rem;background:var(--accent-bg);color:var(--accent-light);padding:.2rem .55rem;border-radius:9999px;font-weight:700;letter-spacing:.02em}
  .card .subtitle{font-size:.8rem;color:var(--text-secondary);margin-bottom:1.25rem;line-height:1.4}
  .options{display:flex;flex-direction:column;gap:.75rem}
  .option-group-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-top:.75rem;margin-bottom:-.15rem;display:flex;align-items:center;gap:.5rem}
  .option-group-label:first-child{margin-top:0}
  .option-group-label::after{content:'';flex:1;height:1px;background:#1e293b}
  .option-btn{background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.9rem 1.1rem;color:#cbd5e1;font-size:.95rem;cursor:pointer;transition:all var(--transition-fast);text-align:left;display:flex;align-items:center;gap:.75rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:3.2rem;position:relative;overflow:hidden}
  .option-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(59,130,246,.08),transparent);opacity:0;transition:opacity var(--transition-fast)}
  .option-btn:hover{border-color:var(--accent);color:var(--text-primary);transform:translateX(2px)}
  .option-btn:hover::before{opacity:1}
  .option-btn:active{transform:scale(.98);transition-duration:.08s}
  .option-btn.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary);box-shadow:0 0 0 1px rgba(59,130,246,.3),inset 0 1px 0 rgba(255,255,255,.05)}
  .option-btn.selected::before{opacity:1}
  .option-btn .icon{font-size:1.25rem;flex-shrink:0;width:2rem;text-align:center}
  .option-btn .label{flex:1}
  .option-btn .tag{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .5rem;border-radius:9999px;font-weight:600;flex-shrink:0}
  .tag-cardiac{background:var(--danger-dark);color:var(--danger-light)}.tag-pulmonary{background:#164e63;color:#67e8f9}.tag-other{background:#374151;color:#d1d5db}
  .check-btn{background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.75rem 1rem;color:#cbd5e1;font-size:.9rem;cursor:pointer;transition:all var(--transition-fast);text-align:left;display:flex;align-items:center;gap:.75rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:2.8rem}
  .check-btn:hover{border-color:var(--accent);background:#172040;color:var(--text-primary)}
  .check-btn:active{transform:scale(.98);transition-duration:.08s}
  .check-btn.checked{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary);box-shadow:0 0 0 1px rgba(59,130,246,.3)}
  .check-box{width:20px;height:20px;border:2px solid var(--border-light);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast);font-size:.75rem}
  .check-btn.checked .check-box{background:var(--accent);border-color:var(--accent)}
  .check-btn.emergency-checked{border-color:var(--danger)!important;background:var(--danger-bg)!important}
  .check-btn.emergency-checked .check-box{background:var(--danger)!important;border-color:var(--danger)!important}
  .nav-row{display:flex;gap:.75rem;margin-top:1.25rem}
  .nav-btn{flex:1;padding:.85rem;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;cursor:pointer;transition:all var(--transition-fast);border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:var(--shadow-btn);position:relative;overflow:hidden}
  .nav-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent);pointer-events:none}
  .nav-btn:active{transform:scale(.97);transition-duration:.08s}
  .nav-btn.secondary{background:#334155;color:#cbd5e1}.nav-btn.secondary:hover{background:#475569}
  .nav-btn.primary{background:var(--accent);color:#fff}.nav-btn.primary:hover{background:#2563eb}
  .nav-btn.danger{background:#dc2626;color:#fff}.nav-btn.danger:hover{background:#b91c1c}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
  .result-card{text-align:center;padding:2rem 1.5rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:5rem;height:5rem;border-radius:50%;font-size:1.5rem;font-weight:800;margin-bottom:1rem;animation:badgePop .4s ease}
  @keyframes badgePop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .risk-critical{background:#991b1b;color:var(--danger-light);border:3px solid var(--danger);box-shadow:0 0 30px rgba(239,68,68,.35)}
  .risk-high{background:#92400e;color:var(--warning-light);border:3px solid var(--warning);box-shadow:0 0 20px rgba(245,158,11,.2)}
  .risk-moderate{background:#1e40af;color:var(--accent-pale);border:3px solid var(--accent)}
  .risk-low{background:var(--success-dark);color:var(--success-light);border:3px solid var(--success)}
  .result-title{font-size:1.3rem;font-weight:700;margin-bottom:.25rem;letter-spacing:-.01em}
  .result-desc{color:var(--text-secondary);font-size:.9rem;margin-bottom:1.5rem}

  /* Red flags alert */
  .red-flags-banner{background:linear-gradient(135deg,#450a0a,#7f1d1d);border:2px solid var(--danger);border-radius:var(--radius-sm);padding:1rem 1.25rem;margin-bottom:1rem;animation:alertPulse 2s ease-in-out infinite}
  @keyframes alertPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
  .red-flags-banner h4{color:var(--danger-light);font-size:.85rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
  .red-flags-banner ul{list-style:none;padding:0}
  .red-flags-banner li{font-size:.8rem;color:#fecaca;padding:.2rem 0;padding-left:1.1rem;position:relative;line-height:1.4}
  .red-flags-banner li::before{content:'\2022';position:absolute;left:0;color:var(--danger);font-weight:bold}

  .dark-box{background:var(--bg-input);border-radius:var(--radius-sm);padding:1.25rem;text-align:left;margin-bottom:1.25rem;border:1px solid rgba(51,65,85,.5)}
  .dark-box h3{font-size:.8rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #1e293b;font-size:.85rem}
  .summary-row:last-child{border-bottom:none}.summary-row .criteria{color:var(--text-secondary);flex-shrink:0}
  .summary-row .value{font-weight:600;display:flex;align-items:center;gap:.4rem;text-align:right}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-red{background:var(--danger)}.dot-yellow{background:var(--warning)}.dot-blue{background:var(--accent)}.dot-green{background:var(--success)}
  .score-opt{flex:1;padding:.55rem .3rem;border-radius:var(--radius-xs);font-size:.72rem;cursor:pointer;border:1.5px solid var(--border);background:var(--bg-input);color:var(--text-dim);text-align:center;transition:all var(--transition-fast);line-height:1.3;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .score-opt:hover{border-color:var(--accent);color:#cbd5e1}
  .score-opt:active{transform:scale(.96)}
  .score-opt.picked{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary);font-weight:600}
  .score-opt .pts{display:block;font-size:.6rem;color:var(--text-dim);margin-top:.15rem}.score-opt.picked .pts{color:var(--accent-pale)}
  .score-result{display:flex;align-items:center;gap:1rem;padding:1rem;border-radius:var(--radius-sm);margin-top:.75rem;transition:all .3s ease}
  .score-result.sr-high{background:var(--danger-bg);border:1px solid var(--danger-dark)}
  .score-result.sr-mod{background:var(--warning-bg);border:1px solid var(--warning-dark)}
  .score-result.sr-low{background:var(--success-bg);border:1px solid var(--success-dark)}
  .score-result.sr-pending{background:var(--bg-card);border:1px solid var(--border)}
  .score-num{font-size:2rem;font-weight:800;font-family:var(--font-mono);min-width:2.5rem;text-align:center}
  .score-result.sr-high .score-num{color:var(--danger-light)}.score-result.sr-mod .score-num{color:var(--warning-light)}
  .score-result.sr-low .score-num{color:var(--success-light)}.score-result.sr-pending .score-num{color:var(--text-dim)}
  .score-info{flex:1}.score-info .score-label{font-size:.85rem;font-weight:600;color:var(--text-primary)}
  .score-info .score-detail{font-size:.75rem;color:var(--text-secondary);margin-top:.15rem;line-height:1.4}
  .score-row{margin-bottom:.75rem}
  .score-row-label{font-size:.8rem;color:var(--text-secondary);margin-bottom:.4rem;display:flex;justify-content:space-between;align-items:center}
  .score-row-label .auto-tag{font-size:.6rem;background:var(--accent-bg);color:var(--accent-light);padding:.1rem .4rem;border-radius:9999px;flex-shrink:0}
  .score-options{display:flex;gap:.4rem}
  .score-tabs{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
  .score-tab{flex:1;padding:.6rem;border-radius:var(--radius-xs);font-size:.75rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--bg-input);color:var(--text-dim);text-align:center;transition:all var(--transition-fast);min-width:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .score-tab.active{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary)}.score-tab:hover{border-color:var(--accent)}
  .conduta-box{border-radius:var(--radius-sm);padding:1.25rem;text-align:left;margin-bottom:1.25rem}
  .conduta-box h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
  .conduta-box.alta-prob{background:var(--danger-bg);border:1.5px solid #991b1b}.conduta-box.alta-prob h3{color:var(--danger-light)}
  .conduta-box.mod-prob{background:var(--warning-bg);border:1.5px solid var(--warning-dark)}.conduta-box.mod-prob h3{color:var(--warning-light)}
  .conduta-box.baixa-prob{background:var(--success-bg);border:1.5px solid var(--success-dark)}.conduta-box.baixa-prob h3{color:var(--success-light)}
  .conduta-box.neutra-prob{background:var(--bg-card);border:1.5px solid var(--border)}.conduta-box.neutra-prob h3{color:var(--text-secondary)}
  .conduta-item{display:flex;align-items:flex-start;gap:.5rem;padding:.4rem 0;font-size:.85rem;color:#cbd5e1;line-height:1.4}
  .conduta-icon{flex-shrink:0;width:1.2rem;text-align:center}
  .conduta-subitem{display:flex;align-items:flex-start;gap:.5rem;padding:.2rem 0 .2rem 1.7rem;font-size:.78rem;color:var(--text-secondary);line-height:1.35}

  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:.25rem 0}
  .collapse-header h3{margin-bottom:0}
  .collapse-arrow{font-size:.8rem;color:var(--text-dim);transition:transform var(--transition-normal)}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height var(--transition-slow),opacity var(--transition-normal)}
  .collapse-body.hidden{max-height:0!important;padding-top:0;margin-top:0;opacity:0}
  .collapse-body.visible{max-height:5000px;opacity:1}
  .note-box{background:var(--bg-input);border-radius:var(--radius-sm);padding:1.25rem;text-align:left;margin-bottom:1.25rem}
  .note-box h3{font-size:.8rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
  .note-text{background:#020617;border:1px solid #1e293b;border-radius:var(--radius-xs);padding:1rem;font-family:var(--font-mono);font-size:.72rem;color:var(--text-secondary);white-space:pre-wrap;line-height:1.6;max-height:400px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.75rem;padding:.7rem;border-radius:var(--radius-xs);border:1.5px solid var(--border);background:var(--bg-card);color:#cbd5e1;font-size:.85rem;font-weight:600;cursor:pointer;transition:all var(--transition-fast);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .copy-btn:hover{border-color:var(--accent);background:#172040;color:var(--text-primary)}
  .copy-btn:active{transform:scale(.97)}
  .copy-btn.copied{border-color:var(--success);background:var(--success-bg);color:var(--success-light)}
  .flow-connector{display:flex;justify-content:center;padding:.25rem 0}
  .flow-connector .arrow{width:2px;height:24px;background:var(--border);position:relative}
  .flow-connector .arrow::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--border)}
  .vitals-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .vital-input-group{display:flex;flex-direction:column;gap:.3rem}
  .vital-input-group label{font-size:.75rem;color:var(--text-secondary);display:flex;align-items:center;flex-wrap:wrap;gap:.25rem}
  .vital-input{background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--radius-xs);padding:.65rem .75rem;color:var(--text-primary);font-size:.95rem;font-family:var(--font-mono);width:100%;transition:border-color var(--transition-fast),box-shadow var(--transition-fast);-webkit-appearance:none;appearance:none}
  .vital-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .vital-input::placeholder{color:var(--text-faint);font-size:.82rem}
  .vital-input.input-danger{border-color:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.12)}
  .vital-input.input-warning{border-color:var(--warning);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
  .vital-tag{font-size:.6rem;padding:.15rem .4rem;border-radius:9999px;font-weight:600;margin-left:.2rem}
  .vital-tag.normal{background:var(--success-dark);color:var(--success-light)}
  .vital-tag.warning{background:var(--warning-dark);color:var(--warning-light)}
  .vital-tag.danger{background:var(--danger-dark);color:var(--danger-light)}
  .vital-hint{font-size:.6rem;color:var(--text-faint);margin-top:.15rem;font-style:italic}
  .dx-card{background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:1rem;margin-bottom:.75rem;transition:all var(--transition-fast)}
  .dx-card.primary-dx{border-color:var(--accent);background:#172040;box-shadow:0 0 0 1px rgba(59,130,246,.2)}
  .dx-card.secondary-dx{border-color:var(--border-light)}
  .dx-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
  .dx-name{font-size:.95rem;font-weight:600;color:var(--text-primary)}
  .dx-prob{font-size:.8rem;font-weight:700;font-family:var(--font-mono);padding:.2rem .6rem;border-radius:9999px;flex-shrink:0}
  .dx-prob.prob-high{background:var(--danger-dark);color:var(--danger-light)}
  .dx-prob.prob-mod{background:var(--warning-dark);color:var(--warning-light)}
  .dx-prob.prob-low{background:var(--bg-card);color:var(--text-secondary)}
  .dx-category{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-bottom:.3rem}
  .dx-clues{font-size:.8rem;color:var(--text-secondary);line-height:1.4}
  .dx-workup-toggle{font-size:.72rem;color:var(--accent-light);cursor:pointer;margin-top:.4rem;display:inline-flex;align-items:center;gap:.3rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:color var(--transition-fast)}
  .dx-workup-toggle:hover{color:var(--accent-pale)}
  .dx-workup-list{margin-top:.4rem;padding-left:.5rem}
  .dx-workup-list li{font-size:.78rem;color:var(--text-secondary);padding:.15rem 0;line-height:1.4}
  .workup-item{display:flex;align-items:flex-start;gap:.5rem;padding:.35rem 0;font-size:.85rem;color:#cbd5e1}
  .workup-icon{flex-shrink:0;width:1.2rem;text-align:center;font-size:.9rem}
  .info-banner{background:#172554;border:1px solid #1e40af;border-radius:var(--radius-sm);padding:.75rem 1rem;font-size:.8rem;color:var(--accent-pale);margin-bottom:.5rem;line-height:1.4}

  /* Smoking field */
  .smoking-options{display:flex;gap:.4rem;margin-top:.3rem}

  /* qSOFA indicator */
  .qsofa-mini{display:inline-flex;align-items:center;gap:.4rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xs);padding:.3rem .6rem;font-size:.72rem;margin-top:.5rem}
  .qsofa-mini.qsofa-alert{background:var(--danger-bg);border-color:var(--danger-dark)}
  .qsofa-mini .qsofa-score{font-weight:700;font-family:var(--font-mono)}
  .qsofa-mini.qsofa-alert .qsofa-score{color:var(--danger-light)}

  /* MAP display */
  .map-display{font-size:.68rem;color:var(--text-dim);margin-top:.35rem;display:flex;align-items:center;gap:.4rem}
  .map-display .map-val{font-weight:600;font-family:var(--font-mono)}
  .map-display.map-low{color:var(--danger-light)}

  /* Disclaimer bar */
  .disclaimer-bar{font-size:.65rem;color:var(--text-faint);text-align:center;padding:.75rem 1rem;border-top:1px solid #1e293b;width:100%;max-width:700px;margin-top:auto}

  /* Keyboard shortcut hint */
  .kb-hint{font-size:.6rem;color:var(--text-faint);text-align:center;padding:.3rem 0}
  .kb-hint kbd{background:var(--bg-card);border:1px solid var(--border);border-radius:3px;padding:.1rem .3rem;font-family:var(--font-mono);font-size:.58rem}

  /* Empty state hint */

<body>
<header>
  <a href="../falta-de-ar.html" class="back-link">&larr; Voltar</a>
  <h1>Avaliação de Falta de Ar</h1>
  <p>Dispneia no PS — Avaliação Estruturada</p>
  <div class="eval-timer"><span class="timer-dot"></span><span id="evalTimer">00:00</span></div>
</header>
<div class="container" id="app"></div>
<div class="disclaimer-bar">Ferramenta de apoio à decisão clínica. Não substitui o julgamento médico.</div>
<button class="scroll-top-btn" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Voltar ao topo">&uarr;</button>
<script>
// =============================================
// DATA
// =============================================
const STEP_LABELS=['Início','Gravidade','Sintomas','Sinais Vitais','Exame','Resultado'];
const TOTAL_STEPS=6;

// =============================================
// STATE
// =============================================
let currentStep=0;
const evalStartTime=new Date();

// Evaluation timer
setInterval(()=>{
  const el=document.getElementById('evalTimer');
  if(!el)return;
  const diff=Math.floor((new Date()-evalStartTime)/1000);
  const m=Math.floor(diff/60),s=diff%60;
  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
},1000);

// Scroll-to-top visibility
window.addEventListener('scroll',()=>{
  const btn=document.getElementById('scrollTopBtn');
  if(!btn)return;
  if(window.scrollY>400)btn.classList.add('visible');
  else btn.classList.remove('visible');
},{passive:true});

// Step 0: Onset
let onset=null; // 'agudo','cronico','agudo-cronico'

// Step 1: Severity
let severity=null; // 'sentencas','frases','palavras','incapaz'

// Step 2: Associated symptoms (multi-select)
let symptoms=new Set();
const SYMPTOM_LIST=[
  {id:'dor_toracica',label:'Dor torácica',icon:'\u{1FAC1}',cat:'cardiac'},
  {id:'palpitacoes',label:'Palpitações',icon:'\u{1F493}',cat:'cardiac'},
  {id:'ortopneia',label:'Ortopneia (piora ao deitar)',icon:'\u{1F6CF}\u{FE0F}',cat:'cardiac'},
  {id:'dpn',label:'Dispneia paroxística noturna (DPN)',icon:'\u{1F319}',cat:'cardiac'},
  {id:'edema_mmii',label:'Edema de membros inferiores',icon:'\u{1F9B6}',cat:'cardiac'},
  {id:'febre',label:'Febre',icon:'\u{1F321}\u{FE0F}',cat:'pulmonary'},
  {id:'tosse',label:'Tosse',icon:'\u{1F912}',cat:'pulmonary'},
  {id:'expectoracao',label:'Expectoração produtiva',icon:'\u{1F4A7}',cat:'pulmonary'},
  {id:'hemoptise',label:'Hemoptise',icon:'\u{1FA78}',cat:'pulmonary'},
  {id:'sibilancia',label:'Sibilância / chiado',icon:'\u{1F4A8}',cat:'pulmonary'},
  {id:'dor_pleuritica',label:'Dor pleurítica (ventilatório-dependente)',icon:'\u{1F4CC}',cat:'pulmonary'},
  {id:'dor_panturrilha',label:'Dor / edema unilateral em panturrilha',icon:'\u{1F9B5}',cat:'pulmonary'},
  {id:'tontura',label:'Tontura / pré-síncope',icon:'\u{1F4AB}',cat:'other'},
  {id:'parestesias',label:'Parestesias periféricas',icon:'\u{270B}',cat:'other'},
  {id:'ansiedade',label:'Ansiedade / sensação de morte',icon:'\u{1F630}',cat:'other'},
  {id:'estridor_sint',label:'Estridor / rouquidão',icon:'\u{1F6A8}',cat:'other'},
  {id:'urticaria',label:'Urticária / prurido / angioedema',icon:'\u{1F534}',cat:'other'},
  {id:'disfagia',label:'Disfagia / edema facial',icon:'\u{1F910}',cat:'other'},
  {id:'sudorese',label:'Sudorese fria',icon:'\u{1F4A6}',cat:'other'},
  {id:'emagrecimento',label:'Emagrecimento / perda ponderal',icon:'\u{1F4C9}',cat:'other'},
  {id:'sincope',label:'Síncope / perda de consciência',icon:'\u{1F635}',cat:'other'},
];

// Step 3: Vital signs
let vitals={spo2:'',fr:'',fc:'',pas:'',pad:'',temp:''};

// Step 4: Physical exam (multi-select)
let examFindings=new Set();
const EXAM_LIST=[
  {id:'desvio_traqueia',label:'Desvio de traqueia',icon:'\u{26A0}\u{FE0F}',cat:'emergencia'},
  {id:'enfisema_subcut',label:'Enfisema subcutâneo',icon:'\u{1F4A8}',cat:'emergencia'},
  {id:'estridor',label:'Estridor',icon:'\u{1F6A8}',cat:'emergencia'},
  {id:'angioedema',label:'Angioedema / edema de glote',icon:'\u{1F6A8}',cat:'emergencia'},
  {id:'sibilos',label:'Sibilos',icon:'\u{1F4A8}',cat:'pulmonary'},
  {id:'crepitacoes',label:'Crepitações / estertores',icon:'\u{1F52C}',cat:'pulmonary'},
  {id:'mv_diminuido',label:'Murmúrio vesicular diminuído',icon:'\u{1F507}',cat:'pulmonary'},
  {id:'mv_abolido',label:'MV abolido unilateral',icon:'\u{26A0}\u{FE0F}',cat:'pulmonary'},
  {id:'macicez',label:'Macicez à percussão',icon:'\u{1F4CC}',cat:'pulmonary'},
  {id:'timpanismo',label:'Timpanismo à percussão',icon:'\u{1F4CC}',cat:'pulmonary'},
  {id:'turgencia_jugular',label:'Turgência jugular (TJP)',icon:'\u{1F9E3}',cat:'cardiac'},
  {id:'edema_periferico',label:'Edema periférico',icon:'\u{1F9B6}',cat:'cardiac'},
  {id:'b3',label:'Terceira bulha (B3)',icon:'\u{1FA7A}',cat:'cardiac'},
  {id:'hepatomegalia',label:'Hepatomegalia dolorosa',icon:'\u{1FAC1}',cat:'cardiac'},
  {id:'refluxo_hepatojugular',label:'Refluxo hepatojugular',icon:'\u{1F504}',cat:'cardiac'},
  {id:'pulso_paradoxal',label:'Pulso paradoxal (> 10 mmHg)',icon:'\u{1F4C9}',cat:'cardiac'},
  {id:'ritmo_irregular',label:'Ritmo cardíaco irregular',icon:'\u{1F4C8}',cat:'cardiac'},
  {id:'uso_acessoria',label:'Uso de musculatura acessória',icon:'\u{1F4AA}',cat:'geral'},
  {id:'cianose',label:'Cianose',icon:'\u{1F7E3}',cat:'geral'},
  {id:'tiragem',label:'Tiragem intercostal / subcostal',icon:'\u{26A0}\u{FE0F}',cat:'geral'},
  {id:'alteracao_consciencia',label:'Alteração do nível de consciência',icon:'\u{1F635}',cat:'geral'},
  {id:'batimento_asa_nasal',label:'Batimento de asa de nariz',icon:'\u{1F4A8}',cat:'geral'},
];

// Step 5 (result page)
let activeScoreTab='wells';
let sections={resumo:true, diag:true, conduta:true, scores:true, note:true};
let dxWorkupOpen={};

// Wells score for PE
let wells={clinical_dvt:null, pe_likely:null, hr100:null, immob_surg:null, prior_pe_dvt:null, hemoptysis:null, cancer:null};

// CURB-65
let curb={confusion:null, bun:null, rr30:null, bp:null, age65:null};

// Patient history
let patHistory={age:null, sex:null, smoking:null};
const HISTORY_FIELDS=[
  {id:'dpoc',label:'DPOC'},
  {id:'asthma',label:'Asma'},
  {id:'icc',label:'Insuficiência cardíaca'},
  {id:'immob',label:'Imobilização / cirurgia recente'},
  {id:'cancer',label:'Câncer ativo'},
  {id:'tvp_tep',label:'TVP/TEP prévio'},
  {id:'dm',label:'Diabetes mellitus'},
  {id:'has',label:'Hipertensão arterial'},
  {id:'hiv',label:'HIV / Imunossupressão'},
  {id:'drc',label:'Doença renal crônica'},
  {id:'obesidade',label:'Obesidade'},
  {id:'gestante',label:'Gestante / puérpera'},
  {id:'fa',label:'Fibrilação atrial / Arritmia conhecida'},
];
let patHistoryChecks=new Set();

const app=document.getElementById('app');

// =============================================
// HELPERS
// =============================================
function vNum(v){const n=parseFloat(v);return isNaN(n)?null:n}
function spo2Val(){return vNum(vitals.spo2)}
function frVal(){return vNum(vitals.fr)}
function fcVal(){return vNum(vitals.fc)}
function pasVal(){return vNum(vitals.pas)}
function padVal(){return vNum(vitals.pad)}
function tempVal(){return vNum(vitals.temp)}

// Mean Arterial Pressure
function mapVal(){
  const p=pasVal(),d=padVal();
  if(p===null||d===null)return null;
  return Math.round(d+(p-d)/3);
}

function spo2Status(){const v=spo2Val();if(v===null)return null;if(v<=88)return 'danger';if(v<=92)return 'warning';return 'normal'}
function frStatus(){const v=frVal();if(v===null)return null;if(v>=30)return 'danger';if(v>=24)return 'warning';if(v<=8)return 'danger';return 'normal'}
function fcStatus(){const v=fcVal();if(v===null)return null;if(v>=130)return 'danger';if(v>=100)return 'warning';if(v<=40)return 'danger';if(v<=50)return 'warning';return 'normal'}
function pasStatus(){const v=pasVal();if(v===null)return null;if(v<=90)return 'danger';if(v>=180)return 'warning';return 'normal'}
function padStatus(){const v=padVal();if(v===null)return null;if(v<=50)return 'danger';if(v>=110)return 'warning';return 'normal'}
function tempStatus(){const v=tempVal();if(v===null)return null;if(v>=39.5)return 'danger';if(v>=38)return 'warning';if(v<=35)return 'danger';return 'normal'}

function fcStatusLabel(){
  const v=fcVal();if(v===null)return '';
  if(v>=130)return 'Crítico';
  if(v>=100)return 'Taquicardia';
  if(v<=40)return 'Bradicardia grave';
  if(v<=50)return 'Bradicardia';
  return 'Normal';
}

function severityScore(){
  if(severity==='incapaz')return 4;
  if(severity==='palavras')return 3;
  if(severity==='frases')return 2;
  if(severity==='sentencas')return 1;
  return 0;
}

function vitalSeverity(){
  let score=0;
  const s=spo2Val(),f=frVal(),fc=fcVal(),p=pasVal(),t=tempVal();
  if(s!==null){if(s<=88)score+=3;else if(s<=92)score+=2;else if(s<=95)score+=1}
  if(f!==null){if(f>=30)score+=3;else if(f>=24)score+=2;else if(f>=20)score+=1}
  if(fc!==null){if(fc>=130)score+=2;else if(fc>=100)score+=1;else if(fc<=40)score+=2;else if(fc<=50)score+=1}
  if(p!==null&&p<=90)score+=2;
  if(t!==null){if(t>=39.5)score+=1;else if(t<=35)score+=2}
  return score;
}

function examSeverity(){
  let score=0;
  if(examFindings.has('estridor'))score+=3;
  if(examFindings.has('desvio_traqueia'))score+=3;
  if(examFindings.has('mv_abolido'))score+=3;
  if(examFindings.has('cianose'))score+=3;
  if(examFindings.has('angioedema'))score+=3;
  if(examFindings.has('enfisema_subcut'))score+=2;
  if(examFindings.has('uso_acessoria'))score+=2;
  if(examFindings.has('tiragem'))score+=2;
  if(examFindings.has('alteracao_consciencia'))score+=3;
  if(examFindings.has('batimento_asa_nasal'))score+=2;
  if(examFindings.has('turgencia_jugular'))score+=1;
  if(examFindings.has('crepitacoes'))score+=1;
  if(examFindings.has('sibilos'))score+=1;
  if(examFindings.has('edema_periferico'))score+=1;
  if(examFindings.has('b3'))score+=1;
  if(examFindings.has('hepatomegalia'))score+=1;
  if(examFindings.has('mv_diminuido'))score+=1;
  if(examFindings.has('macicez'))score+=1;
  if(examFindings.has('timpanismo'))score+=1;
  if(examFindings.has('refluxo_hepatojugular'))score+=1;
  if(examFindings.has('pulso_paradoxal'))score+=1;
  if(examFindings.has('ritmo_irregular'))score+=1;
  return score;
}

function totalRiskScore(){
  return severityScore()+vitalSeverity()+examSeverity();
}

function riskLevel(){
  const s=totalRiskScore();
  if(s>=10)return {level:'critico',label:'Crítico',cls:'risk-critical',icon:'\u{1F6A8}'};
  if(s>=6)return {level:'alto',label:'Alto Risco',cls:'risk-high',icon:'\u{26A0}\u{FE0F}'};
  if(s>=3)return {level:'moderado',label:'Risco Moderado',cls:'risk-moderate',icon:'\u{1F50D}'};
  return {level:'baixo',label:'Baixo Risco',cls:'risk-low',icon:'\u{2705}'};
}

// qSOFA quick calculation
function getQSOFA(){
  let score=0;
  const fr=frVal(),pas=pasVal();
  if(fr!==null&&fr>=22)score++;
  if(pas!==null&&pas<=100)score++;
  if(examFindings.has('alteracao_consciencia'))score++;
  return score;
}

// O2 delivery suggestion based on SpO2
function getO2Suggestion(){
  const s=spo2Val();
  if(s===null)return null;
  if(s<=85)return {cls:'o2-critical',text:'Hipoxemia grave: MNR 15L/min ou VNI imediata. Preparar IOT.'};
  if(s<=88)return {cls:'o2-critical',text:'Hipoxemia grave: MNR 10-15L/min. Considerar VNI.'};
  if(s<=92)return {cls:'o2-warning',text:'Hipoxemia: Máscara de Venturi 40-50% ou cateter nasal 3-5L/min.'};
  if(s<=94)return {cls:'o2-warning',text:'SpO\u2082 limítrofe: Cateter nasal 1-3L/min. Monitorar.'};
  return {cls:'o2-ok',text:'SpO\u2082 adequada. O\u2082 suplementar não indicado de rotina.'};
}

// Red flags detection
function getRedFlags(){
  const flags=[];
  if(examFindings.has('desvio_traqueia'))flags.push('Desvio de traqueia \u2014 Pneumotórax hipertensivo?');
  if(examFindings.has('estridor'))flags.push('Estridor \u2014 Obstrução de via aérea superior');
  if(examFindings.has('angioedema'))flags.push('Angioedema/edema de glote \u2014 Via aérea ameaçada');
  if(spo2Val()!==null&&spo2Val()<=85)flags.push('SpO\u2082 \u2264 85% \u2014 Hipoxemia grave');
  if(severity==='incapaz')flags.push('Incapaz de falar \u2014 Insuficiência respiratória iminente');
  if(examFindings.has('cianose'))flags.push('Cianose \u2014 Hipoxemia tecidual');
  if(pasVal()!==null&&pasVal()<=80)flags.push('PAS \u2264 80 mmHg \u2014 Choque');
  if(examFindings.has('alteracao_consciencia'))flags.push('Alteração de consciência \u2014 Possível falência orgânica');
  if(fcVal()!==null&&fcVal()>=150)flags.push('FC \u2265 150 bpm \u2014 Taquiarritmia?');
  if(fcVal()!==null&&fcVal()<=40)flags.push('FC \u2264 40 bpm \u2014 Bradicardia grave');
  if(frVal()!==null&&frVal()>=35)flags.push('FR \u2265 35 irpm \u2014 Fadiga respiratória iminente');
  if(tempVal()!==null&&tempVal()<=35)flags.push('Temperatura \u2264 35\u00B0C \u2014 Hipotermia');
  const m=mapVal();
  if(m!==null&&m<65)flags.push(`PAM ${m} mmHg (< 65) \u2014 Risco de hipoperfusão orgânica`);
  if(examFindings.has('enfisema_subcut'))flags.push('Enfisema subcutâneo \u2014 Pneumotórax / Pneumomediastino?');
  if(symptoms.has('sincope'))flags.push('Síncope associada \u2014 Avaliar causa cardíaca ou TEP maciço');
  if(examFindings.has('pulso_paradoxal'))flags.push('Pulso paradoxal > 10 mmHg \u2014 Tamponamento? Asma grave? DPOC grave?');
  return flags;
}

// =============================================
// DIFFERENTIAL DIAGNOSIS ENGINE
// =============================================
function buildDifferentials(){
  const dx=[];

  // --- CARDIAC ---
  // ICC descompensada
  let iccScore=0;
  if(symptoms.has('ortopneia'))iccScore+=3;
  if(symptoms.has('dpn'))iccScore+=3;
  if(symptoms.has('edema_mmii'))iccScore+=2;
  if(examFindings.has('turgencia_jugular'))iccScore+=3;
  if(examFindings.has('crepitacoes'))iccScore+=2;
  if(examFindings.has('b3'))iccScore+=3;
  if(examFindings.has('edema_periferico'))iccScore+=2;
  if(examFindings.has('hepatomegalia'))iccScore+=2;
  if(examFindings.has('refluxo_hepatojugular'))iccScore+=2;
  if(patHistoryChecks.has('icc'))iccScore+=3;
  if(onset==='agudo-cronico')iccScore+=2;
  if(onset==='cronico')iccScore+=1;
  dx.push({name:'ICC descompensada',cat:'Cardíaca',score:iccScore,
    clues:'Ortopneia, DPN, TJP, B3, edema periférico, crepitações bibasais',
    workup:['BNP / NT-proBNP','RX tórax (congestão, cardiomegalia)','ECG 12 derivações','Ecocardiograma à beira-leito','Função renal e eletrólitos','Balanço hídrico rigoroso']});

  // Edema Agudo de Pulmão (EAP)
  let eapScore=0;
  if(onset==='agudo')eapScore+=2;
  if(symptoms.has('ortopneia'))eapScore+=2;
  if(examFindings.has('crepitacoes'))eapScore+=3;
  if(spo2Val()!==null&&spo2Val()<=90)eapScore+=2;
  if(examFindings.has('uso_acessoria'))eapScore+=1;
  if(severity==='incapaz'||severity==='palavras')eapScore+=2;
  if(patHistoryChecks.has('icc'))eapScore+=2;
  if(pasVal()!==null&&pasVal()>=180)eapScore+=2;
  if(symptoms.has('sudorese'))eapScore+=1;
  dx.push({name:'Edema agudo de pulmão (EAP)',cat:'Cardíaca',score:eapScore,
    clues:'Início agudo, crepitações difusas, ortopneia intensa, expectoração rósea, hipertensão',
    workup:['RX tórax à beira-leito','BNP / NT-proBNP','ECG 12 derivações (SCA?)','Gasometria arterial','VNI (CPAP 10 cmH\u2082O) se consciente','Furosemida IV + Nitroglicerina SL/IV']});

  // SCA
  let scaScore=0;
  if(symptoms.has('dor_toracica'))scaScore+=4;
  if(symptoms.has('palpitacoes'))scaScore+=1;
  if(symptoms.has('sudorese'))scaScore+=2;
  if(onset==='agudo')scaScore+=1;
  const fc=fcVal();if(fc!==null&&fc>=100)scaScore+=1;
  if(patHistory.age>=2)scaScore+=1; // age index >=2 means 65+ anos
  if(patHistoryChecks.has('dm'))scaScore+=1;
  if(patHistoryChecks.has('has'))scaScore+=1;
  if(patHistory.smoking==='ativo')scaScore+=1;
  if(symptoms.has('sincope'))scaScore+=1;
  dx.push({name:'Síndrome coronariana aguda (SCA)',cat:'Cardíaca',score:scaScore,
    clues:'Dor torácica associada, sudorese, fatores de risco cardiovascular, ECG com alterações',
    workup:['ECG 12 derivações (imediato)','Troponina de alta sensibilidade seriada (0h/1h ou 0h/3h)','RX tórax','AAS 200mg VO (se não contraindicado)','Ecocardiograma se indicado','Considerar dupla antiagregação e anticoagulação conforme protocolo']});

  // Tamponamento
  let tampScore=0;
  if(examFindings.has('turgencia_jugular'))tampScore+=2;
  if(pasVal()!==null&&pasVal()<=90)tampScore+=2;
  if(fcVal()!==null&&fcVal()>=100)tampScore+=1;
  if(symptoms.has('dor_toracica'))tampScore+=1;
  if(patHistoryChecks.has('cancer'))tampScore+=1;
  if(examFindings.has('pulso_paradoxal'))tampScore+=3;
  if(symptoms.has('sincope'))tampScore+=1;
  dx.push({name:'Tamponamento cardíaco',cat:'Cardíaca',score:tampScore,
    clues:'Tríade de Beck: hipotensão, TJP, bulhas abafadas. Pulso paradoxal > 10 mmHg.',
    workup:['Ecocardiograma à beira-leito (FAST/POCUS)','ECG (baixa voltagem, alternância elétrica)','RX tórax (silhueta cardíaca em moringa)','Pericardiocentese se instabilidade hemodinâmica']});

  // Taquiarritmia (FA, flutter, TSVP)
  let taqScore=0;
  if(symptoms.has('palpitacoes'))taqScore+=3;
  if(examFindings.has('ritmo_irregular'))taqScore+=3;
  if(fcVal()!==null&&fcVal()>=120)taqScore+=2;
  if(fcVal()!==null&&fcVal()>=100&&fcVal()<120)taqScore+=1;
  if(onset==='agudo')taqScore+=1;
  if(patHistoryChecks.has('fa'))taqScore+=3;
  if(symptoms.has('tontura'))taqScore+=1;
  if(symptoms.has('sincope'))taqScore+=2;
  if(symptoms.has('dor_toracica'))taqScore+=1;
  dx.push({name:'Taquiarritmia (FA, Flutter, TSVP)',cat:'Cardíaca',score:taqScore,
    clues:'Palpitações, ritmo irregular, FC elevada, início súbito, história de arritmia',
    workup:['ECG 12 derivações (imediato)','Monitorização cardíaca contínua','Eletrólitos (K+, Mg2+, Ca2+)','Função tireoidiana (TSH)','Ecocardiograma','Se FA com RVR: controle de frequência (Metoprolol 5mg IV ou Diltiazem 0,25mg/kg IV)','Se instável: cardioversão elétrica sincronizada']});

  // --- PULMONARY ---
  // TEP
  let tepScore=0;
  if(onset==='agudo')tepScore+=2;
  if(symptoms.has('dor_pleuritica'))tepScore+=2;
  if(symptoms.has('hemoptise'))tepScore+=2;
  if(symptoms.has('dor_panturrilha'))tepScore+=3;
  if(fcVal()!==null&&fcVal()>=100)tepScore+=1;
  if(spo2Val()!==null&&spo2Val()<=92)tepScore+=1;
  if(patHistoryChecks.has('immob'))tepScore+=2;
  if(patHistoryChecks.has('cancer'))tepScore+=2;
  if(patHistoryChecks.has('tvp_tep'))tepScore+=2;
  if(patHistoryChecks.has('gestante'))tepScore+=1;
  if(symptoms.has('sudorese'))tepScore+=1;
  if(symptoms.has('sincope'))tepScore+=2;
  dx.push({name:'Tromboembolismo pulmonar (TEP)',cat:'Pulmonar',score:tepScore,
    clues:'Início súbito, dor pleurítica, taquicardia, fatores de risco trombótico, TVP, síncope',
    workup:['D-dímero (se baixa/moderada probabilidade)','Angio-TC de tórax','ECG (S1Q3T3, taquicardia sinusal, BRD novo)','Ecocardiograma (sobrecarga de VD)','USG MMII (TVP)','Se instável: trombolítico (Alteplase 100mg) ou embolectomia']});

  // Pneumonia
  let pnmScore=0;
  if(symptoms.has('febre'))pnmScore+=3;
  if(symptoms.has('tosse'))pnmScore+=2;
  if(symptoms.has('expectoracao'))pnmScore+=2;
  if(examFindings.has('crepitacoes'))pnmScore+=2;
  if(tempVal()!==null&&tempVal()>=38)pnmScore+=2;
  if(patHistoryChecks.has('hiv'))pnmScore+=1;
  if(frVal()!==null&&frVal()>=24)pnmScore+=1;
  dx.push({name:'Pneumonia',cat:'Pulmonar',score:pnmScore,
    clues:'Febre, tosse produtiva, crepitações localizadas, leucocitose, taquipneia',
    workup:['RX tórax (PA + perfil)','Hemograma, PCR, procalcitonina','Hemoculturas (2 amostras)','Gasometria arterial se SpO\u2082 \u2264 92%','CURB-65 para estratificação','Ureia e creatinina']});

  // DPOC exacerbado
  let dpocScore=0;
  if(patHistoryChecks.has('dpoc'))dpocScore+=4;
  if(symptoms.has('tosse'))dpocScore+=1;
  if(symptoms.has('expectoracao'))dpocScore+=2;
  if(symptoms.has('sibilancia'))dpocScore+=2;
  if(examFindings.has('sibilos'))dpocScore+=2;
  if(onset==='agudo-cronico')dpocScore+=2;
  if(patHistory.smoking==='ativo'||patHistory.smoking==='ex')dpocScore+=1;
  dx.push({name:'DPOC exacerbado',cat:'Pulmonar',score:dpocScore,
    clues:'História de DPOC/tabagismo, sibilos, expectoração purulenta, piora progressiva',
    workup:['RX tórax (excluir PNM, PTX)','Gasometria arterial','Hemograma, PCR','VNI (BiPAP) se acidose respiratória (pH < 7,35)','Broncodilatador inalatório (Salbutamol + Ipratrópio)','Corticoide sistêmico (Prednisona 40mg ou Metilprednisolona IV)']});

  // Asma / crise asmática
  let asmaScore=0;
  if(patHistoryChecks.has('asthma'))asmaScore+=4;
  if(symptoms.has('sibilancia'))asmaScore+=3;
  if(examFindings.has('sibilos'))asmaScore+=3;
  if(onset==='agudo')asmaScore+=1;
  if(examFindings.has('uso_acessoria'))asmaScore+=1;
  if(examFindings.has('tiragem'))asmaScore+=1;
  if(examFindings.has('pulso_paradoxal'))asmaScore+=1;
  dx.push({name:'Crise asmática',cat:'Pulmonar',score:asmaScore,
    clues:'História de asma, sibilos difusos, dispneia com sibilância, resposta a broncodilatador',
    workup:['Peak flow (se possível)','RX tórax (excluir complicações)','Gasometria se crise grave','SpO\u2082 seriada','Salbutamol 400\u2013800 mcg inalatório (4\u20138 jatos) a cada 20min','Ipratrópio 40\u201380 mcg associado','Corticoide: Prednisolona 40\u201360mg VO ou Metilprednisolona 40\u201380mg IV']});

  // Pneumotórax
  let ptxScore=0;
  if(onset==='agudo')ptxScore+=2;
  if(examFindings.has('mv_abolido'))ptxScore+=4;
  if(examFindings.has('mv_diminuido'))ptxScore+=2;
  if(examFindings.has('enfisema_subcut'))ptxScore+=3;
  if(examFindings.has('desvio_traqueia'))ptxScore+=4;
  if(examFindings.has('timpanismo'))ptxScore+=3;
  if(symptoms.has('dor_pleuritica'))ptxScore+=2;
  dx.push({name:'Pneumotórax',cat:'Pulmonar',score:ptxScore,
    clues:'Início súbito, MV abolido/diminuído unilateral, timpanismo, desvio de traqueia (hipertensivo)',
    workup:['RX tórax','USG pulmonar (point-of-care: ausência de deslizamento pleural)','TC tórax se dúvida','Se hipertensivo: toracocentese descompressiva imediata (2\u00BA EIC linha hemiclavicular)','Drenagem tórax em selo d\'água']});

  // Derrame Pleural
  let dpScore=0;
  if(examFindings.has('mv_diminuido'))dpScore+=2;
  if(examFindings.has('macicez'))dpScore+=3;
  if(onset==='cronico')dpScore+=1;
  if(onset==='agudo-cronico')dpScore+=1;
  if(patHistoryChecks.has('cancer'))dpScore+=2;
  if(patHistoryChecks.has('icc'))dpScore+=1;
  if(symptoms.has('emagrecimento'))dpScore+=1;
  dx.push({name:'Derrame pleural',cat:'Pulmonar',score:dpScore,
    clues:'MV diminuído com macicez à percussão, dispneia progressiva, emagrecimento se neoplásico',
    workup:['RX tórax (PA + Laurell)','USG tórax (quantificar e guiar punção)','Toracocentese diagnóstica (critérios de Light)','Análise líquido: pH, proteínas, LDH, glicose, celularidade, cultura','TC tórax se suspeita de derrame complicado']});

  // Anafilaxia
  let anaScore=0;
  if(symptoms.has('urticaria'))anaScore+=4;
  if(symptoms.has('disfagia'))anaScore+=3;
  if(symptoms.has('estridor_sint'))anaScore+=3;
  if(examFindings.has('angioedema'))anaScore+=4;
  if(examFindings.has('estridor'))anaScore+=3;
  if(examFindings.has('sibilos'))anaScore+=1;
  if(onset==='agudo')anaScore+=2;
  if(pasVal()!==null&&pasVal()<=90)anaScore+=2;
  dx.push({name:'Anafilaxia',cat:'Emergência',score:anaScore,
    clues:'Urticária, angioedema, broncoespasmo, hipotensão, início súbito após exposição',
    workup:['Adrenalina IM 0,3\u20130,5mg (1:1000) face anterolateral da coxa \u2014 REPETIR a cada 5\u201315min','Acesso venoso calibroso + SF 0,9% 1\u20132L','Anti-histamínico: Difenidramina 50mg IV','Corticoide: Metilprednisolona 125mg IV','Nebulização com Salbutamol se broncoespasmo','Monitorar no mínimo 6\u20138h (risco de reação bifásica)']});

  // --- OTHER ---
  // Anemia
  let anemiaScore=0;
  if(onset==='cronico')anemiaScore+=2;
  if(symptoms.has('tontura'))anemiaScore+=1;
  if(fcVal()!==null&&fcVal()>=100)anemiaScore+=1;
  if(symptoms.has('sudorese'))anemiaScore+=1;
  if(symptoms.has('sincope'))anemiaScore+=1;
  if(symptoms.has('emagrecimento'))anemiaScore+=1;
  dx.push({name:'Anemia grave',cat:'Outra',score:anemiaScore,
    clues:'Dispneia progressiva, palidez, taquicardia, história de sangramento, emagrecimento',
    workup:['Hemograma completo','Reticulócitos','Perfil de ferro, ferritina','Pesquisa de sangramento oculto','Tipagem sanguínea + prova cruzada se Hb muito baixa']});

  // Ansiedade / Hiperventilação
  let anxScore=0;
  if(symptoms.has('ansiedade'))anxScore+=3;
  if(symptoms.has('parestesias'))anxScore+=3;
  if(symptoms.has('tontura'))anxScore+=1;
  if(spo2Val()!==null&&spo2Val()>=97)anxScore+=1;
  if(frVal()!==null&&frVal()>=20&&spo2Val()!==null&&spo2Val()>=97)anxScore+=2;
  // Lower score if danger signs present
  if(examFindings.has('cianose'))anxScore-=3;
  if(spo2Val()!==null&&spo2Val()<=92)anxScore-=3;
  if(examFindings.has('uso_acessoria'))anxScore-=2;
  if(examFindings.has('tiragem'))anxScore-=2;
  if(symptoms.has('febre'))anxScore-=2;
  if(symptoms.has('dor_toracica'))anxScore-=1;
  dx.push({name:'Ansiedade / Hiperventilação',cat:'Outra',score:Math.max(0,anxScore),
    clues:'Parestesias, SpO\u2082 normal, sem achados ao exame, contexto emocional. DIAGNÓSTICO DE EXCLUSÃO.',
    workup:['Gasometria (alcalose respiratória)','Excluir causas orgânicas primeiro','ECG','D-dímero se fatores de risco para TEP','Hemograma']});

  // Acidose metabólica
  let acidScore=0;
  if(frVal()!==null&&frVal()>=24)acidScore+=1;
  if(frVal()!==null&&frVal()>=28&&!examFindings.has('sibilos')&&!examFindings.has('crepitacoes'))acidScore+=2;
  if(patHistoryChecks.has('dm'))acidScore+=2;
  if(patHistoryChecks.has('drc'))acidScore+=2;
  if(frVal()!==null&&frVal()>=24&&spo2Val()!==null&&spo2Val()>=95&&!examFindings.has('sibilos')&&!examFindings.has('crepitacoes')&&!examFindings.has('mv_diminuido'))acidScore+=1;
  dx.push({name:'Acidose metabólica (resp. compensatória)',cat:'Outra',score:acidScore,
    clues:'Respiração de Kussmaul, taquipneia sem achado pulmonar, DM (cetoacidose), insuficiência renal',
    workup:['Gasometria arterial','Eletrólitos + ânion gap','Glicemia','Função renal + ureia','Lactato','Cetonemia / cetonúria se DM']});

  // OVACE
  let ovaceScore=0;
  if(examFindings.has('estridor'))ovaceScore+=3;
  if(onset==='agudo')ovaceScore+=2;
  if(examFindings.has('mv_abolido'))ovaceScore+=2;
  if(examFindings.has('mv_diminuido'))ovaceScore+=1;
  if(symptoms.has('estridor_sint'))ovaceScore+=2;
  if(symptoms.has('disfagia'))ovaceScore+=2;
  if(severity==='incapaz')ovaceScore+=2;
  if(symptoms.has('febre'))ovaceScore-=2;
  if(examFindings.has('crepitacoes'))ovaceScore-=1;
  dx.push({name:'Obstrução de via aérea (OVACE)',cat:'Emergência',score:Math.max(0,ovaceScore),
    clues:'Início súbito durante alimentação, estridor, incapacidade de falar/tossir, sinal universal de engasgo',
    workup:['Se obstrução completa: Manobra de Heimlich (paciente consciente)','Laringoscopia direta se corpo estranho visível','Se inconsciente: RCP + laringoscopia','Broncoscopia para remoção se necessário','Cricotireoidostomia de emergência se via aérea não estabelecida']});

  // Sort by score descending
  dx.sort((a,b)=>b.score-a.score);
  return dx;
}

// =============================================
// WELLS SCORE
// =============================================
function getWells(){
  const items=[
    {key:'clinical_dvt',pts:3},
    {key:'pe_likely',pts:3},
    {key:'hr100',pts:1.5},
    {key:'immob_surg',pts:1.5},
    {key:'prior_pe_dvt',pts:1.5},
    {key:'hemoptysis',pts:1},
    {key:'cancer',pts:1},
  ];
  let total=0,allFilled=true;
  for(const it of items){
    let v=wells[it.key];
    if(v===null){
      if(it.key==='hr100'&&fcVal()!==null)v=fcVal()>=100?1:0;
      else if(it.key==='immob_surg'&&patHistoryChecks.size>0)v=patHistoryChecks.has('immob')?1:0;
      else if(it.key==='prior_pe_dvt'&&patHistoryChecks.size>0)v=patHistoryChecks.has('tvp_tep')?1:0;
      else if(it.key==='cancer'&&patHistoryChecks.size>0)v=patHistoryChecks.has('cancer')?1:0;
      else if(it.key==='hemoptysis')v=symptoms.has('hemoptise')?1:0;
      else if(it.key==='clinical_dvt')v=(symptoms.has('dor_panturrilha')||symptoms.has('edema_mmii'))?1:0;
    }
    if(v===null){allFilled=false}
    else{total+=v*it.pts}
  }
  if(!allFilled)return null;
  return total;
}

// =============================================
// CURB-65
// =============================================
function getCurb(){
  const items=['confusion','bun','rr30','bp','age65'];
  let total=0,allFilled=true;
  for(const k of items){
    let v=curb[k];
    if(v===null){
      if(k==='rr30'&&frVal()!==null)v=frVal()>=30?1:0;
      else if(k==='bp'&&pasVal()!==null&&padVal()!==null)v=(pasVal()<90||padVal()<=60)?1:0;
      else if(k==='bp'&&pasVal()!==null)v=pasVal()<90?1:0;
      else if(k==='age65'&&patHistory.age!==null)v=patHistory.age>=2?1:0;
    }
    if(v===null)allFilled=false;
    else total+=v;
  }
  if(!allFilled)return null;
  return total;
}

// =============================================
// qSOFA UI
// =============================================
function buildQSOFAUI(){
  let h='<p style="font-size:.75rem;color:var(--text-dim);margin-bottom:1rem">qSOFA (Quick Sequential Organ Failure Assessment) \u2014 Screening para sepse</p>';

  const qItems=[
    {label:'FR \u2265 22 irpm',auto:frVal()!==null,val:frVal()!==null?(frVal()>=22?1:0):null,autoTag:'Auto: SV'},
    {label:'PAS \u2264 100 mmHg',auto:pasVal()!==null,val:pasVal()!==null?(pasVal()<=100?1:0):null,autoTag:'Auto: SV'},
    {label:'Alteração do nível de consciência (Glasgow < 15)',auto:examFindings.has('alteracao_consciencia'),val:examFindings.has('alteracao_consciencia')?1:0,autoTag:'Auto: Exame'},
  ];

  let total=0,allFilled=true;
  for(const item of qItems){
    const val=item.val;
    if(val===null)allFilled=false;
    else total+=val;

    h+=`<div class="score-row"><div class="score-row-label"><span>${item.label}</span>${item.auto?`<span class="auto-tag">${item.autoTag}</span>`:''}</div>`;
    h+='<div class="score-options">';
    h+=`<div class="score-opt ${val===0?'picked':''}" style="cursor:default">Não<span class="pts">0</span></div>`;
    h+=`<div class="score-opt ${val===1?'picked':''}" style="cursor:default">Sim<span class="pts">1</span></div>`;
    h+='</div></div>';
  }

  if(allFilled){
    let sc,sl,sd;
    if(total>=2){sc='sr-high';sl='qSOFA Positivo';sd=`qSOFA ${total}/3 \u2014 Alto risco de desfecho desfavorável. Investigar disfunção orgânica (SOFA completo). Solicitar lactato sérico.`}
    else{sc='sr-low';sl='qSOFA Negativo';sd=`qSOFA ${total}/3 \u2014 Baixo risco. Continuar monitoramento.`}
    h+=`<div class="score-result ${sc}"><div class="score-num">${total}</div><div class="score-info"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    h+='<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Dados insuficientes</div><div class="score-detail">Preencha sinais vitais e exame físico para cálculo automático.</div></div></div>';
  }
  return h;
}

// =============================================
// STEP MINI-SUMMARY
// =============================================
function buildStepSummary(){
  const parts=[];
  if(onset!==null){
    const ol={'agudo':'Agudo','cronico':'Crônico','agudo-cronico':'Ag/Crônico'};
    parts.push(ol[onset]);
  }
  if(severity!==null){
    const sl={sentencas:'Sentenças',frases:'Frases',palavras:'Palavras',incapaz:'Incapaz'};
    parts.push(sl[severity]);
  }
  if(patHistory.sex)parts.push(patHistory.sex==='M'?'Masc':'Fem');
  if(patHistory.age!==null)parts.push(['<45','45-64','65-79','\u226580'][patHistory.age]+'a');
  if(symptoms.size>0)parts.push(symptoms.size+' sint.');
  if(spo2Val()!==null)parts.push('SpO\u2082 '+vitals.spo2+'%');
  if(frVal()!==null)parts.push('FR '+vitals.fr);
  if(fcVal()!==null)parts.push('FC '+vitals.fc);
  if(examFindings.size>0)parts.push(examFindings.size+' achados');

  if(parts.length===0)return '';
  return '<div class="step-summary">'+parts.map(p=>'<span>'+p+'</span>').join('')+'</div>';
}

// =============================================
// PROGRESS BAR
// =============================================
function progHTML(idx,allDone){
  let h='<div class="progress-bar">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done':i===idx?'active':'';h+=`<div class="progress-step ${c}"></div>`}
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done-label':i===idx?'active-label':'';h+=`<span class="${c}">${STEP_LABELS[i]}</span>`}
  h+='</div><div class="flow-connector"><div class="arrow"></div></div>';
  return h;
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  const prevFocused=document.activeElement;
  const prevId=prevFocused?prevFocused.id||prevFocused.getAttribute('data-vital'):'';
  const prevSelStart=prevFocused&&prevFocused.selectionStart!==undefined?prevFocused.selectionStart:null;

  if(currentStep===0)renderOnset();
  else if(currentStep===1)renderSeverity();
  else if(currentStep===2)renderSymptoms();
  else if(currentStep===3)renderVitals();
  else if(currentStep===4)renderExam();
  else renderResult();

  // Restore focus for vital sign inputs
  if(prevId&&currentStep===3){
    const el=document.querySelector(`[data-vital="${prevId}"]`)||document.getElementById(prevId);
    if(el){
      el.focus();
      if(prevSelStart!==null&&el.setSelectionRange){
        try{el.setSelectionRange(prevSelStart,prevSelStart)}catch(e){}
      }
    }
  }
}

  h+='<div style="display:flex;gap:.4rem">';
  for(const o of ageOpts)h+=`<button class="score-opt ${patHistory.age===o.v?'picked':''}" onclick="setPatH('age',${o.v})" style="flex:1">${o.l}</button>`;

  // Sex
  h+='<div class="option-group-label" style="margin-top:1rem">Sexo</div>';
  h+='<div style="display:flex;gap:.4rem">';

  h+=`<button class="score-opt ${patHistory.sex==='F'?'picked':''}" onclick="setPatH('sex','F')" style="flex:1">Feminino</button>`;
  h+='</div>';

  // Smoking
  h+='<div class="option-group-label" style="margin-top:1rem">Tabagismo</div>';
  h+='<div class="smoking-options">';
  const smokingOpts=[{v:'nao',l:'Não'},{v:'ativo',l:'Ativo'},{v:'ex',l:'Ex-tabagista'}];
  for(const o of smokingOpts){
    h+=`<button class="score-opt ${patHistory.smoking===o.v?'picked':''}" onclick="setPatH('smoking','${o.v}')" style="flex:1">${o.l}</button>`;
  }
  h+='</div>';

  // History
  h+='<div class="option-group-label" style="margin-top:1rem">Antecedentes (marque todos)</div>';
  for(const hf of HISTORY_FIELDS){
    const ck=patHistoryChecks.has(hf.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleHistCheck('${hf.id}')"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${hf.label}</span></button>`;
  }
  if(patHistoryChecks.size>0){
    h+=`<button class="clear-all-btn" onclick="clearAllHistChecks()">Limpar antecedentes (${patHistoryChecks.size})</button>`;
  }

  h+='</div><div class="nav-row">';
  const canNext=onset!==null&&patHistory.age!==null&&patHistory.sex!==null;
  h+=`<button class="nav-btn primary" ${canNext?'':'disabled'} onclick="next()">Próximo &rarr;</button>`;
  h+='</div>';
  if(!canNext){
    const missing=[];
    if(onset===null)missing.push('início');
    if(patHistory.age===null)missing.push('idade');
    if(patHistory.sex===null)missing.push('sexo');
    h+=`<div style="font-size:.7rem;color:var(--text-dim);text-align:center;margin-top:.5rem">Preencha: ${missing.join(', ')}</div>`;
  }
  h+='<div class="kb-hint">Navegue com <kbd>&rarr;</kbd> <kbd>&larr;</kbd></div>';
  h+='</div>';
  app.innerHTML=h;
}

    {v:'frases',icon:'\u{1F4AD}',label:'Fala em frases curtas',desc:'Moderada \u2014 interrompe para respirar',tag:'tag-pulmonary',tagLabel:'Moderada'},
    {v:'palavras',icon:'\u{1F6A8}',label:'Apenas palavras isoladas',desc:'Grave \u2014 esforço respiratório evidente',tag:'tag-cardiac',tagLabel:'Grave'},
    {v:'incapaz',icon:'\u{26D4}',label:'Incapaz de falar',desc:'Muito grave \u2014 IOT iminente',tag:'tag-cardiac',tagLabel:'Crítico'},

  h+='<div class="vital-input-group"><label>PAD (mmHg)';

  // Temp

  h+='<div class="vital-input-group"><label>Temperatura (\u00B0C)';
