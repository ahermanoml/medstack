<body>
<header>
  <a href="../falta-de-ar.html" class="back-link">&larr; Voltar</a>
  <h1>Avaliação de Falta de Ar</h1>
  <p>Dispneia no PS — Avaliação Estruturada</p>
  <div class="eval-timer"><span class="timer-dot"></span><span id="evalTimer">00:00</span></div>
</header>
<div class="container" id="app"></div>
<div class="disclaimer-bar">Ferramenta de apoio à decisão clínica. Não substitui o julgamento médico.</div>
<script>
// =============================================
// DATA
// =============================================
const STEP_LABELS=['Início','Gravidade','Sintomas','Sinais Vitais','Exame','Resultado'];
const TOTAL_STEPS=6;

// =============================================
// STATE
// =============================================
let currentStep=0;
const evalStartTime=new Date();

// Evaluation timer
setInterval(()=>{
  const el=document.getElementById('evalTimer');
  if(!el)return;
  const diff=Math.floor((new Date()-evalStartTime)/1000);
  const m=Math.floor(diff/60),s=diff%60;
  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
},1000);

// Step 0: Onset
let onset=null; // 'agudo','cronico','agudo-cronico'

// Step 1: Severity
let severity=null; // 'sentencas','frases','palavras','incapaz'

// Step 2: Associated symptoms (multi-select)
let symptoms=new Set();
const SYMPTOM_LIST=[
  {id:'dor_toracica',label:'Dor torácica',icon:'\u{1FAC1}',cat:'cardiac'},
  {id:'palpitacoes',label:'Palpitações',icon:'\u{1F493}',cat:'cardiac'},
  {id:'ortopneia',label:'Ortopneia (piora ao deitar)',icon:'\u{1F6CF}\u{FE0F}',cat:'cardiac'},
  {id:'dpn',label:'Dispneia paroxística noturna (DPN)',icon:'\u{1F319}',cat:'cardiac'},
  {id:'edema_mmii',label:'Edema de membros inferiores',icon:'\u{1F9B6}',cat:'cardiac'},
  {id:'febre',label:'Febre',icon:'\u{1F321}\u{FE0F}',cat:'pulmonary'},
  {id:'tosse',label:'Tosse',icon:'\u{1F912}',cat:'pulmonary'},
  {id:'expectoracao',label:'Expectoração produtiva',icon:'\u{1F4A7}',cat:'pulmonary'},
  {id:'hemoptise',label:'Hemoptise',icon:'\u{1FA78}',cat:'pulmonary'},
  {id:'sibilancia',label:'Sibilância / chiado',icon:'\u{1F4A8}',cat:'pulmonary'},
  {id:'dor_pleuritica',label:'Dor pleurítica (ventilatório-dependente)',icon:'\u{1F4CC}',cat:'pulmonary'},
  {id:'dor_panturrilha',label:'Dor / edema unilateral em panturrilha',icon:'\u{1F9B5}',cat:'pulmonary'},
  {id:'tontura',label:'Tontura / pré-síncope',icon:'\u{1F4AB}',cat:'other'},

// =============================================
// HELPERS
// =============================================
function vNum(v){const n=parseFloat(v);return isNaN(n)?null:n}
function spo2Val(){return vNum(vitals.spo2)}
function frVal(){return vNum(vitals.fr)}
function fcVal(){return vNum(vitals.fc)}
function pasVal(){return vNum(vitals.pas)}
function padVal(){return vNum(vitals.pad)}
function tempVal(){return vNum(vitals.temp)}

function spo2Status(){const v=spo2Val();if(v===null)return null;if(v<=88)return 'danger';if(v<=92)return 'warning';return 'normal'}
function frStatus(){const v=frVal();if(v===null)return null;if(v>=30)return 'danger';if(v>=24)return 'warning';if(v<=8)return 'danger';return 'normal'}
function fcStatus(){const v=fcVal();if(v===null)return null;if(v>=130)return 'danger';if(v>=100)return 'warning';if(v<=50)return 'warning';return 'normal'}
function pasStatus(){const v=pasVal();if(v===null)return null;if(v<=90)return 'danger';if(v>=180)return 'warning';return 'normal'}
function padStatus(){const v=padVal();if(v===null)return null;if(v<=50)return 'danger';if(v>=110)return 'warning';return 'normal'}
function tempStatus(){const v=tempVal();if(v===null)return null;if(v>=39.5)return 'danger';if(v>=38)return 'warning';if(v<=35)return 'danger';return 'normal'}

// FC status label (fixes bradicardia vs taquicardia)
function fcStatusLabel(){
  const v=fcVal();if(v===null)return '';
  if(v>=130)return 'Crítico';
  if(v>=100)return 'Taquicardia';
  if(v<=50)return 'Bradicardia';
  return 'Normal';
}

function severityScore(){
  if(severity==='incapaz')return 4;
  if(severity==='palavras')return 3;
  if(severity==='frases')return 2;
  if(severity==='sentencas')return 1;
  return 0;
}

function vitalSeverity(){
  let score=0;
  const s=spo2Val(),f=frVal(),fc=fcVal(),p=pasVal(),t=tempVal();
  if(s!==null){if(s<=88)score+=3;else if(s<=92)score+=2;else if(s<=95)score+=1}
  if(f!==null){if(f>=30)score+=3;else if(f>=24)score+=2;else if(f>=20)score+=1}
  if(fc!==null){if(fc>=130)score+=2;else if(fc>=100)score+=1;else if(fc<=50)score+=1}
  if(p!==null&&p<=90)score+=2;
  if(t!==null){if(t>=39.5)score+=1;else if(t<=35)score+=2}
  return score;
}

function examSeverity(){
  let score=0;
  if(examFindings.has('estridor'))score+=3;
  if(examFindings.has('desvio_traqueia'))score+=3;
  if(examFindings.has('mv_abolido'))score+=3;
  if(examFindings.has('cianose'))score+=3;
  if(examFindings.has('angioedema'))score+=3;
  if(examFindings.has('enfisema_subcut'))score+=2;
  if(examFindings.has('uso_acessoria'))score+=2;
  if(examFindings.has('tiragem'))score+=2;
  if(examFindings.has('alteracao_consciencia'))score+=3;
  if(examFindings.has('turgencia_jugular'))score+=1;
  if(examFindings.has('crepitacoes'))score+=1;
  if(examFindings.has('sibilos'))score+=1;
  if(examFindings.has('edema_periferico'))score+=1;
  if(examFindings.has('b3'))score+=1;
  if(examFindings.has('hepatomegalia'))score+=1;
  if(examFindings.has('mv_diminuido'))score+=1;
  if(examFindings.has('macicez'))score+=1;
  if(examFindings.has('refluxo_hepatojugular'))score+=1;
  return score;
}

function totalRiskScore(){
  return severityScore()+vitalSeverity()+examSeverity();
}

function riskLevel(){
  const s=totalRiskScore();
  if(s>=10)return {level:'critico',label:'Crítico',cls:'risk-critical',icon:'\u{1F6A8}'};
  if(s>=6)return {level:'alto',label:'Alto Risco',cls:'risk-high',icon:'\u{26A0}\u{FE0F}'};
  if(s>=3)return {level:'moderado',label:'Risco Moderado',cls:'risk-moderate',icon:'\u{1F50D}'};
  return {level:'baixo',label:'Baixo Risco',cls:'risk-low',icon:'\u{2705}'};
}

// qSOFA quick calculation
function getQSOFA(){
  let score=0;
  if(frVal()!==null&&frVal()>=22)score++;
  if(pasVal()!==null&&pasVal()<=100)score++;
  if(examFindings.has('alteracao_consciencia'))score++;
  return score;
}

// Red flags detection
function getRedFlags(){
  const flags=[];
  if(examFindings.has('desvio_traqueia'))flags.push('Desvio de traqueia — Pneumotórax hipertensivo?');
  if(examFindings.has('estridor'))flags.push('Estridor — Obstrução de via aérea superior');
  if(examFindings.has('angioedema'))flags.push('Angioedema/edema de glote — Via aérea ameaçada');
  if(spo2Val()!==null&&spo2Val()<=85)flags.push('SpO\u2082 \u2264 85% — Hipoxemia grave');
  if(severity==='incapaz')flags.push('Incapaz de falar — Insuficiência respiratória iminente');
  if(examFindings.has('cianose'))flags.push('Cianose — Hipoxemia tecidual');
  if(pasVal()!==null&&pasVal()<=80)flags.push('PAS \u2264 80 mmHg — Choque');
  if(examFindings.has('alteracao_consciencia'))flags.push('Alteração de consciência — Possível falência orgânica');
  if(fcVal()!==null&&fcVal()>=150)flags.push('FC \u2265 150 bpm — Taquiarritmia?');
  if(fcVal()!==null&&fcVal()<=40)flags.push('FC \u2264 40 bpm — Bradicardia grave');
  if(frVal()!==null&&frVal()>=35)flags.push('FR \u2265 35 irpm — Fadiga respiratória iminente');
  if(tempVal()!==null&&tempVal()<=35)flags.push('Temperatura \u2264 35\u00B0C — Hipotermia');
  return flags;
}

// =============================================
// DIFFERENTIAL DIAGNOSIS ENGINE
// =============================================
function buildDifferentials(){
  const dx=[];

  // --- CARDIAC ---
  // ICC descompensada
  let iccScore=0;
  if(symptoms.has('ortopneia'))iccScore+=3;
  if(symptoms.has('dpn'))iccScore+=3;
  if(symptoms.has('edema_mmii'))iccScore+=2;
  if(examFindings.has('turgencia_jugular'))iccScore+=3;
  if(examFindings.has('crepitacoes'))iccScore+=2;
  if(examFindings.has('b3'))iccScore+=3;
  if(examFindings.has('edema_periferico'))iccScore+=2;
  if(examFindings.has('hepatomegalia'))iccScore+=2;
  if(examFindings.has('refluxo_hepatojugular'))iccScore+=2;
  if(patHistoryChecks.has('icc'))iccScore+=3;
  if(onset==='agudo-cronico')iccScore+=2;
  if(onset==='cronico')iccScore+=1;
  dx.push({name:'ICC descompensada',cat:'Cardíaca',score:iccScore,
    clues:'Ortopneia, DPN, TJP, B3, edema periférico, crepitações bibasais',
    workup:['BNP / NT-proBNP','RX tórax (congestão, cardiomegalia)','ECG 12 derivações','Ecocardiograma à beira-leito','Função renal e eletrólitos','Balanço hídrico rigoroso']});

  // Edema Agudo de Pulmão (EAP)
  let eapScore=0;
  if(onset==='agudo')eapScore+=2;
  if(symptoms.has('ortopneia'))eapScore+=2;
  if(examFindings.has('crepitacoes'))eapScore+=3;
  if(spo2Val()!==null&&spo2Val()<=90)eapScore+=2;
  if(examFindings.has('uso_acessoria'))eapScore+=1;
  if(severity==='incapaz'||severity==='palavras')eapScore+=2;
  if(patHistoryChecks.has('icc'))eapScore+=2;
  if(pasVal()!==null&&pasVal()>=180)eapScore+=2;
  dx.push({name:'Edema agudo de pulmão (EAP)',cat:'Cardíaca',score:eapScore,
    clues:'Início agudo, crepitações difusas, ortopneia intensa, expectoração rósea, hipertensão',
    workup:['RX tórax à beira-leito','BNP / NT-proBNP','ECG 12 derivações (SCA?)','Gasometria arterial','VNI (CPAP 10 cmH\u2082O) se consciente','Furosemida IV + Nitroglicerina SL/IV']});

  // SCA
  let scaScore=0;
  if(symptoms.has('dor_toracica'))scaScore+=4;
  if(symptoms.has('palpitacoes'))scaScore+=1;
  const fc=fcVal();if(fc!==null&&fc>=100)scaScore+=1;
  if(patHistory.age>=2)scaScore+=1; // age index >=2 means >=65 anos
  if(patHistoryChecks.has('dm'))scaScore+=1;
  if(patHistory.smoking==='ativo')scaScore+=1;
  dx.push({name:'Síndrome coronariana aguda (SCA)',cat:'Cardíaca',score:scaScore,
    clues:'Dor torácica associada, fatores de risco cardiovascular, ECG com alterações',
    workup:['ECG 12 derivações (imediato)','Troponina de alta sensibilidade seriada (0h/1h ou 0h/3h)','RX tórax','AAS 200mg VO (se não contraindicado)','Ecocardiograma se indicado']});

  // Tamponamento
  let tampScore=0;
  if(examFindings.has('turgencia_jugular'))tampScore+=2;
  if(pasVal()!==null&&pasVal()<=90)tampScore+=2;
  if(fcVal()!==null&&fcVal()>=100)tampScore+=1;
  if(symptoms.has('dor_toracica'))tampScore+=1;
  dx.push({name:'Tamponamento cardíaco',cat:'Cardíaca',score:tampScore,
    clues:'Tríade de Beck: hipotensão, TJP, bulhas abafadas. Pulso paradoxal.',
    workup:['Ecocardiograma à beira-leito (FAST/POCUS)','ECG (baixa voltagem, alternância elétrica)','RX tórax','Pericardiocentese se instabilidade']});

  // --- PULMONARY ---
  // TEP
  let tepScore=0;
  if(onset==='agudo')tepScore+=2;
  if(symptoms.has('dor_pleuritica'))tepScore+=2;
  if(symptoms.has('hemoptise'))tepScore+=2;
  if(symptoms.has('dor_panturrilha'))tepScore+=3;
  if(fcVal()!==null&&fcVal()>=100)tepScore+=1;
  if(spo2Val()!==null&&spo2Val()<=92)tepScore+=1;
  if(patHistoryChecks.has('immob'))tepScore+=2;
  if(patHistoryChecks.has('cancer'))tepScore+=2;
  if(patHistoryChecks.has('tvp_tep'))tepScore+=2;
  dx.push({name:'Tromboembolismo pulmonar (TEP)',cat:'Pulmonar',score:tepScore,
    clues:'Início súbito, dor pleurítica, taquicardia, fatores de risco trombótico, TVP',
    workup:['D-dímero (se baixa/moderada probabilidade)','Angio-TC de tórax','ECG (S1Q3T3, taquicardia sinusal, BRD novo)','Ecocardiograma (sobrecarga de VD)','USG MMII (TVP)','Se instável: trombolítico (Alteplase 100mg) ou embolectomia']});

  // Pneumonia
  let pnmScore=0;
  if(symptoms.has('febre'))pnmScore+=3;
  if(symptoms.has('tosse'))pnmScore+=2;
  if(symptoms.has('expectoracao'))pnmScore+=2;
  if(examFindings.has('crepitacoes'))pnmScore+=2;
  if(tempVal()!==null&&tempVal()>=38)pnmScore+=2;
  if(patHistoryChecks.has('hiv'))pnmScore+=1;
  dx.push({name:'Pneumonia',cat:'Pulmonar',score:pnmScore,
    clues:'Febre, tosse produtiva, crepitações localizadas, leucocitose',
    workup:['RX tórax (PA + perfil)','Hemograma, PCR, procalcitonina','Hemoculturas (2 amostras)','Gasometria arterial se SpO\u2082 \u2264 92%','CURB-65 para estratificação','Ureia e creatinina']});

  // DPOC exacerbado
  let dpocScore=0;
  if(patHistoryChecks.has('dpoc'))dpocScore+=4;
  if(symptoms.has('tosse'))dpocScore+=1;
  if(symptoms.has('expectoracao'))dpocScore+=2;
  if(symptoms.has('sibilancia'))dpocScore+=2;
  if(examFindings.has('sibilos'))dpocScore+=2;
  if(onset==='agudo-cronico')dpocScore+=2;
  if(patHistory.smoking==='ativo'||patHistory.smoking==='ex')dpocScore+=1;
  dx.push({name:'DPOC exacerbado',cat:'Pulmonar',score:dpocScore,
    clues:'História de DPOC/tabagismo, sibilos, expectoração purulenta, piora progressiva',
    workup:['RX tórax (excluir PNM, PTX)','Gasometria arterial','Hemograma, PCR','VNI (BiPAP) se acidose respiratória (pH < 7,35)','Broncodilatador inalatório (Salbutamol + Ipratrópio)','Corticoide sistêmico (Prednisona 40mg ou Metilprednisolona IV)']});

  // Asma / crise asmática
  let asmaScore=0;
  if(patHistoryChecks.has('asthma'))asmaScore+=4;
  if(symptoms.has('sibilancia'))asmaScore+=3;
  if(examFindings.has('sibilos'))asmaScore+=3;
  if(onset==='agudo')asmaScore+=1;
  if(examFindings.has('uso_acessoria'))asmaScore+=1;
  dx.push({name:'Crise asmática',cat:'Pulmonar',score:asmaScore,
    clues:'História de asma, sibilos difusos, dispneia com sibilância, resposta a broncodilatador',
    workup:['Peak flow (se possível)','RX tórax (excluir complicações)','Gasometria se crise grave','SpO\u2082 seriada','Salbutamol 400–800 mcg inalatório (4–8 jatos) a cada 20min','Ipratrópio 40–80 mcg associado','Corticoide: Prednisolona 40–60mg VO ou Metilprednisolona 40–80mg IV']});

  // Pneumotórax
  let ptxScore=0;
  if(onset==='agudo')ptxScore+=2;
  if(examFindings.has('mv_abolido'))ptxScore+=4;
  if(examFindings.has('mv_diminuido'))ptxScore+=2;
  if(examFindings.has('enfisema_subcut'))ptxScore+=3;
  if(examFindings.has('desvio_traqueia'))ptxScore+=4;
  if(symptoms.has('dor_pleuritica'))ptxScore+=2;
  dx.push({name:'Pneumotórax',cat:'Pulmonar',score:ptxScore,
    clues:'Início súbito, MV abolido/diminuído unilateral, desvio de traqueia (hipertensivo)',
    workup:['RX tórax','USG pulmonar (point-of-care: ausência de deslizamento pleural)','TC tórax se dúvida','Se hipertensivo: toracocentese descompressiva imediata (2\u00BA EIC linha hemiclavicular)','Drenagem tórax em selo d\'água']});

  // Derrame Pleural
  let dpScore=0;
  if(examFindings.has('mv_diminuido'))dpScore+=2;
  if(examFindings.has('macicez'))dpScore+=3;
  if(onset==='cronico')dpScore+=1;
  if(onset==='agudo-cronico')dpScore+=1;
  if(patHistoryChecks.has('cancer'))dpScore+=2;
  if(patHistoryChecks.has('icc'))dpScore+=1;
  dx.push({name:'Derrame pleural',cat:'Pulmonar',score:dpScore,
    clues:'MV diminuído com macicez à percussão, dispneia progressiva',
    workup:['RX tórax (PA + Laurell)','USG tórax (quantificar e guiar punção)','Toracocentese diagnóstica (critérios de Light)','Análise líquido: pH, proteínas, LDH, glicose, celularidade, cultura','TC tórax se suspeita de derrame complicado']});

  // Anafilaxia
  let anaScore=0;
  if(symptoms.has('urticaria'))anaScore+=4;
  if(symptoms.has('disfagia'))anaScore+=3;
  if(symptoms.has('estridor_sint'))anaScore+=3;
  if(examFindings.has('angioedema'))anaScore+=4;
  if(examFindings.has('estridor'))anaScore+=3;
  if(examFindings.has('sibilos'))anaScore+=1;
  if(onset==='agudo')anaScore+=2;
  if(pasVal()!==null&&pasVal()<=90)anaScore+=2;
  dx.push({name:'Anafilaxia',cat:'Emergência',score:anaScore,
    clues:'Urticária, angioedema, broncoespasmo, hipotensão, início súbito após exposição',
    workup:['Adrenalina IM 0,3–0,5mg (1:1000) face anterolateral da coxa — REPETIR a cada 5–15min','Acesso venoso calibroso + SF 0,9% 1–2L','Anti-histamínico: Difenidramina 50mg IV','Corticoide: Metilprednisolona 125mg IV','Nebulização com Salbutamol se broncoespasmo','Monitorar no mínimo 6–8h (risco de reação bifásica)']});

  // --- OTHER ---
  // Anemia
  let anemiaScore=0;
  if(onset==='cronico')anemiaScore+=2;
  if(symptoms.has('tontura'))anemiaScore+=1;
  if(fcVal()!==null&&fcVal()>=100)anemiaScore+=1;
  dx.push({name:'Anemia grave',cat:'Outra',score:anemiaScore,
    clues:'Dispneia progressiva, palidez, taquicardia, história de sangramento',
    workup:['Hemograma completo','Reticulócitos','Perfil de ferro, ferritina','Pesquisa de sangramento oculto','Tipagem sanguínea + prova cruzada se Hb muito baixa']});

  // Ansiedade / Hiperventilação
  let anxScore=0;
  if(symptoms.has('ansiedade'))anxScore+=3;
  if(symptoms.has('parestesias'))anxScore+=3;
  if(symptoms.has('tontura'))anxScore+=1;
  if(spo2Val()!==null&&spo2Val()>=97)anxScore+=1;
  if(frVal()!==null&&frVal()>=20&&spo2Val()!==null&&spo2Val()>=97)anxScore+=2;
  // Lower score if danger signs present
  if(examFindings.has('cianose'))anxScore-=3;
  if(spo2Val()!==null&&spo2Val()<=92)anxScore-=3;
  if(examFindings.has('uso_acessoria'))anxScore-=2;
  dx.push({name:'Ansiedade / Hiperventilação',cat:'Outra',score:Math.max(0,anxScore),
    clues:'Parestesias, SpO\u2082 normal, sem achados ao exame, contexto emocional. DIAGNÓSTICO DE EXCLUSÃO.',
    workup:['Gasometria (alcalose respiratória)','Excluir causas orgânicas primeiro','ECG','D-dímero se fatores de risco para TEP','Hemograma']});

  // Acidose metabólica
  let acidScore=0;
  if(frVal()!==null&&frVal()>=24)acidScore+=1;
  if(frVal()!==null&&frVal()>=28&&!examFindings.has('sibilos')&&!examFindings.has('crepitacoes'))acidScore+=2;
  if(patHistoryChecks.has('dm'))acidScore+=2;
  if(patHistoryChecks.has('drc'))acidScore+=2;
  dx.push({name:'Acidose metabólica (resp. compensatória)',cat:'Outra',score:acidScore,
    clues:'Respiração de Kussmaul, taquipneia sem achado pulmonar, DM (cetoacidose), insuficiência renal',
    workup:['Gasometria arterial','Eletrólitos + ânion gap','Glicemia','Função renal + ureia','Lactato','Cetonemia / cetonúria se DM']});

  // Sort by score descending
  dx.sort((a,b)=>b.score-a.score);
  return dx;
}

function getWells(){
  const items=[
    {key:'clinical_dvt',pts:3},
    {key:'pe_likely',pts:3},
    {key:'hr100',pts:1.5},
    {key:'immob_surg',pts:1.5},
    {key:'prior_pe_dvt',pts:1.5},
    {key:'hemoptysis',pts:1},
    {key:'cancer',pts:1},
  ];
  let total=0,allFilled=true;
  for(const it of items){
    let v=wells[it.key];
    if(v===null){
      if(it.key==='hr100'&&fcVal()!==null)v=fcVal()>=100?1:0;
      else if(it.key==='immob_surg'&&patHistoryChecks.size>0)v=patHistoryChecks.has('immob')?1:0;
      else if(it.key==='prior_pe_dvt'&&patHistoryChecks.size>0)v=patHistoryChecks.has('tvp_tep')?1:0;
      else if(it.key==='cancer'&&patHistoryChecks.size>0)v=patHistoryChecks.has('cancer')?1:0;
      else if(it.key==='hemoptysis')v=symptoms.has('hemoptise')?1:0;
      else if(it.key==='clinical_dvt')v=symptoms.has('dor_panturrilha')?1:0;
    }
    if(v===null){allFilled=false}
    else{total+=v*it.pts}
  }
  if(!allFilled)return null;
  return total;
}

// =============================================
// CURB-65
// =============================================
function getCurb(){
  const items=['confusion','bun','rr30','bp','age65'];
  let total=0,allFilled=true;
  for(const k of items){
    let v=curb[k];
    if(v===null){
      if(k==='rr30'&&frVal()!==null)v=frVal()>=30?1:0;
      else if(k==='bp'&&pasVal()!==null&&padVal()!==null)v=(pasVal()<90||padVal()<=60)?1:0;
      else if(k==='bp'&&pasVal()!==null)v=pasVal()<90?1:0;
      else if(k==='age65'&&patHistory.age!==null)v=patHistory.age>=2?1:0;
    }
    if(v===null)allFilled=false;
    else total+=v;
  }
  if(!allFilled)return null;
  return total;
}

// =============================================
// qSOFA
// =============================================
function buildQSOFAUI(){
  let h='<p style="font-size:.75rem;color:#64748b;margin-bottom:1rem">qSOFA (Quick Sequential Organ Failure Assessment) — Screening para sepse</p>';

  const qItems=[
    {label:'FR \u2265 22 irpm',auto:frVal()!==null,val:frVal()!==null?(frVal()>=22?1:0):null,autoTag:'Auto: SV'},
    {label:'PAS \u2264 100 mmHg',auto:pasVal()!==null,val:pasVal()!==null?(pasVal()<=100?1:0):null,autoTag:'Auto: SV'},
    {label:'Alteração do nível de consciência (Glasgow < 15)',auto:examFindings.has('alteracao_consciencia'),val:examFindings.has('alteracao_consciencia')?1:0,autoTag:'Auto: Exame'},
  ];

  let total=0,allFilled=true;
  for(const item of qItems){
    const val=item.val;
    if(val===null)allFilled=false;
    else total+=val;

    h+=`<div class="score-row"><div class="score-row-label"><span>${item.label}</span>${item.auto?`<span class="auto-tag">${item.autoTag}</span>`:''}</div>`;
    h+='<div class="score-options">';
    h+=`<div class="score-opt ${val===0?'picked':''}" style="cursor:default">Não<span class="pts">0</span></div>`;
    h+=`<div class="score-opt ${val===1?'picked':''}" style="cursor:default">Sim<span class="pts">1</span></div>`;
    h+='</div></div>';
  }

  if(allFilled){
    let sc,sl,sd;
    if(total>=2){sc='sr-high';sl='qSOFA Positivo';sd=`qSOFA ${total}/3 — Alto risco de desfecho desfavorável. Investigar disfunção orgânica (SOFA completo).`}
    else{sc='sr-low';sl='qSOFA Negativo';sd=`qSOFA ${total}/3 — Baixo risco. Continuar monitoramento.`}
    h+=`<div class="score-result ${sc}"><div class="score-num">${total}</div><div class="score-info"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    h+='<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Dados insuficientes</div><div class="score-detail">Preencha sinais vitais e exame físico para cálculo automático.</div></div></div>';
  }
  return h;
}

// =============================================
// PROGRESS BAR
// =============================================
function progHTML(idx,allDone){
  let h='<div class="progress-bar">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done':i===idx?'active':'';h+=`<div class="progress-step ${c}"></div>`}
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done-label':i===idx?'active-label':'';h+=`<span class="${c}">${STEP_LABELS[i]}</span>`}
  h+='</div><div class="flow-connector"><div class="arrow"></div></div>';
  return h;
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  const prevFocused=document.activeElement;
  const prevId=prevFocused?prevFocused.id||prevFocused.getAttribute('data-vital'):'';
  const prevSelStart=prevFocused&&prevFocused.selectionStart!==undefined?prevFocused.selectionStart:null;

  if(currentStep===0)renderOnset();
  else if(currentStep===1)renderSeverity();
  else if(currentStep===2)renderSymptoms();
  else if(currentStep===3)renderVitals();
  else if(currentStep===4)renderExam();
  else renderResult();

  // Restore focus for vital sign inputs
  if(prevId&&currentStep===3){
    const el=document.querySelector(`[data-vital="${prevId}"]`)||document.getElementById(prevId);
    if(el){
      el.focus();
      if(prevSelStart!==null&&el.setSelectionRange){
        try{el.setSelectionRange(prevSelStart,prevSelStart)}catch(e){}
      }
    }
  }
}

  const risk=riskLevel();
  const dx=buildDifferentials();
  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  // Red flags
  const flags=getRedFlags();
  if(flags.length>0){
    h+='<div class="red-flags-banner"><h4>\u{1F6A8} RED FLAGS IDENTIFICADOS</h4><ul>';
    for(const f of flags)h+=`<li>${f}</li>`;
    h+='</ul></div>';
  }

  // Badge
  h+=`<div class="result-badge ${risk.cls}">${risk.icon}</div>`;
  h+=`<div class="result-title">${risk.label}</div>`;
  const sevLabel={sentencas:'Sentenças',frases:'Frases curtas',palavras:'Palavras',incapaz:'Incapaz de falar'};
  const onsetLabel={'agudo':'Agudo','cronico':'Crônico','agudo-cronico':'Agudo sobre crônico'};
  h+=`<div class="result-desc">${onsetLabel[onset]} | ${sevLabel[severity]} | ${patHistory.sex==='M'?'Masc':'Fem'}, ${['< 45','45\u201364','65\u201379','\u226580'][patHistory.age]} anos</div>`;

  // Quick vital summary line
  const vParts=[];
  if(spo2Val()!==null)vParts.push(`SpO\u2082 ${vitals.spo2}%`);
  if(frVal()!==null)vParts.push(`FR ${vitals.fr}`);
  if(fcVal()!==null)vParts.push(`FC ${vitals.fc}`);
  if(pasVal()!==null)vParts.push(`PA ${vitals.pas}/${vitals.pad||'?'}`);
  if(tempVal()!==null)vParts.push(`T ${vitals.temp}\u00B0C`);
  if(vParts.length>0)h+=`<div style="font-size:.85rem;color:#94a3b8;margin-bottom:1rem">${vParts.join(' \u2022 ')}</div>`;

  // qSOFA in results
  const qs=getQSOFA();
  if(qs>=2){
    h+=`<div class="info-banner" style="border-color:#ef4444;color:#fca5a5;background:#450a0a;margin-bottom:1rem">\u{1F6A8} <strong>qSOFA ${qs}/3</strong> — Considerar sepse. Solicitar lactato, hemoculturas, iniciar antibioticoterapia empírica precoce.</div>`;
  }

  // ---- COLLAPSIBLE: Resumo ----
  h+=collapsible('resumo','Resumo da avaliação',()=>{
    let s='';
    s+=`<div class="summary-row"><span class="criteria">Início</span><span class="value">${onsetLabel[onset]}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Gravidade (fala)</span><span class="value">${sevLabel[severity]}</span></div>`;

    const sympLabels=SYMPTOM_LIST.filter(s=>symptoms.has(s.id)).map(s=>s.label);
    s+=`<div class="summary-row"><span class="criteria">Sintomas</span><span class="value" style="text-align:right;max-width:60%">${sympLabels.length>0?sympLabels.join(', '):'Nenhum'}</span></div>`;

    if(spo2Val()!==null)s+=`<div class="summary-row"><span class="criteria">SpO\u2082</span><span class="value"><span class="dot dot-${spo2Status()==='danger'?'red':spo2Status()==='warning'?'yellow':'green'}"></span>${vitals.spo2}%</span></div>`;
    if(frVal()!==null)s+=`<div class="summary-row"><span class="criteria">FR</span><span class="value"><span class="dot dot-${frStatus()==='danger'?'red':frStatus()==='warning'?'yellow':'green'}"></span>${vitals.fr} irpm</span></div>`;
    if(fcVal()!==null)s+=`<div class="summary-row"><span class="criteria">FC</span><span class="value"><span class="dot dot-${fcStatus()==='danger'?'red':fcStatus()==='warning'?'yellow':'green'}"></span>${vitals.fc} bpm</span></div>`;
    if(pasVal()!==null)s+=`<div class="summary-row"><span class="criteria">PA</span><span class="value"><span class="dot dot-${pasStatus()==='danger'?'red':pasStatus()==='warning'?'yellow':'green'}"></span>${vitals.pas}/${vitals.pad||'?'} mmHg</span></div>`;
    if(tempVal()!==null)s+=`<div class="summary-row"><span class="criteria">Temp</span><span class="value"><span class="dot dot-${tempStatus()==='danger'?'red':tempStatus()==='warning'?'yellow':'green'}"></span>${vitals.temp}\u00B0C</span></div>`;

    const examLabels=EXAM_LIST.filter(e=>examFindings.has(e.id)).map(e=>e.label);
    s+=`<div class="summary-row"><span class="criteria">Exame físico</span><span class="value" style="text-align:right;max-width:60%">${examLabels.length>0?examLabels.join(', '):'Sem achados'}</span></div>`;

    const histLabels=HISTORY_FIELDS.filter(h=>patHistoryChecks.has(h.id)).map(h=>h.label);
    if(patHistory.smoking&&patHistory.smoking!=='nao')histLabels.push('Tabagismo '+(patHistory.smoking==='ativo'?'ativo':'prévio'));
    s+=`<div class="summary-row"><span class="criteria">Antecedentes</span><span class="value" style="text-align:right;max-width:60%">${histLabels.length>0?histLabels.join(', '):'Nenhum'}</span></div>`;

    return s;
  });

  // ---- COLLAPSIBLE: Diagnóstico Diferencial ----
  h+=collapsible('diag','Diagnóstico diferencial',()=>{
    let s='';
    for(let i=0;i<dx.length;i++){
      const d=dx[i];
      if(d.score===0&&i>=3)continue;
      const isPrimary=i===0&&d.score>0;
      const isSecondary=i>0&&d.score>0;
      let probCls='prob-low';
      if(d.score>=6)probCls='prob-high';
      else if(d.score>=3)probCls='prob-mod';

      s+=`<div class="dx-card ${isPrimary?'primary-dx':isSecondary?'secondary-dx':''}">`;
      s+=`<div class="dx-category">${d.cat}${isPrimary?' \u2014 Principal suspeita':''}</div>`;
      s+=`<div class="dx-header"><span class="dx-name">${d.name}</span>`;
      if(d.score>0)s+=`<span class="dx-prob ${probCls}">${d.score>0?'+'+d.score:'\u2013'}</span>`;
      s+=`</div>`;
      s+=`<div class="dx-clues">${d.clues}</div>`;

      // Expandable workup per diagnosis
      const wKey='dx_'+i;
      const wOpen=dxWorkupOpen[wKey];
      if(d.score>0){
        s+=`<div class="dx-workup-toggle" onclick="toggleDxWorkup('${wKey}')">${wOpen?'\u25B2 Ocultar':'+ Ver propedêutica'}</div>`;
        if(wOpen){
          s+='<ul class="dx-workup-list">';
          for(const w of d.workup)s+=`<li>${w}</li>`;
          s+='</ul>';
        }
      }

      s+=`</div>`;
    }
    return s;
  });

  // ---- COLLAPSIBLE: Conduta Sugerida ----
  h+=buildConduta(dx);

  // ---- COLLAPSIBLE: Scores ----
  h+=collapsible('scores','Scores de estratificação',()=>{
    let s='';
    s+='<div class="score-tabs">';
    s+=`<button class="score-tab ${activeScoreTab==='wells'?'active':''}" onclick="switchTab('wells')">Wells (TEP)</button>`;
    s+=`<button class="score-tab ${activeScoreTab==='curb65'?'active':''}" onclick="switchTab('curb65')">CURB-65</button>`;
    s+=`<button class="score-tab ${activeScoreTab==='qsofa'?'active':''}" onclick="switchTab('qsofa')">qSOFA</button>`;
    s+='</div>';
    if(activeScoreTab==='wells')s+=buildWellsUI();
    else if(activeScoreTab==='curb65')s+=buildCurb65UI();
    else s+=buildQSOFAUI();
    return s;
  });

  // ---- COLLAPSIBLE: Note ----
  h+=collapsible('note','Nota para prontuário',()=>buildNoteContent(dx));

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">&larr; Voltar</button>';
  h+='<button class="nav-btn primary" onclick="restart()">Nova Avaliação</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// CONDUTA (based on differentials)
// =============================================
function buildConduta(dx){
  const risk=riskLevel();
  let cls,title,items=[];

  if(risk.level==='critico'){
    cls='alta-prob';title='Crítico \u2014 Intervenção imediata';
    items.push(['\u{1F6A8}','MOV: Monitor multiparamétrico + Oximetria contínua',[]]);
    items.push(['\u{1FA7A}','O\u2082 suplementar: Máscara não-reinalante 15L/min ou VNI',[]]);
    items.push(['\u{26A1}','Acesso venoso periférico calibroso (2 acessos se choque)',[]]);
    items.push(['\u{1F489}','Gasometria arterial AGORA',[]]);
    items.push(['\u{1F4CB}','RX tórax à beira-leito / USG point-of-care (BLUE protocol)',[]]);
    items.push(['\u{26A1}','ECG 12 derivações imediato',[]]);
    items.push(['\u{1FA7A}','Avaliar necessidade de IOT (preparar sequência rápida)',['Ketamina 1–2mg/kg + Succinilcolina 1–1,5mg/kg','Alternativa: Fentanil + Midazolam + Rocurônio']]);
  } else if(risk.level==='alto'){
    cls='alta-prob';title='Alto risco \u2014 Avaliação urgente';
    items.push(['\u{1F6A8}','MOV: Monitor, Oxigênio suplementar, Acesso venoso',[]]);
    items.push(['\u{1F489}','Gasometria arterial',[]]);
    items.push(['\u{26A1}','ECG 12 derivações',[]]);
    items.push(['\u{1F4CB}','RX tórax',[]]);
    items.push(['\u{1F489}','Laboratório: hemograma, PCR, função renal, eletrólitos, troponina, BNP',[]]);
  } else if(risk.level==='moderado'){
    cls='mod-prob';title='Risco moderado \u2014 Investigação ativa';
    items.push(['\u{1F4CB}','ECG 12 derivações',[]]);
    items.push(['\u{1F4CB}','RX tórax PA + perfil',[]]);
    items.push(['\u{1F489}','Laboratório: hemograma, PCR, função renal, eletrólitos',[]]);
    items.push(['\u{1F50D}','Considerar: D-dímero, BNP, troponina conforme suspeita',[]]);
  } else {
    cls='baixa-prob';title='Baixo risco \u2014 Avaliação ambulatorial possível';
    items.push(['\u{1F4CB}','ECG se não realizado',[]]);
    items.push(['\u{1F50D}','Considerar RX tórax se febre ou sinais auscultativos',[]]);
    items.push(['\u{1F50D}','Laboratório básico conforme suspeita clínica',[]]);
  }

  // Add workup from top 2 differentials
  if(dx.length>0&&dx[0].score>0){
    items.push(['\u{1F3AF}',`Suspeita principal: ${dx[0].name}`,[]]);
    for(const w of dx[0].workup)items.push(['\u{1F4CB}',w,[]]);
  }
  if(dx.length>1&&dx[1].score>=3){
    items.push(['\u{1F50D}',`Também considerar: ${dx[1].name}`,[]]);
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${cls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')"><h3>Conduta \u2014 ${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open){
    for(const[icon,text,subs]of items){
      h+=`<div class="conduta-item"><span class="conduta-icon">${icon}</span><span>${text}</span></div>`;
      if(subs&&subs.length>0){
        for(const sub of subs)h+=`<div class="conduta-subitem"><span class="conduta-icon">\u{2022}</span><span>${sub}</span></div>`;
      }
    }
  }
  h+='</div></div>';
  return h;
}

// =============================================
// WELLS SCORE UI
// =============================================
function buildWellsUI(){
  const wellsItems=[
    {key:'clinical_dvt',label:'Sinais clínicos de TVP',pts:3},
    {key:'pe_likely',label:'TEP como diagnóstico mais provável',pts:3},
    {key:'hr100',label:'FC > 100 bpm',pts:1.5},
    {key:'immob_surg',label:'Imobilização ou cirurgia recente',pts:1.5},
    {key:'prior_pe_dvt',label:'TVP/TEP prévio',pts:1.5},
    {key:'hemoptysis',label:'Hemoptise',pts:1},
    {key:'cancer',label:'Câncer ativo (tratamento nos últimos 6 meses)',pts:1},
  ];

  let h='<p style="font-size:.75rem;color:#64748b;margin-bottom:1rem">Score de Wells para tromboembolismo pulmonar</p>';

  for(const item of wellsItems){
    let val=wells[item.key];
    let autoTag=null;
    if(val===null){
      if(item.key==='hr100'&&fcVal()!==null){val=fcVal()>=100?1:0;autoTag='Auto: SV'}
      else if(item.key==='immob_surg'&&patHistoryChecks.size>0){val=patHistoryChecks.has('immob')?1:0;autoTag='Auto'}
      else if(item.key==='prior_pe_dvt'&&patHistoryChecks.size>0){val=patHistoryChecks.has('tvp_tep')?1:0;autoTag='Auto'}
      else if(item.key==='cancer'&&patHistoryChecks.size>0){val=patHistoryChecks.has('cancer')?1:0;autoTag='Auto'}
      else if(item.key==='hemoptysis'){val=symptoms.has('hemoptise')?1:0;autoTag='Auto'}
      else if(item.key==='clinical_dvt'){val=symptoms.has('dor_panturrilha')?1:0;autoTag='Auto'}
    }

    h+=`<div class="score-row"><div class="score-row-label"><span>${item.label} (${item.pts} pts)</span>${autoTag?`<span class="auto-tag">${autoTag}</span>`:''}</div>`;
    h+='<div class="score-options">';
    h+=`<button class="score-opt ${val===0?'picked':''}" onclick="setWells('${item.key}',0)">Não<span class="pts">0</span></button>`;
    h+=`<button class="score-opt ${val===1?'picked':''}" onclick="setWells('${item.key}',1)">Sim<span class="pts">${item.pts}</span></button>`;
    h+='</div></div>';
  }

  const total=getWells();
  if(total!==null){
    let sc,sl,sd;
    if(total>6){sc='sr-high';sl='Alta probabilidade';sd=`Wells ${total} \u2014 Angio-TC indicada. NÃO aguardar D-dímero.`}
    else if(total>=2){sc='sr-mod';sl='Probabilidade moderada';sd=`Wells ${total} \u2014 Solicitar D-dímero. Se positivo (>500), Angio-TC. PERC não se aplica.`}
    else{sc='sr-low';sl='Baixa probabilidade';sd=`Wells ${total} \u2014 Aplicar critérios PERC. Se PERC negativo, TEP excluído. Se PERC positivo, solicitar D-dímero.`}
    h+=`<div class="score-result ${sc}"><div class="score-num">${total}</div><div class="score-info"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    h+='<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Preencha todos os campos</div><div class="score-detail">Campos com "Auto" são preenchidos automaticamente a partir dos dados.</div></div></div>';
  }
  return h;
}

// =============================================
// CURB-65 UI
// =============================================
function buildCurb65UI(){
  const curbItems=[
    {key:'confusion',label:'Confusão mental (Glasgow < 15 ou desorientação)',autoTag:null},
    {key:'bun',label:'Ureia > 43 mg/dL (BUN > 20)',autoTag:null},
    {key:'rr30',label:'FR \u2265 30 irpm',autoTag:frVal()!==null?'Auto: SV':null},
    {key:'bp',label:'PAS < 90 ou PAD \u2264 60 mmHg',autoTag:pasVal()!==null?'Auto: SV':null},
    {key:'age65',label:'Idade \u2265 65 anos',autoTag:patHistory.age!==null?'Auto':null},
  ];

  let h='<p style="font-size:.75rem;color:#64748b;margin-bottom:1rem">CURB-65 para pneumonia adquirida na comunidade</p>';

  for(const item of curbItems){
    let val=curb[item.key];
    let autoTag=item.autoTag;
    if(val===null){
      if(item.key==='rr30'&&frVal()!==null)val=frVal()>=30?1:0;
      else if(item.key==='bp'&&pasVal()!==null&&padVal()!==null)val=(pasVal()<90||padVal()<=60)?1:0;
      else if(item.key==='bp'&&pasVal()!==null)val=pasVal()<90?1:0;
      else if(item.key==='age65'&&patHistory.age!==null)val=patHistory.age>=2?1:0;
    }

    h+=`<div class="score-row"><div class="score-row-label"><span>${item.label}</span>${autoTag?`<span class="auto-tag">${autoTag}</span>`:''}</div>`;
    h+='<div class="score-options">';
    h+=`<button class="score-opt ${val===0?'picked':''}" onclick="setCurb('${item.key}',0)">Não<span class="pts">0</span></button>`;
    h+=`<button class="score-opt ${val===1?'picked':''}" onclick="setCurb('${item.key}',1)">Sim<span class="pts">1</span></button>`;
    h+='</div></div>';
  }

  const total=getCurb();
  if(total!==null){
    let sc,sl,sd;
    if(total>=4){sc='sr-high';sl='Risco muito alto';sd=`CURB-65 ${total}/5 \u2014 Mortalidade ~40%. Internação em UTI. ATB IV.`}
    else if(total===3){sc='sr-high';sl='Alto risco';sd=`CURB-65 ${total}/5 \u2014 Mortalidade ~15–22%. Internação + considerar UTI.`}
    else if(total===2){sc='sr-mod';sl='Risco moderado';sd=`CURB-65 ${total}/5 \u2014 Mortalidade ~9%. Considerar internação (curta ou hospitalar).`}
    else{sc='sr-low';sl='Baixo risco';sd=`CURB-65 ${total}/5 \u2014 Mortalidade <3%. Tratamento ambulatorial possível se suporte social adequado.`}
    h+=`<div class="score-result ${sc}"><div class="score-num">${total}</div><div class="score-info"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    h+='<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Preencha todos os campos</div><div class="score-detail">Campos com "Auto" preenchidos automaticamente.</div></div></div>';
  }
  return h;
}

// =============================================
// NOTE
// =============================================
function buildNoteContent(dx){
  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const elapsed=Math.floor((new Date()-evalStartTime)/1000);
  const em=Math.floor(elapsed/60),es=elapsed%60;
  const risk=riskLevel();
  const onsetLabel={'agudo':'Agudo','cronico':'Crônico','agudo-cronico':'Agudo sobre crônico'};
  const sevLabel={sentencas:'Fala em sentenças completas',frases:'Fala em frases curtas',palavras:'Apenas palavras isoladas',incapaz:'Incapaz de falar'};
  const ageL=['< 45','45–64','65–79','\u2265 80'];

  let n='';
  n+=`DISPNEIA \u2014 AVALIAÇÃO ESTRUTURADA\n`;
  n+=`Data/hora: ${ts} (tempo de avaliação: ${em}min ${String(es).padStart(2,'0')}s)\n`;
  n+=`========================================\n\n`;

  n+=`PACIENTE: ${patHistory.sex==='M'?'Masculino':'Feminino'}, ${ageL[patHistory.age]} anos\n`;
  const histLabels=HISTORY_FIELDS.filter(h=>patHistoryChecks.has(h.id)).map(h=>h.label);
  if(patHistory.smoking&&patHistory.smoking!=='nao')histLabels.push('Tabagismo '+(patHistory.smoking==='ativo'?'ativo':'prévio'));
  n+=`Antecedentes: ${histLabels.length>0?histLabels.join(', '):'Nenhum relatado'}\n`;

  n+=`\nQUADRO CLÍNICO\n`;
  n+=`  Início: ${onsetLabel[onset]}\n`;
  n+=`  Gravidade: ${sevLabel[severity]}\n`;

  const sympLabels=SYMPTOM_LIST.filter(s=>symptoms.has(s.id)).map(s=>s.label);
  n+=`  Sintomas associados: ${sympLabels.length>0?sympLabels.join(', '):'Nenhum'}\n`;

  n+=`\nSINAIS VITAIS\n`;
  if(spo2Val()!==null)n+=`  SpO\u2082: ${vitals.spo2}%${spo2Status()==='danger'?' [CRÍTICO]':spo2Status()==='warning'?' [BAIXA]':''}\n`;
  if(frVal()!==null)n+=`  FR: ${vitals.fr} irpm${frStatus()==='danger'?' [CRÍTICO]':frStatus()==='warning'?' [ELEVADA]':''}\n`;
  if(fcVal()!==null)n+=`  FC: ${vitals.fc} bpm${fcStatus()==='danger'?' [CRÍTICO]':fcStatus()==='warning'?(fcVal()<=50?' [BRADICARDIA]':' [TAQUICARDIA]'):''}\n`;
  if(pasVal()!==null)n+=`  PA: ${vitals.pas}/${vitals.pad||'?'} mmHg${pasStatus()==='danger'?' [HIPOTENSÃO]':pasStatus()==='warning'?' [HIPERTENSÃO]':''}\n`;
  if(tempVal()!==null)n+=`  Temp: ${vitals.temp}\u00B0C${tempStatus()==='danger'?(tempVal()<=35?' [HIPOTERMIA]':' [FEBRE ALTA]'):tempStatus()==='warning'?' [FEBRE]':''}\n`;
  if(spo2Val()===null&&frVal()===null)n+=`  (não registrados)\n`;

  n+=`\nEXAME FÍSICO\n`;
  const examLabels=EXAM_LIST.filter(e=>examFindings.has(e.id)).map(e=>e.label);
  if(examLabels.length>0)for(const l of examLabels)n+=`  - ${l}\n`;
  else n+=`  Sem achados significativos\n`;

  // Red flags in note
  const flags=getRedFlags();
  if(flags.length>0){
    n+=`\nRED FLAGS\n`;
    for(const f of flags)n+=`  ! ${f}\n`;
  }

  n+=`\nESTRATIFICAÇÃO: ${risk.label} (score ${totalRiskScore()})\n`;

  // qSOFA
  const qs=getQSOFA();
  if(frVal()!==null||pasVal()!==null){
    n+=`qSOFA: ${qs}/3${qs>=2?' \u2014 POSITIVO (risco de sepse)':''}\n`;
  }

  n+=`\nDIAGNÓSTICO DIFERENCIAL\n`;
  const topDx=dx.filter(d=>d.score>0).slice(0,5);
  if(topDx.length>0){
    for(let i=0;i<topDx.length;i++){
      n+=`  ${i+1}. ${topDx[i].name} (${topDx[i].cat})${i===0?' \u2014 Principal suspeita':''}\n`;
    }
  } else {
    n+=`  Dados insuficientes para diferencial automático\n`;
  }

  // Scores
  const w=getWells();
  if(w!==null){
    const wRisk=w>6?'Alta probabilidade':w>=2?'Probabilidade moderada':'Baixa probabilidade';
    n+=`\nWELLS (TEP): ${w} pts \u2014 ${wRisk}\n`;
  }
  const c=getCurb();
  if(c!==null){
    const cRisk=c>=3?'Alto risco (internação)':c===2?'Risco moderado':'Baixo risco';
    n+=`CURB-65: ${c}/5 \u2014 ${cRisk}\n`;
  }

  // Workup
  if(topDx.length>0){
    n+=`\nPROPEDÊUTICA SUGERIDA\n`;
    for(const w of topDx[0].workup)n+=`  - ${w}\n`;
  }

  n+=`\n========================================\n`;
  n+=`Gerado por MedStack \u2014 Avaliação Estruturada de Dispneia v3\n`;
  n+=`Ferramenta de apoio à decisão. Não substitui o julgamento clínico.\n`;

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  navigator.clipboard.writeText(el.textContent).then(()=>{
    const btn=document.getElementById('copyBtn');
    btn.textContent='\u2713 Copiado!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copiar nota';btn.classList.remove('copied')},2000);
  }).catch(()=>{
    // Fallback for non-HTTPS or older browsers
    const range=document.createRange();
    range.selectNodeContents(el);
    const sel=window.getSelection();
    sel.removeAllRanges();sel.addRange(range);
    try{document.execCommand('copy');
      const btn=document.getElementById('copyBtn');
      btn.textContent='\u2713 Copiado!';btn.classList.add('copied');
      setTimeout(()=>{btn.textContent='Copiar nota';btn.classList.remove('copied')},2000);
    }catch(e){}
    sel.removeAllRanges();
  });
}

// COLLAPSIBLE
// =============================================
function collapsible(id,title,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open)h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// ACTIONS
// =============================================
function setOnset(v){onset=v;render()}
function setSeverity(v){severity=v;render()}
function toggleSymptom(id){symptoms.has(id)?symptoms.delete(id):symptoms.add(id);render()}
function setVital(key,v){
  vitals[key]=v;
  // Debounced re-render that preserves focus
  clearTimeout(window._vitalTimer);
  window._vitalTimer=setTimeout(()=>render(),500);
}
function toggleExam(id){examFindings.has(id)?examFindings.delete(id):examFindings.add(id);render()}
function setPatH(field,v){
  if(field==='age')patHistory.age=v;
  else if(field==='sex')patHistory.sex=v;
  else if(field==='smoking')patHistory.smoking=v;
  render();
}
function toggleHistCheck(id){patHistoryChecks.has(id)?patHistoryChecks.delete(id):patHistoryChecks.add(id);render()}
function switchTab(t){activeScoreTab=t;render()}
function setWells(key,v){wells[key]=v;render()}
function setCurb(key,v){curb[key]=v;render()}
function toggleSection(id){sections[id]=!sections[id];render()}
function toggleDxWorkup(key){dxWorkupOpen[key]=!dxWorkupOpen[key];render()}

function next(){
  if(currentStep===0&&(onset===null||patHistory.age===null||patHistory.sex===null))return;
  if(currentStep===1&&severity===null)return;
  currentStep++;render();window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){if(currentStep>0){currentStep--;render();window.scrollTo({top:0,behavior:'smooth'})}}
function restart(){
  if(!confirm('Iniciar nova avaliação? Os dados atuais serão perdidos.'))return;
  currentStep=0;onset=null;severity=null;
  symptoms=new Set();vitals={spo2:'',fr:'',fc:'',pas:'',pad:'',temp:''};
  examFindings=new Set();patHistory={age:null,sex:null,smoking:null};
  patHistoryChecks=new Set();
  wells={clinical_dvt:null,pe_likely:null,hr100:null,immob_surg:null,prior_pe_dvt:null,hemoptysis:null,cancer:null};
  curb={confusion:null,bun:null,rr30:null,bp:null,age65:null};
  activeScoreTab='wells';
  dxWorkupOpen={};
  sections={resumo:false,diag:true,conduta:true,scores:true,note:true};
  render();window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
</body>
</html>
