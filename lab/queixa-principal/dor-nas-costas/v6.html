<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dor nas Costas — Avaliacao Estruturada</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;overflow-x:hidden;letter-spacing:-0.005em}
  header{background:#0f172a;width:100%;padding:1.25rem 1.25rem 1rem;text-align:center;border-bottom:1px solid #1e293b;position:relative}
  header h1{font-size:1.15rem;font-weight:600;color:#f1f5f9;letter-spacing:-0.01em}
  header p{font-size:.72rem;color:#64748b;margin-top:.15rem;font-weight:400}
  .back-link{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#64748b;text-decoration:none;font-size:.78rem;font-weight:500;padding:.5rem .25rem;transition:color .2s}
  .back-link:hover,.back-link:focus-visible{color:#e2e8f0;outline:none}
  .container{max-width:700px;width:100%;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;padding-bottom:3rem}
  /* ---- Spine rail (unique identity element) ---- */
  .spine-rail{display:flex;gap:.4rem;padding:.25rem 0}
  .vertebra{flex:1;position:relative;height:28px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .vert-disc{width:100%;height:6px;border-radius:3px;background:#1e293b;transition:background .35s ease,box-shadow .35s ease}
  .vert-disc.done{background:#60a5fa}
  .vert-disc.active{background:#93c5fd;box-shadow:0 0 10px rgba(147,197,253,.35);animation:vertPulse 1.8s ease-in-out infinite}
  @keyframes vertPulse{0%,100%{opacity:1}50%{opacity:.55}}
  .vert-label{font-size:.52rem;color:#475569;text-transform:uppercase;letter-spacing:.06em;font-weight:500;transition:color .3s;text-align:center;line-height:1.1}
  .vertebra.active .vert-label{color:#93c5fd}
  .vertebra.done .vert-label{color:#60a5fa}
  /* Context strip */
  .context-strip{display:flex;flex-wrap:wrap;gap:.3rem;padding:.5rem .65rem;background:#101d35;border-radius:.6rem;border:1px solid #1e293b}
  .context-chip{font-size:.62rem;padding:.18rem .5rem;border-radius:9999px;background:#0f172a;border:1px solid #1e293b;color:#94a3b8;display:inline-flex;align-items:center;gap:.25rem;line-height:1.3}
  .context-chip .chip-val{color:#cbd5e1;font-weight:600}
  .context-chip.chip-alert{background:#2a0e0e;border-color:#7f1d1d;color:#fca5a5}
  .context-chip.chip-alert .chip-val{color:#fca5a5}
  .context-chip.chip-info{background:#101d35;border-color:#1e40af;color:#93c5fd}
  .context-chip.chip-info .chip-val{color:#93c5fd}
  /* Card */
  .card{background:#131f38;border:1px solid #1e293b;border-radius:.9rem;padding:1.5rem;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-size:1.05rem;color:#f8fafc;font-weight:600;letter-spacing:-0.01em;margin-bottom:.25rem}
  .card .subtitle{font-size:.75rem;color:#64748b;margin-bottom:1rem;line-height:1.5}
  .options{display:flex;flex-direction:column;gap:.6rem}
  .option-group-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:#64748b;margin-top:.65rem;margin-bottom:-.1rem;display:flex;align-items:center;gap:.4rem;font-weight:600}
  .option-group-label:first-child{margin-top:0}
  .group-line{flex:1;height:1px;background:#1e293b}
  /* Check buttons */
  .check-btn{background:#0f172a;border:1.5px solid #1e293b;border-radius:.65rem;padding:.7rem .9rem;color:#cbd5e1;font-size:.85rem;cursor:pointer;transition:border-color .18s,background .18s,color .18s;text-align:left;display:flex;align-items:center;gap:.7rem;-webkit-user-select:none;user-select:none;width:100%;font-family:inherit;line-height:1.35}
  .check-btn:hover{border-color:#3b82f6;background:#101d35;color:#f1f5f9}
  .check-btn:active{transform:scale(.985)}
  .check-btn:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .check-btn.checked{border-color:#3b82f6;background:#172554;color:#f1f5f9}
  .check-btn.checked.flag-critical{border-color:#ef4444;background:#2a0e0e;color:#fca5a5}
  .check-btn.checked.flag-warn{border-color:#d97706;background:#2a1808;color:#fcd34d}
  .check-box{width:18px;height:18px;border:1.5px solid #475569;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:.7rem}
  .check-btn.checked .check-box{background:#3b82f6;border-color:#3b82f6;color:#fff}
  .check-btn.checked.flag-critical .check-box{background:#ef4444;border-color:#ef4444}
  .check-btn.checked.flag-warn .check-box{background:#d97706;border-color:#d97706}
  .check-btn .label{flex:1;min-width:0}
  .check-desc{font-size:.68rem;color:#64748b;margin-top:.15rem;font-weight:400}
  /* Option buttons (radios) */
  .option-btn{background:#0f172a;border:1.5px solid #1e293b;border-radius:.65rem;padding:.8rem .95rem;color:#cbd5e1;font-size:.9rem;cursor:pointer;transition:border-color .18s,background .18s,color .18s;text-align:left;display:flex;align-items:flex-start;gap:.7rem;-webkit-user-select:none;user-select:none;width:100%;font-family:inherit;line-height:1.4}
  .option-btn:hover{border-color:#3b82f6;background:#101d35;color:#f1f5f9}
  .option-btn:active{transform:scale(.985)}
  .option-btn:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .option-btn.selected{border-color:#3b82f6;background:#172554;color:#f1f5f9}
  .option-btn .label{flex:1;min-width:0}
  .option-btn .tag{font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;padding:.18rem .45rem;border-radius:9999px;font-weight:700;flex-shrink:0;align-self:flex-start;margin-top:.1rem}
  .tag-mec{background:#0e3a42;color:#67e8f9}.tag-nonmec{background:#3b1f6b;color:#c4b5fd}.tag-ref{background:#5c2a07;color:#fcd34d}
  /* Score options */
  .score-opt{flex:1;padding:.55rem .35rem;border-radius:.5rem;font-size:.72rem;cursor:pointer;border:1.5px solid #1e293b;background:#0f172a;color:#64748b;text-align:center;transition:border-color .18s,background .18s,color .18s;line-height:1.3;-webkit-user-select:none;user-select:none;font-family:inherit}
  .score-opt:hover{border-color:#3b82f6;color:#cbd5e1}
  .score-opt:active{transform:scale(.96)}
  .score-opt:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .score-opt.picked{border-color:#3b82f6;background:#172554;color:#f1f5f9;font-weight:600}
  /* EVA */
  .eva-container{display:flex;align-items:center;gap:.8rem;margin-top:.5rem}
  .eva-slider-wrap{flex:1;position:relative;padding:.25rem 0}
  .eva-slider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;outline:none;cursor:pointer;transition:background .2s}
  .eva-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.4);transition:transform .15s}
  .eva-slider::-webkit-slider-thumb:active{transform:scale(1.15)}
  .eva-slider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .eva-value-box{text-align:center;min-width:3rem}
  .eva-value{font-size:1.75rem;font-weight:700;line-height:1;transition:color .2s;font-variant-numeric:tabular-nums}
  .eva-label{font-size:.55rem;color:#64748b;margin-top:.2rem;text-transform:uppercase;letter-spacing:.08em}
  .eva-intensity{font-size:.62rem;font-weight:500;margin-top:.1rem;transition:color .2s}
  .eva-anchors{display:flex;justify-content:space-between;font-size:.58rem;color:#475569;padding:0 .15rem;margin-top:.25rem}
  /* Duration chips */
  .duration-row{display:flex;gap:.45rem;flex-wrap:wrap}
  .dur-chip{flex:1;min-width:0;padding:.6rem .5rem;border-radius:.55rem;font-size:.76rem;cursor:pointer;border:1.5px solid #1e293b;background:#0f172a;color:#64748b;text-align:center;transition:border-color .18s,background .18s,color .18s;line-height:1.3;-webkit-user-select:none;user-select:none;font-family:inherit}
  .dur-chip:hover{border-color:#3b82f6;color:#cbd5e1}
  .dur-chip:active{transform:scale(.96)}
  .dur-chip:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .dur-chip.picked{border-color:#3b82f6;background:#172554;color:#f1f5f9;font-weight:600}
  .dur-chip .dur-label{font-weight:600;display:block;font-size:.82rem}
  .dur-chip .dur-range{font-size:.6rem;color:#94a3b8;display:block;margin-top:.1rem}
  /* Nav */
  .nav-row{display:flex;gap:.65rem;margin-top:1rem}
  .nav-btn{flex:1;padding:.8rem;border-radius:.65rem;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;-webkit-user-select:none;user-select:none;font-family:inherit;min-height:48px}
  .nav-btn.secondary{background:#1e293b;color:#cbd5e1}.nav-btn.secondary:hover{background:#334155}
  .nav-btn.primary{background:#3b82f6;color:#fff}.nav-btn.primary:hover{background:#2563eb}
  .nav-btn.primary:active{transform:scale(.98);background:#1d4ed8}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed}
  .nav-btn:disabled:active{transform:none}
  .nav-btn:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .nav-btn.danger{background:transparent;color:#94a3b8;border:1px solid #334155}.nav-btn.danger:hover{color:#fca5a5;border-color:#7f1d1d;background:#2a0e0e}
  /* Validation hint */
  .validation-hint{font-size:.7rem;color:#f59e0b;text-align:center;margin-top:.5rem;opacity:0;transition:opacity .25s;min-height:1.1rem;line-height:1.3}
  .validation-hint.visible{opacity:1}
  .validation-hint.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  /* Result */
  .result-card{text-align:center;padding:1.75rem 1.25rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:4.5rem;height:4.5rem;border-radius:50%;font-size:1.6rem;font-weight:700;margin-bottom:.85rem;animation:badgePop .35s ease;letter-spacing:0;font-family:'SF Mono','Fira Code','Consolas',monospace}
  @keyframes badgePop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .result-badge.risk-emergent{background:#2a0e0e;color:#fca5a5;border:2px solid #ef4444}
  .result-badge.risk-urgent{background:#2a1808;color:#fcd34d;border:2px solid #d97706}
  .result-badge.risk-routine{background:#0a2818;color:#86efac;border:2px solid #16a34a}
  .result-title{font-size:1.2rem;font-weight:600;margin-bottom:.25rem;letter-spacing:-0.01em}
  .result-desc{color:#94a3b8;font-size:.82rem;margin-bottom:1.25rem;line-height:1.5}
  .dark-box{background:#0f172a;border-radius:.7rem;padding:1.1rem;text-align:left;margin-bottom:1rem;border:1px solid #1e293b;transition:border-color .2s}
  .dark-box:hover{border-color:#334155}
  .dark-box h3{font-size:.72rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .summary-row{display:flex;justify-content:space-between;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid #1e293b;font-size:.82rem;gap:.5rem}
  .summary-row:last-child{border-bottom:none}.summary-row .criteria{color:#94a3b8;flex-shrink:0}
  .summary-row .value{font-weight:500;display:flex;align-items:center;gap:.4rem;text-align:right;max-width:58%;flex-wrap:wrap;justify-content:flex-end;color:#e2e8f0}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-red{background:#ef4444}.dot-yellow{background:#f59e0b}.dot-green{background:#22c55e}.dot-blue{background:#60a5fa}
  .conduta-box{border-radius:.7rem;padding:1.1rem;text-align:left;margin-bottom:1rem;border:1px solid}
  .conduta-box h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .conduta-box.alta-prob{background:#1a0808;border-color:#7f1d1d}.conduta-box.alta-prob h3{color:#fca5a5}
  .conduta-box.mod-prob{background:#1a1004;border-color:#78350f}.conduta-box.mod-prob h3{color:#fcd34d}
  .conduta-box.baixa-prob{background:#081a10;border-color:#14532d}.conduta-box.baixa-prob h3{color:#86efac}
  .conduta-item{display:flex;align-items:flex-start;gap:.55rem;padding:.4rem 0;font-size:.82rem;color:#cbd5e1;line-height:1.45;border-bottom:1px solid rgba(148,163,184,.08)}
  .conduta-item:last-child{border-bottom:none}
  .conduta-bullet{flex-shrink:0;width:6px;height:6px;border-radius:50%;background:currentColor;margin-top:.5rem;opacity:.5}
  .conduta-detail{font-size:.7rem;color:#94a3b8;margin-top:.2rem;line-height:1.45}
  .flag-count{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .6rem;border-radius:9999px;font-size:.72rem;font-weight:600;margin:.15rem .2rem .2rem}
  .flag-count.has-flags{background:#2a0e0e;color:#fca5a5;border:1px solid #7f1d1d}
  .flag-count.no-flags{background:#0a2818;color:#86efac;border:1px solid #14532d}
  .neuro-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
  .neuro-grid .score-opt{padding:.55rem .4rem;font-size:.74rem}
  .neuro-field-label{display:flex;align-items:center;gap:.4rem}
  .neuro-field-status{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s}
  .neuro-field-status.filled{background:#3b82f6}
  .neuro-field-status.empty{background:#334155}
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:.1rem 0;border-radius:.35rem;transition:opacity .2s}
  .collapse-header:active{opacity:.7}
  .collapse-arrow{font-size:.65rem;color:#64748b;transition:transform .3s ease}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .3s ease, opacity .22s ease;max-height:0;opacity:0}
  .collapse-body.visible{max-height:3000px;opacity:1;margin-top:.7rem}
  .note-box{background:#0f172a;border-radius:.7rem;padding:1.1rem;text-align:left;margin-bottom:1rem;border:1px solid #1e293b}
  .note-box h3{font-size:.72rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem;font-weight:600}
  .note-text{background:#020617;border:1px solid #1e293b;border-radius:.5rem;padding:.9rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.7rem;color:#94a3b8;white-space:pre-wrap;line-height:1.6;max-height:380px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.7rem;padding:.65rem;border-radius:.5rem;border:1.5px solid #1e293b;background:#131f38;color:#cbd5e1;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;min-height:46px}
  .copy-btn:hover{border-color:#3b82f6;background:#172554;color:#f1f5f9}
  .copy-btn:active{transform:scale(.98)}
  .copy-btn.copied{border-color:#16a34a;background:#0a2818;color:#86efac}
  .alert-banner{background:#1a0808;border:1px solid #7f1d1d;border-radius:.7rem;padding:.85rem 1rem;margin-bottom:.6rem;display:flex;align-items:flex-start;gap:.65rem;animation:fade .3s ease}
  .alert-banner.warn{background:#1a1004;border-color:#78350f}
  .alert-banner .alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:.4rem;background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
  .alert-banner.warn .alert-dot{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.2)}
  .alert-banner .alert-text{font-size:.82rem;color:#fca5a5;font-weight:600;line-height:1.35}
  .alert-banner.warn .alert-text{color:#fcd34d}
  .alert-banner .alert-detail{font-size:.72rem;color:#f87171;font-weight:400;margin-top:.2rem;line-height:1.4}
  .alert-banner.warn .alert-detail{color:#fbbf24}
  .section-label{font-size:.7rem;color:#94a3b8;font-weight:600;margin-bottom:.45rem;margin-top:.85rem;display:flex;align-items:center;gap:.5rem;letter-spacing:.02em}
  .section-label:first-of-type{margin-top:0}
  .section-label .sl-line{flex:1;height:1px;background:#1e293b}
  /* Dermatome ref */
  .dermatome-hint{background:#0f172a;border:1px solid #1e293b;border-radius:.5rem;padding:.7rem;margin-top:.4rem;font-size:.7rem;color:#94a3b8;line-height:1.45}
  .dermatome-hint .derm-row{display:flex;justify-content:space-between;padding:.2rem 0;border-bottom:1px solid #1e293b;gap:.5rem}
  .dermatome-hint .derm-row:last-child{border-bottom:none}
  .dermatome-hint .derm-level{color:#93c5fd;font-weight:600;min-width:2.3rem;font-family:'SF Mono','Consolas',monospace;font-size:.7rem}
  /* Differential */
  .diff-box{background:#0f172a;border:1px solid #1e293b;border-radius:.5rem;padding:.7rem .9rem;margin-top:.4rem}
  .diff-item{display:flex;align-items:flex-start;gap:.45rem;padding:.35rem 0;font-size:.76rem;color:#cbd5e1;border-bottom:1px solid #1e293b;line-height:1.4}
  .diff-item:last-child{border-bottom:none}
  .diff-prob{font-size:.54rem;text-transform:uppercase;letter-spacing:.07em;padding:.12rem .4rem;border-radius:9999px;font-weight:700;flex-shrink:0;margin-top:.12rem;min-width:4.2rem;text-align:center}
  .prob-high{background:#7f1d1d;color:#fecaca}.prob-mod{background:#78350f;color:#fcd34d}.prob-low{background:#0e3a42;color:#67e8f9}
  .skip-flags{display:block;text-align:center;margin-top:.5rem;font-size:.7rem;color:#64748b;cursor:pointer;text-decoration:underline;text-underline-offset:3px;background:none;border:none;font-family:inherit;padding:.5rem;width:100%}
  .skip-flags:hover,.skip-flags:focus-visible{color:#94a3b8;outline:none}
  /* Info boxes (auto-sync / warnings inside steps) */
  .info-box{display:flex;align-items:flex-start;gap:.45rem;padding:.55rem .75rem;border-radius:.5rem;font-size:.72rem;line-height:1.45;margin-top:.45rem;margin-bottom:.25rem}
  .info-box.info{background:#101d35;border:1px solid #1e40af;color:#93c5fd}
  .info-box.warn{background:#1a1004;border:1px solid #78350f;color:#fcd34d}
  .info-box.alert{background:#1a0808;border:1px solid #7f1d1d;color:#fca5a5}
  .info-box::before{content:'';flex-shrink:0;width:6px;height:6px;border-radius:50%;background:currentColor;margin-top:.35rem}
  /* Yellow flag box */
  .yellow-flag-box{background:#14112e;border:1px solid #312e81;border-radius:.5rem;padding:.7rem .9rem;margin-top:.65rem;font-size:.72rem;color:#a5b4fc;line-height:1.5}
  .yellow-flag-box strong{color:#c7d2fe;font-weight:600}
  /* SI test reference */
  .si-test-ref{background:#0f172a;border:1px solid #1e293b;border-radius:.5rem;padding:.6rem .8rem;margin-top:.45rem;font-size:.7rem;color:#94a3b8;line-height:1.55}
  .si-test-ref strong{color:#cbd5e1}
  .si-test-ref .test-name{color:#93c5fd;font-weight:600}
  /* Disclaimer */
  .disclaimer{text-align:center;font-size:.6rem;color:#475569;padding:.9rem;line-height:1.55;border-top:1px solid #1e293b;margin-top:.75rem}
  /* Restart overlay */
  .restart-overlay{position:fixed;inset:0;background:rgba(2,6,23,.75);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .18s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:1rem}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .restart-dialog{background:#131f38;border:1px solid #334155;border-radius:.8rem;padding:1.35rem;max-width:340px;width:100%;text-align:center;animation:badgePop .25s ease}
  .restart-dialog h3{font-size:.95rem;color:#f1f5f9;margin-bottom:.4rem;font-weight:600}
  .restart-dialog p{font-size:.8rem;color:#94a3b8;margin-bottom:1.1rem;line-height:1.45}
  .restart-dialog .dialog-btns{display:flex;gap:.6rem}
  .restart-dialog .dialog-btns button{flex:1;padding:.65rem;border-radius:.5rem;font-size:.82rem;font-weight:600;cursor:pointer;border:none;font-family:inherit;min-height:44px}
  /* Responsive */
  @media(max-width:500px){
    .container{padding:.9rem}
    .card{padding:1.1rem}
    .check-btn{padding:.6rem .75rem;font-size:.8rem}
    .option-btn{padding:.7rem .85rem;font-size:.85rem}
    header h1{font-size:1rem}header p{font-size:.68rem}
    .vert-label{font-size:.46rem}
    .score-opt{font-size:.66rem;padding:.45rem .25rem}
    .neuro-grid{grid-template-columns:1fr}
    .neuro-grid .score-opt{font-size:.74rem;padding:.55rem .4rem;text-align:left;padding-left:.85rem}
    .eva-value{font-size:1.4rem}
    .eva-value-box{min-width:2.8rem}
    .eva-slider::-webkit-slider-thumb{width:32px;height:32px}
    .eva-slider::-moz-range-thumb{width:32px;height:32px}
    .duration-row{gap:.35rem}
    .dur-chip{padding:.55rem .4rem;min-width:calc(33% - .3rem);flex:none}
    .context-chip{font-size:.56rem}
    .summary-row{flex-direction:column;gap:.15rem}
    .summary-row .value{max-width:100%;text-align:left;justify-content:flex-start}
    .nav-btn{min-height:50px;font-size:.9rem}
    .back-link{left:.85rem;font-size:.74rem}
    .result-card{padding:1.4rem 1rem}

  }
  @media(max-width:360px){
    .container{padding:.7rem}
    .card{padding:.9rem;border-radius:.7rem}
    header h1{font-size:.95rem}
    .vert-label{font-size:.42rem}
    .dur-chip{min-width:100%;flex:none}
    .eva-container{flex-direction:column;gap:.4rem}
    .eva-value-box{display:flex;align-items:baseline;gap:.5rem}
    .eva-label{margin-top:0}
    .eva-intensity{margin-top:0}
  }
  /* Print */
  @media print{
    body{background:#fff;color:#000}
    .card{background:#fff;border-color:#ccc}
    .dark-box,.note-box{background:#f8f8f8;border-color:#ccc}
    .conduta-box{background:#f8f8f8!important;border-color:#ccc!important}
    .conduta-box h3{color:#333!important}
    .conduta-item{color:#000;border-color:#eee}
    .conduta-detail{color:#555}
    .nav-row,.spine-rail,.back-link,.copy-btn,.skip-flags,.restart-overlay{display:none!important}
    .collapse-body{max-height:none!important;opacity:1!important;margin-top:.5rem!important}
    .note-text{background:#f8f8f8;color:#000;border-color:#ccc}
    .alert-banner{background:#fef2f2!important;border-color:#fca5a5!important}
    .alert-banner .alert-text,.alert-banner .alert-detail{color:#991b1b!important}
    .yellow-flag-box{background:#f8f8f8;border-color:#ccc;color:#333}
    .diff-box{background:#f8f8f8;border-color:#ccc}
    .diff-item{color:#000;border-color:#eee}
    .summary-row{border-color:#eee}
    .summary-row .criteria{color:#666}
    .summary-row .value{color:#000}

  }
</style>
