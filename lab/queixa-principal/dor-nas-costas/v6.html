<body>
<header>
  <a href="../dor-nas-costas.html" class="back-link" aria-label="Voltar">&larr; Voltar</a>
  <h1>Avaliador de Dor nas Costas</h1>
  <p>Red flags . Classificacao . Neurologia . Conduta</p>
</header>
<div class="container" id="app"></div>
<div id="overlayRoot"></div>
<script>
// ============================================
// DATA
// ============================================
const STEP_LABELS=['Alarme','Dor','Local','Neuro','Sintomas','Plano'];
const TOTAL_STEPS=6;

const RED_FLAGS=[
  {id:'cauda_saddle',label:'Anestesia em sela (perineal)',group:'cauda',severity:'critical'},
  {id:'cauda_bladder',label:'Disfuncao vesical (retencao/incontinencia)',group:'cauda',severity:'critical'},
  {id:'cauda_bowel',label:'Disfuncao intestinal (incontinencia fecal)',group:'cauda',severity:'critical'},
  {id:'cauda_neuro',label:'Deficit neurologico progressivo em MMII',group:'cauda',severity:'critical'},
  {id:'fever',label:'Febre',group:'infec',severity:'warn'},
  {id:'ivdu',label:'Uso de drogas intravenosas',group:'infec',severity:'warn'},
  {id:'immunosupp',label:'Imunossupressao',group:'infec',severity:'warn'},
  {id:'recent_procedure',label:'Procedimento espinhal recente',group:'infec',severity:'warn'},
  {id:'cancer',label:'Historia de neoplasia',group:'neopl',severity:'warn'},
  {id:'weight_loss',label:'Perda de peso inexplicada',group:'neopl',severity:'warn'},
  {id:'age_risk',label:'Idade > 50 ou < 20 anos',group:'neopl',severity:'warn'},
  {id:'night_pain',label:'Dor noturna que nao alivia em repouso',group:'neopl',severity:'warn'},
  {id:'trauma',label:'Trauma significativo (ou menor em idoso/osteoporose)',group:'fratura',severity:'warn'},
  {id:'corticoid',label:'Uso cronico de corticoides',group:'fratura',severity:'warn'},
  {id:'osteoporosis',label:'Osteoporose conhecida',group:'fratura',severity:'warn'},
  {id:'anticoag',label:'Uso de anticoagulantes',group:'vascular',severity:'warn'},
  {id:'aortic_risk',label:'Historia de aneurisma aortico / doenca vascular',group:'vascular',severity:'critical'},
];

const CAUDA_IDS=['cauda_saddle','cauda_bladder','cauda_bowel','cauda_neuro'];
const INFEC_IDS=['fever','ivdu','immunosupp','recent_procedure'];
const NEOPL_IDS=['cancer','weight_loss','age_risk','night_pain'];
const FRATURA_IDS=['trauma','corticoid','osteoporosis'];

const PAIN_TYPES=[
  {id:'mechanical',label:'Mecanica',desc:'Piora com movimento, melhora com repouso. Relacionada a posicao.',tag:'tag-mec',tagLabel:'Mecanica'},
  {id:'nonmechanical',label:'Nao-mecanica / Inflamatoria',desc:'Rigidez matinal > 30min, piora com repouso, melhora com atividade. Dor noturna.',tag:'tag-nonmec',tagLabel:'Inflamatoria'},
  {id:'referred',label:'Referida / Visceral',desc:'Constante, sem relacao postural, sintomas abdominais/pelvicos/toracicos.',tag:'tag-ref',tagLabel:'Referida'},
];

const DURATIONS=[
  {id:'acute',label:'Aguda',range:'< 4 sem'},
  {id:'subacute',label:'Subaguda',range:'4 - 12 sem'},
  {id:'chronic',label:'Cronica',range:'> 12 sem'},
];

const LOCATIONS=[
  {id:'cervical',label:'Cervical',hint:'Pescoco, base do cranio'},
  {id:'thoracic',label:'Toracica',hint:'Dorso medio, entre escapulas'},
  {id:'lumbar',label:'Lombar',hint:'Regiao mais comum'},
  {id:'sacral',label:'Sacral / Sacroiliaca',hint:'Nadega, articulacao SI'},
];

const IRRADIATION=[
  {id:'none',label:'Sem irradiacao'},
  {id:'buttock',label:'Nadega / Gluteo'},
  {id:'posterior_thigh',label:'Face posterior da coxa'},
  {id:'below_knee',label:'Abaixo do joelho (panturrilha / pe)'},
  {id:'bilateral_legs',label:'Bilateral em MMII'},
  {id:'upper_limb',label:'Membro superior (cervicalgia)'},
  {id:'chest_abd',label:'Torax / Abdome (toracica)'},
];

const NEURO_TESTS={
  motor:{label:'Forca motora',opts:[
    {v:'normal',l:'5/5 Normal'},
    {v:'leve',l:'4/5 Leve deficit'},
    {v:'moderado',l:'3/5 Moderado'},
    {v:'grave',l:'< 3/5 Grave'},
  ]},
  sensory:{label:'Alteracao sensitiva',opts:[
    {v:'normal',l:'Normal'},
    {v:'dermatomal',l:'Dermatomal definido'},
    {v:'difusa',l:'Difusa / Nao-dermatomal'},
    {v:'saddle',l:'Em sela (perineal)'},
  ]},
  reflex:{label:'Reflexos',opts:[
    {v:'normal',l:'Normais / Simetricos'},
    {v:'hipo',l:'Hiporreflexia'},
    {v:'hiper',l:'Hiperreflexia / Clonus'},
    {v:'assimetrico',l:'Assimetricos'},
  ]},
  slr:{label:'Lasegue (SLR)',opts:[
    {v:'negative',l:'Negativo'},
    {v:'positive_uni',l:'Positivo unilateral'},
    {v:'positive_bi',l:'Positivo bilateral'},
    {v:'not_done',l:'Nao realizado'},
  ]},
  babinski:{label:'Babinski',opts:[
    {v:'normal',l:'Flexor (normal)'},
    {v:'extensor',l:'Extensor (positivo)'},
    {v:'not_done',l:'Nao avaliado'},
  ]},
  gait:{label:'Marcha',opts:[
    {v:'normal',l:'Normal'},
    {v:'antalgic',l:'Antalgica'},
    {v:'steppage',l:'Escarvante (pe caido)'},
    {v:'spastic',l:'Espastica'},
    {v:'not_done',l:'Nao avaliada'},
  ]},
};

const ASSOC_SYMPTOMS=[
  {id:'radiculopathy',label:'Dor radicular (irradia para membro)'},
  {id:'claudication',label:'Claudicacao neurogenica (piora ao caminhar/ficar em pe)'},
  {id:'morning_stiffness',label:'Rigidez matinal > 30 minutos'},
  {id:'paresthesia',label:'Parestesias (formigamento/dormencia)'},
  {id:'bilateral_sx',label:'Sintomas bilaterais em MMII'},
  {id:'gait_change',label:'Alteracao de marcha'},
  {id:'abd_pain',label:'Dor abdominal associada'},
  {id:'urinary_sx',label:'Sintomas urinarios (sem retencao)'},
  {id:'thoracic_pain',label:'Dor toracica associada'},
  {id:'hip_pain',label:'Dor no quadril (coxofemoral)'},
  {id:'wt_bearing_pain',label:'Dor que piora ao carregar peso'},
  {id:'night_waking',label:'Dor que acorda durante a noite'},
];

const DERMATOMES_LUMBAR=[
  {level:'L2',motor:'Flexao do quadril',sensory:'Face anterior da coxa',reflex:'--'},
  {level:'L3',motor:'Extensao do joelho',sensory:'Face medial do joelho',reflex:'Patelar'},
  {level:'L4',motor:'Dorsiflexao do pe',sensory:'Face medial da perna',reflex:'Patelar'},
  {level:'L5',motor:'Extensor longo do halux',sensory:'Dorso do pe (1o-2o dedos)',reflex:'--'},
  {level:'S1',motor:'Flexao plantar',sensory:'Face lateral do pe',reflex:'Aquileu'},
];

const DERMATOMES_CERVICAL=[
  {level:'C5',motor:'Deltoide / Biceps',sensory:'Face lateral do braco',reflex:'Bicipital'},
  {level:'C6',motor:'Extensores do punho',sensory:'Polegar + indicador',reflex:'Braquiorradial'},
  {level:'C7',motor:'Triceps',sensory:'Dedo medio',reflex:'Tricipital'},
  {level:'C8',motor:'Flexores dos dedos',sensory:'Dedo minimo',reflex:'--'},
  {level:'T1',motor:'Interosseos da mao',sensory:'Face medial do antebraco',reflex:'--'},
];

// ============================================
// STATE
// ============================================
let currentStep=0;
let redFlags=new Set();
let painType=null;
let painDuration=null;
let evaScore=5;
let locations=new Set();
let irradiation=new Set();
let neuro={motor:null,sensory:null,reflex:null,slr:null,babinski:null,gait:null};
let symptoms=new Set();
let sections={flags:true,classification:false,location:false,neuro_detail:false,symptoms_detail:false,workup:true,conduta:true,diferencial:false,note:true};
const evalStartTime=new Date();
let neuroSaddleAutoSynced=false;
let validationShake=false;

const app=document.getElementById('app');
const overlayRoot=document.getElementById('overlayRoot');

// ============================================
// HELPERS
// ============================================
const hasCaudaEquina=()=>CAUDA_IDS.some(id=>redFlags.has(id));
const hasInfectionRisk=()=>{
  const n=INFEC_IDS.filter(id=>redFlags.has(id)).length;
  return n>=1 && (redFlags.has('fever') || n>=2);
};
const hasCancerRisk=()=>NEOPL_IDS.filter(id=>redFlags.has(id)).length>=2 || redFlags.has('cancer');
const hasFractureRisk=()=>FRATURA_IDS.some(id=>redFlags.has(id));
const hasVascularRisk=()=>redFlags.has('aortic_risk');
const hasUMN=()=>neuro.babinski==='extensor' || neuro.reflex==='hiper' || neuro.gait==='spastic';
const flagCount=()=>redFlags.size;
const neuroFilledCount=()=>Object.values(neuro).filter(v=>v!==null).length;
const neuroTotalFields=()=>Object.keys(NEURO_TESTS).length;

function getRiskLevel(){
  if(hasCaudaEquina()) return 'emergent';
  if(neuro.sensory==='saddle') return 'emergent';
  if(hasUMN() && (neuro.motor==='grave' || neuro.motor==='moderado')) return 'emergent';
  if(hasInfectionRisk() && redFlags.has('fever') && (neuro.motor==='grave' || neuro.motor==='moderado')) return 'emergent';
  if(hasVascularRisk() && painType==='referred') return 'emergent';
  if(neuro.motor==='grave' && irradiation.has('bilateral_legs')) return 'emergent';

  if(hasInfectionRisk()) return 'urgent';
  if(hasCancerRisk()) return 'urgent';
  if(hasFractureRisk()) return 'urgent';
  if(hasVascularRisk()) return 'urgent';
  if(neuro.motor==='grave' || neuro.motor==='moderado') return 'urgent';
  if(hasUMN()) return 'urgent';
  if(neuro.gait==='steppage') return 'urgent';
  if(redFlags.has('night_pain') && redFlags.has('weight_loss')) return 'urgent';
  if(locations.has('thoracic') && flagCount()>=1) return 'urgent';
  if(flagCount()>=2) return 'urgent';

  return 'routine';
}

function needsImaging(){
  const r=getRiskLevel();
  if(r==='emergent') return 'immediate';
  if(r==='urgent') return 'urgent';
  if(neuro.motor && neuro.motor!=='normal') return 'urgent';
  if(hasUMN()) return 'urgent';
  if(neuro.gait==='steppage') return 'urgent';
  if(neuro.sensory==='dermatomal' && symptoms.has('radiculopathy')) return 'consider';
  if(neuro.slr==='positive_bi') return 'urgent';
  if(neuro.slr==='positive_uni' && symptoms.has('radiculopathy')) return 'consider';
  if(painDuration==='chronic' && painType==='nonmechanical') return 'consider';
  if(painDuration==='chronic' && evaScore>=7) return 'consider';
  if(locations.has('thoracic') && painDuration!=='acute') return 'consider';
  return 'none';
}

function evaColor(val){
  if(val<=3) return '#22c55e';
  if(val<=6) return '#f59e0b';
  return '#ef4444';
}
function evaIntensityLabel(val){
  if(val===0) return 'Sem dor';
  if(val<=3) return 'Leve';
  if(val<=6) return 'Moderada';
  if(val<=8) return 'Intensa';
  return 'Insuportavel';
}
function evaGradient(val){
  const pct=(val/10)*100;
  const col=evaColor(val);
  return `linear-gradient(to right, #22c55e 0%, ${col} ${pct}%, #1e293b ${pct}%, #1e293b 100%)`;
}

function haptic(style){
  if(!navigator.vibrate) return;
  if(style==='light') navigator.vibrate(8);
  else if(style==='medium') navigator.vibrate(18);
  else if(style==='success') navigator.vibrate([12,40,12]);
}

// ============================================
// CONTEXT STRIP
// ============================================
function buildContextStrip(){
  if(currentStep===0) return '';
  let chips=[];
  const fc=flagCount();
  if(fc>0) chips.push({cls:'chip-alert',label:'Alarme',val:fc});
  else chips.push({cls:'',label:'Alarme',val:'0'});
  if(currentStep>1 && painType){
    const pt=PAIN_TYPES.find(p=>p.id===painType);
    chips.push({cls:'',label:'Dor',val:pt?pt.label:'--'});
  }
  if(currentStep>1 && painDuration){
    const d=DURATIONS.find(x=>x.id===painDuration);
    chips.push({cls:'',label:'Duracao',val:d?d.label:'--'});
  }
  if(currentStep>1) chips.push({cls:'',label:'EVA',val:`${evaScore}/10`});
  if(currentStep>2 && locations.size>0){
    const names=[...locations].map(id=>LOCATIONS.find(x=>x.id===id)?.label||id);
    chips.push({cls:'',label:'Local',val:names.join(', ')});
  }
  if(currentStep>2 && irradiation.size>0){
    const names=[...irradiation].map(id=>IRRADIATION.find(x=>x.id===id)?.label||id);
    const disp=names.length>2?`${names.length} padroes`:names.join(', ');
    chips.push({cls:'chip-info',label:'Irradiacao',val:disp});
  }
  if(currentStep>3){
    const ab=Object.entries(neuro).filter(([k,v])=>v && v!=='normal' && v!=='negative' && v!=='not_done');
    if(ab.length>0) chips.push({cls:'chip-alert',label:'Neuro',val:`${ab.length} alterado${ab.length>1?'s':''}`});
    else chips.push({cls:'',label:'Neuro',val:'Normal'});
  }
  if(currentStep>4 && symptoms.size>0) chips.push({cls:'chip-info',label:'Sintomas',val:symptoms.size});
  let h='<div class="context-strip" role="status" aria-label="Resumo das etapas">';
  for(const c of chips) h+=`<span class="context-chip ${c.cls}">${c.label}: <span class="chip-val">${c.val}</span></span>`;
  h+='</div>';
  return h;
}

// ============================================
// PROGRESS (spine rail)
// ============================================
function progHTML(idx,allDone){
  let h='<div class="spine-rail" role="progressbar" aria-valuenow="'+(idx+1)+'" aria-valuemin="1" aria-valuemax="'+TOTAL_STEPS+'" aria-label="Etapa '+(idx+1)+' de '+TOTAL_STEPS+'">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c=allDone||i<idx?'done':i===idx?'active':'';
    h+=`<div class="vertebra ${c}"><div class="vert-disc ${c}"></div><div class="vert-label">${STEP_LABELS[i]}</div></div>`;
  }
  h+='</div>';
  h+=buildContextStrip();
  return h;
}

// ============================================
// RENDER ROUTER
// ============================================
function render(){
  // Auto-sync: saddle flag -> neuro sensory
  if(redFlags.has('cauda_saddle') && neuro.sensory!=='saddle'){
    neuro.sensory='saddle';
    neuroSaddleAutoSynced=true;
  }
  if(!redFlags.has('cauda_saddle') && neuroSaddleAutoSynced && neuro.sensory==='saddle'){
    neuro.sensory=null;
    neuroSaddleAutoSynced=false;
  }
  if(neuro.gait && neuro.gait!=='normal' && neuro.gait!=='not_done') symptoms.add('gait_change');

  if(currentStep===0) renderRedFlags();
  else if(currentStep===1) renderPainType();
  else if(currentStep===2) renderLocation();
  else if(currentStep===3) renderNeuro();
  else if(currentStep===4) renderSymptoms();
  else renderResult();
}

// ============================================
// STEP 0: RED FLAGS
// ============================================
function renderRedFlags(){
  let h=progHTML(0,false);
  h+='<div class="card">';
  h+='<h2>Sinais de Alarme</h2>';
  h+='<p class="subtitle">Etapa 1 de '+TOTAL_STEPS+' . Marque todos os sinais de gravidade presentes.</p>';

  if(hasCaudaEquina()){
    h+='<div class="alert-banner" role="alert"><span class="alert-dot"></span>';
    h+='<div><div class="alert-text">Possivel sindrome da cauda equina</div>';
    h+='<div class="alert-detail">Avaliacao neurocirurgica urgente. RM de emergencia. Nao retardar.</div></div></div>';
  }
  if(hasVascularRisk()){
    h+='<div class="alert-banner" role="alert"><span class="alert-dot"></span>';
    h+='<div><div class="alert-text">Risco vascular - considerar emergencia aortica</div>';
    h+='<div class="alert-detail">Dor + doenca vascular: excluir aneurisma roto / disseccao.</div></div></div>';
  }
  if(hasInfectionRisk()){
    h+='<div class="alert-banner warn" role="alert"><span class="alert-dot"></span>';
    h+='<div><div class="alert-text">Risco de infeccao espinhal</div>';
    h+='<div class="alert-detail">Considerar espondilodiscite / abscesso epidural. Lab e imagem precoces.</div></div></div>';
  }

  h+='<div class="options">';
  const groups=[
    {key:'cauda',label:'Cauda equina'},
    {key:'infec',label:'Infeccao'},
    {key:'neopl',label:'Neoplasia'},
    {key:'fratura',label:'Fratura'},
    {key:'vascular',label:'Vascular'},
  ];
  for(const grp of groups){
    const flags=RED_FLAGS.filter(f=>f.group===grp.key);
    h+=`<div class="option-group-label">${grp.label}<span class="group-line"></span></div>`;
    for(const f of flags){
      const ck=redFlags.has(f.id);
      const sev=ck?(f.severity==='critical'?'flag-critical':'flag-warn'):'';
      h+=`<button class="check-btn ${ck?'checked':''} ${sev}" onclick="toggleFlag('${f.id}')" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${f.label}</span></button>`;
    }
  }
  h+='</div>';
  h+='<button class="skip-flags" onclick="next()">Nenhum alarme - avancar</button>';
  h+='<div class="nav-row">';
  h+='<button class="nav-btn primary" onclick="next()">Proximo</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

// ============================================
// STEP 1: PAIN TYPE + DURATION + EVA
// ============================================
function renderPainType(){
  let h=progHTML(1,false);
  h+='<div class="card">';
  h+='<h2>Caracterizacao da Dor</h2>';
  h+='<p class="subtitle">Etapa 2 de '+TOTAL_STEPS+' . Tipo, duracao e intensidade.</p>';

  h+='<div class="section-label">Tipo da dor<span class="sl-line"></span></div>';
  h+='<div class="options">';
  for(const pt of PAIN_TYPES){
    const sel=painType===pt.id;
    h+=`<button class="option-btn ${sel?'selected':''}" onclick="setPainType('${pt.id}')" aria-pressed="${sel}">`;
    h+=`<span class="label"><strong>${pt.label}</strong><br><span style="font-size:.74rem;color:#94a3b8;font-weight:400">${pt.desc}</span></span>`;
    h+=`<span class="tag ${pt.tag}">${pt.tagLabel}</span>`;
    h+='</button>';
  }
  h+='</div>';

  h+='<div class="section-label" style="margin-top:1.1rem">Duracao<span class="sl-line"></span></div>';
  h+='<div class="duration-row">';
  for(const d of DURATIONS){
    const sel=painDuration===d.id;
    h+=`<button class="dur-chip ${sel?'picked':''}" onclick="setDuration('${d.id}')" aria-pressed="${sel}"><span class="dur-label">${d.label}</span><span class="dur-range">${d.range}</span></button>`;
  }
  h+='</div>';

  h+='<div class="section-label" style="margin-top:1.1rem">Intensidade (EVA)<span class="sl-line"></span></div>';
  h+='<div class="eva-container">';
  h+=`<div class="eva-value-box"><div class="eva-value" style="color:${evaColor(evaScore)}">${evaScore}</div><div class="eva-label">EVA</div><div class="eva-intensity" style="color:${evaColor(evaScore)}">${evaIntensityLabel(evaScore)}</div></div>`;
  h+='<div class="eva-slider-wrap">';
  h+=`<input type="range" min="0" max="10" value="${evaScore}" class="eva-slider" style="background:${evaGradient(evaScore)}" oninput="setEva(this.value)" aria-label="Escala de dor 0 a 10">`;
  h+='<div class="eva-anchors"><span>0</span><span>5</span><span>10</span></div>';
  h+='</div></div>';

  const canProceed=painType && painDuration;
  const shakeClass=validationShake&&!canProceed?'shake':'';
  h+=`<div class="validation-hint ${!canProceed?'visible':''} ${shakeClass}" id="validationHint">${!painType?'Selecione o tipo da dor':!painDuration?'Selecione a duracao':''}</div>`;

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+=`<button class="nav-btn primary" ${canProceed?'':'disabled'} onclick="next()">Proximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  validationShake=false;
  updateSliderStyle();
}

function updateSliderStyle(){
  const slider=document.querySelector('.eva-slider');
  if(!slider) return;
  const val=parseInt(slider.value);
  slider.style.background=evaGradient(val);
  const thumbColor=evaColor(val);
  let styleEl=document.getElementById('eva-thumb-style');
  if(!styleEl){styleEl=document.createElement('style');styleEl.id='eva-thumb-style';document.head.appendChild(styleEl)}
  styleEl.textContent=`.eva-slider::-webkit-slider-thumb{background:${thumbColor}} .eva-slider::-moz-range-thumb{background:${thumbColor}}`;
}

// ============================================
// STEP 2: LOCATION + IRRADIATION
// ============================================
function renderLocation(){
  let h=progHTML(2,false);
  h+='<div class="card">';
  h+='<h2>Localizacao e Irradiacao</h2>';
  h+='<p class="subtitle">Etapa 3 de '+TOTAL_STEPS+' . Regiao acometida e padrao de irradiacao.</p>';

  h+='<div class="section-label">Regiao principal<span class="sl-line"></span></div>';
  h+='<div class="options">';
  for(const loc of LOCATIONS){
    const ck=locations.has(loc.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleLocation('${loc.id}')" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${loc.label}<div class="check-desc">${loc.hint}</div></span></button>`;
  }
  h+='</div>';

  if(locations.has('thoracic')){
    h+='<div class="info-box warn">Dor toracica isolada e intrinsecamente mais preocupante. Sempre investigar diagnosticos alternativos (cardiaco, pleural, esofagico).</div>';
  }
  if(locations.has('sacral')){
    h+='<div class="si-test-ref">';
    h+='<strong>Testes provocativos sacroiliacos:</strong><br>';
    h+='<span class="test-name">FABER/Patrick</span> - Flexao, Abducao, Rotacao Externa do quadril<br>';
    h+='<span class="test-name">Gaenslen</span> - Hiperextensao contralateral na borda da maca<br>';
    h+='<span class="test-name">Compressao/Distracao</span> - Compressao lateral das cristas iliacas<br>';
    h+='<span style="color:#64748b;font-size:.62rem">&ge; 3 testes positivos: alta especificidade</span>';
    h+='</div>';
  }

  h+='<div class="section-label" style="margin-top:1.1rem">Irradiacao<span class="sl-line"></span></div>';
  h+='<div class="options">';
  for(const ir of IRRADIATION){
    const ck=irradiation.has(ir.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleIrrad('${ir.id}')" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${ir.label}</span></button>`;
  }
  h+='</div>';

  const canProceed=locations.size>0;
  const shakeClass=validationShake&&!canProceed?'shake':'';
  h+=`<div class="validation-hint ${!canProceed?'visible':''} ${shakeClass}" id="validationHint">Selecione ao menos uma regiao</div>`;

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+=`<button class="nav-btn primary" ${canProceed?'':'disabled'} onclick="next()">Proximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  validationShake=false;
}

// ============================================
// STEP 3: NEURO
// ============================================
function renderNeuro(){
  let h=progHTML(3,false);
  h+='<div class="card">';
  h+='<h2>Avaliacao Neurologica</h2>';
  h+='<p class="subtitle">Etapa 4 de '+TOTAL_STEPS+' . Motor, sensitivo, reflexos, Lasegue, Babinski e marcha.</p>';

  if(neuroSaddleAutoSynced && neuro.sensory==='saddle'){
    h+='<div class="info-box info">Sensibilidade "em sela" pre-selecionada a partir do alarme de anestesia perineal.</div>';
  }

  const filled=neuroFilledCount();
  const total=neuroTotalFields();
  h+=`<div style="font-size:.68rem;color:#64748b;text-align:center;margin-bottom:.3rem;letter-spacing:.04em">${filled} de ${total} campos preenchidos</div>`;

  h+='<div class="options">';
  for(const key of Object.keys(NEURO_TESTS)){
    const test=NEURO_TESTS[key];
    const isFilled=neuro[key]!==null;
    h+=`<div class="section-label"><span class="neuro-field-label"><span class="neuro-field-status ${isFilled?'filled':'empty'}"></span> ${test.label}</span><span class="sl-line"></span></div>`;
    h+='<div class="neuro-grid">';
    for(const opt of test.opts){
      const picked=neuro[key]===opt.v;
      h+=`<button class="score-opt ${picked?'picked':''}" onclick="setNeuro('${key}','${opt.v}')" aria-pressed="${picked}">${opt.l}</button>`;
    }
    h+='</div>';
  }

  const showCervical=locations.has('cervical');
  const showLumbar=locations.has('lumbar') || locations.has('sacral') || (!showCervical);
  if(showLumbar){
    h+='<div class="section-label" style="margin-top:1rem">Dermatomos lombossacros<span class="sl-line"></span></div>';
    h+=buildDermatomeTable(DERMATOMES_LUMBAR);
  }
  if(showCervical){
    h+='<div class="section-label" style="margin-top:1rem">Dermatomos cervicais<span class="sl-line"></span></div>';
    h+=buildDermatomeTable(DERMATOMES_CERVICAL);
  }
  h+='</div>';

  const allFilled=filled===total;
  const missing=Object.keys(NEURO_TESTS).filter(k=>neuro[k]===null).map(k=>NEURO_TESTS[k].label);
  const shakeClass=validationShake&&!allFilled?'shake':'';
  h+=`<div class="validation-hint ${!allFilled?'visible':''} ${shakeClass}" id="validationHint">Falta: ${missing.join(', ')}</div>`;

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+=`<button class="nav-btn primary" ${allFilled?'':'disabled'} onclick="next()">Proximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  validationShake=false;
}

function buildDermatomeTable(rows){
  let h='<div class="dermatome-hint">';
  h+='<div class="derm-row" style="font-weight:700;color:#64748b;font-size:.58rem;border-bottom:1px solid #1e293b"><span class="derm-level">Nivel</span><span style="flex:1">Motor</span><span style="min-width:5rem">Sensitivo</span><span style="min-width:3rem">Reflexo</span></div>';
  for(const d of rows){
    h+=`<div class="derm-row"><span class="derm-level">${d.level}</span><span style="flex:1">${d.motor}</span><span style="color:#64748b;font-size:.62rem;min-width:5rem">${d.sensory}</span><span style="color:#93c5fd;font-size:.62rem;min-width:3rem">${d.reflex}</span></div>`;
  }
  h+='</div>';
  return h;
}

// ============================================
// STEP 4: SYMPTOMS
// ============================================
function renderSymptoms(){
  let h=progHTML(4,false);
  h+='<div class="card">';
  h+='<h2>Sintomas Associados</h2>';
  h+='<p class="subtitle">Etapa 5 de '+TOTAL_STEPS+' . Marque todos os sintomas presentes.</p>';
  h+='<div class="options">';
  for(const sx of ASSOC_SYMPTOMS){
    const ck=symptoms.has(sx.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSymptom('${sx.id}')" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${sx.label}</span></button>`;
  }
  h+='</div>';

  const hints=[];
  if(symptoms.has('morning_stiffness') && painType==='nonmechanical')
    hints.push('Rigidez matinal + padrao inflamatorio: considerar espondiloartropatia (especialmente se < 45 anos).');
  if(symptoms.has('abd_pain') && painType==='referred')
    hints.push('Dor abdominal + padrao referido: excluir patologia visceral (renal, pancreatica, ginecologica, aortica).');
  if(symptoms.has('gait_change') && symptoms.has('paresthesia'))
    hints.push('Alteracao de marcha + parestesias: sugestivo de mielopatia ou compressao medular.');
  if(symptoms.has('bilateral_sx') && symptoms.has('claudication'))
    hints.push('Claudicacao neurogenica bilateral: padrao de estenose de canal lombar.');
  if(symptoms.has('wt_bearing_pain') && hasFractureRisk())
    hints.push('Dor ao carregar peso + risco de fratura: considerar fratura vertebral por insuficiencia.');
  if(symptoms.has('hip_pain') && locations.has('lumbar'))
    hints.push('Dor no quadril + lombar: excluir coxartrose como causa primaria (testar rotacao interna do quadril).');

  if(hints.length>0){
    h+='<div style="margin-top:.7rem">';
    for(const hint of hints) h+=`<div class="info-box info">${hint}</div>`;
    h+='</div>';
  }

  if(painDuration==='chronic'){
    h+='<div class="yellow-flag-box">';
    h+='<strong>Yellow flags (fatores psicossociais):</strong> catastrofizacao, cinesiofobia, depressao, insatisfacao laboral, baixa expectativa de recuperacao. ';
    h+='<span style="color:#818cf8">Instrumentos: STarT Back, Orebro, PHQ-9.</span>';
    h+='</div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Ver Resultado</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

// ============================================
// STEP 5: RESULT
// ============================================
function renderResult(){
  const risk=getRiskLevel();
  const imaging=needsImaging();
  const fc=flagCount();

  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  const badgeCfg={
    emergent:{cls:'risk-emergent',icon:'!!!',title:'Emergencia',desc:'Avaliacao imediata. Risco de lesao neurologica irreversivel ou ameaca a vida.'},
    urgent:{cls:'risk-urgent',icon:'!',title:'Urgente',desc:'Red flags presentes. Investigar antes da alta.'},
    routine:{cls:'risk-routine',icon:'\u2713',title:'Rotina',desc:'Sem sinais de alarme significativos. Manejo conservador inicial.'},
  }[risk];

  h+=`<div class="result-badge ${badgeCfg.cls}">${badgeCfg.icon}</div>`;
  h+=`<div class="result-title">${badgeCfg.title}</div>`;
  h+=`<div class="result-desc">${badgeCfg.desc}</div>`;

  if(fc>0) h+=`<span class="flag-count has-flags">${fc} red flag${fc>1?'s':''}</span>`;
  else h+=`<span class="flag-count no-flags">Sem red flags</span>`;
  h+=`<span class="flag-count" style="background:${evaColor(evaScore)}20;color:${evaColor(evaScore)};border:1px solid ${evaColor(evaScore)}55">EVA ${evaScore}/10 . ${evaIntensityLabel(evaScore)}</span>`;

  if(risk==='routine' && fc===1){
    h+='<div style="margin-top:.7rem;padding:.6rem;border-radius:.5rem;background:#0f172a;border:1px solid #1e293b;font-size:.76rem;color:#94a3b8;text-align:left;line-height:1.45">1 red flag isolado, sem padrao de alto risco. Seguimento ambulatorial com atencao.</div>';
  }

  h+=collapsible('flags','Red flags identificados',()=>{
    let s='';
    if(fc===0){
      s+='<p style="color:#86efac;font-size:.82rem;text-align:center;padding:.4rem 0">Nenhum sinal de alarme identificado.</p>';
    }else{
      for(const f of RED_FLAGS){
        if(redFlags.has(f.id)){
          const dotCls=f.severity==='critical'?'dot-red':'dot-yellow';
          s+=`<div class="summary-row"><span class="criteria">${f.label}</span><span class="value"><span class="dot ${dotCls}"></span>Presente</span></div>`;
        }
      }
      if(hasCaudaEquina()) s+=syndromeLine('Sindrome da cauda equina suspeitada','alert');
      if(hasInfectionRisk()) s+=syndromeLine('Risco de infeccao espinhal','warn');
      if(hasCancerRisk()) s+=syndromeLine('Risco de neoplasia','warn');
      if(hasFractureRisk()) s+=syndromeLine('Risco de fratura','warn');
      if(hasVascularRisk()) s+=syndromeLine('Risco vascular - excluir emergencia aortica','alert');
    }
    return s;
  });

  h+=collapsible('classification','Classificacao clinica',()=>{
    let s='';
    const pt=PAIN_TYPES.find(p=>p.id===painType);
    const ptDot=painType==='mechanical'?'dot-blue':painType==='nonmechanical'?'dot-yellow':'dot-red';
    s+=`<div class="summary-row"><span class="criteria">Tipo de dor</span><span class="value"><span class="dot ${ptDot}"></span>${pt?pt.label:'--'}</span></div>`;
    const d=DURATIONS.find(x=>x.id===painDuration);
    s+=`<div class="summary-row"><span class="criteria">Duracao</span><span class="value">${d?d.label+' ('+d.range+')':'--'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Intensidade (EVA)</span><span class="value" style="color:${evaColor(evaScore)}">${evaScore}/10 . ${evaIntensityLabel(evaScore)}</span></div>`;
    const locNames=[...locations].map(id=>LOCATIONS.find(x=>x.id===id)?.label||id);
    s+=`<div class="summary-row"><span class="criteria">Localizacao</span><span class="value">${locNames.join(', ')||'--'}</span></div>`;
    const irNames=[...irradiation].map(id=>IRRADIATION.find(x=>x.id===id)?.label||id);
    s+=`<div class="summary-row"><span class="criteria">Irradiacao</span><span class="value">${irNames.length>0?irNames.join(', '):'Nao informada'}</span></div>`;
    return s;
  });

  h+=collapsible('neuro_detail','Exame neurologico',()=>{
    let s='';
    for(const key of Object.keys(NEURO_TESTS)){
      const test=NEURO_TESTS[key];
      const val=neuro[key];
      const optLabel=val?test.opts.find(o=>o.v===val)?.l:'--';
      const isAb=val && val!=='normal' && val!=='negative' && val!=='not_done';
      s+=`<div class="summary-row"><span class="criteria">${test.label}</span><span class="value"><span class="dot ${isAb?'dot-yellow':'dot-green'}"></span>${optLabel}</span></div>`;
    }
    // Consolidated warnings - no duplication
    if(hasUMN()) s+='<div class="info-box alert" style="margin-top:.7rem">Sinais de neuronio motor superior - considerar mielopatia / compressao medular.</div>';
    if(neuro.gait==='steppage') s+='<div class="info-box warn" style="margin-top:.4rem">Marcha escarvante (pe caido) - deficit L4-L5 significativo. RM urgente.</div>';
    if(neuro.sensory==='dermatomal' && neuro.slr && neuro.slr.startsWith('positive')) s+='<div class="info-box info" style="margin-top:.4rem">Lasegue positivo + dermatomo definido - padrao de radiculopatia compressiva.</div>';
    if((neuro.motor==='grave' || neuro.motor==='moderado') && irradiation.has('bilateral_legs')) s+='<div class="info-box alert" style="margin-top:.4rem">Deficit motor bilateral - alto risco de compressao medular ou cauda equina.</div>';
    return s;
  });

  h+=collapsible('symptoms_detail','Sintomas associados',()=>{
    let s='';
    if(symptoms.size===0){
      s+='<p style="color:#64748b;font-size:.82rem;text-align:center;padding:.4rem 0">Nenhum sintoma associado selecionado.</p>';
    }else{
      for(const sx of ASSOC_SYMPTOMS){
        if(symptoms.has(sx.id)) s+=`<div class="summary-row"><span class="criteria">${sx.label}</span><span class="value"><span class="dot dot-blue"></span>Presente</span></div>`;
      }
    }
    if(symptoms.has('morning_stiffness') && painType==='nonmechanical')
      s+='<div class="info-box info" style="margin-top:.7rem">Rigidez matinal + dor inflamatoria: espondiloartropatia. Solicitar HLA-B27, PCR, sacroiliacas em RX/RM.</div>';
    return s;
  });

  h+=collapsible('workup','Investigacao sugerida',()=>buildWorkup(risk,imaging));
  h+=buildConduta(risk);
  h+=collapsible('diferencial','Diagnosticos diferenciais',()=>buildDifferentials(risk));
  h+=collapsible('note','Nota para prontuario',()=>buildNoteContent(risk,imaging));

  h+='<div class="disclaimer">Ferramenta de apoio a decisao clinica . nao substitui julgamento medico. Correlacione com a apresentacao completa.</div>';

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn danger" onclick="confirmRestart()">Recomecar</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function syndromeLine(text,level){
  return `<div class="info-box ${level}" style="margin-top:.6rem;font-weight:600">${text}</div>`;
}

function collapsible(id,title,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')" role="button" aria-expanded="${open}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('${id}')}">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BE</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':''}">`;
  if(open)h+=contentFn();
  h+='</div></div>';
  return h;
}

// ============================================
// WORKUP
// ============================================
function buildWorkup(risk,imaging){
  let s='';
  if(risk==='emergent'){
    s+='<div class="info-box alert" style="font-weight:600;margin-bottom:.6rem;font-size:.8rem">Imagem imediata indicada</div>';
    s+=`<div class="summary-row"><span class="criteria">Exame prioritario</span><span class="value" style="color:#fca5a5">RM da coluna (emergencia)</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Se RM indisponivel</span><span class="value">TC da coluna</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Laboratorio</span><span class="value">HMG, PCR, VHS, hemocultura</span></div>`;
    if(hasCaudaEquina()){
      s+=`<div class="summary-row"><span class="criteria">Avaliacao</span><span class="value" style="color:#fca5a5">Neurocirurgia urgente</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Adicional</span><span class="value">Residuo pos-miccional (USG ou cateterismo)</span></div>`;
    }
    if(hasInfectionRisk()){
      s+=`<div class="summary-row"><span class="criteria">Avaliacao</span><span class="value" style="color:#fca5a5">Infectologia / ATB empirica</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Lab adicional</span><span class="value">Procalcitonina, lactato, urina I</span></div>`;
    }
    if(hasVascularRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem vascular</span><span class="value" style="color:#fca5a5">AngioTC aorta</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Avaliacao</span><span class="value" style="color:#fca5a5">Cirurgia vascular de emergencia</span></div>`;
    }
    if(hasUMN()){
      s+=`<div class="summary-row"><span class="criteria">Mielopatia</span><span class="value" style="color:#fca5a5">RM cervical + toracica</span></div>`;
    }
  } else if(risk==='urgent'){
    s+='<div class="info-box warn" style="font-weight:600;margin-bottom:.6rem;font-size:.8rem">Investigacao complementar indicada</div>';
    if(hasCancerRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">RX coluna + RM se RX alterado</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Laboratorio</span><span class="value">HMG, VHS, PCR, FA, Ca, eletroforese</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Rastreio</span><span class="value">PSA (H) / Mamografia (M) conforme idade</span></div>`;
    }
    if(hasInfectionRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">RM da coluna</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Laboratorio</span><span class="value">HMG, PCR, VHS, procalcitonina, hemocultura x2</span></div>`;
    }
    if(hasFractureRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">RX coluna (AP + Perfil)</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Se alterado</span><span class="value">TC para detalhamento osseo</span></div>`;
      if(redFlags.has('osteoporosis')||redFlags.has('corticoid'))
        s+=`<div class="summary-row"><span class="criteria">Adicional</span><span class="value">Densitometria ambulatorial, Vit D, Ca, PTH</span></div>`;
    }
    if(hasVascularRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">USG abdominal ou AngioTC</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Avaliacao</span><span class="value">Cirurgia vascular</span></div>`;
    }
    if(!hasCancerRisk() && !hasInfectionRisk() && !hasFractureRisk() && !hasVascularRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">RX coluna inicialmente</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Laboratorio</span><span class="value">HMG, VHS, PCR basais</span></div>`;
    }
    if(neuro.motor && neuro.motor!=='normal') s+=`<div class="summary-row"><span class="criteria">Deficit motor</span><span class="value" style="color:#fcd34d">Considerar RM precoce</span></div>`;
    if(hasUMN()) s+=`<div class="summary-row"><span class="criteria">Sinais NMS</span><span class="value" style="color:#fcd34d">RM para excluir mielopatia</span></div>`;
    if(neuro.gait==='steppage') s+=`<div class="summary-row"><span class="criteria">Pe caido</span><span class="value" style="color:#fcd34d">RM + ENMG</span></div>`;
    if(locations.has('thoracic')) s+=`<div class="summary-row"><span class="criteria">Dor toracica</span><span class="value" style="color:#fcd34d">ECG + RX torax + RM toracica</span></div>`;
  } else {
    s+='<div class="info-box" style="background:#081a10;border:1px solid #14532d;color:#86efac;font-weight:600;margin-bottom:.6rem;font-size:.8rem">Imagem nao indicada inicialmente</div>';
    s+=`<div class="summary-row"><span class="criteria">Conduta inicial</span><span class="value">Manejo conservador 4-6 sem</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">Apenas se sem melhora em 4-6 sem</span></div>`;
    if(symptoms.has('radiculopathy') && (neuro.slr==='positive_uni' || neuro.slr==='positive_bi'))
      s+=`<div class="summary-row"><span class="criteria">Radiculopatia + Lasegue+</span><span class="value" style="color:#93c5fd">RM se persistente &gt; 6 sem</span></div>`;
    if(painType==='nonmechanical')
      s+=`<div class="summary-row"><span class="criteria">Dor inflamatoria</span><span class="value">HLA-B27, PCR, VHS, RX sacroiliacas</span></div>`;
    if(painDuration==='chronic')
      s+=`<div class="summary-row"><span class="criteria">Dor cronica</span><span class="value">RX + encaminhamento ambulatorial</span></div>`;
    if(neuro.motor==='leve')
      s+=`<div class="summary-row"><span class="criteria">Leve deficit motor</span><span class="value" style="color:#93c5fd">Reavaliacao precoce; RM se progressao</span></div>`;
  }
  return s;
}

// ============================================
// CONDUTA
// ============================================
function buildConduta(risk){
  let cls,title,items;
  if(risk==='emergent'){
    cls='alta-prob';title='Conduta de emergencia';
    items=[
      ['RM de emergencia da coluna','Solicitar com urgencia; TC se RM indisponivel'],
      ['Avaliacao neurocirurgica imediata','Contato direto com plantonista'],
      ['Acesso venoso + laboratorio completo','HMG, PCR, VHS, Ur, Cr, hemocultura'],
      ['Monitorar funcao neurologica seriadamente','Forca, sensibilidade, esfincteres a cada 2-4h'],
      ['Analgesia IV','Dipirona 1g IV + Tramadol 50-100mg IV. Dexametasona 10mg IV se compressao medular.'],
    ];
    if(hasInfectionRisk())
      items.push(['ATB empirica','Oxacilina 2g IV 4/4h + Ceftriaxona 2g IV 12/12h. Vanco se risco de MRSA. Ajustar por cultura.']);
    if(hasVascularRisk())
      items.push(['AngioTC aorta + cirurgia vascular','Tipagem sanguinea, reserva de hemocomponentes']);
    if(hasCaudaEquina())
      items.push(['Cateterismo vesical + residuo pos-miccional','Documentar funcao esfincteriana basal']);
  } else if(risk==='urgent'){
    cls='mod-prob';title='Conduta urgente';
    items=[
      ['Investigacao complementar conforme red flags','Nao dar alta antes do resultado da imagem'],
      ['Imagem da coluna','RX se fratura; RM se infeccao / neoplasia / deficit motor'],
      ['Laboratorio: HMG, VHS, PCR','Adicionar conforme suspeita especifica'],
      ['Analgesia escalonada','1) Dipirona 1g VO/IV 6/6h . 2) Cetoprofeno 100mg VO/IV 12/12h . 3) Tramadol 50mg VO 6/6h SN'],
      ['Reavaliacao em 48-72h','Ou antes se piora. Orientar sinais de alarme.'],
    ];
    if(hasCancerRisk())
      items.push(['Rastreio oncologico + encaminhamento','Eletroforese, marcadores tumorais']);
    if(locations.has('thoracic'))
      items.push(['Excluir causa extra-espinhal','ECG e RX torax para dor toracica']);
    items.push(['Cuidado com AINEs','Contraindicados em DRC (TFG < 30), ulcera ativa, anticoagulacao. IBP se uso > 5 dias.']);
  } else {
    cls='baixa-prob';title='Manejo conservador';
    items=[
      ['Sem indicacao de imagem neste momento','Imagem precoce nao melhora desfecho em dor inespecifica'],
      ['Analgesia regular 5-7 dias','Dipirona 1g VO 6/6h + Ibuprofeno 400mg VO 8/8h (com alimentacao)'],
      ['Manter atividades conforme tolerado','Evitar repouso absoluto; atividade leve acelera recuperacao'],
      ['Educacao sobre prognostico','Maioria resolve em 4-6 sem; raramente e doenca grave'],
      ['Retorno precoce','Piora, sintomas novos, febre, ou sem melhora em 4-6 sem'],
      ['Precaucoes com AINEs','Contraindicado em DRC, ulcera ativa, anticoagulacao. Limitar a 5-7 dias. Tomar com alimento.'],
    ];
    if(painType==='nonmechanical')
      items.push(['Considerar reumatologia','Se < 45 anos + rigidez matinal > 30min + sacroileite']);
    if(symptoms.has('radiculopathy'))
      items.push(['Dor neuropatica','Gabapentina 300mg VO a noite; titular ate 900-1200mg/dia']);
    if(evaScore>=7)
      items.push(['Dor intensa (EVA >= 7)','Ciclobenzaprina 5mg VO 8/8h por 5-7 dias; sonolencia e efeito comum']);
    if(painDuration==='chronic'){
      items.push(['Encaminhamento ambulatorial','Fisioterapia + avaliacao psicossocial (yellow flags)']);
      items.push(['Abordagem biopsicossocial','Catastrofizacao, cinesiofobia, depressao/ansiedade. Instrumentos: STarT Back, PHQ-9.']);
    }
    items.push(['Retorno gradual as atividades','Caminhada desde o inicio. Evitar carga pesada por 2-4 sem.']);
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${cls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')" role="button" aria-expanded="${open}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('conduta')}"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BE</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':''}">`;
  if(open){
    for(const [text,detail] of items){
      h+=`<div class="conduta-item"><span class="conduta-bullet"></span><span style="flex:1">${text}`;
      if(detail) h+=`<div class="conduta-detail">${detail}</div>`;
      h+=`</span></div>`;
    }
  }
  h+='</div></div>';
  return h;
}

// ============================================
// DIFFERENTIALS
// ============================================
function buildDifferentials(risk){
  let diffs=[];
  if(locations.has('lumbar')){
    diffs.push({name:'Lombalgia mecanica inespecifica',prob:risk==='routine'?'high':'mod',note:'Causa mais comum (85-90%); diagnostico de exclusao'});
    if(symptoms.has('radiculopathy') || irradiation.has('below_knee'))
      diffs.push({name:'Hernia discal com radiculopatia',prob:'mod',note:'Dor abaixo do joelho + Lasegue positivo; L4-L5 e L5-S1 mais comuns'});
    if(symptoms.has('claudication'))
      diffs.push({name:'Estenose de canal lombar',prob:'mod',note:'Claudicacao neurogenica, melhora ao sentar/fletir; > 60 anos'});
    if(symptoms.has('hip_pain'))
      diffs.push({name:'Dor referida do quadril (coxartrose)',prob:'low',note:'Testar rotacao interna do quadril'});
    if(irradiation.has('buttock') || irradiation.has('posterior_thigh'))
      diffs.push({name:'Sindrome do piriforme',prob:'low',note:'Dor glutea com irradiacao para coxa posterior; teste FAIR'});
  }
  if(locations.has('cervical')){
    diffs.push({name:'Cervicalgia mecanica',prob:risk==='routine'?'high':'mod',note:'Dor muscular/articular cervical'});
    if(irradiation.has('upper_limb'))
      diffs.push({name:'Cervicobraquialgia / Radiculopatia cervical',prob:'mod',note:'Irradiacao dermatomal para MS; Spurling positivo'});
    if(hasUMN())
      diffs.push({name:'Mielopatia cervical',prob:'high',note:'Sinais de NMS + cervicalgia - urgente; RM'});
  }
  if(locations.has('thoracic')){
    diffs.push({name:'Dor toracica musculoesqueletica',prob:'mod',note:'Sempre investigar alternativas'});
    if(hasUMN())
      diffs.push({name:'Mielopatia toracica',prob:'high',note:'Sinais de NMS + dor toracica - RM toracica urgente'});
    diffs.push({name:'Fratura vertebral por insuficiencia',prob:risk==='routine'?'low':'mod',note:'Idosos / osteoporose; dor aguda localizada'});
    if(painDuration==='chronic')
      diffs.push({name:'Doenca de Scheuermann',prob:'low',note:'Adolescentes/adultos jovens; dor cronica dorsal; cunha vertebral'});
    if(neuro.sensory==='dermatomal')
      diffs.push({name:'Herpes zoster',prob:'low',note:'Dor dermatomal unilateral; pode preceder vesiculas em 2-3 dias'});
  }
  if(locations.has('sacral')){
    diffs.push({name:'Disfuncao sacroiliaca',prob:'mod',note:'Testes provocativos (FABER, Gaenslen, compressao)'});
    if(painType==='nonmechanical')
      diffs.push({name:'Espondiloartropatia',prob:'mod',note:'< 45 anos + rigidez matinal + melhora com atividade; HLA-B27'});
  }

  if(hasCaudaEquina())
    diffs.push({name:'Sindrome da cauda equina',prob:'high',note:'Emergencia - RM + neurocirurgia imediatas'});
  if(hasInfectionRisk())
    diffs.push({name:'Espondilodiscite / Abscesso epidural',prob:'high',note:'Febre + dor + fator de risco; mortalidade se atraso'});
  if(hasCancerRisk())
    diffs.push({name:'Metastase vertebral',prob:'high',note:'Cancer previo + dor progressiva noturna; pulmao, mama, prostata'});
  if(hasFractureRisk())
    diffs.push({name:'Fratura vertebral (traumatica ou patologica)',prob:'high',note:'Trauma ou osteoporose + dor localizada'});
  if(hasVascularRisk())
    diffs.push({name:'Aneurisma de aorta abdominal',prob:'high',note:'Dor + doenca vascular; AngioTC urgente'});

  if(painType==='referred'){
    diffs.push({name:'Dor referida visceral',prob:'mod',note:'Renal, pancreatica, ginecologica. Sem relacao postural.'});
    diffs.push({name:'Nefrolitiase / Pielonefrite',prob:'mod',note:'Flanco + sintomas urinarios; urina I + USG renal'});
  }
  if(painType==='nonmechanical' && !locations.has('sacral'))
    diffs.push({name:'Espondiloartropatia',prob:'low',note:'< 45 anos + rigidez matinal > 30min; HLA-B27'});
  if(neuro.sensory==='dermatomal' && !locations.has('thoracic'))
    diffs.push({name:'Herpes zoster',prob:'low',note:'Dor dermatomal unilateral; ardencia; idosos/imunossuprimidos'});
  if(risk==='routine'){
    if(!symptoms.has('radiculopathy') && !symptoms.has('claudication'))
      diffs.push({name:'Distensao muscular / ligamentar',prob:'high',note:'Historia de esforco; resolucao em 2-4 sem'});
    diffs.push({name:'Sindrome dolorosa miofascial',prob:'mod',note:'Pontos-gatilho; dor referida previsivel'});
    if(painDuration==='chronic' && (neuro.sensory==='difusa' || symptoms.has('paresthesia')))
      diffs.push({name:'Fibromialgia',prob:'low',note:'Dor difusa > 3 meses; fadiga; criterios ACR 2016'});
  }
  if(painDuration==='chronic' && risk==='routine')
    diffs.push({name:'Dor nao-organica (sinais de Waddell)',prob:'low',note:'>= 3 categorias positivas sugerem; nao exclui doenca organica'});

  // Dedup
  const seen=new Set();
  diffs=diffs.filter(d=>{if(seen.has(d.name)) return false;seen.add(d.name);return true});
  const probOrder={high:0,mod:1,low:2};
  diffs.sort((a,b)=>probOrder[a.prob]-probOrder[b.prob]);

  let s='<div class="diff-box">';
  if(diffs.length===0){
    s+='<p style="color:#64748b;font-size:.78rem;text-align:center;padding:.4rem 0">Avalie o quadro clinico completo.</p>';
  }else{
    for(const d of diffs){
      const label={high:'Provavel',mod:'Considerar',low:'Menos prov.'}[d.prob];
      const probCls={high:'prob-high',mod:'prob-mod',low:'prob-low'}[d.prob];
      s+=`<div class="diff-item"><span class="diff-prob ${probCls}">${label}</span><span style="flex:1"><strong>${d.name}</strong><br><span style="font-size:.66rem;color:#94a3b8">${d.note}</span></span></div>`;
    }
  }
  s+='</div>';
  return s;
}

// ============================================
// NOTE
// ============================================
function buildNoteContent(risk,imaging){
  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  let n='';
  n+=`DOR NAS COSTAS - AVALIACAO ESTRUTURADA\n`;
  n+=`Data/hora: ${ts}\n`;
  n+=`========================================\n\n`;

  n+=`RED FLAGS: ${flagCount()} identificado(s)\n`;
  if(flagCount()===0) n+=`  Nenhum sinal de alarme.\n`;
  else for(const f of RED_FLAGS) if(redFlags.has(f.id)) n+=`  [!] ${f.label}\n`;
  if(hasCaudaEquina()) n+=`  >>> SINDROME DA CAUDA EQUINA SUSPEITADA <<<\n`;
  if(hasInfectionRisk()) n+=`  >>> RISCO DE INFECCAO ESPINHAL <<<\n`;
  if(hasCancerRisk()) n+=`  >>> RISCO DE NEOPLASIA <<<\n`;
  if(hasFractureRisk()) n+=`  >>> RISCO DE FRATURA <<<\n`;
  if(hasVascularRisk()) n+=`  >>> RISCO VASCULAR - EXCLUIR EMERGENCIA AORTICA <<<\n`;

  const pt=PAIN_TYPES.find(p=>p.id===painType);
  const d=DURATIONS.find(x=>x.id===painDuration);
  n+=`\nCLASSIFICACAO:\n`;
  n+=`  Tipo: ${pt?pt.label:'Nao classificada'}\n`;
  n+=`  Duracao: ${d?d.label+' ('+d.range+')':'Nao informada'}\n`;
  n+=`  EVA: ${evaScore}/10 - ${evaIntensityLabel(evaScore)}\n`;
  const locNames=[...locations].map(id=>LOCATIONS.find(x=>x.id===id)?.label||id);
  n+=`  Localizacao: ${locNames.join(', ')||'Nao informada'}\n`;
  const irNames=[...irradiation].map(id=>IRRADIATION.find(x=>x.id===id)?.label||id);
  n+=`  Irradiacao: ${irNames.length>0?irNames.join(', '):'Nenhuma'}\n`;

  n+=`\nEXAME NEUROLOGICO:\n`;
  for(const key of Object.keys(NEURO_TESTS)){
    const test=NEURO_TESTS[key];
    const val=neuro[key];
    const optLabel=val?test.opts.find(o=>o.v===val)?.l:'Nao avaliado';
    const ab=val && val!=='normal' && val!=='negative' && val!=='not_done';
    n+=`  ${test.label}: ${optLabel}${ab?' [ALTERADO]':''}\n`;
  }
  if(hasUMN()) n+=`  >>> SINAIS DE NEURONIO MOTOR SUPERIOR <<<\n`;
  if(neuro.gait==='steppage') n+=`  >>> MARCHA ESCARVANTE - PE CAIDO <<<\n`;
  if(neuro.sensory==='saddle') n+=`  >>> ANESTESIA EM SELA - CAUDA EQUINA <<<\n`;

  n+=`\nSINTOMAS ASSOCIADOS:\n`;
  if(symptoms.size===0) n+=`  Nenhum.\n`;
  else for(const sx of ASSOC_SYMPTOMS) if(symptoms.has(sx.id)) n+=`  - ${sx.label}\n`;

  const riskLabels={emergent:'EMERGENCIA',urgent:'URGENTE',routine:'ROTINA'};
  n+=`\nESTRATIFICACAO: ${riskLabels[risk]}\n`;
  const imgLabels={immediate:'IMEDIATA (RM emergencia)',urgent:'URGENTE (RM/RX)',consider:'CONSIDERAR (se persistente)',none:'NAO INDICADA (conservador)'};
  n+=`Imagem: ${imgLabels[imaging]}\n`;

  n+=`\nCONDUTA:\n`;
  if(risk==='emergent'){
    n+=`  - RM de emergencia da coluna\n`;
    n+=`  - Avaliacao neurocirurgica imediata\n`;
    n+=`  - Laboratorio completo + acesso venoso\n`;
    n+=`  - Analgesia: Dipirona 1g IV + Tramadol 50-100mg IV\n`;
    if(hasInfectionRisk()) n+=`  - Hemocultura x2 + ATB empirica (Oxacilina + Ceftriaxona)\n`;
    if(hasCaudaEquina()) n+=`  - Cateterismo + residuo pos-miccional\n`;
    if(hasVascularRisk()) n+=`  - AngioTC de aorta + cirurgia vascular urgente\n`;
    if(hasUMN()) n+=`  - RM cervical + toracica (investigar mielopatia)\n`;
  }else if(risk==='urgent'){
    n+=`  - Investigacao complementar (imagem + laboratorio)\n`;
    n+=`  - Analgesia: Dipirona 1g 6/6h + Cetoprofeno 100mg 12/12h\n`;
    n+=`  - AINEs contraindicados em DRC, ulcera ativa, anticoagulacao\n`;
    n+=`  - Reavaliacao em 48-72h\n`;
    n+=`  - Sinais de alarme orientados para retorno imediato\n`;
    if(locations.has('thoracic')) n+=`  - ECG + RX torax (excluir causa cardiaca/pleural)\n`;
  }else{
    n+=`  - Manejo conservador\n`;
    n+=`  - Analgesia: Dipirona 1g VO 6/6h + Ibuprofeno 400mg VO 8/8h por 5-7 dias\n`;
    n+=`  - Ibuprofeno contraindicado em DRC, ulcera ativa, anticoagulacao\n`;
    n+=`  - Manter atividade conforme tolerado (caminhada desde o inicio)\n`;
    n+=`  - Retorno se: piora, febre, sintomas novos, sem melhora em 4-6 sem\n`;
    if(symptoms.has('radiculopathy')) n+=`  - Gabapentina 300mg VO a noite (dor neuropatica)\n`;
    if(evaScore>=7) n+=`  - Ciclobenzaprina 5mg VO 8/8h por 5-7 dias\n`;
    if(painDuration==='chronic'){
      n+=`  - Encaminhamento para fisioterapia + reavaliacao ambulatorial\n`;
      n+=`  - Avaliacao yellow flags (catastrofizacao, cinesiofobia, depressao)\n`;
    }
  }

  n+=`\n========================================\n`;
  n+=`Gerado por: Avaliador de Dor nas Costas v6\n`;
  n+=`Ferramenta de apoio - nao substitui julgamento clinico.\n`;

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el) return;
  const text=el.textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onCopySuccess).catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');onCopySuccess()}catch(e){alert('Nao foi possivel copiar. Selecione o texto manualmente.')}
  document.body.removeChild(ta);
}
function onCopySuccess(){
  const btn=document.getElementById('copyBtn');
  if(!btn) return;
  btn.textContent='\u2713 Copiado';btn.classList.add('copied');
  haptic('success');
  setTimeout(()=>{btn.textContent='Copiar nota';btn.classList.remove('copied')},2000);
}

// ============================================
// ACTIONS
// ============================================
function toggleFlag(id){redFlags.has(id)?redFlags.delete(id):redFlags.add(id);haptic('light');render()}
function setPainType(id){painType=id;haptic('light');render()}
function setDuration(id){painDuration=id;haptic('light');render()}
function setEva(val){
  evaScore=parseInt(val);
  const valBox=document.querySelector('.eva-value');
  const intBox=document.querySelector('.eva-intensity');
  if(valBox){valBox.textContent=evaScore;valBox.style.color=evaColor(evaScore)}
  if(intBox){intBox.textContent=evaIntensityLabel(evaScore);intBox.style.color=evaColor(evaScore)}
  updateSliderStyle();
  const canProceed=painType && painDuration;
  const navBtn=document.querySelector('.nav-btn.primary');
  if(navBtn) navBtn.disabled=!canProceed;
  const hint=document.getElementById('validationHint');
  if(hint){
    if(canProceed){hint.classList.remove('visible');hint.textContent=''}
    else{hint.classList.add('visible');hint.textContent=!painType?'Selecione o tipo da dor':'Selecione a duracao'}
  }
}
function toggleLocation(id){locations.has(id)?locations.delete(id):locations.add(id);haptic('light');render()}
function toggleIrrad(id){
  if(id==='none'){
    if(irradiation.has('none') && irradiation.size===1) irradiation.clear();
    else irradiation=new Set(['none']);
  }else{
    irradiation.delete('none');
    irradiation.has(id)?irradiation.delete(id):irradiation.add(id);
  }
  haptic('light');render();
}
function setNeuro(field,val){
  if(neuro[field]===val){
    neuro[field]=null;
    if(field==='sensory' && val==='saddle') neuroSaddleAutoSynced=false;
  }else{
    neuro[field]=val;
    if(field==='sensory' && val!=='saddle') neuroSaddleAutoSynced=false;
  }
  haptic('light');render();
}
function toggleSymptom(id){symptoms.has(id)?symptoms.delete(id):symptoms.add(id);haptic('light');render()}
function toggleSection(id){sections[id]=!sections[id];render()}

function next(){
  if(currentStep===1 && (!painType || !painDuration)){
    validationShake=true;render();
    setTimeout(()=>document.getElementById('validationHint')?.scrollIntoView({behavior:'smooth',block:'center'}),50);
    haptic('medium');return;
  }
  if(currentStep===2 && locations.size===0){
    validationShake=true;render();
    setTimeout(()=>document.getElementById('validationHint')?.scrollIntoView({behavior:'smooth',block:'center'}),50);
    haptic('medium');return;
  }
  if(currentStep===3 && !Object.values(neuro).every(v=>v!==null)){
    validationShake=true;render();
    setTimeout(()=>document.getElementById('validationHint')?.scrollIntoView({behavior:'smooth',block:'center'}),50);
    haptic('medium');return;
  }
  currentStep++;
  haptic('success');
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){if(currentStep>0){currentStep--;render();window.scrollTo({top:0,behavior:'smooth'})}}

function confirmRestart(){
  overlayRoot.innerHTML=`
    <div class="restart-overlay" onclick="if(event.target===this)dismissRestart()">
      <div class="restart-dialog">
        <h3>Recomecar avaliacao?</h3>
        <p>Todos os dados preenchidos serao apagados.</p>
        <div class="dialog-btns">
          <button style="background:#1e293b;color:#cbd5e1" onclick="dismissRestart()">Cancelar</button>
          <button style="background:#7f1d1d;color:#fca5a5" onclick="doRestart()">Recomecar</button>
        </div>
      </div>
    </div>`;
}
function dismissRestart(){overlayRoot.innerHTML=''}
function doRestart(){
  overlayRoot.innerHTML='';
  currentStep=0;redFlags=new Set();painType=null;painDuration=null;evaScore=5;
  locations=new Set();irradiation=new Set();
  neuro={motor:null,sensory:null,reflex:null,slr:null,babinski:null,gait:null};
  symptoms=new Set();neuroSaddleAutoSynced=false;validationShake=false;
  sections={flags:true,classification:false,location:false,neuro_detail:false,symptoms_detail:false,workup:true,conduta:true,diferencial:false,note:true};
  render();window.scrollTo({top:0,behavior:'smooth'});
}

// Keyboard
document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowRight' && e.altKey){e.preventDefault();next()}
  else if(e.key==='ArrowLeft' && e.altKey){e.preventDefault();prev()}
});

render();
</script>
