<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dor nas Costas - Avaliacao Estruturada</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  header{background:linear-gradient(135deg,#1e293b,#334155);width:100%;padding:1.5rem;text-align:center;border-bottom:2px solid #3b82f6;position:relative}
  header h1{font-size:1.5rem;font-weight:600;color:#f1f5f9}
  header p{font-size:.875rem;color:#94a3b8;margin-top:.25rem}
  .back-link{position:absolute;left:1.5rem;top:50%;transform:translateY(-50%);color:#94a3b8;text-decoration:none;font-size:.85rem;font-weight:500;transition:color .2s;padding:.5rem .25rem}
  .back-link:hover{color:#f1f5f9}
  .container{max-width:700px;width:100%;padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;padding-bottom:3rem}
  /* Progress bar */
  .progress-bar{display:flex;align-items:center;gap:.35rem;padding:0 .5rem}
  .progress-step{flex:1;height:6px;border-radius:3px;background:#1e293b;transition:background .4s ease, box-shadow .4s ease}
  .progress-step.done{background:#3b82f6}
  .progress-step.active{background:#60a5fa;box-shadow:0 0 8px rgba(96,165,250,.4);animation:pulse-bar 1.5s infinite}
  @keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.5}}
  .progress-labels{display:flex;justify-content:space-between;font-size:.55rem;color:#64748b;padding:0 .5rem}
  .progress-labels span{transition:color .3s}
  .progress-labels span.active-label{color:#93c5fd;font-weight:600}.progress-labels span.done-label{color:#3b82f6}
  /* Context strip (shows prior selections) */
  .context-strip{display:flex;flex-wrap:wrap;gap:.35rem;padding:.5rem .75rem;background:#1e293b;border-radius:.75rem;border:1px solid #334155;margin-bottom:.25rem}
  .context-chip{font-size:.65rem;padding:.2rem .5rem;border-radius:9999px;background:#0f172a;border:1px solid #334155;color:#94a3b8;display:inline-flex;align-items:center;gap:.25rem;line-height:1.3}
  .context-chip .chip-val{color:#cbd5e1;font-weight:600}
  .context-chip.chip-alert{background:#450a0a;border-color:#7f1d1d;color:#fca5a5}
  .context-chip.chip-alert .chip-val{color:#fca5a5}
  .context-chip.chip-info{background:#172554;border-color:#1e40af;color:#93c5fd}
  .context-chip.chip-info .chip-val{color:#93c5fd}
  /* Card */
  .card{background:#1e293b;border:1px solid #334155;border-radius:1rem;padding:2rem;animation:fadeSlideIn .35s ease}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-size:1.15rem;color:#f8fafc;margin-bottom:.35rem}
  .card .subtitle{font-size:.8rem;color:#94a3b8;margin-bottom:1.25rem;line-height:1.5}
  .options{display:flex;flex-direction:column;gap:.75rem}
  .option-group-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-top:.75rem;margin-bottom:-.15rem;display:flex;align-items:center;gap:.4rem}
  .option-group-label:first-child{margin-top:0}
  .group-line{flex:1;height:1px;background:#334155}
  /* Check buttons */
  .check-btn{background:#0f172a;border:1.5px solid #334155;border-radius:.75rem;padding:.75rem 1rem;color:#cbd5e1;font-size:.9rem;cursor:pointer;transition:all .2s ease;text-align:left;display:flex;align-items:center;gap:.75rem;-webkit-user-select:none;user-select:none;width:100%;font-family:inherit}
  .check-btn:hover{border-color:#3b82f6;background:#172040;color:#f1f5f9}
  .check-btn:active{transform:scale(.98)}
  .check-btn:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .check-btn.checked{border-color:#3b82f6;background:#1e3a5f;color:#f1f5f9}
  .check-btn.checked.flag-critical{border-color:#ef4444;background:#450a0a;color:#fca5a5;box-shadow:0 0 12px rgba(239,68,68,.15)}
  .check-btn.checked.flag-warn{border-color:#f59e0b;background:#451a03;color:#fcd34d}
  .check-box{width:20px;height:20px;border:2px solid #475569;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:.75rem}
  .check-btn.checked .check-box{background:#3b82f6;border-color:#3b82f6}
  .check-btn.checked.flag-critical .check-box{background:#ef4444;border-color:#ef4444}
  .check-btn.checked.flag-warn .check-box{background:#f59e0b;border-color:#f59e0b}
  .check-desc{font-size:.72rem;color:#64748b;margin-top:.15rem;font-weight:400}
  /* Option buttons */
  .option-btn{background:#0f172a;border:1.5px solid #334155;border-radius:.75rem;padding:.9rem 1.1rem;color:#cbd5e1;font-size:.95rem;cursor:pointer;transition:all .2s ease;text-align:left;display:flex;align-items:center;gap:.75rem;-webkit-user-select:none;user-select:none;width:100%;font-family:inherit}
  .option-btn:hover{border-color:#3b82f6;background:#172040;color:#f1f5f9}
  .option-btn:active{transform:scale(.98)}
  .option-btn:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .option-btn.selected{border-color:#3b82f6;background:#1e3a5f;color:#f1f5f9;box-shadow:0 0 12px rgba(59,130,246,.15)}
  .option-btn .icon{font-size:1.25rem;flex-shrink:0;width:2rem;text-align:center}
  .option-btn .label{flex:1}
  .option-btn .tag{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .5rem;border-radius:9999px;font-weight:600;flex-shrink:0}
  .tag-mec{background:#164e63;color:#67e8f9}.tag-nonmec{background:#4c1d95;color:#c4b5fd}.tag-ref{background:#78350f;color:#fcd34d}
  /* Score options */
  .score-opt{flex:1;padding:.5rem .3rem;border-radius:.5rem;font-size:.72rem;cursor:pointer;border:1.5px solid #334155;background:#0f172a;color:#64748b;text-align:center;transition:all .2s;line-height:1.3;-webkit-user-select:none;user-select:none;font-family:inherit}
  .score-opt:hover{border-color:#3b82f6;color:#cbd5e1}
  .score-opt:active{transform:scale(.96)}
  .score-opt:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .score-opt.picked{border-color:#3b82f6;background:#1e3a5f;color:#f1f5f9;font-weight:600;box-shadow:0 0 8px rgba(59,130,246,.15)}
  /* EVA scale */
  .eva-container{display:flex;align-items:center;gap:.75rem;margin-top:.5rem}
  .eva-slider-wrap{flex:1;position:relative;padding:.25rem 0}
  .eva-slider{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:5px;outline:none;cursor:pointer;transition:background .2s}
  .eva-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.4);transition:transform .15s}
  .eva-slider::-webkit-slider-thumb:active{transform:scale(1.2)}
  .eva-slider::-moz-range-thumb{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .eva-value-box{text-align:center;min-width:3.5rem}
  .eva-value{font-size:2rem;font-weight:800;line-height:1;transition:color .2s}
  .eva-label{font-size:.6rem;color:#64748b;margin-top:.2rem}
  .eva-intensity{font-size:.65rem;font-weight:600;margin-top:.1rem;transition:color .2s}
  .eva-anchors{display:flex;justify-content:space-between;font-size:.6rem;color:#64748b;padding:0 .15rem;margin-top:.25rem}
  /* Duration chips */
  .duration-row{display:flex;gap:.5rem;flex-wrap:wrap}
  .dur-chip{flex:1;min-width:0;padding:.65rem .5rem;border-radius:.65rem;font-size:.78rem;cursor:pointer;border:1.5px solid #334155;background:#0f172a;color:#64748b;text-align:center;transition:all .2s;line-height:1.35;-webkit-user-select:none;user-select:none;font-family:inherit}
  .dur-chip:hover{border-color:#3b82f6;color:#cbd5e1}
  .dur-chip:active{transform:scale(.96)}
  .dur-chip:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .dur-chip.picked{border-color:#3b82f6;background:#1e3a5f;color:#f1f5f9;font-weight:600}
  .dur-chip .dur-label{font-weight:600;display:block;font-size:.85rem}
  .dur-chip .dur-range{font-size:.65rem;color:#94a3b8;display:block;margin-top:.15rem}
  /* Nav */
  .nav-row{display:flex;gap:.75rem;margin-top:1.25rem}
  .nav-btn{flex:1;padding:.85rem;border-radius:.75rem;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;-webkit-user-select:none;user-select:none;font-family:inherit;min-height:48px}
  .nav-btn.secondary{background:#334155;color:#cbd5e1}.nav-btn.secondary:hover{background:#475569}
  .nav-btn.primary{background:#3b82f6;color:#fff}.nav-btn.primary:hover{background:#2563eb}
  .nav-btn.primary:active{transform:scale(.98);background:#1d4ed8}
  .nav-btn.primary.ready{animation:pulseReady 2s infinite}
  @keyframes pulseReady{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.4)}50%{box-shadow:0 0 0 8px rgba(59,130,246,0)}}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;animation:none}
  .nav-btn:disabled:active{transform:none}
  .nav-btn:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
  .nav-btn.danger{background:#991b1b;color:#fca5a5}.nav-btn.danger:hover{background:#7f1d1d}
  /* Validation hint */
  .validation-hint{font-size:.72rem;color:#f59e0b;text-align:center;margin-top:.5rem;opacity:0;transition:opacity .3s;min-height:1.1rem}
  .validation-hint.visible{opacity:1}
  .validation-hint.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  /* Result card */
  .result-card{text-align:center;padding:2rem 1.5rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:5rem;height:5rem;border-radius:50%;font-size:1.5rem;font-weight:800;margin-bottom:1rem;animation:badgePop .4s ease}
  @keyframes badgePop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .result-badge.risk-emergent{background:#991b1b;color:#fca5a5;border:3px solid #ef4444;box-shadow:0 0 20px rgba(239,68,68,.3)}
  .result-badge.risk-urgent{background:#92400e;color:#fcd34d;border:3px solid #f59e0b;box-shadow:0 0 20px rgba(245,158,11,.2)}
  .result-badge.risk-routine{background:#166534;color:#86efac;border:3px solid #22c55e;box-shadow:0 0 20px rgba(34,197,94,.2)}
  .result-title{font-size:1.3rem;font-weight:700;margin-bottom:.25rem}
  .result-desc{color:#94a3b8;font-size:.9rem;margin-bottom:1.5rem;line-height:1.5}
  .dark-box{background:#0f172a;border-radius:.75rem;padding:1.25rem;text-align:left;margin-bottom:1.25rem;border:1px solid #1e293b;transition:border-color .2s}
  .dark-box:hover{border-color:#334155}
  .dark-box h3{font-size:.8rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
  .summary-row{display:flex;justify-content:space-between;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid #1e293b;font-size:.85rem;gap:.5rem}
  .summary-row:last-child{border-bottom:none}.summary-row .criteria{color:#94a3b8;flex-shrink:0}
  .summary-row .value{font-weight:600;display:flex;align-items:center;gap:.4rem;text-align:right;max-width:55%;flex-wrap:wrap;justify-content:flex-end}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-red{background:#ef4444}.dot-yellow{background:#f59e0b}.dot-green{background:#22c55e}.dot-blue{background:#3b82f6}
  .conduta-box{border-radius:.75rem;padding:1.25rem;text-align:left;margin-bottom:1.25rem}
  .conduta-box h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
  .conduta-box.alta-prob{background:#450a0a;border:1.5px solid #991b1b}.conduta-box.alta-prob h3{color:#fca5a5}
  .conduta-box.mod-prob{background:#451a03;border:1.5px solid #78350f}.conduta-box.mod-prob h3{color:#fcd34d}
  .conduta-box.baixa-prob{background:#052e16;border:1.5px solid #14532d}.conduta-box.baixa-prob h3{color:#86efac}
  .conduta-item{display:flex;align-items:flex-start;gap:.5rem;padding:.45rem 0;font-size:.85rem;color:#cbd5e1;line-height:1.45}
  .conduta-icon{flex-shrink:0;width:1.2rem;text-align:center}
  .conduta-detail{font-size:.73rem;color:#94a3b8;margin-top:.1rem;font-style:italic}
  .flag-count{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:9999px;font-size:.8rem;font-weight:700;margin-bottom:1rem}
  .flag-count.has-flags{background:#450a0a;color:#fca5a5;border:1px solid #991b1b}
  .flag-count.no-flags{background:#052e16;color:#86efac;border:1px solid #14532d}
  .neuro-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .neuro-grid .score-opt{padding:.65rem .4rem;font-size:.78rem}
  .neuro-field-label{display:flex;align-items:center;gap:.4rem}
  .neuro-field-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s}
  .neuro-field-status.filled{background:#3b82f6}
  .neuro-field-status.empty{background:#475569}
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:.15rem 0;border-radius:.35rem;transition:opacity .2s}
  .collapse-header:active{opacity:.7}
  .collapse-header h3{margin-bottom:0}
  .collapse-arrow{font-size:.8rem;color:#64748b;transition:transform .3s ease}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .3s ease, opacity .25s ease}
  .collapse-body.hidden{max-height:0!important;padding-top:0;margin-top:0;opacity:0}
  .collapse-body.visible{max-height:3000px;opacity:1}
  .note-box{background:#0f172a;border-radius:.75rem;padding:1.25rem;text-align:left;margin-bottom:1.25rem}
  .note-box h3{font-size:.8rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
  .note-text{background:#020617;border:1px solid #1e293b;border-radius:.5rem;padding:1rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.72rem;color:#94a3b8;white-space:pre-wrap;line-height:1.6;max-height:400px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.75rem;padding:.7rem;border-radius:.5rem;border:1.5px solid #334155;background:#1e293b;color:#cbd5e1;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;min-height:48px}
  .copy-btn:hover{border-color:#3b82f6;background:#172040;color:#f1f5f9}
  .copy-btn:active{transform:scale(.98)}
  .copy-btn.copied{border-color:#22c55e;background:#052e16;color:#86efac}
  .flow-connector{display:flex;justify-content:center;padding:.25rem 0}
  .flow-connector .arrow{width:2px;height:20px;background:#334155;position:relative}
  .flow-connector .arrow::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #334155}
  .alert-banner{background:#450a0a;border:1.5px solid #991b1b;border-radius:.75rem;padding:1rem 1.25rem;margin-bottom:.75rem;display:flex;align-items:flex-start;gap:.75rem;animation:fadeSlideIn .35s ease}
  .alert-banner .alert-icon{font-size:1.4rem;flex-shrink:0;line-height:1}
  .alert-banner .alert-text{font-size:.85rem;color:#fca5a5;font-weight:600;line-height:1.4}
  .alert-banner .alert-detail{font-size:.75rem;color:#f87171;font-weight:400;margin-top:.25rem}
  .section-label{font-size:.78rem;color:#94a3b8;font-weight:600;margin-bottom:.5rem;margin-top:1rem;display:flex;align-items:center;gap:.5rem}
  .section-label:first-child{margin-top:0}
  .section-label .sl-line{flex:1;height:1px;background:#334155}
  .inline-opts{display:flex;gap:.4rem;flex-wrap:wrap}
  .inline-opts .score-opt{min-width:0}
  /* Dermatome hint */
  .dermatome-hint{background:#0f172a;border:1px solid #334155;border-radius:.5rem;padding:.75rem;margin-top:.5rem;font-size:.72rem;color:#94a3b8;line-height:1.5}
  .dermatome-hint strong{color:#cbd5e1;font-weight:600}
  .dermatome-hint .derm-row{display:flex;justify-content:space-between;padding:.2rem 0;border-bottom:1px solid #1e293b;gap:.5rem}
  .dermatome-hint .derm-row:last-child{border-bottom:none}
  .dermatome-hint .derm-level{color:#93c5fd;font-weight:600;min-width:2.5rem}
  /* Differential box */
  .diff-box{background:#0f172a;border:1px solid #334155;border-radius:.5rem;padding:.75rem 1rem;margin-top:.5rem}
  .diff-item{display:flex;align-items:flex-start;gap:.4rem;padding:.3rem 0;font-size:.78rem;color:#cbd5e1;border-bottom:1px solid #1e293b}
  .diff-item:last-child{border-bottom:none}
  .diff-prob{font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;padding:.1rem .35rem;border-radius:9999px;font-weight:700;flex-shrink:0;margin-top:.1rem}
  .prob-high{background:#991b1b;color:#fca5a5}.prob-mod{background:#78350f;color:#fcd34d}.prob-low{background:#164e63;color:#67e8f9}
  /* Skip link for accessibility */
  .skip-flags{display:block;text-align:center;margin-top:.5rem;font-size:.72rem;color:#64748b;cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:none;font-family:inherit;padding:.25rem}
  .skip-flags:hover{color:#94a3b8}
  /* Neuro auto-sync notice */
  .auto-sync-notice{display:flex;align-items:center;gap:.4rem;padding:.5rem .75rem;border-radius:.5rem;background:#172554;border:1px solid #1e40af;font-size:.72rem;color:#93c5fd;margin-bottom:.5rem;animation:fadeSlideIn .35s ease}
  /* Thoracic warning */
  .thoracic-warn{display:flex;align-items:center;gap:.4rem;padding:.5rem .75rem;border-radius:.5rem;background:#451a03;border:1px solid #78350f;font-size:.75rem;color:#fcd34d;margin-top:.5rem}
  /* Yellow flag notice */
  .yellow-flag-box{background:#1e1b4b;border:1px solid #312e81;border-radius:.5rem;padding:.75rem 1rem;margin-top:.75rem;font-size:.75rem;color:#a5b4fc;line-height:1.5}
  .yellow-flag-box strong{color:#c7d2fe}
  /* Expand/Collapse all */
  .expand-toggle{display:flex;justify-content:flex-end;margin-bottom:.25rem}
  .expand-toggle button{background:none;border:1px solid #334155;border-radius:.5rem;padding:.35rem .75rem;font-size:.7rem;color:#64748b;cursor:pointer;font-family:inherit;transition:all .2s}
  .expand-toggle button:hover{border-color:#3b82f6;color:#93c5fd}
  /* SI test reference */
  .si-test-ref{background:#0f172a;border:1px solid #334155;border-radius:.5rem;padding:.65rem .85rem;margin-top:.5rem;font-size:.72rem;color:#94a3b8;line-height:1.5}
  .si-test-ref strong{color:#cbd5e1}
  .si-test-ref .test-name{color:#93c5fd;font-weight:600}
  /* Disclaimer */
  .disclaimer{text-align:center;font-size:.62rem;color:#475569;padding:1rem;line-height:1.5;border-top:1px solid #1e293b;margin-top:1rem}
  /* Restart confirmation overlay */
  .restart-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .2s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .restart-dialog{background:#1e293b;border:1px solid #334155;border-radius:1rem;padding:1.5rem;max-width:340px;width:90%;text-align:center;animation:badgePop .3s ease}
  .restart-dialog h3{font-size:1rem;color:#f1f5f9;margin-bottom:.5rem}
  .restart-dialog p{font-size:.85rem;color:#94a3b8;margin-bottom:1.25rem;line-height:1.4}
  .restart-dialog .dialog-btns{display:flex;gap:.75rem}
  .restart-dialog .dialog-btns button{flex:1;padding:.7rem;border-radius:.5rem;font-size:.85rem;font-weight:600;cursor:pointer;border:none;font-family:inherit;min-height:44px}
  /* Responsive */
  @media(max-width:500px){
    .container{padding:1rem}.card{padding:1.25rem}
    .check-btn{padding:.65rem .85rem;font-size:.82rem}
    .option-btn{padding:.75rem .9rem;font-size:.85rem}
    header h1{font-size:1.2rem}header p{font-size:.78rem}
    .progress-labels{font-size:.5rem}
    .score-opt{font-size:.65rem;padding:.45rem .2rem}
    .neuro-grid{grid-template-columns:1fr}
    .neuro-grid .score-opt{font-size:.74rem;padding:.6rem .4rem}
    .eva-value{font-size:1.5rem}
    .eva-value-box{min-width:3rem}
    .eva-slider::-webkit-slider-thumb{width:34px;height:34px}
    .eva-slider::-moz-range-thumb{width:34px;height:34px}
    .duration-row{gap:.4rem}
    .dur-chip{padding:.55rem .4rem;min-width:calc(33% - .3rem);flex:none}
    .context-chip{font-size:.58rem}
    .summary-row{flex-direction:column;gap:.15rem}
    .summary-row .value{max-width:100%;text-align:left;justify-content:flex-start}

    .back-link{left:1rem;font-size:.8rem}
    .dermatome-hint .derm-row{flex-direction:column;gap:.1rem}
    .dermatome-hint .derm-level{min-width:auto}
    .result-card{padding:1.5rem 1rem}
    .result-badge{width:4rem;height:4rem;font-size:1.25rem}
  }
  @media(max-width:360px){
    .container{padding:.75rem}
    .card{padding:1rem;border-radius:.75rem}
    header h1{font-size:1.1rem}
    .progress-labels{font-size:.42rem}
    .dur-chip{min-width:100%;flex:none}
    .eva-container{flex-direction:column;gap:.5rem}
    .eva-value-box{display:flex;align-items:center;gap:.5rem}
    .eva-label{margin-top:0}
    .eva-intensity{margin-top:0}
  }
  /* Print styles */
  @media print{
    body{background:#fff;color:#000}
    .card{background:#fff;border-color:#ccc}
    .dark-box{background:#f8f8f8;border-color:#ccc}
    .conduta-box{background:#f8f8f8!important;border-color:#ccc!important}
    .conduta-box h3{color:#333!important}
    .conduta-item{color:#000}
    .conduta-detail{color:#666}
    .nav-row,.progress-bar,.progress-labels,.flow-connector,.context-strip,.back-link,.copy-btn,.skip-flags,.expand-toggle,.restart-overlay{display:none!important}
    .collapse-body.hidden{max-height:3000px!important;opacity:1!important}
    .note-text{background:#f8f8f8;color:#000;border-color:#ccc}
    .alert-banner{background:#fef2f2!important;border-color:#fca5a5!important}
    .alert-banner .alert-text,.alert-banner .alert-detail{color:#991b1b!important}
    .yellow-flag-box{background:#f8f8f8;border-color:#ccc;color:#333}

</style>

<body>
<header>
  <a href="../dor-nas-costas.html" class="back-link" aria-label="Voltar para a lista">&larr; Voltar</a>
  <h1>Avaliador de Dor nas Costas</h1>
  <p>Red flags + Classificacao + Neurologia + Conduta</p>
</header>
<div class="container" id="app"></div>
<div id="overlayRoot"></div>
<script>
// ============================================
// DATA
// ============================================
const STEP_LABELS=['Red Flags','Dor','Local','Neurologia','Sintomas','Resultado'];
const TOTAL_STEPS=6;

const RED_FLAGS=[
  {id:'cauda_saddle',label:'Anestesia em sela (perineal)',icon:'\u26A0\uFE0F',group:'cauda',severity:'critical'},
  {id:'cauda_bladder',label:'Disfuncao vesical (retencao/incontinencia)',icon:'\u26A0\uFE0F',group:'cauda',severity:'critical'},
  {id:'cauda_bowel',label:'Disfuncao intestinal (incontinencia fecal)',icon:'\u26A0\uFE0F',group:'cauda',severity:'critical'},
  {id:'cauda_neuro',label:'Deficit neurologico progressivo em MMII',icon:'\u26A0\uFE0F',group:'cauda',severity:'critical'},
  {id:'fever',label:'Febre',icon:'\uD83C\uDF21\uFE0F',group:'infec',severity:'warn'},
  {id:'ivdu',label:'Uso de drogas intravenosas',icon:'\uD83D\uDC89',group:'infec',severity:'warn'},
  {id:'immunosupp',label:'Imunossupressao',icon:'\uD83D\uDEE1\uFE0F',group:'infec',severity:'warn'},
  {id:'recent_procedure',label:'Procedimento espinhal recente',icon:'\uD83C\uDFE5',group:'infec',severity:'warn'},
  {id:'cancer',label:'Historia de neoplasia',icon:'\uD83C\uDFAF',group:'neopl',severity:'warn'},
  {id:'weight_loss',label:'Perda de peso inexplicada',icon:'\u2B07\uFE0F',group:'neopl',severity:'warn'},
  {id:'age_risk',label:'Idade > 50 ou < 20 anos',icon:'\uD83D\uDCC5',group:'neopl',severity:'warn'},
  {id:'night_pain',label:'Dor noturna que nao alivia em repouso',icon:'\uD83C\uDF19',group:'neopl',severity:'warn'},
  {id:'trauma',label:'Trauma significativo (ou menor em idoso/osteoporose)',icon:'\uD83D\uDCA5',group:'fratura',severity:'warn'},
  {id:'corticoid',label:'Uso cronico de corticoides',icon:'\uD83D\uDC8A',group:'fratura',severity:'warn'},
  {id:'osteoporosis',label:'Osteoporose conhecida',icon:'\uD83E\uDDB4',group:'fratura',severity:'warn'},
  {id:'anticoag',label:'Uso de anticoagulantes',icon:'\uD83E\uDE78',group:'vascular',severity:'warn'},
  {id:'aortic_risk',label:'Historia de aneurisma aortico / doenca vascular',icon:'\u2764\uFE0F',group:'vascular',severity:'critical'},
];

const CAUDA_IDS=['cauda_saddle','cauda_bladder','cauda_bowel','cauda_neuro'];
const INFEC_IDS=['fever','ivdu','immunosupp','recent_procedure'];
const NEOPL_IDS=['cancer','weight_loss','age_risk','night_pain'];
const FRATURA_IDS=['trauma','corticoid','osteoporosis'];
const VASCULAR_IDS=['anticoag','aortic_risk'];

const PAIN_TYPES=[
  {id:'mechanical',label:'Mecanica',icon:'\u2699\uFE0F',desc:'Piora com movimento, melhora com repouso. Relacionada a posicao.',tag:'tag-mec',tagLabel:'Mecanica'},
  {id:'nonmechanical',label:'Nao-mecanica / Inflamatoria',icon:'\uD83D\uDD25',desc:'Rigidez matinal > 30min, piora com repouso, melhora com atividade. Dor noturna.',tag:'tag-nonmec',tagLabel:'Inflamatoria'},
  {id:'referred',label:'Referida / Visceral',icon:'\u21A9\uFE0F',desc:'Constante, nao relacionada a posicao, sintomas abdominais/pelvicos/toracicos.',tag:'tag-ref',tagLabel:'Referida'},
];

const DURATIONS=[
  {id:'acute',label:'Aguda',range:'< 4 semanas'},
  {id:'subacute',label:'Subaguda',range:'4 \u2013 12 semanas'},
  {id:'chronic',label:'Cronica',range:'> 12 semanas'},
];

const LOCATIONS=[
  {id:'cervical',label:'Cervical',icon:'\uD83E\uDDB4',hint:'Pescoco, base do cranio'},
  {id:'thoracic',label:'Toracica',icon:'\uD83E\uDDB4',hint:'Dorso medio, entre escapulas'},
  {id:'lumbar',label:'Lombar',icon:'\uD83E\uDDB4',hint:'Regiao mais comum'},
  {id:'sacral',label:'Sacral / Sacroiliaca',icon:'\uD83E\uDDB4',hint:'Nadega, articulacao SI'},
];

const IRRADIATION=[
  {id:'none',label:'Sem irradiacao',icon:'\u2796'},
  {id:'buttock',label:'Nadega / Gluteo',icon:'\u2B07\uFE0F'},
  {id:'posterior_thigh',label:'Face posterior da coxa',icon:'\u2B07\uFE0F'},
  {id:'below_knee',label:'Abaixo do joelho (panturrilha / pe)',icon:'\u26A1'},
  {id:'bilateral_legs',label:'Bilateral em MMII',icon:'\u2194\uFE0F'},
  {id:'upper_limb',label:'Membro superior (cervicalgia)',icon:'\u2B06\uFE0F'},
  {id:'chest_abd',label:'Torax / Abdome (toracica)',icon:'\u21A9\uFE0F'},
];

const NEURO_TESTS={
  motor:{label:'Forca motora',opts:[
    {v:'normal',l:'5/5 Normal'},
    {v:'leve',l:'4/5 Leve deficit'},
    {v:'moderado',l:'3/5 Moderado'},
    {v:'grave',l:'< 3/5 Grave'},
  ]},
  sensory:{label:'Alteracao sensitiva',opts:[
    {v:'normal',l:'Normal'},
    {v:'dermatomal',l:'Dermatomal definido'},
    {v:'difusa',l:'Difusa / Nao-dermatomal'},
    {v:'saddle',l:'Em sela (perineal)'},
  ]},
  reflex:{label:'Reflexos',opts:[
    {v:'normal',l:'Normais / Simetricos'},
    {v:'hipo',l:'Hiporreflexia'},
    {v:'hiper',l:'Hiperreflexia / Clonus'},
    {v:'assimetrico',l:'Assimetricos'},
  ]},
  slr:{label:'Lasegue (SLR)',opts:[
    {v:'negative',l:'Negativo'},
    {v:'positive_uni',l:'Positivo unilateral'},
    {v:'positive_bi',l:'Positivo bilateral'},
    {v:'not_done',l:'Nao realizado'},
  ]},
  babinski:{label:'Babinski / Sinal do neuronio motor superior',opts:[
    {v:'normal',l:'Flexor (normal)'},
    {v:'extensor',l:'Extensor (positivo)'},
    {v:'not_done',l:'Nao avaliado'},
  ]},
  gait:{label:'Avaliacao da marcha',opts:[
    {v:'normal',l:'Normal'},
    {v:'antalgic',l:'Antalgica'},
    {v:'steppage',l:'Escarvante (pe caido)'},
    {v:'spastic',l:'Espastica'},
    {v:'not_done',l:'Nao avaliada'},
  ]},
};

const ASSOC_SYMPTOMS=[
  {id:'radiculopathy',label:'Dor radicular (irradia para membro)',icon:'\u26A1'},
  {id:'claudication',label:'Claudicacao neurogenica (piora ao caminhar/ficar em pe)',icon:'\uD83D\uDEB6'},
  {id:'morning_stiffness',label:'Rigidez matinal > 30 minutos',icon:'\u2600\uFE0F'},
  {id:'paresthesia',label:'Parestesias (formigamento/dormencia)',icon:'\uD83E\uDD8B'},
  {id:'bilateral_sx',label:'Sintomas bilaterais em MMII',icon:'\u2194\uFE0F'},
  {id:'gait_change',label:'Alteracao de marcha',icon:'\uD83E\uDDBF'},
  {id:'abd_pain',label:'Dor abdominal associada',icon:'\uD83E\uDEC3'},
  {id:'urinary_sx',label:'Sintomas urinarios (sem retencao/incontinencia)',icon:'\uD83D\uDCA7'},
  {id:'thoracic_pain',label:'Dor toracica associada',icon:'\uD83E\uDEC0'},
  {id:'hip_pain',label:'Dor no quadril (coxofemoral)',icon:'\uD83E\uDDB5'},
  {id:'wt_bearing_pain',label:'Dor que piora ao carregar peso',icon:'\uD83C\uDFCB\uFE0F'},
  {id:'night_waking',label:'Dor que acorda durante a noite',icon:'\uD83C\uDF19'},
];

// Dermatome reference
const DERMATOMES=[
  {level:'L2',motor:'Flexao do quadril (iliopsoas)',sensory:'Face anterior da coxa',reflex:'\u2014'},
  {level:'L3',motor:'Extensao do joelho (quadriceps)',sensory:'Face medial do joelho',reflex:'Patelar'},
  {level:'L4',motor:'Dorsiflexao do pe',sensory:'Face medial da perna + tornozelo',reflex:'Patelar'},
  {level:'L5',motor:'Extensor longo do halux',sensory:'Dorso do pe (entre 1\u00BA e 2\u00BA pododactilo)',reflex:'\u2014'},
  {level:'S1',motor:'Flexao plantar / Eversao do pe',sensory:'Face lateral do pe',reflex:'Aquileu'},
];

// Cervical dermatomes
const DERMATOMES_CERVICAL=[
  {level:'C5',motor:'Deltoide / Biceps',sensory:'Face lateral do braco',reflex:'Bicipital'},
  {level:'C6',motor:'Extensores do punho',sensory:'Polegar + indicador',reflex:'Braquiorradial'},
  {level:'C7',motor:'Triceps / Flexores do punho',sensory:'Dedo medio',reflex:'Tricipital'},
  {level:'C8',motor:'Flexores dos dedos',sensory:'Dedo minimo + anelar',reflex:'\u2014'},
  {level:'T1',motor:'Interosseos da mao',sensory:'Face medial do antebraco',reflex:'\u2014'},
];

// ============================================
// STATE
// ============================================
let currentStep=0;
let redFlags=new Set();
let painType=null;
let painDuration=null;
let evaScore=5;
let locations=new Set();
let irradiation=new Set();
let neuro={motor:null,sensory:null,reflex:null,slr:null,babinski:null,gait:null};
let symptoms=new Set();
let sections={flags:true,classification:false,location:false,neuro_detail:false,symptoms_detail:false,workup:true,conduta:true,diferencial:false,note:true};
const evalStartTime=new Date();
// Track if neuro saddle was auto-synced from red flags
let neuroSaddleAutoSynced=false;
// Track failed validation attempts for shake animation
let validationShake=false;

const app=document.getElementById('app');
const overlayRoot=document.getElementById('overlayRoot');

// ============================================
// HELPERS
// ============================================
function hasCaudaEquina(){
  return CAUDA_IDS.some(id=>redFlags.has(id));
}

function hasInfectionRisk(){
  const infecCount=INFEC_IDS.filter(id=>redFlags.has(id)).length;
  return infecCount>=1 && (redFlags.has('fever') || infecCount>=2);
}

function hasCancerRisk(){
  return NEOPL_IDS.filter(id=>redFlags.has(id)).length>=2 || redFlags.has('cancer');
}

function hasFractureRisk(){
  return FRATURA_IDS.some(id=>redFlags.has(id));
}

function hasVascularRisk(){
  return redFlags.has('aortic_risk');
}

function flagCount(){return redFlags.size}

function neuroFilledCount(){
  return Object.values(neuro).filter(v=>v!==null).length;
}

function neuroTotalFields(){
  return Object.keys(NEURO_TESTS).length;
}

function getRiskLevel(){
  // Emergent - needs immediate action
  if(hasCaudaEquina()) return 'emergent';
  if(neuro.sensory==='saddle') return 'emergent';
  if(neuro.babinski==='extensor' && (neuro.motor==='grave' || neuro.motor==='moderado')) return 'emergent';
  if(hasInfectionRisk() && redFlags.has('fever') && (neuro.motor==='grave' || neuro.motor==='moderado')) return 'emergent';
  if(hasVascularRisk() && painType==='referred') return 'emergent';
  // Bilateral progressive neuro deficit is emergent even without explicit cauda equina flags
  if(neuro.motor==='grave' && irradiation.has('bilateral_legs')) return 'emergent';
  // Spastic gait + upper motor neuron signs = emergent myelopathy
  if(neuro.gait==='spastic' && (neuro.babinski==='extensor' || neuro.reflex==='hiper')) return 'emergent';

  // Urgent - red flags or significant neuro findings
  if(hasInfectionRisk()) return 'urgent';
  if(hasCancerRisk()) return 'urgent';
  if(hasFractureRisk()) return 'urgent';
  if(hasVascularRisk()) return 'urgent';
  if(neuro.motor==='grave') return 'urgent';
  if(neuro.motor==='moderado') return 'urgent';
  if(neuro.babinski==='extensor') return 'urgent';
  if(neuro.reflex==='hiper') return 'urgent';
  if(neuro.gait==='spastic') return 'urgent';
  if(neuro.gait==='steppage') return 'urgent';
  if(redFlags.has('night_pain') && redFlags.has('weight_loss')) return 'urgent';

  // Thoracic pain is intrinsically more concerning
  if(locations.has('thoracic') && flagCount()>=1) return 'urgent';

  // Moderate concern - some flags but no high-risk pattern
  if(flagCount()>=3) return 'urgent';
  if(flagCount()>=2) return 'urgent';

  // Single isolated flag: not urgent, but note it

  // Routine
  return 'routine';
}

function needsImaging(){
  if(getRiskLevel()==='emergent') return 'immediate';
  if(getRiskLevel()==='urgent') return 'urgent';
  if(neuro.motor && neuro.motor!=='normal') return 'urgent';
  if(neuro.babinski==='extensor') return 'urgent';
  if(neuro.gait==='steppage') return 'urgent';
  if(neuro.sensory==='dermatomal' && symptoms.has('radiculopathy')) return 'consider';
  if(neuro.slr==='positive_bi') return 'urgent';
  if(neuro.slr==='positive_uni' && symptoms.has('radiculopathy')) return 'consider';
  if(painDuration==='chronic' && painType==='nonmechanical') return 'consider';
  if(painDuration==='chronic' && evaScore>=7) return 'consider';
  // Thoracic spine pain warrants imaging consideration even without red flags
  if(locations.has('thoracic') && painDuration!=='acute') return 'consider';
  return 'none';
}

function evaColor(val){
  if(val<=3) return '#22c55e';
  if(val<=6) return '#f59e0b';
  return '#ef4444';
}

function evaIntensityLabel(val){
  if(val===0) return 'Sem dor';
  if(val<=3) return 'Dor leve';
  if(val<=6) return 'Dor moderada';
  if(val<=8) return 'Dor intensa';
  return 'Dor insuportavel';
}

function evaGradient(val){
  // Show filled track: colored up to value, then dark after
  const pct=(val/10)*100;
  const col=evaColor(val);
  return `linear-gradient(to right, #22c55e 0%, ${col} ${pct}%, #334155 ${pct}%, #1e293b 100%)`;
}

// Haptic feedback for mobile
function haptic(style){
  if(!navigator.vibrate) return;
  if(style==='light') navigator.vibrate(10);
  else if(style==='medium') navigator.vibrate(20);
  else if(style==='success') navigator.vibrate([15,50,15]);
}

// ============================================
// CONTEXT STRIP - shows prior selections
// ============================================
function buildContextStrip(){
  if(currentStep===0) return '';
  let chips=[];
  if(currentStep>0){
    const fc=flagCount();
    if(fc>0) chips.push({cls:'chip-alert',label:'Red Flags',val:`${fc}`});
    else chips.push({cls:'',label:'Red Flags',val:'0'});
  }
  if(currentStep>1 && painType){
    const pt=PAIN_TYPES.find(p=>p.id===painType);
    chips.push({cls:'',label:'Dor',val:pt?pt.label:'--'});
  }
  if(currentStep>1 && painDuration){
    const d=DURATIONS.find(x=>x.id===painDuration);
    chips.push({cls:'',label:'Duracao',val:d?d.label:'--'});
  }
  if(currentStep>1){
    chips.push({cls:'',label:'EVA',val:`${evaScore}/10`});
  }
  if(currentStep>2 && locations.size>0){
    const locNames=[...locations].map(id=>{const l=LOCATIONS.find(x=>x.id===id);return l?l.label:id});
    chips.push({cls:'',label:'Local',val:locNames.join(', ')});
  }
  if(currentStep>2 && irradiation.size>0){
    const irNames=[...irradiation].map(id=>{const ir=IRRADIATION.find(x=>x.id===id);return ir?ir.label:id});
    const irDisplay=irNames.length>2?`${irNames.length} padroes`:irNames.join(', ');
    chips.push({cls:'chip-info',label:'Irradiacao',val:irDisplay});
  }
  if(currentStep>3){
    const abnormals=Object.entries(neuro).filter(([k,v])=>v && v!=='normal' && v!=='negative' && v!=='not_done');
    if(abnormals.length>0){
      chips.push({cls:'chip-alert',label:'Neuro',val:`${abnormals.length} alterado(s)`});
    }else{
      chips.push({cls:'',label:'Neuro',val:'Normal'});
    }
  }
  if(currentStep>4 && symptoms.size>0){
    chips.push({cls:'chip-info',label:'Sintomas',val:`${symptoms.size}`});
  }
  if(chips.length===0) return '';
  let h='<div class="context-strip" role="status" aria-label="Resumo das etapas anteriores">';
  for(const c of chips){
    h+=`<span class="context-chip ${c.cls}">${c.label}: <span class="chip-val">${c.val}</span></span>`;
  }
  h+='</div>';
  return h;
}

// ============================================
// PROGRESS
// ============================================
function progHTML(idx,allDone){
  let h='<div class="progress-bar" role="progressbar" aria-valuenow="'+(idx+1)+'" aria-valuemin="1" aria-valuemax="'+TOTAL_STEPS+'">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done':i===idx?'active':'';h+=`<div class="progress-step ${c}"></div>`}
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done-label':i===idx?'active-label':'';h+=`<span class="${c}">${STEP_LABELS[i]}</span>`}
  h+='</div><div class="flow-connector"><div class="arrow"></div></div>';
  h+=buildContextStrip();
  return h;
}

// ============================================
// RENDER ROUTER
// ============================================
function render(){
  // Auto-sync: if saddle anesthesia is selected in red flags, pre-fill neuro sensory
  if(redFlags.has('cauda_saddle') && neuro.sensory!=='saddle'){
    neuro.sensory='saddle';
    neuroSaddleAutoSynced=true;
  }
  // Reverse auto-sync: if saddle flag removed and it was auto-synced, clear it
  if(!redFlags.has('cauda_saddle') && neuroSaddleAutoSynced && neuro.sensory==='saddle'){
    neuro.sensory=null;
    neuroSaddleAutoSynced=false;
  }
  // Auto-sync gait change symptom with neuro gait finding
  if(neuro.gait && neuro.gait!=='normal' && neuro.gait!=='not_done'){
    symptoms.add('gait_change');
  }

  if(currentStep===0) renderRedFlags();
  else if(currentStep===1) renderPainType();
  else if(currentStep===2) renderLocation();
  else if(currentStep===3) renderNeuro();
  else if(currentStep===4) renderSymptoms();
  else renderResult();
}

// ============================================
// STEP 0: RED FLAGS
// ============================================
function renderRedFlags(){
  let h=progHTML(0,false);
  h+='<div class="card">';
  h+='<h2>Red Flags \u2014 Sinais de Alarme</h2>';
  h+='<p class="subtitle">Etapa 1 de '+TOTAL_STEPS+' \u2014 Identifique sinais de gravidade. Marque todos os presentes.</p>';

  // Cauda equina alert
  if(hasCaudaEquina()){
    h+='<div class="alert-banner" role="alert">';
    h+='<span class="alert-icon">\uD83D\uDEA8</span>';
    h+='<div><div class="alert-text">Possivel Sindrome da Cauda Equina</div>';
    h+='<div class="alert-detail">Avaliacao neurocirurgica urgente. RM de emergencia. Nao retardar investigacao.</div></div></div>';
  }

  // Vascular alert
  if(hasVascularRisk()){
    h+='<div class="alert-banner" role="alert">';
    h+='<span class="alert-icon">\u2764\uFE0F</span>';
    h+='<div><div class="alert-text">Risco vascular \u2014 Considerar emergencia aortica</div>';
    h+='<div class="alert-detail">Dor lombar + doenca vascular: excluir aneurisma aortico roto/disseccao.</div></div></div>';
  }

  // Infection alert when pattern present
  if(hasInfectionRisk()){
    h+='<div class="alert-banner" role="alert">';
    h+='<span class="alert-icon">\uD83E\uDDA0</span>';
    h+='<div><div class="alert-text">Risco de infeccao espinhal</div>';
    h+='<div class="alert-detail">Considerar espondilodiscite / abscesso epidural. Laboratorio e imagem precoces.</div></div></div>';
  }

  h+='<div class="options">';

  const groups=[
    {key:'cauda',emoji:'\uD83D\uDEA8',label:'Cauda equina'},
    {key:'infec',emoji:'\uD83E\uDDA0',label:'Infeccao'},
    {key:'neopl',emoji:'\uD83C\uDFAF',label:'Neoplasia'},
    {key:'fratura',emoji:'\uD83D\uDCA5',label:'Fratura'},
    {key:'vascular',emoji:'\u2764\uFE0F',label:'Vascular'},
  ];

  for(const grp of groups){
    const flags=RED_FLAGS.filter(f=>f.group===grp.key);
    h+=`<div class="option-group-label">${grp.emoji} ${grp.label}<span class="group-line"></span></div>`;
    for(const f of flags){
      const ck=redFlags.has(f.id);
      const sevClass=ck?(f.severity==='critical'?'flag-critical':'flag-warn'):'';
      h+=`<button class="check-btn ${ck?'checked':''} ${sevClass}" onclick="toggleFlag('${f.id}')" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${f.icon} ${f.label}</span></button>`;
    }
  }

  h+='</div>';
  h+='<button class="skip-flags" onclick="next()">Nenhum red flag \u2192 avancar</button>';
  h+='<div class="nav-row">';
  h+='<button class="nav-btn primary ready" onclick="next()">Proximo</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function renderPainType(){
  let h=progHTML(1,false);
  h+='<div class="card">';
  h+='<h2>Caracterizacao da Dor</h2>';
  h+='<p class="subtitle">Etapa 2 de '+TOTAL_STEPS+' \u2014 Tipo, duracao e intensidade da dor.</p>';

  // Pain type
  h+='<div class="section-label">Tipo da dor <span class="sl-line"></span></div>';
  h+='<div class="options">';
  for(const pt of PAIN_TYPES){
    const sel=painType===pt.id;
    h+=`<button class="option-btn ${sel?'selected':''}" onclick="setPainType('${pt.id}')" aria-pressed="${sel}">`;
    h+=`<span class="icon">${pt.icon}</span>`;
    h+=`<span class="label"><strong>${pt.label}</strong><br><span style="font-size:.78rem;color:#94a3b8">${pt.desc}</span></span>`;

    h+='</button>';
  }
  h+='</div>';

  // Duration
  h+='<div class="section-label" style="margin-top:1.25rem">Duracao dos sintomas <span class="sl-line"></span></div>';
  h+='<div class="duration-row">';
  for(const d of DURATIONS){
    const sel=painDuration===d.id;
    h+=`<button class="dur-chip ${sel?'picked':''}" onclick="setDuration('${d.id}')" aria-pressed="${sel}"><span class="dur-label">${d.label}</span><span class="dur-range">${d.range}</span></button>`;
  }
  h+='</div>';

  // EVA
  h+='<div class="section-label" style="margin-top:1.25rem">Intensidade \u2014 Escala Visual Analogica (EVA) <span class="sl-line"></span></div>';
  h+='<div class="eva-container">';
  h+=`<div class="eva-value-box"><div class="eva-value" style="color:${evaColor(evaScore)}">${evaScore}</div><div class="eva-label">EVA</div><div class="eva-intensity" style="color:${evaColor(evaScore)}">${evaIntensityLabel(evaScore)}</div></div>`;
  h+='<div class="eva-slider-wrap">';
  h+=`<input type="range" min="0" max="10" value="${evaScore}" class="eva-slider" style="background:${evaGradient(evaScore)}" oninput="setEva(this.value)" aria-label="Escala de dor de 0 a 10">`;
  h+='<div class="eva-anchors"><span>0 Sem dor</span><span>5 Moderada</span><span>10 Pior dor</span></div>';
  h+='</div></div>';

  // Validation
  const canProceed=painType && painDuration;
  const shakeClass=validationShake&&!canProceed?'shake':'';
  h+=`<div class="validation-hint ${!canProceed?'visible':''} ${shakeClass}" id="validationHint">${!painType?'Selecione o tipo da dor':!painDuration?'Selecione a duracao':''}</div>`;

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+=`<button class="nav-btn primary ${canProceed?'ready':''}" ${canProceed?'':'disabled'} onclick="next()">Proximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  validationShake=false;

  updateSliderStyle();
}

function updateSliderStyle(){
  const slider=document.querySelector('.eva-slider');
  if(!slider) return;
  const val=parseInt(slider.value);
  slider.style.background=evaGradient(val);
  const thumbColor=evaColor(val);
  let styleEl=document.getElementById('eva-thumb-style');
  if(!styleEl){styleEl=document.createElement('style');styleEl.id='eva-thumb-style';document.head.appendChild(styleEl)}
  styleEl.textContent=`.eva-slider::-webkit-slider-thumb{background:${thumbColor}} .eva-slider::-moz-range-thumb{background:${thumbColor}}`;
}

// ============================================
function renderNeuro(){
  let h=progHTML(3,false);
  h+='<div class="card">';
  h+='<h2>Avaliacao Neurologica</h2>';
  h+='<p class="subtitle">Etapa 4 de '+TOTAL_STEPS+' \u2014 Exame motor, sensitivo, reflexos, Lasegue, Babinski e marcha.</p>';

  // Auto-sync notice
  if(neuroSaddleAutoSynced && neuro.sensory==='saddle'){
    h+='<div class="auto-sync-notice">\u2139\uFE0F Sensibilidade "em sela" pre-selecionada com base no red flag de anestesia perineal.</div>';
  }

  h+='<div class="options">';

  const filled=neuroFilledCount();
  const total=neuroTotalFields();
  h+=`<div style="font-size:.72rem;color:#64748b;text-align:center;margin-bottom:.25rem">${filled} de ${total} campos preenchidos</div>`;

  for(const key of Object.keys(NEURO_TESTS)){
    const test=NEURO_TESTS[key];

    h+='<div class="neuro-grid">';
    for(const opt of test.opts){
      const picked=neuro[key]===opt.v;
      h+=`<button class="score-opt ${picked?'picked':''}" onclick="setNeuro('${key}','${opt.v}')" aria-pressed="${picked}">${opt.l}</button>`;
    }
    h+='</div>';
  }

  // Dermatome reference - show cervical or lumbar based on location
  const showCervical=locations.has('cervical');
  const showLumbar=locations.has('lumbar') || locations.has('sacral') || (!showCervical);

  if(showLumbar){
    h+='<div class="section-label" style="margin-top:1.25rem">Referencia de dermatomos lombossacros <span class="sl-line"></span></div>';
    h+='<div class="dermatome-hint">';
    h+='<div class="derm-row" style="font-weight:700;color:#64748b;font-size:.62rem;border-bottom:1px solid #334155"><span class="derm-level">Nivel</span><span style="flex:1">Motor</span><span style="min-width:5rem">Sensitivo</span><span style="min-width:3rem">Reflexo</span></div>';
    for(const d of DERMATOMES){
      h+=`<div class="derm-row"><span class="derm-level">${d.level}</span><span style="flex:1">${d.motor}</span><span style="color:#64748b;font-size:.65rem;min-width:5rem">${d.sensory}</span><span style="color:#93c5fd;font-size:.65rem;min-width:3rem">${d.reflex}</span></div>`;
    }
    h+='</div>';
  }

  if(showCervical){
    h+='<div class="section-label" style="margin-top:1.25rem">Referencia de dermatomos cervicais <span class="sl-line"></span></div>';
    h+='<div class="dermatome-hint">';
    h+='<div class="derm-row" style="font-weight:700;color:#64748b;font-size:.62rem;border-bottom:1px solid #334155"><span class="derm-level">Nivel</span><span style="flex:1">Motor</span><span style="min-width:5rem">Sensitivo</span><span style="min-width:3rem">Reflexo</span></div>';
    for(const d of DERMATOMES_CERVICAL){
      h+=`<div class="derm-row"><span class="derm-level">${d.level}</span><span style="flex:1">${d.motor}</span><span style="color:#64748b;font-size:.65rem;min-width:5rem">${d.sensory}</span><span style="color:#93c5fd;font-size:.65rem;min-width:3rem">${d.reflex}</span></div>`;
    }
    h+='</div>';
  }

  h+='</div>';

  const allFilled=filled===total;
  const missingFields=Object.keys(NEURO_TESTS).filter(k=>neuro[k]===null).map(k=>NEURO_TESTS[k].label);
  const shakeClass=validationShake&&!allFilled?'shake':'';
  h+=`<div class="validation-hint ${!allFilled?'visible':''} ${shakeClass}" id="validationHint">Falta: ${missingFields.join(', ')}</div>`;

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+=`<button class="nav-btn primary ${allFilled?'ready':''}" ${allFilled?'':'disabled'} onclick="next()">Proximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
  validationShake=false;
}

// STEP 4: ASSOCIATED SYMPTOMS
// ============================================
function renderSymptoms(){
  let h=progHTML(4,false);
  h+='<div class="card">';
  h+='<h2>Sintomas Associados</h2>';
  h+='<p class="subtitle">Etapa 5 de '+TOTAL_STEPS+' \u2014 Marque todos os sintomas presentes.</p>';
  h+='<div class="options">';
  for(const sx of ASSOC_SYMPTOMS){
    const ck=symptoms.has(sx.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSymptom('${sx.id}')" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${sx.icon} ${sx.label}</span></button>`;
  }
  h+='</div>';

  // Contextual clinical hints based on selected symptoms
  const hints=[];
  if(symptoms.has('morning_stiffness') && painType==='nonmechanical'){
    hints.push('\u2600\uFE0F Rigidez matinal + dor inflamatoria: considerar espondiloartropatia (especialmente se < 45 anos).');
  }
  if(symptoms.has('abd_pain') && painType==='referred'){
    hints.push('\uD83E\uDEC3 Dor abdominal + padrao referido: excluir patologia visceral (renal, pancreatica, ginecologica, aortica).');
  }
  if(symptoms.has('gait_change') && symptoms.has('paresthesia')){
    hints.push('\uD83E\uDDBF Alteracao de marcha + parestesias: sugestivo de mielopatia ou compressao medular significativa.');
  }
  if(symptoms.has('bilateral_sx') && symptoms.has('claudication')){
    hints.push('\uD83D\uDEB6 Claudicacao neurogenica bilateral: padrao sugestivo de estenose de canal lombar.');
  }
  if(symptoms.has('night_waking') && painType==='nonmechanical'){
    hints.push('\uD83C\uDF19 Dor que acorda a noite + padrao inflamatorio: reforcar investigacao (neoplasia, infeccao, espondiloartropatia).');
  }
  if(symptoms.has('wt_bearing_pain') && hasFractureRisk()){
    hints.push('\uD83C\uDFCB\uFE0F Dor ao carregar peso + fator de risco para fratura: considerar fratura vertebral por insuficiencia.');
  }
  if(symptoms.has('hip_pain') && locations.has('lumbar')){
    hints.push('\uD83E\uDDB5 Dor no quadril + lombar: excluir coxartrose como causa primaria (testar rotacao interna do quadril).');
  }

  if(hints.length>0){
    h+='<div style="margin-top:.75rem">';
    for(const hint of hints){
      h+=`<div style="padding:.5rem .75rem;border-radius:.5rem;background:#172554;border:1px solid #1e40af;font-size:.75rem;color:#93c5fd;margin-bottom:.35rem;line-height:1.4">${hint}</div>`;
    }
    h+='</div>';
  }

  // Yellow flags for chronic pain
  if(painDuration==='chronic'){
    h+='<div class="yellow-flag-box">';
    h+='<strong>Yellow Flags \u2014 Fatores psicossociais (dor cronica):</strong><br>';
    h+='Avalie: catastrofizacao, medo-evitacao (cinesiofobia), depressao/ansiedade, insatisfacao laboral, ganho secundario, baixa expectativa de recuperacao.<br>';
    h+='<span style="font-size:.68rem;color:#818cf8">Instrumentos: STarT Back Tool, Orebro Musculoskeletal Pain Questionnaire, PHQ-9.</span>';
    h+='</div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary ready" onclick="next()">Ver Resultado</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

// STEP 5: RESULT
// ============================================
function renderResult(){
  const risk=getRiskLevel();
  const imaging=needsImaging();
  const fc=flagCount();

  let h=progHTML(TOTAL_STEPS,true);

  // Expand/Collapse all toggle
  h+='<div class="expand-toggle"><button onclick="toggleAllSections()">Expandir / recolher tudo</button></div>';

  h+='<div class="card result-card">';

  // Badge
  const badgeCfg={
    emergent:{cls:'risk-emergent',icon:'\uD83D\uDEA8',title:'Emergencia',desc:'Avaliacao imediata necessaria. Risco de lesao neurologica irreversivel ou ameaca a vida.'},
    urgent:{cls:'risk-urgent',icon:'\u26A0\uFE0F',title:'Urgente',desc:'Red flags presentes. Investigacao complementar indicada antes da alta.'},
    routine:{cls:'risk-routine',icon:'\u2705',title:'Rotina',desc:'Sem sinais de alarme significativos. Manejo conservador inicial com orientacoes de retorno.'},
  }[risk];

  h+=`<div class="result-badge ${badgeCfg.cls}">${badgeCfg.icon}</div>`;
  h+=`<div class="result-title">${badgeCfg.title}</div>`;
  h+=`<div class="result-desc">${badgeCfg.desc}</div>`;

  // Flag count + EVA summary
  if(fc>0){
    h+=`<span class="flag-count has-flags">\uD83D\uDEA9 ${fc} red flag${fc>1?'s':''}</span> `;
  }else{
    h+=`<span class="flag-count no-flags">\u2705 Nenhum red flag</span> `;
  }
  h+=`<span class="flag-count" style="background:${evaColor(evaScore)}20;color:${evaColor(evaScore)};border:1px solid ${evaColor(evaScore)}60">EVA ${evaScore}/10 \u2014 ${evaIntensityLabel(evaScore)}</span>`;

  // Single isolated flag caution for routine risk
  if(risk==='routine' && fc===1){
    h+='<div style="margin-top:.75rem;padding:.65rem;border-radius:.5rem;background:#1e293b;border:1px solid #334155;font-size:.8rem;color:#94a3b8;text-align:left">';
    h+='\u2139\uFE0F 1 red flag isolado identificado, sem padrao de alto risco. Manter seguimento ambulatorial com atencao.';
    h+='</div>';
  }

  // ---- COLLAPSIBLE: Red Flags Detail ----
  h+=collapsible('flags','Red Flags Identificados',()=>{
    let s='';
    if(fc===0){
      s+='<p style="color:#86efac;font-size:.85rem;text-align:center;padding:.5rem 0">Nenhum sinal de alarme identificado.</p>';
    }else{
      for(const f of RED_FLAGS){
        if(redFlags.has(f.id)){
          const dotCls=f.severity==='critical'?'dot-red':'dot-yellow';
          s+=`<div class="summary-row"><span class="criteria">${f.icon} ${f.label}</span><span class="value"><span class="dot ${dotCls}"></span> Presente</span></div>`;
        }
      }
      // Syndrome alerts
      if(hasCaudaEquina()) s+=buildSyndromeAlert('\uD83D\uDEA8','Sindrome da cauda equina suspeitada','#450a0a','#7f1d1d','#fca5a5');
      if(hasInfectionRisk()) s+=buildSyndromeAlert('\uD83E\uDDA0','Risco de infeccao espinhal','#451a03','#78350f','#fcd34d');
      if(hasCancerRisk()) s+=buildSyndromeAlert('\uD83C\uDFAF','Risco de neoplasia','#451a03','#78350f','#fcd34d');
      if(hasFractureRisk()) s+=buildSyndromeAlert('\uD83D\uDCA5','Risco de fratura','#451a03','#78350f','#fcd34d');
      if(hasVascularRisk()) s+=buildSyndromeAlert('\u2764\uFE0F','Risco vascular \u2014 excluir emergencia aortica','#450a0a','#7f1d1d','#fca5a5');
    }
    return s;
  });

  // ---- COLLAPSIBLE: Classification ----
  h+=collapsible('classification','Classificacao Clinica',()=>{
    let s='';
    const ptLabel=PAIN_TYPES.find(p=>p.id===painType);
    s+=`<div class="summary-row"><span class="criteria">Tipo de dor</span><span class="value"><span class="dot ${painType==='mechanical'?'dot-blue':painType==='nonmechanical'?'dot-yellow':'dot-red'}"></span> ${ptLabel?ptLabel.label:'--'}</span></div>`;
    const durLabel=DURATIONS.find(d=>d.id===painDuration);
    s+=`<div class="summary-row"><span class="criteria">Duracao</span><span class="value">${durLabel?durLabel.label+' ('+durLabel.range+')':'--'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Intensidade (EVA)</span><span class="value" style="color:${evaColor(evaScore)}">${evaScore}/10 \u2014 ${evaIntensityLabel(evaScore)}</span></div>`;
    const locNames=[...locations].map(id=>{const l=LOCATIONS.find(x=>x.id===id);return l?l.label:id});
    s+=`<div class="summary-row"><span class="criteria">Localizacao</span><span class="value">${locNames.join(', ')||'--'}</span></div>`;
    const irradNames=[...irradiation].map(id=>{const ir=IRRADIATION.find(x=>x.id===id);return ir?ir.label:id});
    s+=`<div class="summary-row"><span class="criteria">Irradiacao</span><span class="value">${irradNames.length>0?irradNames.join(', '):'Nao informada'}</span></div>`;
    return s;
  });

  // ---- COLLAPSIBLE: Neuro Detail ----
  h+=collapsible('neuro_detail','Exame Neurologico',()=>{
    let s='';
    for(const key of Object.keys(NEURO_TESTS)){
      const test=NEURO_TESTS[key];
      const val=neuro[key];
      const optLabel=val?test.opts.find(o=>o.v===val)?.l:'--';
      const isAbnormal=val && val!=='normal' && val!=='negative' && val!=='not_done';
      s+=`<div class="summary-row"><span class="criteria">${test.label}</span><span class="value"><span class="dot ${isAbnormal?'dot-yellow':'dot-green'}"></span> ${optLabel}</span></div>`;
    }

    // Myelopathy warning
    if(neuro.babinski==='extensor' || neuro.reflex==='hiper' || neuro.gait==='spastic'){
      s+='<div style="margin-top:.75rem;padding:.65rem;border-radius:.5rem;background:#450a0a;border:1px solid #7f1d1d;font-size:.8rem;color:#fca5a5;font-weight:600">';
      s+='\u26A0\uFE0F Sinais de neuronio motor superior \u2014 considerar mielopatia / compressao medular</div>';
    }

    // Foot drop warning
    if(neuro.gait==='steppage'){
      s+='<div style="margin-top:.75rem;padding:.65rem;border-radius:.5rem;background:#451a03;border:1px solid #78350f;font-size:.8rem;color:#fcd34d;font-weight:600">';
      s+='\uD83E\uDDB6 Marcha escarvante (pe caido) \u2014 deficit motor L4-L5 significativo. Investigacao urgente com RM.</div>';
    }

    // Radiculopathy correlation hint
    if(neuro.sensory==='dermatomal' && neuro.slr && neuro.slr.startsWith('positive')){
      s+='<div style="margin-top:.75rem;padding:.65rem;border-radius:.5rem;background:#172554;border:1px solid #1e40af;font-size:.8rem;color:#93c5fd;font-weight:600">';
      s+='\u26A1 Lasegue positivo + alteracao em dermatomal definido \u2014 padrao consistente com radiculopatia compressiva</div>';
    }

    // Progressive deficit warning
    if(neuro.motor==='grave' || neuro.motor==='moderado'){
      const bilateral=irradiation.has('bilateral_legs');
      if(bilateral){
        s+='<div style="margin-top:.75rem;padding:.65rem;border-radius:.5rem;background:#450a0a;border:1px solid #7f1d1d;font-size:.8rem;color:#fca5a5;font-weight:600">';
        s+='\uD83D\uDEA8 Deficit motor bilateral \u2014 alto risco de compressao medular ou cauda equina</div>';
      }
    }

    return s;
  });

  // ---- COLLAPSIBLE: Symptoms ----
  h+=collapsible('symptoms_detail','Sintomas Associados',()=>{
    let s='';
    if(symptoms.size===0){
      s+='<p style="color:#64748b;font-size:.85rem;text-align:center;padding:.5rem 0">Nenhum sintoma associado selecionado.</p>';
    }else{
      for(const sx of ASSOC_SYMPTOMS){
        if(symptoms.has(sx.id)){
          s+=`<div class="summary-row"><span class="criteria">${sx.icon} ${sx.label}</span><span class="value"><span class="dot dot-blue"></span> Presente</span></div>`;
        }
      }
    }

    // Clinical correlation for bilateral symptoms
    if(symptoms.has('bilateral_sx') && symptoms.has('claudication')){
      s+='<div style="margin-top:.75rem;padding:.65rem;border-radius:.5rem;background:#172554;border:1px solid #1e40af;font-size:.8rem;color:#93c5fd">';
      s+='\uD83D\uDEB6 Claudicacao neurogenica + sintomas bilaterais: padrao sugestivo de estenose de canal lombar</div>';
    }
    if(symptoms.has('gait_change') && (neuro.babinski==='extensor' || neuro.reflex==='hiper' || neuro.gait==='spastic')){
      s+='<div style="margin-top:.75rem;padding:.65rem;border-radius:.5rem;background:#450a0a;border:1px solid #7f1d1d;font-size:.8rem;color:#fca5a5">';
      s+='\u26A0\uFE0F Alteracao de marcha + sinais de NMS: considerar mielopatia cervical/toracica</div>';
    }
    // Inflammatory pattern correlation
    if(symptoms.has('morning_stiffness') && painType==='nonmechanical'){
      s+='<div style="margin-top:.75rem;padding:.65rem;border-radius:.5rem;background:#172554;border:1px solid #1e40af;font-size:.8rem;color:#93c5fd">';
      s+='\u2600\uFE0F Rigidez matinal + dor inflamatoria: considerar espondiloartropatia. Solicitar HLA-B27, PCR, sacroiliacas em RX/RM.</div>';
    }
    return s;
  });

  // ---- COLLAPSIBLE: Workup ----
  h+=collapsible('workup','Investigacao Sugerida',()=>buildWorkup(risk,imaging));

  // ---- COLLAPSIBLE: Conduta ----
  h+=buildConduta(risk);

  // ---- COLLAPSIBLE: Differential ----
  h+=collapsible('diferencial','Diagnosticos Diferenciais',()=>buildDifferentials(risk));

  // ---- COLLAPSIBLE: Note ----
  h+=collapsible('note','Nota para Prontuario',()=>buildNoteContent(risk,imaging));

  // Disclaimer
  h+='<div class="disclaimer">Esta ferramenta e um auxiliar de decisao clinica e nao substitui o julgamento medico. Correlacione com a apresentacao clinica completa do paciente.</div>';

  // Nav
  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn danger" onclick="confirmRestart()">Recomecar</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

// SYNDROME ALERT HELPER

function buildSyndromeAlert(icon,text,bg,border,color){
  return `<div style="margin-top:.75rem;padding:.65rem;border-radius:.5rem;background:${bg};border:1px solid ${border};font-size:.8rem;color:${color};font-weight:600">${icon} ${text}</div>`;
