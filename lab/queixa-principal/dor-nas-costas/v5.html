// ============================================
// COLLAPSIBLE
// ============================================
function collapsible(id,title,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')" role="button" aria-expanded="${open}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('${id}')}">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open)h+=contentFn();
  h+='</div></div>';
  return h;
}

// ============================================
// WORKUP
// ============================================
function buildWorkup(risk,imaging){
  let s='';

  if(risk==='emergent'){
    s+='<div style="padding:.65rem;border-radius:.5rem;background:#450a0a;border:1px solid #7f1d1d;font-size:.85rem;color:#fca5a5;font-weight:600;margin-bottom:.75rem">\uD83D\uDEA8 Imagem imediata indicada</div>';
    s+=`<div class="summary-row"><span class="criteria">Exame prioritario</span><span class="value" style="color:#fca5a5">RM da coluna (emergencia)</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Alternativa se RM indisponivel</span><span class="value">TC da coluna</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Laboratorio</span><span class="value">HMG, PCR, VHS, Hemocultura</span></div>`;
    if(hasCaudaEquina()){
      s+=`<div class="summary-row"><span class="criteria">Avaliacao</span><span class="value" style="color:#fca5a5">Neurocirurgia urgente</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Adicional</span><span class="value">Residuo pos-miccional (USG bexiga ou cateterismo)</span></div>`;
    }
    if(hasInfectionRisk()){
      s+=`<div class="summary-row"><span class="criteria">Avaliacao</span><span class="value" style="color:#fca5a5">Infectologia / ATB empirica</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Laboratorio adicional</span><span class="value">Procalcitonina, Lactato, Urina I</span></div>`;
    }
    if(hasVascularRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem vascular</span><span class="value" style="color:#fca5a5">AngioTC aorta (excluir aneurisma)</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Avaliacao</span><span class="value" style="color:#fca5a5">Cirurgia vascular de emergencia</span></div>`;
    }
    if(neuro.gait==='spastic' || neuro.babinski==='extensor' || neuro.reflex==='hiper'){
      s+=`<div class="summary-row"><span class="criteria">Mielopatia</span><span class="value" style="color:#fca5a5">RM cervical + toracica (toda a medula)</span></div>`;
    }
  } else if(risk==='urgent'){
    s+='<div style="padding:.65rem;border-radius:.5rem;background:#451a03;border:1px solid #78350f;font-size:.85rem;color:#fcd34d;font-weight:600;margin-bottom:.75rem">\u26A0\uFE0F Investigacao complementar indicada</div>';
    if(hasCancerRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">RX coluna + RM se RX alterado</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Laboratorio</span><span class="value">HMG, VHS, PCR, FA, Ca\u00B2\u207A, Eletroforese proteinas</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Rastreio</span><span class="value">PSA (H) / Mamografia (M) conforme idade</span></div>`;
    }
    if(hasInfectionRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">RM da coluna (preferencial)</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Laboratorio</span><span class="value">HMG, PCR, VHS, Procalcitonina, Hemocultura x2</span></div>`;
    }
    if(hasFractureRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">RX coluna (AP + Perfil)</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Se alterado</span><span class="value">TC para detalhamento osseo</span></div>`;
      if(redFlags.has('osteoporosis')||redFlags.has('corticoid')){
        s+=`<div class="summary-row"><span class="criteria">Adicional</span><span class="value">Densitometria ambulatorial / Vit D / Ca\u00B2\u207A / PTH</span></div>`;
      }
    }
    if(hasVascularRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">USG abdominal (aorta) ou AngioTC</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Avaliacao</span><span class="value">Cirurgia vascular</span></div>`;
    }
    if(!hasCancerRisk() && !hasInfectionRisk() && !hasFractureRisk() && !hasVascularRisk()){
      s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">RX coluna inicialmente</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Laboratorio</span><span class="value">HMG, VHS, PCR basais</span></div>`;
    }
    if(neuro.motor && neuro.motor!=='normal'){
      s+=`<div class="summary-row"><span class="criteria">Deficit motor</span><span class="value" style="color:#fcd34d">Considerar RM precoce</span></div>`;
    }
    if(neuro.babinski==='extensor'){
      s+=`<div class="summary-row"><span class="criteria">Babinski positivo</span><span class="value" style="color:#fcd34d">RM para excluir mielopatia</span></div>`;
    }
    if(neuro.gait==='steppage'){
      s+=`<div class="summary-row"><span class="criteria">Pe caido</span><span class="value" style="color:#fcd34d">RM + ENMG para localizar lesao</span></div>`;
    }
    // Thoracic specific workup
    if(locations.has('thoracic')){
      s+=`<div class="summary-row"><span class="criteria">Dor toracica</span><span class="value" style="color:#fcd34d">Considerar RX torax, ECG e RM da coluna toracica</span></div>`;
    }
  } else {
    s+='<div style="padding:.65rem;border-radius:.5rem;background:#052e16;border:1px solid #14532d;font-size:.85rem;color:#86efac;font-weight:600;margin-bottom:.75rem">\u2705 Imagem nao indicada inicialmente</div>';
    s+=`<div class="summary-row"><span class="criteria">Conduta inicial</span><span class="value">Manejo conservador 4\u20136 semanas</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Imagem</span><span class="value">Somente se sem melhora apos 4\u20136 sem</span></div>`;
    if(symptoms.has('radiculopathy') && (neuro.slr==='positive_uni' || neuro.slr==='positive_bi')){
      s+=`<div class="summary-row"><span class="criteria">Radiculopatia + Lasegue+</span><span class="value" style="color:#93c5fd">Considerar RM se persistente (&gt; 6 sem)</span></div>`;
    }
    if(painType==='nonmechanical'){
      s+=`<div class="summary-row"><span class="criteria">Dor inflamatoria</span><span class="value">Considerar HLA-B27, PCR, VHS, RX sacroiliacas</span></div>`;
    }
    if(painDuration==='chronic'){
      s+=`<div class="summary-row"><span class="criteria">Dor cronica (&gt; 12 sem)</span><span class="value">Considerar RX + encaminhamento ambulatorial</span></div>`;
    }
    if(neuro.motor==='leve'){
      s+=`<div class="summary-row"><span class="criteria">Leve deficit motor</span><span class="value" style="color:#93c5fd">Reavaliacao precoce; RM se progressao</span></div>`;
    }
  }
  return s;
}

// ============================================
// CONDUTA
// ============================================
function buildConduta(risk){
  let cls,title,items;
  if(risk==='emergent'){
    cls='alta-prob';title='Conduta de Emergencia';
    items=[
      ['\uD83D\uDEA8','RM de emergencia da coluna','Solicitar com urgencia; TC se RM indisponivel'],
      ['\uD83D\uDC69\u200D\u2695\uFE0F','Avaliacao neurocirurgica imediata','Contato direto com plantonista'],
      ['\uD83D\uDC89','Acesso venoso + laboratorio completo','HMG, PCR, VHS, Ur, Cr, Hemocultura'],
      ['\uD83D\uDCCA','Monitorar funcao neurologica seriadamente','Forca, sensibilidade, esfincteres a cada 2\u20134h'],
      ['\uD83D\uDC8A','Analgesia: Dipirona 1g IV + Tramadol 50\u2013100mg IV','Considerar Dexametasona 10mg IV se compressao medular'],
    ];
    if(hasInfectionRisk()){
      items.push(['\uD83E\uDDA0','ATB empirica: Oxacilina 2g IV 4/4h + Ceftriaxona 2g IV 12/12h','Ajustar conforme culturas; Vanco se MRSA']);
    }
    if(hasVascularRisk()){
      items.push(['\u2764\uFE0F','AngioTC de aorta + Cirurgia vascular urgente','Tipagem sanguinea, reserva de hemocomponentes']);
    }
    if(hasCaudaEquina()){
      items.push(['\uD83D\uDEBD','Cateterismo vesical + medir residuo pos-miccional','Documentar funcao esfincteriana basal']);
    }
  } else if(risk==='urgent'){
    cls='mod-prob';title='Conduta Urgente';
    items=[
      ['\uD83D\uDCCB','Investigacao complementar conforme red flags','Nao dar alta antes do resultado da imagem'],
      ['\uD83D\uDCF7','Imagem da coluna (RX ou RM conforme indicacao)','RX se fratura; RM se infeccao/neoplasia/deficit motor'],
      ['\uD83E\uDDEA','Laboratorio: HMG, VHS, PCR','Adicionar conforme suspeita especifica'],
      ['\uD83D\uDC8A','Analgesia escalonada','Dipirona 1g VO/IV 6/6h > Cetoprofeno 100mg VO/IV 12/12h > Tramadol 50mg VO 6/6h SN'],
      ['\uD83D\uDD04','Reavaliacao em 48\u201372h ou antes se piora','Orientar sinais de alarme para retorno imediato'],
    ];
    if(hasCancerRisk()){
      items.push(['\uD83C\uDFAF','Rastreio oncologico + encaminhamento','Eletroforese de proteinas, marcadores tumorais']);
    }
    if(locations.has('thoracic')){
      items.push(['\uD83E\uDDB4','Investigacao adicional para dor toracica','ECG para excluir causa cardiaca; RX torax']);
    }
    // NSAID contraindication warning
    items.push(['\u26A0\uFE0F','Atencao com AINEs','Contraindicado em DRC (TFG < 30), ulcera peptica ativa, uso de anticoagulantes. Considerar inibidor de bomba de protons se uso > 5 dias.']);
  } else {
    cls='baixa-prob';title='Manejo Conservador';
    items=[
      ['\u2705','Sem indicacao de imagem neste momento','Imagem precoce nao melhora desfecho em dor inespecifica'],
      ['\uD83D\uDC8A','Analgesia regular por 5\u20137 dias','Dipirona 1g VO 6/6h + Ibuprofeno 400mg VO 8/8h (com alimentacao)'],
      ['\uD83C\uDFCB\uFE0F','Manter atividades conforme tolerado','Evitar repouso absoluto; atividade leve acelera recuperacao'],
      ['\uD83D\uDCD6','Educacao sobre prognostico favoravel','Maioria resolve em 4\u20136 semanas; raramente e doenca grave'],
      ['\uD83D\uDD04','Retorno se: piora, sintomas novos, febre, ou sem melhora em 4\u20136 semanas',''],
      ['\u26A0\uFE0F','Precaucoes com AINEs (Ibuprofeno)','Contraindicado em DRC, ulcera ativa, anticoagulacao. Usar por periodo limitado (5\u20137 dias). Tomar com alimento.'],
    ];
    if(painType==='nonmechanical'){
      items.push(['\uD83E\uDD14','Considerar encaminhamento reumatologico','Especialmente se < 45 anos + rigidez matinal > 30min + sacroileite']);
    }
    if(symptoms.has('radiculopathy')){
      items.push(['\u26A1','Dor neuropatica: Gabapentina 300mg VO a noite','Titular ate 900\u20131200mg/dia conforme resposta; Pregabalina como alternativa']);
    }
    if(evaScore>=7){
      items.push(['\uD83D\uDE16','Dor intensa (EVA \u2265 7): considerar Ciclobenzaprina 5mg VO 8/8h','Por 5\u20137 dias; sonolencia como efeito colateral principal']);
    }
    if(painDuration==='chronic'){
      items.push(['\uD83E\uDDD1\u200D\u2695\uFE0F','Encaminhamento ambulatorial para reavaliacao','Fisioterapia, avaliacao psicossocial (fatores yellow flags)']);
      items.push(['\uD83E\uDDE0','Abordagem biopsicossocial','Avaliar catastrofizacao, cinesiofobia (medo do movimento) e depressao/ansiedade. Instrumentos: STarT Back, PHQ-9.']);
    }
    // Return to activity guidance
    items.push(['\uD83C\uDFC3','Retorno gradual as atividades','Atividade fisica leve desde o inicio (caminhadas). Evitar carga pesada por 2\u20134 sem. Progresso conforme tolerancia.']);
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${cls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')" role="button" aria-expanded="${open}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('conduta')}"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open){
    for(const item of items){
      const [icon,text,detail]=item;
      h+=`<div class="conduta-item"><span class="conduta-icon">${icon}</span><span>${text}`;
      if(detail) h+=`<div class="conduta-detail">${detail}</div>`;
      h+=`</span></div>`;
    }
  }
  h+='</div></div>';
  return h;
}

// ============================================
// DIFFERENTIAL DIAGNOSES
// ============================================
function buildDifferentials(risk){
  let diffs=[];

  // Based on location
  if(locations.has('lumbar')){
    diffs.push({name:'Lombalgia mecanica inespecifica',prob:risk==='routine'?'high':'mod',note:'Causa mais comum (85\u201390%); diagnostico de exclusao'});
    if(symptoms.has('radiculopathy') || irradiation.has('below_knee')){
      diffs.push({name:'Hernia discal com radiculopatia',prob:'mod',note:'Dor abaixo do joelho + Lasegue positivo; L4-L5 e L5-S1 mais comuns'});
    }
    if(symptoms.has('claudication')){
      diffs.push({name:'Estenose de canal lombar',prob:'mod',note:'Claudicacao neurogenica, melhora ao sentar/fletir; mais comum > 60 anos'});
    }
    if(symptoms.has('hip_pain')){
      diffs.push({name:'Dor referida do quadril (coxartrose)',prob:'low',note:'Dor lombar que na verdade origina-se do quadril; testar rotacao interna'});
    }
    // Piriformis syndrome
    if(irradiation.has('buttock') || irradiation.has('posterior_thigh')){
      diffs.push({name:'Sindrome do piriforme',prob:'low',note:'Dor glutea com irradiacao para coxa posterior; piora ao sentar; Lasegue pode ser negativo. Teste FAIR (Flexao, Aducao, Rotacao Interna).'});
    }
  }
  if(locations.has('cervical')){
    diffs.push({name:'Cervicalgia mecanica',prob:risk==='routine'?'high':'mod',note:'Dor muscular/articular cervical, muito comum'});
    if(irradiation.has('upper_limb')){
      diffs.push({name:'Cervicobraquialgia / Radiculopatia cervical',prob:'mod',note:'Irradiacao para membro superior em dermatomal; Spurling positivo'});
    }
    if(neuro.babinski==='extensor' || neuro.reflex==='hiper' || neuro.gait==='spastic'){
      diffs.push({name:'Mielopatia cervical',prob:'high',note:'Sinais de NMS + cervicalgia \u2014 urgente; investigar com RM'});
    }
  }
  if(locations.has('thoracic')){
    diffs.push({name:'Dor toracica musculoesqueletica',prob:'mod',note:'Dor em coluna toracica e mais preocupante \u2014 sempre investigar'});
    if(neuro.babinski==='extensor' || neuro.reflex==='hiper' || neuro.gait==='spastic'){
      diffs.push({name:'Mielopatia toracica',prob:'high',note:'Sinais de NMS + dor toracica \u2014 urgente; RM da coluna toracica'});
    }
    // Thoracic specific differentials
    diffs.push({name:'Fratura vertebral por insuficiencia',prob:risk==='routine'?'low':'mod',note:'Especialmente em idosos/osteoporose; dor aguda localizada'});
    // Scheuermann
    if(painDuration==='chronic'){
      diffs.push({name:'Doenca de Scheuermann',prob:'low',note:'Hipercifose toracica em adolescentes/adultos jovens; dor cronica dorsal; RX com cunha vertebral'});
    }
    // Herpes zoster
    if(neuro.sensory==='dermatomal'){
      diffs.push({name:'Herpes zoster (nevralgia pos-herpetica)',prob:'low',note:'Dor dermatomal unilateral, queimacao; pode preceder vesiculas em 2\u20133 dias'});
    }
  }
  if(locations.has('sacral')){
    diffs.push({name:'Disfuncao sacroiliaca',prob:'mod',note:'Dor na nadega, piora ao sentar prolongado; testes provocativos (FABER, Gaenslen, Compressao)'});
    if(painType==='nonmechanical'){
      diffs.push({name:'Espondiloartropatia (ex: Espondilite Anquilosante)',prob:'mod',note:'< 45 anos + rigidez matinal + melhora com atividade; HLA-B27'});
    }
  }

  // Red flag based
  if(hasCaudaEquina()){
    diffs.push({name:'Sindrome da cauda equina',prob:'high',note:'Emergencia \u2014 anestesia em sela, disfuncao esfincteriana; RM + neurocirurgia'});
  }
  if(hasInfectionRisk()){
    diffs.push({name:'Espondilodiscite / Abscesso epidural',prob:'high',note:'Febre + dor + fator de risco; mortalidade se atraso diagnostico'});
  }
  if(hasCancerRisk()){
    diffs.push({name:'Metastase vertebral',prob:'high',note:'Cancer previo + dor progressiva noturna; pulmao, mama, prostata, rim mais comuns'});
  }
  if(hasFractureRisk()){
    diffs.push({name:'Fratura vertebral (traumatica ou patologica)',prob:'high',note:'Trauma ou osteoporose + dor aguda localizada; RX + TC'});
  }
  if(hasVascularRisk()){
    diffs.push({name:'Aneurisma de aorta abdominal (roto/em expansao)',prob:'high',note:'Dor lombar + doenca vascular; potencialmente fatal; AngioTC'});
  }

  // Always consider
  if(painType==='referred'){
    diffs.push({name:'Dor referida visceral (renal, pancreatica, ginecologica)',prob:'mod',note:'Dor constante, sem relacao postural; investigar conforme clinica'});
    diffs.push({name:'Nefrolitiase / Pielonefrite',prob:'mod',note:'Dor em flanco + sintomas urinarios; urina I + USG renal'});
  }
  if(painType==='nonmechanical' && !locations.has('sacral')){
    diffs.push({name:'Espondiloartropatia',prob:'low',note:'Se < 45 anos + rigidez matinal > 30min + melhora com exercicio; HLA-B27'});
  }

  // Herpes zoster for dermatomal sensory loss anywhere
  if(neuro.sensory==='dermatomal' && !locations.has('thoracic')){
    diffs.push({name:'Herpes zoster',prob:'low',note:'Dor dermatomal unilateral, queimacao/ardencia; pode preceder vesiculas. Especialmente em idosos/imunossuprimidos.'});
  }

  // General differentials for routine
  if(risk==='routine'){
    if(!symptoms.has('radiculopathy') && !symptoms.has('claudication')){
      diffs.push({name:'Distensao muscular / ligamentar',prob:'high',note:'Historia de esforco, boa evolucao; resolucao esperada em 2\u20134 semanas'});
    }
    // Myofascial pain
    diffs.push({name:'Sindrome dolorosa miofascial',prob:'mod',note:'Pontos-gatilho palpaveis, dor referida em padrao previsivel'});
    // Fibromyalgia
    if(painDuration==='chronic' && (neuro.sensory==='difusa' || symptoms.has('paresthesia'))){
      diffs.push({name:'Fibromialgia',prob:'low',note:'Dor difusa > 3 meses, fadiga, disturbio do sono, sensibilidade difusa. Criterios ACR 2016. Exame neurologico tipicamente normal.'});
    }
  }

  // Waddell signs reminder for chronic non-organic pain
  if(painDuration==='chronic' && risk==='routine'){
    diffs.push({name:'Dor nao-organica (sinais de Waddell)',prob:'low',note:'5 categorias: sensibilidade superficial/nao anatomica, simulacao, distracao, padrao regional, reacao exagerada. \u2265 3 positivos e sugestivo. Nao exclui doenca organica.'});
  }

  // Remove duplicates by name
  const seen=new Set();
  diffs=diffs.filter(d=>{if(seen.has(d.name)) return false;seen.add(d.name);return true});

  // Sort by probability
  const probOrder={high:0,mod:1,low:2};
  diffs.sort((a,b)=>probOrder[a.prob]-probOrder[b.prob]);

  let s='<div class="diff-box">';
  if(diffs.length===0){
    s+='<p style="color:#64748b;font-size:.82rem;text-align:center;padding:.5rem 0">Avalie o quadro clinico completo.</p>';
  }else{
    for(const d of diffs){
      const probLabel={high:'Provavel',mod:'Considerar',low:'Menos provavel'}[d.prob];
      const probCls={high:'prob-high',mod:'prob-mod',low:'prob-low'}[d.prob];
      s+=`<div class="diff-item"><span class="diff-prob ${probCls}">${probLabel}</span><span style="flex:1"><strong>${d.name}</strong><br><span style="font-size:.68rem;color:#94a3b8">${d.note}</span></span></div>`;
    }
  }
  s+='</div>';
  return s;
}

// ============================================
// NOTE
// ============================================
function buildNoteContent(risk,imaging){
  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  let n='';
  n+=`DOR NAS COSTAS - AVALIACAO ESTRUTURADA\n`;
  n+=`Data/hora: ${ts}\n`;
  n+=`========================================\n\n`;

  // Red flags
  n+=`RED FLAGS: ${flagCount()} identificado(s)\n`;
  if(flagCount()===0){
    n+=`  Nenhum sinal de alarme.\n`;
  }else{
    for(const f of RED_FLAGS){
      if(redFlags.has(f.id)) n+=`  [!] ${f.label}\n`;
    }
  }
  if(hasCaudaEquina()) n+=`  >>> SINDROME DA CAUDA EQUINA SUSPEITADA <<<\n`;
  if(hasInfectionRisk()) n+=`  >>> RISCO DE INFECCAO ESPINHAL <<<\n`;
  if(hasCancerRisk()) n+=`  >>> RISCO DE NEOPLASIA <<<\n`;
  if(hasFractureRisk()) n+=`  >>> RISCO DE FRATURA <<<\n`;
  if(hasVascularRisk()) n+=`  >>> RISCO VASCULAR - EXCLUIR EMERGENCIA AORTICA <<<\n`;

  // Classification
  const ptLabel=PAIN_TYPES.find(p=>p.id===painType);
  const durLabel=DURATIONS.find(d=>d.id===painDuration);
  n+=`\nCLASSIFICACAO DA DOR:\n`;
  n+=`  Tipo: ${ptLabel?ptLabel.label:'Nao classificada'}\n`;
  n+=`  Duracao: ${durLabel?durLabel.label+' ('+durLabel.range+')':'Nao informada'}\n`;
  n+=`  Intensidade (EVA): ${evaScore}/10 - ${evaIntensityLabel(evaScore)}\n`;
  const locNames=[...locations].map(id=>{const l=LOCATIONS.find(x=>x.id===id);return l?l.label:id});
  n+=`  Localizacao: ${locNames.join(', ')||'Nao informada'}\n`;
  const irradNames=[...irradiation].map(id=>{const ir=IRRADIATION.find(x=>x.id===id);return ir?ir.label:id});
  n+=`  Irradiacao: ${irradNames.length>0?irradNames.join(', '):'Nenhuma'}\n`;

  // Neuro
  n+=`\nEXAME NEUROLOGICO:\n`;
  for(const key of Object.keys(NEURO_TESTS)){
    const test=NEURO_TESTS[key];
    const val=neuro[key];
    const optLabel=val?test.opts.find(o=>o.v===val)?.l:'Nao avaliado';
    const abnormal=val && val!=='normal' && val!=='negative' && val!=='not_done';
    n+=`  ${test.label}: ${optLabel}${abnormal?' [ALTERADO]':''}\n`;
  }
  if(neuro.babinski==='extensor' || neuro.reflex==='hiper' || neuro.gait==='spastic'){
    n+=`  >>> SINAIS DE NEURONIO MOTOR SUPERIOR <<<\n`;
  }
  if(neuro.gait==='steppage'){
    n+=`  >>> MARCHA ESCARVANTE - PE CAIDO <<<\n`;
  }
  if(neuro.sensory==='saddle'){
    n+=`  >>> ANESTESIA EM SELA - CAUDA EQUINA <<<\n`;
  }

  // Symptoms
  n+=`\nSINTOMAS ASSOCIADOS:\n`;
  if(symptoms.size===0){
    n+=`  Nenhum.\n`;
  }else{
    for(const sx of ASSOC_SYMPTOMS){
      if(symptoms.has(sx.id)) n+=`  - ${sx.label}\n`;
    }
  }

  // Risk
  const riskLabels={emergent:'EMERGENCIA',urgent:'URGENTE',routine:'ROTINA'};
  n+=`\nESTRATIFICACAO: ${riskLabels[risk]}\n`;

  // Imaging
  const imgLabels={immediate:'IMEDIATA (RM emergencia)',urgent:'URGENTE (RM/RX)',consider:'CONSIDERAR (se persistente)',none:'NAO INDICADA (manejo conservador)'};
  n+=`Imagem: ${imgLabels[imaging]}\n`;

  // Conduta
  n+=`\nCONDUTA:\n`;
  if(risk==='emergent'){
    n+=`  - RM de emergencia da coluna\n`;
    n+=`  - Avaliacao neurocirurgica imediata\n`;
    n+=`  - Laboratorio completo + acesso venoso\n`;
    n+=`  - Analgesia: Dipirona 1g IV + Tramadol 50\u2013100mg IV\n`;
    if(hasInfectionRisk()) n+=`  - Hemocultura x2 + ATB empirica (Oxacilina + Ceftriaxona)\n`;
    if(hasCaudaEquina()){
      n+=`  - Monitorar funcao vesical/intestinal seriadamente\n`;
      n+=`  - Cateterismo vesical + medir residuo pos-miccional\n`;
    }
    if(hasVascularRisk()) n+=`  - AngioTC de aorta + Cirurgia vascular urgente\n`;
    if(neuro.gait==='spastic' || neuro.babinski==='extensor') n+=`  - RM cervical + toracica (investigar mielopatia)\n`;
  }else if(risk==='urgent'){
    n+=`  - Investigacao complementar (imagem + laboratorio)\n`;
    n+=`  - Analgesia: Dipirona 1g 6/6h + Cetoprofeno 100mg 12/12h\n`;
    n+=`  - Atencao: AINEs contraindicados em DRC, ulcera ativa, anticoagulacao\n`;
    n+=`  - Reavaliacao em 48\u201372h\n`;
    n+=`  - Orientados sinais de alarme para retorno imediato\n`;
    if(locations.has('thoracic')){
      n+=`  - ECG + RX torax (excluir causa cardiaca/pleural)\n`;
    }
  }else{
    n+=`  - Manejo conservador\n`;
    n+=`  - Analgesia: Dipirona 1g VO 6/6h + Ibuprofeno 400mg VO 8/8h por 5\u20137 dias\n`;
    n+=`  - Atencao: Ibuprofeno contraindicado em DRC, ulcera ativa, anticoagulacao\n`;
    n+=`  - Manter atividades conforme tolerado\n`;
    n+=`  - Retorno gradual a atividade fisica (caminhadas desde o inicio)\n`;
    n+=`  - Retorno se piora, febre, sintomas novos ou sem melhora em 4\u20136 semanas\n`;
    if(symptoms.has('radiculopathy')) n+=`  - Gabapentina 300mg VO a noite (dor neuropatica)\n`;
    if(evaScore>=7) n+=`  - Ciclobenzaprina 5mg VO 8/8h por 5\u20137 dias\n`;
    if(painDuration==='chronic'){
      n+=`  - Encaminhamento para fisioterapia e reavaliacao ambulatorial\n`;
      n+=`  - Avaliacao psicossocial (yellow flags): catastrofizacao, cinesiofobia, depressao\n`;
    }
  }

  n+=`\n========================================\n`;
  n+=`Gerado por: Avaliador de Dor nas Costas v5\n`;
  n+=`Ferramenta de apoio \u2014 nao substitui julgamento clinico.\n`;

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el) return;
  const text=el.textContent;
  // Clipboard API with fallback
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onCopySuccess).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');onCopySuccess()}catch(e){alert('Nao foi possivel copiar. Selecione o texto manualmente.')}
  document.body.removeChild(ta);
}

function onCopySuccess(){
  const btn=document.getElementById('copyBtn');
  if(!btn) return;
  btn.textContent='\u2713 Copiado!';btn.classList.add('copied');
  haptic('success');
  setTimeout(()=>{btn.textContent='Copiar nota';btn.classList.remove('copied')},2000);
}

// ============================================
// ACTIONS
// ============================================
function toggleFlag(id){
  redFlags.has(id)?redFlags.delete(id):redFlags.add(id);
  haptic('light');
  render();
}
function setPainType(id){painType=id;haptic('light');render()}
function setDuration(id){painDuration=id;haptic('light');render()}
function setEva(val){
  evaScore=parseInt(val);
  // Update visuals without full re-render for slider smoothness
  const valBox=document.querySelector('.eva-value');
  const intBox=document.querySelector('.eva-intensity');
  if(valBox){
    valBox.textContent=evaScore;
    valBox.style.color=evaColor(evaScore);
  }
  if(intBox){
    intBox.textContent=evaIntensityLabel(evaScore);
    intBox.style.color=evaColor(evaScore);
  }
  updateSliderStyle();
  // Update button enabled state
  const canProceed=painType && painDuration;
  const navBtn=document.querySelector('.nav-btn.primary');
  if(navBtn){
    navBtn.disabled=!canProceed;
    if(canProceed) navBtn.classList.add('ready');
    else navBtn.classList.remove('ready');
  }
  // Update validation hint
  const hint=document.getElementById('validationHint');
  if(hint){
    if(canProceed){hint.classList.remove('visible');hint.textContent=''}
    else{hint.classList.add('visible');hint.textContent=!painType?'Selecione o tipo da dor':'Selecione a duracao'}
  }
}
function toggleLocation(id){locations.has(id)?locations.delete(id):locations.add(id);haptic('light');render()}
function toggleIrrad(id){
  if(id==='none'){
    // Toggle none: if already set, deselect it; otherwise select only none
    if(irradiation.has('none') && irradiation.size===1){irradiation.clear()}
    else{irradiation=new Set(['none'])}
  }else{
    irradiation.delete('none');
    irradiation.has(id)?irradiation.delete(id):irradiation.add(id);
  }
  haptic('light');
  render();
}
function setNeuro(field,val){
  // If tapping the same value, deselect it (toggle behavior)
  if(neuro[field]===val){
    neuro[field]=null;
    // If it was the auto-synced saddle, also clear the flag
    if(field==='sensory' && val==='saddle') neuroSaddleAutoSynced=false;
  }else{
    neuro[field]=val;
    // If user manually changed sensory away from saddle, stop auto-sync
    if(field==='sensory' && val!=='saddle') neuroSaddleAutoSynced=false;
  }
  haptic('light');
  render();
}
function toggleSymptom(id){symptoms.has(id)?symptoms.delete(id):symptoms.add(id);haptic('light');render()}
function toggleSection(id){sections[id]=!sections[id];render()}
function toggleAllSections(){
  const allOpen=Object.values(sections).every(v=>v);
  const newVal=!allOpen;
  for(const key of Object.keys(sections)) sections[key]=newVal;
  render();
}

function next(){
  if(currentStep===1 && (!painType || !painDuration)){
    validationShake=true;
    render();
    // Scroll validation hint into view
    setTimeout(()=>{
      const hint=document.getElementById('validationHint');
      if(hint) hint.scrollIntoView({behavior:'smooth',block:'center'});
    },50);
    haptic('medium');
    return;
  }
  if(currentStep===2 && locations.size===0){
    validationShake=true;
    render();
    setTimeout(()=>{
      const hint=document.getElementById('validationHint');
      if(hint) hint.scrollIntoView({behavior:'smooth',block:'center'});
    },50);
    haptic('medium');
    return;
  }
  if(currentStep===3 && !Object.values(neuro).every(v=>v!==null)){
    validationShake=true;
    render();
    setTimeout(()=>{
      const hint=document.getElementById('validationHint');
      if(hint) hint.scrollIntoView({behavior:'smooth',block:'center'});
    },50);
    haptic('medium');
    return;
  }
  currentStep++;
  haptic('success');
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){
  if(currentStep>0){currentStep--;render();window.scrollTo({top:0,behavior:'smooth'})}
}

function confirmRestart(){
  overlayRoot.innerHTML=`
    <div class="restart-overlay" onclick="if(event.target===this)dismissRestart()">
      <div class="restart-dialog">
        <h3>Recomecar avaliacao?</h3>
        <p>Todos os dados preenchidos serao apagados. Esta acao nao pode ser desfeita.</p>
        <div class="dialog-btns">
          <button class="secondary" style="background:#334155;color:#cbd5e1" onclick="dismissRestart()">Cancelar</button>
          <button style="background:#991b1b;color:#fca5a5" onclick="doRestart()">Recomecar</button>
        </div>
      </div>
    </div>`;
}

function dismissRestart(){
  overlayRoot.innerHTML='';
}

function doRestart(){
  overlayRoot.innerHTML='';
  currentStep=0;redFlags=new Set();painType=null;painDuration=null;evaScore=5;
  locations=new Set();irradiation=new Set();
  neuro={motor:null,sensory:null,reflex:null,slr:null,babinski:null,gait:null};
  symptoms=new Set();neuroSaddleAutoSynced=false;validationShake=false;
  sections={flags:true,classification:false,location:false,neuro_detail:false,symptoms_detail:false,workup:true,conduta:true,diferencial:false,note:true};
  render();window.scrollTo({top:0,behavior:'smooth'});
}

// Keyboard navigation
document.addEventListener('keydown',(e)=>{
  // Don't intercept if user is in an input field
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;

  if(e.key==='ArrowRight' && e.altKey){
    e.preventDefault();
    next();
  }else if(e.key==='ArrowLeft' && e.altKey){
    e.preventDefault();
    prev();
  }
});

render();
</script>
