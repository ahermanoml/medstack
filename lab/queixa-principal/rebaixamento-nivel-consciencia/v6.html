<!-- VERSION: 6 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebaixamento do Nível de Consciência — Avaliação Estruturada</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0f1e;color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
  header{background:linear-gradient(135deg,#0f1522 0%,#16203a 50%,#0f1522 100%);width:100%;padding:1rem 1.25rem;text-align:center;border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(245,158,11,.08)}
  header h1{font-size:1.2rem;font-weight:700;color:#f8fafc;letter-spacing:-.01em}
  header p{font-size:.72rem;color:#64748b;margin-top:.18rem;letter-spacing:.04em;text-transform:uppercase}
  .back-link{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#64748b;text-decoration:none;font-size:.78rem;font-weight:500;transition:all .2s;display:flex;align-items:center;gap:.3rem;padding:.35rem .55rem;border-radius:.5rem}
  .back-link:hover{color:#f1f5f9;background:rgba(255,255,255,.05)}
  .back-link:active{transform:translateY(-50%) scale(.96)}
  .timer{position:absolute;right:1rem;top:50%;transform:translateY(-50%);font-size:.68rem;color:#475569;font-family:'SF Mono','Fira Code',monospace;font-variant-numeric:tabular-nums;transition:color .3s;letter-spacing:.05em}
  .timer.stopped{color:#f59e0b}
  .container{max-width:680px;width:100%;padding:1rem;display:flex;flex-direction:column;gap:.85rem}

  /* Progress */
  .progress-wrapper{padding:0 .15rem}
  .progress-bar{display:flex;align-items:center;gap:3px}
  .progress-step{flex:1;height:4px;border-radius:2px;background:#1a2435;transition:all .4s ease;position:relative}
  .progress-step.done{background:linear-gradient(90deg,#2563eb,#3b82f6);cursor:pointer}
  .progress-step.active{background:#60a5fa;box-shadow:0 0 8px rgba(96,165,250,.4);animation:pulse-bar 2s ease-in-out infinite}
  .progress-step.done:hover{filter:brightness(1.4)}
  @keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.55}}
  .progress-info{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem;padding:0 .05rem}
  .progress-label{font-size:.68rem;color:#94a3b8;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
  .progress-counter{font-size:.62rem;color:#64748b;font-family:'SF Mono','Fira Code',monospace;letter-spacing:.05em}
  .flow-connector{display:flex;justify-content:center;padding:.1rem 0}
  .flow-connector .arrow{width:1px;height:14px;background:linear-gradient(to bottom,#334155,transparent)}

  /* Cards */
  .card{background:linear-gradient(165deg,#121a2c 0%,#172136 40%,#1b273d 100%);border:1px solid #253044;border-radius:.9rem;padding:1.5rem 1.25rem;animation:cardIn .4s cubic-bezier(.16,1,.3,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-size:1.05rem;color:#f8fafc;margin-bottom:.2rem;font-weight:700;letter-spacing:-.01em}
  .card .subtitle{font-size:.72rem;color:#64748b;margin-bottom:1rem;text-transform:uppercase;letter-spacing:.05em}
  .options{display:flex;flex-direction:column;gap:.55rem}
  .option-group-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:#4b5e7a;margin-top:.7rem;margin-bottom:-.05rem;font-weight:700}
  .option-group-label:first-child{margin-top:0}

  /* Option buttons */
  .option-btn{background:#0c1322;border:1.5px solid #253044;border-radius:.7rem;padding:.75rem .95rem;color:#94a3b8;font-size:.88rem;cursor:pointer;transition:all .18s ease;text-align:left;display:flex;align-items:center;gap:.65rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none;position:relative}
  .option-btn:hover{border-color:#3b82f6;background:#131d33;color:#e2e8f0}
  .option-btn:focus-visible{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.3)}
  .option-btn:active{transform:scale(.985)}
  .option-btn.selected{border-color:#3b82f6;background:linear-gradient(135deg,#172554,#1e3a5f);color:#f1f5f9;box-shadow:0 0 0 1px rgba(59,130,246,.15),inset 0 1px 0 rgba(255,255,255,.03)}
  .option-btn .icon{font-size:1.1rem;flex-shrink:0;width:1.6rem;text-align:center}
  .option-btn .label{flex:1;line-height:1.4}
  .option-btn .tag{font-size:.58rem;text-transform:uppercase;letter-spacing:.05em;padding:.18rem .45rem;border-radius:9999px;font-weight:700;flex-shrink:0;white-space:nowrap}
  .tag-critical{background:rgba(127,29,29,.6);color:#fca5a5}
  .tag-warning{background:rgba(120,53,15,.6);color:#fcd34d}
  .tag-info{background:rgba(22,78,99,.6);color:#67e8f9}
  .tag-normal{background:rgba(20,83,45,.6);color:#86efac}

  /* Check buttons */
  .check-btn{background:#0c1322;border:1.5px solid #253044;border-radius:.7rem;padding:.65rem .9rem;color:#94a3b8;font-size:.84rem;cursor:pointer;transition:all .18s ease;text-align:left;display:flex;align-items:center;gap:.65rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none}
  .check-btn:hover{border-color:#3b82f6;background:#131d33;color:#e2e8f0}
  .check-btn:focus-visible{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.3)}
  .check-btn:active{transform:scale(.985)}
  .check-btn.checked{border-color:#3b82f6;background:linear-gradient(135deg,#172554,#1e3a5f);color:#f1f5f9}
  .check-box{width:16px;height:16px;border:2px solid #374d6b;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s;font-size:.65rem;color:transparent}
  .check-btn.checked .check-box{background:#3b82f6;border-color:#3b82f6;color:#fff}

  /* Nav */
  .nav-row{display:flex;gap:.55rem;margin-top:1rem}
  .nav-btn{flex:1;padding:.75rem;border-radius:.7rem;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none}
  .nav-btn:focus-visible{box-shadow:0 0 0 2px rgba(96,165,250,.4)}
  .nav-btn.secondary{background:#1a2435;color:#94a3b8;border:1px solid #334155}
  .nav-btn.secondary:hover{background:#22304a;color:#cbd5e1}
  .nav-btn.primary{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.25)}
  .nav-btn.primary:hover{background:linear-gradient(135deg,#1d4ed8,#2563eb);box-shadow:0 4px 14px rgba(37,99,235,.35)}
  .nav-btn:active:not(:disabled){transform:scale(.97)}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;pointer-events:none}

  /* Score options (for GCS tiles + exam tiles) */
  .score-opt{flex:1;padding:.5rem .25rem;border-radius:.5rem;font-size:.7rem;cursor:pointer;border:1.5px solid #253044;background:#0c1322;color:#7c8ba5;text-align:center;transition:all .18s;line-height:1.3;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-width:0;word-break:break-word;outline:none;position:relative}
  .score-opt:hover{border-color:#3b82f6;color:#cbd5e1;background:#131d33}
  .score-opt:focus-visible{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.3)}
  .score-opt:active{transform:scale(.96)}
  .score-opt.picked{border-color:#3b82f6;background:linear-gradient(135deg,#172554,#1e3a5f);color:#f1f5f9;font-weight:600}
  .score-opt .pts{display:block;font-size:.55rem;color:#475569;margin-top:.15rem;font-family:'SF Mono','Fira Code',monospace}
  .score-opt.picked .pts{color:#60a5fa}
  .score-row{display:flex;gap:.3rem;flex-wrap:wrap}

  /* GCS Dashboard (amber-glow treatment) */
  .gcs-display{display:grid;grid-template-columns:repeat(3,1fr) auto;align-items:center;gap:.5rem;padding:.85rem .75rem;margin:.85rem 0 .5rem;background:radial-gradient(ellipse at center,#0d1729 0%,#070b18 100%);border-radius:.75rem;border:1px solid #1e293b;position:relative;overflow:hidden}
  .gcs-display::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 85% 50%,var(--glow,rgba(245,158,11,0)) 0%,transparent 60%);pointer-events:none;transition:background .35s ease}
  .gcs-display.critical{--glow:rgba(239,68,68,.18)}
  .gcs-display.warning{--glow:rgba(245,158,11,.2)}
  .gcs-display.moderate{--glow:rgba(59,130,246,.15)}
  .gcs-display.good{--glow:rgba(34,197,94,.15)}
  .gcs-component{text-align:center;position:relative;z-index:1}
  .gcs-component-value{font-size:1.5rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace;color:#cbd5e1;letter-spacing:-.02em}
  .gcs-component-label{font-size:.55rem;color:#4b5e7a;text-transform:uppercase;letter-spacing:.08em;margin-top:.1rem;font-weight:700}
  .gcs-total{text-align:center;border-left:1px solid #1e293b;padding-left:.85rem;position:relative;z-index:1}
  .gcs-total-value{font-size:2.3rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace;line-height:1;letter-spacing:-.02em;text-shadow:0 0 18px currentColor}
  .gcs-total-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;margin-top:.25rem;font-weight:700}
  .gcs-total.critical .gcs-total-value,.gcs-total.critical .gcs-total-label{color:#fca5a5}
  .gcs-total.warning .gcs-total-value,.gcs-total.warning .gcs-total-label{color:#fbbf24}
  .gcs-total.moderate .gcs-total-value,.gcs-total.moderate .gcs-total-label{color:#60a5fa}
  .gcs-total.good .gcs-total-value,.gcs-total.good .gcs-total-label{color:#86efac}

  /* Alerts */
  .alert-box{border-radius:.7rem;padding:.8rem 1rem;margin:.55rem 0;display:flex;align-items:flex-start;gap:.6rem;font-size:.8rem;animation:alertIn .3s ease;line-height:1.5}
  @keyframes alertIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .alert-box .alert-icon{font-size:1.1rem;flex-shrink:0;line-height:1.3}
  .alert-box .alert-text{flex:1}
  .alert-box .alert-text strong{display:block;margin-bottom:.1rem;font-weight:700}
  .alert-critical{background:rgba(69,10,10,.6);border:1.5px solid #991b1b;color:#fca5a5}
  .alert-warning{background:rgba(69,26,3,.65);border:1.5px solid #b45309;color:#fcd34d}
  .alert-info{background:rgba(12,74,110,.5);border:1.5px solid #0369a1;color:#7dd3fc}

  /* Result */
  .result-card{text-align:center;padding:1.65rem 1.25rem 1.5rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:4.25rem;height:4.25rem;border-radius:50%;font-size:1.2rem;font-weight:800;margin-bottom:.6rem;animation:badgePop .5s cubic-bezier(.16,1,.3,1);letter-spacing:.02em}
  @keyframes badgePop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .result-badge.badge-critical{background:linear-gradient(135deg,#7f1d1d,#991b1b);color:#fca5a5;border:2.5px solid #ef4444;box-shadow:0 0 24px rgba(239,68,68,.3)}
  .result-badge.badge-high{background:linear-gradient(135deg,#78350f,#92400e);color:#fcd34d;border:2.5px solid #f59e0b;box-shadow:0 0 24px rgba(245,158,11,.25)}
  .result-badge.badge-moderate{background:linear-gradient(135deg,#1e40af,#1d4ed8);color:#93c5fd;border:2.5px solid #3b82f6;box-shadow:0 0 20px rgba(59,130,246,.2)}
  .result-badge.badge-low{background:linear-gradient(135deg,#14532d,#166534);color:#86efac;border:2.5px solid #22c55e;box-shadow:0 0 20px rgba(34,197,94,.2)}
  .result-title{font-size:1.15rem;font-weight:700;margin-bottom:.15rem}
  .result-desc{color:#94a3b8;font-size:.8rem;margin-bottom:1rem;line-height:1.5}

  /* Dark boxes */
  .dark-box{background:linear-gradient(165deg,#0c1322,#111827);border:1px solid #1e293b;border-radius:.7rem;padding:1rem;text-align:left;margin-bottom:.55rem}
  .dark-box h3{font-size:.68rem;color:#4b5e7a;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.55rem;font-weight:700}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:.32rem 0;border-bottom:1px solid rgba(30,41,59,.5);font-size:.8rem;gap:.5rem}
  .summary-row:last-child{border-bottom:none}
  .summary-row .criteria{color:#64748b;flex-shrink:0}
  .summary-row .value{font-weight:600;display:flex;align-items:center;gap:.3rem;text-align:right}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-critical{background:#ef4444}.dot-warning{background:#f59e0b}.dot-normal{background:#22c55e}.dot-info{background:#3b82f6}

  /* Collapse */
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .collapse-header h3{margin-bottom:0}
  .collapse-arrow{font-size:.65rem;color:#4b5e7a;transition:transform .25s ease;padding:.25rem}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .3s ease,opacity .2s ease}
  .collapse-body.hidden{max-height:0!important;padding-top:0;margin-top:0;opacity:0}
  .collapse-body.visible{max-height:6000px;opacity:1}

  /* Conduta */
  .conduta-box{border-radius:.7rem;padding:1rem;text-align:left;margin-bottom:.55rem}
  .conduta-box h3{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.55rem;font-weight:700}
  .conduta-box.alta-prob{background:linear-gradient(165deg,rgba(69,10,10,.7),rgba(69,10,10,.4));border:1.5px solid #991b1b}.conduta-box.alta-prob h3{color:#fca5a5}
  .conduta-box.mod-prob{background:linear-gradient(165deg,rgba(69,26,3,.7),rgba(69,26,3,.4));border:1.5px solid #b45309}.conduta-box.mod-prob h3{color:#fcd34d}
  .conduta-box.baixa-prob{background:linear-gradient(165deg,rgba(5,46,22,.7),rgba(5,46,22,.4));border:1.5px solid #14532d}.conduta-box.baixa-prob h3{color:#86efac}
  .conduta-box.neutra-prob{background:linear-gradient(165deg,#141c2e,#1a2435);border:1.5px solid #334155}.conduta-box.neutra-prob h3{color:#94a3b8}
  .conduta-item{display:flex;align-items:flex-start;gap:.5rem;padding:.32rem 0;font-size:.8rem;color:#cbd5e1;line-height:1.5}
  .conduta-icon{flex-shrink:0;width:1rem;text-align:center;margin-top:.05rem}

  /* Note */
  .note-box{background:#0c1322;border-radius:.7rem;padding:1rem;text-align:left;margin-bottom:.55rem}
  .note-text{background:#060a14;border:1px solid #1e293b;border-radius:.5rem;padding:.85rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.66rem;color:#94a3b8;white-space:pre-wrap;line-height:1.6;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .note-text::-webkit-scrollbar{width:4px}.note-text::-webkit-scrollbar-track{background:transparent}.note-text::-webkit-scrollbar-thumb{background:#253044;border-radius:2px}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.6rem;padding:.65rem;border-radius:.5rem;border:1.5px solid #253044;background:#141c2e;color:#94a3b8;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;touch-action:manipulation}
  .copy-btn:hover{border-color:#3b82f6;background:#172040;color:#f1f5f9}
  .copy-btn:active{transform:scale(.97)}
  .copy-btn.copied{border-color:#22c55e;background:rgba(5,46,22,.7);color:#86efac}

  .section-divider{height:1px;background:linear-gradient(90deg,transparent,#334155,transparent);margin:.75rem 0}

  /* Glucose highlight — the signature amber call */
  .glucose-highlight{background:linear-gradient(135deg,rgba(69,26,3,.7),rgba(120,53,15,.45));border:1.5px solid #b45309;border-radius:.7rem;padding:.85rem 1rem;margin:.5rem 0 1rem;text-align:center;box-shadow:0 0 20px rgba(245,158,11,.1)}
  .glucose-highlight .glucose-icon{font-size:1.5rem;margin-bottom:.3rem;filter:drop-shadow(0 0 8px rgba(251,191,36,.5))}
  .glucose-highlight .glucose-title{font-size:.9rem;font-weight:700;color:#fcd34d;margin-bottom:.15rem;letter-spacing:.01em}
  .glucose-highlight .glucose-desc{font-size:.74rem;color:#fed7aa;line-height:1.5}

  /* Toxidromes */
  .toxidrome-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
  .toxidrome-card{background:#0c1322;border:1.5px solid #253044;border-radius:.65rem;padding:.6rem .55rem;cursor:pointer;transition:all .18s;text-align:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .toxidrome-card:hover{border-color:#3b82f6;background:#131d33}
  .toxidrome-card:active{transform:scale(.97)}
  .toxidrome-card.selected{border-color:#3b82f6;background:linear-gradient(135deg,#172554,#1e3a5f)}
  .toxidrome-card .tox-icon{font-size:1.2rem;margin-bottom:.15rem}
  .toxidrome-card .tox-name{font-size:.76rem;font-weight:700;color:#e2e8f0;margin-bottom:.1rem}
  .toxidrome-card .tox-signs{font-size:.6rem;color:#64748b;line-height:1.3}

  /* Workup */
  .workup-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
  .workup-item{background:#0c1322;border:1.5px solid #1e293b;border-radius:.5rem;padding:.48rem .55rem;font-size:.72rem;color:#94a3b8;display:flex;align-items:center;gap:.35rem;line-height:1.35}
  .workup-item .w-icon{flex-shrink:0}
  .workup-item.highlighted{border-color:#f59e0b;background:rgba(69,26,3,.35);color:#fcd34d}
  .workup-item.conditional{border-color:#3b82f6;border-style:dashed;color:#7dd3fc}

  /* Herniation banner */
  .herniation-banner{background:linear-gradient(135deg,#7f1d1d,#991b1b);border:2px solid #ef4444;border-radius:.7rem;padding:.9rem;margin:.55rem 0;text-align:center;animation:herniationPulse 1.5s ease-in-out infinite}
  @keyframes herniationPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
  .herniation-banner h4{color:#fca5a5;font-size:.88rem;font-weight:700;margin-bottom:.25rem;letter-spacing:.02em}
  .herniation-banner p{color:#fecaca;font-size:.76rem;line-height:1.5}

  /* GCS-P note */
  .gcs-p-display{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.5rem;margin:.35rem 0;background:rgba(12,74,110,.25);border-radius:.45rem;border:1px solid #0c4a6e;font-size:.75rem;color:#7dd3fc;font-family:'SF Mono','Fira Code',monospace}
  .gcs-p-display strong{color:#bfdbfe}

  /* NT pill */
  .nt-pill{font-size:.5rem;background:rgba(100,116,139,.4);color:#cbd5e1;padding:.1rem .3rem;border-radius:3px;margin-left:.2rem;vertical-align:middle;font-weight:700;letter-spacing:.05em}

  /* Toast */
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:.7rem;padding:.6rem 1.15rem;font-size:.8rem;font-weight:600;z-index:200;transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s;opacity:0;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media(max-width:500px){
    .container{padding:.65rem}
    .card{padding:1rem .85rem}
    .option-btn{padding:.65rem .8rem;font-size:.8rem}
    .check-btn{padding:.58rem .75rem;font-size:.78rem}
    header h1{font-size:1.05rem}
    header p{font-size:.62rem}
    .score-opt{font-size:.62rem;padding:.42rem .15rem}
    .toxidrome-grid{grid-template-columns:1fr}
    .workup-grid{grid-template-columns:1fr}
    .gcs-display{gap:.35rem;padding:.7rem .55rem}
    .gcs-component-value{font-size:1.25rem}
    .gcs-total-value{font-size:1.95rem}
    .gcs-total{padding-left:.6rem}
    .result-badge{width:3.85rem;height:3.85rem;font-size:1.05rem}
    .back-link{left:.6rem;font-size:.7rem;padding:.3rem .4rem}
    .timer{right:.6rem;font-size:.6rem}
    .nav-btn{padding:.68rem;font-size:.8rem}
    .summary-row{flex-wrap:wrap;font-size:.76rem}
    .summary-row .value{max-width:100%}
  }

  @media(max-width:360px){
    .score-row .score-opt{min-width:calc(50% - .2rem);font-size:.58rem}
    .gcs-display{grid-template-columns:repeat(3,1fr);grid-auto-rows:auto}
    .gcs-total{grid-column:1/-1;border-left:none;border-top:1px solid #1e293b;padding-left:0;padding-top:.5rem;margin-top:.3rem}
    header h1{font-size:.98rem}
    .card{padding:.85rem .7rem}
    .conduta-item{font-size:.76rem}
    .alert-box{font-size:.76rem;padding:.72rem .8rem}
  }
</style>
</head>
<body>
<header>
  <a href="../rebaixamento-nivel-consciencia.html" class="back-link">&#8592; Voltar</a>
  <h1>Rebaixamento de Consciência</h1>
  <p>AVPU &middot; Glasgow &middot; AEIOU-TIPS</p>
  <span class="timer" id="evalTimer">00:00</span>
</header>
<div class="container" id="app"></div>
<div class="toast" id="toast"></div>
<script>
// =============================================
// CONSTANTS
// =============================================
const STEP_LABELS=['Glicemia','AVPU/GCS','Via Aérea','Cronologia','Causas','Exame','Sinais Vitais','Toxídrome','Resultado'];
const TOTAL_STEPS=STEP_LABELS.length;

const GCS_EYE=[
  {v:1,l:'Nenhuma',d:'Sem abertura ocular'},
  {v:2,l:'À dor',d:'Abertura a estímulo doloroso'},
  {v:3,l:'À voz',d:'Abertura ao comando verbal'},
  {v:4,l:'Espontânea',d:'Abertura espontânea'}
];
const GCS_VERBAL=[
  {v:1,l:'Nenhuma',d:'Sem resposta verbal'},
  {v:2,l:'Sons',d:'Sons incompreensíveis'},
  {v:3,l:'Palavras',d:'Palavras inapropriadas'},
  {v:4,l:'Confuso',d:'Conversa confusa'},
  {v:5,l:'Orientado',d:'Orientado e conversa'}
];
const GCS_MOTOR=[
  {v:1,l:'Nenhuma',d:'Sem resposta motora'},
  {v:2,l:'Extensão',d:'Descerebração'},
  {v:3,l:'Flexão',d:'Decorticação'},
  {v:4,l:'Retirada',d:'Retirada à dor'},
  {v:5,l:'Localiza',d:'Localiza estímulo'},
  {v:6,l:'Obedece',d:'Obedece comandos'}
];

const AEIOU_TIPS=[
  {id:'alcohol',letter:'A',name:'Álcool / Drogas',icon:'🍺'},
  {id:'epilepsy',letter:'E',name:'Epilepsia (pós-ictal/status)',icon:'⚡'},
  {id:'insulin',letter:'I',name:'Insulina (hipo/hiper glicemia)',icon:'💉'},
  {id:'opiates',letter:'O',name:'Opióides / Sedativos',icon:'💊'},
  {id:'uremia',letter:'U',name:'Uremia / Enc. hepática',icon:'🫀'},
  {id:'trauma',letter:'T',name:'Trauma (TCE)',icon:'🤕'},
  {id:'infection',letter:'I',name:'Infecção do SNC',icon:'🦠'},
  {id:'psychiatric',letter:'P',name:'Psiquiátrico (exclusão)',icon:'🧠'},
  {id:'stroke',letter:'S',name:'Stroke / HSA',icon:'🎯'}
];

const TOXIDROMES=[
  {id:'cholinergic',name:'Colinérgico',icon:'💧',signs:'Miose, sialorreia, broncorreia, bradicardia, diarreia',cause:'Organofosforados, carbamatos',antidote:'Atropina 1-2mg IV (repetir até secar secreções) + Pralidoxima se OF'},
  {id:'anticholinergic',name:'Anticolinérgico',icon:'🌡️',signs:'Midríase, pele seca/quente, taquicardia, agitação, íleo',cause:'Atropina, anti-histamínicos, tricíclicos',antidote:'Fisostigmina 0,5-2mg IV lento (se grave; CI: arritmia/BAV)'},
  {id:'sympathomimetic',name:'Simpatomimético',icon:'⬆️',signs:'Midríase, taquicardia, HAS, hipertermia, diaforese',cause:'Cocaína, anfetaminas, ecstasy',antidote:'Benzodiazepínicos (Diazepam 5-10mg IV) + resfriamento'},
  {id:'opioid',name:'Opióide',icon:'😴',signs:'Miose puntiforme, bradipneia, hipotensão',cause:'Morfina, heroína, fentanil, tramadol',antidote:'Naloxona 0,04-0,4mg IV, titular até FR ≥ 12. Repetir a cada 2-3min'},
  {id:'sedative',name:'Sedativo-hipnótico',icon:'💤',signs:'Pupilas normais/miose, bradipneia, hipotonia',cause:'Benzodiazepínicos, barbitúricos, etanol',antidote:'Flumazenil 0,2mg IV (só se BZD isolado; CI: epilepsia, TCA)'},
  {id:'serotonergic',name:'Serotoninérgico',icon:'🔥',signs:'Clônus, hiperreflexia, hipertermia, agitação',cause:'ISRS + IMAO, tramadol, linezolida',antidote:'Ciproeptadina 4-8mg VO + BZD + resfriamento'}
];

// =============================================
// STATE
// =============================================
let step=0;
let evalStartTime=new Date();
let evalEndTime=null;
let timerInterval=null;

let glucose={value:null};
let avpu=null;
let gcs={eye:null,verbal:null,motor:null};
let verbalNT=false;
let airway={needs_intubation:null,secured:null};
let onset={timeline:null,mode:null};
let causes=new Set();
let exam={pupil_size:null,pupil_reactivity:null,motor_pattern:null,meningeal:null,focal_deficit:null};
let vitals={bp:null,hr:null,rr:null,temp:null,spo2:null};
let selectedToxidrome=null;

let sections={gcs:true,causes:true,exam:false,vitals:false,toxidrome:true,stratification:true,workup:true,conduta:true,note:true};

const app=document.getElementById('app');

// =============================================
// TOAST
// =============================================
function showToast(msg,duration){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(el._tid);
  el._tid=setTimeout(()=>el.classList.remove('show'),duration||1800);
}

// =============================================
// TIMER
// =============================================
function updateTimer(){
  const el=document.getElementById('evalTimer');
  if(!el) return;
  const now=evalEndTime||new Date();
  const diff=Math.floor((now-evalStartTime)/1000);
  const m=Math.floor(diff/60),s=diff%60;
  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(evalEndTime) el.classList.add('stopped');
  else el.classList.remove('stopped');
}
timerInterval=setInterval(updateTimer,1000);
function stopTimer(){if(!evalEndTime){evalEndTime=new Date();clearInterval(timerInterval);updateTimer();}}

// =============================================
// HELPERS
// =============================================
function gcsTotal(){
  if(gcs.eye===null||gcs.verbal===null||gcs.motor===null) return null;
  return gcs.eye+gcs.verbal+gcs.motor;
}
function gcsClass(t){
  if(t===null) return '';
  if(t<=8) return 'critical';
  if(t<=12) return 'warning';
  if(t<=14) return 'moderate';
  return 'good';
}
function gcsLabel(t){
  if(t===null) return '';
  if(t<=8) return 'Grave';
  if(t<=12) return 'Moderado';
  if(t<=14) return 'Leve';
  return 'Normal';
}

function pupilReactivityScore(){
  if(exam.pupil_reactivity==='fixed'){
    if(exam.pupil_size==='anisocoric') return 1;
    return 2;
  }
  if(exam.pupil_reactivity==='sluggish') return 1;
  return 0;
}
function gcsPTotal(){
  const t=gcsTotal();
  if(t===null) return null;
  return t-pupilReactivityScore();
}

function isStructural(){return causes.has('trauma')||causes.has('stroke')}
function isMetabolicToxic(){return causes.has('alcohol')||causes.has('insulin')||causes.has('opiates')||causes.has('uremia')}
function isInfectious(){return causes.has('infection')}
function isSeizure(){return causes.has('epilepsy')}

function hasCushingTriad(){
  return vitals.bp==='severe_htn'&&vitals.hr==='brady'&&(vitals.rr==='irregular'||vitals.rr==='brady');
}

function herniationSigns(){
  const s=[];
  if(exam.pupil_size==='anisocoric'&&(exam.pupil_reactivity==='fixed'||exam.pupil_reactivity==='sluggish')) s.push('Anisocoria pouco/não reativa');
  if(exam.motor_pattern==='decerebrate') s.push('Descerebração');
  if(exam.motor_pattern==='asymmetric') s.push('Assimetria motora');
  if(hasCushingTriad()) s.push('Tríade de Cushing');
  if(exam.pupil_size==='mydriatic'&&exam.pupil_reactivity==='fixed') s.push('Midríase bilateral fixa');
  const t=gcsTotal();
  if(t!==null&&t<=5) s.push('GCS ≤ 5');
  return s;
}

function riskLevel(){
  const t=gcsTotal();
  if(t!==null&&t<=8) return 'critical';
  if(airway.needs_intubation) return 'critical';
  if(hasCushingTriad()) return 'critical';
  if(glucose.value==='low') return 'critical';
  if(exam.pupil_reactivity==='fixed'&&exam.pupil_size==='mydriatic') return 'critical';
  if(exam.motor_pattern==='decerebrate'||exam.motor_pattern==='flaccid') return 'critical';
  if(herniationSigns().length>=2) return 'critical';
  if(vitals.spo2==='low'&&vitals.rr==='brady') return 'critical';
  if(t!==null&&t<=12) return 'high';
  if(isStructural()) return 'high';
  if(exam.motor_pattern==='decorticate') return 'high';
  if(exam.focal_deficit&&exam.focal_deficit!=='none') return 'high';
  if(onset.mode==='sudden') return 'high';
  if(exam.pupil_size==='anisocoric') return 'high';
  if(exam.meningeal&&exam.meningeal!=='none'&&(vitals.temp==='fever'||vitals.temp==='hyperthermia')) return 'high';
  if(glucose.value==='critical_high') return 'high';
  if(t!==null&&t<=14) return 'moderate';
  if(isMetabolicToxic()||isInfectious()||isSeizure()) return 'moderate';
  if(selectedToxidrome) return 'moderate';
  return 'low';
}

function riskInfo(){
  const r=riskLevel();
  if(r==='critical') return {badge:'badge-critical',label:'CRIT',title:'Risco Crítico',desc:'Intervenção imediata. Proteger via aérea, estabilizar, investigar causa urgentemente.',color:'#fca5a5'};
  if(r==='high') return {badge:'badge-high',label:'ALTO',title:'Alto Risco',desc:'Investigação urgente. Provável causa estrutural ou ameaçadora de vida.',color:'#fcd34d'};
  if(r==='moderate') return {badge:'badge-moderate',label:'MOD',title:'Risco Moderado',desc:'Avaliar causas reversíveis. Monitorização contínua.',color:'#93c5fd'};
  return {badge:'badge-low',label:'BAIXO',title:'Risco Baixo',desc:'Alteração leve. Investigar causas metabólicas/tóxicas.',color:'#86efac'};
}

// =============================================
// PROGRESS BAR
// =============================================
function progHTML(idx,allDone){
  const currentLabel=allDone?'Concluído':STEP_LABELS[idx];
  const counterText=allDone?`${TOTAL_STEPS}/${TOTAL_STEPS}`:`${idx+1}/${TOTAL_STEPS}`;
  let h='<div class="progress-wrapper">';
  h+='<div class="progress-bar">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const isDone=allDone||i<idx;
    const isActive=!allDone&&i===idx;
    const c=isDone?'done':isActive?'active':'';
    h+=`<div class="progress-step ${c}" ${isDone?`onclick="jumpToStep(${i})"`:''} role="progressbar" aria-label="${STEP_LABELS[i]||''}"></div>`;
  }
  h+='</div>';
  h+=`<div class="progress-info"><span class="progress-label">${currentLabel}</span><span class="progress-counter">${counterText}</span></div>`;
  h+='</div>';
  h+='<div class="flow-connector"><div class="arrow"></div></div>';
  return h;
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  switch(step){
    case 0: renderGlucose(); break;
    case 1: renderGCS(); break;
    case 2: renderAirway(); break;
    case 3: renderOnset(); break;
    case 4: renderCauses(); break;
    case 5: renderExam(); break;
    case 6: renderVitals(); break;
    case 7: renderToxidromes(); break;
    default: stopTimer(); renderResult(); break;
  }
  updateTimer();
}

// =============================================
// STEP 0: GLUCOSE
// =============================================
function renderGlucose(){
  let h=progHTML(0,false);
  h+='<div class="card">';
  h+='<h2>Glicemia Capilar</h2>';
  h+='<p class="subtitle">Primeiro passo — sempre</p>';

  h+='<div class="glucose-highlight">';
  h+='<div class="glucose-icon">🩸</div>';
  h+='<div class="glucose-title">Verificar glicemia AGORA</div>';
  h+='<div class="glucose-desc">Causa reversível mais comum e mais fácil de tratar. Não pular.</div>';
  h+='</div>';

  h+='<div class="options">';
  h+='<div class="option-group-label">Resultado</div>';
  const opts=[
    {v:'low',icon:'⚠️',label:'Hipoglicemia (&lt; 70 mg/dL)',tag:'tag-critical',tagText:'Urgente'},
    {v:'normal',icon:'✅',label:'Normal (70–180 mg/dL)',tag:'tag-normal',tagText:'Normal'},
    {v:'high',icon:'📈',label:'Hiperglicemia (180–400)',tag:'tag-warning',tagText:'Elevada'},
    {v:'critical_high',icon:'📈',label:'Hiperglicemia grave (&gt; 400)',tag:'tag-critical',tagText:'Crítica'}
  ];
  for(const o of opts){
    h+=`<button class="option-btn ${glucose.value===o.v?'selected':''}" onclick="setGlucose('${o.v}')">`;
    h+=`<span class="icon">${o.icon}</span><span class="label">${o.label}</span>`;
    h+=`<span class="tag ${o.tag}">${o.tagText}</span></button>`;
  }
  h+='</div>';

  if(glucose.value==='low'){
    h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>Hipoglicemia — tratar já</strong>Glicose 50% 50 mL IV (ou Glucagon 1 mg IM). Reavaliar em 15 min. Se sulfonilureia: SG 10% em BI e monitorizar 24h.</div></div>';
    h+='<div class="alert-box alert-warning"><span class="alert-icon">💊</span><div class="alert-text"><strong>Suspeita de etilismo/desnutrição</strong>Tiamina 200–500 mg IV antes ou junto da glicose (prevenir Wernicke).</div></div>';
  }
  if(glucose.value==='critical_high'){
    h+='<div class="alert-box alert-warning"><span class="alert-icon">⚠️</span><div class="alert-text"><strong>Investigar CAD/EHH</strong>Gaso + cetonas + Na/K + osmolaridade. SF 0,9% 15–20 mL/kg na 1ª hora.</div></div>';
  }

  h+='<div class="nav-row">';
  h+=`<button class="nav-btn primary" ${glucose.value===null?'disabled':''} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP 1: AVPU + GCS
// =============================================
function renderGCS(){
  let h=progHTML(1,false);
  h+='<div class="card">';
  h+='<h2>Consciência — AVPU & Glasgow</h2>';
  h+='<p class="subtitle">Nível basal</p>';

  h+='<div class="options">';
  h+='<div class="option-group-label">AVPU — avaliação rápida</div>';
  const avpuOpts=[
    {v:'A',icon:'🗣️',label:'Alert — alerta e orientado',tag:'tag-normal',tagText:'Alerta'},
    {v:'V',icon:'👂',label:'Voice — responde ao verbal',tag:'tag-info',tagText:'Verbal'},
    {v:'P',icon:'🥊',label:'Pain — responde à dor',tag:'tag-warning',tagText:'Dor'},
    {v:'U',icon:'❌',label:'Unresponsive — sem resposta',tag:'tag-critical',tagText:'Arresp.'}
  ];
  for(const o of avpuOpts){
    h+=`<button class="option-btn ${avpu===o.v?'selected':''}" onclick="setAVPU('${o.v}')">`;
    h+=`<span class="icon">${o.icon}</span><span class="label">${o.label}</span>`;
    h+=`<span class="tag ${o.tag}">${o.tagText}</span></button>`;
  }
  h+='</div>';

  h+='<div class="section-divider"></div>';
  h+='<div class="option-group-label" style="margin-bottom:.55rem">Glasgow — O &middot; V &middot; M</div>';

  // Eye
  h+='<div style="margin-bottom:.75rem">';
  h+='<div style="font-size:.78rem;color:#cbd5e1;margin-bottom:.35rem;font-weight:600">Abertura Ocular</div>';
  h+='<div class="score-row">';
  for(const o of GCS_EYE) h+=`<button class="score-opt ${gcs.eye===o.v?'picked':''}" onclick="setGCS('eye',${o.v})" title="${o.d}">${o.l}<span class="pts">${o.v}</span></button>`;
  h+='</div></div>';

  // Verbal
  h+='<div style="margin-bottom:.75rem">';
  h+='<div style="font-size:.78rem;color:#cbd5e1;margin-bottom:.35rem;font-weight:600">Resposta Verbal</div>';
  h+='<div class="score-row">';
  for(const o of GCS_VERBAL) h+=`<button class="score-opt ${gcs.verbal===o.v&&!verbalNT?'picked':''}" onclick="setGCSVerbal(${o.v})" title="${o.d}">${o.l}<span class="pts">${o.v}</span></button>`;
  h+=`<button class="score-opt ${verbalNT?'picked':''}" onclick="setVerbalNT()" title="Não testável (intubado)">NT<span class="pts">1t</span></button>`;
  h+='</div>';
  h+='<div style="font-size:.6rem;color:#4b5e7a;margin-top:.25rem">NT = paciente intubado/traqueostomizado (V1t)</div>';
  h+='</div>';

  // Motor
  h+='<div style="margin-bottom:.85rem">';
  h+='<div style="font-size:.78rem;color:#cbd5e1;margin-bottom:.35rem;font-weight:600">Resposta Motora <span style="font-weight:400;color:#4b5e7a;font-size:.7rem">(melhor preditor)</span></div>';
  h+='<div class="score-row">';
  for(const o of GCS_MOTOR) h+=`<button class="score-opt ${gcs.motor===o.v?'picked':''}" onclick="setGCS('motor',${o.v})" title="${o.d}">${o.l}<span class="pts">${o.v}</span></button>`;
  h+='</div></div>';

  const t=gcsTotal();
  if(t!==null){
    const cls=gcsClass(t);
    h+=`<div class="gcs-display ${cls}">`;
    h+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.eye}</div><div class="gcs-component-label">O</div></div>`;
    h+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.verbal}${verbalNT?'<span class="nt-pill">NT</span>':''}</div><div class="gcs-component-label">V</div></div>`;
    h+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.motor}</div><div class="gcs-component-label">M</div></div>`;
    h+=`<div class="gcs-total ${cls}"><div class="gcs-total-value">${t}${verbalNT?'<span class="nt-pill">t</span>':''}</div><div class="gcs-total-label">${gcsLabel(t)}</div></div>`;
    h+='</div>';

    if(verbalNT){
      h+='<div class="gcs-p-display">V<strong>NT</strong> &mdash; O+1t+M &mdash; motor (M'+gcs.motor+') é o melhor preditor</div>';
    }

    if(t<=8){
      h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>GCS ≤ 8 — proteger via aérea</strong>Indicação de IOT. Avaliar tosse/deglutição.</div></div>';
    } else if(t<=12){
      h+='<div class="alert-box alert-warning"><span class="alert-icon">⚠️</span><div class="alert-text"><strong>Rebaixamento moderado (GCS '+t+')</strong>Monitorização contínua. Reavaliar a cada 30–60 min.</div></div>';
    }
  }
  h+='</div>';

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  const canNext=avpu!==null&&gcs.eye!==null&&gcs.verbal!==null&&gcs.motor!==null;
  h+=`<button class="nav-btn primary" ${canNext?'':'disabled'} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP 2: AIRWAY
// =============================================
function renderAirway(){
  let h=progHTML(2,false);
  h+='<div class="card">';
  h+='<h2>Via Aérea</h2>';
  h+='<p class="subtitle">A do ABC</p>';

  const t=gcsTotal();
  if(t!==null&&t<=8){
    h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>GCS '+t+' — desprotegida</strong>Paciente sem capacidade de proteger a via aérea. IOT indicada.</div></div>';
  }

  h+='<div class="options">';
  h+='<div class="option-group-label">Necessita de intubação?</div>';
  h+=`<button class="option-btn ${airway.needs_intubation===true?'selected':''}" onclick="setAirway('needs',true)"><span class="icon">✅</span><span class="label">Sim — IOT indicada/realizada</span><span class="tag tag-critical">Crítico</span></button>`;
  h+=`<button class="option-btn ${airway.needs_intubation===false?'selected':''}" onclick="setAirway('needs',false)"><span class="icon">❌</span><span class="label">Não — reflexos protetores presentes</span><span class="tag tag-normal">Estável</span></button>`;

  if(airway.needs_intubation===true){
    h+='<div class="option-group-label" style="margin-top:.6rem">Via aérea assegurada?</div>';
    h+=`<button class="option-btn ${airway.secured===true?'selected':''}" onclick="setAirway('secured',true)"><span class="icon">✅</span><span class="label">Sim — intubado (via aérea definitiva)</span></button>`;
    h+=`<button class="option-btn ${airway.secured===false?'selected':''}" onclick="setAirway('secured',false)"><span class="icon">⏳</span><span class="label">Ainda não — aguardando procedimento</span></button>`;

    h+='<div class="alert-box alert-info"><span class="alert-icon">🧰</span><div class="alert-text"><strong>Checklist IOT no rebaixamento</strong>Pré-O₂ 3–5 min &middot; Fentanil 2μg/kg + Etomidato 0,3mg/kg + Succinilcolina 1–1,5mg/kg (ou Roc 1,2) &middot; Evitar hipotensão/hipoxemia &middot; Confirmar com capnografia &middot; Cuidado cervical se trauma.</div></div>';
  }

  if(airway.needs_intubation===false&&t!==null&&t<=10){
    h+='<div class="alert-box alert-info"><span class="alert-icon">💡</span><div class="alert-text"><strong>Reavaliar com frequência</strong>Paciente com GCS '+t+' pode deteriorar. Deixar material de IOT preparado.</div></div>';
  }

  h+='</div>';

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+=`<button class="nav-btn primary" ${airway.needs_intubation===null?'disabled':''} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP 3: ONSET
// =============================================
function renderOnset(){
  let h=progHTML(3,false);
  h+='<div class="card">';
  h+='<h2>Cronologia</h2>';
  h+='<p class="subtitle">Tempo e modo de instalação</p>';

  h+='<div class="options">';
  h+='<div class="option-group-label">Tempo de instalação</div>';
  const timeOpts=[
    {v:'acute',icon:'⚡',label:'Agudo (min a horas)',tag:'tag-critical',tagText:'Agudo',desc:'Vascular, metabólico agudo, intoxicação'},
    {v:'subacute',icon:'⏱️',label:'Subagudo (dias)',tag:'tag-warning',tagText:'Subag.',desc:'Infecção, metabólico progressivo, lesão expansiva'},
    {v:'chronic',icon:'📅',label:'Crônico (semanas+)',tag:'tag-info',tagText:'Crônico',desc:'Tumor, hidrocefalia, degenerativo'}
  ];
  for(const o of timeOpts){
    h+=`<button class="option-btn ${onset.timeline===o.v?'selected':''}" onclick="setOnset('timeline','${o.v}')">`;

  }

  h+='<div class="option-group-label" style="margin-top:.6rem">Modo de instalação</div>';
  const modeOpts=[
    {v:'sudden',icon:'💥',label:'Súbito (ictus)',desc:'AVC, HSA, dissecção'},
    {v:'progressive',icon:'📉',label:'Progressivo',desc:'Metabólico, tóxico, expansivo'},
    {v:'fluctuating',icon:'📊',label:'Flutuante',desc:'Encefalopatia, status não convulsivo, delirium'}
  ];
  for(const o of modeOpts){
    h+=`<button class="option-btn ${onset.mode===o.v?'selected':''}" onclick="setOnset('mode','${o.v}')">`;
    h+=`<span class="icon">${o.icon}</span><span class="label">${o.label}<br><span style="font-size:.68rem;color:#64748b">${o.desc}</span></span></button>`;
  }
  h+='</div>';

  if(onset.timeline==='acute'&&onset.mode==='sudden'){
    h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>Agudo + súbito = vascular</strong>TC de crânio urgente. AVC isquêmico ≤ 4,5h: trombólise; ≤ 24h: avaliar trombectomia. Não esquecer AVC posterior (basilar).</div></div>';
  }
  if(onset.mode==='fluctuating'){
    h+='<div class="alert-box alert-info"><span class="alert-icon">💡</span><div class="alert-text"><strong>Flutuante</strong>Encefalopatia metabólica, status não convulsivo (EEG), delirium, insuficiência adrenal.</div></div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  const canNext=onset.timeline!==null&&onset.mode!==null;
  h+=`<button class="nav-btn primary" ${canNext?'':'disabled'} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

  }
  if(exam.motor_pattern==='asymmetric'){
    h+='<div class="alert-box alert-warning" style="margin-top:.35rem"><span class="alert-icon">🎯</span><div class="alert-text"><strong>Assimetria motora</strong>Sugere lesão estrutural focal. TC urgente. Ativar protocolo AVC.</div></div>';

  for(const o of meningeal) h+=`<button class="score-opt ${exam.meningeal===o.v?'picked':''}" onclick="setExam('meningeal','${o.v}')">${o.l}</button>`;

    h+='<div class="alert-box alert-warning" style="margin-top:.35rem"><span class="alert-icon">🦠</span><div class="alert-text"><strong>Sinais meníngeos +</strong>Meningite/HSA. <strong>Não atrasar ATB</strong>: Ceftriaxona 2g 12/12h + Dexa 0,15mg/kg 6/6h. &gt;50a: + Ampicilina (Listeria). Se encefalite herpética: + Aciclovir.</div></div>';
  } else if(exam.meningeal==='none'){
    const t2=gcsTotal();
    if(t2!==null&&t2<=8){
      h+='<div class="alert-box alert-info" style="margin-top:.35rem"><span class="alert-icon">💡</span><div class="alert-text">Sinais meníngeos podem ser falsamente negativos em GCS ≤ 8.</div></div>';

    h+='<div class="alert-box alert-critical" style="margin-top:.35rem"><span class="alert-icon">🎯</span><div class="alert-text"><strong>Déficit focal presente</strong>Causa estrutural provável. TC urgente. Se AVC: verificar janela (4,5h trombólise / 24h trombectomia).</div></div>';
  }

  h+='</div>';

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Próximo</button>';

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id,title,contentFn,forceOpen){
  const open=forceOpen||sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.55rem':'0'}">`;
  if(open) h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// RESULT
// =============================================
function renderResult(){
  const t=gcsTotal();
  const ri=riskInfo();
  const hs=herniationSigns();
  const prs=pupilReactivityScore();
  const gcsP=gcsPTotal();

  if(riskLevel()==='critical'){sections.exam=true;sections.vitals=true;sections.conduta=true;}
  if(selectedToxidrome) sections.toxidrome=true;

  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';
  h+=`<div class="result-badge ${ri.badge}">${ri.label}</div>`;
  h+=`<div class="result-title" style="color:${ri.color}">${ri.title}</div>`;
  h+=`<div class="result-desc">${ri.desc}</div>`;

  const avpuLabel={A:'Alerta',V:'Resp. verbal',P:'Resp. à dor',U:'Arresponsivo'};
  const timelineLabel=onset.timeline==='acute'?'Agudo':onset.timeline==='subacute'?'Subagudo':onset.timeline==='chronic'?'Crônico':'—';
  const modeLabel=onset.mode==='sudden'?'Súbito':onset.mode==='fluctuating'?'Flutuante':onset.mode==='progressive'?'Progressivo':'—';

  h+=`<div style="font-size:.8rem;color:#94a3b8;margin-bottom:.9rem;line-height:1.6">`;
  h+=`AVPU: <strong style="color:${ri.color}">${avpuLabel[avpu]||'—'}</strong> &middot; GCS: <strong style="color:${ri.color}">${t!==null?t+'/15':'—'}</strong>`;
  if(t!==null) h+=` (O${gcs.eye}V${gcs.verbal}${verbalNT?'t':''}M${gcs.motor})`;
  if(gcsP!==null&&prs>0) h+=` &middot; GCS-P: <strong style="color:${ri.color}">${gcsP}</strong>`;
  h+=`<br>${timelineLabel} / ${modeLabel}`;
  h+=`</div>`;

  if(hs.length>=2){
    h+='<div class="herniation-banner"><h4>⚠️ SINAIS DE HERNIAÇÃO</h4>';
    h+='<p>'+hs.join(' &middot; ')+'<br>';
    h+='<strong>Anti-herniação:</strong> cabeceira 30°, Manitol 20% 1g/kg IV (ou NaCl 23,4% 30mL), hiperventilação leve transitória, neurocirurgia.</p></div>';
  }

  // GCS details
  h+=collapsible('gcs','Glasgow e Consciência',()=>{
    let s='';
    const cls=gcsClass(t);
    s+=`<div class="gcs-display ${cls}">`;
    s+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.eye}</div><div class="gcs-component-label">O</div></div>`;
    s+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.verbal}${verbalNT?'<span class="nt-pill">NT</span>':''}</div><div class="gcs-component-label">V</div></div>`;
    s+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.motor}</div><div class="gcs-component-label">M</div></div>`;
    s+=`<div class="gcs-total ${cls}"><div class="gcs-total-value">${t}${verbalNT?'<span class="nt-pill">t</span>':''}</div><div class="gcs-total-label">${gcsLabel(t)}</div></div>`;
    s+='</div>';
    if(prs>0) s+=`<div class="gcs-p-display"><strong>GCS-P:</strong> ${t} &minus; ${prs} = <strong>${gcsP}</strong></div>`;
    s+=`<div class="summary-row"><span class="criteria">AVPU</span><span class="value">${avpuLabel[avpu]||'—'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Glicemia</span><span class="value"><span class="dot ${glucose.value==='low'||glucose.value==='critical_high'?'dot-critical':glucose.value==='high'?'dot-warning':'dot-normal'}"></span>${glucoseLabel()}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Via aérea</span><span class="value">${airway.needs_intubation?'IOT'+(airway.secured?' (ok)':' (pendente)'):'Pérvia'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Cronologia</span><span class="value">${timelineLabel} / ${modeLabel}</span></div>`;
    return s;
  });

  if(airway.needs_intubation){
    h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>Via aérea: IOT indicada</strong>'+(airway.secured?'Assegurada. Confirmar posição (capnografia + RX) e parâmetros.':'AGUARDANDO — prioridade máxima.')+'</div></div>';
  }

  // Causes
  h+=collapsible('causes','Causas Suspeitas (AEIOU-TIPS)',()=>{
    let s='';
    if(causes.size===0){
      s+='<p style="color:#4b5e7a;text-align:center;padding:.4rem 0;font-size:.8rem">Nenhuma causa selecionada.</p>';
    } else {
      for(const c of AEIOU_TIPS){
        if(causes.has(c.id)) s+=`<div class="summary-row"><span class="criteria">[${c.letter}] ${c.name}</span><span class="value">${c.icon}</span></div>`;
      }
    }
    s+='<div style="margin-top:.55rem;padding-top:.55rem;border-top:1px solid rgba(30,41,59,.5)">';
    if(isStructural()&&isMetabolicToxic()){
      s+='<div style="font-size:.76rem;color:#fcd34d;font-weight:600">⚠️ Estrutural + metabólico/tóxico — investigar ambos</div>';
    } else if(isStructural()){
      s+='<div style="font-size:.76rem;color:#fca5a5;font-weight:600">🧠 Predomínio ESTRUTURAL</div>';
    } else if(isMetabolicToxic()){
      s+='<div style="font-size:.76rem;color:#86efac;font-weight:600">🧪 Predomínio METABÓLICO/TÓXICO (reversível)</div>';
    } else if(isInfectious()){
      s+='<div style="font-size:.76rem;color:#fcd34d;font-weight:600">🦠 INFECCIOSO — ATB precoce</div>';
    } else if(isSeizure()){
      s+='<div style="font-size:.76rem;color:#67e8f9;font-weight:600">⚡ EPILÉPTICO (pós-ictal/status)</div>';
    }
    s+='</div>';
    return s;
  });

  // Exam
  h+=collapsible('exam','Exame Neurológico',()=>{
    let s='';
    const pupilSzLbl={miotic:'Mióticas',normal:'Normais',mydriatic:'Midriáticas',anisocoric:'Anisocóricas'};
    const pupilRxLbl={reactive:'Fotorreativas',sluggish:'Lentas',fixed:'Fixas'};
    const motorLbl={normal:'Normal/localiza',decorticate:'Decorticação',decerebrate:'Descerebração',flaccid:'Flacidez',asymmetric:'Assimétrico'};
    const meningLbl={none:'Ausentes',nuchal:'Rigidez de nuca',kernig_brudzinski:'Kernig/Brudzinski +'};
    const focalLbl={none:'Nenhum',hemiparesis:'Hemiparesia',cranial_nerve:'Par craniano',aphasia:'Afasia'};

    if(exam.pupil_size) s+=`<div class="summary-row"><span class="criteria">Pupilas — tamanho</span><span class="value"><span class="dot ${exam.pupil_size==='anisocoric'||exam.pupil_size==='mydriatic'?'dot-warning':'dot-normal'}"></span>${pupilSzLbl[exam.pupil_size]}</span></div>`;
    if(exam.pupil_reactivity) s+=`<div class="summary-row"><span class="criteria">Pupilas — reatividade</span><span class="value"><span class="dot ${exam.pupil_reactivity==='fixed'?'dot-critical':exam.pupil_reactivity==='sluggish'?'dot-warning':'dot-normal'}"></span>${pupilRxLbl[exam.pupil_reactivity]}</span></div>`;
    if(exam.motor_pattern) s+=`<div class="summary-row"><span class="criteria">Padrão motor</span><span class="value"><span class="dot ${exam.motor_pattern==='decerebrate'||exam.motor_pattern==='flaccid'?'dot-critical':exam.motor_pattern==='decorticate'?'dot-warning':exam.motor_pattern==='normal'?'dot-normal':'dot-info'}"></span>${motorLbl[exam.motor_pattern]}</span></div>`;
    if(exam.meningeal) s+=`<div class="summary-row"><span class="criteria">Sinais meníngeos</span><span class="value"><span class="dot ${exam.meningeal!=='none'?'dot-warning':'dot-normal'}"></span>${meningLbl[exam.meningeal]}</span></div>`;
    if(exam.focal_deficit) s+=`<div class="summary-row"><span class="criteria">Déficit focal</span><span class="value"><span class="dot ${exam.focal_deficit!=='none'?'dot-critical':'dot-normal'}"></span>${focalLbl[exam.focal_deficit]}</span></div>`;
    if(!s) s='<p style="color:#4b5e7a;text-align:center;padding:.4rem 0;font-size:.8rem">Exame não preenchido.</p>';
    return s;
  });

  // Vitals
  h+=collapsible('vitals','Sinais Vitais',()=>{
    let s='';
    const bpLbl={hypo:'Hipotensão',normal:'Normal',htn:'HAS',severe_htn:'HAS grave'};
    const hrLbl={brady:'Bradicardia',normal:'Normal',tachy:'Taquicardia'};
    const rrLbl={brady:'Bradipneia',normal:'Normal',tachy:'Taquipneia',irregular:'Irregular'};
    const tempLbl={hypo:'Hipotermia',normal:'Normal',fever:'Febre',hyperthermia:'>40°C'};
    const spo2Lbl={low:'< 94%',normal:'≥ 94%'};

    if(vitals.bp) s+=`<div class="summary-row"><span class="criteria">PA</span><span class="value"><span class="dot ${vitals.bp==='hypo'||vitals.bp==='severe_htn'?'dot-critical':vitals.bp==='htn'?'dot-warning':'dot-normal'}"></span>${bpLbl[vitals.bp]}</span></div>`;
    if(vitals.hr) s+=`<div class="summary-row"><span class="criteria">FC</span><span class="value"><span class="dot ${vitals.hr!=='normal'?'dot-warning':'dot-normal'}"></span>${hrLbl[vitals.hr]}</span></div>`;
    if(vitals.rr) s+=`<div class="summary-row"><span class="criteria">FR</span><span class="value"><span class="dot ${vitals.rr!=='normal'?'dot-warning':'dot-normal'}"></span>${rrLbl[vitals.rr]}</span></div>`;
    if(vitals.temp) s+=`<div class="summary-row"><span class="criteria">Temperatura</span><span class="value"><span class="dot ${vitals.temp==='fever'||vitals.temp==='hyperthermia'?'dot-warning':vitals.temp==='hypo'?'dot-info':'dot-normal'}"></span>${tempLbl[vitals.temp]}</span></div>`;
    if(vitals.spo2) s+=`<div class="summary-row"><span class="criteria">SpO₂</span><span class="value"><span class="dot ${vitals.spo2==='low'?'dot-critical':'dot-normal'}"></span>${spo2Lbl[vitals.spo2]}</span></div>`;
    if(hasCushingTriad()) s+='<div style="margin-top:.55rem;padding:.55rem;background:rgba(69,10,10,.6);border:1px solid #991b1b;border-radius:.45rem;font-size:.76rem;color:#fca5a5;font-weight:600;text-align:center">⚠️ TRÍADE DE CUSHING (HIC)</div>';
    if(!s) s='<p style="color:#4b5e7a;text-align:center;padding:.4rem 0;font-size:.8rem">Não preenchido.</p>';
    return s;
  });

  // Toxidrome
  if(selectedToxidrome){
    const tox=TOXIDROMES.find(t=>t.id===selectedToxidrome);
    h+=collapsible('toxidrome','Toxídrome',()=>{
      let s='';
      s+=`<div class="summary-row"><span class="criteria">Nome</span><span class="value">${tox.icon} ${tox.name}</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Sinais</span><span class="value" style="font-size:.7rem;max-width:65%">${tox.signs}</span></div>`;
      s+=`<div style="margin-top:.55rem;padding:.55rem;background:rgba(12,74,110,.3);border:1px solid #0369a1;border-radius:.45rem;font-size:.76rem;color:#7dd3fc"><strong style="display:block;margin-bottom:.1rem">Antídoto:</strong>${tox.antidote}</div>`;
      return s;
    },true);
  }

  // Stratification
  h+=collapsible('stratification','Estratificação',()=>{
    let s='';
    const structural=isStructural(),metabolic=isMetabolicToxic(),infectious=isInfectious(),seizure=isSeizure();
    s+='<div style="display:flex;gap:.35rem;margin-bottom:.55rem;flex-wrap:wrap">';
    s+=stratCard('🧠','Estrutural',structural,'#fca5a5');
    s+=stratCard('🧪','Metab./Tóx.',metabolic,'#86efac');
    s+=stratCard('🦠','Infeccioso',infectious,'#fcd34d');
    s+=stratCard('⚡','Epiléptico',seizure,'#67e8f9');
    s+='</div>';
    const findings=[];
    if(t!==null&&t<=8) findings.push('GCS ≤ 8 (grave)');
    else if(t!==null&&t<=12) findings.push('GCS 9-12 (moderado)');
    if(gcsP!==null&&prs>0) findings.push(`GCS-P = ${gcsP} (pupilar -${prs})`);
    if(hasCushingTriad()) findings.push('Tríade de Cushing (HIC)');
    if(hs.length>=2) findings.push('Sinais de herniação ('+hs.length+')');
    if(exam.pupil_reactivity==='fixed') findings.push('Pupilas fixas');
    if(exam.pupil_size==='anisocoric') findings.push('Anisocoria');
    if(exam.focal_deficit&&exam.focal_deficit!=='none') findings.push('Déficit focal');
    if(exam.meningeal&&exam.meningeal!=='none') findings.push('Sinais meníngeos +');
    if(exam.motor_pattern==='decerebrate') findings.push('Descerebração');
    if(exam.motor_pattern==='decorticate') findings.push('Decorticação');
    if(exam.motor_pattern==='flaccid') findings.push('Flacidez');
    if(onset.mode==='sudden') findings.push('Instalação súbita');
    if(glucose.value==='low') findings.push('Hipoglicemia');
    if(glucose.value==='critical_high') findings.push('Hiperglicemia grave');
    if(airway.needs_intubation) findings.push('IOT indicada');
    if(vitals.spo2==='low') findings.push('Hipoxemia');
    if(findings.length){
      s+='<div style="font-size:.72rem;color:#94a3b8"><strong style="color:#cbd5e1">Achados:</strong><br>';
      s+=findings.map(f=>'&bull; '+f).join('<br>');
      s+='</div>';
    }
    return s;
  });

  // Workup
  h+=collapsible('workup','Propedêutica',()=>{
    let s='';
    s+='<div style="font-size:.64rem;color:#4b5e7a;margin-bottom:.45rem">🔶 Prioridade &middot; ⬜ Rotina &middot; 🔵 Condicional</div>';
    s+='<div class="workup-grid">';
    s+=wkItem('🩸','Glicemia',true,false);
    s+=wkItem('🎯','TC crânio sem contraste',true,false);
    s+=wkItem('🧪','HMG',false,false);
    s+=wkItem('🧪','Eletrólitos (Na K Ca Mg)',false,false);
    s+=wkItem('🧪','Função renal',false,false);
    s+=wkItem('🧪','Função hepática',false,false);
    s+=wkItem('🧪','Gasometria',false,false);
    s+=wkItem('🧪','Coagulograma',false,false);
    s+=wkItem('🧪','Lactato / PCR',false,false);
    s+=wkItem('💊','Screening toxicológico',false,causes.has('alcohol')||causes.has('opiates')||selectedToxidrome!==null);
    s+=wkItem('🦠','Punção lombar (pós TC)',false,isInfectious()||(exam.meningeal&&exam.meningeal!=='none'));
    s+=wkItem('🧪','Hemoculturas',false,vitals.temp==='fever'||vitals.temp==='hyperthermia'||isInfectious());
    s+=wkItem('🧪','Amônia',false,causes.has('uremia'));
    s+=wkItem('🧪','TSH/T4L',false,vitals.temp==='hypo'||vitals.bp==='hypo');
    s+=wkItem('⚡','EEG',false,causes.has('epilepsy')||onset.mode==='fluctuating');
    s+=wkItem('🧠','AngioTC / RM',false,isStructural()||onset.mode==='sudden');
    s+=wkItem('🧪','Etanol sérico',false,causes.has('alcohol'));
    s+=wkItem('🧪','Osmolaridade',false,glucose.value==='critical_high'||causes.has('alcohol'));
    s+=wkItem('🧪','Cortisol',false,vitals.bp==='hypo');
    s+=wkItem('🧪','Cetonas',false,glucose.value==='critical_high');
    s+=wkItem('🧪','ECG 12d',false,vitals.hr==='brady'||vitals.hr==='tachy'||selectedToxidrome==='anticholinergic');
    s+='</div>';
    return s;
  });

  // Conduta
  h+=buildConduta();

  // Note
  h+=collapsible('note','Nota para Prontuário',()=>buildNoteContent());

  // Eval duration
  if(evalEndTime){
    const dur=Math.floor((evalEndTime-evalStartTime)/1000);
    const durMin=Math.floor(dur/60);
    const durSec=dur%60;
    h+=`<div style="text-align:center;font-size:.66rem;color:#475569;margin-top:.5rem;font-family:'SF Mono','Fira Code',monospace;letter-spacing:.05em">Avaliação em ${String(durMin).padStart(2,'0')}:${String(durSec).padStart(2,'0')}</div>`;
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="restart()">Nova Avaliação</button>';
  h+='</div></div>';

  app.innerHTML=h;
}

function stratCard(icon,label,active,color){
  const bg=active?'background:rgba(15,23,42,.55);border:1.5px solid '+color:'background:#111827;border:1.5px solid #1e293b';
  return `<div style="flex:1;min-width:calc(25% - .25rem);padding:.5rem .35rem;border-radius:.45rem;text-align:center;${bg};transition:all .2s">
    <div style="font-size:.95rem;margin-bottom:.1rem">${icon}</div>
    <div style="font-size:.62rem;font-weight:700;color:${active?color:'#4b5e7a'}">${label}</div></div>`;
}

function wkItem(icon,label,highlighted,conditional){
  let cls='workup-item';
  if(highlighted) cls+=' highlighted';
  else if(conditional) cls+=' conditional';
  return `<div class="${cls}"><span class="w-icon">${icon}</span>${label}</div>`;
}

function glucoseLabel(){
  const m={low:'Hipoglicemia (< 70)',normal:'Normal',high:'Hiperglicemia (180-400)',critical_high:'Hipergl. grave (> 400)'};
  return m[glucose.value]||'Não verificada';
}

// =============================================
// CONDUTA
// =============================================
function buildConduta(){
  const r=riskLevel();
  const t=gcsTotal();
  let cls,title,items;

  if(r==='critical'){
    cls='alta-prob';title='Conduta — Crítico';
    items=[
      ['🚨','ABC: proteger via aérea (IOT se GCS ≤ 8). SRI.'],
      ['💉','2 acessos calibrosos (≥18G) + monitor (ECG, PA, SpO₂, capnografia)'],
      ['🩸','Corrigir hipoglicemia: Glicose 50% 50 mL IV']
    ];
    if(causes.has('alcohol')) items.push(['💊','Tiamina 200–500 mg IV ANTES da glicose (Wernicke)']);
    if(causes.has('opiates')||selectedToxidrome==='opioid') items.push(['💊','Naloxona 0,04–0,4 mg IV. Titular até FR ≥ 12. Meia-vida da naloxona < opióide — monitorizar 4h. Considerar BI.']);
    items.push(['🧠','TC de crânio URGENTE']);
    if(isInfectious()||(exam.meningeal&&exam.meningeal!=='none')){
      items.push(['🦠','Ceftriaxona 2g IV 12/12h + Dexa 0,15mg/kg 6/6h AGORA (não aguardar PL)']);
      items.push(['🧬','Aciclovir 10mg/kg 8/8h se encefalite herpética suspeita']);
    }
    if(herniationSigns().length>=2) items.push(['⚠️','Anti-herniação: Manitol 20% 1g/kg IV em 20min (ou NaCl 23,4% 30mL), cabeceira 30°, hiperventilação leve transitória']);
    if(causes.has('epilepsy')) items.push(['⚡','Status: Diazepam 10mg IV → Fenitoína 20mg/kg IV ou Levetiracetam 60mg/kg IV']);
    if(vitals.bp==='hypo') items.push(['💧','Volume + vasopressor. Hidrocortisona 100mg IV se suspeita adrenal.']);
    if(vitals.temp==='hypo') items.push(['🥶','Reaquecimento. Mixedema: Levotiroxina 200–500μg IV + Hidrocortisona 100mg IV']);
    items.push(['📱','Neurocirurgia/neurologia URGENTE']);
    items.push(['🏥','UTI']);
  } else if(r==='high'){
    cls='mod-prob';title='Conduta — Alto Risco';
    items=[
      ['🚨','Sala de emergência com monitor'],
      ['🧠','TC de crânio urgente'],
      ['🧪','Lab completo: HMG, eletrólitos, F. renal, gaso, coagulo, lactato'],
      ['💊','Tratar causa reversível']
    ];
    if(causes.has('alcohol')) items.push(['💊','Tiamina 200 mg IV']);
    if(causes.has('opiates')) items.push(['💊','Prova com Naloxona 0,4 mg IV']);
    if(exam.focal_deficit&&exam.focal_deficit!=='none') items.push(['🎯','Déficit focal: protocolo AVC (janela 4,5h / 24h)']);
    if(glucose.value==='critical_high') items.push(['💉','SF 0,9% vigoroso + investigar CAD/EHH']);
    if(exam.meningeal&&exam.meningeal!=='none') items.push(['🦠','ATB empírico se suspeita meningite (não aguardar PL)']);
    if(onset.mode==='sudden'&&!isStructural()) items.push(['🎯','Súbito s/ estrutural óbvia: AVC posterior, dissecção, HSA com TC normal (PL)']);
    items.push(['📋','PL (após TC normal, sem CI)']);
    items.push(['📱','Neurologia']);
    items.push(['🏥','UTI/enfermaria com monitor']);
  } else if(r==='moderate'){
    cls='neutra-prob';title='Conduta — Moderado';
    items=[
      ['🧪','Lab: HMG, eletrólitos, F. renal, glicemia, gaso, F. hepática'],
      ['🧠','TC de crânio conforme clínica'],
      ['💊','Screening toxicológico se suspeita'],
      ['📋','Glasgow seriado a cada 1–2h'],
      ['📱','Neurologia conforme evolução'],
      ['🏥','Observação com monitor']
    ];
    if(causes.has('alcohol')) items.push(['💊','Tiamina 100–200 mg IV/IM']);
    if(onset.mode==='fluctuating') items.push(['⚡','EEG se rebaixamento flutuante sem causa (status não convulsivo?)']);
    if(selectedToxidrome){
      const tox=TOXIDROMES.find(t=>t.id===selectedToxidrome);
      if(tox) items.push(['💊',`Toxídrome ${tox.name}: ${tox.antidote}`]);
    }
  } else {
    cls='baixa-prob';title='Conduta — Baixo';
    items=[
      ['🧪','Lab básico: glicemia, eletrólitos, F. renal, HMG'],
      ['🔍','Investigar metabólico/tóxico'],
      ['📋','Glasgow seriado a cada 2–4h'],
      ['🧠','TC se sem causa clara'],
      ['🏠','Alta após melhora e causa tratada']
    ];
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${cls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.55rem':'0'}">`;
  if(open){
    for(const [icon,text] of items) h+=`<div class="conduta-item"><span class="conduta-icon">${icon}</span><span>${text}</span></div>`;
  }
  h+='</div></div>';
  return h;
}

// =============================================
// NOTE
// =============================================
function buildNoteContent(){
  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const t=gcsTotal();
  const ri=riskInfo();
  const prs=pupilReactivityScore();
  const gcsP=gcsPTotal();
  const timelineLabel=onset.timeline==='acute'?'Agudo (min-h)':onset.timeline==='subacute'?'Subagudo (dias)':onset.timeline==='chronic'?'Crônico':'—';
  const modeLabel=onset.mode==='sudden'?'Súbito':onset.mode==='fluctuating'?'Flutuante':onset.mode==='progressive'?'Progressivo':'—';

  let n='';
  n+=`REBAIXAMENTO DO NÍVEL DE CONSCIÊNCIA\n`;
  n+=`Data/hora: ${ts}\n`;
  n+=`Estratificação: ${ri.title}\n`;
  n+=`${'═'.repeat(45)}\n\n`;

  n+=`CONSCIÊNCIA\n`;
  n+=`  AVPU: ${avpu||'—'} (${{A:'Alerta',V:'Resp. verbal',P:'Resp. à dor',U:'Arresponsivo'}[avpu]||'—'})\n`;
  const vs=verbalNT?'t':'';
  n+=`  Glasgow: ${t!==null?t:'-'}${vs}/15 (O${gcs.eye||'-'} V${gcs.verbal||'-'}${vs} M${gcs.motor||'-'}) — ${t!==null?gcsLabel(t):'—'}\n`;
  if(verbalNT) n+=`  V não testável (intubado). GCS com sufixo "t".\n`;
  if(gcsP!==null&&prs>0) n+=`  GCS-P: ${gcsP} (${t} - ${prs} pupilar)\n`;
  n+=`  Via aérea: ${airway.needs_intubation?'IOT indicada'+(airway.secured?' (assegurada)':' (pendente)'):'Pérvia'}\n\n`;

  n+=`GLICEMIA: ${glucoseLabel()}\n\n`;

  n+=`CRONOLOGIA: ${timelineLabel}\n`;
  n+=`  Modo: ${modeLabel}\n\n`;

  n+=`CAUSAS (AEIOU-TIPS):\n`;
  if(causes.size===0) n+=`  Nenhuma selecionada.\n`;
  else for(const c of AEIOU_TIPS) if(causes.has(c.id)) n+=`  [${c.letter}] ${c.name}\n`;
  n+='\n';

  n+=`EXAME NEUROLÓGICO:\n`;
  const pupilSzLbl={miotic:'Mióticas',normal:'Normais',mydriatic:'Midriáticas',anisocoric:'Anisocóricas'};
  const pupilRxLbl={reactive:'Fotorreativas',sluggish:'Lentas',fixed:'Fixas'};
  const motorLbl={normal:'Normal/localiza',decorticate:'Decorticação',decerebrate:'Descerebração',flaccid:'Flacidez',asymmetric:'Assimétrico'};
  const meningLbl={none:'Ausentes',nuchal:'Rigidez de nuca',kernig_brudzinski:'Kernig/Brudzinski +'};
  const focalLbl={none:'Nenhum',hemiparesis:'Hemiparesia',cranial_nerve:'Par craniano',aphasia:'Afasia'};

  if(exam.pupil_size) n+=`  Pupilas: ${pupilSzLbl[exam.pupil_size]}`;
  if(exam.pupil_reactivity) n+=`, ${pupilRxLbl[exam.pupil_reactivity]}`;
  if(exam.pupil_size||exam.pupil_reactivity) n+='\n';
  if(exam.motor_pattern) n+=`  Padrão motor: ${motorLbl[exam.motor_pattern]}\n`;
  if(exam.meningeal) n+=`  Sinais meníngeos: ${meningLbl[exam.meningeal]}\n`;
  if(exam.focal_deficit) n+=`  Déficit focal: ${focalLbl[exam.focal_deficit]}\n`;
  n+='\n';

  n+=`SINAIS VITAIS:\n`;
  const bpLbl={hypo:'Hipotensão',normal:'Normal',htn:'HAS',severe_htn:'HAS grave'};
  const hrLbl={brady:'Bradicardia',normal:'Normal',tachy:'Taquicardia'};
  const rrLbl={brady:'Bradipneia',normal:'Normal',tachy:'Taquipneia',irregular:'Irregular'};
  const tempLbl={hypo:'Hipotermia',normal:'Normal',fever:'Febre',hyperthermia:'>40°C'};
  const spo2Lbl={low:'< 94%',normal:'≥ 94%'};

  if(vitals.bp) n+=`  PA: ${bpLbl[vitals.bp]}\n`;
  if(vitals.hr) n+=`  FC: ${hrLbl[vitals.hr]}\n`;
  if(vitals.rr) n+=`  FR: ${rrLbl[vitals.rr]}\n`;
  if(vitals.temp) n+=`  Temp: ${tempLbl[vitals.temp]}\n`;
  if(vitals.spo2) n+=`  SpO₂: ${spo2Lbl[vitals.spo2]}\n`;
  if(hasCushingTriad()) n+=`  *** TRÍADE DE CUSHING (HIC) ***\n`;

  const hs=herniationSigns();
  if(hs.length>=2) n+=`  *** HERNIAÇÃO: ${hs.join(', ')} ***\n`;
  n+='\n';

  if(selectedToxidrome){
    const tox=TOXIDROMES.find(t=>t.id===selectedToxidrome);
    n+=`TOXÍDROME: ${tox.name}\n`;
    n+=`  Antídoto: ${tox.antidote}\n\n`;
  }

  n+=`ESTRATIFICAÇÃO: ${ri.title}\n`;
  if(isStructural()) n+=`  Predomínio: Estrutural\n`;
  else if(isMetabolicToxic()) n+=`  Predomínio: Metabólico/Tóxico\n`;
  else if(isInfectious()) n+=`  Predomínio: Infeccioso\n`;
  else if(isSeizure()) n+=`  Predomínio: Epiléptico\n`;
  n+=`  ${ri.desc}\n`;

  if(evalEndTime){
    const dur=Math.floor((evalEndTime-evalStartTime)/1000);
    n+=`\nDuração: ${Math.floor(dur/60)}min ${dur%60}s\n`;
  }

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">📋 Copiar para prontuário</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el) return;
  const text=el.textContent||el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showCopied();}catch(e){showToast('Não foi possível copiar',2500);}
  document.body.removeChild(ta);
}
function showCopied(){
  const btn=document.getElementById('copyBtn');
  if(!btn) return;
  btn.textContent='✓ Copiado';btn.classList.add('copied');
  showToast('Nota copiada');
  setTimeout(()=>{if(btn){btn.textContent='📋 Copiar para prontuário';btn.classList.remove('copied');}},2200);
}

// =============================================
// ACTIONS
// =============================================
function setGlucose(v){glucose.value=v;render()}
function setAVPU(v){avpu=v;render()}
function setGCS(field,v){gcs[field]=v;render()}
function setGCSVerbal(v){verbalNT=false;gcs.verbal=v;render()}
function setVerbalNT(){verbalNT=!verbalNT;gcs.verbal=verbalNT?1:null;render()}
function setAirway(field,v){
  if(field==='needs'){airway.needs_intubation=v;if(!v)airway.secured=null;}
  else airway.secured=v;
  render();
}
function setOnset(field,v){onset[field]=v;render()}
function toggleCause(id){causes.has(id)?causes.delete(id):causes.add(id);render()}
function setExam(field,v){exam[field]=exam[field]===v?null:v;render()}
function setVitals(field,v){vitals[field]=vitals[field]===v?null:v;render()}
function setToxidrome(id){selectedToxidrome=selectedToxidrome===id?null:id;render()}
function clearToxidrome(){selectedToxidrome=null;render()}
function toggleSection(id){sections[id]=!sections[id];render()}

function jumpToStep(targetStep){
  if(targetStep<step){
    if(step>=TOTAL_STEPS&&evalEndTime){
      evalEndTime=null;
      timerInterval=setInterval(updateTimer,1000);
    }
    step=targetStep;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
    showToast(STEP_LABELS[targetStep]);
  }
}

function next(){
  if(step===0&&glucose.value===null) return;
  if(step===1&&(avpu===null||gcs.eye===null||gcs.verbal===null||gcs.motor===null)) return;
  if(step===2&&airway.needs_intubation===null) return;
  if(step===3&&(onset.timeline===null||onset.mode===null)) return;
  step++;render();window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){
  if(step>0){
    if(step>=TOTAL_STEPS&&evalEndTime){
      evalEndTime=null;
      timerInterval=setInterval(updateTimer,1000);
    }
    step--;render();window.scrollTo({top:0,behavior:'smooth'});
  }
}
function restart(){
  if(!confirm('Iniciar nova avaliação? Dados atuais serão perdidos.')) return;
  step=0;
  glucose={value:null};
  avpu=null;gcs={eye:null,verbal:null,motor:null};
  verbalNT=false;
  airway={needs_intubation:null,secured:null};
  onset={timeline:null,mode:null};
  causes=new Set();
  exam={pupil_size:null,pupil_reactivity:null,motor_pattern:null,meningeal:null,focal_deficit:null};
  vitals={bp:null,hr:null,rr:null,temp:null,spo2:null};
  selectedToxidrome=null;
  sections={gcs:true,causes:true,exam:false,vitals:false,toxidrome:true,stratification:true,workup:true,conduta:true,note:true};
  evalEndTime=null;
  clearInterval(timerInterval);
  evalStartTime=new Date();
  timerInterval=setInterval(updateTimer,1000);
  render();window.scrollTo({top:0,behavior:'smooth'});
}

// =============================================
// KEYBOARD
// =============================================
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&step>0){e.preventDefault();prev();return;}
  if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey){
    const primaryBtn=document.querySelector('.nav-btn.primary:not(:disabled)');
    if(primaryBtn&&!e.target.closest('.option-btn,.check-btn,.score-opt,.toxidrome-card')){
      e.preventDefault();
      primaryBtn.click();
    }
  }
});

render();
</script>
