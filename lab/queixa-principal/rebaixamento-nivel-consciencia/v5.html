<!-- VERSION: 5 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebaixamento do Nível de Consciência — Avaliação Estruturada</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0f1e;color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
  header{background:linear-gradient(135deg,#111827 0%,#1e293b 50%,#1a2332 100%);width:100%;padding:1.25rem 1.5rem;text-align:center;border-bottom:2px solid #3b82f6;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  header h1{font-size:1.35rem;font-weight:700;color:#f1f5f9;letter-spacing:-.01em}
  header p{font-size:.78rem;color:#64748b;margin-top:.2rem;letter-spacing:.02em}
  .back-link{position:absolute;left:1.25rem;top:50%;transform:translateY(-50%);color:#64748b;text-decoration:none;font-size:.8rem;font-weight:500;transition:all .2s;display:flex;align-items:center;gap:.3rem;padding:.4rem .6rem;border-radius:.5rem}
  .back-link:hover{color:#f1f5f9;background:rgba(255,255,255,.05)}
  .back-link:active{transform:translateY(-50%) scale(.96)}
  .timer{position:absolute;right:1.25rem;top:50%;transform:translateY(-50%);font-size:.7rem;color:#475569;font-family:'SF Mono','Fira Code',monospace;font-variant-numeric:tabular-nums;transition:color .3s}
  .timer.stopped{color:#3b82f6}
  .container{max-width:680px;width:100%;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}

  /* Progress */
  .progress-wrapper{padding:0 .25rem}
  .progress-bar{display:flex;align-items:center;gap:3px;padding:0}
  .progress-step{flex:1;height:5px;border-radius:3px;background:#1e293b;transition:all .4s ease;cursor:pointer;position:relative}
  .progress-step:hover{filter:brightness(1.3)}
  .progress-step.done{background:linear-gradient(90deg,#2563eb,#3b82f6)}
  .progress-step.active{background:#60a5fa;animation:pulse-bar 2s ease-in-out infinite}
  .progress-step.clickable{cursor:pointer}
  .progress-step.clickable:hover::after{content:attr(data-label);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e293b;color:#94a3b8;font-size:.6rem;padding:.2rem .5rem;border-radius:4px;white-space:nowrap;border:1px solid #334155;z-index:10;pointer-events:none}
  @keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.4}}
  .progress-info{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem;padding:0 .1rem}
  .progress-label{font-size:.7rem;color:#94a3b8;font-weight:500}
  .progress-counter{font-size:.65rem;color:#475569;font-family:'SF Mono','Fira Code',monospace;background:#111827;padding:.15rem .5rem;border-radius:9999px;border:1px solid #1e293b}
  .flow-connector{display:flex;justify-content:center;padding:.15rem 0}
  .flow-connector .arrow{width:2px;height:20px;background:linear-gradient(to bottom,#334155,#1e293b);position:relative}
  .flow-connector .arrow::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #334155}

  /* Cards */
  .card{background:linear-gradient(165deg,#141c2e 0%,#1a2435 40%,#1e293b 100%);border:1px solid #253044;border-radius:1rem;padding:1.75rem;animation:cardIn .4s cubic-bezier(.16,1,.3,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .card h2{font-size:1.1rem;color:#f8fafc;margin-bottom:.25rem;font-weight:700;letter-spacing:-.01em}
  .card .subtitle{font-size:.78rem;color:#64748b;margin-bottom:1.25rem}
  .options{display:flex;flex-direction:column;gap:.6rem}
  .option-group-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:#4b5e7a;margin-top:.75rem;margin-bottom:-.1rem;font-weight:600}
  .option-group-label:first-child{margin-top:0}

  /* Option buttons */
  .option-btn{background:#0c1322;border:1.5px solid #253044;border-radius:.75rem;padding:.8rem 1rem;color:#94a3b8;font-size:.9rem;cursor:pointer;transition:all .18s ease;text-align:left;display:flex;align-items:center;gap:.7rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none}
  .option-btn:hover{border-color:#3b82f6;background:#131d33;color:#e2e8f0;transform:translateX(2px)}
  .option-btn:focus-visible{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.3)}
  .option-btn:active{transform:translateX(2px) scale(.98)}
  .option-btn.selected{border-color:#3b82f6;background:linear-gradient(135deg,#172554,#1e3a5f);color:#f1f5f9;box-shadow:0 0 0 1px rgba(59,130,246,.15),inset 0 1px 0 rgba(255,255,255,.03)}
  .option-btn.selected::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;border-radius:.75rem;animation:selectPulse .4s ease-out;pointer-events:none}
  @keyframes selectPulse{from{box-shadow:0 0 0 0 rgba(59,130,246,.4)}to{box-shadow:0 0 0 8px rgba(59,130,246,0)}}
  .option-btn{position:relative;overflow:visible}
  .option-btn .icon{font-size:1.15rem;flex-shrink:0;width:1.8rem;text-align:center}
  .option-btn .label{flex:1;line-height:1.4}
  .option-btn .tag{font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .5rem;border-radius:9999px;font-weight:700;flex-shrink:0;white-space:nowrap}
  .tag-critical{background:rgba(127,29,29,.6);color:#fca5a5}
  .tag-warning{background:rgba(120,53,15,.6);color:#fcd34d}
  .tag-info{background:rgba(22,78,99,.6);color:#67e8f9}
  .tag-normal{background:rgba(20,83,45,.6);color:#86efac}
  .tag-neutral{background:rgba(55,65,81,.6);color:#d1d5db}

  /* Check buttons */
  .check-btn{background:#0c1322;border:1.5px solid #253044;border-radius:.75rem;padding:.7rem 1rem;color:#94a3b8;font-size:.85rem;cursor:pointer;transition:all .18s ease;text-align:left;display:flex;align-items:center;gap:.7rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none}
  .check-btn:hover{border-color:#3b82f6;background:#131d33;color:#e2e8f0}
  .check-btn:focus-visible{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.3)}
  .check-btn:active{transform:scale(.98)}
  .check-btn.checked{border-color:#3b82f6;background:linear-gradient(135deg,#172554,#1e3a5f);color:#f1f5f9}
  .check-box{width:18px;height:18px;border:2px solid #374d6b;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s;font-size:.7rem;color:transparent}
  .check-btn.checked .check-box{background:#3b82f6;border-color:#3b82f6;color:#fff}

  /* Nav */
  .nav-row{display:flex;gap:.6rem;margin-top:1rem}
  .nav-btn{flex:1;padding:.75rem;border-radius:.75rem;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none}
  .nav-btn:focus-visible{box-shadow:0 0 0 2px rgba(96,165,250,.4)}
  .nav-btn.secondary{background:#1e293b;color:#94a3b8;border:1px solid #334155}.nav-btn.secondary:hover{background:#253044;color:#cbd5e1}
  .nav-btn.primary{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.25)}.nav-btn.primary:hover{background:linear-gradient(135deg,#1d4ed8,#2563eb);box-shadow:0 4px 12px rgba(37,99,235,.35)}
  .nav-btn:active:not(:disabled){transform:scale(.97)}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;pointer-events:none}
  .skip-hint{text-align:center;font-size:.7rem;color:#475569;margin-top:-.25rem}

  /* Score options */
  .score-opt{flex:1;padding:.5rem .25rem;border-radius:.5rem;font-size:.7rem;cursor:pointer;border:1.5px solid #253044;background:#0c1322;color:#64748b;text-align:center;transition:all .18s;line-height:1.3;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-width:0;word-break:break-word;outline:none}
  .score-opt:hover{border-color:#3b82f6;color:#94a3b8;background:#131d33}
  .score-opt:focus-visible{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.3)}
  .score-opt:active{transform:scale(.95)}
  .score-opt.picked{border-color:#3b82f6;background:linear-gradient(135deg,#172554,#1e3a5f);color:#f1f5f9;font-weight:600}
  .score-opt .pts{display:block;font-size:.55rem;color:#475569;margin-top:.15rem}.score-opt.picked .pts{color:#60a5fa}

  /* GCS Display */
  .gcs-display{display:flex;align-items:center;justify-content:center;gap:1.25rem;padding:.75rem;margin:.75rem 0;background:rgba(15,23,42,.5);border-radius:.75rem;border:1px solid #1e293b}
  .gcs-component{text-align:center}
  .gcs-component-value{font-size:1.6rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace;color:#60a5fa}
  .gcs-component-label{font-size:.6rem;color:#4b5e7a;text-transform:uppercase;letter-spacing:.05em;margin-top:.1rem;font-weight:600}
  .gcs-divider{width:1px;height:2.5rem;background:#253044}
  .gcs-total{text-align:center}
  .gcs-total-value{font-size:2.2rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace}
  .gcs-total-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;margin-top:.15rem;font-weight:600}
  .gcs-total.critical .gcs-total-value{color:#fca5a5}
  .gcs-total.critical .gcs-total-label{color:#fca5a5}
  .gcs-total.warning .gcs-total-value{color:#fcd34d}
  .gcs-total.warning .gcs-total-label{color:#fcd34d}
  .gcs-total.moderate .gcs-total-value{color:#60a5fa}
  .gcs-total.moderate .gcs-total-label{color:#60a5fa}
  .gcs-total.good .gcs-total-value{color:#86efac}
  .gcs-total.good .gcs-total-label{color:#86efac}

  /* Alerts */
  .alert-box{border-radius:.75rem;padding:.9rem 1.1rem;margin:.6rem 0;display:flex;align-items:flex-start;gap:.65rem;font-size:.82rem;animation:alertIn .3s ease}
  @keyframes alertIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
  .alert-box .alert-icon{font-size:1.2rem;flex-shrink:0;margin-top:.05rem}
  .alert-box .alert-text{flex:1;line-height:1.55}
  .alert-box .alert-text strong{display:block;margin-bottom:.15rem;font-weight:700}
  .alert-critical{background:rgba(69,10,10,.7);border:1.5px solid #991b1b;color:#fca5a5}
  .alert-warning{background:rgba(69,26,3,.7);border:1.5px solid #78350f;color:#fcd34d}
  .alert-info{background:rgba(12,74,110,.5);border:1.5px solid #0369a1;color:#7dd3fc}
  .alert-success{background:rgba(5,46,22,.7);border:1.5px solid #14532d;color:#86efac}

  /* Result */
  .result-card{text-align:center;padding:1.75rem 1.5rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:4.5rem;height:4.5rem;border-radius:50%;font-size:1.3rem;font-weight:800;margin-bottom:.75rem;animation:badgePop .5s cubic-bezier(.16,1,.3,1)}
  @keyframes badgePop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .result-badge.badge-critical{background:linear-gradient(135deg,#991b1b,#7f1d1d);color:#fca5a5;border:3px solid #ef4444;box-shadow:0 0 20px rgba(239,68,68,.2)}
  .result-badge.badge-high{background:linear-gradient(135deg,#92400e,#78350f);color:#fcd34d;border:3px solid #f59e0b;box-shadow:0 0 20px rgba(245,158,11,.15)}
  .result-badge.badge-moderate{background:linear-gradient(135deg,#1e40af,#1d4ed8);color:#93c5fd;border:3px solid #3b82f6;box-shadow:0 0 20px rgba(59,130,246,.15)}
  .result-badge.badge-low{background:linear-gradient(135deg,#166534,#14532d);color:#86efac;border:3px solid #22c55e;box-shadow:0 0 20px rgba(34,197,94,.15)}
  .result-title{font-size:1.2rem;font-weight:700;margin-bottom:.2rem}
  .result-desc{color:#94a3b8;font-size:.85rem;margin-bottom:1.25rem;line-height:1.5}

  /* Dark boxes */
  .dark-box{background:linear-gradient(165deg,#0c1322,#111827);border:1px solid #1e293b;border-radius:.75rem;padding:1.1rem;text-align:left;margin-bottom:.6rem;transition:border-color .2s}
  .dark-box:hover{border-color:#253044}
  .dark-box h3{font-size:.72rem;color:#4b5e7a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.65rem;font-weight:700}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid rgba(30,41,59,.6);font-size:.82rem}
  .summary-row:last-child{border-bottom:none}
  .summary-row .criteria{color:#64748b}
  .summary-row .value{font-weight:600;display:flex;align-items:center;gap:.35rem}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-critical{background:#ef4444}.dot-warning{background:#f59e0b}.dot-normal{background:#22c55e}.dot-info{background:#3b82f6}

  /* Collapse */
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:.15rem 0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .collapse-header h3{margin-bottom:0}
  .collapse-arrow{font-size:.7rem;color:#4b5e7a;transition:transform .25s ease;padding:.25rem}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .35s ease,opacity .25s ease}
  .collapse-body.hidden{max-height:0!important;padding-top:0;margin-top:0;opacity:0}
  .collapse-body.visible{max-height:5000px;opacity:1}

  /* Conduta */
  .conduta-box{border-radius:.75rem;padding:1.1rem;text-align:left;margin-bottom:.6rem}
  .conduta-box h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.65rem;font-weight:700}
  .conduta-box.alta-prob{background:linear-gradient(165deg,rgba(69,10,10,.8),rgba(69,10,10,.5));border:1.5px solid #991b1b}.conduta-box.alta-prob h3{color:#fca5a5}
  .conduta-box.mod-prob{background:linear-gradient(165deg,rgba(69,26,3,.8),rgba(69,26,3,.5));border:1.5px solid #78350f}.conduta-box.mod-prob h3{color:#fcd34d}
  .conduta-box.baixa-prob{background:linear-gradient(165deg,rgba(5,46,22,.8),rgba(5,46,22,.5));border:1.5px solid #14532d}.conduta-box.baixa-prob h3{color:#86efac}
  .conduta-box.neutra-prob{background:linear-gradient(165deg,#141c2e,#1a2435);border:1.5px solid #334155}.conduta-box.neutra-prob h3{color:#94a3b8}
  .conduta-item{display:flex;align-items:flex-start;gap:.5rem;padding:.35rem 0;font-size:.82rem;color:#cbd5e1;line-height:1.45}
  .conduta-icon{flex-shrink:0;width:1.1rem;text-align:center;margin-top:.05rem}

  /* Note */
  .note-box{background:#0c1322;border-radius:.75rem;padding:1.1rem;text-align:left;margin-bottom:.6rem}
  .note-box h3{font-size:.72rem;color:#4b5e7a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.65rem;font-weight:700}
  .note-text{background:#060a14;border:1px solid #1e293b;border-radius:.5rem;padding:.9rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.68rem;color:#94a3b8;white-space:pre-wrap;line-height:1.6;max-height:350px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .note-text::-webkit-scrollbar{width:4px}.note-text::-webkit-scrollbar-track{background:transparent}.note-text::-webkit-scrollbar-thumb{background:#253044;border-radius:2px}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.65rem;padding:.65rem;border-radius:.5rem;border:1.5px solid #253044;background:#141c2e;color:#94a3b8;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;touch-action:manipulation}
  .copy-btn:hover{border-color:#3b82f6;background:#172040;color:#f1f5f9}
  .copy-btn:active{transform:scale(.97)}
  .copy-btn.copied{border-color:#22c55e;background:rgba(5,46,22,.7);color:#86efac}

  .section-divider{height:1px;background:linear-gradient(90deg,transparent,#334155,transparent);margin:.75rem 0}

  /* Glucose highlight */
  .glucose-highlight{background:linear-gradient(135deg,rgba(69,26,3,.7),rgba(120,53,15,.5));border:2px solid #b45309;border-radius:.75rem;padding:1rem 1.1rem;margin:.75rem 0;text-align:center}
  .glucose-highlight .glucose-icon{font-size:1.75rem;margin-bottom:.35rem}
  .glucose-highlight .glucose-title{font-size:.95rem;font-weight:700;color:#fcd34d;margin-bottom:.2rem}
  .glucose-highlight .glucose-desc{font-size:.78rem;color:#fed7aa;line-height:1.5}

  /* Toxidromes */
  .toxidrome-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .toxidrome-card{background:#0c1322;border:1.5px solid #253044;border-radius:.75rem;padding:.7rem;cursor:pointer;transition:all .2s;text-align:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .toxidrome-card:hover{border-color:#3b82f6;background:#131d33}
  .toxidrome-card:active{transform:scale(.96)}
  .toxidrome-card.selected{border-color:#3b82f6;background:linear-gradient(135deg,#172554,#1e3a5f);box-shadow:0 0 0 1px rgba(59,130,246,.1)}
  .toxidrome-card .tox-icon{font-size:1.3rem;margin-bottom:.2rem}
  .toxidrome-card .tox-name{font-size:.78rem;font-weight:700;color:#e2e8f0;margin-bottom:.15rem}
  .toxidrome-card .tox-signs{font-size:.62rem;color:#64748b;line-height:1.3}

  /* Workup */
  .workup-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
  .workup-item{background:#0c1322;border:1.5px solid #1e293b;border-radius:.5rem;padding:.5rem .65rem;font-size:.75rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem;transition:all .2s}
  .workup-item .w-icon{flex-shrink:0}
  .workup-item.highlighted{border-color:#f59e0b;background:rgba(69,26,3,.4);color:#fcd34d}
  .workup-item.conditional{border-color:#3b82f6;border-style:dashed;color:#7dd3fc}
  .workup-item.not-indicated{opacity:.35;border-style:dotted}

  /* Herniation banner */
  .herniation-banner{background:linear-gradient(135deg,#7f1d1d,#991b1b);border:2px solid #ef4444;border-radius:.75rem;padding:1rem;margin:.6rem 0;text-align:center;animation:herniationPulse 1.5s ease-in-out infinite}
  @keyframes herniationPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
  .herniation-banner h4{color:#fca5a5;font-size:.9rem;font-weight:700;margin-bottom:.25rem}
  .herniation-banner p{color:#fecaca;font-size:.78rem;line-height:1.5}

  /* Intubation checklist */
  .intubation-tip{background:rgba(30,58,95,.4);border:1px solid #1e40af;border-radius:.5rem;padding:.65rem .75rem;margin-top:.5rem;font-size:.75rem;color:#93c5fd;line-height:1.5}
  .intubation-tip strong{display:block;margin-bottom:.15rem;color:#bfdbfe;font-size:.78rem}

  /* GCS-P note */
  .gcs-p-note{background:rgba(12,74,110,.3);border:1px solid #0c4a6e;border-radius:.5rem;padding:.5rem .75rem;margin-top:.5rem;font-size:.72rem;color:#7dd3fc;line-height:1.45}

  /* Score row (for GCS) — flex-wrap for small screens */
  .score-row{display:flex;gap:.3rem;flex-wrap:wrap}
  .score-row .score-opt{min-width:calc(25% - .3rem)}

  /* Thiamine alert */
  .thiamine-box{background:rgba(120,53,15,.4);border:1.5px solid #b45309;border-radius:.75rem;padding:.85rem 1rem;margin:.5rem 0;display:flex;align-items:flex-start;gap:.6rem;font-size:.82rem;color:#fed7aa;line-height:1.5}

  /* GCS-P result display */
  .gcs-p-display{display:flex;align-items:center;justify-content:center;gap:.75rem;padding:.5rem;margin:.5rem 0;background:rgba(12,74,110,.2);border-radius:.5rem;border:1px solid #0c4a6e;font-size:.78rem;color:#7dd3fc}
  .gcs-p-display strong{color:#bfdbfe}

  /* Eval duration badge */
  .eval-duration{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .65rem;border-radius:9999px;background:#111827;border:1px solid #1e293b;font-size:.68rem;color:#64748b;font-family:'SF Mono','Fira Code',monospace;margin-bottom:.5rem}

  /* Step indicator pill */
  .step-indicator{display:flex;align-items:center;gap:.4rem;justify-content:center;margin-bottom:.15rem}
  .step-dot{width:6px;height:6px;border-radius:50%;background:#253044;transition:all .3s}
  .step-dot.active{background:#3b82f6;box-shadow:0 0 6px rgba(59,130,246,.4)}
  .step-dot.done{background:#2563eb}

  /* Breadcrumb summary */
  .breadcrumb-summary{background:rgba(15,23,42,.6);border:1px solid #1e293b;border-radius:.5rem;padding:.5rem .75rem;margin-bottom:.25rem;font-size:.7rem;color:#64748b;line-height:1.6;display:flex;flex-wrap:wrap;gap:.1rem .5rem;align-items:center}
  .breadcrumb-summary .bc-item{display:inline-flex;align-items:center;gap:.2rem}
  .breadcrumb-summary .bc-sep{color:#334155}

  .breadcrumb-summary .bc-val.bc-warning{color:#fcd34d}

  /* NT badge for verbal GCS */
  .nt-badge{font-size:.55rem;background:rgba(55,65,81,.6);color:#d1d5db;padding:.1rem .3rem;border-radius:3px;margin-left:.2rem;vertical-align:middle;font-weight:700}

  /* Toast notification */
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:.75rem;padding:.65rem 1.25rem;font-size:.82rem;font-weight:600;z-index:200;transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s;opacity:0;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media(max-width:500px){
    .container{padding:.75rem}.card{padding:1.1rem .9rem}

    .back-link{left:.75rem;font-size:.7rem;padding:.3rem .4rem}
    .timer{right:.75rem;font-size:.6rem}
    .nav-btn{padding:.7rem;font-size:.8rem}
    .summary-row{flex-wrap:wrap;gap:.2rem}
    .summary-row .value{max-width:100%;font-size:.78rem}
    .breadcrumb-summary{font-size:.62rem;padding:.4rem .6rem}
  }

  @media(max-width:360px){
    .score-row .score-opt{min-width:calc(50% - .2rem);font-size:.55rem;padding:.45rem .2rem}
    .gcs-display{flex-wrap:wrap;gap:.5rem}
    .gcs-divider{display:none}
    header h1{font-size:1rem}
    .card{padding:.9rem .75rem}
    .toxidrome-card .tox-signs{font-size:.58rem}

  }
</style>
</head>
<body>
<header>
  <a href="../rebaixamento-nivel-consciencia.html" class="back-link">&#8592; Voltar</a>
  <h1>Rebaixamento do Nível de Consciência</h1>
  <p>AVPU &bull; Glasgow &bull; AEIOU-TIPS &bull; Estratificação</p>
  <span class="timer" id="evalTimer">00:00</span>
</header>
<div class="container" id="app"></div>
<div class="toast" id="toast"></div>
<script>
// =============================================
// CONSTANTS
// =============================================
const STEP_LABELS=['Glicemia','AVPU/GCS','Via Aérea','Cronologia','AEIOU-TIPS','Exame','Sinais Vitais','Toxídromes','Resultado'];
const TOTAL_STEPS=STEP_LABELS.length;

const GCS_EYE=[
  {v:1,l:'Nenhuma',desc:'Sem abertura ocular'},
  {v:2,l:'À dor',desc:'Abertura a estímulo doloroso'},
  {v:3,l:'À voz',desc:'Abertura ao comando verbal'},
  {v:4,l:'Espontânea',desc:'Abertura espontânea'}
];
const GCS_VERBAL=[
  {v:1,l:'Nenhuma',desc:'Sem resposta verbal'},
  {v:2,l:'Sons',desc:'Sons incompreensíveis'},
  {v:3,l:'Palavras',desc:'Palavras inapropriadas'},
  {v:4,l:'Confuso',desc:'Conversa confusa'},
  {v:5,l:'Orientado',desc:'Orientado e conversa'}
];
const GCS_MOTOR=[
  {v:1,l:'Nenhuma',desc:'Sem resposta motora'},
  {v:2,l:'Extensão',desc:'Extensão anormal (descerebração)'},
  {v:3,l:'Flexão',desc:'Flexão anormal (decorticação)'},
  {v:4,l:'Retirada',desc:'Retirada à dor'},
  {v:5,l:'Localiza',desc:'Localiza estímulo doloroso'},
  {v:6,l:'Obedece',desc:'Obedece comandos'}
];

const AEIOU_TIPS=[
  {id:'alcohol',letter:'A',name:'Álcool / Drogas de abuso',icon:'🍺',desc:'Etanol, metanol, etilenoglicol, drogas recreativas'},
  {id:'epilepsy',letter:'E',name:'Epilepsia (pós-ictal)',icon:'⚡',desc:'Status epilepticus, pós-ictal, epilepsia conhecida'},
  {id:'insulin',letter:'I',name:'Insulina (hipo/hiperglicemia)',icon:'💉',desc:'Hipoglicemia, CAD, EHH, uso de insulina/hipoglicemiantes'},
  {id:'opiates',letter:'O',name:'Opióides / Overdose',icon:'💊',desc:'Opióides, benzodiazepínicos, barbitúricos, outros sedativos'},
  {id:'uremia',letter:'U',name:'Uremia (insuf. renal/hepática)',icon:'🫀',desc:'Encefalopatia urêmica, hepática, distúrbios eletrolíticos graves'},
  {id:'trauma',letter:'T',name:'Trauma',icon:'🤕',desc:'TCE, hematoma epidural/subdural, contusão cerebral'},
  {id:'infection',letter:'I',name:'Infecção (SNC)',icon:'🦠',desc:'Meningite, encefalite, abscesso cerebral, sepse com encefalopatia'},
  {id:'psychiatric',letter:'P',name:'Psiquiátrico',icon:'🧠',desc:'Catatonia, conversão (diagnóstico de EXCLUSÃO)'},
  {id:'stroke',letter:'S',name:'Stroke / HSA',icon:'🎯',desc:'AVC isquêmico, hemorrágico, HSA, trombose venosa cerebral'}
];

const TOXIDROMES=[
  {id:'cholinergic',name:'Colinérgico',icon:'💧',signs:'Miose, sialorreia, broncorreia, bradicardia, diarreia, sudorese',cause:'Organofosforados, carbamatos, fisostigmina',antidote:'Atropina 1-2mg IV (repetir até controle de secreções) + Pralidoxima se organofosforado'},
  {id:'anticholinergic',name:'Anticolinérgico',icon:'🌡️',signs:'Midríase, pele seca/quente, retenção urinária, taquicardia, agitação, íleo',cause:'Atropina, anti-histamínicos, tricíclicos, Datura',antidote:'Fisostigmina 0,5-2mg IV lento (se grave; CI: arritmia, BAV)'},
  {id:'sympathomimetic',name:'Simpatomimético',icon:'⬆️',signs:'Midríase, taquicardia, HAS, hipertermia, agitação, diaforese',cause:'Cocaína, anfetaminas, descongestionantes, ecstasy',antidote:'Benzodiazepínicos (Diazepam 5-10mg IV), resfriamento ativo se hipertermia'},
  {id:'opioid',name:'Opióide',icon:'😴',signs:'Miose puntiforme, bradipneia/apneia, hipotensão, hipotermia',cause:'Morfina, heroína, fentanil, tramadol, codeína',antidote:'Naloxona 0,04-0,4mg IV (titular até FR normal). Repetir a cada 2-3min se necessário'},
  {id:'sedative',name:'Sedativo-hipnótico',icon:'💤',signs:'Pupilas normais/miose, bradipneia, hipotensão, hipotermia, hipotonia',cause:'Benzodiazepínicos, barbitúricos, etanol, GHB',antidote:'Flumazenil 0,2mg IV (se BZD confirmado; CI: epilepsia, uso crônico de BZD, coingestão de TCA)'},
  {id:'serotonergic',name:'Serotoninérgico',icon:'🔥',signs:'Clônus, hiperreflexia, hipertermia, agitação, tremor, diaforese, midríase',cause:'ISRS, IMAO, tramadol, linezolida, triptanos',antidote:'Ciproeptadina 4-8mg VO, BZD para agitação, resfriamento ativo'}
];

// =============================================
// STATE
// =============================================
let step=0;
let evalStartTime=new Date();
let evalEndTime=null;
let timerInterval=null;

// Step 0: Glucose
let glucose={checked:false, value:null};

// Step 1: AVPU + GCS
let avpu=null;
let gcs={eye:null, verbal:null, motor:null};
let verbalNT=false; // true if verbal is "not testable" (intubated)

// Step 2: Airway
let airway={needs_intubation:null, secured:null};

// Step 3: Onset
let onset={timeline:null, mode:null, witnessed:null};

// Step 4: AEIOU-TIPS
let causes=new Set();

// Step 5: Focused exam
let exam={
  pupil_size:null,
  pupil_reactivity:null,
  eye_movements:null,
  motor_pattern:null,
  meningeal:null,
  focal_deficit:null,
  fundoscopy:null,
  babinski:null
};

// Step 6: Vital signs
let vitals={
  bp:null,
  hr:null,
  rr:null,
  temp:null,
  spo2:null
};

// Step 7: Toxidromes
let selectedToxidrome=null;

// Collapsible sections on result
let sections={gcs:true, airway:true, causes:true, exam:false, vitals:false, toxidrome:false, stratification:true, workup:true, conduta:true, note:true};

const app=document.getElementById('app');

// =============================================
// TOAST
// =============================================
function showToast(msg,duration){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(el._tid);
  el._tid=setTimeout(()=>el.classList.remove('show'),duration||2000);
}

// =============================================
// TIMER
// =============================================
function updateTimer(){
  const el=document.getElementById('evalTimer');
  if(!el) return;
  const now=evalEndTime||new Date();
  const diff=Math.floor((now-evalStartTime)/1000);
  const m=Math.floor(diff/60);
  const s=diff%60;
  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(evalEndTime) el.classList.add('stopped');
  else el.classList.remove('stopped');
}
timerInterval=setInterval(updateTimer,1000);

function stopTimer(){
  if(!evalEndTime){
    evalEndTime=new Date();
    clearInterval(timerInterval);
    updateTimer();
  }
}

// =============================================
// HELPERS
// =============================================
function gcsTotal(){
  if(gcs.eye===null||gcs.verbal===null||gcs.motor===null) return null;
  return gcs.eye+gcs.verbal+gcs.motor;
}
function gcsClass(t){
  if(t===null) return '';
  if(t<=8) return 'critical';
  if(t<=12) return 'warning';
  if(t<=14) return 'moderate';
  return 'good';
}
function gcsLabel(t){
  if(t===null) return '';
  if(t<=8) return 'Grave';
  if(t<=12) return 'Moderado';
  if(t<=14) return 'Leve';
  return 'Normal';
}

// GCS-P (Pupil Reactivity Score) per 2018 update
function pupilReactivityScore(){
  // Both unreactive = subtract 2, one unreactive = subtract 1, both reactive = subtract 0
  if(exam.pupil_reactivity==='fixed'){
    // Bilateral fixed (mydriatic or not specified) = -2
    // Anisocoric + fixed = could be unilateral, -1 is more conservative
    if(exam.pupil_size==='anisocoric') return 1;
    return 2;
  }
  if(exam.pupil_reactivity==='sluggish'){
    // Sluggish bilateral = -1, anisocoric+sluggish = -1
    return 1;
  }
  return 0;
}
function gcsPTotal(){
  const t=gcsTotal();
  if(t===null) return null;
  return t-pupilReactivityScore();
}

function isStructural(){
  return causes.has('trauma')||causes.has('stroke');
}
function isMetabolicToxic(){
  return causes.has('alcohol')||causes.has('insulin')||causes.has('opiates')||causes.has('uremia');
}
function isInfectious(){
  return causes.has('infection');
}
function isSeizure(){
  return causes.has('epilepsy');
}

// Compute Cushing triad (no render side-effects)
function hasCushingTriad(){
  return vitals.bp==='severe_htn'&&vitals.hr==='brady'&&(vitals.rr==='irregular'||vitals.rr==='brady');
}

// Herniation detection
function herniationSigns(){
  const signs=[];
  if(exam.pupil_size==='anisocoric'&&(exam.pupil_reactivity==='fixed'||exam.pupil_reactivity==='sluggish')) signs.push('Anisocoria com pupila pouco/não reativa');
  if(exam.motor_pattern==='decerebrate') signs.push('Postura de descerebração');
  if(exam.motor_pattern==='asymmetric') signs.push('Assimetria motora');
  if(hasCushingTriad()) signs.push('Tríade de Cushing');
  if(exam.pupil_size==='mydriatic'&&exam.pupil_reactivity==='fixed') signs.push('Midríase bilateral fixa');
  const t=gcsTotal();
  if(t!==null&&t<=5) signs.push('GCS \u2264 5');
  if(exam.eye_movements==='dolls_absent') signs.push('Reflexo oculocefálico ausente');
  if(exam.babinski==='bilateral') signs.push('Babinski bilateral');
  return signs;
}

function riskLevel(){
  const t=gcsTotal();
  const cushTriad=hasCushingTriad();
  // Critical
  if(t!==null&&t<=8) return 'critical';
  if(airway.needs_intubation) return 'critical';
  if(cushTriad) return 'critical';
  if(glucose.value==='low') return 'critical';
  if(exam.pupil_reactivity==='fixed'&&exam.pupil_size==='mydriatic') return 'critical';
  if(exam.motor_pattern==='decerebrate') return 'critical';
  if(exam.motor_pattern==='flaccid') return 'critical';
  if(herniationSigns().length>=2) return 'critical';
  if(vitals.spo2==='low'&&vitals.rr==='brady') return 'critical';
  // High
  if(t!==null&&t<=12) return 'high';
  if(isStructural()) return 'high';
  if(exam.motor_pattern==='decorticate') return 'high';
  if(exam.focal_deficit&&exam.focal_deficit!=='none') return 'high';
  if(onset.mode==='sudden') return 'high';
  if(exam.pupil_size==='anisocoric') return 'high';
  if(exam.meningeal&&exam.meningeal!=='none'&&(vitals.temp==='fever'||vitals.temp==='hyperthermia')) return 'high';
  if(vitals.temp==='hyperthermia'&&selectedToxidrome==='serotonergic') return 'high';
  if(glucose.value==='critical_high') return 'high';
  if(vitals.temp==='hyperthermia'&&causes.has('epilepsy')) return 'high';
  if(exam.babinski==='bilateral'&&isStructural()) return 'high';
  // Moderate
  if(t!==null&&t<=14) return 'moderate';
  if(isMetabolicToxic()) return 'moderate';
  if(isInfectious()) return 'moderate';
  if(isSeizure()) return 'moderate';
  if(selectedToxidrome!==null) return 'moderate';
  return 'low';
}

function riskInfo(){
  const r=riskLevel();
  if(r==='critical') return {badge:'badge-critical',label:'CRIT',title:'Risco Crítico',desc:'Intervenção imediata necessária. Proteger via aérea, estabilizar hemodinâmica e investigar causa urgentemente.',color:'#fca5a5'};
  if(r==='high') return {badge:'badge-high',label:'ALTO',title:'Alto Risco',desc:'Investigação urgente. Provável causa estrutural ou condição ameaçadora de vida.',color:'#fcd34d'};
  if(r==='moderate') return {badge:'badge-moderate',label:'MOD',title:'Risco Moderado',desc:'Avaliar causas reversíveis. Monitoramento contínuo indicado.',color:'#93c5fd'};
  return {badge:'badge-low',label:'BAIXO',title:'Risco Baixo',desc:'Alteração leve de consciência. Investigar causas metabólicas e tóxicas.',color:'#86efac'};
}

// =============================================
// BREADCRUMB SUMMARY
// =============================================
function breadcrumbHTML(){
  if(step<1) return '';
  let items=[];
  // Glucose
  if(glucose.value!==null){
    const gMap={low:['Hipo','bc-critical'],normal:['Glic OK','bc-good'],high:['Hipergl','bc-warning'],critical_high:['Hipergl!','bc-critical']};
    const g=gMap[glucose.value]||['—',''];
    items.push(`<span class="bc-item">🩸 <span class="bc-val ${g[1]}">${g[0]}</span></span>`);
  }
  // AVPU/GCS
  if(step>=2&&avpu!==null){
    const t=gcsTotal();
    const cls=t!==null&&t<=8?'bc-critical':t!==null&&t<=12?'bc-warning':'bc-good';
    let label=`AVPU:${avpu}`;
    if(t!==null) label+=` GCS:${t}`;
    if(verbalNT) label+='t';
    items.push(`<span class="bc-item"><span class="bc-val ${cls}">${label}</span></span>`);
  }
  // Airway
  if(step>=3&&airway.needs_intubation!==null){
    if(airway.needs_intubation) items.push(`<span class="bc-item"><span class="bc-val bc-critical">IOT${airway.secured?' \u2713':' ?'}</span></span>`);
    else items.push(`<span class="bc-item"><span class="bc-val bc-good">VA ok</span></span>`);
  }
  // Onset
  if(step>=4&&onset.timeline){
    const m={acute:'Agudo',subacute:'Subag',chronic:'Crônico'};
    items.push(`<span class="bc-item"><span class="bc-val">${m[onset.timeline]||''}</span></span>`);
  }
  // Causes count
  if(step>=5&&causes.size>0){
    items.push(`<span class="bc-item"><span class="bc-val">${causes.size} causa${causes.size>1?'s':''}</span></span>`);
  }

  if(items.length===0) return '';
  return `<div class="breadcrumb-summary">${items.join('<span class="bc-sep">|</span>')}</div>`;
}

// =============================================
// PROGRESS BAR
// =============================================
function progHTML(idx,allDone){
  const currentLabel=allDone?'Concluído':STEP_LABELS[idx];
  const counterText=allDone?`${TOTAL_STEPS}/${TOTAL_STEPS}`:`${idx+1}/${TOTAL_STEPS}`;
  let h='<div class="progress-wrapper">';
  h+='<div class="progress-bar">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const isDone=allDone||i<idx;
    const isActive=!allDone&&i===idx;
    const c=isDone?'done':isActive?'active':'';
    const clickable=isDone?'clickable':'';
    const lbl=STEP_LABELS[i]||'';
    h+=`<div class="progress-step ${c} ${clickable}" data-label="${lbl}" ${isDone?`onclick="jumpToStep(${i})"`:''} role="progressbar" aria-label="${lbl}"></div>`;
  }
  h+='</div>';
  h+=`<div class="progress-info"><span class="progress-label">${currentLabel}</span><span class="progress-counter">${counterText}</span></div>`;
  h+='</div>';
  h+=breadcrumbHTML();
  h+='<div class="flow-connector"><div class="arrow"></div></div>';
  return h;
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  switch(step){
    case 0: renderGlucose(); break;
    case 1: renderGCS(); break;
    case 2: renderAirway(); break;
    case 3: renderOnset(); break;
    case 4: renderCauses(); break;
    case 5: renderExam(); break;
    case 6: renderVitals(); break;
    case 7: renderToxidromes(); break;
    default: stopTimer(); renderResult(); break;
  }
  updateTimer();
}

// =============================================
// STEP 0: GLUCOSE CHECK
// =============================================
function renderGlucose(){
  let h=progHTML(0,false);
  h+='<div class="card">';
  h+='<h2>🩸 Glicemia Capilar</h2>';
  h+=`<p class="subtitle">Etapa 1 de ${TOTAL_STEPS} — Primeiro passo obrigatório</p>`;

  h+='<div class="glucose-highlight">';
  h+='<div class="glucose-icon">🩸</div>';
  h+='<div class="glucose-title">Verificar glicemia IMEDIATAMENTE</div>';
  h+='<div class="glucose-desc">Hipoglicemia é a causa reversível mais comum e mais facilmente tratável de rebaixamento de consciência. Nunca pular esta etapa.</div>';
  h+='</div>';

  h+='<div class="options" style="margin-top:1rem">';
  h+='<div class="option-group-label">Resultado da glicemia capilar</div>';

  const opts=[
    {v:'low',icon:'⚠️',label:'Hipoglicemia (&lt; 70 mg/dL)',tag:'tag-critical',tagText:'Urgente'},
    {v:'normal',icon:'✅',label:'Normal (70–180 mg/dL)',tag:'tag-normal',tagText:'Normal'},
    {v:'high',icon:'📈',label:'Hiperglicemia (180–400 mg/dL)',tag:'tag-warning',tagText:'Elevada'},
    {v:'critical_high',icon:'📈',label:'Hiperglicemia grave (&gt; 400 mg/dL)',tag:'tag-critical',tagText:'Crítica'}
  ];

  for(const o of opts){
    h+=`<button class="option-btn ${glucose.value===o.v?'selected':''}" onclick="setGlucose('${o.v}')">`;
    h+=`<span class="icon">${o.icon}</span><span class="label">${o.label}</span>`;
    h+=`<span class="tag ${o.tag}">${o.tagText}</span></button>`;
  }
  h+='</div>';

  if(glucose.value==='low'){
    h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>HIPOGLICEMIA — Tratar imediatamente!</strong>';
    h+='Glicose 50% 50 mL IV em bolus (ou Glucagon 1 mg IM se sem acesso venoso).<br>';
    h+='Reavaliar glicemia em 15 min e nível de consciência após correção.<br>';
    h+='<span style="font-size:.75rem;opacity:.8">Se uso de sulfonilureia: risco de hipoglicemia recorrente — manter infusão de SG 10% e monitorizar por pelo menos 24h.</span>';
    h+='</div></div>';
    h+='<div class="thiamine-box"><span style="font-size:1.1rem;flex-shrink:0">💊</span><div><strong style="display:block;margin-bottom:.15rem;color:#fcd34d">Tiamina (Vitamina B1) antes da glicose em etilistas</strong>Se suspeita de etilismo crônico ou desnutrição: administrar <strong>Tiamina 200-500 mg IV</strong> antes (ou junto) da glicose para prevenir encefalopatia de Wernicke.<br><span style="font-size:.75rem;opacity:.8">Tríade de Wernicke: confusão mental + ataxia + oftalmoplegia (nem sempre completa).</span></div></div>';
  }
  if(glucose.value==='critical_high'){
    h+='<div class="alert-box alert-warning"><span class="alert-icon">⚠️</span><div class="alert-text"><strong>Hiperglicemia grave — Investigar CAD/EHH</strong>';
    h+='Solicitar gasometria arterial, cetonas séricas/urinárias, eletrólitos (Na, K), osmolaridade sérica.<br>';
    h+='Iniciar hidratação com SF 0,9% 15-20 mL/kg na 1ª hora.<br>';
    h+='<span style="font-size:.75rem;opacity:.8">CAD: pH &lt; 7,3 + cetose + glicemia &gt; 200. EHH: osmolaridade &gt; 320 + sem cetose significativa + glicemia frequentemente &gt; 600.</span>';
    h+='</div></div>';
  }
  if(glucose.value==='high'){
    h+='<div class="alert-box alert-info"><span class="alert-icon">💡</span><div class="alert-text"><strong>Hiperglicemia moderada</strong>';
    h+='Pode ser reacional (estresse). Monitorizar e investigar causa do rebaixamento — hiperglicemia nesta faixa raramente causa RNC isoladamente.';
    h+='</div></div>';
  }

  h+='<div class="nav-row">';
  h+=`<button class="nav-btn primary" ${glucose.value===null?'disabled':''} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================

function renderGCS(){
  let h=progHTML(1,false);
  h+='<div class="card">';
  h+='<h2>Nível de Consciência — AVPU e Glasgow</h2>';
  h+=`<p class="subtitle">Etapa 2 de ${TOTAL_STEPS}</p>`;

  // AVPU
  h+='<div class="options">';
  h+='<div class="option-group-label">Escala AVPU (avaliação rápida)</div>';
  const avpuOpts=[
    {v:'A',icon:'🗣️',label:'Alert — Alerta e orientado',tag:'tag-normal',tagText:'Alerta'},
    {v:'V',icon:'👂',label:'Voice — Responde a estímulo verbal',tag:'tag-info',tagText:'Verbal'},
    {v:'P',icon:'🥊',label:'Pain — Responde a estímulo doloroso',tag:'tag-warning',tagText:'Dor'},
    {v:'U',icon:'❌',label:'Unresponsive — Sem resposta',tag:'tag-critical',tagText:'Arresponsivo'}
  ];
  for(const o of avpuOpts){
    h+=`<button class="option-btn ${avpu===o.v?'selected':''}" onclick="setAVPU('${o.v}')">`;
    h+=`<span class="icon">${o.icon}</span><span class="label">${o.label}</span>`;
    h+=`<span class="tag ${o.tag}">${o.tagText}</span></button>`;
  }
  h+='</div>';

  // GCS
  h+='<div class="section-divider"></div>';
  h+='<div class="option-group-label" style="margin-bottom:.65rem">Escala de Coma de Glasgow (GCS)</div>';

  // Eye
  h+='<div style="margin-bottom:.85rem">';
  h+='<div style="font-size:.82rem;color:#cbd5e1;margin-bottom:.4rem;font-weight:600">Abertura Ocular (O)</div>';
  h+='<div class="score-row">';
  for(const o of GCS_EYE){
    h+=`<button class="score-opt ${gcs.eye===o.v?'picked':''}" onclick="setGCS('eye',${o.v})" title="${o.desc}">${o.l}<span class="pts">${o.v}</span></button>`;
  }
  h+='</div></div>';

  // Verbal
  h+='<div style="margin-bottom:.85rem">';
  h+='<div style="font-size:.82rem;color:#cbd5e1;margin-bottom:.4rem;font-weight:600">Resposta Verbal (V)</div>';
  h+='<div class="score-row">';
  for(const o of GCS_VERBAL){
    h+=`<button class="score-opt ${gcs.verbal===o.v&&!verbalNT?'picked':''}" onclick="setGCSVerbal(${o.v})" title="${o.desc}">${o.l}<span class="pts">${o.v}</span></button>`;
  }
  // NT button for intubated patients
  h+=`<button class="score-opt ${verbalNT?'picked':''}" onclick="setVerbalNT()" title="Não testável (paciente intubado)" style="background:${verbalNT?'linear-gradient(135deg,#172554,#1e3a5f)':'#0c1322'};border-color:${verbalNT?'#3b82f6':'#253044'};color:${verbalNT?'#f1f5f9':'#64748b'}">NT<span class="pts">1t</span></button>`;
  h+='</div>';
  h+='<div style="font-size:.65rem;color:#4b5e7a;margin-top:.3rem;font-style:italic">NT = Não Testável (registrar V1t se paciente intubado/traqueostomizado)</div>';
  h+='</div>';

  // Motor
  h+='<div style="margin-bottom:.85rem">';
  h+='<div style="font-size:.82rem;color:#cbd5e1;margin-bottom:.4rem;font-weight:600">Resposta Motora (M) — melhor preditor prognóstico</div>';
  h+='<div class="score-row">';
  for(const o of GCS_MOTOR){
    h+=`<button class="score-opt ${gcs.motor===o.v?'picked':''}" onclick="setGCS('motor',${o.v})" title="${o.desc}">${o.l}<span class="pts">${o.v}</span></button>`;
  }
  h+='</div>';

  // GCS Display
  const t=gcsTotal();
  if(t!==null){
    const cls=gcsClass(t);
    h+='<div class="gcs-display">';
    h+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.eye}</div><div class="gcs-component-label">Ocular</div></div>`;
    h+='<div class="gcs-divider"></div>';
    h+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.verbal}${verbalNT?'<span class="nt-badge">NT</span>':''}</div><div class="gcs-component-label">Verbal</div></div>`;
    h+='<div class="gcs-divider"></div>';
    h+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.motor}</div><div class="gcs-component-label">Motora</div></div>`;
    h+='<div class="gcs-divider"></div>';
    h+=`<div class="gcs-total ${cls}"><div class="gcs-total-value">${t}${verbalNT?'<span class="nt-badge">t</span>':''}</div><div class="gcs-total-label">GCS — ${gcsLabel(t)}</div></div>`;
    h+='</div>';

    if(verbalNT){
      h+='<div class="gcs-p-note">Resposta verbal registrada como <strong>NT (não testável)</strong>. O GCS total é calculado como O+1t+M = '+t+'t. A resposta motora isolada (M'+gcs.motor+') é o melhor preditor prognóstico neste cenário.</div>';
    }

    // GCS-P awareness note
    h+='<div class="gcs-p-note">GCS-P (pupilar): a reatividade pupilar será avaliada na etapa de exame neurológico e incorporada à estratificação final. O score pupilar (0 a -2) será subtraído do GCS total.</div>';

    if(t<=8){
      h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>GCS \u2264 8 — Proteger via aérea!</strong>';
      h+='Indicação de intubação orotraqueal. Avaliar reflexos protetores (tosse, deglutição).<br>';
      h+='<span style="font-size:.75rem;opacity:.8">Componente motor (M) é o melhor preditor prognóstico isolado da GCS.</span>';
      h+='</div></div>';
    } else if(t<=12){
      h+='<div class="alert-box alert-warning"><span class="alert-icon">⚠️</span><div class="alert-text"><strong>Rebaixamento moderado (GCS '+t+')</strong>';
      h+='Monitoramento contínuo do nível de consciência. Risco de deterioração — reavaliar a cada 30-60 min.</div></div>';
    }
  }
  h+='</div>';

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  const canNext=avpu!==null&&gcs.eye!==null&&gcs.verbal!==null&&gcs.motor!==null;
  h+=`<button class="nav-btn primary" ${canNext?'':'disabled'} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

// STEP 2: AIRWAY
// =============================================
function renderAirway(){
  let h=progHTML(2,false);
  h+='<div class="card">';
  h+='<h2>Avaliação de Via Aérea</h2>';
  h+=`<p class="subtitle">Etapa 3 de ${TOTAL_STEPS}</p>`;

  const t=gcsTotal();
  if(t!==null&&t<=8){
    h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>GCS = '+t+' (\u2264 8) — Via aérea desprotegida</strong>Paciente sem capacidade de proteger via aérea. Intubação orotraqueal indicada.</div></div>';

  h+='<div class="options">';
  h+='<div class="option-group-label">Paciente necessita de intubação?</div>';
  h+=`<button class="option-btn ${airway.needs_intubation===true?'selected':''}" onclick="setAirway('needs',true)"><span class="icon">✅</span><span class="label">Sim — IOT indicada / realizada</span><span class="tag tag-critical">Crítico</span></button>`;
  h+=`<button class="option-btn ${airway.needs_intubation===false?'selected':''}" onclick="setAirway('needs',false)"><span class="icon">❌</span><span class="label">Não — Via aérea pérvia com reflexos protetores</span><span class="tag tag-normal">Estável</span></button>`;

    h+='<div class="option-group-label" style="margin-top:.75rem">Via aérea assegurada?</div>';
    h+=`<button class="option-btn ${airway.secured===true?'selected':''}" onclick="setAirway('secured',true)"><span class="icon">✅</span><span class="label">Sim — Intubado / via aérea definitiva</span></button>`;
    h+=`<button class="option-btn ${airway.secured===false?'selected':''}" onclick="setAirway('secured',false)"><span class="icon">⏳</span><span class="label">Ainda não — Aguardando procedimento</span></button>`;

    h+='<div class="intubation-tip"><strong>Checklist pré-IOT em rebaixamento:</strong>';
    h+='&#8226; Pré-oxigenação com O\u2082 100% por 3-5 min (ou apneica se tempo limitado)<br>';
    h+='&#8226; Sequência rápida: Fentanil 2\u03BCg/kg + Lidocaína 1,5mg/kg \u2192 Etomidato 0,3mg/kg (ou Propofol/Ketamina) + Succinilcolina 1-1,5mg/kg (ou Rocurônio 1,2mg/kg)<br>';
    h+='&#8226; Evitar hipotensão e hipoxemia durante o procedimento<br>';
    h+='&#8226; Se suspeita de HIC: manter PAS &gt; 90mmHg, evitar hipoventilação pós-IOT<br>';
    h+='&#8226; Cuidado cervical se trauma (estabilização manual em linha)<br>';
    h+='&#8226; Confirmar posição: capnografia (padrão-ouro) + ausculta + RX tórax</div>';
  }

  if(airway.needs_intubation===false&&t!==null&&t<=10){
    h+='<div class="alert-box alert-info"><span class="alert-icon">💡</span><div class="alert-text"><strong>Atenção: reavaliação contínua</strong>';
    h+='Mesmo com reflexos protetores presentes, paciente com GCS '+t+' pode deteriorar. Manter material de IOT preparado e reavaliar frequentemente.</div></div>';
  }

  h+='</div>';

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  const canNext=airway.needs_intubation!==null;
  h+=`<button class="nav-btn primary" ${canNext?'':'disabled'} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP 3: ONSET / TIMELINE
// =============================================
function renderOnset(){
  let h=progHTML(3,false);
  h+='<div class="card">';
  h+='<h2>Cronologia e Instalação</h2>';
  h+=`<p class="subtitle">Etapa 4 de ${TOTAL_STEPS}</p>`;

  h+='<div class="options">';
  h+='<div class="option-group-label">Tempo de instalação</div>';
  const timeOpts=[
    {v:'acute',icon:'⚡',label:'Agudo (minutos a horas)',tag:'tag-critical',tagText:'Agudo',desc:'Sugere causa vascular (AVC/HSA), metabólica aguda ou intoxicação'},
    {v:'subacute',icon:'⏱️',label:'Subagudo (dias)',tag:'tag-warning',tagText:'Subagudo',desc:'Sugere infecção, distúrbio metabólico progressivo ou lesão expansiva'},
    {v:'chronic',icon:'📅',label:'Crônico (semanas a meses)',tag:'tag-info',tagText:'Crônico',desc:'Sugere lesão expansiva (tumor), hidrocefalia ou causa degenerativa'}
  ];
  for(const o of timeOpts){
    h+=`<button class="option-btn ${onset.timeline===o.v?'selected':''}" onclick="setOnset('timeline','${o.v}')">`;
    h+=`<span class="icon">${o.icon}</span><span class="label">${o.label}<br><span style="font-size:.72rem;color:#64748b">${o.desc}</span></span>`;
    h+=`<span class="tag ${o.tag}">${o.tagText}</span></button>`;
  }

  h+='<div class="option-group-label" style="margin-top:.75rem">Modo de instalação</div>';
  const modeOpts=[
    {v:'sudden',icon:'💥',label:'Súbito (ictus)',desc:'Instalação abrupta — sugere evento vascular (AVC, HSA, dissecção)'},
    {v:'progressive',icon:'📉',label:'Progressivo (gradual)',desc:'Deterioração gradual — sugere causa metabólica, tóxica ou expansiva'},
    {v:'fluctuating',icon:'📊',label:'Flutuante',desc:'Oscila entre níveis — sugere encefalopatia metabólica, status não convulsivo ou delirium'}
  ];
  for(const o of modeOpts){
    h+=`<button class="option-btn ${onset.mode===o.v?'selected':''}" onclick="setOnset('mode','${o.v}')">`;
    h+=`<span class="icon">${o.icon}</span><span class="label">${o.label}<br><span style="font-size:.72rem;color:#64748b">${o.desc}</span></span></button>`;
  }

  h+='<div class="option-group-label" style="margin-top:.75rem">Evento testemunhado?</div>';
  const witOpts=[
    {v:'yes',icon:'👁️',label:'Sim — evento presenciado',desc:'Informação temporal confiável'},
    {v:'no',icon:'❓',label:'Não — encontrado rebaixado',desc:'Último momento visto bem = time zero (relevante para janela trombolítica)'},
    {v:'unknown',icon:'❔',label:'Indeterminado',desc:'Sem informação colateral disponível'}
  ];
  for(const o of witOpts){
    h+=`<button class="option-btn ${onset.witnessed===o.v?'selected':''}" onclick="setOnset('witnessed','${o.v}')">`;
    h+=`<span class="icon">${o.icon}</span><span class="label">${o.label}<br><span style="font-size:.72rem;color:#64748b">${o.desc}</span></span></button>`;
  }
  h+='</div>';

  if(onset.timeline==='acute'&&onset.mode==='sudden'){
    h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>Início agudo e súbito</strong>';
    h+='Alta suspeita de causa vascular (AVC/HSA). TC de crânio URGENTE.<br>';
    h+='<span style="font-size:.75rem;opacity:.8">Se \u2264 4,5h de evolução e AVC isquêmico: avaliar critérios para trombólise IV. Se \u2264 24h: avaliar trombectomia mecânica (grandes vasos).<br>';
    h+='Não esquecer AVC de circulação posterior: vertigem + ataxia + sinais de nervos cranianos + rebaixamento pode indicar oclusão de artéria basilar (alta mortalidade, trombectomia tem janela estendida).</span>';
    h+='</div></div>';
  }

  if(onset.mode==='fluctuating'){
    h+='<div class="alert-box alert-info"><span class="alert-icon">💡</span><div class="alert-text"><strong>Padrão flutuante</strong>';
    h+='Considerar: encefalopatia metabólica (hepática, urêmica), status epilepticus não convulsivo (solicitar EEG), delirium por medicação/abstinência, insuficiência adrenal aguda.</div></div>';
  }

  if(onset.witnessed==='no'&&onset.timeline==='acute'){
    h+='<div class="alert-box alert-warning"><span class="alert-icon">⏰</span><div class="alert-text"><strong>Evento não testemunhado + instalação aguda</strong>';
    h+='Determinar "último visto bem" com acompanhantes/familiares. Este horário define a janela terapêutica para trombólise e trombectomia.</div></div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  const canNext=onset.timeline!==null&&onset.mode!==null;
  h+=`<button class="nav-btn primary" ${canNext?'':'disabled'} onclick="next()">Próximo</button>`;
  h+='</div>';
  h+='<div class="skip-hint">Campo "testemunhado" é opcional mas recomendado</div>';
  h+='</div>';
  app.innerHTML=h;
}

// =============================================
// STEP 4: AEIOU-TIPS
// =============================================
function renderCauses(){
  let h=progHTML(4,false);
  h+='<div class="card">';
  h+='<h2>Causas Reversíveis — AEIOU-TIPS</h2>';
  h+=`<p class="subtitle">Etapa 5 de ${TOTAL_STEPS} — Marque todas as causas suspeitas</p>`;

  h+='<div class="alert-box alert-info"><span class="alert-icon">💡</span><div class="alert-text">Mnemônico <strong>AEIOU-TIPS</strong> para causas reversíveis de rebaixamento de consciência. Marque todas as suspeitas clínicas — mais de uma causa pode coexistir.</div></div>';

  h+='<div class="options">';
  for(const c of AEIOU_TIPS){
    const ck=causes.has(c.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleCause('${c.id}')">`;
    h+=`<span class="check-box">${ck?'\u2713':''}</span>`;
    h+=`<span class="icon" style="font-size:1rem">${c.icon}</span>`;
    h+=`<span class="label"><strong style="color:#e2e8f0">[${c.letter}] ${c.name}</strong><br><span style="font-size:.72rem;color:#64748b">${c.desc}</span></span>`;
    h+='</button>';
  }
  h+='</div>';

  if(causes.size>0){
    h+='<div style="margin-top:.5rem;padding:.5rem .75rem;background:rgba(30,41,59,.5);border-radius:.5rem;font-size:.75rem;color:#94a3b8">';
    h+=`<strong style="color:#cbd5e1">${causes.size} causa${causes.size>1?'s':''} selecionada${causes.size>1?'s':''}:</strong> `;
    const selected=[];
    for(const c of AEIOU_TIPS){if(causes.has(c.id)) selected.push(c.name);}
    h+=selected.join(', ');
    h+='</div>';
  }

  // Clinical pearl: psychiatric is exclusion diagnosis
  if(causes.has('psychiatric')&&causes.size===1){
    h+='<div class="alert-box alert-warning" style="margin-top:.5rem"><span class="alert-icon">⚠️</span><div class="alert-text"><strong>Atenção: causa psiquiátrica é diagnóstico de exclusão</strong>Antes de atribuir rebaixamento a causa psiquiátrica, todas as causas orgânicas devem ser investigadas e descartadas. Considerar catatonia se mutismo + imobilidade + waxy flexibility.</div></div>';
  }

  // Alcohol + insulin combined pearl
  if(causes.has('alcohol')&&causes.has('insulin')){
    h+='<div class="alert-box alert-info" style="margin-top:.5rem"><span class="alert-icon">💡</span><div class="alert-text"><strong>Álcool + alteração glicêmica</strong>Etilismo agudo pode mascarar hipoglicemia. Em etilistas crônicos, estoques hepáticos de glicogênio podem estar depletados — hipoglicemia prolongada e refratária.</div></div>';
  }

  // Trauma + Alcohol pearl
  if(causes.has('alcohol')&&causes.has('trauma')){
    h+='<div class="alert-box alert-warning" style="margin-top:.5rem"><span class="alert-icon">⚠️</span><div class="alert-text"><strong>Álcool + Trauma</strong>Nunca atribuir rebaixamento exclusivamente ao álcool em paciente com TCE. Etilistas têm risco aumentado de hematoma subdural crônico. TC de crânio é obrigatória.</div></div>';
  }

  // Multiple causes warning
  if(causes.size>=3){
    h+='<div class="alert-box alert-info" style="margin-top:.5rem"><span class="alert-icon">📋</span><div class="alert-text"><strong>Múltiplas causas suspeitas ('+causes.size+')</strong>Pacientes com RNC frequentemente têm mais de uma causa contribuindo. Investigar e tratar todas em paralelo. Priorizar causas tempo-dependentes (hipoglicemia, AVC, meningite, opióides).</div></div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Próximo</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

  }
  if(exam.pupil_size==='miotic'&&exam.pupil_reactivity==='reactive'){
    h+='<div class="alert-box alert-info" style="margin-top:.4rem"><span class="alert-icon">💊</span><div class="alert-text">Miose bilateral reativa: sugere causa metabólica/tóxica (opióides, organofosforados, clonidina) ou lesão pontina bilateral.</div></div>';

  }

  // GCS-P live indicator
  if(exam.pupil_reactivity){

    const t=gcsTotal();
    if(t!==null&&prs>0){
      h+=`<div class="gcs-p-display"><strong>GCS-P:</strong> GCS ${t} - ${prs} (pupilar) = <strong>${t-prs}</strong></div>`;
    }
  }

  // Eye movements
  h+='<div class="option-group-label" style="margin-top:.65rem">Movimentos oculares</div>';
  h+='<div class="score-row">';
  const eyeMov=[
    {v:'normal',l:'Normais'},
    {v:'dolls_absent',l:'Olhos de boneca (\u2212)'},
    {v:'deviated',l:'Desvio conjugado'},
    {v:'disconjugate',l:'Desconjugados'},

function renderToxidromes(){
  let h=progHTML(7,false);
  h+='<div class="card">';
  h+='<h2>Avaliação de Toxídromes</h2>';
  h+=`<p class="subtitle">Etapa 8 de ${TOTAL_STEPS} — Selecione se compatível (opcional)</p>`;

  h+='<div class="toxidrome-grid">';
  for(const t of TOXIDROMES){
    h+=`<div class="toxidrome-card ${selectedToxidrome===t.id?'selected':''}" onclick="setToxidrome('${t.id}')">`;
    h+=`<div class="tox-icon">${t.icon}</div>`;
    h+=`<div class="tox-name">${t.name}</div>`;
    h+=`<div class="tox-signs">${t.signs}</div>`;
    h+='</div>';
  }
  h+='</div>';

  if(selectedToxidrome){
    const tox=TOXIDROMES.find(t=>t.id===selectedToxidrome);
    h+=`<div class="alert-box alert-info" style="margin-top:.75rem"><span class="alert-icon">💊</span><div class="alert-text"><strong>Toxídrome ${tox.name}</strong>`;
    h+=`<br>Causas comuns: ${tox.cause}<br>`;
    h+=`<strong style="color:#bfdbfe;margin-top:.35rem;display:inline-block">Antídoto/Tratamento:</strong> ${tox.antidote}`;
    h+=`</div></div>`;

    // Cross-check toxidrome with exam findings
    if(selectedToxidrome==='opioid'&&exam.pupil_size&&exam.pupil_size!=='miotic'){
      h+='<div class="alert-box alert-warning" style="margin-top:.25rem"><span class="alert-icon">⚠️</span><div class="alert-text"><strong>Atenção:</strong> toxídrome opióide selecionado, mas pupilas não são mióticas. Considerar coingestão ou diagnóstico alternativo. Miose puntiforme é achado clássico mas pode estar ausente em coingestão com simpatomiméticos ou em midríase fixa por hipóxia.</div></div>';
    }
    if(selectedToxidrome==='anticholinergic'&&exam.pupil_size==='miotic'){
      h+='<div class="alert-box alert-warning" style="margin-top:.25rem"><span class="alert-icon">⚠️</span><div class="alert-text"><strong>Atenção:</strong> toxídrome anticolinérgico selecionado, mas pupilas são mióticas. Síndrome anticolinérgica tipicamente causa midríase. Reconsiderar diagnóstico.</div></div>';
    }
    if(selectedToxidrome==='cholinergic'&&exam.pupil_size==='mydriatic'){
      h+='<div class="alert-box alert-warning" style="margin-top:.25rem"><span class="alert-icon">⚠️</span><div class="alert-text"><strong>Atenção:</strong> toxídrome colinérgico selecionado, mas pupilas são midriáticas. Síndrome colinérgica tipicamente causa miose. Reconsiderar diagnóstico.</div></div>';
    }
  }

  h+=`<button class="option-btn" style="margin-top:.65rem;justify-content:center;text-align:center;color:#4b5e7a" onclick="clearToxidrome()"><span class="label" style="text-align:center">${selectedToxidrome?'Limpar seleção':'Nenhum toxídrome identificado — prosseguir'}</span></button>`;

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Ver Resultado</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

// COLLAPSIBLE
// =============================================
function collapsible(id,title,contentFn,forceOpen){
  const open=forceOpen||sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.65rem':'0'}">`;
  if(open) h+=contentFn();
  h+='</div></div>';
  return h;
}
