// RESULT PAGE
// =============================================
function renderResult(){
  const t=gcsTotal();
  const ri=riskInfo();
  const hs=herniationSigns();

  // Auto-open critical sections
  if(riskLevel()==='critical'){
    sections.exam=true;
    sections.vitals=true;
    sections.conduta=true;
  }
  if(selectedToxidrome) sections.toxidrome=true;

  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  // Eval duration badge
  if(evalEndTime){
    const dur=Math.floor((evalEndTime-evalStartTime)/1000);
    const durMin=Math.floor(dur/60);
    const durSec=dur%60;
    h+=`<div class="eval-duration">Avaliação em ${String(durMin).padStart(2,'0')}:${String(durSec).padStart(2,'0')}</div>`;
  }

  // Badge
  h+=`<div class="result-badge ${ri.badge}">${ri.label}</div>`;
  h+=`<div class="result-title" style="color:${ri.color}">${ri.title}</div>`;
  h+=`<div class="result-desc">${ri.desc}</div>`;

  // Summary line
  const avpuLabel={A:'Alerta',V:'Resposta verbal',P:'Resposta \u00e0 dor',U:'Arresponsivo'};
  const timelineLabel=onset.timeline==='acute'?'Agudo':onset.timeline==='subacute'?'Subagudo':onset.timeline==='chronic'?'Crônico':'—';
  const modeLabel=onset.mode==='sudden'?'Súbito':onset.mode==='fluctuating'?'Flutuante':onset.mode==='progressive'?'Progressivo':'—';

  h+=`<div style="font-size:.85rem;color:#94a3b8;margin-bottom:1rem;line-height:1.6">`;
  h+=`AVPU: <strong style="color:${ri.color}">${avpuLabel[avpu]||'—'}</strong> &nbsp;|&nbsp; GCS: <strong style="color:${ri.color}">${t!==null?t+'/15':'—'}</strong>`;
  if(t!==null){
    h+=` (O${gcs.eye}V${gcs.verbal}${verbalNT?'t':''}M${gcs.motor})`;
  }
  // Show GCS-P if pupil data available
  const prs=pupilReactivityScore();
  const gcsP=gcsPTotal();
  if(gcsP!==null&&prs>0) h+=` &nbsp;|&nbsp; GCS-P: <strong style="color:${ri.color}">${gcsP}</strong>`;
  h+=`<br>${timelineLabel} / ${modeLabel}`;
  if(onset.witnessed==='no') h+=' <span style="color:#fca5a5;font-size:.75rem">(não testemunhado)</span>';
  if(onset.witnessed==='unknown') h+=' <span style="color:#fcd34d;font-size:.75rem">(indeterminado)</span>';
  h+=`</div>`;

  // -- Herniation banner --
  if(hs.length>=2){
    h+='<div class="herniation-banner"><h4>\u26A0\uFE0F SINAIS DE HERNIAÇÃO</h4>';
    h+='<p>'+hs.join(' \u2022 ')+'<br>';
    h+='<strong>Medidas anti-herniação IMEDIATAS:</strong> Cabeceira 30°, Manitol 20% 1g/kg IV (ou NaCl 23,4% 30mL IV), hiperventilação leve transitória (PaCO\u2082 30-35), interconsulta neurocirurgia urgente.</p></div>';
  }

  // -- GCS Details --
  h+=collapsible('gcs','Glasgow e Nível de Consciência',()=>{
    let s='';
    const cls=gcsClass(t);
    s+='<div class="gcs-display">';
    s+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.eye}</div><div class="gcs-component-label">Ocular</div></div>`;
    s+='<div class="gcs-divider"></div>';
    s+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.verbal}${verbalNT?'<span class="nt-badge">NT</span>':''}</div><div class="gcs-component-label">Verbal</div></div>`;
    s+='<div class="gcs-divider"></div>';
    s+=`<div class="gcs-component"><div class="gcs-component-value">${gcs.motor}</div><div class="gcs-component-label">Motora</div></div>`;
    s+='<div class="gcs-divider"></div>';
    s+=`<div class="gcs-total ${cls}"><div class="gcs-total-value">${t}${verbalNT?'<span class="nt-badge">t</span>':''}</div><div class="gcs-total-label">GCS — ${gcsLabel(t)}</div></div>`;
    s+='</div>';
    if(prs>0){
      s+=`<div class="gcs-p-display"><strong>GCS-P (com reatividade pupilar):</strong> ${t} - ${prs} = <strong>${gcsP}</strong></div>`;
    }
    s+=`<div class="summary-row"><span class="criteria">AVPU</span><span class="value">${avpuLabel[avpu]||'—'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Glicemia</span><span class="value"><span class="dot ${glucose.value==='low'||glucose.value==='critical_high'?'dot-critical':glucose.value==='high'?'dot-warning':'dot-normal'}"></span> ${glucoseLabel()}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Via aérea</span><span class="value">${airway.needs_intubation?'IOT indicada'+(airway.secured?' (assegurada)':' (pendente)'):'Pérvia'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Cronologia</span><span class="value">${timelineLabel} / ${modeLabel}</span></div>`;
    if(onset.witnessed) s+=`<div class="summary-row"><span class="criteria">Testemunhado</span><span class="value">${onset.witnessed==='yes'?'Sim':onset.witnessed==='no'?'Não':'Indeterminado'}</span></div>`;
    return s;
  });

  // -- Airway Alert --
  if(airway.needs_intubation){
    h+='<div class="alert-box alert-critical"><span class="alert-icon">🚨</span><div class="alert-text"><strong>Via aérea: Intubação indicada</strong>'+(airway.secured?'Via aérea assegurada. Confirmar posição do TOT (capnografia + RX) e parâmetros ventilatórios.':'AGUARDANDO procedimento — prioridade máxima.')+'</div></div>';
  }

  // -- AEIOU-TIPS --
  h+=collapsible('causes','Causas Suspeitas (AEIOU-TIPS)',()=>{
    let s='';
    if(causes.size===0){
      s+='<p style="color:#4b5e7a;text-align:center;padding:.5rem 0;font-size:.82rem">Nenhuma causa selecionada.</p>';
    } else {
      for(const c of AEIOU_TIPS){
        if(causes.has(c.id)){
          s+=`<div class="summary-row"><span class="criteria">[${c.letter}] ${c.name}</span><span class="value">${c.icon}</span></div>`;
        }
      }
    }
    s+='<div style="margin-top:.65rem;padding-top:.65rem;border-top:1px solid rgba(30,41,59,.6)">';
    if(isStructural()&&isMetabolicToxic()){
      s+='<div style="font-size:.78rem;color:#fcd34d;font-weight:600">\u26A0\uFE0F Causas estruturais E metabólicas/tóxicas suspeitas — investigar ambas em paralelo</div>';
    } else if(isStructural()){
      s+='<div style="font-size:.78rem;color:#fca5a5;font-weight:600">🧠 Predomínio de causa ESTRUTURAL (AVC, hemorragia, massa)</div>';
    } else if(isMetabolicToxic()){
      s+='<div style="font-size:.78rem;color:#86efac;font-weight:600">🧪 Predomínio de causa METABÓLICA/TÓXICA (potencialmente reversível)</div>';
    } else if(isInfectious()){
      s+='<div style="font-size:.78rem;color:#fcd34d;font-weight:600">🦠 Causa INFECCIOSA suspeita — antibioticoterapia precoce</div>';
    } else if(isSeizure()){
      s+='<div style="font-size:.78rem;color:#67e8f9;font-weight:600">\u26A1 Possível etiologia EPILÉPTICA (pós-ictal / status)</div>';
    }
    s+='</div>';
    return s;
  });

  // -- Exam findings --
  h+=collapsible('exam','Exame Neurológico',()=>{
    let s='';
    const pupilSzLbl={miotic:'Mióticas',normal:'Normais',mydriatic:'Midriáticas',anisocoric:'Anisocóricas'};
    const pupilRxLbl={reactive:'Fotorreativas',sluggish:'Lentas',fixed:'Fixas'};
    const eyeLbl={normal:'Normais',dolls_absent:'Reflexo oculocefálico ausente',deviated:'Desvio conjugado',disconjugate:'Desconjugados',nystagmus:'Nistagmo'};
    const motorLbl={normal:'Normal/localiza',decorticate:'Decorticação',decerebrate:'Descerebração',flaccid:'Flacidez',asymmetric:'Assimétrico'};
    const meningLbl={none:'Ausentes',nuchal:'Rigidez de nuca',kernig_brudzinski:'Kernig/Brudzinski +'};
    const focalLbl={none:'Nenhum',hemiparesis:'Hemiparesia',cranial_nerve:'Par craniano',aphasia:'Afasia',other:'Outro déficit'};
    const babinskiLbl={flexor:'Flexor (normal)',extensor_unilateral:'Extensor unilateral',bilateral:'Extensor bilateral',not_done:'Não testado'};
    const fundoLbl={normal:'Normal',papilledema:'Papiledema',hemorrhage:'Hemorragia',not_done:'Não realizada'};

    if(exam.pupil_size) s+=`<div class="summary-row"><span class="criteria">Pupilas — Tamanho</span><span class="value"><span class="dot ${exam.pupil_size==='anisocoric'||exam.pupil_size==='mydriatic'?'dot-warning':'dot-normal'}"></span> ${pupilSzLbl[exam.pupil_size]}</span></div>`;
    if(exam.pupil_reactivity) s+=`<div class="summary-row"><span class="criteria">Pupilas — Reatividade</span><span class="value"><span class="dot ${exam.pupil_reactivity==='fixed'?'dot-critical':exam.pupil_reactivity==='sluggish'?'dot-warning':'dot-normal'}"></span> ${pupilRxLbl[exam.pupil_reactivity]}</span></div>`;
    if(exam.eye_movements) s+=`<div class="summary-row"><span class="criteria">Movimentos oculares</span><span class="value">${eyeLbl[exam.eye_movements]}</span></div>`;
    if(exam.motor_pattern) s+=`<div class="summary-row"><span class="criteria">Padrão motor</span><span class="value"><span class="dot ${exam.motor_pattern==='decerebrate'||exam.motor_pattern==='flaccid'?'dot-critical':exam.motor_pattern==='decorticate'?'dot-warning':exam.motor_pattern==='normal'?'dot-normal':'dot-info'}"></span> ${motorLbl[exam.motor_pattern]}</span></div>`;
    if(exam.meningeal) s+=`<div class="summary-row"><span class="criteria">Sinais meníngeos</span><span class="value"><span class="dot ${exam.meningeal!=='none'?'dot-warning':'dot-normal'}"></span> ${meningLbl[exam.meningeal]}</span></div>`;
    if(exam.focal_deficit) s+=`<div class="summary-row"><span class="criteria">Déficit focal</span><span class="value"><span class="dot ${exam.focal_deficit!=='none'?'dot-critical':'dot-normal'}"></span> ${focalLbl[exam.focal_deficit]}</span></div>`;
    if(exam.babinski&&exam.babinski!=='not_done') s+=`<div class="summary-row"><span class="criteria">Babinski</span><span class="value"><span class="dot ${exam.babinski==='bilateral'?'dot-critical':exam.babinski==='extensor_unilateral'?'dot-warning':'dot-normal'}"></span> ${babinskiLbl[exam.babinski]}</span></div>`;
    if(exam.fundoscopy) s+=`<div class="summary-row"><span class="criteria">Fundoscopia</span><span class="value"><span class="dot ${exam.fundoscopy==='papilledema'||exam.fundoscopy==='hemorrhage'?'dot-warning':exam.fundoscopy==='not_done'?'dot-info':'dot-normal'}"></span> ${fundoLbl[exam.fundoscopy]}</span></div>`;
    if(!s) s='<p style="color:#4b5e7a;text-align:center;padding:.5rem 0;font-size:.82rem">Exame não preenchido.</p>';
    return s;
  });

  // -- Vitals --
  h+=collapsible('vitals','Sinais Vitais',()=>{
    let s='';
    const bpLbl={hypo:'Hipotensão',normal:'Normal',htn:'HAS',severe_htn:'HAS grave'};
    const hrLbl={brady:'Bradicardia',normal:'Normal',tachy:'Taquicardia'};
    const rrLbl={brady:'Bradipneia',normal:'Normal',tachy:'Taquipneia',irregular:'Irregular'};
    const tempLbl={hypo:'Hipotermia',normal:'Normal',fever:'Febre',hyperthermia:'Hipertermia'};
    const spo2Lbl={low:'< 94%',normal:'\u2265 94%'};

    if(vitals.bp) s+=`<div class="summary-row"><span class="criteria">PA</span><span class="value"><span class="dot ${vitals.bp==='hypo'||vitals.bp==='severe_htn'?'dot-critical':vitals.bp==='htn'?'dot-warning':'dot-normal'}"></span> ${bpLbl[vitals.bp]}</span></div>`;
    if(vitals.hr) s+=`<div class="summary-row"><span class="criteria">FC</span><span class="value"><span class="dot ${vitals.hr!=='normal'?'dot-warning':'dot-normal'}"></span> ${hrLbl[vitals.hr]}</span></div>`;
    if(vitals.rr) s+=`<div class="summary-row"><span class="criteria">FR</span><span class="value"><span class="dot ${vitals.rr!=='normal'?'dot-warning':'dot-normal'}"></span> ${rrLbl[vitals.rr]}</span></div>`;
    if(vitals.temp) s+=`<div class="summary-row"><span class="criteria">Temperatura</span><span class="value"><span class="dot ${vitals.temp==='fever'||vitals.temp==='hyperthermia'?'dot-warning':vitals.temp==='hypo'?'dot-info':'dot-normal'}"></span> ${tempLbl[vitals.temp]}</span></div>`;
    if(vitals.spo2) s+=`<div class="summary-row"><span class="criteria">SpO\u2082</span><span class="value"><span class="dot ${vitals.spo2==='low'?'dot-critical':'dot-normal'}"></span> ${spo2Lbl[vitals.spo2]}</span></div>`;

    if(hasCushingTriad()){
      s+='<div style="margin-top:.65rem;padding:.65rem;background:rgba(69,10,10,.6);border:1px solid #991b1b;border-radius:.5rem;font-size:.78rem;color:#fca5a5;font-weight:600;text-align:center">\u26A0\uFE0F TRÍADE DE CUSHING: HAS + Bradicardia + Alt. respiratória = HIC</div>';
    }
    if(!s) s='<p style="color:#4b5e7a;text-align:center;padding:.5rem 0;font-size:.82rem">Sinais vitais não preenchidos.</p>';
    return s;
  });

  // -- Toxidrome --
  if(selectedToxidrome){
    const tox=TOXIDROMES.find(t=>t.id===selectedToxidrome);
    h+=collapsible('toxidrome','Toxídrome Identificado',()=>{
      let s='';
      s+=`<div class="summary-row"><span class="criteria">Toxídrome</span><span class="value">${tox.icon} ${tox.name}</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Sinais</span><span class="value" style="font-size:.72rem;text-align:right;max-width:60%">${tox.signs}</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Causas</span><span class="value" style="font-size:.72rem;text-align:right;max-width:60%">${tox.cause}</span></div>`;
      s+=`<div style="margin-top:.65rem;padding:.65rem;background:rgba(12,74,110,.3);border:1px solid #0369a1;border-radius:.5rem;font-size:.78rem;color:#7dd3fc"><strong style="display:block;margin-bottom:.15rem">Antídoto/Tratamento:</strong>${tox.antidote}</div>`;
      return s;
    },true);
  }

  // -- Stratification --
  h+=collapsible('stratification','Estratificação de Risco',()=>{
    let s='';
    const structural=isStructural();
    const metabolic=isMetabolicToxic();
    const infectious=isInfectious();
    const seizure=isSeizure();

    s+='<div style="display:flex;gap:.4rem;margin-bottom:.65rem;flex-wrap:wrap">';
    s+=stratCard('🧠','Estrutural','AVC, hemorragia, massa',structural,'#fca5a5');
    s+=stratCard('🧪','Metabólico/Tóxico','Reversível',metabolic,'#86efac');
    s+=stratCard('🦠','Infeccioso','Meningite, encefalite',infectious,'#fcd34d');
    s+=stratCard('\u26A1','Epiléptico','Pós-ictal, status',seizure,'#67e8f9');
    s+='</div>';

    // Key findings
    const findings=[];
    if(t!==null&&t<=8) findings.push('GCS \u2264 8 (grave)');
    else if(t!==null&&t<=12) findings.push('GCS 9-12 (moderado)');
    if(gcsP!==null&&prs>0) findings.push(`GCS-P = ${gcsP} (pupilar -${prs})`);
    if(hasCushingTriad()) findings.push('Tríade de Cushing (HIC)');
    if(hs.length>=2) findings.push('Sinais de herniação ('+hs.length+')');
    if(exam.pupil_reactivity==='fixed') findings.push('Pupilas fixas');
    if(exam.pupil_size==='anisocoric') findings.push('Anisocoria');
    if(exam.focal_deficit&&exam.focal_deficit!=='none') findings.push('Déficit focal presente');
    if(exam.meningeal&&exam.meningeal!=='none') findings.push('Sinais meníngeos +');
    if(exam.motor_pattern==='decerebrate') findings.push('Descerebração');
    if(exam.motor_pattern==='decorticate') findings.push('Decorticação');
    if(exam.motor_pattern==='flaccid') findings.push('Flacidez difusa');
    if(exam.babinski==='bilateral') findings.push('Babinski bilateral');
    if(exam.babinski==='extensor_unilateral') findings.push('Babinski unilateral');
    if(exam.fundoscopy==='papilledema') findings.push('Papiledema');
    if(exam.eye_movements==='dolls_absent') findings.push('Reflexo oculocefálico ausente');
    if(exam.eye_movements==='nystagmus') findings.push('Nistagmo');
    if(onset.mode==='sudden') findings.push('Instalação súbita');
    if(glucose.value==='low') findings.push('Hipoglicemia');
    if(glucose.value==='critical_high') findings.push('Hiperglicemia grave');
    if(airway.needs_intubation) findings.push('IOT indicada/realizada');
    if(vitals.spo2==='low') findings.push('Hipoxemia (SpO\u2082 < 94%)');
    if(vitals.hr==='brady'&&vitals.bp==='hypo') findings.push('Bradicardia + Hipotensão');
    if(findings.length>0){
      s+='<div style="font-size:.75rem;color:#94a3b8;margin-top:.35rem">';
      s+='<strong style="color:#cbd5e1">Achados relevantes:</strong><br>';
      s+=findings.map(f=>'\u2022 '+f).join('<br>');
      s+='</div>';
    }
    return s;
  });

  // -- Workup --
  h+=collapsible('workup','Propedêutica Sugerida',()=>{
    let s='';
    s+='<div style="font-size:.68rem;color:#4b5e7a;margin-bottom:.5rem">\uD83D\uDD36 Prioridade &nbsp; \u2B1C Rotina &nbsp; \uD83D\uDD35 Condicional</div>';
    s+='<div class="workup-grid">';
    // Always indicated - priority
    s+=wkItem('🩸','Glicemia capilar',true,false);
    s+=wkItem('🎯','TC de crânio sem contraste',true,false);
    // Always indicated - routine
    s+=wkItem('🧪','Hemograma completo',false,false);
    s+=wkItem('🧪','Eletrólitos (Na, K, Ca, Mg)',false,false);
    s+=wkItem('🧪','Função renal (Ur, Cr)',false,false);
    s+=wkItem('🧪','Função hepática (TGO, TGP, BT)',false,false);
    s+=wkItem('🧪','Gasometria arterial',false,false);
    s+=wkItem('🧪','Glicemia sérica',false,false);
    s+=wkItem('🧪','Coagulograma (TP, TTPa, INR)',false,false);
    s+=wkItem('🧪','PCR / Lactato',false,false);
    // Conditional
    s+=wkItem('💊','Screening toxicológico',false,causes.has('alcohol')||causes.has('opiates')||selectedToxidrome!==null);
    s+=wkItem('🦠','Punção lombar (após TC)',false,isInfectious()||(exam.meningeal&&exam.meningeal!=='none'));
    s+=wkItem('🧪','Hemoculturas (2 pares)',false,vitals.temp==='fever'||vitals.temp==='hyperthermia'||isInfectious());
    s+=wkItem('🧪','Amônia sérica',false,causes.has('uremia'));
    s+=wkItem('🧪','Função tireoidiana (TSH, T4L)',false,vitals.temp==='hypo'||vitals.bp==='hypo');
    s+=wkItem('\u26A1','EEG',false,causes.has('epilepsy')||onset.mode==='fluctuating');
    s+=wkItem('🧠','AngioTC / RNM',false,isStructural()||onset.mode==='sudden');
    s+=wkItem('🧪','Etanol sérico',false,causes.has('alcohol'));
    s+=wkItem('🧪','Osmolaridade sérica',false,glucose.value==='critical_high'||causes.has('alcohol'));
    s+=wkItem('🧪','Cortisol sérico',false,vitals.bp==='hypo');
    s+=wkItem('💊','Tiamina (B1) sérica',false,causes.has('alcohol'));
    s+=wkItem('🧪','Cetonas séricas/urinárias',false,glucose.value==='critical_high');
    s+=wkItem('🧪','ECG 12 derivações',false,vitals.hr==='brady'||vitals.hr==='tachy'||selectedToxidrome==='anticholinergic');
    s+=wkItem('🧪','Troponina',false,vitals.hr==='tachy'&&vitals.bp==='hypo');
    s+='</div>';
    return s;
  });

  // -- Conduta --
  h+=buildConduta();

  // -- Note --
  h+=collapsible('note','Nota para Prontuário',()=>buildNoteContent());

  // Nav
  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar e Editar</button>';
  h+='<button class="nav-btn primary" onclick="restart()">Nova Avaliação</button>';
  h+='</div></div>';

  app.innerHTML=h;
}

function stratCard(icon,label,desc,active,color){
  const bg=active?'background:rgba(15,23,42,.6);border:1.5px solid '+color:'background:#111827;border:1.5px solid #1e293b';
  return `<div style="flex:1;min-width:calc(25% - .3rem);padding:.6rem;border-radius:.5rem;text-align:center;${bg};transition:all .2s">
    <div style="font-size:1rem;margin-bottom:.15rem">${icon}</div>
    <div style="font-size:.68rem;font-weight:700;color:${active?color:'#4b5e7a'}">${label}</div>
    <div style="font-size:.55rem;color:#64748b;margin-top:.1rem">${desc}</div></div>`;
}

function wkItem(icon,label,highlighted,conditional){
  let cls='workup-item';
  if(highlighted) cls+=' highlighted';
  else if(conditional) cls+=' conditional';
  return `<div class="${cls}"><span class="w-icon">${icon}</span>${label}</div>`;
}

function glucoseLabel(){
  const m={low:'Hipoglicemia (< 70)',normal:'Normal (70\u2013180)',high:'Hiperglicemia (180\u2013400)',critical_high:'Hiperglicemia grave (> 400)'};
  return m[glucose.value]||'Não verificada';
}

// =============================================
// CONDUTA
// =============================================
function buildConduta(){
  const r=riskLevel();
  const t=gcsTotal();
  let cls,title,items;

  if(r==='critical'){
    cls='alta-prob';title='Conduta — Risco Crítico';
    items=[
      ['🚨','ABC: Proteger via aérea (IOT se GCS \u2264 8). Sequência rápida de intubação.'],
      ['💉','Acesso venoso calibroso (2 acessos periféricos \u2265 18G) + monitorização contínua (cardíaca, PA, SpO\u2082, capnografia)'],
      ['🩸','Corrigir hipoglicemia: Glicose 50% 50 mL IV em bolus (ou Glucagon 1 mg IM se sem acesso)']
    ];
    // Thiamine warning for alcoholics
    if(causes.has('alcohol')){
      items.push(['💊','TIAMINA 200-500 mg IV ANTES da glicose (prevenção de encefalopatia de Wernicke)']);
    }
    if(causes.has('opiates')||selectedToxidrome==='opioid'){
      items.push(['💊','NALOXONA 0,04\u20130,4 mg IV (iniciar com dose baixa se dependente). Titular até FR \u2265 12 irpm. Repetir a cada 2-3 min se necessário. Meia-vida da naloxona (30-90 min) < opióides — monitorizar rebaixamento recorrente por pelo menos 4h. Considerar infusão contínua (2/3 da dose eficaz/hora) se recorrência.']);
    }
    items.push(['🧠','TC de crânio URGENTE (sem contraste)']);
    if(isInfectious()||(exam.meningeal&&exam.meningeal!=='none')){
      items.push(['🦠','Meningite/encefalite suspeita: Ceftriaxona 2g IV 12/12h + Dexametasona 0,15mg/kg IV 6/6h AGORA (não aguardar TC/PL)']);
      items.push(['🧬','Aciclovir 10 mg/kg IV a cada 8h se encefalite herpética suspeita (febre + alteração comportamental + convulsão + alteração de temporal na imagem)']);
    }
    if(herniationSigns().length>=2){
      items.push(['\u26A0\uFE0F','Medidas anti-herniação: Manitol 20% 1g/kg IV em 20 min (ou NaCl 23,4% 30mL IV em 15 min), cabeceira 30°, hiperventilação leve transitória (PaCO\u2082 30-35). Evitar hiponatremia e hipotensão.']);
    }
    if(causes.has('epilepsy')){
      items.push(['\u26A1','Se status epilepticus: Diazepam 10 mg IV (ou Midazolam 10 mg IM se sem acesso) \u2192 Fenitoína 20 mg/kg IV (infusão \u2264 50 mg/min) ou Levetiracetam 60mg/kg IV (máx 4500mg)']);
    }
    if(vitals.bp==='hypo'){
      items.push(['💧','Ressuscitação volêmica + vasopressores se necessário. Considerar Hidrocortisona 100mg IV se suspeita de insuficiência adrenal.']);
    }
    if(vitals.temp==='hypo'){
      items.push(['🥶','Hipotermia: reaquecimento ativo. Se suspeita de coma mixedematoso: Levotiroxina 200-500\u03BCg IV + Hidrocortisona 100mg IV (ANTES da levotiroxina). Solicitar TSH/T4L.']);
    }
    items.push(['\uD83D\uDCF1','Interconsulta neurocirurgia/neurologia URGENTE']);
    items.push(['\uD83C\uDFE5','Internação em UTI']);
  } else if(r==='high'){
    cls='mod-prob';title='Conduta — Alto Risco';
    items=[
      ['🚨','Monitorização contínua em sala de emergência (cardíaca, PA, SpO\u2082, nível de consciência)'],
      ['🧠','TC de crânio sem contraste URGENTE'],
      ['🧪','Laboratório completo: HMG, eletrólitos, função renal, gasometria, coagulograma, lactato'],
      ['💊','Tratar causa reversível identificada']
    ];
    if(causes.has('alcohol')){
      items.push(['💊','Tiamina 200 mg IV (se suspeita de etilismo crônico/desnutrição)']);
    }
    if(causes.has('opiates')) items.push(['💊','Considerar prova terapêutica com Naloxona 0,4 mg IV']);
    if(exam.focal_deficit&&exam.focal_deficit!=='none') items.push(['🎯','Déficit focal: avaliar protocolo de AVC, verificar janela terapêutica para trombólise/trombectomia']);
    if(glucose.value==='critical_high') items.push(['💉','Hiperglicemia grave: hidratação vigorosa com SF 0,9% + investigar CAD/EHH']);
    if(exam.meningeal&&exam.meningeal!=='none'){
      items.push(['🦠','Sinais meníngeos: iniciar antibioticoterapia empírica se suspeita de meningite (não aguardar PL)']);
    }
    if(onset.mode==='sudden'&&!isStructural()){
      items.push(['🎯','Instalação súbita sem causa estrutural definida: considerar AVC de circulação posterior (vertigem, ataxia, pares cranianos), dissecção arterial, HSA com TC normal (PL se TC normal e alta suspeita)']);
    }
    items.push(['\uD83D\uDCCB','Avaliar necessidade de PL (após TC normal e sem contraindicação)']);
    items.push(['\uD83D\uDCF1','Interconsulta neurologia']);
    items.push(['\uD83C\uDFE5','Internação (UTI ou enfermaria com monitorização)']);
  } else if(r==='moderate'){
    cls='neutra-prob';title='Conduta — Risco Moderado';
    items=[
      ['🧪','Laboratório: HMG, eletrólitos, função renal, glicemia, gasometria, função hepática'],
      ['🧠','TC de crânio (considerar urgência conforme achados clínicos)'],
      ['💊','Screening toxicológico se suspeita de intoxicação'],
      ['\uD83D\uDCCB','Reavaliações seriadas do nível de consciência (Glasgow a cada 1\u20132h)'],
      ['\uD83D\uDCF1','Interconsulta neurologia conforme evolução'],
      ['\uD83C\uDFE5','Observação em emergência com monitorização']
    ];
    if(causes.has('alcohol')){
      items.push(['💊','Tiamina 100-200 mg IV/IM (prevenção de Wernicke)']);
    }
    if(onset.mode==='fluctuating'){
      items.push(['\u26A1','Considerar EEG (status não convulsivo?) se rebaixamento flutuante sem causa aparente']);
    }
    if(selectedToxidrome){
      const tox=TOXIDROMES.find(t=>t.id===selectedToxidrome);
      if(tox) items.push(['💊',`Toxídrome ${tox.name}: ${tox.antidote}`]);
    }
  } else {
    cls='baixa-prob';title='Conduta — Risco Baixo';
    items=[
      ['🧪','Laboratório básico: glicemia, eletrólitos, função renal, hemograma'],
      ['\uD83D\uDD0D','Avaliar causas metabólicas e tóxicas'],
      ['\uD83D\uDCCB','Reavaliações seriadas (Glasgow a cada 2\u20134h)'],
      ['🧠','TC de crânio se não houver causa clara identificada'],
      ['\uD83C\uDFE0','Considerar alta após investigação se melhora clínica e causa tratada']
    ];
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${cls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.65rem':'0'}">`;
  if(open){
    for(const[icon,text] of items) h+=`<div class="conduta-item"><span class="conduta-icon">${icon}</span><span>${text}</span></div>`;
  }
  h+='</div></div>';
  return h;
}

// =============================================
// CLINICAL NOTE
// =============================================
function buildNoteContent(){
  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const t=gcsTotal();
  const ri=riskInfo();
  const prs=pupilReactivityScore();
  const gcsP=gcsPTotal();
  const timelineLabel=onset.timeline==='acute'?'Agudo (min-horas)':onset.timeline==='subacute'?'Subagudo (dias)':onset.timeline==='chronic'?'Crônico (semanas-meses)':'Não informado';
  const modeLabel=onset.mode==='sudden'?'Instalação súbita (ictus)':onset.mode==='fluctuating'?'Instalação flutuante':onset.mode==='progressive'?'Instalação progressiva':'Não informado';

  let n='';
  n+=`REBAIXAMENTO DO NÍVEL DE CONSCIÊNCIA — AVALIAÇÃO ESTRUTURADA\n`;
  n+=`Data/hora: ${ts}\n`;
  n+=`Estratificação: ${ri.title}\n`;
  n+=`${'═'.repeat(50)}\n\n`;

  n+=`NÍVEL DE CONSCIÊNCIA\n`;
  n+=`  AVPU: ${avpu||'—'} — ${{A:'Alerta',V:'Resposta verbal',P:'Resposta à dor',U:'Arresponsivo'}[avpu]||'Não avaliado'}\n`;
  const verbalSuffix=verbalNT?'t':'';
  n+=`  Glasgow: ${t!==null?t:'-'}${verbalSuffix}/15 (O${gcs.eye||'-'} V${gcs.verbal||'-'}${verbalSuffix} M${gcs.motor||'-'}) — ${t!==null?gcsLabel(t):'Não calculado'}\n`;
  if(verbalNT) n+=`  Nota: Resposta verbal não testável (paciente intubado/traqueostomizado). GCS registrado com sufixo "t".\n`;
  if(gcsP!==null&&prs>0) n+=`  GCS-P (pupilar): ${gcsP} (GCS ${t} - ${prs})\n`;
  n+=`  Via aérea: ${airway.needs_intubation?'IOT indicada'+(airway.secured?' (assegurada)':' (pendente)'):'Pérvia, sem necessidade de IOT'}\n\n`;

  n+=`GLICEMIA CAPILAR: ${glucoseLabel()}\n\n`;

  n+=`CRONOLOGIA: ${timelineLabel}\n`;
  n+=`  Modo: ${modeLabel}\n`;
  n+=`  Testemunhado: ${onset.witnessed==='yes'?'Sim':onset.witnessed==='no'?'Não (encontrado rebaixado)':onset.witnessed==='unknown'?'Indeterminado':'Não informado'}\n\n`;

  // Causes
  n+=`CAUSAS SUSPEITAS (AEIOU-TIPS):\n`;
  if(causes.size===0){
    n+=`  Nenhuma causa selecionada.\n`;
  } else {
    for(const c of AEIOU_TIPS){
      if(causes.has(c.id)) n+=`  [${c.letter}] ${c.name}\n`;
    }
  }
  n+='\n';

  // Exam
  n+=`EXAME NEUROLÓGICO FOCADO:\n`;
  const pupilSzLbl={miotic:'Mióticas',normal:'Normais',mydriatic:'Midriáticas',anisocoric:'Anisocóricas'};
  const pupilRxLbl={reactive:'Fotorreativas',sluggish:'Lentas',fixed:'Fixas'};
  const eyeLbl={normal:'Normais',dolls_absent:'Reflexo oculocefálico ausente',deviated:'Desvio conjugado',disconjugate:'Desconjugados',nystagmus:'Nistagmo'};
  const motorLbl={normal:'Normal/localiza dor',decorticate:'Decorticação',decerebrate:'Descerebração',flaccid:'Flacidez difusa',asymmetric:'Assimétrico'};
  const meningLbl={none:'Ausentes',nuchal:'Rigidez de nuca',kernig_brudzinski:'Kernig/Brudzinski positivos'};
  const focalLbl={none:'Nenhum',hemiparesis:'Hemiparesia',cranial_nerve:'Acometimento de par craniano',aphasia:'Afasia',other:'Outro déficit focal'};
  const babinskiLbl={flexor:'Flexor (normal)',extensor_unilateral:'Extensor unilateral',bilateral:'Extensor bilateral',not_done:'Não testado'};
  const fundoLbl={normal:'Normal',papilledema:'Papiledema',hemorrhage:'Hemorragia',not_done:'Não realizada'};

  if(exam.pupil_size) n+=`  Pupilas: ${pupilSzLbl[exam.pupil_size]}`;
  if(exam.pupil_reactivity) n+=`, ${pupilRxLbl[exam.pupil_reactivity]}`;
  if(exam.pupil_size||exam.pupil_reactivity) n+='\n';
  if(exam.eye_movements) n+=`  Movimentos oculares: ${eyeLbl[exam.eye_movements]}\n`;
  if(exam.motor_pattern) n+=`  Padrão motor: ${motorLbl[exam.motor_pattern]}\n`;
  if(exam.meningeal) n+=`  Sinais meníngeos: ${meningLbl[exam.meningeal]}\n`;
  if(exam.focal_deficit) n+=`  Déficit focal: ${focalLbl[exam.focal_deficit]}\n`;
  if(exam.babinski&&exam.babinski!=='not_done') n+=`  Reflexo cutâneo-plantar: ${babinskiLbl[exam.babinski]}\n`;
  if(exam.fundoscopy) n+=`  Fundoscopia: ${fundoLbl[exam.fundoscopy]}\n`;
  n+='\n';

  // Vitals
  n+=`SINAIS VITAIS:\n`;
  const bpLbl={hypo:'Hipotensão',normal:'Normal',htn:'HAS',severe_htn:'HAS grave'};
  const hrLbl={brady:'Bradicardia',normal:'Normal',tachy:'Taquicardia'};
  const rrLbl={brady:'Bradipneia',normal:'Normal',tachy:'Taquipneia',irregular:'Irregular'};
  const tempLbl={hypo:'Hipotermia',normal:'Normal',fever:'Febre',hyperthermia:'Hipertermia'};
  const spo2Lbl={low:'< 94%',normal:'\u2265 94%'};

  if(vitals.bp) n+=`  PA: ${bpLbl[vitals.bp]}\n`;
  if(vitals.hr) n+=`  FC: ${hrLbl[vitals.hr]}\n`;
  if(vitals.rr) n+=`  FR: ${rrLbl[vitals.rr]}\n`;
  if(vitals.temp) n+=`  Temp: ${tempLbl[vitals.temp]}\n`;
  if(vitals.spo2) n+=`  SpO\u2082: ${spo2Lbl[vitals.spo2]}\n`;
  if(hasCushingTriad()) n+=`  *** TRÍADE DE CUSHING PRESENTE (HIC) ***\n`;

  const hs=herniationSigns();
  if(hs.length>=2) n+=`  *** SINAIS DE HERNIAÇÃO: ${hs.join(', ')} ***\n`;
  n+='\n';

  // Toxidrome
  if(selectedToxidrome){
    const tox=TOXIDROMES.find(t=>t.id===selectedToxidrome);
    n+=`TOXÍDROME: ${tox.name}\n`;
    n+=`  Sinais: ${tox.signs}\n`;
    n+=`  Causas possíveis: ${tox.cause}\n`;
    n+=`  Antídoto/Tratamento: ${tox.antidote}\n\n`;
  }

  // Risk
  n+=`ESTRATIFICAÇÃO: ${ri.title}\n`;
  if(isStructural()) n+=`  Causa predominante: Estrutural\n`;
  else if(isMetabolicToxic()) n+=`  Causa predominante: Metabólica/Tóxica\n`;
  else if(isInfectious()) n+=`  Causa predominante: Infecciosa\n`;
  else if(isSeizure()) n+=`  Causa predominante: Epiléptica\n`;
  n+=`  ${ri.desc}\n`;

  // Eval duration in note
  if(evalEndTime){
    const dur=Math.floor((evalEndTime-evalStartTime)/1000);
    const durMin=Math.floor(dur/60);
    const durSec=dur%60;
    n+=`\nDuração da avaliação: ${durMin}min ${durSec}s\n`;
  }

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">\uD83D\uDCCB Copiar nota para prontuário</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el) return;
  const text=el.textContent||el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showCopied();
    }).catch(()=>{
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');showCopied();}catch(e){showToast('Não foi possível copiar. Selecione manualmente.',3000);}
  document.body.removeChild(ta);
}

function showCopied(){
  const btn=document.getElementById('copyBtn');
  if(!btn) return;
  btn.textContent='\u2713 Copiado!';btn.classList.add('copied');
  showToast('Nota copiada para a área de transferência');
  setTimeout(()=>{if(btn){btn.textContent='\uD83D\uDCCB Copiar nota para prontuário';btn.classList.remove('copied');}},2500);
}

// =============================================
// ACTIONS
// =============================================
function setGlucose(v){glucose.value=v;glucose.checked=true;render()}
function setAVPU(v){avpu=v;render()}
function setGCS(field,v){gcs[field]=v;render()}
function setGCSVerbal(v){verbalNT=false;gcs.verbal=v;render()}
function setVerbalNT(){verbalNT=true;gcs.verbal=1;render()}
function setAirway(field,v){
  if(field==='needs'){airway.needs_intubation=v;if(!v)airway.secured=null;}
  else airway.secured=v;
  render();
}
function setOnset(field,v){onset[field]=v;render()}
function toggleCause(id){causes.has(id)?causes.delete(id):causes.add(id);render()}
function setExam(field,v){
  // Allow deselect by tapping same option
  if(exam[field]===v) exam[field]=null;
  else exam[field]=v;
  render();
}
function setVitals(field,v){
  // Allow deselect by tapping same option
  if(vitals[field]===v) vitals[field]=null;
  else vitals[field]=v;
  render();
}
function setToxidrome(id){
  if(selectedToxidrome===id) selectedToxidrome=null;
  else selectedToxidrome=id;
  render();
}
function clearToxidrome(){
  selectedToxidrome=null;
  render();
}
function toggleSection(id){sections[id]=!sections[id];render()}

function jumpToStep(targetStep){
  // Only allow jumping to previously completed steps
  if(targetStep<step){
    // If coming back from result, restart timer
    if(step>=TOTAL_STEPS&&evalEndTime){
      evalEndTime=null;
      timerInterval=setInterval(updateTimer,1000);
      const timerEl=document.getElementById('evalTimer');
      if(timerEl) timerEl.classList.remove('stopped');
    }
    step=targetStep;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
    showToast(STEP_LABELS[targetStep]);
  }
}

function next(){
  if(step===0&&glucose.value===null) return;
  if(step===1&&(avpu===null||gcs.eye===null||gcs.verbal===null||gcs.motor===null)) return;
  if(step===2&&airway.needs_intubation===null) return;
  if(step===3&&(onset.timeline===null||onset.mode===null)) return;
  step++;render();window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){
  if(step>0){
    // If coming back from result, restart timer
    if(step>=TOTAL_STEPS&&evalEndTime){
      evalEndTime=null;
      timerInterval=setInterval(updateTimer,1000);
      const timerEl=document.getElementById('evalTimer');
      if(timerEl) timerEl.classList.remove('stopped');
    }
    step--;render();window.scrollTo({top:0,behavior:'smooth'});
  }
}
function restart(){
  if(!confirm('Iniciar nova avaliação? Os dados atuais serão perdidos.')) return;
  step=0;
  glucose={checked:false,value:null};
  avpu=null;gcs={eye:null,verbal:null,motor:null};
  verbalNT=false;
  airway={needs_intubation:null,secured:null};
  onset={timeline:null,mode:null,witnessed:null};
  causes=new Set();
  exam={pupil_size:null,pupil_reactivity:null,eye_movements:null,motor_pattern:null,meningeal:null,focal_deficit:null,fundoscopy:null,babinski:null};
  vitals={bp:null,hr:null,rr:null,temp:null,spo2:null};
  selectedToxidrome=null;
  sections={gcs:true,airway:true,causes:true,exam:false,vitals:false,toxidrome:false,stratification:true,workup:true,conduta:true,note:true};
  evalEndTime=null;
  clearInterval(timerInterval);
  evalStartTime=new Date();
  timerInterval=setInterval(updateTimer,1000);
  render();window.scrollTo({top:0,behavior:'smooth'});
}

// =============================================
// KEYBOARD NAVIGATION
// =============================================
document.addEventListener('keydown',function(e){
  // Escape = go back
  if(e.key==='Escape'&&step>0){
    e.preventDefault();
    prev();
    return;
  }
  // Enter = next (if enabled)
  if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey){
    const primaryBtn=document.querySelector('.nav-btn.primary:not(:disabled)');
    if(primaryBtn&&!e.target.closest('.option-btn,.check-btn,.score-opt,.toxidrome-card')){
      e.preventDefault();
      primaryBtn.click();
    }
  }
});

render();
</script>
