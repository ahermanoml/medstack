<!-- VERSION: 5 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dor de Cabeça — Avaliação na Emergência</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
  header{background:linear-gradient(135deg,#1e293b 0%,#0f2744 50%,#1e293b 100%);width:100%;padding:1.5rem;text-align:center;border-bottom:2px solid #3b82f6;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  header h1{font-size:1.5rem;font-weight:700;color:#f1f5f9;letter-spacing:-.02em}
  header p{font-size:.8rem;color:#64748b;margin-top:.3rem;letter-spacing:.02em}
  .back-link{position:absolute;left:1.5rem;top:50%;transform:translateY(-50%);color:#64748b;text-decoration:none;font-size:.8rem;font-weight:500;transition:all .25s;display:flex;align-items:center;gap:.3rem;padding:.4rem .6rem;border-radius:.5rem}
  .back-link:hover{color:#f1f5f9;background:rgba(255,255,255,.05)}
  .back-link:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .container{max-width:700px;width:100%;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))}

  /* Progress bar */
  .progress-bar{display:flex;align-items:center;gap:.3rem;padding:0 .5rem}
  .progress-step{flex:1;height:5px;border-radius:3px;background:#1e293b;transition:all .5s cubic-bezier(.4,0,.2,1);position:relative;cursor:default;overflow:hidden}
  .progress-step.clickable{cursor:pointer}
  .progress-step::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);transition:transform .6s}
  .progress-step.done{background:#3b82f6}
  .progress-step.done::after{transform:translateX(100%);transition:transform 1s .2s}
  .progress-step.active{background:#60a5fa;animation:pulse-bar 2s ease-in-out infinite}
  .progress-step.clickable:hover{opacity:.8}
  @keyframes pulse-bar{0%,100%{opacity:1;transform:scaleY(1)}50%{opacity:.6;transform:scaleY(1.4)}}
  .progress-labels{display:flex;justify-content:space-between;font-size:.55rem;color:#475569;padding:.25rem .5rem 0;user-select:none}
  .progress-labels span{transition:color .2s;padding:.15rem .1rem}
  .progress-labels span.clickable{cursor:pointer}
  .progress-labels span.clickable:hover{color:#94a3b8}
  .progress-labels span.active-label{color:#93c5fd;font-weight:700}
  .progress-labels span.done-label{color:#3b82f6;font-weight:600}

  /* Flow connector */
  .flow-connector{display:flex;justify-content:center;padding:.15rem 0}
  .flow-connector .arrow{width:2px;height:20px;background:linear-gradient(to bottom,#334155,#1e293b);position:relative}
  .flow-connector .arrow::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #334155}

  /* Cards */
  .card{background:#1e293b;border:1px solid #334155;border-radius:1rem;padding:2rem;animation:fadeSlideIn .4s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 24px rgba(0,0,0,.2),0 1px 4px rgba(0,0,0,.1)}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-size:1.15rem;color:#f8fafc;margin-bottom:.3rem;font-weight:700;letter-spacing:-.01em}
  .card .subtitle{font-size:.78rem;color:#64748b;margin-bottom:1.25rem;line-height:1.4}

  /* Step indicator */
  .step-indicator{display:inline-flex;align-items:center;gap:.4rem;font-size:.65rem;color:#475569;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}
  .step-indicator .step-num{background:#334155;color:#94a3b8;width:1.3rem;height:1.3rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.6rem}

  /* Options container */
  .options{display:flex;flex-direction:column;gap:.65rem}
  .option-group-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:#475569;margin-top:.75rem;margin-bottom:-.15rem;font-weight:600}
  .option-group-label:first-child{margin-top:0}

  /* Option buttons (single select) */
  .option-btn{background:#0f172a;border:1.5px solid #1e293b;border-radius:.75rem;padding:.85rem 1.1rem;color:#94a3b8;font-size:.9rem;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);text-align:left;display:flex;align-items:center;gap:.75rem;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .option-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(59,130,246,.05),transparent);opacity:0;transition:opacity .25s}
  .option-btn:hover{border-color:#3b82f6;color:#cbd5e1;transform:translateX(2px)}.option-btn:hover::before{opacity:1}
  .option-btn:active{transform:scale(.98)}
  .option-btn:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .option-btn.selected{border-color:#3b82f6;background:linear-gradient(135deg,#1e3a5f,#172554);color:#f1f5f9;box-shadow:0 0 0 1px rgba(59,130,246,.2),inset 0 1px 0 rgba(255,255,255,.05)}
  .option-btn .icon{font-size:1.2rem;flex-shrink:0;width:2rem;text-align:center}
  .option-btn .label{flex:1}
  .option-btn .tag{font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .55rem;border-radius:9999px;font-weight:700;flex-shrink:0}
  .tag-red{background:#7f1d1d;color:#fca5a5}.tag-yellow{background:#78350f;color:#fcd34d}.tag-green{background:#14532d;color:#86efac}.tag-blue{background:#1e3a5f;color:#93c5fd}

  /* Checkbox buttons */
  .check-btn{background:#0f172a;border:1.5px solid #1e293b;border-radius:.75rem;padding:.7rem 1rem;color:#94a3b8;font-size:.85rem;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);text-align:left;display:flex;align-items:center;gap:.7rem;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
  .check-btn:hover{border-color:#3b82f6;color:#cbd5e1;transform:translateX(2px)}
  .check-btn:active{transform:scale(.98)}
  .check-btn:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .check-btn.checked{border-color:#3b82f6;background:linear-gradient(135deg,#1e3a5f,#172554);color:#f1f5f9}
  .check-btn.checked.red-flag{border-color:#ef4444;background:linear-gradient(135deg,#450a0a,#3b0000);box-shadow:0 0 0 1px rgba(239,68,68,.15)}
  .check-btn.disabled-dim{opacity:.35;pointer-events:none}
  .check-box{width:18px;height:18px;border:2px solid #334155;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .25s;font-size:.7rem}
  .check-btn.checked .check-box{background:#3b82f6;border-color:#3b82f6;animation:checkPop .3s cubic-bezier(.4,0,.2,1)}
  .check-btn.checked.red-flag .check-box{background:#ef4444;border-color:#ef4444}
  @keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

  /* Ripple effect */
  .ripple{position:absolute;border-radius:50%;background:rgba(59,130,246,.15);transform:scale(0);animation:rippleAnim .5s ease-out;pointer-events:none}
  @keyframes rippleAnim{to{transform:scale(4);opacity:0}}

  /* Score/chip buttons */
  .score-opt{flex:1;padding:.5rem .3rem;border-radius:.5rem;font-size:.7rem;cursor:pointer;border:1.5px solid #1e293b;background:#0f172a;color:#64748b;text-align:center;transition:all .25s;line-height:1.3;font-weight:500;-webkit-tap-highlight-color:transparent;min-height:2.2rem;display:inline-flex;align-items:center;justify-content:center}
  .score-opt:hover{border-color:#3b82f6;color:#cbd5e1;background:#0f1d32}
  .score-opt:active{transform:scale(.95)}
  .score-opt:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .score-opt.picked{border-color:#3b82f6;background:linear-gradient(135deg,#1e3a5f,#172554);color:#f1f5f9;font-weight:700;box-shadow:0 0 0 1px rgba(59,130,246,.2)}

  /* Pain scale */
  .pain-scale{display:flex;gap:.3rem;margin-top:.3rem;flex-wrap:wrap;justify-content:center}
  .pain-dot{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid #1e293b;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .25s;color:#475569;background:#0f172a;-webkit-tap-highlight-color:transparent}
  .pain-dot:hover{transform:scale(1.1);border-color:#3b82f6}
  .pain-dot:active{transform:scale(.9)}
  .pain-dot:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .pain-dot.picked{color:#fff;transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .pain-dot.p-low{border-color:#22c55e;background:#22c55e;color:#052e16}
  .pain-dot.p-mod{border-color:#f59e0b;background:#f59e0b;color:#451a03}
  .pain-dot.p-high{border-color:#ef4444;background:#ef4444;color:#fff}
  /* Color hint on non-picked dots */
  .pain-dot.hint-low{border-color:rgba(34,197,94,.25)}
  .pain-dot.hint-mod{border-color:rgba(245,158,11,.25)}
  .pain-dot.hint-high{border-color:rgba(239,68,68,.25)}
  .pain-label{font-size:.6rem;color:#475569;text-align:center;margin-top:.2rem}
  .pain-labels{display:flex;justify-content:space-between;padding:0 .2rem}

  /* Navigation */
  .nav-row{display:flex;gap:.75rem;margin-top:1.5rem}
  .nav-btn{flex:1;padding:.85rem;border-radius:.75rem;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .25s;border:none;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
  .nav-btn:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
  .nav-btn.secondary{background:#334155;color:#cbd5e1}.nav-btn.secondary:hover{background:#475569;transform:translateY(-1px)}
  .nav-btn.primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 2px 12px rgba(59,130,246,.3)}.nav-btn.primary:hover{background:linear-gradient(135deg,#60a5fa,#3b82f6);transform:translateY(-1px);box-shadow:0 4px 16px rgba(59,130,246,.4)}
  .nav-btn:active{transform:translateY(0)!important}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed;transform:none!important;box-shadow:none!important}

  /* Validation hint */
  .validation-hint{font-size:.68rem;color:#f87171;margin-top:.5rem;display:flex;align-items:center;gap:.3rem;animation:fadeSlideIn .3s}

  /* Result page */
  .result-card{text-align:center;padding:2rem 1.5rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:5rem;height:5rem;border-radius:50%;font-size:2rem;font-weight:800;margin-bottom:1rem;animation:badgePop .5s cubic-bezier(.4,0,.2,1)}
  @keyframes badgePop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .badge-emergent{background:linear-gradient(135deg,#991b1b,#7f1d1d);color:#fca5a5;border:3px solid #ef4444;box-shadow:0 0 24px rgba(239,68,68,.3)}
  .badge-urgent{background:linear-gradient(135deg,#92400e,#78350f);color:#fcd34d;border:3px solid #f59e0b;box-shadow:0 0 24px rgba(245,158,11,.2)}
  .badge-low{background:linear-gradient(135deg,#166534,#14532d);color:#86efac;border:3px solid #22c55e;box-shadow:0 0 24px rgba(34,197,94,.2)}
  .badge-primary{background:linear-gradient(135deg,#1e40af,#1e3a5f);color:#93c5fd;border:3px solid #3b82f6;box-shadow:0 0 24px rgba(59,130,246,.2)}
  .result-title{font-size:1.4rem;font-weight:800;margin-bottom:.25rem;letter-spacing:-.02em}
  .result-desc{color:#64748b;font-size:.85rem;margin-bottom:1.25rem}

  /* Time elapsed */
  .time-elapsed{font-size:.65rem;color:#475569;margin-bottom:.75rem;display:flex;align-items:center;justify-content:center;gap:.35rem}
  .time-elapsed .te-icon{font-size:.75rem}

  /* Dark box / collapsible */
  .dark-box{background:#1e293b;border:1px solid #334155;border-radius:.75rem;padding:1.25rem;transition:all .3s}
  .dark-box h3{font-size:.75rem;color:#475569;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem;font-weight:700}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid rgba(51,65,85,.5);font-size:.82rem;gap:.5rem}
  .summary-row:last-child{border-bottom:none}
  .summary-row .criteria{color:#94a3b8;flex:1;min-width:0}
  .summary-row .value{font-weight:600;display:flex;align-items:center;gap:.4rem;flex-shrink:0;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-red{background:#ef4444}.dot-yellow{background:#f59e0b}.dot-green{background:#22c55e}.dot-blue{background:#3b82f6}

  /* Conduta box */
  .conduta-box{border-radius:.75rem;padding:1.25rem;text-align:left;margin-bottom:.75rem}
  .conduta-box h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem;font-weight:700}
  .conduta-box.alta-prob{background:linear-gradient(135deg,#450a0a,#3b0000);border:1.5px solid #991b1b}.conduta-box.alta-prob h3{color:#fca5a5}
  .conduta-box.mod-prob{background:linear-gradient(135deg,#451a03,#422006);border:1.5px solid #78350f}.conduta-box.mod-prob h3{color:#fcd34d}
  .conduta-box.baixa-prob{background:linear-gradient(135deg,#052e16,#04260f);border:1.5px solid #14532d}.conduta-box.baixa-prob h3{color:#86efac}
  .conduta-box.neutra-prob{background:#1e293b;border:1.5px solid #334155}.conduta-box.neutra-prob h3{color:#94a3b8}
  .conduta-item{display:flex;align-items:flex-start;gap:.5rem;padding:.4rem 0;font-size:.82rem;color:#cbd5e1;line-height:1.45}
  .conduta-icon{flex-shrink:0;width:1.2rem;text-align:center;font-size:.9rem}

  /* Collapsible */
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:.15rem 0;border-radius:.5rem;transition:opacity .2s;-webkit-tap-highlight-color:transparent}
  .collapse-header:hover{opacity:.8}
  .collapse-header h3{margin-bottom:0}
  .collapse-arrow{font-size:.7rem;color:#475569;transition:transform .3s cubic-bezier(.4,0,.2,1);width:1.5rem;height:1.5rem;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.03)}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s}
  .collapse-body.hidden{max-height:0!important;padding-top:0;margin-top:0;opacity:0}
  .collapse-body.visible{max-height:5000px;opacity:1}

  /* Section badge count */
  .section-badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.3rem;height:1.3rem;padding:0 .35rem;border-radius:9999px;font-size:.6rem;font-weight:700;margin-left:.5rem;vertical-align:middle}
  .section-badge.sb-red{background:#7f1d1d;color:#fca5a5}
  .section-badge.sb-yellow{background:#78350f;color:#fcd34d}
  .section-badge.sb-green{background:#14532d;color:#86efac}
  .section-badge.sb-blue{background:#1e3a5f;color:#93c5fd}
  .section-badge.sb-neutral{background:#334155;color:#94a3b8}

  /* Note */
  .note-box{background:#0f172a;border-radius:.75rem;padding:1.25rem;text-align:left;margin-bottom:1.25rem}
  .note-box h3{font-size:.75rem;color:#475569;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem;font-weight:700}
  .note-text{background:#020617;border:1px solid #1e293b;border-radius:.5rem;padding:1rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.7rem;color:#94a3b8;white-space:pre-wrap;line-height:1.65;max-height:400px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .note-text::-webkit-scrollbar{width:4px}.note-text::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.75rem;padding:.75rem;border-radius:.5rem;border:1.5px solid #334155;background:#1e293b;color:#cbd5e1;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s;-webkit-tap-highlight-color:transparent}
  .copy-btn:hover{border-color:#3b82f6;background:#172040;color:#f1f5f9;transform:translateY(-1px)}
  .copy-btn:active{transform:translateY(0)}
  .copy-btn:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .copy-btn.copied{border-color:#22c55e;background:#052e16;color:#86efac}

  /* Alert boxes */
  .alert-box{border-radius:.75rem;padding:1rem 1.25rem;margin-bottom:.75rem;display:flex;align-items:flex-start;gap:.75rem;font-size:.82rem;line-height:1.5}
  .alert-box.alert-red{background:linear-gradient(135deg,#450a0a,#3b0000);border:1.5px solid #991b1b;color:#fca5a5}
  .alert-box.alert-yellow{background:linear-gradient(135deg,#451a03,#422006);border:1.5px solid #78350f;color:#fcd34d}
  .alert-box.alert-green{background:linear-gradient(135deg,#052e16,#04260f);border:1.5px solid #14532d;color:#86efac}
  .alert-box .alert-icon{font-size:1.1rem;flex-shrink:0;margin-top:.1rem}
  .alert-box .alert-text{flex:1}
  .alert-box .alert-text strong{display:block;margin-bottom:.25rem;font-size:.9rem}

  /* SNOOP letters */
  .snoop-letter{display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;border-radius:.35rem;font-weight:800;font-size:.7rem;margin-right:.4rem;flex-shrink:0}
  .snoop-s{background:#7f1d1d;color:#fca5a5}
  .snoop-n{background:#78350f;color:#fcd34d}
  .snoop-o{background:#991b1b;color:#fca5a5}
  .snoop-o2{background:#4c1d95;color:#c4b5fd}
  .snoop-p{background:#7c2d12;color:#fdba74}

  /* Ottawa box */
  .ottawa-box{background:#0f172a;border:1.5px solid #334155;border-radius:.75rem;padding:1.25rem;margin-top:1rem}
  .ottawa-box h4{font-size:.85rem;color:#f8fafc;margin-bottom:.5rem;font-weight:700}
  .ottawa-box>p{font-size:.72rem;color:#64748b;margin-bottom:.75rem;line-height:1.5}
  .ottawa-result{display:flex;align-items:center;gap:1rem;padding:1rem;border-radius:.75rem;margin-top:.75rem;transition:all .3s}
  .ottawa-result.or-high{background:linear-gradient(135deg,#450a0a,#3b0000);border:1px solid #7f1d1d}
  .ottawa-result.or-low{background:linear-gradient(135deg,#052e16,#04260f);border:1px solid #14532d}
  .ottawa-result.or-pending{background:#1e293b;border:1px solid #334155}
  .ottawa-num{font-size:1.5rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace;min-width:2rem;text-align:center}
  .ottawa-result.or-high .ottawa-num{color:#fca5a5}
  .ottawa-result.or-low .ottawa-num{color:#86efac}
  .ottawa-result.or-pending .ottawa-num{color:#64748b}
  .ottawa-info{flex:1}.ottawa-info .oi-label{font-size:.85rem;font-weight:700;color:#f1f5f9}
  .ottawa-info .oi-detail{font-size:.72rem;color:#94a3b8;margin-top:.2rem;line-height:1.5}

  /* Red flag count badge */
  .rf-count{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .7rem;border-radius:9999px;font-size:.8rem;font-weight:700;margin-bottom:1.25rem}
  .rf-count.rf-high{background:#7f1d1d;color:#fca5a5}.rf-count.rf-mod{background:#78350f;color:#fcd34d}.rf-count.rf-none{background:#14532d;color:#86efac}

  /* Inline alert for thunderclap on step 0 */
  .inline-alert{border-radius:.6rem;padding:.65rem .85rem;margin-top:.5rem;font-size:.78rem;line-height:1.4;display:flex;align-items:flex-start;gap:.5rem;animation:fadeSlideIn .3s}
  .inline-alert.ia-red{background:rgba(127,29,29,.3);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
  .inline-alert.ia-blue{background:rgba(30,58,95,.3);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
  .inline-alert.ia-yellow{background:rgba(120,53,15,.3);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
  .inline-alert .ia-icon{flex-shrink:0;font-size:.9rem}

  /* Disposition section on result */
  .disposition-box{border-radius:.75rem;padding:1.25rem;text-align:center;margin-bottom:.75rem;border:2px solid}
  .disp-emergent{background:linear-gradient(135deg,#450a0a,#3b0000);border-color:#ef4444}
  .disp-urgent{background:linear-gradient(135deg,#451a03,#422006);border-color:#f59e0b}
  .disp-obs{background:linear-gradient(135deg,#1e293b,#1a2332);border-color:#3b82f6}
  .disp-alta{background:linear-gradient(135deg,#052e16,#04260f);border-color:#22c55e}
  .disposition-box .disp-icon{font-size:1.5rem;margin-bottom:.3rem}
  .disposition-box .disp-title{font-size:.95rem;font-weight:700;margin-bottom:.2rem}
  .disposition-box .disp-desc{font-size:.78rem;color:#94a3b8;line-height:1.4}

  /* Auto-flag hint */

  <h1>Avalia\u00e7\u00e3o de Cefaleia</h1>
  <p>Classifica\u00e7\u00e3o + Red Flags + Ottawa SAH</p>
</header>
<div class="container" id="app"></div>
<div class="disclaimer" id="disclaimer"></div>
<script>
// =============================================
// DATA
// =============================================
const STEP_LABELS=['In\u00edcio','Red Flags','Sintomas','Exame','Vitais','Resultado'];
const TOTAL_STEPS=6;

// SNOOP red flags
const SNOOP_FLAGS=[
  {id:'s_febre',letter:'S',label:'Febre, perda de peso, sudorese noturna',cls:'snoop-s',cat:'Sintomas sist\u00eamicos'},
  {id:'s_hiv',letter:'S',label:'HIV ou imunossupressão',cls:'snoop-s',cat:'Sintomas sist\u00eamicos'},
  {id:'s_cancer',letter:'S',label:'Hist\u00f3ria de neoplasia',cls:'snoop-s',cat:'Sintomas sist\u00eamicos'},
  {id:'s_gestante',letter:'S',label:'Gestante ou pu\u00e9rpera',cls:'snoop-s',cat:'Sintomas sist\u00eamicos'},
  {id:'s_anticoag',letter:'S',label:'Uso de anticoagulante ou coagulopatia',cls:'snoop-s',cat:'Sintomas sist\u00eamicos'},
  {id:'n_focal',letter:'N',label:'D\u00e9ficit neurol\u00f3gico focal',cls:'snoop-n',cat:'Sintomas neurol\u00f3gicos'},
  {id:'n_confusao',letter:'N',label:'Confus\u00e3o mental ou rebaixamento',cls:'snoop-n',cat:'Sintomas neurol\u00f3gicos'},
  {id:'n_convulsao',letter:'N',label:'Convuls\u00e3o',cls:'snoop-n',cat:'Sintomas neurol\u00f3gicos'},
  {id:'o_subita',letter:'O',label:'In\u00edcio s\u00fabito (pico em segundos a minutos)',cls:'snoop-o',cat:'Onset (thunderclap)'},
  {id:'o_pior',letter:'O',label:'\u201CPior cefaleia da vida\u201D',cls:'snoop-o',cat:'Onset (thunderclap)'},
  {id:'o2_idade',letter:'O',label:'Idade > 50 anos com cefaleia nova',cls:'snoop-o2',cat:'Older age (> 50)'},
  {id:'p_progressiva',letter:'P',label:'Cefaleia progressiva (dias/semanas)',cls:'snoop-p',cat:'Mudan\u00e7a de padr\u00e3o'},
  {id:'p_postural',letter:'P',label:'Piora com posi\u00e7\u00e3o / Valsalva',cls:'snoop-p',cat:'Mudan\u00e7a de padr\u00e3o'},
  {id:'p_desperta',letter:'P',label:'Desperta o paciente do sono',cls:'snoop-p',cat:'Mudan\u00e7a de padr\u00e3o'},
  {id:'p_trauma',letter:'P',label:'Trauma craniano recente',cls:'snoop-p',cat:'Mudan\u00e7a de padr\u00e3o'},
  {id:'p_esforco',letter:'P',label:'Cefaleia desencadeada por esfor\u00e7o / tosse / manobra de Valsalva',cls:'snoop-p',cat:'Mudan\u00e7a de padr\u00e3o'},
];

// Ottawa SAH Rule criteria
const OTTAWA_CRITERIA=[
  {id:'ot_age40',label:'Idade \u2265 40 anos'},
  {id:'ot_neck',label:'Dor ou rigidez cervical'},
  {id:'ot_witness',label:'Perda de consci\u00eancia testemunhada'},
  {id:'ot_onset_effort',label:'In\u00edcio durante esfor\u00e7o f\u00edsico'},
  {id:'ot_thunder',label:'Cefaleia thunderclap (pico instant\u00e2neo)'},
  {id:'ot_flexion',label:'Limita\u00e7\u00e3o da flex\u00e3o cervical no exame'},
];

// Associated symptoms
const ASSOC_SYMPTOMS=[
  {id:'as_nausea',label:'N\u00e1useas / v\u00f4mitos',cat:'Gerais'},
  {id:'as_foto',label:'Fotofobia',cat:'Gerais'},
  {id:'as_fono',label:'Fonofobia',cat:'Gerais'},
  {id:'as_aura',label:'Aura visual (escotomas, fosfenos)',cat:'Gerais'},
  {id:'as_osmofobia',label:'Osmofobia (hipersensibilidade a odores)',cat:'Gerais'},
  {id:'as_lacrimej',label:'Lacrimejamento / hiperemia conjuntival ipsilateral',cat:'Auton\u00f4micos'},
  {id:'as_rinorreia',label:'Rinorreia / congest\u00e3o nasal ipsilateral',cat:'Auton\u00f4micos'},
  {id:'as_ptose',label:'Ptose / miose ipsilateral',cat:'Auton\u00f4micos'},
  {id:'as_inquietude',label:'Inquietude / agita\u00e7\u00e3o durante a crise',cat:'Auton\u00f4micos'},
  {id:'as_rigidez',label:'Rigidez de nuca',cat:'Meningismo'},
  {id:'as_kernig',label:'Sinal de Kernig / Brudzinski positivo',cat:'Meningismo'},
  {id:'as_rash',label:'Rash / pet\u00e9quias',cat:'Meningismo'},
  {id:'as_diplopia',label:'Diplopia ou perda visual',cat:'Neurol\u00f3gico'},
  {id:'as_fraqueza',label:'Fraqueza / parestesia focal',cat:'Neurol\u00f3gico'},
  {id:'as_afasia',label:'Afasia / disartria',cat:'Neurol\u00f3gico'},
  {id:'as_ataxia',label:'Ataxia / vertigem intensa',cat:'Neurol\u00f3gico'},
  {id:'as_sincope',label:'S\u00edncope',cat:'Neurol\u00f3gico'},
  {id:'as_campovisu',label:'Defeito de campo visual (hemianopsia, quadrantanopsia)',cat:'Neurol\u00f3gico'},
  {id:'as_dorcervical',label:'Dor cervical intensa / rigidez cervical',cat:'Vasculares'},
  {id:'as_horner',label:'S\u00edndrome de Horner (ptose + miose + anidrose)',cat:'Vasculares'},
];

// Exam findings
const EXAM_FINDINGS=[
  {id:'ex_papil',label:'Papiledema na fundoscopia',cat:'Fundoscopia',severe:true},
  {id:'ex_hemorr',label:'Hemorragia retiniana',cat:'Fundoscopia',severe:true},
  {id:'ex_focal',label:'D\u00e9ficit motor ou sensitivo focal',cat:'Exame neurol\u00f3gico',severe:true},
  {id:'ex_ataxia',label:'Ataxia de marcha',cat:'Exame neurol\u00f3gico',severe:true},
  {id:'ex_dismetria',label:'Dismetria / disdiadococinesia',cat:'Exame neurol\u00f3gico',severe:true},
  {id:'ex_anisocoria',label:'Anisocoria / d\u00e9ficit pupilar',cat:'Exame neurol\u00f3gico',severe:true},
  {id:'ex_parncraniano',label:'Paralisia de nervo craniano (III, VI, VII)',cat:'Exame neurol\u00f3gico',severe:true},
  {id:'ex_campovisu',label:'Defeito de campo visual ao confronto',cat:'Exame neurol\u00f3gico',severe:true},
  {id:'ex_meningismo',label:'Rigidez de nuca ao exame',cat:'Sinais men\u00edngeos',severe:true},
  {id:'ex_kernig',label:'Kernig / Brudzinski positivo ao exame',cat:'Sinais men\u00edngeos',severe:true},
  {id:'ex_temporal',label:'Art\u00e9ria temporal dolorosa / endurecida',cat:'Palpa\u00e7\u00e3o',severe:true},
  {id:'ex_claudic',label:'Claudica\u00e7\u00e3o mandibular',cat:'Palpa\u00e7\u00e3o',severe:true},
  {id:'ex_seio',label:'Dor \u00e0 palpa\u00e7\u00e3o de seios da face',cat:'Palpa\u00e7\u00e3o',severe:false},
  {id:'ex_trigger',label:'Ponto-gatilho cervical / trap\u00e9zio',cat:'Palpa\u00e7\u00e3o',severe:false},
  {id:'ex_normal',label:'Exame neurol\u00f3gico completamente normal',cat:'Normal',severe:false},
];

// Medications tried
const MED_OPTIONS=[
  {id:'med_dipirona',label:'Dipirona'},
  {id:'med_paracetamol',label:'Paracetamol'},
  {id:'med_aine',label:'AINE (ibuprofeno, cetoprofeno)'},
  {id:'med_triptano',label:'Triptano'},
  {id:'med_opioide',label:'Opioide'},
  {id:'med_outro',label:'Outro analg\u00e9sico'},
  {id:'med_nenhum',label:'Nenhum'},
];

// =============================================
// STATE
// =============================================
let currentStep=0;
let maxStepReached=0;
// Step 0: Onset
let onset={type:null,duration:null,location:null,quality:null,frequency:null,age:null,sex:null,intensity:null,knownMigraine:false,knownCluster:false,knownTTH:false};
let medsTried=new Set();
// Step 1: Red flags (SNOOP)
let redFlags=new Set();
// Step 1b: Ottawa SAH
let ottawaChecks=new Set();
// Step 2: Associated symptoms
let assocSymptoms=new Set();
// Step 3: Exam findings
let examFindings=new Set();
// Step 4: Vitals
let vitals={pa:null,fc:null,temp:null,gcs:null,spo2:null};
// Collapsible sections
let sections={snoop:true,ottawa:false,symptoms:false,exam:false,vitals:false,classification:true,conduta:true,workup:true,note:true,disposition:true,ddx:false};
const evalStartTime=new Date();
const app=document.getElementById('app');
const disclaimerEl=document.getElementById('disclaimer');

// =============================================
// HELPERS
// =============================================
function hasThunderclap(){return redFlags.has('o_subita')||redFlags.has('o_pior')}
function redFlagCount(){return redFlags.size}
function snoopCount(){
  const letters=new Set();
  for(const f of SNOOP_FLAGS)if(redFlags.has(f.id))letters.add(f.letter+f.cls);
  return letters.size;
}
function hasMeningism(){return assocSymptoms.has('as_rigidez')||assocSymptoms.has('as_kernig')||examFindings.has('ex_meningismo')||examFindings.has('ex_kernig')}
function hasFocalDeficit(){return redFlags.has('n_focal')||examFindings.has('ex_focal')||examFindings.has('ex_ataxia')||examFindings.has('ex_dismetria')||examFindings.has('ex_anisocoria')||examFindings.has('ex_parncraniano')||examFindings.has('ex_campovisu')||assocSymptoms.has('as_fraqueza')||assocSymptoms.has('as_afasia')||assocSymptoms.has('as_ataxia')||assocSymptoms.has('as_campovisu')}
function hasPapilledema(){return examFindings.has('ex_papil')}
function hasRetinalHemorrhage(){return examFindings.has('ex_hemorr')}
function hasTemporalArteritis(){return (examFindings.has('ex_temporal')||examFindings.has('ex_claudic'))&&(redFlags.has('o2_idade'))}
function hasFever(){return redFlags.has('s_febre')||vitals.temp==='fever'}
function hasSubfebril(){return vitals.temp==='subfebril'}
function ottawaPositive(){return ottawaChecks.size>0}
function hasAutonomic(){return assocSymptoms.has('as_lacrimej')||assocSymptoms.has('as_rinorreia')||assocSymptoms.has('as_ptose')||assocSymptoms.has('as_inquietude')}
function hasMigraineFeatures(){return assocSymptoms.has('as_nausea')||assocSymptoms.has('as_foto')||assocSymptoms.has('as_fono')||assocSymptoms.has('as_aura')||assocSymptoms.has('as_osmofobia')}
function isPregnant(){return redFlags.has('s_gestante')}
function isAnticoagulated(){return redFlags.has('s_anticoag')}
function hasTrauma(){return redFlags.has('p_trauma')}
function hasLowSpO2(){return vitals.spo2==='low'}
function hasRash(){return assocSymptoms.has('as_rash')}
function hasCushingReflex(){return vitals.pa==='crisis'&&vitals.fc==='bradi'}
function hasPostural(){return redFlags.has('p_postural')}
function isDrowsy(){return vitals.gcs==='drowsy'}
function hasHorner(){return assocSymptoms.has('as_horner')}
function hasCervicalPain(){return assocSymptoms.has('as_dorcervical')||ottawaChecks.has('ot_neck')}
function hasVisualFieldDefect(){return assocSymptoms.has('as_campovisu')||examFindings.has('ex_campovisu')}

// Dissection pattern: cervical pain + focal deficit (or Horner) + acute onset
function suspectDissection(){
  return (hasCervicalPain()||hasHorner())&&(hasFocalDeficit()||hasHorner())&&(onset.type==='subito'||onset.type==='agudo');
}

// Cerebral venous thrombosis pattern
function suspectCVT(){
  return (isPregnant()||redFlags.has('s_gestante'))&&(redFlags.has('p_progressiva'))&&(hasPapilledema()||hasFocalDeficit()||redFlags.has('n_convulsao'));
}

// Pituitary apoplexy pattern
function suspectPituitaryApoplexy(){
  return onset.type==='subito'&&(hasVisualFieldDefect()||assocSymptoms.has('as_diplopia'))&&!hasMeningism();
}

// PRES pattern (posterior reversible encephalopathy syndrome)
function suspectPRES(){
  return vitals.pa==='crisis'&&(redFlags.has('n_convulsao')||assocSymptoms.has('as_diplopia')||hasFocalDeficit());
}

// IIH phenotype (pseudotumor cerebri)
function suspectIIH(){
  return hasPapilledema()&&!hasFocalDeficit()&&!hasMeningism()&&!hasThunderclap()&&(hasPostural()||redFlags.has('p_progressiva'));
}

// Age-based auto-derivations
function isAgeOver40(){return onset.age==='40_49'||onset.age==='50_64'||onset.age==='ge65'}
function isAgeOver50(){return onset.age==='50_64'||onset.age==='ge65'}

function getRiskLevel(){
  // Emergent
  if(hasThunderclap())return 'emergent';
  if(hasMeningism()&&hasFever())return 'emergent';
  if(hasMeningism()&&hasRash())return 'emergent';
  if(hasFocalDeficit()&&redFlags.has('n_confusao'))return 'emergent';
  if(redFlags.has('n_convulsao')&&(hasFocalDeficit()||hasMeningism()||vitals.pa==='crisis'))return 'emergent';
  if(hasPapilledema()&&hasFocalDeficit())return 'emergent';
  if(hasPapilledema()&&(assocSymptoms.has('as_diplopia')||assocSymptoms.has('as_sincope')))return 'emergent';
  if(hasRetinalHemorrhage()&&vitals.pa==='crisis')return 'emergent';
  if(vitals.gcs==='reduced')return 'emergent';
  if(hasCushingReflex())return 'emergent';
  if(hasLowSpO2()&&redFlags.has('n_confusao'))return 'emergent';
  if(isPregnant()&&(vitals.pa==='crisis'||hasFocalDeficit()||redFlags.has('n_convulsao')))return 'emergent';
  if(isAnticoagulated()&&hasTrauma())return 'emergent';
  if(isAnticoagulated()&&hasFocalDeficit())return 'emergent';
  if(suspectDissection())return 'emergent';
  if(suspectPRES())return 'emergent';

  // Urgent
  if(redFlagCount()>=3)return 'urgent';
  if(hasFocalDeficit())return 'urgent';
  if(hasMeningism())return 'urgent';
  if(hasPapilledema())return 'urgent';
  if(hasRetinalHemorrhage())return 'urgent';
  if(hasTemporalArteritis())return 'urgent';
  if(redFlags.has('n_confusao'))return 'urgent';
  if(redFlags.has('n_convulsao'))return 'urgent';
  if(isDrowsy()&&(hasFever()||redFlagCount()>0))return 'urgent';
  if(redFlags.has('p_progressiva')&&(redFlags.has('o2_idade')||redFlags.has('s_cancer')))return 'urgent';
  if(hasFever()&&(redFlags.has('s_hiv')||redFlags.has('s_cancer')))return 'urgent';
  if(vitals.pa==='crisis')return 'urgent';
  if(isPregnant()&&vitals.pa==='elevada')return 'urgent';
  if(isAnticoagulated()&&(onset.type==='subito'||onset.type==='agudo'))return 'urgent';
  if(examFindings.has('ex_parncraniano'))return 'urgent';
  if(hasLowSpO2())return 'urgent';
  if(hasPostural()&&hasPapilledema())return 'urgent';
  if((examFindings.has('ex_temporal')||examFindings.has('ex_claudic'))&&!redFlags.has('o2_idade')&&isAgeOver40())return 'urgent';
  if(onset.frequency==='primeiro'&&isAgeOver50()&&onset.intensity!==null&&onset.intensity>=7)return 'urgent';
  if(suspectCVT())return 'urgent';
  if(hasHorner()&&onset.type==='agudo')return 'urgent';

  // Low risk with red flags
  if(redFlagCount()>0)return 'low_flags';

  // Primary headache
  return 'primary';
}

function getClassification(){
  const risk=getRiskLevel();
  if(risk==='emergent'){
    let dx=[];
    if(hasThunderclap())dx.push('Hemorragia subaracnoidea');
    if(hasThunderclap()&&onset.frequency==='recorrente')dx.push('S\u00edndrome de vasoconstri\u00e7\u00e3o cerebral revers\u00edvel (RCVS)');
    if(hasMeningism()&&hasFever())dx.push('Meningite / Encefalite');
    if(hasMeningism()&&hasRash())dx.push('Meningococcemia');
    if(hasFocalDeficit()&&!hasThunderclap())dx.push('Les\u00e3o expansiva / AVC');
    if(redFlags.has('n_convulsao')&&!isPregnant())dx.push('Les\u00e3o estrutural / Status epil\u00e9ptico');
    if(hasPapilledema())dx.push('Hipertens\u00e3o intracraniana');
    if(hasCushingReflex())dx.push('Tr\u00edade de Cushing \u2014 hernia\u00e7\u00e3o iminente');
    if(hasRetinalHemorrhage()&&vitals.pa==='crisis')dx.push('Hipertens\u00e3o maligna');
    if(vitals.gcs==='reduced')dx.push('Processo intracraniano agudo');
    if(isPregnant()&&(vitals.pa==='crisis'||redFlags.has('n_convulsao')))dx.push('Ecl\u00e2mpsia / Pr\u00e9-ecl\u00e2mpsia grave');
    if(isAnticoagulated()&&hasTrauma())dx.push('Hematoma intracraniano em anticoagulado');
    if(isAnticoagulated()&&hasFocalDeficit()&&!hasTrauma())dx.push('Hemorragia intracraniana espont\u00e2nea em anticoagulado');
    if(suspectDissection())dx.push('Dissec\u00e7\u00e3o arterial cervical (car\u00f3tida/vertebral)');
    if(suspectPRES())dx.push('PRES (s\u00edndrome da encefalopatia posterior revers\u00edvel)');
    if(suspectPituitaryApoplexy())dx.push('Apoplexia hipofis\u00e1ria');
    if(dx.length===0)dx.push('Cefaleia secund\u00e1ria de alto risco');
    return {level:'emergent',title:'Emergente',badge:'badge-emergent',icon:'\u{1F6A8}',dx,desc:'Investiga\u00e7\u00e3o imediata obrigat\u00f3ria'};
  }
  if(risk==='urgent'){
    let dx=[];
    if(hasTemporalArteritis())dx.push('Arterite temporal (de c\u00e9lulas gigantes)');
    if(hasPapilledema()&&suspectIIH())dx.push('Hipertens\u00e3o intracraniana idiop\u00e1tica (pseudotumor cerebri)');
    else if(hasPapilledema())dx.push('Hipertens\u00e3o intracraniana');
    if(hasRetinalHemorrhage())dx.push('Retinopatia \u2014 investigar hipertens\u00e3o maligna');
    if(hasMeningism()&&!hasFever())dx.push('Irrita\u00e7\u00e3o men\u00edngea \u2014 HSA? Meningite viral?');
    if(hasMeningism()&&hasFever())dx.push('Meningite / Encefalite');
    if(hasFocalDeficit())dx.push('Les\u00e3o estrutural');
    if(examFindings.has('ex_parncraniano'))dx.push('Paralisia de nervo craniano \u2014 aneurisma? massa?');
    if(redFlags.has('p_progressiva'))dx.push('Cefaleia progressiva \u2014 les\u00e3o expansiva?');
    if(vitals.pa==='crisis')dx.push('Emerg\u00eancia hipertensiva');
    if(isPregnant()&&vitals.pa==='elevada')dx.push('Pr\u00e9-ecl\u00e2mpsia');
    if(isAnticoagulated())dx.push('Hemorragia intracraniana em anticoagulado');
    if(hasLowSpO2())dx.push('Hipoxemia \u2014 avaliar causa sist\u00eamica');
    if(isDrowsy()&&hasFever())dx.push('Sonol\u00eancia + febre \u2014 encefalite?');
    if(onset.frequency==='primeiro'&&isAgeOver50())dx.push('Cefaleia de in\u00edcio novo em > 50 anos');
    if((examFindings.has('ex_temporal')||examFindings.has('ex_claudic'))&&isAgeOver40()&&!hasTemporalArteritis())dx.push('Arterite temporal prov\u00e1vel \u2014 solicitar VHS/PCR');
    if(suspectCVT())dx.push('Trombose venosa cerebral');
    if(hasHorner()&&onset.type==='agudo')dx.push('Dissec\u00e7\u00e3o carot\u00eddea \u2014 angio-TC urgente');
    if(redFlags.has('n_convulsao'))dx.push('Convuls\u00e3o \u2014 avaliar les\u00e3o estrutural');
    if(dx.length===0)dx.push('Cefaleia secund\u00e1ria suspeita');
    return {level:'urgent',title:'Urgente',badge:'badge-urgent',icon:'\u26A0\uFE0F',dx,desc:'Investiga\u00e7\u00e3o necess\u00e1ria antes da alta'};
  }
  if(risk==='low_flags'){
    return {level:'low_flags',title:'Baixo Risco com Red Flags',badge:'badge-urgent',icon:'\u{1F50D}',dx:['Red flags presentes \u2014 considerar investiga\u00e7\u00e3o'],desc:'Avaliar necessidade de exames complementares'};
  }
  // Primary
  let dx=[];
  if(hasAutonomic()&&onset.location==='unilateral'&&(onset.duration==='15min_3h'))dx.push('Cefaleia em salvas (cluster)');
  else if(hasAutonomic()&&onset.location==='unilateral')dx.push('Cefaleia trig\u00eamino-auton\u00f4mica');
  else if(hasAutonomic()&&onset.location==='periorb')dx.push('Cefaleia trig\u00eamino-auton\u00f4mica');
  if(hasMigraineFeatures()||(onset.quality==='pulsatil'&&onset.duration==='4_72h'))dx.push('Migr\u00e2nea');
  if(onset.quality==='pressao'||onset.location==='bilateral')dx.push('Cefaleia tensional');
  if(onset.frequency==='cronica')dx.push('Cefaleia cr\u00f4nica di\u00e1ria');
  if(onset.location==='periorb'&&examFindings.has('ex_seio'))dx.push('Sinusite');
  if(onset.location==='occipital'&&examFindings.has('ex_trigger'))dx.push('Cefaleia cervicog\u00eanica');
  if(redFlags.has('p_esforco')&&!hasFocalDeficit()&&!hasPapilledema())dx.push('Cefaleia prim\u00e1ria por esfor\u00e7o');
  if(isMedOveruse())dx.push('Cefaleia por uso excessivo de analg\u00e9sicos');
  if(dx.length===0)dx.push('Cefaleia prim\u00e1ria inespec\u00edfica');
  return {level:'primary',title:'Cefaleia Prim\u00e1ria',badge:'badge-primary',icon:'\u2705',dx,desc:'Sem sinais de alarme \u2014 tratamento sintom\u00e1tico'};
}

function isMedOveruse(){
  return onset.frequency==='cronica'&&(medsTried.size>=3||medsTried.has('med_opioide'))&&!medsTried.has('med_nenhum');
}

function getTimeElapsed(){
  const diff=Math.floor((new Date()-evalStartTime)/1000);
  const m=Math.floor(diff/60);
  const s=diff%60;
  if(m>0)return m+'min '+s+'s';
  return s+'s';
}

// =============================================
// PROGRESS BAR (clickable to visited steps)
// =============================================
function progHTML(idx,allDone){
  let h='<div class="progress-bar" role="navigation" aria-label="Progresso da avalia\u00e7\u00e3o">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c=allDone||i<idx?'done':i===idx?'active':'';
    const canClick=i<=maxStepReached;
    const clickable=canClick?` onclick="goToStep(${i})" tabindex="0" role="button" aria-label="Ir para ${STEP_LABELS[i]}"`:'';
    h+=`<div class="progress-step ${c} ${canClick?'clickable':''}"${clickable}></div>`;
  }
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c=allDone||i<idx?'done-label':i===idx?'active-label':'';
    const canClick=i<=maxStepReached;
    const clickable=canClick?` onclick="goToStep(${i})" tabindex="0" role="button"`:'';
    h+=`<span class="${c} ${canClick?'clickable':''}"${clickable}>${STEP_LABELS[i]}</span>`;
  }
  h+='</div><div class="flow-connector"><div class="arrow"></div></div>';
  return h;
}

// =============================================
// RIPPLE EFFECT
// =============================================
function addRipple(e){
  const btn=e.currentTarget;
  const rect=btn.getBoundingClientRect();
  const ripple=document.createElement('span');
  ripple.className='ripple';
  const size=Math.max(rect.width,rect.height);
  ripple.style.width=ripple.style.height=size+'px';
  ripple.style.left=(e.clientX-rect.left-size/2)+'px';
  ripple.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.appendChild(ripple);
  setTimeout(()=>ripple.remove(),500);
}

// Attach ripple to interactive buttons after render
function attachRipples(){
  document.querySelectorAll('.option-btn, .check-btn, .nav-btn, .score-opt, .pain-dot').forEach(btn=>{
    btn.addEventListener('pointerdown',addRipple,{passive:true});
  });
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  if(currentStep===0)renderOnset();
  else if(currentStep===1)renderRedFlags();
  else if(currentStep===2)renderSymptoms();
  else if(currentStep===3)renderExam();
  else if(currentStep===4)renderVitals();
  else renderResult();
  disclaimerEl.innerHTML=currentStep>=TOTAL_STEPS?'Ferramenta de apoio cl\u00ednico. N\u00e3o substitui o julgamento do profissional de sa\u00fade. Decis\u00f5es terap\u00eauticas devem ser individualizadas.':'';
  // Post-render hooks
  requestAnimationFrame(()=>{attachRipples();});
}

  if(assocSymptoms.size>0){
    let hints=[];
    if(hasMigraineFeatures())hints.push({icon:'\u{1F4A1}',text:'Padr\u00e3o compat\u00edvel com migr\u00e2nea',cls:'ia-blue'});
    if(hasAutonomic()&&(assocSymptoms.has('as_lacrimej')||assocSymptoms.has('as_rinorreia')))hints.push({icon:'\u{1F4A1}',text:'Sintomas auton\u00f4micos \u2014 considerar cefaleia trig\u00eamino-auton\u00f4mica',cls:'ia-blue'});
    if(hasMeningism())hints.push({icon:'\u26A0\uFE0F',text:'Sinais de irrita\u00e7\u00e3o men\u00edngea presentes \u2014 investigar meningite, HSA',cls:'ia-red'});
    if(hasRash()&&hasMeningism())hints.push({icon:'\u{1F6A8}',text:'Rash + meningismo: considerar meningococcemia \u2014 ATB emp\u00edrico IMEDIATO',cls:'ia-red'});
    if(assocSymptoms.has('as_diplopia'))hints.push({icon:'\u26A0\uFE0F',text:'Diplopia requer avalia\u00e7\u00e3o de nervos cranianos no exame f\u00edsico',cls:'ia-yellow'});
    if(assocSymptoms.has('as_sincope'))hints.push({icon:'\u26A0\uFE0F',text:'S\u00edncope associada \u00e0 cefaleia \u2014 avaliar causa card\u00edaca ou neurol\u00f3gica',cls:'ia-yellow'});
    if(assocSymptoms.has('as_fraqueza')||assocSymptoms.has('as_afasia'))hints.push({icon:'\u{1F6A8}',text:'D\u00e9ficit neurol\u00f3gico focal \u2014 descartar AVC ou les\u00e3o expansiva',cls:'ia-red'});
    if(hasHorner())hints.push({icon:'\u{1F6A8}',text:'S\u00edndrome de Horner + cefaleia: alta suspeita de dissec\u00e7\u00e3o carot\u00eddea. Angio-TC urgente.',cls:'ia-red'});
    if(hasCervicalPain()&&(onset.type==='subito'||onset.type==='agudo'))hints.push({icon:'\u26A0\uFE0F',text:'Dor cervical + cefaleia aguda: avaliar dissec\u00e7\u00e3o arterial cervical',cls:'ia-yellow'});
    if(assocSymptoms.has('as_campovisu'))hints.push({icon:'\u26A0\uFE0F',text:'Defeito de campo visual: avaliar les\u00e3o quiasm\u00e1tica (apoplexia hipofis\u00e1ria?) ou AVC occipital',cls:'ia-yellow'});
    if(hints.length>0){
      h+='<div style="margin-top:.75rem">';
      for(const hint of hints){
        h+=`<div class="inline-alert ${hint.cls}"><span class="ia-icon">${hint.icon}</span><span>${hint.text}</span></div>`;
      }
      h+='</div>';
    }
  }

  h+=buildStepSummary(2);

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Pr\u00f3ximo</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP 3: EXAM FINDINGS
// =============================================
function renderExam(){
  let h=progHTML(3,false);
  h+='<div class="card">';
  h+='<div class="step-indicator"><span class="step-num">4</span>Etapa 4 de '+TOTAL_STEPS+'</div>';
  h+='<h2>Exame F\u00edsico</h2>';
  h+='<p class="subtitle">Achados do exame neurol\u00f3gico e fundoscopia. Se o exame for normal, selecione a \u00faltima op\u00e7\u00e3o.</p>';
  h+='<div class="options">';

  const normalSelected=examFindings.has('ex_normal');
  let lastCat='';
  for(const e of EXAM_FINDINGS){
    if(e.cat!==lastCat){h+=`<div class="option-group-label">${e.cat}</div>`;lastCat=e.cat;}
    const ck=examFindings.has(e.id);
    const isRed=e.severe&&ck;
    const isDim=normalSelected&&e.id!=='ex_normal';
    h+=`<button class="check-btn ${ck?'checked':''}${isRed?' red-flag':''}${isDim?' disabled-dim':''}" onclick="toggleExam('${e.id}')"${isDim?' aria-disabled="true"':''}>`;
    h+=`<span class="check-box">${ck?'\u2713':''}</span>`;
    h+=`<span class="label">${e.label}</span></button>`;
  }

  h+='</div>';

  const severeCount=EXAM_FINDINGS.filter(e=>e.severe&&examFindings.has(e.id)).length;
  if(severeCount>0){
    h+=`<div class="inline-alert ia-red" style="margin-top:.75rem"><span class="ia-icon">\u26A0\uFE0F</span><span>${severeCount} achado${severeCount>1?'s':''} anormal${severeCount>1?'is':''} no exame f\u00edsico \u2014 prov\u00e1vel cefaleia secund\u00e1ria.</span></div>`;
  }

  h+=buildStepSummary(3);

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Pr\u00f3ximo</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP SUMMARY CHIPS
// =============================================
function buildStepSummary(step){
  let chips=[];
  if(step>=0){
    if(onset.age)chips.push({label:ageLabels()[onset.age],cls:'chip-blue'});
    if(onset.sex)chips.push({label:onset.sex==='M'?'Masc':'Fem',cls:'chip-blue'});
    if(onset.type)chips.push({label:onsetLabelsShort()[onset.type],cls:onset.type==='subito'?'chip-red':'chip-blue'});
    if(onset.intensity!==null)chips.push({label:'EVA '+onset.intensity,cls:onset.intensity>=7?'chip-red':onset.intensity>=4?'chip-yellow':'chip-green'});
  }
  if(step>=1&&redFlags.size>0){
    chips.push({label:redFlags.size+' RF',cls:redFlags.size>=3?'chip-red':'chip-yellow'});
  }
  if(step>=2&&assocSymptoms.size>0){
    chips.push({label:assocSymptoms.size+' sint.',cls:'chip-blue'});
  }
  if(step>=3){
    const sev=EXAM_FINDINGS.filter(e=>e.severe&&examFindings.has(e.id)).length;
    if(examFindings.has('ex_normal'))chips.push({label:'Exame normal',cls:'chip-green'});
    else if(sev>0)chips.push({label:sev+' anormal',cls:'chip-red'});
  }
  if(step>=4){
    const abnV=countAbnormalVitals();
    if(abnV>0)chips.push({label:abnV+' alt. vitais',cls:'chip-yellow'});
    else if(vitals.pa||vitals.fc||vitals.temp)chips.push({label:'Vitais OK',cls:'chip-green'});
  }
  if(chips.length===0)return '';
  let h='<div class="selection-summary">';
  for(const c of chips)h+=`<span class="selection-chip ${c.cls}"><span class="chip-dot"></span>${c.label}</span>`;
  h+='</div>';
  return h;
}

function ageLabels(){return {lt18:'< 18','18_39':'18-39','40_49':'40-49','50_64':'50-64',ge65:'\u2265 65'}}
function onsetLabelsShort(){return {subito:'S\u00fabito',agudo:'Agudo',subagudo:'Subagudo',cronico:'Cr\u00f4nico'}}

function countAbnormalVitals(){
  let n=0;
  if(vitals.pa==='crisis'||vitals.pa==='elevada')n++;
  if(vitals.fc&&vitals.fc!=='normal')n++;
  if(vitals.temp==='fever'||vitals.temp==='subfebril')n++;
  if(vitals.gcs==='reduced'||vitals.gcs==='drowsy')n++;
  if(vitals.spo2==='low')n++;
  return n;
}

// =============================================
// RESULT
// =============================================
function renderResult(){
  const cls=getClassification();
  const rfCount=redFlagCount();
  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  // Badge
  h+=`<div class="result-badge ${cls.badge}">${cls.icon}</div>`;
  h+=`<div class="result-title">${cls.title}</div>`;
  h+=`<div class="result-desc">${cls.desc}</div>`;

  // Time elapsed
  h+=`<div class="time-elapsed"><span class="te-icon">\u23F1</span>Tempo de avalia\u00e7\u00e3o: ${getTimeElapsed()}</div>`;

  // Red flag count
  const rfCls=rfCount>=3?'rf-high':rfCount>0?'rf-mod':'rf-none';
  h+=`<div class="rf-count ${rfCls}">${rfCount===0?'\u2713 Sem red flags':rfCount+' red flag'+(rfCount>1?'s':'')}</div>`;

  // Suspected diagnoses
  if(cls.dx.length>0){
    h+='<div style="margin-bottom:1rem;text-align:left">';
    for(const d of cls.dx){
      const dotCls=cls.level==='emergent'?'dot-red':cls.level==='urgent'?'dot-yellow':cls.level==='primary'?'dot-blue':'dot-yellow';
      h+=`<div class="summary-row"><span class="criteria">Diagn\u00f3stico suspeito</span><span class="value"><span class="dot ${dotCls}"></span>${d}</span></div>`;
    }
    h+='</div>';
  }

  // Disposition
  h+=buildDisposition(cls);

  // -- COLLAPSIBLE: SNOOP summary --
  const rfBadge=rfCount>0?`<span class="section-badge ${rfCount>=3?'sb-red':'sb-yellow'}">${rfCount}</span>`:'<span class="section-badge sb-green">0</span>';
  h+=collapsible('snoop','Red Flags (SNOOP)',rfBadge,()=>{
    let s='';
    if(rfCount===0){s+='<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.82rem">Nenhuma red flag identificada.</p>';return s;}
    for(const f of SNOOP_FLAGS){
      if(redFlags.has(f.id)){
        s+=`<div class="summary-row"><span class="criteria"><span class="snoop-letter ${f.cls}" style="display:inline-flex;width:1.2rem;height:1.2rem;font-size:.6rem;margin-right:.4rem">${f.letter}</span>${f.label}</span><span class="value"><span class="dot dot-red"></span>Sim</span></div>`;
      }
    }
    return s;
  });

  // -- COLLAPSIBLE: Ottawa (if thunderclap) --
  if(hasThunderclap()||onset.type==='subito'){
    const ottBadge=ottawaPositive()?`<span class="section-badge sb-red">${ottawaChecks.size}/6</span>`:'<span class="section-badge sb-green">0/6</span>';
    h+=collapsible('ottawa','Regra de Ottawa para HSA',ottBadge,()=>{
      let s='';
      if(ottawaPositive()){
        s+='<div class="alert-box alert-red"><span class="alert-icon">\u{1F6A8}</span><div class="alert-text"><strong>Ottawa SAH POSITIVO ('+ottawaChecks.size+'/6)</strong>Investiga\u00e7\u00e3o mandat\u00f3ria: TC cr\u00e2nio sem contraste. Se TC normal e < 6h do in\u00edcio, considerar angio-TC. Se > 6h e TC normal, pun\u00e7\u00e3o lombar (xantocromia).</div></div>';
      }else{
        s+='<div class="alert-box alert-green"><span class="alert-icon">\u2705</span><div class="alert-text"><strong>Ottawa SAH negativo (0/6)</strong>Nenhum crit\u00e9rio presente. Se cefaleia com pico em 1h e paciente alerta, HSA pode ser exclu\u00edda com sensibilidade de 100%.</div></div>';
      }
      for(const c of OTTAWA_CRITERIA){
        const ck=ottawaChecks.has(c.id);
        s+=`<div class="summary-row"><span class="criteria">${c.label}</span><span class="value"><span class="dot ${ck?'dot-red':'dot-green'}"></span>${ck?'Sim':'N\u00e3o'}</span></div>`;
      }
      return s;
    });
  }

  // -- COLLAPSIBLE: Symptoms summary --
  const symBadge=assocSymptoms.size>0?`<span class="section-badge sb-blue">${assocSymptoms.size}</span>`:'';
  h+=collapsible('symptoms','Sintomas Associados',symBadge,()=>{
    let s='';
    if(assocSymptoms.size===0){s+='<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.82rem">Nenhum sintoma associado selecionado.</p>';return s;}
    for(const sym of ASSOC_SYMPTOMS){
      if(assocSymptoms.has(sym.id)){
        s+=`<div class="summary-row"><span class="criteria">${sym.label}</span><span class="value"><span class="dot dot-blue"></span>Presente</span></div>`;
      }
    }
    return s;
  });

  // -- COLLAPSIBLE: Exam summary --
  const severeExamCount=EXAM_FINDINGS.filter(e=>e.severe&&examFindings.has(e.id)).length;
  const examBadge=severeExamCount>0?`<span class="section-badge sb-red">${severeExamCount} anormal</span>`:examFindings.has('ex_normal')?'<span class="section-badge sb-green">Normal</span>':'';
  h+=collapsible('exam','Exame F\u00edsico',examBadge,()=>{
    let s='';
    if(examFindings.size===0){s+='<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.82rem">Nenhum achado selecionado.</p>';return s;}
    for(const ex of EXAM_FINDINGS){
      if(examFindings.has(ex.id)){
        const dotC=ex.severe?'dot-red':'dot-green';
        s+=`<div class="summary-row"><span class="criteria">${ex.label}</span><span class="value"><span class="dot ${dotC}"></span>${ex.severe?'Anormal':'Normal'}</span></div>`;
      }
    }
    return s;
  });

  // -- COLLAPSIBLE: Vitals --
  const vitalsBadge=buildVitalsBadge();
  h+=collapsible('vitals','Sinais Vitais',vitalsBadge,()=>{
    let s='';
    const paL={'normal':'Normal','elevada':'Elevada (>140/90)','crisis':'Crise hipertensiva (>180/120)'};
    const fcL={'normal':'60-100 bpm','taqui':'Taquicardia (>100)','bradi':'Bradicardia (<60)'};
    const tempL={'normal':'Normal','subfebril':'Subfebril (37,8-38,5\u00B0C)','fever':'Febre (>38,5\u00B0C)'};
    const gcsL={'alert':'Alerta (GCS 15)','drowsy':'Sonolento (GCS 13-14)','reduced':'Rebaixado (GCS \u2264 12)'};
    const spo2L={'normal':'\u2265 95%','low':'< 95%'};
    if(vitals.pa)s+=`<div class="summary-row"><span class="criteria">PA</span><span class="value"><span class="dot ${vitals.pa==='crisis'?'dot-red':vitals.pa==='elevada'?'dot-yellow':'dot-green'}"></span>${paL[vitals.pa]}</span></div>`;
    if(vitals.fc)s+=`<div class="summary-row"><span class="criteria">FC</span><span class="value"><span class="dot ${vitals.fc!=='normal'?'dot-yellow':'dot-green'}"></span>${fcL[vitals.fc]}</span></div>`;
    if(vitals.temp)s+=`<div class="summary-row"><span class="criteria">Temperatura</span><span class="value"><span class="dot ${vitals.temp==='fever'?'dot-red':vitals.temp==='subfebril'?'dot-yellow':'dot-green'}"></span>${tempL[vitals.temp]}</span></div>`;
    if(vitals.spo2)s+=`<div class="summary-row"><span class="criteria">SpO\u2082</span><span class="value"><span class="dot ${vitals.spo2==='low'?'dot-red':'dot-green'}"></span>${spo2L[vitals.spo2]}</span></div>`;
    if(vitals.gcs)s+=`<div class="summary-row"><span class="criteria">Consci\u00eancia</span><span class="value"><span class="dot ${vitals.gcs==='reduced'?'dot-red':vitals.gcs==='drowsy'?'dot-yellow':'dot-green'}"></span>${gcsL[vitals.gcs]}</span></div>`;
    if(!vitals.pa&&!vitals.fc&&!vitals.temp&&!vitals.gcs&&!vitals.spo2)s+='<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.82rem">Nenhum sinal vital registrado.</p>';
    return s;
  });

  // -- COLLAPSIBLE: Differential diagnoses --
  h+=buildDDx(cls);

  // -- COLLAPSIBLE: Conduta --
  h+=buildConduta(cls);

  // -- COLLAPSIBLE: Workup --
  h+=buildWorkup(cls);

  // -- COLLAPSIBLE: Clinical note --
  h+=collapsible('note','Nota para prontu\u00e1rio','',()=>buildNoteContent(cls));

  // Nav
  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="restart()">Recome\u00e7ar</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function buildVitalsBadge(){
  const abnormal=countAbnormalVitals();
  if(abnormal>0)return `<span class="section-badge sb-yellow">${abnormal} alt.</span>`;
  if(vitals.pa||vitals.fc||vitals.temp||vitals.gcs||vitals.spo2)return '<span class="section-badge sb-green">OK</span>';
  return '';
}

// =============================================
// DISPOSITION
// =============================================
function buildDisposition(cls){
  let icon,title,desc,dcls;
  if(cls.level==='emergent'){
    icon='\u{1F3E5}';title='Interna\u00e7\u00e3o / UTI';desc='Paciente necessita interna\u00e7\u00e3o hospitalar com monitoriza\u00e7\u00e3o. Acionar equipe especializada.';dcls='disp-emergent';
  }else if(cls.level==='urgent'){
    icon='\u{1F50D}';title='Observa\u00e7\u00e3o + Investiga\u00e7\u00e3o';desc='Manter em observa\u00e7\u00e3o at\u00e9 conclus\u00e3o da investiga\u00e7\u00e3o. N\u00e3o dar alta sem exames.';dcls='disp-urgent';
  }else if(cls.level==='low_flags'){
    icon='\u23F3';title='Observa\u00e7\u00e3o 4-6h';desc='Observar evolu\u00e7\u00e3o cl\u00ednica. Reavalia\u00e7\u00e3o obrigat\u00f3ria antes da alta. Considerar exames conforme red flags.';dcls='disp-obs';
  }else{
    icon='\u{1F3E0}';title='Alta com orienta\u00e7\u00f5es';desc='Cefaleia prim\u00e1ria sem sinais de alarme. Alta ap\u00f3s melhora cl\u00ednica com analgesia e orienta\u00e7\u00f5es de retorno.';dcls='disp-alta';
  }
  let h=`<div class="disposition-box ${dcls}">`;
  h+=`<div class="disp-icon">${icon}</div>`;
  h+=`<div class="disp-title">${title}</div>`;
  h+=`<div class="disp-desc">${desc}</div>`;
  h+='</div>';
  return h;
}

// =============================================
// DIFFERENTIAL DIAGNOSES (new in v5)
// =============================================
function buildDDx(cls){
  const open=sections.ddx;
  let items=[];

  // Always add the primary diagnoses from classification
  for(const d of cls.dx){
    items.push({dx:d,likelihood:'Principal',dotCls:cls.level==='emergent'?'dot-red':cls.level==='urgent'?'dot-yellow':'dot-blue'});
  }

  // Add differentials based on pattern recognition
  if(cls.level==='emergent'||cls.level==='urgent'){
    if(hasThunderclap()&&!cls.dx.some(d=>d.includes('RCVS'))){
      items.push({dx:'RCVS (vasoconstri\u00e7\u00e3o cerebral revers\u00edvel)',likelihood:'Diferencial',dotCls:'dot-yellow'});
    }
    if(hasThunderclap()&&!cls.dx.some(d=>d.includes('Dissec\u00e7\u00e3o'))){
      items.push({dx:'Dissec\u00e7\u00e3o arterial cervical',likelihood:'Diferencial',dotCls:'dot-yellow'});
    }
    if(hasMeningism()&&hasFever()&&!cls.dx.some(d=>d.includes('Abscesso'))){
      items.push({dx:'Abscesso cerebral',likelihood:'Diferencial',dotCls:'dot-yellow'});
    }
    if(hasPapilledema()&&isPregnant()&&!cls.dx.some(d=>d.includes('Trombose'))){
      items.push({dx:'Trombose venosa cerebral',likelihood:'Diferencial',dotCls:'dot-yellow'});
    }
    if(vitals.pa==='crisis'&&hasFocalDeficit()&&!cls.dx.some(d=>d.includes('PRES'))){
      items.push({dx:'PRES (encefalopatia posterior revers\u00edvel)',likelihood:'Diferencial',dotCls:'dot-yellow'});
    }
  }

  if(cls.level==='primary'){
    // Add "need to rule out" differentials even for primary
    if(onset.type==='subito'){
      items.push({dx:'HSA (exclu\u00edda por Ottawa negativo)',likelihood:'Exclu\u00eddo',dotCls:'dot-green'});
    }
  }

  if(items.length<=1)return ''; // Don't show if only one diagnosis

  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('ddx')"><h3>Diagn\u00f3sticos Diferenciais</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open){
    for(const item of items){
      h+=`<div class="summary-row"><span class="criteria">${item.dx}</span><span class="value"><span class="dot ${item.dotCls}"></span>${item.likelihood}</span></div>`;
    }
  }
  h+='</div></div>';
  return h;
}

    }

    if(isDrowsy()&&hasFever()){

      items.push(['\u{1F489}','Pun\u00e7\u00e3o lombar ap\u00f3s TC de cr\u00e2nio']);
    }
    if(vitals.pa==='crisis'){

      items.push(['\u{1F50D}','Avaliar les\u00e3o de \u00f3rg\u00e3o-alvo (ECG, fundo de olho, fun\u00e7\u00e3o renal)']);

    }
    if(examFindings.has('ex_parncraniano')){
      items.push(['\u{1F9E0}','Angio-TC/RNM: excluir aneurisma compressivo (especialmente NC III com midr\u00edase)']);
    }
    if(suspectCVT()){
      items.push(['\u{1F9E0}','Angio-TC venosa ou RNM com venografia \u2014 trombose venosa cerebral']);

    }

      items.push(['\u{1F489}','Angio-TC cervical urgente \u2014 dissec\u00e7\u00e3o carot\u00eddea']);

      items.push(['\u{1F48A}','Se refrat\u00e1rio: sumatriptano 50-100mg VO (ou 6mg SC). Contraindicado se doen\u00e7a coron\u00e1ria.']);
      if(isPregnant()){

      }

      items.push(['\u26A0\uFE0F','Cefaleia por abuso medicamentoso prov\u00e1vel: orientar redu\u00e7\u00e3o gradual de analg\u00e9sicos. Encaminhar para cefaliatria.']);

    }
    if(hasTemporalArteritis()||(examFindings.has('ex_temporal')&&isAgeOver40())||(examFindings.has('ex_claudic')&&isAgeOver40())){
      items.push({exam:'VHS',priority:'Urgente',reason:'Elevado (>50 mm/h) na arterite temporal'});
      items.push({exam:'PCR',priority:'Urgente',reason:'Marcador inflamat\u00f3rio'});
      items.push({exam:'Bi\u00f3psia art\u00e9ria temporal',priority:'At\u00e9 2 semanas',reason:'Confirma\u00e7\u00e3o diagn\u00f3stica (n\u00e3o atrasar corticoide)'});
    }
    if(hasPapilledema()){
      items.push({exam:'RNM com venografia ou angio-TC venosa',priority:'Urgente',reason:'Excluir trombose venosa cerebral'});
      items.push({exam:'Avalia\u00e7\u00e3o oftalmol\u00f3gica',priority:'Urgente',reason:'Perimetria \u2014 risco de perda visual'});
      if(suspectIIH()){
        items.push({exam:'Pun\u00e7\u00e3o lombar com manometria',priority:'Urgente',reason:'Press\u00e3o de abertura > 25 cmH\u2082O confirma HII'});
      }
    }
    if(hasRetinalHemorrhage()&&!hasPapilledema()){
      items.push({exam:'Fundo de olho detalhado',priority:'Urgente',reason:'Graduar retinopatia \u2014 hipertens\u00e3o maligna?'});
    }
    if(hasFocalDeficit()&&!hasThunderclap()){
      items.push({exam:'RNM de cr\u00e2nio com difus\u00e3o',priority:'Urgente',reason:'Avaliar les\u00e3o estrutural / AVC isqu\u00eamico'});
    }
    if(examFindings.has('ex_parncraniano')){
      items.push({exam:'Angio-TC ou angio-RNM',priority:'Urgente',reason:'Excluir aneurisma compressivo'});
    }
    if(hasCushingReflex()){
      items.push({exam:'TC de cr\u00e2nio imediata',priority:'Imediato',reason:'Tr\u00edade de Cushing \u2014 hernia\u00e7\u00e3o?'});
    }
    if(suspectDissection()){
      items.push({exam:'Angio-TC cervical + intracraniana',priority:'Urgente',reason:'Dissec\u00e7\u00e3o arterial cervical'});
    }
    if(suspectPRES()){
      items.push({exam:'RNM cr\u00e2nio com FLAIR/DWI',priority:'Urgente',reason:'Edema vasog\u00eanico posterior (PRES)'});
    }
    if(suspectPituitaryApoplexy()){
      items.push({exam:'RNM sela t\u00farcica',priority:'Urgente',reason:'Apoplexia hipofis\u00e1ria'});
      items.push({exam:'Cortisol s\u00e9rico + TSH + prolactina',priority:'Urgente',reason:'Avalia\u00e7\u00e3o endocrinol\u00f3gica'});
    }
    if(suspectCVT()){
      items.push({exam:'Angio-TC venosa ou RNM venografia',priority:'Urgente',reason:'Trombose venosa cerebral'});
      items.push({exam:'D-d\u00edmero',priority:'Urgente',reason:'Complementar (sensibilidade limitada para TVC)'});
    }
    if(vitals.pa==='crisis'){
      items.push({exam:'Fun\u00e7\u00e3o renal + eletr\u00f3litos',priority:'Urgente',reason:'Les\u00e3o de \u00f3rg\u00e3o-alvo'});
      items.push({exam:'Fundo de olho',priority:'Urgente',reason:'Retinopatia hipertensiva'});
      items.push({exam:'ECG',priority:'Urgente',reason:'Sobrecarga ventricular / isquemia'});
    }
    if(isPregnant()&&(vitals.pa==='elevada'||vitals.pa==='crisis')){
      items.push({exam:'Protein\u00faria (rela\u00e7\u00e3o P/C ou 24h)',priority:'Urgente',reason:'Crit\u00e9rio diagn\u00f3stico de pr\u00e9-ecl\u00e2mpsia'});
      items.push({exam:'Hemograma + plaquetas + LDH + TGO/TGP',priority:'Urgente',reason:'S\u00edndrome HELLP'});
      items.push({exam:'\u00c1cido \u00farico',priority:'Urgente',reason:'Marcador de gravidade na pr\u00e9-ecl\u00e2mpsia'});
    }
    if(isAnticoagulated()&&(cls.level==='urgent'||cls.level==='emergent')){
      items.push({exam:'Coagulograma + INR',priority:'Imediato',reason:'N\u00edvel de anticoagula\u00e7\u00e3o'});
    }
    if(cls.level==='low_flags'&&redFlags.has('o2_idade')){
      items.push({exam:'TC de cr\u00e2nio sem contraste',priority:'Considerar',reason:'Cefaleia nova em > 50 anos'});
      items.push({exam:'VHS + PCR',priority:'Considerar',reason:'Excluir arterite temporal'});
    }
    if(cls.level==='low_flags'&&redFlags.has('s_cancer')){
      items.push({exam:'RNM de cr\u00e2nio com contraste',priority:'Considerar',reason:'Met\u00e1stase cerebral'});
    }
    if(cls.level==='low_flags'&&redFlags.has('s_hiv')){
      items.push({exam:'RNM de cr\u00e2nio com contraste',priority:'Considerar',reason:'Infec\u00e7\u00e3o oportunista do SNC (toxoplasmose, criptococose)'});
    }
    if(cls.level==='low_flags'&&redFlags.has('p_esforco')){
      items.push({exam:'Angio-TC cerebral',priority:'Considerar',reason:'Excluir HSA / malforma\u00e7\u00e3o vascular em cefaleia por esfor\u00e7o'});
    }
    if(isDrowsy()&&hasFever()&&cls.level==='urgent'){
      items.push({exam:'Pun\u00e7\u00e3o lombar',priority:'Urgente',reason:'Sonol\u00eancia + febre \u2014 excluir neuroinfec\u00e7\u00e3o'});
    }
    if(items.length===0){
      items.push({exam:'Neuroimagem',priority:'N\u00e3o indicada',reason:'Cefaleia prim\u00e1ria sem red flags, exame normal'});
    }

    for(const item of items){
      const pCls=item.priority==='Imediato'||item.priority==='Antes do ATB'?'dot-red':item.priority==='Urgente'?'dot-yellow':item.priority==='N\u00e3o indicada'?'dot-green':'dot-blue';
      h+=`<div class="summary-row"><span class="criteria" style="flex:1">${item.exam}<br><span style="font-size:.68rem;color:#475569">${item.reason}</span></span><span class="value"><span class="dot ${pCls}"></span>${item.priority}</span></div>`;
    }
  }
  h+='</div></div>';
  return h;
}

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id,title,badge,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')">`;
  h+=`<h3>${title}${badge||''}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open)h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// CLINICAL NOTE
// =============================================
function buildNoteContent(cls){
  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const ageLabel={'lt18':'< 18','18_39':'18-39','40_49':'40-49','50_64':'50-64','ge65':'\u2265 65'};
  const onsetLabel={'subito':'S\u00fabito (thunderclap)','agudo':'Agudo (minutos a horas)','subagudo':'Subagudo (dias)','cronico':'Cr\u00f4nico (semanas/meses)'};
  const qualLabel={'pulsatil':'Puls\u00e1til','pressao':'Press\u00e3o/aperto','pontada':'Pontada/facada','queimacao':'Queima\u00e7\u00e3o','outro_q':'Outro'};
  const locLabel={'unilateral':'Unilateral','bilateral':'Bilateral','frontal':'Frontal','occipital':'Occipital','holocraniana':'Holocraniana','periorb':'Periorbital'};
  const durLabel={'seg_min':'Segundos','15min_3h':'15 min - 3h','4_72h':'4 - 72h','gt72h':'> 72h','constante':'Constante'};
  const freqLabel={'primeiro':'Primeiro epis\u00f3dio','recorrente':'Recorrente','diaria':'Di\u00e1ria','cronica':'Cr\u00f4nica (>15d/m\u00eas)'};
  const paLabel={'normal':'Normal','elevada':'Elevada (>140/90)','crisis':'Crise hipertensiva (>180/120)'};
  const fcLabel={'normal':'60-100 bpm','taqui':'Taquicardia (>100)','bradi':'Bradicardia (<60)'};
  const tempLabel={'normal':'Normal','subfebril':'Subfebril (37,8-38,5\u00B0C)','fever':'Febre (>38,5\u00B0C)'};
  const gcsLabel={'alert':'Alerta (GCS 15)','drowsy':'Sonolento (GCS 13-14)','reduced':'Rebaixado (GCS \u2264 12)'};
  const spo2Label={'normal':'\u2265 95%','low':'< 95%'};

  let n='';
  n+='CEFALEIA \u2014 AVALIA\u00c7\u00c3O ESTRUTURADA NA EMERG\u00caNCIA\n';
  n+=`Data/hora: ${ts}\n`;
  n+='========================================\n\n';
  n+=`PACIENTE: ${onset.sex==='M'?'Masculino':'Feminino'}, ${ageLabel[onset.age]||'N/I'} anos\n`;

  // Known diagnosis
  const knownDx=[];
  if(onset.knownMigraine)knownDx.push('Migr\u00e2nea');
  if(onset.knownCluster)knownDx.push('Cefaleia em salvas');
  if(onset.knownTTH)knownDx.push('Cefaleia tensional');
  if(knownDx.length>0)n+=`Diagn\u00f3stico pr\u00e9vio: ${knownDx.join(', ')}\n`;
  n+='\n';

  n+='CARACTER\u00cdSTICAS DA CEFALEIA\n';
  n+=`  In\u00edcio: ${onsetLabel[onset.type]||'N/I'}\n`;
  if(onset.quality)n+=`  Qualidade: ${qualLabel[onset.quality]}\n`;
  if(onset.location)n+=`  Localiza\u00e7\u00e3o: ${locLabel[onset.location]}\n`;
  if(onset.duration)n+=`  Dura\u00e7\u00e3o: ${durLabel[onset.duration]}\n`;
  if(onset.frequency)n+=`  Frequ\u00eancia: ${freqLabel[onset.frequency]}\n`;
  if(onset.intensity!==null)n+=`  Intensidade (EVA): ${onset.intensity}/10\n`;

  const activeMeds=MED_OPTIONS.filter(m=>medsTried.has(m.id));
  if(activeMeds.length>0){
    n+='  Medica\u00e7\u00f5es j\u00e1 tentadas: '+activeMeds.map(m=>m.label).join(', ')+'\n';
  }

  n+='\nRED FLAGS (SNOOP)\n';
  const activeRF=SNOOP_FLAGS.filter(f=>redFlags.has(f.id));
  if(activeRF.length===0)n+='  Nenhuma red flag identificada.\n';
  else for(const f of activeRF)n+=`  [${f.letter}] ${f.label}\n`;

  if(hasThunderclap()||onset.type==='subito'){
    n+='\nREGRA DE OTTAWA PARA HSA\n';
    const activeOt=OTTAWA_CRITERIA.filter(c=>ottawaChecks.has(c.id));
    if(activeOt.length>0){
      n+=`  POSITIVO (${activeOt.length}/6 crit\u00e9rios)\n`;
      for(const c of activeOt)n+=`  [+] ${c.label}\n`;
    }else{
      n+='  NEGATIVO (0/6 crit\u00e9rios) \u2014 sensibilidade 100% para HSA\n';
    }
  }

  const activeSym=ASSOC_SYMPTOMS.filter(s=>assocSymptoms.has(s.id));
  if(activeSym.length>0){
    n+='\nSINTOMAS ASSOCIADOS\n';
    for(const s of activeSym)n+=`  - ${s.label}\n`;
  }

  const activeEx=EXAM_FINDINGS.filter(e=>examFindings.has(e.id));
  if(activeEx.length>0){
    n+='\nEXAME F\u00cdSICO\n';
    for(const e of activeEx)n+=`  ${e.severe?'[!]':'[ok]'} ${e.label}\n`;
  }else{
    n+='\nEXAME F\u00cdSICO\n  N\u00e3o registrado\n';
  }

  n+='\nSINAIS VITAIS\n';
  if(vitals.pa)n+=`  PA: ${paLabel[vitals.pa]}\n`;
  if(vitals.fc)n+=`  FC: ${fcLabel[vitals.fc]}\n`;
  if(vitals.temp)n+=`  Temperatura: ${tempLabel[vitals.temp]}\n`;
  if(vitals.spo2)n+=`  SpO\u2082: ${spo2Label[vitals.spo2]}\n`;
  if(vitals.gcs)n+=`  Consci\u00eancia: ${gcsLabel[vitals.gcs]}\n`;
  if(!vitals.pa&&!vitals.fc&&!vitals.temp&&!vitals.gcs&&!vitals.spo2)n+='  N\u00e3o registrados\n';

  n+=`\nCLASSIFICA\u00c7\u00c3O: ${cls.title}\n`;
  n+=`Red flags: ${redFlagCount()}\n`;
  n+='Diagn\u00f3sticos suspeitos:\n';
  for(const d of cls.dx)n+=`  - ${d}\n`;

  if(cls.level==='emergent')n+='\nDISPOSI\u00c7\u00c3O: Interna\u00e7\u00e3o hospitalar / UTI\n';
  else if(cls.level==='urgent')n+='\nDISPOSI\u00c7\u00c3O: Observa\u00e7\u00e3o + investiga\u00e7\u00e3o complementar\n';
  else if(cls.level==='low_flags')n+='\nDISPOSI\u00c7\u00c3O: Observa\u00e7\u00e3o 4-6h, reavalia\u00e7\u00e3o antes da alta\n';
  else n+='\nDISPOSI\u00c7\u00c3O: Alta com orienta\u00e7\u00f5es\n';

  n+=`\nTempo de avalia\u00e7\u00e3o: ${getTimeElapsed()}\n`;
  n+='\n--- Gerado por MedStack (ferramenta de apoio cl\u00ednico) ---\n';

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">\u{1F4CB} Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el)return;
  const text=el.textContent||el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showCopied()).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showCopied();}catch(e){}
  document.body.removeChild(ta);
}
function showCopied(){
  const btn=document.getElementById('copyBtn');
  if(!btn)return;
  btn.textContent='\u2713 Copiado!';btn.classList.add('copied');
  setTimeout(()=>{if(btn){btn.textContent='\u{1F4CB} Copiar nota';btn.classList.remove('copied');}},2000);
}

// =============================================
// ACTIONS
// =============================================
function setOnset(field,val){
  if(field==='intensity'){onset.intensity=val;}
  else{onset[field]=val;}
  syncAgeDerivedFlags();
  render();
}
function toggleKnownDx(field){
  onset[field]=!onset[field];
  render();
}
function syncAgeDerivedFlags(){
  // Auto-add "older age" SNOOP flag if age > 50
  if(isAgeOver50()){
    redFlags.add('o2_idade');
  }else{
    redFlags.delete('o2_idade');
  }
  // Auto-sync Ottawa age criterion
  if(isAgeOver40()&&(onset.type==='subito'||hasThunderclap())){
    ottawaChecks.add('ot_age40');
  }else{
    ottawaChecks.delete('ot_age40');
  }
  // Auto-sync Ottawa thunderclap criterion
  if(onset.type==='subito'){
    ottawaChecks.add('ot_thunder');
  }else if(!redFlags.has('o_subita')){
    // Only remove if thunderclap not flagged via red flags either
    ottawaChecks.delete('ot_thunder');
  }
}
function toggleMed(id){
  if(id==='med_nenhum'){
    if(medsTried.has('med_nenhum')){medsTried.delete('med_nenhum');}
    else{medsTried.clear();medsTried.add('med_nenhum');}
  }else{
    medsTried.delete('med_nenhum');
    medsTried.has(id)?medsTried.delete(id):medsTried.add(id);
  }
  render();
}
function toggleRedFlag(id){
  redFlags.has(id)?redFlags.delete(id):redFlags.add(id);
  // Sync thunderclap with Ottawa
  if(id==='o_subita'){
    if(redFlags.has('o_subita'))ottawaChecks.add('ot_thunder');
    else if(onset.type!=='subito')ottawaChecks.delete('ot_thunder');
  }
  render();
}
function toggleOttawa(id){ottawaChecks.has(id)?ottawaChecks.delete(id):ottawaChecks.add(id);render();}
function toggleSymptom(id){assocSymptoms.has(id)?assocSymptoms.delete(id):assocSymptoms.add(id);render();}
function toggleExam(id){
  if(id==='ex_normal'){
    if(examFindings.has('ex_normal')){examFindings.delete('ex_normal');}
    else{examFindings.clear();examFindings.add('ex_normal');}
  }else{
    examFindings.delete('ex_normal');
    examFindings.has(id)?examFindings.delete(id):examFindings.add(id);
  }
  render();
}
function setVital(field,val){vitals[field]=val;render();}
function toggleSection(id){sections[id]=!sections[id];render();}

function goToStep(step){
  if(step<0||step>TOTAL_STEPS)return;
  if(step>maxStepReached)return;
  currentStep=step;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function next(){
  if(currentStep===0&&(onset.type===null||onset.age===null||onset.sex===null))return;
  currentStep++;
  if(currentStep>maxStepReached)maxStepReached=currentStep;
  if(currentStep===1)syncAgeDerivedFlags();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){
  if(currentStep>0){
    currentStep--;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}
function restart(){
  if(!confirm('Recome\u00e7ar a avalia\u00e7\u00e3o?\n\nTodos os dados inseridos ser\u00e3o apagados.\nTempo decorrido: '+getTimeElapsed()))return;
  currentStep=0;
  maxStepReached=0;
  onset={type:null,duration:null,location:null,quality:null,frequency:null,age:null,sex:null,intensity:null,knownMigraine:false,knownCluster:false,knownTTH:false};
  medsTried=new Set();
  redFlags=new Set();ottawaChecks=new Set();assocSymptoms=new Set();examFindings=new Set();
  vitals={pa:null,fc:null,temp:null,gcs:null,spo2:null};
  sections={snoop:true,ottawa:false,symptoms:false,exam:false,vitals:false,classification:true,conduta:true,workup:true,note:true,disposition:true,ddx:false};
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// Keyboard accessibility for chips and buttons
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){
    const el=document.activeElement;
    if(el&&(el.classList.contains('score-opt')||el.classList.contains('check-btn')||el.classList.contains('option-btn')||el.classList.contains('pain-dot')||el.classList.contains('progress-step')||el.classList.contains('known-dx-toggle'))){
      e.preventDefault();
      el.click();
    }
  }
});

render();
</script>
