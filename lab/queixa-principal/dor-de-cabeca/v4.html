// =============================================
// RESULT
// =============================================
function renderResult(){
  const cls=getClassification();
  const rfCount=redFlagCount();
  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  // Badge
  h+=`<div class="result-badge ${cls.badge}">${cls.icon}</div>`;
  h+=`<div class="result-title">${cls.title}</div>`;
  h+=`<div class="result-desc">${cls.desc}</div>`;

  // Red flag count
  const rfCls=rfCount>=3?'rf-high':rfCount>0?'rf-mod':'rf-none';
  h+=`<div class="rf-count ${rfCls}">${rfCount===0?'\u2713 Sem red flags':rfCount+' red flag'+(rfCount>1?'s':'')}</div>`;

  // Suspected diagnoses
  if(cls.dx.length>0){
    h+='<div style="margin-bottom:1rem;text-align:left">';
    for(const d of cls.dx){
      const dotCls=cls.level==='emergent'?'dot-red':cls.level==='urgent'?'dot-yellow':cls.level==='primary'?'dot-blue':'dot-yellow';
      h+=`<div class="summary-row"><span class="criteria">Diagnóstico suspeito</span><span class="value"><span class="dot ${dotCls}"></span>${d}</span></div>`;
    }
    h+='</div>';
  }

  // Disposition
  h+=buildDisposition(cls);

  // -- COLLAPSIBLE: SNOOP summary --
  const rfBadge=rfCount>0?`<span class="section-badge ${rfCount>=3?'sb-red':'sb-yellow'}">${rfCount}</span>`:'<span class="section-badge sb-green">0</span>';
  h+=collapsible('snoop','Red Flags (SNOOP)',rfBadge,()=>{
    let s='';
    if(rfCount===0){s+='<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.82rem">Nenhuma red flag identificada.</p>';return s;}
    for(const f of SNOOP_FLAGS){
      if(redFlags.has(f.id)){
        s+=`<div class="summary-row"><span class="criteria"><span class="snoop-letter ${f.cls}" style="display:inline-flex;width:1.2rem;height:1.2rem;font-size:.6rem;margin-right:.4rem">${f.letter}</span>${f.label}</span><span class="value"><span class="dot dot-red"></span>Sim</span></div>`;
      }
    }
    return s;
  });

  // -- COLLAPSIBLE: Ottawa (if thunderclap) --
  if(hasThunderclap()||onset.type==='subito'){
    const ottBadge=ottawaPositive()?`<span class="section-badge sb-red">${ottawaChecks.size}/6</span>`:'<span class="section-badge sb-green">0/6</span>';
    h+=collapsible('ottawa','Regra de Ottawa para HSA',ottBadge,()=>{
      let s='';
      if(ottawaPositive()){
        s+='<div class="alert-box alert-red"><span class="alert-icon">\u{1F6A8}</span><div class="alert-text"><strong>Ottawa SAH POSITIVO ('+ottawaChecks.size+'/6)</strong>Investigação mandatória: TC crânio sem contraste. Se TC normal e < 6h do início, considerar angio-TC. Se > 6h e TC normal, punção lombar (xantocromia).</div></div>';
      }else{
        s+='<div class="alert-box alert-green"><span class="alert-icon">\u2705</span><div class="alert-text"><strong>Ottawa SAH negativo (0/6)</strong>Nenhum critério presente. Se cefaleia com pico em 1h e paciente alerta, HSA pode ser excluída com sensibilidade de 100%.</div></div>';
      }
      for(const c of OTTAWA_CRITERIA){
        const ck=ottawaChecks.has(c.id);
        s+=`<div class="summary-row"><span class="criteria">${c.label}</span><span class="value"><span class="dot ${ck?'dot-red':'dot-green'}"></span>${ck?'Sim':'Não'}</span></div>`;
      }
      return s;
    });
  }

  // -- COLLAPSIBLE: Symptoms summary --
  const symBadge=assocSymptoms.size>0?`<span class="section-badge sb-blue">${assocSymptoms.size}</span>`:'';
  h+=collapsible('symptoms','Sintomas Associados',symBadge,()=>{
    let s='';
    if(assocSymptoms.size===0){s+='<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.82rem">Nenhum sintoma associado selecionado.</p>';return s;}
    for(const sym of ASSOC_SYMPTOMS){
      if(assocSymptoms.has(sym.id)){
        s+=`<div class="summary-row"><span class="criteria">${sym.label}</span><span class="value"><span class="dot dot-blue"></span>Presente</span></div>`;
      }
    }
    return s;
  });

  // -- COLLAPSIBLE: Exam summary --
  const severeExamCount=EXAM_FINDINGS.filter(e=>e.severe&&examFindings.has(e.id)).length;
  const examBadge=severeExamCount>0?`<span class="section-badge sb-red">${severeExamCount} anormal</span>`:examFindings.has('ex_normal')?'<span class="section-badge sb-green">Normal</span>':'';
  h+=collapsible('exam','Exame Físico',examBadge,()=>{
    let s='';
    if(examFindings.size===0){s+='<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.82rem">Nenhum achado selecionado.</p>';return s;}
    for(const ex of EXAM_FINDINGS){
      if(examFindings.has(ex.id)){
        const dotC=ex.severe?'dot-red':'dot-green';
        s+=`<div class="summary-row"><span class="criteria">${ex.label}</span><span class="value"><span class="dot ${dotC}"></span>${ex.severe?'Anormal':'Normal'}</span></div>`;
      }
    }
    return s;
  });

  // -- COLLAPSIBLE: Vitals --
  const vitalsBadge=buildVitalsBadge();
  h+=collapsible('vitals','Sinais Vitais',vitalsBadge,()=>{
    let s='';
    const paL={'normal':'Normal','elevada':'Elevada (>140/90)','crisis':'Crise hipertensiva (>180/120)'};
    const fcL={'normal':'60-100 bpm','taqui':'Taquicardia (>100)','bradi':'Bradicardia (<60)'};
    const tempL={'normal':'Normal','subfebril':'Subfebril (37,8-38,5\u00B0C)','fever':'Febre (>38,5\u00B0C)'};
    const gcsL={'alert':'Alerta (GCS 15)','drowsy':'Sonolento (GCS 13-14)','reduced':'Rebaixado (GCS \u2264 12)'};
    const spo2L={'normal':'\u2265 95%','low':'< 95%'};
    if(vitals.pa)s+=`<div class="summary-row"><span class="criteria">PA</span><span class="value"><span class="dot ${vitals.pa==='crisis'?'dot-red':vitals.pa==='elevada'?'dot-yellow':'dot-green'}"></span>${paL[vitals.pa]}</span></div>`;
    if(vitals.fc)s+=`<div class="summary-row"><span class="criteria">FC</span><span class="value"><span class="dot ${vitals.fc!=='normal'?'dot-yellow':'dot-green'}"></span>${fcL[vitals.fc]}</span></div>`;
    if(vitals.temp)s+=`<div class="summary-row"><span class="criteria">Temperatura</span><span class="value"><span class="dot ${vitals.temp==='fever'?'dot-red':vitals.temp==='subfebril'?'dot-yellow':'dot-green'}"></span>${tempL[vitals.temp]}</span></div>`;
    if(vitals.spo2)s+=`<div class="summary-row"><span class="criteria">SpO\u2082</span><span class="value"><span class="dot ${vitals.spo2==='low'?'dot-red':'dot-green'}"></span>${spo2L[vitals.spo2]}</span></div>`;
    if(vitals.gcs)s+=`<div class="summary-row"><span class="criteria">Consciência</span><span class="value"><span class="dot ${vitals.gcs==='reduced'?'dot-red':vitals.gcs==='drowsy'?'dot-yellow':'dot-green'}"></span>${gcsL[vitals.gcs]}</span></div>`;
    if(!vitals.pa&&!vitals.fc&&!vitals.temp&&!vitals.gcs&&!vitals.spo2)s+='<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.82rem">Nenhum sinal vital registrado.</p>';
    return s;
  });

  // -- COLLAPSIBLE: Conduta --
  h+=buildConduta(cls);

  // -- COLLAPSIBLE: Workup --
  h+=buildWorkup(cls);

  // -- COLLAPSIBLE: Clinical note --
  h+=collapsible('note','Nota para prontuário','',()=>buildNoteContent(cls));

  // Nav
  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="restart()">Recomeçar</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function buildVitalsBadge(){
  let abnormal=0;
  if(vitals.pa==='crisis')abnormal++;
  else if(vitals.pa==='elevada')abnormal++;
  if(vitals.fc&&vitals.fc!=='normal')abnormal++;
  if(vitals.temp==='fever')abnormal++;
  else if(vitals.temp==='subfebril')abnormal++;
  if(vitals.gcs==='reduced')abnormal++;
  else if(vitals.gcs==='drowsy')abnormal++;
  if(vitals.spo2==='low')abnormal++;
  if(abnormal>0)return `<span class="section-badge sb-yellow">${abnormal} alt.</span>`;
  if(vitals.pa||vitals.fc||vitals.temp||vitals.gcs||vitals.spo2)return '<span class="section-badge sb-green">OK</span>';
  return '';
}

// =============================================
// DISPOSITION
// =============================================
function buildDisposition(cls){
  let icon,title,desc,dcls;
  if(cls.level==='emergent'){
    icon='\u{1F3E5}';title='Internação / UTI';desc='Paciente necessita internação hospitalar com monitorização. Acionar equipe especializada.';dcls='disp-emergent';
  }else if(cls.level==='urgent'){
    icon='\u{1F50D}';title='Observação + Investigação';desc='Manter em observação até conclusão da investigação. Não dar alta sem exames.';dcls='disp-urgent';
  }else if(cls.level==='low_flags'){
    icon='\u23F3';title='Observação 4-6h';desc='Observar evolução clínica. Reavaliação obrigatória antes da alta. Considerar exames conforme red flags.';dcls='disp-obs';
  }else{
    icon='\u{1F3E0}';title='Alta com orientações';desc='Cefaleia primária sem sinais de alarme. Alta após melhora clínica com analgesia e orientações de retorno.';dcls='disp-alta';
  }
  let h=`<div class="disposition-box ${dcls}">`;
  h+=`<div class="disp-icon">${icon}</div>`;
  h+=`<div class="disp-title">${title}</div>`;
  h+=`<div class="disp-desc">${desc}</div>`;
  h+='</div>';
  return h;
}

// =============================================
// CONDUTA
// =============================================
function buildConduta(cls){
  let boxCls,title,items;
  if(cls.level==='emergent'){
    boxCls='alta-prob';title='Conduta — '+cls.title;
    items=[
      ['\u{1F6A8}','Estabilização clínica imediata (ABCDE)'],
      ['\u{1F9E0}','TC de crânio sem contraste URGENTE'],
    ];
    if(hasThunderclap()){
      items.push(['\u{1F489}','Se TC normal e < 6h: angio-TC. Se > 6h e TC normal: punção lombar (xantocromia).']);
      items.push(['\u{1F4DE}','Acionar neurocirurgia se HSA confirmada']);
    }
    if(hasMeningism()&&hasFever()){
      items.push(['\u{1F48A}','Antibioticoterapia empírica IMEDIATA — NÃO atrasar por exames']);
      items.push(['\u{1F4CB}','Ceftriaxona 2g IV 12/12h + Dexametasona 0,15 mg/kg IV 6/6h (iniciar antes ou junto do ATB)']);
      items.push(['\u{1F489}','Hemocultura + punção lombar (se sem contraindicação — TC antes se déficit focal ou rebaixamento)']);
    }
    if(hasMeningism()&&hasRash()){
      items.push(['\u{1F6A8}','Meningococcemia: ATB imediato + isolamento de contato e gotículas']);
      items.push(['\u{1F4DE}','Notificação compulsória + quimioprofilaxia de contatos']);
    }
    if(hasCushingReflex()){
      items.push(['\u{1F6A8}','Tríade de Cushing: manitol 20% 1g/kg IV ou solução salina hipertônica 3% 250mL IV']);
      items.push(['\u{1F4DE}','Acionar neurocirurgia — risco de herniação cerebral']);
    }
    if(hasFocalDeficit()&&!hasMeningism()&&!hasThunderclap()){
      items.push(['\u{1F4CB}','Avaliar AVC isquêmico — protocolo de trombólise se < 4,5h do início']);
      items.push(['\u{1F4CA}','Glicemia capilar, coagulograma, ECG']);
    }
    if(vitals.gcs==='reduced'){
      items.push(['\u{1F6CF}\uFE0F','Proteção de via aérea se GCS \u2264 8']);
      items.push(['\u{1F4CA}','Monitorização contínua (PA, FC, SpO\u2082, ECG)']);
    }
    if(vitals.gcs==='drowsy'){
      items.push(['\u{1F4CA}','Monitorização contínua — reavaliação seriada da consciência']);
    }
    if(isPregnant()){
      items.push(['\u{1F48A}','Sulfato de magnésio 4g IV (ataque) + 1-2g/h (manutenção) se eclâmpsia']);
      items.push(['\u{1F4DE}','Acionar obstetrícia IMEDIATO']);
    }
    if(isAnticoagulated()){
      items.push(['\u{1F48A}','Reverter anticoagulação: vitamina K / CCP / idarucizumabe conforme droga']);
      items.push(['\u{1F489}','Coagulograma + INR IMEDIATO']);
    }
    if(hasLowSpO2()){
      items.push(['\u{1F4A8}','O\u2082 suplementar para manter SpO\u2082 \u2265 94%']);
    }
    items.push(['\u{1F3E5}','Internação hospitalar / UTI']);
  }else if(cls.level==='urgent'){
    boxCls='mod-prob';title='Conduta — '+cls.title;
    items=[
      ['\u{1F9E0}','TC de crânio sem contraste'],
    ];
    if(hasTemporalArteritis()){
      items.push(['\u{1F489}','VHS + PCR URGENTE']);
      items.push(['\u{1F48A}','Iniciar corticoide empírico: prednisona 60-80 mg/dia VO — NÃO aguardar biópsia']);
      items.push(['\u{1F4CB}','Encaminhar para biópsia de artéria temporal em até 2 semanas']);
    }
    if((examFindings.has('ex_temporal')||examFindings.has('ex_claudic'))&&isAgeOver40()&&!hasTemporalArteritis()){
      items.push(['\u{1F489}','VHS + PCR urgente — achado de artéria temporal em paciente > 40 anos']);
      items.push(['\u{1F48A}','Considerar prednisona empírica se alta suspeição clínica']);
    }
    if(hasPapilledema()){
      items.push(['\u{1F441}\uFE0F','Angio-TC ou RNM com venografia (trombose venosa cerebral?)']);
      items.push(['\u{1F4CB}','Se pseudotumor cerebri: acetazolamida 250mg VO 8/8h + avaliação oftalmológica']);
    }
    if(hasMeningism()&&!hasFever()){
      items.push(['\u{1F489}','Punção lombar se não houver contraindicação (TC antes se déficit focal)']);
    }
    if(isDrowsy()&&hasFever()){
      items.push(['\u{1F48A}','Sonolência + febre: iniciar ATB empírico até exclusão de neuroinfecção']);
      items.push(['\u{1F489}','Punção lombar após TC de crânio']);
    }
    if(vitals.pa==='crisis'){
      items.push(['\u{1F48A}','Redução gradual da PA (25% na 1\u00AA hora): nitroprussiato ou labetalol IV']);
      items.push(['\u{1F50D}','Avaliar lesão de órgão-alvo (ECG, fundo de olho, função renal)']);
    }
    if(isPregnant()&&vitals.pa==='elevada'){
      items.push(['\u{1F48A}','Anti-hipertensivo: nifedipina 10mg VO ou hidralazina 5mg IV']);
      items.push(['\u{1F489}','Proteinúria + hemograma + LDH + transaminases + plaquetas']);
      items.push(['\u{1F4DE}','Avaliação obstétrica']);
    }
    if(isAnticoagulated()){
      items.push(['\u{1F489}','Coagulograma + INR']);
      items.push(['\u{1F9E0}','TC de crânio mesmo com quadro aparentemente benigno']);
    }
    if(examFindings.has('ex_parncraniano')){
      items.push(['\u{1F9E0}','Angio-TC/RNM: excluir aneurisma compressivo (especialmente NC III com midríase)']);
    }
    if(hasRetinalHemorrhage()){
      items.push(['\u{1F441}\uFE0F','Avaliação oftalmológica urgente']);
    }
    if(hasLowSpO2()){
      items.push(['\u{1F4A8}','O\u2082 suplementar + investigar causa de hipoxemia']);
    }
    items.push(['\u{1F4CA}','Observação e reavaliação antes da alta']);
  }else if(cls.level==='low_flags'){
    boxCls='neutra-prob';title='Conduta — Baixo Risco com Red Flags';
    items=[
      ['\u{1F50D}','Avaliar cada red flag individualmente'],
      ['\u{1F9E0}','Considerar TC de crânio se cefaleia nova em > 50 anos ou primeiro episódio intenso'],
      ['\u{1F489}','Exames laboratoriais conforme suspeita clínica (hemograma, VHS, PCR)'],
      ['\u{1F48A}','Analgesia: dipirona 1g IV ou cetoprofeno 100mg IV'],
      ['\u{1F4CB}','Orientar sinais de alarme e retorno imediato se piora'],
      ['\u{1F4CA}','Observação por 4-6h; reavaliação obrigatória antes da alta'],
    ];
    if(isPregnant()){
      items.push(['\u26A0\uFE0F','Gestante: evitar AINEs no 3\u00BA trimestre. Preferir paracetamol.']);
    }
  }else{
    boxCls='baixa-prob';title='Conduta — Cefaleia Primária';
    items=[
      ['\u2705','Exame neurológico normal — sem indicação de neuroimagem'],
    ];
    if(hasMigraineFeatures()){
      items.push(['\u{1F48A}','Migrânea aguda: metoclopramida 10mg IV + dipirona 1g IV (ou cetoprofeno 100mg IV)']);
      items.push(['\u{1F48A}','Se refratário: sumatriptano 50-100mg VO (ou 6mg SC). Contraindicado se doença coronariana.']);
      if(isPregnant()){
        items.push(['\u26A0\uFE0F','Gestante: evitar triptanos e AINEs. Preferir metoclopramida + paracetamol.']);
      }
      items.push(['\u{1F4CB}','Se \u2265 3 crises/mês ou > 6 dias/mês: encaminhar para profilaxia ambulatorial']);
    }else{
      items.push(['\u{1F48A}','Analgesia: dipirona 1g IV, ou ibuprofeno 400-600mg VO, ou cetoprofeno 100mg IV']);
      if(isPregnant()){
        items.push(['\u26A0\uFE0F','Gestante: evitar AINEs no 3\u00BA trimestre. Preferir paracetamol 1g VO ou dipirona 1g IV.']);
      }
    }
    if(hasAutonomic()){
      items.push(['\u{1F48A}','Cefaleia em salvas: O\u2082 100% 12-15 L/min por 15 min com máscara não reinalante']);
      items.push(['\u{1F48A}','Alternativa: sumatriptano 6mg SC (início rápido)']);
      items.push(['\u{1F4CB}','Se cluster confirmado: encaminhar para profilaxia com verapamil']);
    }
    // Overuse warning
    if(isMedOveruse()){
      items.push(['\u26A0\uFE0F','Cefaleia por abuso medicamentoso provável: orientar redução gradual de analgésicos. Encaminhar para cefaliatria.']);
    }else if(medsTried.size>=2&&!medsTried.has('med_nenhum')){
      items.push(['\u26A0\uFE0F','Atenção para cefaleia por abuso de analgésicos se uso > 10-15 dias/mês']);
    }
    if(medsTried.has('med_opioide')){
      items.push(['\u26A0\uFE0F','Uso de opioide para cefaleia primária: risco alto de cronificação e dependência. Evitar.']);
    }
    items.push(['\u{1F3E0}','Alta com orientações de retorno se piora, febre, déficit neurológico ou cefaleia nova/diferente']);
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${boxCls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open)for(const[icon,text]of items)h+=`<div class="conduta-item"><span class="conduta-icon">${icon}</span><span>${text}</span></div>`;
  h+='</div></div>';
  return h;
}

// =============================================
// WORKUP
// =============================================
function buildWorkup(cls){
  const open=sections.workup;
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('workup')"><h3>Investigação Sugerida</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open){
    let items=[];
    if(cls.level==='emergent'||cls.level==='urgent'){
      items.push({exam:'TC de crânio sem contraste',priority:'Imediato',reason:'Excluir hemorragia, massa, hidrocefalia'});
    }
    if(hasThunderclap()){
      items.push({exam:'Angio-TC cerebral',priority:'Urgente',reason:'Avaliar aneurisma / vasculopatia / dissecção'});
      items.push({exam:'Punção lombar',priority:'Se TC normal > 6h',reason:'Xantocromia — excluir HSA'});
    }
    if(hasMeningism()||hasFever()){
      items.push({exam:'Hemograma + PCR + Lactato',priority:'Urgente',reason:'Processo infeccioso / sepse'});
      items.push({exam:'Punção lombar (líquor)',priority:'Urgente',reason:'Celularidade, proteína, glicose, cultura, Gram, látex'});
      items.push({exam:'Hemoculturas (2 pares)',priority:'Antes do ATB',reason:'Identificar agente etiológico'});
    }
    if(hasTemporalArteritis()||(examFindings.has('ex_temporal')&&isAgeOver40())||(examFindings.has('ex_claudic')&&isAgeOver40())){
      items.push({exam:'VHS',priority:'Urgente',reason:'Elevado (>50 mm/h) na arterite temporal'});
      items.push({exam:'PCR',priority:'Urgente',reason:'Marcador inflamatório'});
      items.push({exam:'Biópsia artéria temporal',priority:'Até 2 semanas',reason:'Confirmação diagnóstica (não atrasar corticoide)'});
    }
    if(hasPapilledema()){
      items.push({exam:'RNM com venografia ou angio-TC venosa',priority:'Urgente',reason:'Excluir trombose venosa cerebral'});
      items.push({exam:'Avaliação oftalmológica',priority:'Urgente',reason:'Perimetria — risco de perda visual'});
    }
    if(hasRetinalHemorrhage()&&!hasPapilledema()){
      items.push({exam:'Fundo de olho detalhado',priority:'Urgente',reason:'Graduar retinopatia — hipertensão maligna?'});
    }
    if(hasFocalDeficit()&&!hasThunderclap()){
      items.push({exam:'RNM de crânio com difusão',priority:'Urgente',reason:'Avaliar lesão estrutural / AVC isquêmico'});
    }
    if(examFindings.has('ex_parncraniano')){
      items.push({exam:'Angio-TC ou angio-RNM',priority:'Urgente',reason:'Excluir aneurisma compressivo'});
    }
    if(hasCushingReflex()){
      items.push({exam:'TC de crânio imediata',priority:'Imediato',reason:'Tríade de Cushing — herniação?'});
    }
    if(vitals.pa==='crisis'){
      items.push({exam:'Função renal + eletrólitos',priority:'Urgente',reason:'Lesão de órgão-alvo'});
      items.push({exam:'Fundo de olho',priority:'Urgente',reason:'Retinopatia hipertensiva'});
      items.push({exam:'ECG',priority:'Urgente',reason:'Sobrecarga ventricular / isquemia'});
    }
    if(isPregnant()&&(vitals.pa==='elevada'||vitals.pa==='crisis')){
      items.push({exam:'Proteinúria (relação P/C ou 24h)',priority:'Urgente',reason:'Critério diagnóstico de pré-eclâmpsia'});
      items.push({exam:'Hemograma + plaquetas + LDH + TGO/TGP',priority:'Urgente',reason:'Síndrome HELLP'});
      items.push({exam:'Ácido úrico',priority:'Urgente',reason:'Marcador de gravidade na pré-eclâmpsia'});
    }
    if(isAnticoagulated()&&(cls.level==='urgent'||cls.level==='emergent')){
      items.push({exam:'Coagulograma + INR',priority:'Imediato',reason:'Nível de anticoagulação'});
    }
    if(cls.level==='low_flags'&&redFlags.has('o2_idade')){
      items.push({exam:'TC de crânio sem contraste',priority:'Considerar',reason:'Cefaleia nova em > 50 anos'});
      items.push({exam:'VHS + PCR',priority:'Considerar',reason:'Excluir arterite temporal'});
    }
    if(cls.level==='low_flags'&&redFlags.has('s_cancer')){
      items.push({exam:'RNM de crânio com contraste',priority:'Considerar',reason:'Metástase cerebral'});
    }
    if(cls.level==='low_flags'&&redFlags.has('s_hiv')){
      items.push({exam:'RNM de crânio com contraste',priority:'Considerar',reason:'Infecção oportunista do SNC (toxoplasmose, criptococose)'});
    }
    if(isDrowsy()&&hasFever()&&cls.level==='urgent'){
      items.push({exam:'Punção lombar',priority:'Urgente',reason:'Sonolência + febre — excluir neuroinfecção'});
    }
    if(items.length===0){
      items.push({exam:'Neuroimagem',priority:'Não indicada',reason:'Cefaleia primária sem red flags, exame normal'});
    }

    for(const item of items){
      const pCls=item.priority==='Imediato'||item.priority==='Antes do ATB'?'dot-red':item.priority==='Urgente'?'dot-yellow':item.priority==='Não indicada'?'dot-green':'dot-blue';
      h+=`<div class="summary-row"><span class="criteria" style="flex:1">${item.exam}<br><span style="font-size:.68rem;color:#475569">${item.reason}</span></span><span class="value"><span class="dot ${pCls}"></span>${item.priority}</span></div>`;
    }
  }
  h+='</div></div>';
  return h;
}

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id,title,badge,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')">`;
  h+=`<h3>${title}${badge||''}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open)h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// CLINICAL NOTE
// =============================================
function buildNoteContent(cls){
  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const ageLabel={'lt18':'< 18','18_39':'18-39','40_49':'40-49','50_64':'50-64','ge65':'\u2265 65'};
  const onsetLabel={'subito':'Súbito (thunderclap)','agudo':'Agudo (minutos a horas)','subagudo':'Subagudo (dias)','cronico':'Crônico (semanas/meses)'};
  const qualLabel={'pulsatil':'Pulsátil','pressao':'Pressão/aperto','pontada':'Pontada/facada','queimacao':'Queimação','outro_q':'Outro'};
  const locLabel={'unilateral':'Unilateral','bilateral':'Bilateral','frontal':'Frontal','occipital':'Occipital','holocraniana':'Holocraniana','periorb':'Periorbital'};
  const durLabel={'seg_min':'Segundos','15min_3h':'15 min - 3h','4_72h':'4 - 72h','gt72h':'> 72h','constante':'Constante'};
  const freqLabel={'primeiro':'Primeiro episódio','recorrente':'Recorrente','diaria':'Diária','cronica':'Crônica (>15d/mês)'};
  const paLabel={'normal':'Normal','elevada':'Elevada (>140/90)','crisis':'Crise hipertensiva (>180/120)'};
  const fcLabel={'normal':'60-100 bpm','taqui':'Taquicardia (>100)','bradi':'Bradicardia (<60)'};
  const tempLabel={'normal':'Normal','subfebril':'Subfebril (37,8-38,5\u00B0C)','fever':'Febre (>38,5\u00B0C)'};
  const gcsLabel={'alert':'Alerta (GCS 15)','drowsy':'Sonolento (GCS 13-14)','reduced':'Rebaixado (GCS \u2264 12)'};
  const spo2Label={'normal':'\u2265 95%','low':'< 95%'};

  let n='';
  n+='CEFALEIA — AVALIAÇÃO ESTRUTURADA NA EMERGÊNCIA\n';
  n+=`Data/hora: ${ts}\n`;
  n+='========================================\n\n';
  n+=`PACIENTE: ${onset.sex==='M'?'Masculino':'Feminino'}, ${ageLabel[onset.age]||'N/I'} anos\n\n`;

  n+='CARACTERÍSTICAS DA CEFALEIA\n';
  n+=`  Início: ${onsetLabel[onset.type]||'N/I'}\n`;
  if(onset.quality)n+=`  Qualidade: ${qualLabel[onset.quality]}\n`;
  if(onset.location)n+=`  Localização: ${locLabel[onset.location]}\n`;
  if(onset.duration)n+=`  Duração: ${durLabel[onset.duration]}\n`;
  if(onset.frequency)n+=`  Frequência: ${freqLabel[onset.frequency]}\n`;
  if(onset.intensity!==null)n+=`  Intensidade (EVA): ${onset.intensity}/10\n`;

  // Meds
  const activeMeds=MED_OPTIONS.filter(m=>medsTried.has(m.id));
  if(activeMeds.length>0){
    n+='  Medicações já tentadas: '+activeMeds.map(m=>m.label).join(', ')+'\n';
  }

  n+='\nRED FLAGS (SNOOP)\n';
  const activeRF=SNOOP_FLAGS.filter(f=>redFlags.has(f.id));
  if(activeRF.length===0)n+='  Nenhuma red flag identificada.\n';
  else for(const f of activeRF)n+=`  [${f.letter}] ${f.label}\n`;

  if(hasThunderclap()||onset.type==='subito'){
    n+='\nREGRA DE OTTAWA PARA HSA\n';
    const activeOt=OTTAWA_CRITERIA.filter(c=>ottawaChecks.has(c.id));
    if(activeOt.length>0){
      n+=`  POSITIVO (${activeOt.length}/6 critérios)\n`;
      for(const c of activeOt)n+=`  [+] ${c.label}\n`;
    }else{
      n+='  NEGATIVO (0/6 critérios) — sensibilidade 100% para HSA\n';
    }
  }

  const activeSym=ASSOC_SYMPTOMS.filter(s=>assocSymptoms.has(s.id));
  if(activeSym.length>0){
    n+='\nSINTOMAS ASSOCIADOS\n';
    for(const s of activeSym)n+=`  - ${s.label}\n`;
  }

  const activeEx=EXAM_FINDINGS.filter(e=>examFindings.has(e.id));
  if(activeEx.length>0){
    n+='\nEXAME FÍSICO\n';
    for(const e of activeEx)n+=`  ${e.severe?'[!]':'[ok]'} ${e.label}\n`;
  }else{
    n+='\nEXAME FÍSICO\n  Não registrado\n';
  }

  n+='\nSINAIS VITAIS\n';
  if(vitals.pa)n+=`  PA: ${paLabel[vitals.pa]}\n`;
  if(vitals.fc)n+=`  FC: ${fcLabel[vitals.fc]}\n`;
  if(vitals.temp)n+=`  Temperatura: ${tempLabel[vitals.temp]}\n`;
  if(vitals.spo2)n+=`  SpO\u2082: ${spo2Label[vitals.spo2]}\n`;
  if(vitals.gcs)n+=`  Consciência: ${gcsLabel[vitals.gcs]}\n`;
  if(!vitals.pa&&!vitals.fc&&!vitals.temp&&!vitals.gcs&&!vitals.spo2)n+='  Não registrados\n';

  n+=`\nCLASSIFICAÇÃO: ${cls.title}\n`;
  n+=`Red flags: ${redFlagCount()}\n`;
  n+='Diagnósticos suspeitos:\n';
  for(const d of cls.dx)n+=`  - ${d}\n`;

  // Disposition in note
  if(cls.level==='emergent')n+='\nDISPOSIÇÃO: Internação hospitalar / UTI\n';
  else if(cls.level==='urgent')n+='\nDISPOSIÇÃO: Observação + investigação complementar\n';
  else if(cls.level==='low_flags')n+='\nDISPOSIÇÃO: Observação 4-6h, reavaliação antes da alta\n';
  else n+='\nDISPOSIÇÃO: Alta com orientações\n';

  n+='\n--- Gerado por MedStack (ferramenta de apoio clínico) ---\n';

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">\u{1F4CB} Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el)return;
  const text=el.textContent||el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showCopied()).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showCopied();}catch(e){}
  document.body.removeChild(ta);
}
function showCopied(){
  const btn=document.getElementById('copyBtn');
  if(!btn)return;
  btn.textContent='\u2713 Copiado!';btn.classList.add('copied');
  setTimeout(()=>{if(btn){btn.textContent='\u{1F4CB} Copiar nota';btn.classList.remove('copied');}},2000);
}

// =============================================
// ACTIONS
// =============================================
function setOnset(field,val){
  if(field==='intensity'){onset.intensity=val;}
  else{onset[field]=val;}
  // Auto-sync age-derived flags for next step
  syncAgeDerivedFlags();
  render();
}
function syncAgeDerivedFlags(){
  // Auto-add "older age" SNOOP flag if age > 50
  if(isAgeOver50()){
    redFlags.add('o2_idade');
  }else{
    redFlags.delete('o2_idade');
  }
  // Auto-sync Ottawa age criterion
  if(isAgeOver40()&&(onset.type==='subito'||hasThunderclap())){
    ottawaChecks.add('ot_age40');
  }else{
    ottawaChecks.delete('ot_age40');
  }
  // Auto-sync Ottawa thunderclap criterion
  if(onset.type==='subito'){
    ottawaChecks.add('ot_thunder');
  }
}
function toggleMed(id){
  if(id==='med_nenhum'){
    if(medsTried.has('med_nenhum')){medsTried.delete('med_nenhum');}
    else{medsTried.clear();medsTried.add('med_nenhum');}
  }else{
    medsTried.delete('med_nenhum');
    medsTried.has(id)?medsTried.delete(id):medsTried.add(id);
  }
  render();
}
function toggleRedFlag(id){
  redFlags.has(id)?redFlags.delete(id):redFlags.add(id);
  // Sync thunderclap with Ottawa
  if(id==='o_subita'){
    if(redFlags.has('o_subita'))ottawaChecks.add('ot_thunder');
    else ottawaChecks.delete('ot_thunder');
  }
  render();
}
function toggleOttawa(id){ottawaChecks.has(id)?ottawaChecks.delete(id):ottawaChecks.add(id);render();}
function toggleSymptom(id){assocSymptoms.has(id)?assocSymptoms.delete(id):assocSymptoms.add(id);render();}
function toggleExam(id){
  if(id==='ex_normal'){
    if(examFindings.has('ex_normal')){examFindings.delete('ex_normal');}
    else{examFindings.clear();examFindings.add('ex_normal');}
  }else{
    examFindings.delete('ex_normal');
    examFindings.has(id)?examFindings.delete(id):examFindings.add(id);
  }
  render();
}
function setVital(field,val){vitals[field]=val;render();}
function toggleSection(id){sections[id]=!sections[id];render();}

function goToStep(step){
  if(step<0||step>TOTAL_STEPS)return;
  if(step>maxStepReached)return;
  currentStep=step;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function next(){
  if(currentStep===0&&(onset.type===null||onset.age===null||onset.sex===null))return;
  currentStep++;
  if(currentStep>maxStepReached)maxStepReached=currentStep;
  // Auto-sync derived flags when entering red flags step
  if(currentStep===1)syncAgeDerivedFlags();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){
  if(currentStep>0){
    currentStep--;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}
function restart(){
  if(!confirm('Recomeçar a avaliação? Todos os dados serão apagados.'))return;
  currentStep=0;
  maxStepReached=0;
  onset={type:null,duration:null,location:null,quality:null,frequency:null,age:null,sex:null,intensity:null};
  medsTried=new Set();
  redFlags=new Set();ottawaChecks=new Set();assocSymptoms=new Set();examFindings=new Set();
  vitals={pa:null,fc:null,temp:null,gcs:null,spo2:null};
  sections={snoop:true,ottawa:false,symptoms:false,exam:false,vitals:false,classification:true,conduta:true,workup:true,note:true,disposition:true};
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
