<!-- VERSION: 6 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dor de Cabeça — Avaliação na Emergência</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
  header{background:linear-gradient(135deg,#1e293b 0%,#0f2744 50%,#1e293b 100%);width:100%;padding:1.25rem 1.5rem;text-align:center;border-bottom:2px solid #3b82f6;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  header h1{font-size:1.4rem;font-weight:700;color:#f1f5f9;letter-spacing:-.02em}
  header p{font-size:.75rem;color:#64748b;margin-top:.25rem;letter-spacing:.02em}
  .back-link{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#64748b;text-decoration:none;font-size:.8rem;font-weight:500;transition:all .25s;display:flex;align-items:center;gap:.3rem;padding:.4rem .6rem;border-radius:.5rem}
  .back-link:hover{color:#f1f5f9;background:rgba(255,255,255,.05)}
  .back-link:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .container{max-width:700px;width:100%;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))}

  /* Progress bar */
  .progress-bar{display:flex;align-items:center;gap:.3rem;padding:0 .25rem}
  .progress-step{flex:1;height:4px;border-radius:3px;background:#1e293b;transition:background .4s,transform .3s;cursor:default}
  .progress-step.clickable{cursor:pointer}
  .progress-step.done{background:#3b82f6}
  .progress-step.active{background:#60a5fa;animation:pulse-bar 2s ease-in-out infinite}
  .progress-step.clickable:hover{opacity:.8}
  @keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.55}}
  .progress-labels{display:flex;justify-content:space-between;font-size:.55rem;color:#475569;padding:.3rem .25rem 0;user-select:none}
  .progress-labels span{transition:color .2s;padding:.15rem .1rem}
  .progress-labels span.clickable{cursor:pointer}
  .progress-labels span.clickable:hover{color:#94a3b8}
  .progress-labels span.active-label{color:#93c5fd;font-weight:700}
  .progress-labels span.done-label{color:#3b82f6;font-weight:600}

  /* Cards */
  .card{background:#1e293b;border:1px solid #334155;border-radius:1rem;padding:1.75rem 1.5rem;animation:fadeSlideIn .35s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 24px rgba(0,0,0,.2)}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-size:1.15rem;color:#f8fafc;margin-bottom:.25rem;font-weight:700;letter-spacing:-.01em}
  .card .subtitle{font-size:.78rem;color:#64748b;margin-bottom:1.25rem;line-height:1.4}

  /* Step indicator */
  .step-indicator{display:inline-flex;align-items:center;gap:.4rem;font-size:.62rem;color:#475569;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem;font-weight:600}
  .step-indicator .step-num{background:#334155;color:#94a3b8;width:1.3rem;height:1.3rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.6rem}

  /* Options container */
  .options{display:flex;flex-direction:column;gap:.6rem}
  .option-group-label{font-size:.63rem;text-transform:uppercase;letter-spacing:.1em;color:#475569;margin-top:.75rem;margin-bottom:-.1rem;font-weight:700}
  .option-group-label:first-child{margin-top:0}

  /* Option buttons (single select) */
  .option-btn{background:#0f172a;border:1.5px solid #1e293b;border-radius:.75rem;padding:.85rem 1.1rem;color:#94a3b8;font-size:.9rem;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);text-align:left;display:flex;align-items:center;gap:.75rem;-webkit-tap-highlight-color:transparent}
  .option-btn:hover{border-color:#3b82f6;color:#cbd5e1}
  .option-btn:active{transform:scale(.98)}
  .option-btn:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .option-btn.selected{border-color:#3b82f6;background:linear-gradient(135deg,#1e3a5f,#172554);color:#f1f5f9;box-shadow:0 0 0 1px rgba(59,130,246,.2)}
  .option-btn .icon{font-size:1.15rem;flex-shrink:0;width:1.75rem;text-align:center}
  .option-btn .label{flex:1}
  .option-btn .tag{font-size:.58rem;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .55rem;border-radius:9999px;font-weight:700;flex-shrink:0}
  .tag-red{background:#7f1d1d;color:#fca5a5}.tag-yellow{background:#78350f;color:#fcd34d}.tag-green{background:#14532d;color:#86efac}.tag-blue{background:#1e3a5f;color:#93c5fd}

  /* Checkbox buttons */
  .check-btn{background:#0f172a;border:1.5px solid #1e293b;border-radius:.75rem;padding:.7rem 1rem;color:#94a3b8;font-size:.85rem;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);text-align:left;display:flex;align-items:center;gap:.7rem;-webkit-tap-highlight-color:transparent}
  .check-btn:hover{border-color:#3b82f6;color:#cbd5e1}
  .check-btn:active{transform:scale(.98)}
  .check-btn:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .check-btn.checked{border-color:#3b82f6;background:linear-gradient(135deg,#1e3a5f,#172554);color:#f1f5f9}
  .check-btn.checked.red-flag{border-color:#ef4444;background:linear-gradient(135deg,#450a0a,#3b0000)}
  .check-btn.disabled-dim{opacity:.35;pointer-events:none}
  .check-box{width:18px;height:18px;border:2px solid #334155;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:.7rem}
  .check-btn.checked .check-box{background:#3b82f6;border-color:#3b82f6}
  .check-btn.checked.red-flag .check-box{background:#ef4444;border-color:#ef4444}

  /* Score/chip buttons */
  .score-opt{flex:1;padding:.55rem .35rem;border-radius:.5rem;font-size:.72rem;cursor:pointer;border:1.5px solid #1e293b;background:#0f172a;color:#64748b;text-align:center;transition:all .2s;line-height:1.25;font-weight:500;-webkit-tap-highlight-color:transparent;min-height:2.2rem;display:inline-flex;align-items:center;justify-content:center}
  .score-opt:hover{border-color:#3b82f6;color:#cbd5e1;background:#0f1d32}
  .score-opt:active{transform:scale(.96)}
  .score-opt:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .score-opt.picked{border-color:#3b82f6;background:linear-gradient(135deg,#1e3a5f,#172554);color:#f1f5f9;font-weight:700}

  /* Pain scale */
  .pain-scale{display:flex;gap:.3rem;margin-top:.3rem;flex-wrap:wrap;justify-content:center}
  .pain-dot{width:2.1rem;height:2.1rem;border-radius:50%;border:2px solid #1e293b;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .2s;color:#475569;background:#0f172a;-webkit-tap-highlight-color:transparent}
  .pain-dot:hover{transform:scale(1.08);border-color:#3b82f6}
  .pain-dot:active{transform:scale(.92)}
  .pain-dot:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .pain-dot.picked{color:#fff;transform:scale(1.08);box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .pain-dot.p-low{border-color:#22c55e;background:#22c55e;color:#052e16}
  .pain-dot.p-mod{border-color:#f59e0b;background:#f59e0b;color:#451a03}
  .pain-dot.p-high{border-color:#ef4444;background:#ef4444;color:#fff}
  .pain-dot.hint-low{border-color:rgba(34,197,94,.22)}
  .pain-dot.hint-mod{border-color:rgba(245,158,11,.22)}
  .pain-dot.hint-high{border-color:rgba(239,68,68,.22)}
  .pain-labels{display:flex;justify-content:space-between;padding:.3rem .2rem 0;font-size:.6rem;color:#475569}

  /* Navigation */
  .nav-row{display:flex;gap:.65rem;margin-top:1.25rem}
  .nav-btn{flex:1;padding:.85rem;border-radius:.75rem;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
  .nav-btn:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
  .nav-btn.secondary{background:#334155;color:#cbd5e1}.nav-btn.secondary:hover{background:#475569}
  .nav-btn.primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 2px 12px rgba(59,130,246,.25)}.nav-btn.primary:hover{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
  .nav-btn:active{transform:scale(.98)}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed;transform:none!important;box-shadow:none!important}

  /* Validation hint */
  .validation-hint{font-size:.68rem;color:#f87171;margin-top:.5rem;display:flex;align-items:center;gap:.3rem;animation:fadeSlideIn .3s}

  /* Result page */
  .result-card{text-align:center;padding:2rem 1.5rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:4.5rem;height:4.5rem;border-radius:50%;font-size:1.85rem;font-weight:800;margin-bottom:.85rem;animation:badgePop .5s cubic-bezier(.4,0,.2,1)}
  @keyframes badgePop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .badge-emergent{background:linear-gradient(135deg,#991b1b,#7f1d1d);color:#fca5a5;border:3px solid #ef4444;box-shadow:0 0 24px rgba(239,68,68,.3)}
  .badge-urgent{background:linear-gradient(135deg,#92400e,#78350f);color:#fcd34d;border:3px solid #f59e0b;box-shadow:0 0 24px rgba(245,158,11,.2)}
  .badge-low{background:linear-gradient(135deg,#166534,#14532d);color:#86efac;border:3px solid #22c55e;box-shadow:0 0 24px rgba(34,197,94,.2)}
  .badge-primary{background:linear-gradient(135deg,#1e40af,#1e3a5f);color:#93c5fd;border:3px solid #3b82f6;box-shadow:0 0 24px rgba(59,130,246,.2)}
  .result-title{font-size:1.35rem;font-weight:800;margin-bottom:.2rem;letter-spacing:-.02em}
  .result-desc{color:#64748b;font-size:.85rem;margin-bottom:1.25rem}

  /* Dark box / collapsible */
  .dark-box{background:#1e293b;border:1px solid #334155;border-radius:.75rem;padding:1rem 1.25rem;transition:all .3s}
  .dark-box h3{font-size:.72rem;color:#475569;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem;font-weight:700}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid rgba(51,65,85,.5);font-size:.82rem;gap:.5rem}
  .summary-row:last-child{border-bottom:none}
  .summary-row .criteria{color:#94a3b8;flex:1;min-width:0}
  .summary-row .value{font-weight:600;display:flex;align-items:center;gap:.4rem;flex-shrink:0;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-red{background:#ef4444}.dot-yellow{background:#f59e0b}.dot-green{background:#22c55e}.dot-blue{background:#3b82f6}

  /* Conduta box */
  .conduta-box{border-radius:.75rem;padding:1rem 1.25rem;text-align:left}
  .conduta-box h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:0;font-weight:700}
  .conduta-box.alta-prob{background:linear-gradient(135deg,#450a0a,#3b0000);border:1.5px solid #991b1b}.conduta-box.alta-prob h3{color:#fca5a5}
  .conduta-box.mod-prob{background:linear-gradient(135deg,#451a03,#422006);border:1.5px solid #78350f}.conduta-box.mod-prob h3{color:#fcd34d}
  .conduta-box.baixa-prob{background:linear-gradient(135deg,#052e16,#04260f);border:1.5px solid #14532d}.conduta-box.baixa-prob h3{color:#86efac}
  .conduta-box.neutra-prob{background:#1e293b;border:1.5px solid #334155}.conduta-box.neutra-prob h3{color:#94a3b8}
  .conduta-item{display:flex;align-items:flex-start;gap:.55rem;padding:.4rem 0;font-size:.82rem;color:#cbd5e1;line-height:1.45}
  .conduta-icon{flex-shrink:0;width:1.15rem;text-align:center;font-size:.88rem}

  /* Collapsible */
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:.15rem 0;border-radius:.5rem;transition:opacity .2s;-webkit-tap-highlight-color:transparent}
  .collapse-header:hover{opacity:.8}
  .collapse-header h3{margin-bottom:0}
  .collapse-arrow{font-size:.65rem;color:#475569;transition:transform .3s cubic-bezier(.4,0,.2,1);width:1.3rem;height:1.3rem;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.03)}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s}
  .collapse-body.hidden{max-height:0!important;padding-top:0;margin-top:0;opacity:0}
  .collapse-body.visible{max-height:5000px;opacity:1}

  /* Section badge count */
  .section-badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.3rem;height:1.3rem;padding:0 .35rem;border-radius:9999px;font-size:.58rem;font-weight:700;margin-left:.5rem;vertical-align:middle}
  .section-badge.sb-red{background:#7f1d1d;color:#fca5a5}
  .section-badge.sb-yellow{background:#78350f;color:#fcd34d}
  .section-badge.sb-green{background:#14532d;color:#86efac}
  .section-badge.sb-blue{background:#1e3a5f;color:#93c5fd}
  .section-badge.sb-neutral{background:#334155;color:#94a3b8}

  /* Note */
  .note-text{background:#020617;border:1px solid #1e293b;border-radius:.5rem;padding:1rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.7rem;color:#94a3b8;white-space:pre-wrap;line-height:1.6;max-height:360px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .note-text::-webkit-scrollbar{width:4px}.note-text::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.75rem;padding:.75rem;border-radius:.5rem;border:1.5px solid #334155;background:#1e293b;color:#cbd5e1;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
  .copy-btn:hover{border-color:#3b82f6;background:#172040;color:#f1f5f9}
  .copy-btn:active{transform:scale(.98)}
  .copy-btn:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
  .copy-btn.copied{border-color:#22c55e;background:#052e16;color:#86efac}

  /* Alert boxes */
  .alert-box{border-radius:.7rem;padding:.85rem 1rem;margin-bottom:.65rem;display:flex;align-items:flex-start;gap:.7rem;font-size:.8rem;line-height:1.45}
  .alert-box.alert-red{background:linear-gradient(135deg,#450a0a,#3b0000);border:1.5px solid #991b1b;color:#fca5a5}
  .alert-box.alert-yellow{background:linear-gradient(135deg,#451a03,#422006);border:1.5px solid #78350f;color:#fcd34d}
  .alert-box.alert-green{background:linear-gradient(135deg,#052e16,#04260f);border:1.5px solid #14532d;color:#86efac}
  .alert-box .alert-icon{font-size:1rem;flex-shrink:0;margin-top:.1rem}
  .alert-box .alert-text{flex:1}
  .alert-box .alert-text strong{display:block;margin-bottom:.2rem;font-size:.88rem}

  /* SNOOP letters */
  .snoop-letter{display:inline-flex;align-items:center;justify-content:center;width:1.4rem;height:1.4rem;border-radius:.35rem;font-weight:800;font-size:.68rem;margin-right:.4rem;flex-shrink:0}
  .snoop-s{background:#7f1d1d;color:#fca5a5}
  .snoop-n{background:#78350f;color:#fcd34d}
  .snoop-o{background:#991b1b;color:#fca5a5}
  .snoop-o2{background:#4c1d95;color:#c4b5fd}
  .snoop-p{background:#7c2d12;color:#fdba74}

  /* Ottawa box */
  .ottawa-box{background:#0f172a;border:1.5px solid #334155;border-radius:.75rem;padding:1rem 1.15rem;margin-top:.85rem}
  .ottawa-box h4{font-size:.82rem;color:#f8fafc;margin-bottom:.35rem;font-weight:700}
  .ottawa-box>p{font-size:.7rem;color:#64748b;margin-bottom:.65rem;line-height:1.45}
  .ottawa-result{display:flex;align-items:center;gap:.85rem;padding:.85rem;border-radius:.65rem;margin-top:.65rem}
  .ottawa-result.or-high{background:linear-gradient(135deg,#450a0a,#3b0000);border:1px solid #7f1d1d}
  .ottawa-result.or-low{background:linear-gradient(135deg,#052e16,#04260f);border:1px solid #14532d}
  .ottawa-num{font-size:1.4rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace;min-width:1.8rem;text-align:center}
  .ottawa-result.or-high .ottawa-num{color:#fca5a5}
  .ottawa-result.or-low .ottawa-num{color:#86efac}
  .ottawa-info{flex:1}.ottawa-info .oi-label{font-size:.82rem;font-weight:700;color:#f1f5f9}
  .ottawa-info .oi-detail{font-size:.7rem;color:#94a3b8;margin-top:.2rem;line-height:1.45}

  /* Red flag count badge */
  .rf-count{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .7rem;border-radius:9999px;font-size:.78rem;font-weight:700;margin-bottom:1rem}
  .rf-count.rf-high{background:#7f1d1d;color:#fca5a5}.rf-count.rf-mod{background:#78350f;color:#fcd34d}.rf-count.rf-none{background:#14532d;color:#86efac}

  /* Inline alert */
  .inline-alert{border-radius:.6rem;padding:.6rem .8rem;margin-top:.5rem;font-size:.76rem;line-height:1.4;display:flex;align-items:flex-start;gap:.5rem;animation:fadeSlideIn .3s}
  .inline-alert.ia-red{background:rgba(127,29,29,.3);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
  .inline-alert.ia-blue{background:rgba(30,58,95,.3);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
  .inline-alert.ia-yellow{background:rgba(120,53,15,.3);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
  .inline-alert .ia-icon{flex-shrink:0;font-size:.85rem}

  /* Disposition */
  .disposition-box{border-radius:.75rem;padding:1rem 1.15rem;text-align:center;margin-bottom:.75rem;border:2px solid}
  .disp-emergent{background:linear-gradient(135deg,#450a0a,#3b0000);border-color:#ef4444}
  .disp-urgent{background:linear-gradient(135deg,#451a03,#422006);border-color:#f59e0b}
  .disp-obs{background:linear-gradient(135deg,#1e293b,#1a2332);border-color:#3b82f6}
  .disp-alta{background:linear-gradient(135deg,#052e16,#04260f);border-color:#22c55e}
  .disposition-box .disp-icon{font-size:1.4rem;margin-bottom:.25rem}
  .disposition-box .disp-title{font-size:.92rem;font-weight:700;margin-bottom:.15rem}
  .disposition-box .disp-desc{font-size:.76rem;color:#94a3b8;line-height:1.4}

  /* Auto-flag hint */
  .auto-flag-hint{font-size:.65rem;color:#64748b;font-style:italic;margin-top:.2rem;padding-left:.4rem;display:flex;align-items:center;gap:.35rem}
  .auto-flag-hint .dot-auto{width:5px;height:5px;border-radius:50%;background:#3b82f6;flex-shrink:0}

  /* Footer disclaimer */
  .disclaimer{text-align:center;padding:1.25rem 1.5rem 2rem;font-size:.65rem;color:#334155;line-height:1.5;max-width:600px}

  /* Selection summary chips */
  .selection-summary{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.75rem;padding-top:.75rem;border-top:1px solid rgba(51,65,85,.5)}
  .selection-chip{font-size:.6rem;color:#94a3b8;background:#0f172a;border:1px solid #334155;border-radius:9999px;padding:.2rem .5rem;display:inline-flex;align-items:center;gap:.25rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .selection-chip .chip-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
  .selection-chip.chip-red .chip-dot{background:#ef4444}
  .selection-chip.chip-blue .chip-dot{background:#3b82f6}
  .selection-chip.chip-yellow .chip-dot{background:#f59e0b}
  .selection-chip.chip-green .chip-dot{background:#22c55e}

  /* Print */
  @media print{
    body{background:#fff;color:#000}
    header,.progress-bar,.progress-labels,.nav-row,.copy-btn,.disclaimer,.back-link,.disposition-box{display:none!important}
    .card,.dark-box,.conduta-box{background:#fff!important;border:1px solid #ccc!important;box-shadow:none!important;color:#000!important;break-inside:avoid}
    .card h2,.result-title,.conduta-box h3,.dark-box h3{color:#000!important}
    .card .subtitle,.result-desc{color:#555!important}
    .note-text{background:#f9f9f9!important;border:1px solid #ccc!important;color:#000!important;max-height:none!important;font-size:9pt}
    .summary-row{border-color:#ddd!important}
    .summary-row .criteria{color:#333!important}
    .summary-row .value{color:#000!important}
    .conduta-item{color:#222!important}
    .result-badge{border-width:2px!important;box-shadow:none!important}
    .collapse-body.hidden{max-height:none!important;opacity:1!important}
    .collapse-arrow{display:none!important}
    .container{max-width:100%;padding:0}
    .rf-count{color:#000!important;background:#eee!important}
  }

  /* Responsive */
  @media(max-width:500px){
    .container{padding:.85rem;padding-bottom:calc(.85rem + env(safe-area-inset-bottom,0px))}

<body>
<header>
  <a href="../dor-de-cabeca.html" class="back-link" aria-label="Voltar">&larr; <span class="back-text">Voltar</span></a>
  <h1>Avaliação de Cefaleia</h1>
  <p>SNOOP + Ottawa SAH + conduta</p>
</header>
<div class="container" id="app"></div>
<div class="disclaimer" id="disclaimer"></div>
<script>
// =============================================
// DATA
// =============================================
const STEP_LABELS=['História','Red Flags','Sintomas','Exame','Vitais','Resultado'];
const TOTAL_STEPS=6;

const SNOOP_FLAGS=[
  {id:'s_febre',letter:'S',label:'Febre, perda de peso, sudorese noturna',cls:'snoop-s',cat:'Sistêmicos'},
  {id:'s_hiv',letter:'S',label:'HIV ou imunossupressão',cls:'snoop-s',cat:'Sistêmicos'},
  {id:'s_cancer',letter:'S',label:'História de neoplasia',cls:'snoop-s',cat:'Sistêmicos'},
  {id:'s_gestante',letter:'S',label:'Gestante ou puérpera',cls:'snoop-s',cat:'Sistêmicos'},
  {id:'s_anticoag',letter:'S',label:'Uso de anticoagulante ou coagulopatia',cls:'snoop-s',cat:'Sistêmicos'},
  {id:'n_focal',letter:'N',label:'Déficit neurológico focal',cls:'snoop-n',cat:'Neurológicos'},
  {id:'n_confusao',letter:'N',label:'Confusão mental ou rebaixamento',cls:'snoop-n',cat:'Neurológicos'},
  {id:'n_convulsao',letter:'N',label:'Convulsão',cls:'snoop-n',cat:'Neurológicos'},
  {id:'o_subita',letter:'O',label:'Início súbito (pico em segundos/minutos)',cls:'snoop-o',cat:'Onset (thunderclap)'},
  {id:'o_pior',letter:'O',label:'"Pior cefaleia da vida"',cls:'snoop-o',cat:'Onset (thunderclap)'},
  {id:'o2_idade',letter:'O',label:'Idade > 50 anos com cefaleia nova',cls:'snoop-o2',cat:'Older age (> 50)'},
  {id:'p_progressiva',letter:'P',label:'Cefaleia progressiva (dias/semanas)',cls:'snoop-p',cat:'Mudança de padrão'},
  {id:'p_postural',letter:'P',label:'Piora com postura / Valsalva / esforço',cls:'snoop-p',cat:'Mudança de padrão'},
  {id:'p_desperta',letter:'P',label:'Desperta o paciente do sono',cls:'snoop-p',cat:'Mudança de padrão'},
  {id:'p_trauma',letter:'P',label:'Trauma craniano recente',cls:'snoop-p',cat:'Mudança de padrão'},
];

const OTTAWA_CRITERIA=[
  {id:'ot_age40',label:'Idade ≥ 40 anos'},
  {id:'ot_neck',label:'Dor ou rigidez cervical'},
  {id:'ot_witness',label:'Perda de consciência testemunhada'},
  {id:'ot_onset_effort',label:'Início durante esforço físico'},
  {id:'ot_thunder',label:'Cefaleia thunderclap (pico instantâneo)'},
  {id:'ot_flexion',label:'Limitação da flexão cervical ao exame'},
];

const ASSOC_SYMPTOMS=[
  {id:'as_nausea',label:'Náuseas / vômitos',cat:'Gerais'},
  {id:'as_foto',label:'Fotofobia',cat:'Gerais'},
  {id:'as_fono',label:'Fonofobia',cat:'Gerais'},
  {id:'as_aura',label:'Aura visual (escotomas, fosfenos)',cat:'Gerais'},
  {id:'as_osmofobia',label:'Osmofobia',cat:'Gerais'},
  {id:'as_lacrimej',label:'Lacrimejamento / hiperemia ipsilateral',cat:'Autonômicos'},
  {id:'as_rinorreia',label:'Rinorreia / congestão nasal ipsilateral',cat:'Autonômicos'},
  {id:'as_ptose',label:'Ptose / miose ipsilateral',cat:'Autonômicos'},
  {id:'as_inquietude',label:'Inquietude / agitação durante a crise',cat:'Autonômicos'},
  {id:'as_rigidez',label:'Rigidez de nuca',cat:'Meningismo'},
  {id:'as_kernig',label:'Kernig / Brudzinski positivo',cat:'Meningismo'},
  {id:'as_rash',label:'Rash / petéquias',cat:'Meningismo'},
  {id:'as_diplopia',label:'Diplopia ou perda visual',cat:'Neurológico'},
  {id:'as_fraqueza',label:'Fraqueza / parestesia focal',cat:'Neurológico'},
  {id:'as_afasia',label:'Afasia / disartria',cat:'Neurológico'},
  {id:'as_ataxia',label:'Ataxia / vertigem intensa',cat:'Neurológico'},
  {id:'as_sincope',label:'Síncope',cat:'Neurológico'},
  {id:'as_campovisu',label:'Defeito de campo visual',cat:'Neurológico'},
  {id:'as_dorcervical',label:'Dor cervical intensa',cat:'Vasculares'},
  {id:'as_horner',label:'Síndrome de Horner (ptose + miose + anidrose)',cat:'Vasculares'},
];

const EXAM_FINDINGS=[
  {id:'ex_papil',label:'Papiledema na fundoscopia',cat:'Fundoscopia',severe:true},
  {id:'ex_hemorr',label:'Hemorragia retiniana',cat:'Fundoscopia',severe:true},
  {id:'ex_focal',label:'Déficit motor ou sensitivo focal',cat:'Neurológico',severe:true},
  {id:'ex_ataxia',label:'Ataxia de marcha',cat:'Neurológico',severe:true},
  {id:'ex_dismetria',label:'Dismetria / disdiadococinesia',cat:'Neurológico',severe:true},
  {id:'ex_anisocoria',label:'Anisocoria / déficit pupilar',cat:'Neurológico',severe:true},
  {id:'ex_parncraniano',label:'Paralisia de nervo craniano (III, VI, VII)',cat:'Neurológico',severe:true},
  {id:'ex_campovisu',label:'Defeito de campo visual ao confronto',cat:'Neurológico',severe:true},
  {id:'ex_meningismo',label:'Rigidez de nuca ao exame',cat:'Sinais meníngeos',severe:true},
  {id:'ex_kernig',label:'Kernig / Brudzinski positivo',cat:'Sinais meníngeos',severe:true},
  {id:'ex_temporal',label:'Artéria temporal dolorosa / endurecida',cat:'Palpação',severe:true},
  {id:'ex_claudic',label:'Claudicação mandibular',cat:'Palpação',severe:true},
  {id:'ex_seio',label:'Dor à palpação de seios da face',cat:'Palpação',severe:false},
  {id:'ex_trigger',label:'Ponto-gatilho cervical / trapézio',cat:'Palpação',severe:false},
  {id:'ex_normal',label:'Exame neurológico completamente normal',cat:'Normal',severe:false},
];

const MED_OPTIONS=[
  {id:'med_dipirona',label:'Dipirona'},
  {id:'med_paracetamol',label:'Paracetamol'},
  {id:'med_aine',label:'AINE'},
  {id:'med_triptano',label:'Triptano'},
  {id:'med_opioide',label:'Opioide'},
  {id:'med_nenhum',label:'Nenhuma'},
];

// =============================================
// STATE
// =============================================
let currentStep=0;
let maxStepReached=0;
let onset={type:null,duration:null,location:null,quality:null,frequency:null,age:null,sex:null,intensity:null,knownPrimary:false};
let medsTried=new Set();
let redFlags=new Set();
let ottawaChecks=new Set();
let assocSymptoms=new Set();
let examFindings=new Set();
let vitals={pa:null,fc:null,temp:null,gcs:null,spo2:null};
let sections={snoop:true,ottawa:false,symptoms:false,exam:false,vitals:false,conduta:true,workup:true,note:false,ddx:false};
const evalStartTime=new Date();
const app=document.getElementById('app');
const disclaimerEl=document.getElementById('disclaimer');

// =============================================
// HELPERS
// =============================================
function hasThunderclap(){return redFlags.has('o_subita')||redFlags.has('o_pior')||onset.type==='subito'}
function redFlagCount(){return redFlags.size}
function hasMeningism(){return assocSymptoms.has('as_rigidez')||assocSymptoms.has('as_kernig')||examFindings.has('ex_meningismo')||examFindings.has('ex_kernig')}
function hasFocalDeficit(){return redFlags.has('n_focal')||examFindings.has('ex_focal')||examFindings.has('ex_ataxia')||examFindings.has('ex_dismetria')||examFindings.has('ex_anisocoria')||examFindings.has('ex_parncraniano')||examFindings.has('ex_campovisu')||assocSymptoms.has('as_fraqueza')||assocSymptoms.has('as_afasia')||assocSymptoms.has('as_ataxia')||assocSymptoms.has('as_campovisu')}
function hasPapilledema(){return examFindings.has('ex_papil')}
function hasRetinalHemorrhage(){return examFindings.has('ex_hemorr')}
function hasTemporalArteritis(){return (examFindings.has('ex_temporal')||examFindings.has('ex_claudic'))&&redFlags.has('o2_idade')}
function hasFever(){return redFlags.has('s_febre')||vitals.temp==='fever'}
function ottawaPositive(){return ottawaChecks.size>0}
function hasAutonomic(){return assocSymptoms.has('as_lacrimej')||assocSymptoms.has('as_rinorreia')||assocSymptoms.has('as_ptose')||assocSymptoms.has('as_inquietude')}
function hasMigraineFeatures(){return assocSymptoms.has('as_nausea')||assocSymptoms.has('as_foto')||assocSymptoms.has('as_fono')||assocSymptoms.has('as_aura')||assocSymptoms.has('as_osmofobia')}
function isPregnant(){return redFlags.has('s_gestante')}
function isAnticoagulated(){return redFlags.has('s_anticoag')}
function hasTrauma(){return redFlags.has('p_trauma')}
function hasLowSpO2(){return vitals.spo2==='low'}
function hasRash(){return assocSymptoms.has('as_rash')}
function hasCushingReflex(){return vitals.pa==='crisis'&&vitals.fc==='bradi'}
function hasPostural(){return redFlags.has('p_postural')}
function isDrowsy(){return vitals.gcs==='drowsy'}
function hasHorner(){return assocSymptoms.has('as_horner')}
function hasCervicalPain(){return assocSymptoms.has('as_dorcervical')||ottawaChecks.has('ot_neck')}
function hasVisualFieldDefect(){return assocSymptoms.has('as_campovisu')||examFindings.has('ex_campovisu')}

function suspectDissection(){return (hasCervicalPain()||hasHorner())&&(hasFocalDeficit()||hasHorner())&&(onset.type==='subito'||onset.type==='agudo')}
function suspectCVT(){return isPregnant()&&redFlags.has('p_progressiva')&&(hasPapilledema()||hasFocalDeficit()||redFlags.has('n_convulsao'))}
function suspectPituitaryApoplexy(){return onset.type==='subito'&&(hasVisualFieldDefect()||assocSymptoms.has('as_diplopia'))&&!hasMeningism()}
function suspectPRES(){return vitals.pa==='crisis'&&(redFlags.has('n_convulsao')||assocSymptoms.has('as_diplopia')||hasFocalDeficit())}
function suspectIIH(){return hasPapilledema()&&!hasFocalDeficit()&&!hasMeningism()&&!hasThunderclap()&&(hasPostural()||redFlags.has('p_progressiva'))}

function isAgeOver40(){return onset.age==='40_49'||onset.age==='50_64'||onset.age==='ge65'}
function isAgeOver50(){return onset.age==='50_64'||onset.age==='ge65'}

function getRiskLevel(){
  if(hasThunderclap())return 'emergent';
  if(hasMeningism()&&hasFever())return 'emergent';
  if(hasMeningism()&&hasRash())return 'emergent';
  if(hasFocalDeficit()&&redFlags.has('n_confusao'))return 'emergent';
  if(redFlags.has('n_convulsao')&&(hasFocalDeficit()||hasMeningism()||vitals.pa==='crisis'))return 'emergent';
  if(hasPapilledema()&&hasFocalDeficit())return 'emergent';
  if(hasPapilledema()&&(assocSymptoms.has('as_diplopia')||assocSymptoms.has('as_sincope')))return 'emergent';
  if(hasRetinalHemorrhage()&&vitals.pa==='crisis')return 'emergent';
  if(vitals.gcs==='reduced')return 'emergent';
  if(hasCushingReflex())return 'emergent';
  if(hasLowSpO2()&&redFlags.has('n_confusao'))return 'emergent';
  if(isPregnant()&&(vitals.pa==='crisis'||hasFocalDeficit()||redFlags.has('n_convulsao')))return 'emergent';
  if(isAnticoagulated()&&hasTrauma())return 'emergent';
  if(isAnticoagulated()&&hasFocalDeficit())return 'emergent';
  if(suspectDissection())return 'emergent';
  if(suspectPRES())return 'emergent';

  if(redFlagCount()>=3)return 'urgent';
  if(hasFocalDeficit())return 'urgent';
  if(hasMeningism())return 'urgent';
  if(hasPapilledema())return 'urgent';
  if(hasRetinalHemorrhage())return 'urgent';
  if(hasTemporalArteritis())return 'urgent';
  if(redFlags.has('n_confusao'))return 'urgent';
  if(redFlags.has('n_convulsao'))return 'urgent';
  if(isDrowsy()&&(hasFever()||redFlagCount()>0))return 'urgent';
  if(redFlags.has('p_progressiva')&&(redFlags.has('o2_idade')||redFlags.has('s_cancer')))return 'urgent';
  if(hasFever()&&(redFlags.has('s_hiv')||redFlags.has('s_cancer')))return 'urgent';
  if(vitals.pa==='crisis')return 'urgent';
  if(isPregnant()&&vitals.pa==='elevada')return 'urgent';
  if(isAnticoagulated()&&(onset.type==='subito'||onset.type==='agudo'))return 'urgent';
  if(examFindings.has('ex_parncraniano'))return 'urgent';
  if(hasLowSpO2())return 'urgent';
  if((examFindings.has('ex_temporal')||examFindings.has('ex_claudic'))&&!redFlags.has('o2_idade')&&isAgeOver40())return 'urgent';
  if(onset.frequency==='primeiro'&&isAgeOver50()&&onset.intensity!==null&&onset.intensity>=7)return 'urgent';
  if(suspectCVT())return 'urgent';
  if(hasHorner()&&onset.type==='agudo')return 'urgent';

  if(redFlagCount()>0)return 'low_flags';
  return 'primary';
}

function getClassification(){
  const risk=getRiskLevel();
  if(risk==='emergent'){
    let dx=[];
    if(hasThunderclap())dx.push('Hemorragia subaracnoidea');
    if(hasThunderclap()&&onset.frequency==='recorrente')dx.push('RCVS (vasoconstrição cerebral reversível)');
    if(hasMeningism()&&hasFever())dx.push('Meningite / Encefalite');
    if(hasMeningism()&&hasRash())dx.push('Meningococcemia');
    if(hasFocalDeficit()&&!hasThunderclap())dx.push('Lesão expansiva / AVC');
    if(redFlags.has('n_convulsao')&&!isPregnant())dx.push('Lesão estrutural / Status epiléptico');
    if(hasPapilledema())dx.push('Hipertensão intracraniana');
    if(hasCushingReflex())dx.push('Tríade de Cushing — herniação iminente');
    if(hasRetinalHemorrhage()&&vitals.pa==='crisis')dx.push('Hipertensão maligna');
    if(vitals.gcs==='reduced')dx.push('Processo intracraniano agudo');
    if(isPregnant()&&(vitals.pa==='crisis'||redFlags.has('n_convulsao')))dx.push('Eclâmpsia / Pré-eclâmpsia grave');
    if(isAnticoagulated()&&hasTrauma())dx.push('Hematoma intracraniano em anticoagulado');
    if(isAnticoagulated()&&hasFocalDeficit()&&!hasTrauma())dx.push('Hemorragia espontânea em anticoagulado');
    if(suspectDissection())dx.push('Dissecção arterial cervical');
    if(suspectPRES())dx.push('PRES');
    if(suspectPituitaryApoplexy())dx.push('Apoplexia hipofisária');
    if(dx.length===0)dx.push('Cefaleia secundária de alto risco');
    return {level:'emergent',title:'Emergente',badge:'badge-emergent',icon:'\u{1F6A8}',dx,desc:'Investigação imediata obrigatória'};
  }
  if(risk==='urgent'){
    let dx=[];
    if(hasTemporalArteritis())dx.push('Arterite temporal (células gigantes)');
    if(hasPapilledema()&&suspectIIH())dx.push('Hipertensão intracraniana idiopática');
    else if(hasPapilledema())dx.push('Hipertensão intracraniana');
    if(hasRetinalHemorrhage())dx.push('Retinopatia — investigar hipertensão maligna');
    if(hasMeningism()&&!hasFever())dx.push('Irritação meníngea — HSA? viral?');
    if(hasMeningism()&&hasFever())dx.push('Meningite / Encefalite');
    if(hasFocalDeficit())dx.push('Lesão estrutural');
    if(examFindings.has('ex_parncraniano'))dx.push('Paralisia NC — aneurisma? massa?');
    if(redFlags.has('p_progressiva'))dx.push('Cefaleia progressiva — lesão expansiva?');
    if(vitals.pa==='crisis')dx.push('Emergência hipertensiva');
    if(isPregnant()&&vitals.pa==='elevada')dx.push('Pré-eclâmpsia');
    if(isAnticoagulated())dx.push('Hemorragia em anticoagulado');
    if(hasLowSpO2())dx.push('Hipoxemia — avaliar causa sistêmica');
    if(isDrowsy()&&hasFever())dx.push('Sonolência + febre — encefalite?');
    if(onset.frequency==='primeiro'&&isAgeOver50())dx.push('Cefaleia de início novo em > 50 anos');
    if((examFindings.has('ex_temporal')||examFindings.has('ex_claudic'))&&isAgeOver40()&&!hasTemporalArteritis())dx.push('Arterite temporal provável — VHS/PCR');
    if(suspectCVT())dx.push('Trombose venosa cerebral');
    if(hasHorner()&&onset.type==='agudo')dx.push('Dissecção carotídea — angio-TC urgente');
    if(redFlags.has('n_convulsao'))dx.push('Convulsão — avaliar lesão estrutural');
    if(dx.length===0)dx.push('Cefaleia secundária suspeita');
    return {level:'urgent',title:'Urgente',badge:'badge-urgent',icon:'\u26A0\uFE0F',dx,desc:'Investigação antes da alta'};
  }
  if(risk==='low_flags'){
    return {level:'low_flags',title:'Baixo Risco com Red Flags',badge:'badge-urgent',icon:'\u{1F50D}',dx:['Red flags presentes — considerar investigação'],desc:'Avaliar exames conforme achados'};
  }
  let dx=[];
  if(hasAutonomic()&&onset.location==='unilateral'&&onset.duration==='15min_3h')dx.push('Cefaleia em salvas (cluster)');
  else if(hasAutonomic()&&(onset.location==='unilateral'||onset.location==='periorb'))dx.push('Cefaleia trigêmino-autonômica');
  if(hasMigraineFeatures()||(onset.quality==='pulsatil'&&onset.duration==='4_72h'))dx.push('Migrânea');
  if(onset.quality==='pressao'||onset.location==='bilateral')dx.push('Cefaleia tensional');
  if(onset.frequency==='cronica')dx.push('Cefaleia crônica diária');
  if(onset.location==='periorb'&&examFindings.has('ex_seio'))dx.push('Sinusite');
  if(onset.location==='occipital'&&examFindings.has('ex_trigger'))dx.push('Cefaleia cervicogênica');
  if(redFlags.has('p_postural')&&!hasFocalDeficit()&&!hasPapilledema())dx.push('Cefaleia primária por esforço');
  if(isMedOveruse())dx.push('Cefaleia por uso excessivo de analgésicos');
  if(dx.length===0)dx.push('Cefaleia primária inespecífica');
  return {level:'primary',title:'Cefaleia Primária',badge:'badge-primary',icon:'\u2705',dx,desc:'Sem sinais de alarme — tratamento sintomático'};
}

function isMedOveruse(){return onset.frequency==='cronica'&&(medsTried.size>=3||medsTried.has('med_opioide'))&&!medsTried.has('med_nenhum')}

function getTimeElapsed(){
  const diff=Math.floor((new Date()-evalStartTime)/1000);
  const m=Math.floor(diff/60);
  const s=diff%60;
  if(m>0)return m+'min '+s+'s';
  return s+'s';
}

// =============================================
// PROGRESS BAR
// =============================================
function progHTML(idx,allDone){
  let h='<div class="progress-bar" role="navigation" aria-label="Progresso">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c=allDone||i<idx?'done':i===idx?'active':'';
    const canClick=i<=maxStepReached;
    const clickable=canClick?` onclick="goToStep(${i})" tabindex="0" role="button" aria-label="Ir para ${STEP_LABELS[i]}"`:'';
    h+=`<div class="progress-step ${c} ${canClick?'clickable':''}"${clickable}></div>`;
  }
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c=allDone||i<idx?'done-label':i===idx?'active-label':'';
    const canClick=i<=maxStepReached;
    const clickable=canClick?` onclick="goToStep(${i})" tabindex="0" role="button"`:'';
    h+=`<span class="${c} ${canClick?'clickable':''}"${clickable}>${STEP_LABELS[i]}</span>`;
  }
  h+='</div>';
  return h;
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  if(currentStep===0)renderOnset();
  else if(currentStep===1)renderRedFlags();
  else if(currentStep===2)renderSymptoms();
  else if(currentStep===3)renderExam();
  else if(currentStep===4)renderVitals();
  else renderResult();
  disclaimerEl.innerHTML=currentStep>=TOTAL_STEPS?'Ferramenta de apoio clínico. Não substitui o julgamento do profissional.':'';
}

// =============================================
// STEP 0: ONSET
// =============================================
function renderOnset(){
  let h=progHTML(0,false);
  h+='<div class="card">';
  h+='<div class="step-indicator"><span class="step-num">1</span>Etapa 1 de '+TOTAL_STEPS+'</div>';
  h+='<h2>História da Cefaleia</h2>';
  h+='<p class="subtitle">Quem é o paciente e como é a dor?</p>';
  h+='<div class="options">';

  // Age
  h+='<div class="option-group-label">Faixa etária</div>';
  h+='<div style="display:flex;gap:.3rem;flex-wrap:wrap">';
  const ageOpts=[{v:'lt18',l:'< 18'},{v:'18_39',l:'18-39'},{v:'40_49',l:'40-49'},{v:'50_64',l:'50-64'},{v:'ge65',l:'≥ 65'}];
  for(const o of ageOpts)h+=`<button class="score-opt ${onset.age===o.v?'picked':''}" onclick="setOnset('age','${o.v}')">${o.l}</button>`;
  h+='</div>';

  h+='<div class="option-group-label" style="margin-top:.85rem">Modo de início</div>';

    {v:'agudo',l:'Agudo (minutos a horas)',icon:'\u{1F552}',tag:'tag-yellow',tagL:'Agudo'},

  if(onset.type==='subito'){
    h+='<div class="inline-alert ia-red"><span class="ia-icon">\u26A0\uFE0F</span><span>Thunderclap exige exclusão de HSA. Ottawa será aplicada na próxima etapa.</span></div>';

  // Intensity

  for(let i=0;i<=10;i++){

    if(onset.intensity===i){

      else if(i<=6)cls='picked p-mod';
      else cls='picked p-high';
    }else{
      if(i<=3)cls='hint-low';
      else if(i<=6)cls='hint-mod';
      else cls='hint-high';
    }
    h+=`<button class="pain-dot ${cls}" onclick="setOnset('intensity',${i})" aria-label="Intensidade ${i}">${i}</button>`;

  h+='</div>';
  h+='<div class="pain-labels"><span>Sem dor</span><span>Moderada</span><span>Pior possível</span></div>';

  const qualOpts=[{v:'pulsatil',l:'Pulsátil'},{v:'pressao',l:'Aperto'},{v:'pontada',l:'Pontada'},{v:'queimacao',l:'Queimação'}];
  for(const o of qualOpts)h+=`<button class="score-opt ${onset.quality===o.v?'picked':''}" onclick="setOnset('quality','${o.v}')" style="flex:1;min-width:70px">${o.l}</button>`;
  h+='</div>';

  // Location
  h+='<div class="option-group-label" style="margin-top:.85rem">Localização</div>';
  h+='<div style="display:flex;gap:.3rem;flex-wrap:wrap">';
  const locOpts=[{v:'unilateral',l:'Unilateral'},{v:'bilateral',l:'Bilateral'},{v:'frontal',l:'Frontal'},{v:'occipital',l:'Occipital'},{v:'holocraniana',l:'Holo'},{v:'periorb',l:'Periorbital'}];

  h+='<div class="option-group-label" style="margin-top:.85rem">Duração dos episódios</div>';
  h+='<div style="display:flex;gap:.3rem;flex-wrap:wrap">';

  for(const o of durOpts)h+=`<button class="score-opt ${onset.duration===o.v?'picked':''}" onclick="setOnset('duration','${o.v}')" style="flex:1;min-width:65px">${o.l}</button>`;

  h+=`<button class="check-btn ${onset.knownPrimary?'checked':''}" onclick="toggleKnownPrimary()" style="width:100%"><span class="check-box">${onset.knownPrimary?'\u2713':''}</span><span class="label">Tem diagnóstico prévio de cefaleia primária (migrânea, cluster, tensional)</span></button>`;

// =============================================
// STEP SUMMARY
// =============================================
function buildStepSummary(step){
  let chips=[];
  if(step>=0){
    if(onset.age)chips.push({label:ageLabels()[onset.age],cls:'chip-blue'});
    if(onset.sex)chips.push({label:onset.sex==='M'?'Masc':'Fem',cls:'chip-blue'});
    if(onset.type)chips.push({label:onsetLabelsShort()[onset.type],cls:onset.type==='subito'?'chip-red':'chip-blue'});
    if(onset.intensity!==null)chips.push({label:'EVA '+onset.intensity,cls:onset.intensity>=7?'chip-red':onset.intensity>=4?'chip-yellow':'chip-green'});
  }
  if(step>=1&&redFlags.size>0)chips.push({label:redFlags.size+' RF',cls:redFlags.size>=3?'chip-red':'chip-yellow'});
  if(step>=2&&assocSymptoms.size>0)chips.push({label:assocSymptoms.size+' sint.',cls:'chip-blue'});
  if(step>=3){
    const sev=EXAM_FINDINGS.filter(e=>e.severe&&examFindings.has(e.id)).length;
    if(examFindings.has('ex_normal'))chips.push({label:'Exame normal',cls:'chip-green'});
    else if(sev>0)chips.push({label:sev+' anormal',cls:'chip-red'});
  }
  if(step>=4){
    const abnV=countAbnormalVitals();
    if(abnV>0)chips.push({label:abnV+' alt. vitais',cls:'chip-yellow'});
    else if(vitals.pa||vitals.fc||vitals.temp)chips.push({label:'Vitais OK',cls:'chip-green'});
  }
  if(chips.length===0)return '';
  let h='<div class="selection-summary">';
  for(const c of chips)h+=`<span class="selection-chip ${c.cls}"><span class="chip-dot"></span>${c.label}</span>`;
  h+='</div>';
  return h;
}

function ageLabels(){return {lt18:'< 18','18_39':'18-39','40_49':'40-49','50_64':'50-64',ge65:'≥ 65'}}
function onsetLabelsShort(){return {subito:'Súbito',agudo:'Agudo',subagudo:'Subagudo',cronico:'Crônico'}}

function countAbnormalVitals(){
  let n=0;
  if(vitals.pa==='crisis'||vitals.pa==='elevada')n++;
  if(vitals.fc&&vitals.fc!=='normal')n++;
  if(vitals.temp==='fever'||vitals.temp==='subfebril')n++;
  if(vitals.gcs==='reduced'||vitals.gcs==='drowsy')n++;
  if(vitals.spo2==='low')n++;
  return n;
}

// =============================================
// RESULT
// =============================================
function renderResult(){
  const cls=getClassification();
  const rfCount=redFlagCount();
  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';
  h+=`<div class="result-badge ${cls.badge}">${cls.icon}</div>`;
  h+=`<div class="result-title">${cls.title}</div>`;
  h+=`<div class="result-desc">${cls.desc}</div>`;

  const rfCls=rfCount>=3?'rf-high':rfCount>0?'rf-mod':'rf-none';
  h+=`<div class="rf-count ${rfCls}">${rfCount===0?'\u2713 Sem red flags':rfCount+' red flag'+(rfCount>1?'s':'')}</div>`;

  if(cls.dx.length>0){
    h+='<div style="margin-bottom:1rem;text-align:left">';
    for(const d of cls.dx){
      const dotCls=cls.level==='emergent'?'dot-red':cls.level==='urgent'?'dot-yellow':cls.level==='primary'?'dot-blue':'dot-yellow';
      h+=`<div class="summary-row"><span class="criteria">Diagnóstico suspeito</span><span class="value"><span class="dot ${dotCls}"></span>${d}</span></div>`;
    }
    h+='</div>';
  }

  h+=buildDisposition(cls);
  h+=buildConduta(cls);
  h+=buildWorkup(cls);

  const rfBadge=rfCount>0?`<span class="section-badge ${rfCount>=3?'sb-red':'sb-yellow'}">${rfCount}</span>`:'<span class="section-badge sb-green">0</span>';
  h+=collapsible('snoop','Red Flags (SNOOP)',rfBadge,()=>{
    let s='';
    if(rfCount===0)return '<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.8rem">Nenhuma red flag.</p>';
    for(const f of SNOOP_FLAGS)if(redFlags.has(f.id))s+=`<div class="summary-row"><span class="criteria"><span class="snoop-letter ${f.cls}" style="display:inline-flex;width:1.1rem;height:1.1rem;font-size:.58rem;margin-right:.4rem">${f.letter}</span>${f.label}</span><span class="value"><span class="dot dot-red"></span>Sim</span></div>`;
    return s;
  });

  if(hasThunderclap()){
    const ottBadge=ottawaPositive()?`<span class="section-badge sb-red">${ottawaChecks.size}/6</span>`:'<span class="section-badge sb-green">0/6</span>';
    h+=collapsible('ottawa','Ottawa SAH',ottBadge,()=>{
      let s='';
      if(ottawaPositive())s+='<div class="alert-box alert-red"><span class="alert-icon">\u{1F6A8}</span><div class="alert-text"><strong>POSITIVO ('+ottawaChecks.size+'/6)</strong>TC sem contraste. Se TC normal < 6h: angio-TC. Se > 6h e TC normal: punção lombar (xantocromia).</div></div>';
      else s+='<div class="alert-box alert-green"><span class="alert-icon">\u2705</span><div class="alert-text"><strong>Negativo (0/6)</strong>HSA excluída com sensibilidade 100% se pico em 1h e paciente alerta.</div></div>';
      for(const c of OTTAWA_CRITERIA){
        const ck=ottawaChecks.has(c.id);
        s+=`<div class="summary-row"><span class="criteria">${c.label}</span><span class="value"><span class="dot ${ck?'dot-red':'dot-green'}"></span>${ck?'Sim':'Não'}</span></div>`;
      }
      return s;
    });
  }

  const symBadge=assocSymptoms.size>0?`<span class="section-badge sb-blue">${assocSymptoms.size}</span>`:'';
  h+=collapsible('symptoms','Sintomas Associados',symBadge,()=>{
    let s='';
    if(assocSymptoms.size===0)return '<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.8rem">Nenhum.</p>';
    for(const sym of ASSOC_SYMPTOMS)if(assocSymptoms.has(sym.id))s+=`<div class="summary-row"><span class="criteria">${sym.label}</span><span class="value"><span class="dot dot-blue"></span>Presente</span></div>`;
    return s;
  });

  const severeExamCount=EXAM_FINDINGS.filter(e=>e.severe&&examFindings.has(e.id)).length;
  const examBadge=severeExamCount>0?`<span class="section-badge sb-red">${severeExamCount} anormal</span>`:examFindings.has('ex_normal')?'<span class="section-badge sb-green">Normal</span>':'';
  h+=collapsible('exam','Exame Físico',examBadge,()=>{
    let s='';
    if(examFindings.size===0)return '<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.8rem">Não registrado.</p>';
    for(const ex of EXAM_FINDINGS)if(examFindings.has(ex.id)){
      const dotC=ex.severe?'dot-red':'dot-green';
      s+=`<div class="summary-row"><span class="criteria">${ex.label}</span><span class="value"><span class="dot ${dotC}"></span>${ex.severe?'Anormal':'Normal'}</span></div>`;
    }
    return s;
  });

  const vitalsBadge=buildVitalsBadge();
  h+=collapsible('vitals','Sinais Vitais',vitalsBadge,()=>{
    let s='';
    const paL={'normal':'Normal','elevada':'>140/90','crisis':'Crise >180/120'};
    const fcL={'normal':'60-100 bpm','taqui':'Taquicardia','bradi':'Bradicardia'};
    const tempL={'normal':'Normal','subfebril':'Subfebril','fever':'Febre'};
    const gcsL={'alert':'Alerta','drowsy':'Sonolento','reduced':'Rebaixado'};
    const spo2L={'normal':'≥ 95%','low':'< 95%'};
    if(vitals.pa)s+=`<div class="summary-row"><span class="criteria">PA</span><span class="value"><span class="dot ${vitals.pa==='crisis'?'dot-red':vitals.pa==='elevada'?'dot-yellow':'dot-green'}"></span>${paL[vitals.pa]}</span></div>`;
    if(vitals.fc)s+=`<div class="summary-row"><span class="criteria">FC</span><span class="value"><span class="dot ${vitals.fc!=='normal'?'dot-yellow':'dot-green'}"></span>${fcL[vitals.fc]}</span></div>`;
    if(vitals.temp)s+=`<div class="summary-row"><span class="criteria">Temp</span><span class="value"><span class="dot ${vitals.temp==='fever'?'dot-red':vitals.temp==='subfebril'?'dot-yellow':'dot-green'}"></span>${tempL[vitals.temp]}</span></div>`;
    if(vitals.spo2)s+=`<div class="summary-row"><span class="criteria">SpO₂</span><span class="value"><span class="dot ${vitals.spo2==='low'?'dot-red':'dot-green'}"></span>${spo2L[vitals.spo2]}</span></div>`;
    if(vitals.gcs)s+=`<div class="summary-row"><span class="criteria">Consciência</span><span class="value"><span class="dot ${vitals.gcs==='reduced'?'dot-red':vitals.gcs==='drowsy'?'dot-yellow':'dot-green'}"></span>${gcsL[vitals.gcs]}</span></div>`;
    if(!vitals.pa&&!vitals.fc&&!vitals.temp&&!vitals.gcs&&!vitals.spo2)s+='<p style="color:#475569;text-align:center;padding:.5rem 0;font-size:.8rem">Não registrado.</p>';
    return s;
  });

  h+=collapsible('note','Nota para prontuário','',()=>buildNoteContent(cls));

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="restart()">Recomeçar</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function buildVitalsBadge(){
  const abnormal=countAbnormalVitals();
  if(abnormal>0)return `<span class="section-badge sb-yellow">${abnormal} alt.</span>`;
  if(vitals.pa||vitals.fc||vitals.temp||vitals.gcs||vitals.spo2)return '<span class="section-badge sb-green">OK</span>';
  return '';
}

// =============================================
// DISPOSITION
// =============================================
function buildDisposition(cls){
  let icon,title,desc,dcls;
  if(cls.level==='emergent'){icon='\u{1F3E5}';title='Internação / UTI';desc='Internação hospitalar com monitorização. Acionar equipe especializada.';dcls='disp-emergent';}
  else if(cls.level==='urgent'){icon='\u{1F50D}';title='Observação + Investigação';desc='Manter em observação até conclusão dos exames. Não dar alta sem investigação.';dcls='disp-urgent';}
  else if(cls.level==='low_flags'){icon='\u23F3';title='Observação 4-6h';desc='Observar evolução. Reavaliação obrigatória antes da alta.';dcls='disp-obs';}
  else{icon='\u{1F3E0}';title='Alta com orientações';desc='Cefaleia primária sem alarmes. Alta após melhora com analgesia.';dcls='disp-alta';}
  return `<div class="disposition-box ${dcls}"><div class="disp-icon">${icon}</div><div class="disp-title">${title}</div><div class="disp-desc">${desc}</div></div>`;
}

// =============================================
// CONDUTA
// =============================================
function buildConduta(cls){
  let boxCls,title,items;
  if(cls.level==='emergent'){
    boxCls='alta-prob';title='Conduta';
    items=[['\u{1F6A8}','Estabilização imediata (ABCDE)'],['\u{1F9E0}','TC de crânio sem contraste URGENTE']];
    if(hasThunderclap()){
      items.push(['\u{1F489}','Se TC normal < 6h: angio-TC. Se > 6h e TC normal: punção lombar.']);
      items.push(['\u{1F4DE}','Acionar neurocirurgia se HSA confirmada']);
      if(onset.frequency==='recorrente')items.push(['\u{1F4A1}','Thunderclap recorrente: considerar RCVS. Angio-TC ou angio-RNM.']);
    }
    if(hasMeningism()&&hasFever()){
      items.push(['\u{1F48A}','ATB empírico IMEDIATO — não atrasar por exames']);
      items.push(['\u{1F4CB}','Ceftriaxona 2g IV 12/12h + Dexametasona 0,15 mg/kg IV 6/6h']);
      items.push(['\u{1F489}','Hemocultura + punção lombar (TC antes se déficit focal)']);
      if(redFlags.has('s_hiv'))items.push(['\u{1F48A}','Imunossupresso: associar ampicilina 2g IV 4/4h (Listeria)']);
    }
    if(hasMeningism()&&hasRash()){
      items.push(['\u{1F6A8}','Meningococcemia: ATB + isolamento de gotículas']);
      items.push(['\u{1F4DE}','Notificação compulsória + quimioprofilaxia de contatos']);
    }
    if(hasCushingReflex()){
      items.push(['\u{1F6A8}','Manitol 20% 1g/kg IV ou salina hipertônica 3%']);
      items.push(['\u{1F4DE}','Acionar neurocirurgia — risco de herniação']);
      items.push(['\u{1F4CB}','Cabeceira 30°, manter PPC > 60 mmHg']);
    }
    if(hasFocalDeficit()&&!hasMeningism()&&!hasThunderclap()){
      items.push(['\u{1F4CB}','Avaliar AVC — protocolo de trombólise se < 4,5h']);
      items.push(['\u{1F4CA}','Glicemia capilar, coagulograma, ECG']);
    }
    if(suspectDissection()){
      items.push(['\u{1F489}','Angio-TC cervical + intracraniana URGENTE']);
      items.push(['\u{1F48A}','Anticoagulação ou antiagregação após confirmação']);
    }
    if(suspectPRES()){
      items.push(['\u{1F48A}','Redução gradual da PA (25% na 1ª hora), controlar convulsões']);
      items.push(['\u{1F9E0}','RNM FLAIR/DWI — edema vasogênico posterior']);
    }
    if(suspectPituitaryApoplexy()){
      items.push(['\u{1F4CB}','RNM sela túrcica + cortisol sérico + TSH']);
      items.push(['\u{1F48A}','Hidrocortisona 100mg IV se insuficiência adrenal']);
      items.push(['\u{1F4DE}','Acionar neurocirurgia + endocrinologia']);
    }
    if(vitals.gcs==='reduced'){
      items.push(['\u{1F6CF}\uFE0F','Proteger via aérea se GCS ≤ 8']);
      items.push(['\u{1F4CA}','Monitorização contínua (PA, FC, SpO₂, ECG)']);
    }
    if(isPregnant()){
      items.push(['\u{1F48A}','Sulfato de magnésio 4g IV + 1-2g/h se eclâmpsia']);
      items.push(['\u{1F4DE}','Acionar obstetrícia IMEDIATO']);
    }
    if(isAnticoagulated()){
      items.push(['\u{1F48A}','Reverter: vitamina K / CCP / idarucizumabe conforme droga']);
      items.push(['\u{1F489}','Coagulograma + INR IMEDIATO']);
    }
    if(hasLowSpO2())items.push(['\u{1F4A8}','O₂ suplementar para SpO₂ ≥ 94%']);
    items.push(['\u{1F3E5}','Internação hospitalar / UTI']);
  }else if(cls.level==='urgent'){
    boxCls='mod-prob';title='Conduta';
    items=[['\u{1F9E0}','TC de crânio sem contraste']];
    if(hasTemporalArteritis()){
      items.push(['\u{1F489}','VHS + PCR URGENTE']);
      items.push(['\u{1F48A}','Prednisona 60-80 mg/dia VO — NÃO aguardar biópsia']);
      items.push(['\u{1F4CB}','Biópsia de artéria temporal em até 2 semanas']);
    }
    if((examFindings.has('ex_temporal')||examFindings.has('ex_claudic'))&&isAgeOver40()&&!hasTemporalArteritis()){
      items.push(['\u{1F489}','VHS + PCR urgente — artéria temporal em > 40 anos']);
      items.push(['\u{1F48A}','Considerar prednisona empírica se alta suspeição']);
    }
    if(hasPapilledema()&&suspectIIH()){
      items.push(['\u{1F441}\uFE0F','RNM com venografia + avaliação oftalmológica urgente']);
      items.push(['\u{1F48A}','Acetazolamida 250mg VO 8/8h + perda de peso']);
      items.push(['\u{1F489}','Punção lombar com manometria']);
    }else if(hasPapilledema()){
      items.push(['\u{1F441}\uFE0F','Angio-TC ou RNM com venografia (trombose venosa?)']);
      items.push(['\u{1F4CB}','Avaliação oftalmológica — perimetria']);
    }
    if(hasMeningism()&&!hasFever())items.push(['\u{1F489}','Punção lombar (TC antes se déficit focal)']);
    if(isDrowsy()&&hasFever()){
      items.push(['\u{1F48A}','ATB empírico até excluir neuroinfecção']);
      items.push(['\u{1F489}','Punção lombar após TC de crânio']);
    }
    if(vitals.pa==='crisis'){
      items.push(['\u{1F48A}','Redução gradual da PA (25% na 1ª hora): nitroprussiato ou labetalol']);
      items.push(['\u{1F50D}','Avaliar lesão de órgão-alvo (ECG, fundo de olho, função renal)']);
    }
    if(isPregnant()&&vitals.pa==='elevada'){
      items.push(['\u{1F48A}','Nifedipina 10mg VO ou hidralazina 5mg IV']);
      items.push(['\u{1F489}','Proteinúria + hemograma + LDH + transaminases + plaquetas']);
      items.push(['\u{1F4DE}','Avaliação obstétrica']);
    }
    if(isAnticoagulated()){
      items.push(['\u{1F489}','Coagulograma + INR']);
      items.push(['\u{1F9E0}','TC mesmo se quadro aparentemente benigno']);
    }
    if(examFindings.has('ex_parncraniano'))items.push(['\u{1F9E0}','Angio-TC/RNM: excluir aneurisma compressivo']);
    if(suspectCVT()){
      items.push(['\u{1F9E0}','Angio-TC venosa ou RNM com venografia']);
      items.push(['\u{1F48A}','Se confirmada: heparina (mesmo se hemorragia)']);
    }
    if(hasHorner()&&onset.type==='agudo')items.push(['\u{1F489}','Angio-TC cervical — dissecção carotídea']);
    if(hasRetinalHemorrhage())items.push(['\u{1F441}\uFE0F','Avaliação oftalmológica urgente']);
    if(hasLowSpO2())items.push(['\u{1F4A8}','O₂ suplementar + investigar hipoxemia']);
    if(redFlags.has('n_convulsao')){
      items.push(['\u{1F48A}','Diazepam 10mg IV ou midazolam 5mg IM se convulsão ativa']);
      items.push(['\u{1F4CB}','EEG se sem causa estrutural']);
    }
    items.push(['\u{1F4CA}','Observação e reavaliação antes da alta']);
  }else if(cls.level==='low_flags'){
    boxCls='neutra-prob';title='Conduta';
    items=[
      ['\u{1F50D}','Avaliar cada red flag individualmente'],
      ['\u{1F9E0}','Considerar TC se cefaleia nova > 50 anos ou primeiro episódio intenso'],
      ['\u{1F489}','Exames conforme suspeita (hemograma, VHS, PCR)'],
      ['\u{1F48A}','Analgesia: dipirona 1g IV ou cetoprofeno 100mg IV'],
      ['\u{1F4CB}','Orientar sinais de alarme e retorno se piora'],
      ['\u{1F4CA}','Observação 4-6h; reavaliar antes da alta'],
    ];
    if(isPregnant())items.push(['\u26A0\uFE0F','Gestante: evitar AINEs no 3º trimestre. Preferir paracetamol.']);
    if(redFlags.has('p_postural'))items.push(['\u{1F4A1}','Cefaleia por esforço: se primeiro episódio, angio-TC para excluir HSA.']);
  }else{
    boxCls='baixa-prob';title='Conduta';
    items=[['\u2705','Exame normal — sem indicação de neuroimagem']];
    if(hasMigraineFeatures()){
      items.push(['\u{1F48A}','Migrânea: metoclopramida 10mg IV + dipirona 1g IV (ou cetoprofeno 100mg IV)']);
      items.push(['\u{1F48A}','Refratário: sumatriptano 50-100mg VO (6mg SC). Evitar se doença coronária.']);
      if(isPregnant())items.push(['\u26A0\uFE0F','Gestante: evitar triptanos e AINEs. Preferir metoclopramida + paracetamol.']);
      items.push(['\u{1F4CB}','≥ 3 crises/mês: encaminhar para profilaxia ambulatorial']);
    }else{
      items.push(['\u{1F48A}','Analgesia: dipirona 1g IV ou ibuprofeno 400-600mg VO']);
      if(isPregnant())items.push(['\u26A0\uFE0F','Gestante: evitar AINEs no 3º trimestre. Preferir paracetamol/dipirona.']);
    }
    if(hasAutonomic()){
      items.push(['\u{1F48A}','Cluster: O₂ 100% 12-15 L/min por 15 min com máscara não reinalante']);
      items.push(['\u{1F48A}','Alternativa: sumatriptano 6mg SC']);
      items.push(['\u{1F4CB}','Se cluster confirmado: profilaxia com verapamil']);
    }
    if(isMedOveruse())items.push(['\u26A0\uFE0F','Abuso medicamentoso provável: redução gradual + cefaliatria.']);
    else if(medsTried.size>=2&&!medsTried.has('med_nenhum'))items.push(['\u26A0\uFE0F','Atenção para abuso de analgésicos se uso > 10-15 d/mês']);
    if(medsTried.has('med_opioide'))items.push(['\u26A0\uFE0F','Opioide em cefaleia primária: risco de cronificação. Evitar.']);
    items.push(['\u{1F3E0}','Alta com orientações de retorno']);
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${boxCls}" style="margin-bottom:.75rem">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open)for(const[icon,text]of items)h+=`<div class="conduta-item"><span class="conduta-icon">${icon}</span><span>${text}</span></div>`;
  h+='</div></div>';
  return h;
}

// =============================================
// WORKUP
// =============================================
function buildWorkup(cls){
  const open=sections.workup;
  let h='<div class="dark-box" style="margin-bottom:.75rem">';
  h+=`<div class="collapse-header" onclick="toggleSection('workup')"><h3>Investigação Sugerida</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open){
    let items=[];
    if(cls.level==='emergent'||cls.level==='urgent')items.push({exam:'TC de crânio sem contraste',priority:'Imediato',reason:'Excluir hemorragia, massa, hidrocefalia'});
    if(hasThunderclap()){
      items.push({exam:'Angio-TC cerebral',priority:'Urgente',reason:'Aneurisma / dissecção'});
      items.push({exam:'Punção lombar',priority:'Se TC normal > 6h',reason:'Xantocromia — excluir HSA'});
    }
    if(hasMeningism()||hasFever()){
      items.push({exam:'Hemograma + PCR + Lactato',priority:'Urgente',reason:'Processo infeccioso'});
      items.push({exam:'Punção lombar',priority:'Urgente',reason:'Celularidade, proteína, cultura, Gram'});
      items.push({exam:'Hemoculturas (2 pares)',priority:'Antes do ATB',reason:'Agente etiológico'});
    }
    if(hasTemporalArteritis()||((examFindings.has('ex_temporal')||examFindings.has('ex_claudic'))&&isAgeOver40())){
      items.push({exam:'VHS',priority:'Urgente',reason:'> 50 mm/h na arterite temporal'});
      items.push({exam:'PCR',priority:'Urgente',reason:'Marcador inflamatório'});
      items.push({exam:'Biópsia de artéria temporal',priority:'Até 2 semanas',reason:'Confirmação (não atrasar corticoide)'});
    }
    if(hasPapilledema()){
      items.push({exam:'RNM com venografia',priority:'Urgente',reason:'Excluir trombose venosa'});
      items.push({exam:'Avaliação oftalmológica',priority:'Urgente',reason:'Perimetria — risco visual'});
      if(suspectIIH())items.push({exam:'Punção lombar com manometria',priority:'Urgente',reason:'PAo > 25 cmH₂O confirma HII'});
    }
    if(hasRetinalHemorrhage()&&!hasPapilledema())items.push({exam:'Fundo de olho detalhado',priority:'Urgente',reason:'Retinopatia — hipertensão maligna?'});
    if(hasFocalDeficit()&&!hasThunderclap())items.push({exam:'RNM de crânio com difusão',priority:'Urgente',reason:'Lesão estrutural / AVC'});
    if(examFindings.has('ex_parncraniano'))items.push({exam:'Angio-TC ou angio-RNM',priority:'Urgente',reason:'Aneurisma compressivo'});
    if(hasCushingReflex())items.push({exam:'TC de crânio imediata',priority:'Imediato',reason:'Herniação?'});
    if(suspectDissection())items.push({exam:'Angio-TC cervical + intracraniana',priority:'Urgente',reason:'Dissecção arterial'});
    if(suspectPRES())items.push({exam:'RNM com FLAIR/DWI',priority:'Urgente',reason:'Edema vasogênico posterior'});
    if(suspectPituitaryApoplexy()){
      items.push({exam:'RNM sela túrcica',priority:'Urgente',reason:'Apoplexia hipofisária'});
      items.push({exam:'Cortisol + TSH + prolactina',priority:'Urgente',reason:'Avaliação endócrina'});
    }
    if(suspectCVT()){
      items.push({exam:'Angio-TC venosa ou RNM venografia',priority:'Urgente',reason:'Trombose venosa'});
      items.push({exam:'D-dímero',priority:'Urgente',reason:'Complementar (sens. limitada)'});
    }
    if(vitals.pa==='crisis'){
      items.push({exam:'Função renal + eletrólitos',priority:'Urgente',reason:'Lesão de órgão-alvo'});
      items.push({exam:'Fundo de olho',priority:'Urgente',reason:'Retinopatia hipertensiva'});
      items.push({exam:'ECG',priority:'Urgente',reason:'Sobrecarga / isquemia'});
    }
    if(isPregnant()&&(vitals.pa==='elevada'||vitals.pa==='crisis')){
      items.push({exam:'Proteinúria',priority:'Urgente',reason:'Critério de pré-eclâmpsia'});
      items.push({exam:'Hemograma + LDH + TGO/TGP',priority:'Urgente',reason:'HELLP'});
      items.push({exam:'Ácido úrico',priority:'Urgente',reason:'Gravidade na pré-eclâmpsia'});
    }
    if(isAnticoagulated()&&(cls.level==='urgent'||cls.level==='emergent'))items.push({exam:'Coagulograma + INR',priority:'Imediato',reason:'Nível de anticoagulação'});
    if(cls.level==='low_flags'&&redFlags.has('o2_idade')){
      items.push({exam:'TC de crânio sem contraste',priority:'Considerar',reason:'Cefaleia nova > 50 anos'});
      items.push({exam:'VHS + PCR',priority:'Considerar',reason:'Excluir arterite temporal'});
    }
    if(cls.level==='low_flags'&&redFlags.has('s_cancer'))items.push({exam:'RNM com contraste',priority:'Considerar',reason:'Metástase cerebral'});
    if(cls.level==='low_flags'&&redFlags.has('s_hiv'))items.push({exam:'RNM com contraste',priority:'Considerar',reason:'Infecção oportunista do SNC'});
    if(cls.level==='low_flags'&&redFlags.has('p_postural'))items.push({exam:'Angio-TC cerebral',priority:'Considerar',reason:'Excluir HSA / malformação'});
    if(isDrowsy()&&hasFever()&&cls.level==='urgent')items.push({exam:'Punção lombar',priority:'Urgente',reason:'Sonolência + febre — neuroinfecção'});
    if(items.length===0)items.push({exam:'Neuroimagem',priority:'Não indicada',reason:'Primária sem red flags, exame normal'});

    for(const item of items){
      const pCls=item.priority==='Imediato'||item.priority==='Antes do ATB'?'dot-red':item.priority==='Urgente'?'dot-yellow':item.priority==='Não indicada'?'dot-green':'dot-blue';
      h+=`<div class="summary-row"><span class="criteria" style="flex:1">${item.exam}<br><span style="font-size:.66rem;color:#475569">${item.reason}</span></span><span class="value"><span class="dot ${pCls}"></span>${item.priority}</span></div>`;
    }
  }
  h+='</div></div>';
  return h;
}

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id,title,badge,contentFn){
  const open=sections[id];
  let h='<div class="dark-box" style="margin-bottom:.65rem">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')">`;
  h+=`<h3>${title}${badge||''}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  if(open)h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// NOTE
// =============================================
function buildNoteContent(cls){
  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const ageLabel={'lt18':'< 18','18_39':'18-39','40_49':'40-49','50_64':'50-64','ge65':'≥ 65'};
  const onsetLabel={'subito':'Súbito (thunderclap)','agudo':'Agudo','subagudo':'Subagudo','cronico':'Crônico'};
  const qualLabel={'pulsatil':'Pulsátil','pressao':'Aperto','pontada':'Pontada','queimacao':'Queimação'};
  const locLabel={'unilateral':'Unilateral','bilateral':'Bilateral','frontal':'Frontal','occipital':'Occipital','holocraniana':'Holocraniana','periorb':'Periorbital'};
  const durLabel={'seg_min':'Segundos','15min_3h':'15 min - 3h','4_72h':'4 - 72h','gt72h':'> 72h','constante':'Constante'};
  const freqLabel={'primeiro':'Primeiro episódio','recorrente':'Recorrente','cronica':'Crônica (>15d/mês)'};
  const paLabel={'normal':'Normal','elevada':'Elevada','crisis':'Crise hipertensiva'};
  const fcLabel={'normal':'60-100 bpm','taqui':'Taquicardia','bradi':'Bradicardia'};
  const tempLabel={'normal':'Normal','subfebril':'Subfebril','fever':'Febre'};
  const gcsLabel={'alert':'Alerta (GCS 15)','drowsy':'Sonolento','reduced':'Rebaixado'};
  const spo2Label={'normal':'≥ 95%','low':'< 95%'};

  let n='';
  n+='CEFALEIA — AVALIAÇÃO NA EMERGÊNCIA\n';
  n+=`Data/hora: ${ts}\n`;
  n+='========================================\n\n';
  n+=`PACIENTE: ${onset.sex==='M'?'Masculino':'Feminino'}, ${ageLabel[onset.age]||'N/I'} anos\n`;
  if(onset.knownPrimary)n+='Diagnóstico prévio: cefaleia primária conhecida\n';
  n+='\n';

  n+='HISTÓRIA\n';
  n+=`  Início: ${onsetLabel[onset.type]||'N/I'}\n`;
  if(onset.quality)n+=`  Qualidade: ${qualLabel[onset.quality]}\n`;
  if(onset.location)n+=`  Localização: ${locLabel[onset.location]}\n`;
  if(onset.duration)n+=`  Duração: ${durLabel[onset.duration]}\n`;
  if(onset.frequency)n+=`  Frequência: ${freqLabel[onset.frequency]}\n`;
  if(onset.intensity!==null)n+=`  Intensidade: ${onset.intensity}/10\n`;
  const activeMeds=MED_OPTIONS.filter(m=>medsTried.has(m.id));
  if(activeMeds.length>0)n+='  Medicações tentadas: '+activeMeds.map(m=>m.label).join(', ')+'\n';

  n+='\nRED FLAGS (SNOOP)\n';
  const activeRF=SNOOP_FLAGS.filter(f=>redFlags.has(f.id));
  if(activeRF.length===0)n+='  Nenhuma.\n';
  else for(const f of activeRF)n+=`  [${f.letter}] ${f.label}\n`;

  if(hasThunderclap()){
    n+='\nOTTAWA SAH\n';
    const activeOt=OTTAWA_CRITERIA.filter(c=>ottawaChecks.has(c.id));
    if(activeOt.length>0){
      n+=`  POSITIVO (${activeOt.length}/6)\n`;
      for(const c of activeOt)n+=`  [+] ${c.label}\n`;
    }else n+='  NEGATIVO (0/6) — sens. 100% para HSA\n';
  }

  const activeSym=ASSOC_SYMPTOMS.filter(s=>assocSymptoms.has(s.id));
  if(activeSym.length>0){
    n+='\nSINTOMAS ASSOCIADOS\n';
    for(const s of activeSym)n+=`  - ${s.label}\n`;
  }

  const activeEx=EXAM_FINDINGS.filter(e=>examFindings.has(e.id));
  if(activeEx.length>0){
    n+='\nEXAME FÍSICO\n';
    for(const e of activeEx)n+=`  ${e.severe?'[!]':'[ok]'} ${e.label}\n`;
  }else n+='\nEXAME FÍSICO\n  Não registrado\n';

  n+='\nSINAIS VITAIS\n';
  if(vitals.pa)n+=`  PA: ${paLabel[vitals.pa]}\n`;
  if(vitals.fc)n+=`  FC: ${fcLabel[vitals.fc]}\n`;
  if(vitals.temp)n+=`  Temp: ${tempLabel[vitals.temp]}\n`;
  if(vitals.spo2)n+=`  SpO₂: ${spo2Label[vitals.spo2]}\n`;
  if(vitals.gcs)n+=`  Consciência: ${gcsLabel[vitals.gcs]}\n`;
  if(!vitals.pa&&!vitals.fc&&!vitals.temp&&!vitals.gcs&&!vitals.spo2)n+='  Não registrados\n';

  n+=`\nCLASSIFICAÇÃO: ${cls.title}\n`;
  n+=`Red flags: ${redFlagCount()}\n`;
  n+='Diagnósticos suspeitos:\n';
  for(const d of cls.dx)n+=`  - ${d}\n`;

  if(cls.level==='emergent')n+='\nDISPOSIÇÃO: Internação / UTI\n';
  else if(cls.level==='urgent')n+='\nDISPOSIÇÃO: Observação + investigação\n';
  else if(cls.level==='low_flags')n+='\nDISPOSIÇÃO: Observação 4-6h, reavaliação antes da alta\n';
  else n+='\nDISPOSIÇÃO: Alta com orientações\n';

  n+=`\nTempo: ${getTimeElapsed()}\n`;
  n+='\n--- MedStack (apoio clínico) ---\n';

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">\u{1F4CB} Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el)return;
  const text=el.textContent||el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(showCopied).catch(()=>fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showCopied();}catch(e){}
  document.body.removeChild(ta);
}
function showCopied(){
  const btn=document.getElementById('copyBtn');
  if(!btn)return;
  btn.textContent='\u2713 Copiado!';btn.classList.add('copied');
  setTimeout(()=>{if(btn){btn.textContent='\u{1F4CB} Copiar nota';btn.classList.remove('copied');}},2000);
}

// =============================================
// ACTIONS
// =============================================
function setOnset(field,val){
  onset[field]=val;
  syncAgeDerivedFlags();
  render();
}
function toggleKnownPrimary(){onset.knownPrimary=!onset.knownPrimary;render();}
function syncAgeDerivedFlags(){
  if(isAgeOver50())redFlags.add('o2_idade');
  else redFlags.delete('o2_idade');
  if(isAgeOver40()&&(onset.type==='subito'||hasThunderclap()))ottawaChecks.add('ot_age40');
  else ottawaChecks.delete('ot_age40');
  if(onset.type==='subito')ottawaChecks.add('ot_thunder');
  else if(!redFlags.has('o_subita'))ottawaChecks.delete('ot_thunder');
}
function toggleMed(id){
  if(id==='med_nenhum'){
    if(medsTried.has('med_nenhum'))medsTried.delete('med_nenhum');
    else{medsTried.clear();medsTried.add('med_nenhum');}
  }else{
    medsTried.delete('med_nenhum');
    medsTried.has(id)?medsTried.delete(id):medsTried.add(id);
  }
  render();
}
function toggleRedFlag(id){
  redFlags.has(id)?redFlags.delete(id):redFlags.add(id);
  if(id==='o_subita'){
    if(redFlags.has('o_subita'))ottawaChecks.add('ot_thunder');
    else if(onset.type!=='subito')ottawaChecks.delete('ot_thunder');
  }
  render();
}
function toggleOttawa(id){ottawaChecks.has(id)?ottawaChecks.delete(id):ottawaChecks.add(id);render();}
function toggleSymptom(id){assocSymptoms.has(id)?assocSymptoms.delete(id):assocSymptoms.add(id);render();}
function toggleExam(id){
  if(id==='ex_normal'){
    if(examFindings.has('ex_normal'))examFindings.delete('ex_normal');
    else{examFindings.clear();examFindings.add('ex_normal');}
  }else{
    examFindings.delete('ex_normal');
    examFindings.has(id)?examFindings.delete(id):examFindings.add(id);
  }
  render();
}
function setVital(field,val){vitals[field]=val;render();}
function toggleSection(id){sections[id]=!sections[id];render();}

function goToStep(step){
  if(step<0||step>TOTAL_STEPS)return;
  if(step>maxStepReached)return;
  currentStep=step;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function next(){
  if(currentStep===0&&(onset.type===null||onset.age===null||onset.sex===null))return;
  currentStep++;
  if(currentStep>maxStepReached)maxStepReached=currentStep;
  if(currentStep===1)syncAgeDerivedFlags();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){
  if(currentStep>0){
    currentStep--;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}
function restart(){
  if(!confirm('Recomeçar a avaliação? Todos os dados serão apagados.'))return;
  currentStep=0;
  maxStepReached=0;
  onset={type:null,duration:null,location:null,quality:null,frequency:null,age:null,sex:null,intensity:null,knownPrimary:false};
  medsTried=new Set();
  redFlags=new Set();ottawaChecks=new Set();assocSymptoms=new Set();examFindings=new Set();
  vitals={pa:null,fc:null,temp:null,gcs:null,spo2:null};
  sections={snoop:true,ottawa:false,symptoms:false,exam:false,vitals:false,conduta:true,workup:true,note:false,ddx:false};
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){
    const el=document.activeElement;
    if(el&&(el.classList.contains('score-opt')||el.classList.contains('check-btn')||el.classList.contains('option-btn')||el.classList.contains('pain-dot')||el.classList.contains('progress-step'))){
      e.preventDefault();
      el.click();
    }
  }
});

render();
</script>
