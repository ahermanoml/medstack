<!-- VERSION: 8 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trauma — ATLS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0f172a;--panel:#1e293b;--panel2:#0f172a;--border:#334155;--border2:#1e293b;
    --text:#e2e8f0;--text2:#cbd5e1;--muted:#94a3b8;--dim:#64748b;--fg:#f1f5f9;
    --blue:#3b82f6;--blue2:#60a5fa;--blue3:#93c5fd;--blueBg:#1e3a5f;--blueBgDeep:#0c1f3d;
    --red:#ef4444;--red2:#fca5a5;--redBg:#450a0a;--redBorder:#7f1d1d;
    --yellow:#f59e0b;--yellow2:#fcd34d;--yellowBg:#451a03;--yellowBorder:#78350f;
    --green:#22c55e;--green2:#86efac;--greenBg:#052e16;--greenBorder:#14532d;
  }
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-text-size-adjust:100%;overflow-x:hidden}
  header{background:linear-gradient(135deg,var(--panel) 0%,var(--bg) 100%);width:100%;padding:.85rem 1.1rem;text-align:center;border-bottom:2px solid var(--blue);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  header h1{font-size:1.05rem;font-weight:700;color:var(--fg);letter-spacing:-.01em}
  header p{font-size:.66rem;color:var(--dim);margin-top:.12rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  .back-link{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);color:var(--muted);text-decoration:none;font-size:.74rem;font-weight:500;padding:.4rem .55rem;border-radius:.45rem;transition:color .15s,background .15s}
  .back-link:hover{color:var(--fg);background:rgba(59,130,246,.1)}
  .timer-badge{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--dim);font-family:'SF Mono','Fira Code',monospace;padding:.28rem .48rem;border-radius:.42rem;border:1px solid var(--border2);transition:color .3s,border-color .3s}
  .timer-badge.stopped{color:var(--blue2);border-color:var(--blueBg)}
  .container{max-width:700px;width:100%;padding:1rem;display:flex;flex-direction:column;gap:.85rem;padding-bottom:3rem}
  .progress-bar{display:flex;align-items:center;gap:.28rem;padding:0 .15rem}
  .progress-step{flex:1;height:4px;border-radius:2px;background:var(--panel);transition:background .35s,box-shadow .35s}
  .progress-step.done{background:var(--blue)}
  .progress-step.active{background:var(--blue2);box-shadow:0 0 8px rgba(96,165,250,.5);animation:pulse-bar 2s ease-in-out infinite}
  @keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.5}}
  .progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:.66rem;color:var(--dim);padding:.35rem .15rem 0;letter-spacing:.02em}
  .progress-meta .step-name{color:var(--blue3);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .phase-label{display:inline-flex;align-items:center;font-size:.55rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;padding:.2rem .48rem;border-radius:9999px;background:var(--panel2);border:1px solid var(--border);margin-right:.35rem}
  .phase-primary{color:var(--blue3);border-color:var(--blueBg);background:var(--blueBgDeep)}
  .phase-secondary{color:#c4b5fd;border-color:#4c1d95;background:#1a0a2e}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:.9rem;padding:1.2rem;animation:cardIn .28s cubic-bezier(.22,1,.36,1);will-change:transform,opacity}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-size:1.05rem;color:#f8fafc;margin-bottom:.2rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .card .subtitle{font-size:.75rem;color:var(--muted);margin-bottom:1rem;line-height:1.45}
  .options{display:flex;flex-direction:column;gap:.48rem}
  .group-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-top:.65rem;padding-bottom:.08rem;font-weight:700}
  .group-label:first-child{margin-top:0}
  .option-btn{background:var(--panel2);border:1.5px solid var(--border);border-radius:.6rem;padding:.72rem .8rem;color:var(--text2);font-size:.86rem;cursor:pointer;transition:border-color .15s,background .15s,color .15s,transform .1s;text-align:left;display:flex;align-items:center;gap:.6rem;-webkit-tap-highlight-color:transparent;position:relative;min-height:2.75rem;user-select:none;font-family:inherit}
  .option-btn:hover{border-color:var(--blue);background:#172040;color:var(--fg)}
  .option-btn:active{transform:scale(.98)}
  .option-btn.selected{border-color:var(--blue);background:var(--blueBg);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(59,130,246,.3)}
  .option-btn.selected::after{content:'\2713';position:absolute;right:.65rem;font-size:.85rem;color:var(--blue2);font-weight:700}
  .option-btn .icon{font-size:1.05rem;flex-shrink:0;width:1.45rem;text-align:center}
  .option-btn .label{flex:1}
  .option-btn .tag{font-size:.55rem;text-transform:uppercase;letter-spacing:.05em;padding:.16rem .4rem;border-radius:9999px;font-weight:700;flex-shrink:0}
  .tag-red{background:#7f1d1d;color:var(--red2)}
  .tag-yellow{background:var(--yellowBorder);color:var(--yellow2)}
  .tag-green{background:var(--greenBorder);color:var(--green2)}
  .tag-blue{background:var(--blueBg);color:var(--blue3)}
  .tag-gray{background:#374151;color:#d1d5db}
  .check-grid{display:grid;grid-template-columns:1fr;gap:.42rem}
  @media(min-width:480px){.check-grid.dense{grid-template-columns:1fr 1fr}}
  .check-btn{background:var(--panel2);border:1.5px solid var(--border);border-radius:.55rem;padding:.55rem .72rem;color:var(--text2);font-size:.82rem;cursor:pointer;transition:border-color .15s,background .15s,color .15s,transform .1s;text-align:left;display:flex;align-items:center;gap:.55rem;-webkit-tap-highlight-color:transparent;min-height:2.55rem;user-select:none;font-family:inherit}
  .check-btn:hover{border-color:var(--blue);background:#172040;color:var(--fg)}
  .check-btn:active{transform:scale(.98)}
  .check-btn.checked{border-color:var(--blue);background:var(--blueBg);color:var(--fg)}
  .check-btn.checked.alert{border-color:var(--red);background:var(--redBg);color:var(--red2)}
  .check-box{width:16px;height:16px;border:2px solid #475569;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;font-size:.7rem;font-weight:700}
  .check-btn.checked .check-box{background:var(--blue);border-color:var(--blue);color:#fff}
  .check-btn.checked.alert .check-box{background:var(--red);border-color:var(--red);color:#fff}
  .nav-row{display:flex;gap:.5rem;margin-top:1rem}
  .nav-btn{flex:1;padding:.74rem;border-radius:.6rem;font-size:.87rem;font-weight:600;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;border:none;-webkit-tap-highlight-color:transparent;min-height:2.8rem;user-select:none;font-family:inherit}
  .nav-btn.secondary{background:var(--border);color:var(--text2)}
  .nav-btn.secondary:hover{background:#475569}
  .nav-btn.primary{background:linear-gradient(135deg,var(--blue),#2563eb);color:#fff;box-shadow:0 2px 6px rgba(59,130,246,.25)}
  .nav-btn.primary:hover{background:linear-gradient(135deg,var(--blue2),var(--blue))}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed}
  .nav-btn:active:not(:disabled){transform:scale(.98)}
  .score-opt{flex:1;padding:.42rem .2rem;border-radius:.42rem;font-size:.68rem;cursor:pointer;border:1.5px solid var(--border);background:var(--panel2);color:var(--dim);text-align:center;transition:border-color .15s,background .15s,color .15s;line-height:1.2;-webkit-tap-highlight-color:transparent;min-height:2.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;font-family:inherit}
  .score-opt:hover{border-color:var(--blue);color:var(--text2)}
  .score-opt:active{transform:scale(.95)}
  .score-opt.picked{border-color:var(--blue);background:var(--blueBg);color:var(--fg);font-weight:600}
  .score-opt .pts{display:block;font-size:.55rem;color:var(--dim);margin-top:.08rem}
  .score-opt.picked .pts{color:var(--blue3)}
  .result-card{text-align:center;padding:1.55rem 1rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:4.1rem;height:4.1rem;border-radius:50%;font-size:1.3rem;font-weight:800;margin-bottom:.65rem;animation:badgePop .38s cubic-bezier(.22,1,.36,1)}
  @keyframes badgePop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .badge-red{background:#991b1b;color:var(--red2);border:3px solid var(--red);box-shadow:0 0 22px rgba(239,68,68,.35)}
  .badge-yellow{background:#92400e;color:var(--yellow2);border:3px solid var(--yellow);box-shadow:0 0 18px rgba(245,158,11,.25)}
  .badge-green{background:#166534;color:var(--green2);border:3px solid var(--green);box-shadow:0 0 18px rgba(34,197,94,.2)}
  .badge-blue{background:#1e40af;color:var(--blue3);border:3px solid var(--blue);box-shadow:0 0 18px rgba(59,130,246,.25)}
  .result-title{font-size:1.2rem;font-weight:700;margin-bottom:.15rem}
  .result-desc{color:var(--muted);font-size:.78rem;margin-bottom:.3rem;line-height:1.5}
  .result-elapsed{font-size:.66rem;color:var(--dim);margin-bottom:.85rem;font-family:'SF Mono','Fira Code',monospace}
  .dark-box{background:var(--panel2);border-radius:.6rem;padding:.8rem .95rem;text-align:left;margin-bottom:.65rem}
  .dark-box h3{font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.45rem;font-weight:700}
  .summary-row{display:flex;justify-content:space-between;align-items:flex-start;padding:.38rem 0;border-bottom:1px solid var(--border2);font-size:.78rem;gap:.5rem}
  .summary-row:last-child{border-bottom:none}
  .summary-row .criteria{color:var(--muted);flex-shrink:0}
  .summary-row .value{font-weight:600;display:flex;align-items:center;gap:.35rem;text-align:right;flex-wrap:wrap;justify-content:flex-end;max-width:68%;font-size:.74rem}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-red{background:var(--red)}.dot-yellow{background:var(--yellow)}.dot-green{background:var(--green)}.dot-blue{background:var(--blue)}.dot-gray{background:var(--dim)}
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:.12rem 0;border-radius:.4rem;transition:background .12s}
  .collapse-header:hover{background:rgba(59,130,246,.04)}
  .collapse-header h3{margin-bottom:0}
  .collapse-arrow{font-size:.58rem;color:var(--dim);transition:transform .22s cubic-bezier(.22,1,.36,1);width:1.3rem;height:1.3rem;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(100,116,139,.08);flex-shrink:0}
  .collapse-arrow.open{transform:rotate(180deg);color:var(--blue3);background:rgba(59,130,246,.15)}
  .collapse-body.hidden{display:none}
  .collapse-body.open{margin-top:.5rem}
  .note-text{background:#020617;border:1px solid var(--border2);border-radius:.45rem;padding:.8rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.68rem;color:var(--muted);white-space:pre-wrap;line-height:1.5;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.55rem;padding:.6rem;border-radius:.5rem;border:1.5px solid var(--border);background:var(--panel);color:var(--text2);font-size:.8rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s,color .15s;min-height:2.6rem;user-select:none;font-family:inherit}
  .copy-btn:hover{border-color:var(--blue);background:#172040;color:var(--fg)}
  .copy-btn:active{transform:scale(.97)}
  .copy-btn.copied{border-color:var(--green);background:var(--greenBg);color:var(--green2)}
  .gcs-display{display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 0;margin:.35rem 0}
  .gcs-box{text-align:center;padding:.48rem .65rem;border-radius:.5rem;min-width:3.3rem;transition:border-color .25s,background .25s}
  .gcs-box.component{background:var(--panel);border:1px solid var(--border)}
  .gcs-box.total{border:2px solid}
  .gcs-box.total.severe{background:var(--redBg);border-color:var(--red)}
  .gcs-box.total.moderate{background:var(--yellowBg);border-color:var(--yellow)}
  .gcs-box.total.mild{background:var(--greenBg);border-color:var(--green)}
  .gcs-box.total.pending{background:var(--panel);border-color:var(--border)}
  .gcs-value{font-size:1.3rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace}
  .gcs-box.component .gcs-value{color:var(--blue3)}
  .gcs-box.total.severe .gcs-value{color:var(--red2)}
  .gcs-box.total.moderate .gcs-value{color:var(--yellow2)}
  .gcs-box.total.mild .gcs-value{color:var(--green2)}
  .gcs-box.total.pending .gcs-value{color:var(--dim)}
  .gcs-label{font-size:.53rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-top:.08rem;font-weight:700}
  .gcs-plus{font-size:.88rem;color:#475569;font-weight:700}
  .score-row{margin-bottom:.52rem}
  .score-row-label{font-size:.76rem;color:var(--muted);margin-bottom:.22rem;display:flex;justify-content:space-between}
  .score-options{display:flex;gap:.25rem}
  .banner{border-radius:.55rem;padding:.75rem .9rem;margin-top:.55rem;display:flex;align-items:flex-start;gap:.5rem;border:1.5px solid}
  .banner .bi{font-size:1.05rem;flex-shrink:0;margin-top:.05rem}
  .banner .bt{font-size:.76rem;font-weight:600;line-height:1.45;flex:1}
  .banner.alert{background:var(--redBg);border-color:#991b1b;color:var(--red2)}
  .banner.warn{background:var(--yellowBg);border-color:var(--yellowBorder);color:var(--yellow2)}
  .banner.info{background:var(--panel2);border-color:var(--blueBg);color:var(--blue3)}
  .banner.info .bt{font-weight:500}
  .vital-input{background:var(--panel2);border:1.5px solid var(--border);border-radius:.45rem;padding:.5rem .65rem;color:var(--fg);font-size:.88rem;width:100%;font-family:inherit;transition:border-color .15s,box-shadow .15s;min-height:2.4rem;-moz-appearance:textfield}
  .vital-input::-webkit-outer-spin-button,.vital-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .vital-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .vital-input::placeholder{color:#475569}
  .vital-input.warn{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(245,158,11,.12)}
  .vital-input.danger{border-color:var(--red);box-shadow:0 0 0 2px rgba(239,68,68,.12)}
  .vital-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem;margin-bottom:.5rem}
  .input-group{display:flex;flex-direction:column;gap:.2rem;min-width:0}
  .input-label{font-size:.67rem;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:.3rem}
  .input-unit{font-size:.56rem;color:var(--dim);letter-spacing:.04em;font-weight:500}
  .shock-display{display:flex;align-items:center;gap:.65rem;padding:.78rem .9rem;border-radius:.6rem;margin-top:.55rem;transition:border-color .25s,background .25s;border:1.5px solid}
  .shock-display.shock-i{background:var(--greenBg);border-color:var(--greenBorder)}
  .shock-display.shock-ii{background:var(--yellowBg);border-color:var(--yellowBorder)}
  .shock-display.shock-iii{background:var(--redBg);border-color:#7f1d1d}
  .shock-display.shock-iv{background:var(--redBg);border-color:var(--red);box-shadow:0 0 14px rgba(239,68,68,.2)}
  .shock-display.shock-pending{background:var(--panel);border-color:var(--border)}
  .shock-class{font-size:1.6rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace;min-width:2rem;text-align:center}
  .shock-display.shock-i .shock-class{color:var(--green2)}
  .shock-display.shock-ii .shock-class{color:var(--yellow2)}
  .shock-display.shock-iii .shock-class,.shock-display.shock-iv .shock-class{color:var(--red2)}
  .shock-display.shock-pending .shock-class{color:var(--dim)}
  .shock-info{flex:1}
  .shock-info .shock-label{font-size:.8rem;font-weight:700;color:var(--fg)}
  .shock-info .shock-detail{font-size:.7rem;color:var(--muted);margin-top:.08rem;line-height:1.4}
  .fast-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.35rem 0}
  .fast-btn{background:var(--panel2);border:1.5px solid var(--border);border-radius:.6rem;padding:.75rem;cursor:pointer;transition:border-color .2s,background .2s,color .2s,transform .1s;text-align:center;-webkit-tap-highlight-color:transparent;min-height:4.3rem;user-select:none}
  .fast-btn:hover{border-color:var(--blue);background:#172040}
  .fast-btn:active{transform:scale(.97)}
  .fast-btn.positive{border-color:var(--red);background:var(--redBg);color:var(--red2)}
  .fast-btn.negative{border-color:var(--green);background:var(--greenBg);color:var(--green2)}
  .fast-btn.indeterminate{border-color:var(--yellow);background:var(--yellowBg);color:var(--yellow2)}
  .fast-btn .fast-icon{font-size:1.2rem;margin-bottom:.18rem}
  .fast-btn .fast-label{font-size:.72rem;font-weight:600;line-height:1.2}
  .fast-btn .fast-status{font-size:.56rem;margin-top:.18rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .team-activation{background:var(--redBg);border:2px solid var(--red);border-radius:.7rem;padding:.85rem;margin-bottom:.7rem;text-align:center;animation:pulseAlert 2.4s ease-in-out infinite}
  @keyframes pulseAlert{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
  .team-activation h3{color:var(--red2);font-size:.88rem;margin-bottom:.32rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .team-activation p{color:var(--red2);font-size:.74rem;line-height:1.45}
  .imaging-item{display:flex;align-items:flex-start;gap:.48rem;padding:.3rem 0;font-size:.8rem;color:var(--text2);line-height:1.4}
  .imaging-icon{flex-shrink:0;width:1.05rem;text-align:center}
  .imaging-item .reason{font-size:.66rem;color:var(--dim);display:block;margin-top:.1rem}
  .exam-head{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;margin-bottom:.35rem}
  .exam-head.sep{margin-top:.6rem;border-top:1px solid var(--border2);padding-top:.55rem}
  .tab-bar{display:flex;gap:.28rem;margin-bottom:.7rem;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:.15rem}
  .tab-bar::-webkit-scrollbar{display:none}
  .tab-btn{flex:0 0 auto;padding:.45rem .7rem;border-radius:.42rem;font-size:.7rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--panel2);color:var(--dim);text-align:center;transition:border-color .15s,background .15s,color .15s;-webkit-tap-highlight-color:transparent;min-height:2rem;user-select:none;font-family:inherit;position:relative;white-space:nowrap}
  .tab-btn.active{border-color:var(--blue);background:var(--blueBg);color:var(--fg)}
  .tab-btn:hover{border-color:var(--blue)}
  .tab-btn:active{transform:scale(.96)}
  .tab-btn .tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:1rem;height:1rem;border-radius:9999px;font-size:.55rem;margin-left:.3rem;background:var(--red);color:#fff;font-weight:700;padding:0 .2rem}
  .metric-row{display:flex;align-items:center;gap:.55rem;padding:.55rem .75rem;border-radius:.5rem;margin-top:.42rem;font-size:.76rem;border:1px solid}
  .metric-row.ok{background:var(--greenBg);border-color:var(--greenBorder);color:var(--green2)}
  .metric-row.warn{background:var(--yellowBg);border-color:var(--yellowBorder);color:var(--yellow2)}
  .metric-row.danger{background:var(--redBg);border-color:#7f1d1d;color:var(--red2)}
  .metric-row.pending{background:var(--panel);border-color:var(--border);color:var(--dim)}
  .metric-value{font-size:1rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace;min-width:2.4rem;text-align:center}
  .metric-info{flex:1;font-size:.72rem;line-height:1.4}
  .conduta-list{display:flex;flex-direction:column;gap:.38rem}
  .conduta-card{background:var(--panel2);border:1px solid var(--border);border-radius:.5rem;padding:.62rem .75rem;font-size:.78rem;color:var(--text2);display:flex;align-items:flex-start;gap:.48rem;line-height:1.45}
  .conduta-card.urgent{border-color:#7f1d1d;background:#1a0505;color:var(--red2)}
  .conduta-card.warning{border-color:var(--yellowBorder);background:#1a0f05;color:#fde68a}
  .conduta-card .c-icon{flex-shrink:0;font-size:.9rem;margin-top:.04rem}
  .conduta-card .c-text strong{color:var(--fg)}
  .conduta-card.urgent .c-text strong{color:#fecaca}
  .conduta-card.warning .c-text strong{color:#fef3c7}
  .ample-grid{display:grid;grid-template-columns:auto 1fr;gap:.18rem .6rem;font-size:.78rem}
  .ample-grid .ample-letter{font-weight:700;color:var(--blue3);font-size:.86rem;align-self:center}

<body>
<header>
  <a href="../trauma.html" class="back-link">&larr; Lab</a>
  <h1>Avaliação de Trauma</h1>
  <p>ATLS &middot; ABCDE</p>
  <div class="timer-badge" id="evalTimer">00:00</div>
</header>
<div class="container" id="app"></div>
<script>
// =======================================
// STEPS
// =======================================
const STEP_LABELS=['Mecanismo','A — Via Aérea','B — Ventilação','C — Circulação','D — Neurológico','E — Exposição','FAST','Secondary','AMPLE','Sinais Vitais'];
const STEP_PHASE=['Primary','Primary','Primary','Primary','Primary','Primary','Primary','Secondary','Secondary','Secondary'];
const TOTAL_STEPS=STEP_LABELS.length;
const evalStartTime=new Date();
let evalEndTime=null;

setInterval(()=>{
  if(evalEndTime)return;
  const el=document.getElementById('evalTimer');
  if(!el)return;
  const diff=Math.floor((Date.now()-evalStartTime.getTime())/1000);
  el.textContent=String(Math.floor(diff/60)).padStart(2,'0')+':'+String(diff%60).padStart(2,'0');
},1000);

// =======================================
// STATE
// =======================================
let currentStep=0;
let showRestartConfirm=false;
let sections={conduta:true,imaging:true,primary:false,secondary:false,vitals:false,note:false};

let mechanism={type:null,energy:null,details:new Set()};
let airway={patent:null,cspine:null,findings:new Set(),interventions:new Set()};
let breathing={status:null,findings:new Set(),interventions:new Set()};
let circulation={pulse:null,skinStatus:null,bleeding:new Set(),interventions:new Set()};
let disability={gcsEye:null,gcsVerbal:null,gcsMotor:null,pupils:null,laterality:null,findings:new Set()};
let exposure={tempStatus:null,findings:new Set(),interventions:new Set()};
let fast={ruq:null,luq:null,suprapubic:null,pericardial:null};
let secondary={head:new Set(),neck:new Set(),chest:new Set(),abdomen:new Set(),pelvis:new Set(),extremities:new Set(),spine:new Set(),skin:new Set()};
let ample={allergies:'',medications:'',pastHistory:'',lastMeal:'',events:''};
let vitals={hr:'',sbp:'',dbp:'',rr:'',spo2:'',temp:'',glic:'',mentalStatus:null};

const app=document.getElementById('app');

// =======================================
// CALCULATIONS
// =======================================
function gcsTotal(){
  if(disability.gcsEye===null||disability.gcsVerbal===null||disability.gcsMotor===null)return null;
  return disability.gcsEye+disability.gcsVerbal+disability.gcsMotor;
}
function gcsCategory(total){
  if(total===null)return'pending';
  if(total<=8)return'severe';
  if(total<=12)return'moderate';
  return'mild';
}
function shockIndex(){
  const hr=parseInt(vitals.hr),sbp=parseInt(vitals.sbp);
  if(isNaN(hr)||isNaN(sbp)||sbp===0)return null;
  return (hr/sbp).toFixed(2);
}
function calcMAP(){
  const sbp=parseInt(vitals.sbp),dbp=parseInt(vitals.dbp);
  if(isNaN(sbp)||isNaN(dbp))return null;
  return Math.round(dbp+(sbp-dbp)/3);
}
function shockClass(){
  const hr=parseInt(vitals.hr),sbp=parseInt(vitals.sbp),rr=parseInt(vitals.rr);
  if(isNaN(hr)||isNaN(sbp))return null;
  const altMS=vitals.mentalStatus==='pain'||vitals.mentalStatus==='unresponsive';
  if((hr>140&&sbp<70)||(hr>140&&altMS)||(sbp<70&&altMS)||(hr>120&&sbp<90&&altMS))return 4;
  if(hr>120&&sbp<90)return 3;
  if(!isNaN(rr)&&rr>=30&&sbp<90)return 3;
  if(hr>120&&sbp<100&&vitals.mentalStatus==='verbal')return 3;
  if(hr>100&&sbp>=90&&sbp<=120)return 2;
  if(!isNaN(rr)&&rr>=20&&rr<30&&hr>100)return 2;
  return 1;
}
function shockInfo(cls){
  const d={
    1:{label:'Classe I',detail:'Perda < 750 mL (< 15%). Cristaloide.',css:'shock-i'},
    2:{label:'Classe II',detail:'Perda 750\u20131500 mL (15\u201330%). Cristaloide + hemoderivados.',css:'shock-ii'},
    3:{label:'Classe III',detail:'Perda 1500\u20132000 mL (30\u201340%). Hemoderivados + TXA < 3 h.',css:'shock-iii'},
    4:{label:'Classe IV',detail:'Perda > 2000 mL (> 40%). Protocolo de transfusão maciça.',css:'shock-iv'}
  };
  return d[cls]||{label:'?',detail:'Preencha FC e PAS.',css:'shock-pending'};
}
function hasLethalTriad(){
  const hypo=exposure.tempStatus==='hypothermic'||(vitals.temp&&parseFloat(vitals.temp)<35);
  const sc=shockClass();
  const shock=sc!==null&&sc>=3;
  const coag=circulation.interventions.has('massive_transfusion')||circulation.interventions.has('blood_products');
  return hypo&&(shock||coag);
}
function hasBeckTriad(){
  const jvd=breathing.findings.has('distended_neck_veins')||secondary.neck.has('jvd');
  const hypo=!isNaN(parseInt(vitals.sbp))&&parseInt(vitals.sbp)<90;
  const pericardial=fast.pericardial==='positive';
  const muffled=secondary.chest.has('muffled_heart_sounds');
  return jvd&&(hypo||pericardial)&&(muffled||pericardial);
}
function hasCushingTriad(){
  const hr=parseInt(vitals.hr),sbp=parseInt(vitals.sbp);
  if(isNaN(hr)||isNaN(sbp))return false;
  return sbp>=160&&hr<60&&(breathing.findings.has('tachypnea')||breathing.status==='abnormal');
}
function fastAbdomPos(){return fast.ruq==='positive'||fast.luq==='positive'||fast.suprapubic==='positive';}
function isTraumaTeamActivation(){
  const c=[];
  const gcs=gcsTotal();
  if(gcs!==null&&gcs<=8)c.push('GCS \u2264 8');
  if(vitals.sbp&&parseInt(vitals.sbp)<90)c.push('PAS < 90');
  if(vitals.rr&&(parseInt(vitals.rr)<10||parseInt(vitals.rr)>29))c.push('FR < 10 ou > 29');
  if(mechanism.type==='penetrating')c.push('Penetrante');
  if(mechanism.details.has('mvc_ejection'))c.push('Ejeção');
  if(mechanism.details.has('mvc_death_occupant'))c.push('Morte de ocupante');
  if(mechanism.details.has('fall_gt6m'))c.push('Queda > 6 m');
  if(mechanism.details.has('pedestrian'))c.push('Atropelamento');
  if(airway.patent==='obstructed')c.push('VA obstruída');
  if(breathing.status==='absent')c.push('Apneia');
  if(circulation.pulse==='absent')c.push('Pulso ausente');
  if(fast.pericardial==='positive')c.push('FAST pericárdico +');
  if(fastAbdomPos())c.push('FAST abdominal +');
  if(disability.pupils==='fixed_bilateral')c.push('Pupilas fixas bilat.');
  if(secondary.pelvis.has('instability'))c.push('Instab. pélvica');
  if(circulation.interventions.has('massive_transfusion'))c.push('PTM ativado');
  if(exposure.findings.has('amputation'))c.push('Amputação');
  if(exposure.findings.has('open_fracture'))c.push('Fratura exposta');
  const sc=shockClass();
  if(sc&&sc>=3)c.push('Choque Classe '+sc);
  const si=shockIndex();
  if(si!==null&&parseFloat(si)>=1.0)c.push('IC \u2265 1,0');
  return c;
}
function hasCriticalFindings(){
  if(airway.patent==='obstructed')return true;
  if(breathing.status==='absent')return true;
  if(circulation.pulse==='absent')return true;
  const gcs=gcsTotal();
  if(gcs!==null&&gcs<=8)return true;
  if(disability.pupils==='fixed_unilateral'||disability.pupils==='fixed_bilateral')return true;
  return false;
}
function detectAnticoagulants(){
  if(!ample.medications)return [];
  const m=ample.medications.toLowerCase();
  const hits=[];
  if(/varfarina|warfarina|marevan/.test(m))hits.push('Varfarina');
  if(/rivaroxaban|xarelto/.test(m))hits.push('Rivaroxabana');
  if(/apixaban|eliquis/.test(m))hits.push('Apixabana');
  if(/dabigatran|pradaxa/.test(m))hits.push('Dabigatrana');
  if(/clopidogrel|plavix/.test(m))hits.push('Clopidogrel');
  if(/enoxaparina|clexane/.test(m))hits.push('Enoxaparina');
  if(/heparina/.test(m))hits.push('Heparina');
  if(/\baas\b|aspirina/.test(m))hits.push('AAS');
  if(/ticagrelor|brilinta/.test(m))hits.push('Ticagrelor');
  return hits;
}

// =======================================
// IMAGING + CONDUTA
// =======================================
function suggestedImaging(){
  const imgs=[];
  imgs.push({icon:'\u{1F4F7}',text:'RX Tórax AP',reason:'Rotina de trauma',cat:'img'});
  imgs.push({icon:'\u{1F4F7}',text:'RX Pelve AP',reason:'Rotina de trauma',cat:'img'});
  if(airway.cspine!=='cleared')imgs.push({icon:'\u{1FA7B}',text:'TC Coluna Cervical',reason:'C-spine não liberada',cat:'img'});
  const gcs=gcsTotal();
  if(gcs!==null&&gcs<=14)imgs.push({icon:'\u{1FA7B}',text:'TC Crânio sem contraste',reason:'GCS \u2264 14',cat:'img'});
  const bskull=['raccoon_eyes','battle_sign','csf_otorrhea','csf_rhinorrhea'];
  if(bskull.some(s=>disability.findings.has(s))&&!imgs.some(i=>i.text.includes('Crânio'))){
    imgs.push({icon:'\u{1FA7B}',text:'TC Crânio sem contraste',reason:'Fratura de base de crânio?',cat:'img'});
  }
  if((disability.pupils==='fixed_unilateral'||disability.pupils==='unequal')&&!imgs.some(i=>i.text.includes('Crânio'))){
    imgs.push({icon:'\u{1FA7B}',text:'TC Crânio urgente',reason:'Anisocoria — herniação?',cat:'img'});
  }
  if(mechanism.energy==='high'||breathing.findings.has('subcutaneous_emphysema')||breathing.findings.has('flail_chest')){
    imgs.push({icon:'\u{1FA7B}',text:'TC Tórax com contraste',reason:'Alta energia / achados torácicos',cat:'img'});
  }
  if(fastAbdomPos()){
    imgs.push({icon:'\u{1FA7B}',text:'TC Abdome/Pelve com contraste',reason:'FAST positivo',cat:'img'});
  }else if(mechanism.energy==='high'||secondary.abdomen.has('seatbelt_sign')||secondary.abdomen.has('evisceration')){
    imgs.push({icon:'\u{1FA7B}',text:'TC Abdome/Pelve com contraste',reason:'Alta energia / achados abdominais',cat:'img'});
  }
  if(secondary.pelvis.has('instability')){
    imgs.push({icon:'\u{1FA7B}',text:'TC Pelve 3D + Angio-TC',reason:'Instabilidade pélvica',cat:'img'});
  }
  if(secondary.spine.has('thoracic_tender')||secondary.spine.has('lumbar_tender')||secondary.spine.has('step_off')){
    imgs.push({icon:'\u{1FA7B}',text:'TC Coluna Toracolombar',reason:'Dor/deformidade',cat:'img'});
  }
  if(secondary.extremities.has('upper_deformity'))imgs.push({icon:'\u{1F4F7}',text:'RX MMSS',reason:'Deformidade',cat:'img'});
  if(secondary.extremities.has('lower_deformity'))imgs.push({icon:'\u{1F4F7}',text:'RX MMII',reason:'Deformidade',cat:'img'});
  if(secondary.neck.has('penetrating_wound'))imgs.push({icon:'\u{1FA78}',text:'Angio-TC cervical',reason:'Ferida penetrante cervical',cat:'img'});
  if(secondary.chest.has('widened_mediastinum'))imgs.push({icon:'\u{1FA78}',text:'Angio-TC Aorta torácica',reason:'Alargamento de mediastino',cat:'img'});
  if(secondary.chest.has('sternal_fracture'))imgs.push({icon:'\u{1F9EA}',text:'ECG + Troponina',reason:'Fratura esternal — contusão miocárdica',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'Hemograma + Tipagem + Prova cruzada',reason:'Rotina',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'Gasometria + Lactato',reason:'Perfusão',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'Coagulograma (TP, TTPa, Fib)',reason:'Coagulopatia',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'U, Cr, Eletrólitos',reason:'Função renal',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'\u03B2-HCG (mulher em idade fértil)',reason:'Gravidez',cat:'lab'});
  const sc=shockClass();
  if(sc&&sc>=2)imgs.push({icon:'\u{1F9EA}',text:'TEG/ROTEM se disponível',reason:'Choque hemorrágico',cat:'lab'});
  if(secondary.extremities.has('crush_injury'))imgs.push({icon:'\u{1F9EA}',text:'CPK, Mioglobina, EAS',reason:'Rabdomiólise',cat:'lab'});
  if(secondary.pelvis.has('blood_meatus'))imgs.push({icon:'\u{1FA7B}',text:'Uretrocistografia retrógrada',reason:'Sangue em meato — antes de cateter',cat:'img'});
  return imgs;
}
function suggestConduta(){
  const items=[];
  const gcs=gcsTotal();
  const sc=shockClass();
  if(airway.patent==='obstructed'||airway.patent==='compromised'){
    items.push({icon:'\u{1F6A8}',text:'<strong>Via aérea definitiva:</strong> IOT com ISR. Via cirúrgica como backup.',urgent:true});
  }
  if(gcs!==null&&gcs<=8&&!airway.interventions.has('orotracheal')&&!airway.interventions.has('surgical_airway')){
    items.push({icon:'\u{1F6A8}',text:'<strong>GCS \u2264 8:</strong> IOT formal para proteção de VA.',urgent:true});
  }
  if(breathing.findings.has('deviated_trachea')&&(breathing.findings.has('decreased_breath_left')||breathing.findings.has('decreased_breath_right'))){
    items.push({icon:'\u{1F6A8}',text:'<strong>Pneumotórax hipertensivo:</strong> Descompressão com agulha (2\u00BA EIC, LMC) + drenagem em selo d\'água (5\u00BA EIC, LAM).',urgent:true});
  }
  if(breathing.findings.has('open_wound')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Pneumotórax aberto:</strong> Curativo de 3 pontas + drenagem torácica.',warn:true});
  }
  if(breathing.findings.has('flail_chest')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Tórax instável:</strong> Analgesia agressiva. IOT se insuf. respiratória.',warn:true});
  }
  if(sc&&sc>=3){
    items.push({icon:'\u{1F6A8}',text:'<strong>Choque Classe '+sc+':</strong> PTM (1:1:1). TXA 1 g IV se < 3 h.',urgent:true});
  }else if(sc===2){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Choque Classe II:</strong> Cristaloide aquecido (RL). Preparar hemoderivados.',warn:true});
  }
  if(fast.pericardial==='positive'){
    items.push({icon:'\u{1F6A8}',text:'<strong>Tamponamento:</strong> Pericardiocentese ou toracotomia. Chamar cirurgia.',urgent:true});
  }else if(hasBeckTriad()){
    items.push({icon:'\u{1F6A8}',text:'<strong>Tríade de Beck:</strong> Suspeita de tamponamento. FAST subxifoideo.',urgent:true});
  }
  if(fastAbdomPos()&&sc&&sc>=3){
    items.push({icon:'\u{1F6A8}',text:'<strong>FAST + e instável:</strong> Laparotomia exploradora. NÃO aguardar TC.',urgent:true});
  }else if(fastAbdomPos()){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>FAST + e estável:</strong> TC abdome/pelve. Cirurgia de sobreaviso.',warn:true});
  }
  if(secondary.pelvis.has('instability')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Fratura pélvica instável:</strong> Cinta pélvica imediata. Angioembolização se refratário.',urgent:true});
  }
  if(circulation.bleeding.has('external_uncontrolled')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Hemorragia externa não controlada:</strong> Pressão direta + torniquete em extremidades.',urgent:true});
  }
  if(disability.pupils==='fixed_unilateral'){
    items.push({icon:'\u{1F6A8}',text:'<strong>Herniação cerebral:</strong> Manitol 1 g/kg IV ou NaCl 23,4% 30 mL. Cabeceira 30\u00B0. TC crânio urgente.',urgent:true});
  }
  if(disability.pupils==='fixed_bilateral'){
    items.push({icon:'\u{1F6A8}',text:'<strong>Pupilas fixas bilaterais:</strong> Avaliar herniação, hipotermia, intoxicação. TC urgente.',urgent:true});
  }
  if(disability.findings.has('seizure')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Convulsão pós-traumática:</strong> Fenitoína 20 mg/kg IV ou Levetiracetam 20 mg/kg IV.',warn:true});
  }
  if(hasCushingTriad()){
    items.push({icon:'\u{1F6A8}',text:'<strong>Tríade de Cushing:</strong> HIC grave. Manitol / NaCl hipertônico. Cabeceira 30\u00B0. TC crânio.',urgent:true});
  }
  if(hasLethalTriad()){
    items.push({icon:'\u{1F6A8}',text:'<strong>TRÍADE LETAL:</strong> Damage control. Aquecer. Corrigir coagulopatia.',urgent:true});
  }
  if(exposure.tempStatus==='hypothermic'){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Hipotermia:</strong> Aquecimento ativo (cobertores, fluidos a 39\u00B0C).',warn:true});
  }
  if(exposure.findings.has('impaled_object')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Objeto empalado:</strong> NÃO remover no PS. Estabilizar. Remoção em centro cirúrgico.',warn:true});
  }
  if(exposure.findings.has('open_fracture')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Fratura exposta:</strong> ATB (Cefazolina 2 g IV). Irrigação. Imobilização.',warn:true});
  }
  if(exposure.findings.has('burns')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Queimaduras:</strong> SCQ (regra dos 9). Parkland: 4 mL \u00D7 kg \u00D7 %SCQ / 24 h.',warn:true});
  }
  if(secondary.extremities.has('compartment_syndrome')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Síndrome compartimental:</strong> Fasciotomia de emergência.',urgent:true});
  }
  if(secondary.extremities.has('crush_injury')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Esmagamento:</strong> Hidratação agressiva. Monitorar CPK, K\u207A, mioglobinúria.',warn:true});
  }
  if(secondary.abdomen.has('evisceration')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Evisceração:</strong> NÃO reintroduzir. Compressas úmidas SF morno. Laparotomia.',urgent:true});
  }
  if(secondary.skin.has('tetanus_needed')){
    items.push({icon:'\u{1F489}',text:'<strong>Profilaxia tétano:</strong> Cartão vacinal. dT + IGHAT se indicado.',warn:false});
  }
  if(mechanism.type==='penetrating'&&secondary.neck.has('penetrating_wound')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Ferida penetrante cervical:</strong> Avaliar zona. Angio-TC. Exploração se sinais duros.',urgent:true});
  }
  if(secondary.chest.has('widened_mediastinum')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Alargamento mediastino:</strong> Suspeita de lesão aórtica. Angio-TC. PAS 80\u2013100, FC < 80.',urgent:true});
  }
  if(secondary.chest.has('sternal_fracture')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Fratura esternal:</strong> Monitor cardíaco. ECG + Troponina seriada.',warn:true});
  }
  if(!circulation.interventions.has('iv_access_2')){
    items.push({icon:'\u{1F4A7}',text:'<strong>Acesso venoso:</strong> 2 acessos IV calibrosos (14\u201316G). IO se falha.',warn:false});
  }
  if(ample.medications){
    const meds=ample.medications.toLowerCase();
    if(/varfarina|warfarina|marevan/.test(meds))items.push({icon:'\u26A0\uFE0F',text:'<strong>Reversão varfarina:</strong> Vit. K 10 mg IV + CCP 25\u201350 UI/kg.',warn:true});
    if(/rivaroxaban|xarelto|apixaban|eliquis/.test(meds))items.push({icon:'\u26A0\uFE0F',text:'<strong>Reversão DOAC:</strong> Andexanet alfa se disponível. Ou CCP 50 UI/kg.',warn:true});
    if(/dabigatran|pradaxa/.test(meds))items.push({icon:'\u26A0\uFE0F',text:'<strong>Reversão dabigatrana:</strong> Idarucizumab (Praxbind) 5 g IV.',warn:true});
    if(/heparina|enoxaparina|clexane/.test(meds))items.push({icon:'\u26A0\uFE0F',text:'<strong>Reversão heparina:</strong> Protamina 1 mg / 100 UI HNF.',warn:true});
    if(/\baas\b|aspirina|clopidogrel|plavix/.test(meds))items.push({icon:'\u26A0\uFE0F',text:'<strong>Antiplaquetários:</strong> Transfusão de plaquetas se sangramento. DDAVP 0,3 \u00B5g/kg IV.',warn:true});
  }
  const map=calcMAP();
  if(map!==null&&map<65)items.push({icon:'\u{1F6A8}',text:'<strong>PAM < 65 ('+map+' mmHg):</strong> Reposição agressiva. Vasopressores se refratário.',urgent:true});
  if(sc&&sc>=2&&!circulation.interventions.has('tranexamic'))items.push({icon:'\u26A0\uFE0F',text:'<strong>Ácido tranexâmico:</strong> 1 g IV em 10 min se < 3 h, depois 1 g em 8 h.',warn:true});
  if(items.length===0)items.push({icon:'\u2705',text:'<strong>Trauma de baixa complexidade:</strong> Observação + reavaliação seriada em 30\u201360 min.',warn:false});
  return items;
}

// =======================================
// UI HELPERS
// =======================================
function progHTML(idx,allDone){
  let h='<div class="progress-bar">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done':i===idx?'active':'';h+='<div class="progress-step '+c+'"></div>'}
  h+='</div><div class="progress-meta">';
  if(allDone){
    h+='<span class="step-name">Resultado</span><span>'+TOTAL_STEPS+'/'+TOTAL_STEPS+'</span>';
  }else{
    const phaseCls=STEP_PHASE[idx]==='Primary'?'phase-primary':'phase-secondary';
    h+='<span><span class="phase-label '+phaseCls+'">'+STEP_PHASE[idx]+'</span><span class="step-name">'+STEP_LABELS[idx]+'</span></span>';
    h+='<span>'+(idx+1)+'/'+TOTAL_STEPS+'</span>';
  }
  h+='</div>';
  return h;
}
function collapsible(id,title,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+='<div class="collapse-header" onclick="toggleSection(\''+id+'\')">';
  h+='<h3>'+title+'</h3><span class="collapse-arrow '+(open?'open':'')+'">\u25BC</span></div>';
  h+='<div class="collapse-body '+(open?'open':'hidden')+'">';
  if(open)h+=contentFn();
  h+='</div></div>';
  return h;
}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms||10)}catch(e){}}
function optBtn(action,value,icon,label,tagClass,tagText,isSelected){
  return '<button type="button" class="option-btn '+(isSelected?'selected':'')+'" onclick="handleOption(\''+action+'\',\''+value+'\')"><span class="icon">'+icon+'</span><span class="label">'+label+'</span><span class="tag '+tagClass+'">'+tagText+'</span></button>';
}
function checkBtn(onClick,isChecked,isAlert,label){
  const cls='check-btn '+(isChecked?(isAlert?'checked alert':'checked'):'');
  return '<button type="button" class="'+cls+'" onclick="'+onClick+'"><span class="check-box">'+(isChecked?'\u2713':'')+'</span><span class="label">'+label+'</span></button>';
}
function checkGrid(items,dense){
  return '<div class="check-grid'+(dense?' dense':'')+'">'+items.join('')+'</div>';
}
function navRow(showBack,canNext,nextLabel){
  let h='<div class="nav-row">';
  if(showBack)h+='<button type="button" class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h+='<button type="button" class="nav-btn primary" '+(canNext?'':'disabled')+' onclick="next()">'+(nextLabel||'Próximo \u2192')+'</button>';
  h+='</div>';
  return h;
}
function inputField(label,field,value,placeholder,unit){
  let cls='vital-input';
  const v=parseFloat(value);
  if(!isNaN(v)){
    if(field==='hr'&&(v>120||v<50))cls+=' danger';
    else if(field==='hr'&&v>100)cls+=' warn';
    else if(field==='sbp'&&v<90)cls+=' danger';
    else if(field==='sbp'&&v<100)cls+=' warn';
    else if(field==='dbp'&&v<50)cls+=' danger';
    else if(field==='dbp'&&v<60)cls+=' warn';
    else if(field==='rr'&&(v<10||v>30))cls+=' danger';
    else if(field==='rr'&&(v<12||v>20))cls+=' warn';
    else if(field==='spo2'&&v<90)cls+=' danger';
    else if(field==='spo2'&&v<94)cls+=' warn';
    else if(field==='temp'&&v<35)cls+=' danger';
    else if(field==='temp'&&(v<36||v>38))cls+=' warn';
    else if(field==='glic'&&(v<60||v>250))cls+=' danger';
    else if(field==='glic'&&(v<70||v>200))cls+=' warn';
  }
  return '<div class="input-group"><span class="input-label"><span>'+label+'</span><span class="input-unit">'+unit+'</span></span><input type="number" inputmode="decimal" step="any" class="'+cls+'" data-field="vital_'+field+'" value="'+value+'" placeholder="'+placeholder+'" oninput="setVitalInput(\''+field+'\',this.value);scheduleVitalRender()"></div>';
}
function escHTML(str){
  return String(str===null||str===undefined?'':str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
}
function banner(type,icon,text){
  return '<div class="banner '+type+'"><span class="bi">'+icon+'</span><span class="bt">'+text+'</span></div>';
}

// =======================================
// RENDER ROUTER
// =======================================
let _vitalRenderTimer=null;
function scheduleVitalRender(){
  if(_vitalRenderTimer)clearTimeout(_vitalRenderTimer);
  _vitalRenderTimer=setTimeout(()=>render(),280);
}

function render(){
  const activeEl=document.activeElement;
  let focusField=null,focusPos=null;
  if(activeEl&&activeEl.tagName==='INPUT'&&activeEl.getAttribute('data-field')){
    focusField=activeEl.getAttribute('data-field');
    focusPos=activeEl.selectionStart;
  }

  switch(currentStep){
    case 0:renderMechanism();break;
    case 1:renderAirway();break;
    case 2:renderBreathing();break;
    case 3:renderCirculation();break;
    case 4:renderDisability();break;
    case 5:renderExposure();break;
    case 6:renderFAST();break;
    case 7:renderSecondary();break;
    case 8:renderAMPLE();break;
    case 9:renderVitals();break;
    default:renderResult();break;
  }

  if(currentStep>=TOTAL_STEPS&&!evalEndTime){
    evalEndTime=new Date();
    const el=document.getElementById('evalTimer');
    if(el)el.classList.add('stopped');
  }

  if(focusField){
    const el=document.querySelector('[data-field="'+focusField+'"]');
    if(el){
      el.focus();
      if(focusPos!==null&&el.setSelectionRange){
        try{el.setSelectionRange(focusPos,focusPos)}catch(e){}
      }
    }
  }

  if(window._needsScrollTop){
    window.scrollTo({top:0,behavior:'smooth'});
    window._needsScrollTop=false;
  }
}

function renderFAST(){
  let h=progHTML(6,false);
  h+='<div class="card">';
  h+='<h2>FAST</h2>';
  h+='<p class="subtitle">Toque para ciclar: — &rarr; Negativo &rarr; Positivo &rarr; Indet.</p>';

  h+='<div class="fast-grid">';
  const quadrants=[
    {id:'ruq',label:'Hepatorrenal (Morrison)',icon:'\u{1FAC0}'},
    {id:'luq',label:'Esplenorrenal (LUQ)',icon:'\u{1FAC0}'},
    {id:'suprapubic',label:'Suprapúbico (Douglas)',icon:'\u{1FAC0}'},
    {id:'pericardial',label:'Subxifoideo (Pericárdio)',icon:'\u2764\uFE0F'}
  ];
  for(const q of quadrants){
    const val=fast[q.id];
    let cls='fast-btn';
    let status='Toque para avaliar';
    if(val==='positive'){cls+=' positive';status='\u2716 POSITIVO';}
    else if(val==='negative'){cls+=' negative';status='\u2713 Negativo';}
    else if(val==='indeterminate'){cls+=' indeterminate';status='\u2014 Indet.';}
    h+='<div class="'+cls+'" onclick="cycleFAST(\''+q.id+'\')">';
    h+='<div class="fast-icon">'+q.icon+'</div>';
    h+='<div class="fast-label">'+q.label+'</div>';
    h+='<div class="fast-status">'+status+'</div>';
    h+='</div>';
  }
  h+='</div>';

  const anyPos=[fast.ruq,fast.luq,fast.suprapubic,fast.pericardial].some(v=>v==='positive');
  if(anyPos){
    let msg='FAST POSITIVO — ';
    if(fast.pericardial==='positive')msg+='Líquido pericárdico: tamponamento? ';
    if(fastAbdomPos())msg+='Líquido abdominal: instável \u2192 laparotomia; estável \u2192 TC.';
    h+=banner('alert','\u{1F6A8}',msg);
  }
  const allNeg=[fast.ruq,fast.luq,fast.suprapubic,fast.pericardial].every(v=>v==='negative');
  if(allNeg){
    h+=banner('info','\u2139\uFE0F','FAST negativo NÃO exclui lesão intra-abdominal (sens. ~85%). Repetir ou TC se suspeita.');
  }

  h+=navRow(true,true);
  h+='</div>';
  app.innerHTML=h;
}

  const hr=parseInt(vitals.hr),sbp=parseInt(vitals.sbp),rr=parseInt(vitals.rr),spo2=parseInt(vitals.spo2),temp=parseFloat(vitals.temp),glic=parseFloat(vitals.glic);
  const warnings=[];
  if(!isNaN(hr)&&(hr>120||hr<50))warnings.push(hr>120?'Taquicardia':'Bradicardia');
  if(!isNaN(sbp)&&sbp<90)warnings.push('Hipotensão');
  if(!isNaN(rr)&&(rr<10||rr>30))warnings.push(rr<10?'Bradipneia':'Taquipneia');
  if(!isNaN(spo2)&&spo2<90)warnings.push('Hipoxemia');
  if(!isNaN(temp)&&temp<35)warnings.push('Hipotermia');
  if(!isNaN(glic)&&glic<60)warnings.push('Hipoglicemia');
  if(warnings.length>0){
    h+=banner('alert','\u{1F6A8}',warnings.join(' &middot; '));
  }

  if(hasCushingTriad()){
    h+=banner('alert','\u{1F9E0}','TRÍADE DE CUSHING (HAS + bradicardia + resp. anormal) — HIC grave. TC crânio urgente.');
  }

  const map=calcMAP();
  if(map!==null){
    const mapClass=map<65?'danger':map<70?'warn':'ok';
    const mapLabel=map<65?'Hipoperfusão — reposição':map<70?'Limítrofe':'PAM adequada';
    h+='<div class="metric-row '+mapClass+'"><div class="metric-value">'+map+'</div><div class="metric-info"><strong>PAM</strong> &middot; '+mapLabel+'</div></div>';
  }
  const si=shockIndex();
  if(si!==null){
    const siVal=parseFloat(si);
    const siClass=siVal>=1.0?'danger':siVal>=0.7?'warn':'ok';
    const siLabel=siVal>=1.0?'Alta prob. de choque':siVal>=0.7?'Limítrofe — monitorar':'Normal';
    h+='<div class="metric-row '+siClass+'"><div class="metric-value">'+si+'</div><div class="metric-info"><strong>Índice de Choque (FC/PAS)</strong> &middot; '+siLabel+'</div></div>';
  }

  const sc=shockClass();
  const sinfo=sc?shockInfo(sc):shockInfo(null);
  h+='<div class="shock-display '+sinfo.css+'">';
  h+='<div class="shock-class">'+(sc||'?')+'</div>';
  h+='<div class="shock-info"><div class="shock-label">Choque Hemorrágico '+sinfo.label+'</div><div class="shock-detail">'+sinfo.detail+'</div></div>';
  h+='</div>';

  h+=navRow(true,true,'Ver Resultado \u2192');
  h+='</div>';
  app.innerHTML=h;
}

function renderResult(){

  const fastUsed=fast.ruq||fast.luq||fast.suprapubic||fast.pericardial;
  if(fastUsed){
    n+='\nFAST\n----------------------------------------\n';
    const fastL={ruq:'Hepatorrenal',luq:'Esplenorrenal',suprapubic:'Suprapúbico',pericardial:'Pericárdio'};
    const stL={positive:'POSITIVO',negative:'Negativo',indeterminate:'Indeterminado'};
    for(const q of ['ruq','luq','suprapubic','pericardial'])if(fast[q])n+=fastL[q]+': '+(stL[fast[q]]||'—')+'\n';
  }

  if(ample.allergies||ample.medications||ample.pastHistory||ample.lastMeal||ample.events){
    n+='\nAMPLE\n----------------------------------------\n';
    if(ample.allergies)n+='A - Alergias: '+ample.allergies+'\n';
    if(ample.medications)n+='M - Medicamentos: '+ample.medications+'\n';
    if(ample.pastHistory)n+='P - Passado: '+ample.pastHistory+'\n';
    if(ample.lastMeal)n+='L - Últ. refeição: '+ample.lastMeal+'\n';
    if(ample.events)n+='E - Eventos: '+ample.events+'\n';
  }

  const anyVitals=vitals.hr||vitals.sbp||vitals.rr||vitals.spo2||vitals.temp||vitals.glic||vitals.mentalStatus;
  if(anyVitals){
    n+='\nSINAIS VITAIS\n----------------------------------------\n';
    if(vitals.hr)n+='FC: '+vitals.hr+' bpm\n';
    if(vitals.sbp)n+='PA: '+vitals.sbp+'/'+(vitals.dbp||'--')+' mmHg\n';
    if(map!==null)n+='PAM: '+map+' mmHg\n';
    if(vitals.rr)n+='FR: '+vitals.rr+' irpm\n';
    if(vitals.spo2)n+='SpO2: '+vitals.spo2+'%\n';
    if(vitals.temp)n+='Temp: '+vitals.temp+'°C\n';
    if(vitals.glic)n+='Glicemia: '+vitals.glic+' mg/dL\n';
    const avL={alert:'Alerta',verbal:'Verbal',pain:'Dor',unresponsive:'Irresponsivo'};
    if(vitals.mentalStatus)n+='AVPU: '+avL[vitals.mentalStatus]+'\n';
    if(si)n+='IC: '+si+'\n';
    if(sc)n+='Choque Classe '+sc+' — '+shockInfo(sc).detail+'\n';
  }

  const regionL={head:'Cabeça',neck:'Pescoço',chest:'Tórax',abdomen:'Abdome',pelvis:'Pelve',extremities:'Extrem.',spine:'Coluna',skin:'Pele'};
  const iL={};
  for(const r of SECONDARY_REGIONS)for(const it of r.items)iL[it.id]=it.l;
  let hasSec=false;
  for(const k of Object.keys(regionL))if(secondary[k].size>0){hasSec=true;break}
  if(hasSec){
    n+='\nSECONDARY SURVEY\n----------------------------------------\n';
    for(const k of Object.keys(regionL)){
      if(secondary[k].size>0)n+=regionL[k]+': '+[...secondary[k]].map(id=>iL[id]||id).join(', ')+'\n';
    }
  }

  const crit=isTraumaTeamActivation();
  if(crit.length>0){
    n+='\nATIVAÇÃO DO TIME DE TRAUMA\n----------------------------------------\n';
    for(const c of crit)n+='- '+c+'\n';
  }
  if(hasCushingTriad())n+='\n*** TRÍADE DE CUSHING — HIC grave ***\n';
  if(hasLethalTriad())n+='\n*** TRÍADE LETAL — Damage control ***\n';

  const condutas=suggestConduta();
  if(condutas.length>0){
    n+='\nCONDUTA\n----------------------------------------\n';
    for(const c of condutas)n+='- '+c.text.replace(/<[^>]*>/g,'')+'\n';
  }
  const imgs=suggestedImaging();
  n+='\nEXAMES\n----------------------------------------\n';
  const img=imgs.filter(i=>i.cat==='img'),lab=imgs.filter(i=>i.cat==='lab');
  if(img.length>0){n+='Imagem:\n';for(const i of img)n+='  - '+i.text+' ('+i.reason+')\n';}
  if(lab.length>0){n+='Laboratório:\n';for(const l of lab)n+='  - '+l.text+' ('+l.reason+')\n';}

  const esc=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="note-text" id="noteContent">'+esc+'</div><button type="button" class="copy-btn" id="copyBtn" onclick="copyNote()">\u{1F4CB} Copiar nota</button>';
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el)return;
  const text=el.textContent;
  const done=()=>{
    const btn=document.getElementById('copyBtn');
    if(!btn)return;
    btn.textContent='\u2713 Copiado';
    btn.classList.add('copied');
    vibrate(30);
    setTimeout(()=>{btn.textContent='\u{1F4CB} Copiar nota';btn.classList.remove('copied');},1800);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else fallback();
  function fallback(){
    const range=document.createRange();
    range.selectNodeContents(el);
    const sel=window.getSelection();
    sel.removeAllRanges();sel.addRange(range);
    try{document.execCommand('copy');done();}catch(e){}
    sel.removeAllRanges();
  }
}

// =======================================
// ACTIONS
// =======================================
function handleOption(action,value){
  vibrate(10);
  switch(action){
    case 'mechanism_type':mechanism.type=mechanism.type===value?null:value;break;
    case 'mechanism_energy':mechanism.energy=mechanism.energy===value?null:value;break;
    case 'airway_patent':airway.patent=airway.patent===value?null:value;break;
    case 'airway_cspine':airway.cspine=airway.cspine===value?null:value;break;
    case 'breathing_status':breathing.status=breathing.status===value?null:value;break;
    case 'circ_pulse':circulation.pulse=circulation.pulse===value?null:value;break;
    case 'circ_skin':circulation.skinStatus=circulation.skinStatus===value?null:value;break;
    case 'disability_pupils':
      if(disability.pupils===value){disability.pupils=null;disability.laterality=null;}
      else{disability.pupils=value;if(value==='equal_reactive'||value==='fixed_bilateral'||value==='miosis')disability.laterality=null;}
      break;
    case 'exposure_temp':exposure.tempStatus=exposure.tempStatus===value?null:value;break;
  }
  render();
}
function toggleMechDetail(id){vibrate(10);mechanism.details.has(id)?mechanism.details.delete(id):mechanism.details.add(id);render()}
function toggleSetField(obj,field,id){
  vibrate(10);
  const map={airway,breathing,circulation,exposure,disability};
  const t=map[obj];
  if(!t)return;
  t[field].has(id)?t[field].delete(id):t[field].add(id);
  render();
}
function setGCS(c,v){
  vibrate(10);
  if(c==='eye')disability.gcsEye=disability.gcsEye===v?null:v;
  else if(c==='verbal')disability.gcsVerbal=disability.gcsVerbal===v?null:v;
  else if(c==='motor')disability.gcsMotor=disability.gcsMotor===v?null:v;
  render();
}
function setLaterality(s){vibrate(10);disability.laterality=disability.laterality===s?null:s;render()}
function cycleFAST(q){
  vibrate(10);
  const order=[null,'negative','positive','indeterminate'];
  const idx=order.indexOf(fast[q]);
  fast[q]=order[(idx+1)%order.length];
  render();
}
function toggleSecondary(r,i){
  vibrate(10);
  secondary[r].has(i)?secondary[r].delete(i):secondary[r].add(i);
  render();
}
window._activeSecondaryRegion='head';
function switchSecondaryRegion(k){window._activeSecondaryRegion=k;render()}

function setVitalInput(f,v){vitals[f]=v}
function setVital(f,v){vibrate(10);vitals[f]=v;render()}
function setAmple(f,v){ample[f]=v}
let _ampleMedsTimer=null;
function setAmpleMeds(v){ample.medications=v;if(_ampleMedsTimer)clearTimeout(_ampleMedsTimer);_ampleMedsTimer=setTimeout(()=>render(),400);}

function toggleSection(id){sections[id]=!sections[id];render()}
function jumpToResult(){currentStep=TOTAL_STEPS;window._needsScrollTop=true;render()}

function next(){if(currentStep<=TOTAL_STEPS-1){currentStep++;window._needsScrollTop=true;render()}}
function prev(){if(currentStep>0){currentStep--;window._needsScrollTop=true;render()}}

function requestRestart(){showRestartConfirm=true;render()}
function cancelRestart(){showRestartConfirm=false;render()}
function confirmRestart(){
  currentStep=0;
  evalEndTime=null;
  showRestartConfirm=false;
  mechanism={type:null,energy:null,details:new Set()};
  airway={patent:null,cspine:null,findings:new Set(),interventions:new Set()};
  breathing={status:null,findings:new Set(),interventions:new Set()};
  circulation={pulse:null,skinStatus:null,bleeding:new Set(),interventions:new Set()};
  disability={gcsEye:null,gcsVerbal:null,gcsMotor:null,pupils:null,laterality:null,findings:new Set()};
  exposure={tempStatus:null,findings:new Set(),interventions:new Set()};
  fast={ruq:null,luq:null,suprapubic:null,pericardial:null};
  secondary={head:new Set(),neck:new Set(),chest:new Set(),abdomen:new Set(),pelvis:new Set(),extremities:new Set(),spine:new Set(),skin:new Set()};
  ample={allergies:'',medications:'',pastHistory:'',lastMeal:'',events:''};
  vitals={hr:'',sbp:'',dbp:'',rr:'',spo2:'',temp:'',glic:'',mentalStatus:null};
  sections={conduta:true,imaging:true,primary:false,secondary:false,vitals:false,note:false};
  window._activeSecondaryRegion='head';
  window._needsScrollTop=true;
  render();
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();if(currentStep<TOTAL_STEPS)next();}
  if(e.key==='ArrowLeft'){e.preventDefault();prev();}
});

// Swipe navigation
let touchX=null,touchY=null;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('.fast-grid,.score-options,.tab-bar,.options,.note-text,input,textarea,button,.collapse-header'))return;
  touchX=e.touches[0].clientX;
  touchY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(touchX===null)return;
  const dx=e.changedTouches[0].clientX-touchX;
  const dy=e.changedTouches[0].clientY-touchY;
  touchX=null;touchY=null;
  if(Math.abs(dx)<80||Math.abs(dy)>Math.abs(dx)*0.7)return;
  if(dx<0&&currentStep<TOTAL_STEPS)next();
  else if(dx>0&&currentStep>0)prev();
},{passive:true});

// Init
window._needsScrollTop=false;
render();
</script>
