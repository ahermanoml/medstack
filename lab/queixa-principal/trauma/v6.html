<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Trauma — Avaliação ATLS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-text-size-adjust:100%;overflow-x:hidden}

  .tag-red{background:#7f1d1d;color:#fca5a5}.tag-yellow{background:#78350f;color:#fcd34d}.tag-green{background:#14532d;color:#86efac}.tag-blue{background:#1e3a5f;color:#93c5fd}.tag-gray{background:#374151;color:#d1d5db}
  .check-btn{background:#0f172a;border:1.5px solid #334155;border-radius:.65rem;padding:.65rem .9rem;color:#cbd5e1;font-size:.86rem;cursor:pointer;transition:border-color .15s,background .15s,color .15s,transform .1s;text-align:left;display:flex;align-items:center;gap:.7rem;-webkit-tap-highlight-color:transparent;min-height:2.7rem;user-select:none;font-family:inherit}

  .result-card{text-align:center;padding:1.75rem 1.25rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:4.5rem;height:4.5rem;border-radius:50%;font-size:1.3rem;font-weight:800;margin-bottom:.75rem;animation:badgePop .4s cubic-bezier(.22,1,.36,1)}

  .gcs-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-top:.15rem}
  .gcs-plus{font-size:1rem;color:#475569;font-weight:700}
  .score-row{margin-bottom:.65rem}
  .score-row-label{font-size:.78rem;color:#94a3b8;margin-bottom:.3rem;display:flex;justify-content:space-between}

  .banner.info{background:#0f172a;border-color:#1e3a5f;color:#93c5fd}

  .vital-input{background:#0f172a;border:1.5px solid #334155;border-radius:.5rem;padding:.55rem .75rem;color:#f1f5f9;font-size:.88rem;width:100%;font-family:inherit;transition:border-color .15s,box-shadow .15s;min-height:2.45rem;-moz-appearance:textfield}

  .vital-input.danger{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.1)}
  .input-row{display:flex;gap:.55rem;margin-bottom:.55rem}
  .input-group{flex:1;display:flex;flex-direction:column;gap:.25rem}
  .input-label{font-size:.72rem;color:#94a3b8;font-weight:500}
  .input-unit{font-size:.62rem;color:#64748b}

<body>
<header>
  <a href="../trauma.html" class="back-link">&larr; Lab</a>
  <h1>Avaliação de Trauma</h1>
  <p>ATLS &middot; Primary + Secondary Survey</p>
  <div class="timer-badge" id="evalTimer">00:00</div>
</header>
<div class="container" id="app"></div>
<script>
// =======================================
// STEPS
// =======================================
const STEP_LABELS=['Mecanismo','A — Via Aérea','B — Ventilação','C — Circulação','D — Neurológico','E — Exposição','FAST','Secondary','AMPLE','Sinais Vitais'];
const TOTAL_STEPS=STEP_LABELS.length;
const evalStartTime=new Date();
let evalEndTime=null;

const timerInterval=setInterval(()=>{
  if(evalEndTime)return;
  const el=document.getElementById('evalTimer');
  if(!el)return;
  const diff=Math.floor((Date.now()-evalStartTime.getTime())/1000);
  el.textContent=String(Math.floor(diff/60)).padStart(2,'0')+':'+String(diff%60).padStart(2,'0');
},1000);

// =======================================
// STATE
// =======================================
let currentStep=0;
let showRestartConfirm=false;
let sections={conduta:true,mechanism:false,primary:false,gcs:false,fast:false,secondary:false,vitals:false,ample_result:false,imaging:true,note:false};

let mechanism={type:null,energy:null,details:new Set()};
let airway={patent:null,cspine:null,findings:new Set(),interventions:new Set()};
let breathing={status:null,findings:new Set(),interventions:new Set()};
let circulation={pulse:null,skinStatus:null,bleeding:new Set(),interventions:new Set()};
let disability={gcsEye:null,gcsVerbal:null,gcsMotor:null,pupils:null,pupilReactivity:null,laterality:null,findings:new Set()};
let exposure={tempStatus:null,findings:new Set(),interventions:new Set()};
let fast={ruq:null,luq:null,suprapubic:null,pericardial:null};
let secondary={head:new Set(),neck:new Set(),chest:new Set(),abdomen:new Set(),pelvis:new Set(),extremities:new Set(),spine:new Set(),skin:new Set()};
let ample={allergies:'',medications:'',pastHistory:'',lastMeal:'',events:''};
let vitals={hr:'',sbp:'',dbp:'',rr:'',spo2:'',temp:'',glic:'',mentalStatus:null};

const app=document.getElementById('app');

let _vitalRenderTimer=null;
function debouncedRender(){
  if(_vitalRenderTimer)clearTimeout(_vitalRenderTimer);
  _vitalRenderTimer=setTimeout(()=>render(),250);
}

// =======================================
// CALCULATIONS
// =======================================
function gcsTotal(){
  if(disability.gcsEye===null||disability.gcsVerbal===null||disability.gcsMotor===null)return null;
  return disability.gcsEye+disability.gcsVerbal+disability.gcsMotor;
}
function gcsCategory(total){
  if(total===null)return'pending';
  if(total<=8)return'severe';
  if(total<=12)return'moderate';
  return'mild';
}
function gcsPupilScore(){
  const gcs=gcsTotal();
  if(gcs===null)return null;
  let prr;
  if(disability.pupilReactivity==='both_reactive')prr=0;
  else if(disability.pupilReactivity==='one_reactive')prr=1;
  else if(disability.pupilReactivity==='none_reactive')prr=2;
  else return null;
  return Math.max(1,gcs-prr);
}
function shockIndex(){
  const hr=parseInt(vitals.hr),sbp=parseInt(vitals.sbp);
  if(isNaN(hr)||isNaN(sbp)||sbp===0)return null;
  return (hr/sbp).toFixed(2);
}
function calcMAP(){
  const sbp=parseInt(vitals.sbp),dbp=parseInt(vitals.dbp);
  if(isNaN(sbp)||isNaN(dbp))return null;
  return Math.round(dbp+(sbp-dbp)/3);
}
function calcRTS(){
  const gcs=gcsTotal();
  const sbp=parseInt(vitals.sbp),rr=parseInt(vitals.rr);
  if(gcs===null||isNaN(sbp)||isNaN(rr))return null;
  let g,s,r;
  if(gcs>=13)g=4;else if(gcs>=9)g=3;else if(gcs>=6)g=2;else if(gcs>=4)g=1;else g=0;
  if(sbp>89)s=4;else if(sbp>=76)s=3;else if(sbp>=50)s=2;else if(sbp>=1)s=1;else s=0;
  if(rr>=10&&rr<=29)r=4;else if(rr>29)r=3;else if(rr>=6&&rr<=9)r=2;else if(rr>=1&&rr<=5)r=1;else r=0;
  return (0.9368*g+0.7326*s+0.2908*r).toFixed(2);
}
function shockClass(){
  const hr=parseInt(vitals.hr),sbp=parseInt(vitals.sbp),rr=parseInt(vitals.rr);
  if(isNaN(hr)||isNaN(sbp))return null;
  const altMS=vitals.mentalStatus==='pain'||vitals.mentalStatus==='unresponsive';
  if((hr>140&&sbp<70)||(hr>140&&altMS)||(sbp<70&&altMS)||(hr>120&&sbp<90&&altMS))return 4;
  if(hr>120&&sbp<90)return 3;
  if(!isNaN(rr)&&rr>=30&&sbp<90)return 3;
  if(hr>120&&sbp<100&&vitals.mentalStatus==='verbal')return 3;
  if(hr>100&&sbp>=90&&sbp<=120)return 2;
  if(!isNaN(rr)&&rr>=20&&rr<30&&hr>100)return 2;
  return 1;
}
function shockInfo(cls){
  const d={
    1:{label:'Classe I',detail:'Perda < 750 mL (< 15%). Cristaloide.',css:'shock-i',bloodLoss:'<750',pct:15},
    2:{label:'Classe II',detail:'Perda 750\u20131500 mL (15\u201330%). Cristaloide + considerar hemoderivados.',css:'shock-ii',bloodLoss:'750\u20131500',pct:30},
    3:{label:'Classe III',detail:'Perda 1500\u20132000 mL (30\u201340%). Hemoderivados + TXA se < 3 h.',css:'shock-iii',bloodLoss:'1500\u20132000',pct:40},
    4:{label:'Classe IV',detail:'Perda > 2000 mL (> 40%). Protocolo de transfusão maciça.',css:'shock-iv',bloodLoss:'>2000',pct:50}
  };
  return d[cls]||{label:'?',detail:'Preencha FC e PAS para classificar.',css:'shock-pending',bloodLoss:'?',pct:0};
}
function hasLethalTriad(){
  const hypo=exposure.tempStatus==='hypothermic'||(vitals.temp&&parseFloat(vitals.temp)<35);
  const sc=shockClass();
  const shock=sc!==null&&sc>=3;
  const coag=circulation.interventions.has('massive_transfusion')||circulation.interventions.has('blood_products');
  return hypo&&(shock||coag);
}
function hasBeckTriad(){
  const jvd=breathing.findings.has('distended_neck_veins')||secondary.neck.has('jvd');
  const hypo=!isNaN(parseInt(vitals.sbp))&&parseInt(vitals.sbp)<90;
  const pericardial=fast.pericardial==='positive';
  const muffled=secondary.chest.has('muffled_heart_sounds');
  return jvd&&(hypo||pericardial)&&(muffled||pericardial);
}
function hasCushingTriad(){
  const hr=parseInt(vitals.hr),sbp=parseInt(vitals.sbp);
  if(isNaN(hr)||isNaN(sbp))return false;
  return sbp>=160&&hr<60&&(breathing.findings.has('tachypnea')||breathing.status==='abnormal');
}
function isTraumaTeamActivation(){
  const c=[];
  const gcs=gcsTotal();
  if(gcs!==null&&gcs<=8)c.push('GCS \u2264 8');
  if(vitals.sbp&&parseInt(vitals.sbp)<90)c.push('PAS < 90 mmHg');
  if(vitals.rr&&(parseInt(vitals.rr)<10||parseInt(vitals.rr)>29))c.push('FR < 10 ou > 29');
  if(mechanism.type==='penetrating')c.push('Trauma penetrante');
  if(mechanism.details.has('mvc_ejection'))c.push('Ejeção do veículo');
  if(mechanism.details.has('mvc_death_occupant'))c.push('Morte de ocupante');
  if(mechanism.details.has('fall_gt6m'))c.push('Queda > 6 m');
  if(mechanism.details.has('pedestrian'))c.push('Atropelamento');
  if(airway.patent==='obstructed')c.push('Via aérea obstruída');
  if(breathing.status==='absent')c.push('Ventilação ausente');
  if(circulation.pulse==='absent')c.push('Pulso ausente');
  if(fast.pericardial==='positive')c.push('FAST pericárdico +');
  if(fast.ruq==='positive'||fast.luq==='positive'||fast.suprapubic==='positive')c.push('FAST abdominal +');
  if(disability.pupils==='fixed_bilateral')c.push('Pupilas fixas bilaterais');
  if(secondary.pelvis.has('instability'))c.push('Instabilidade pélvica');
  if(circulation.interventions.has('massive_transfusion'))c.push('PTM ativado');
  if(exposure.findings.has('amputation'))c.push('Amputação traumática');
  if(exposure.findings.has('open_fracture'))c.push('Fratura exposta');
  const sc=shockClass();
  if(sc&&sc>=3)c.push('Choque Classe '+sc);
  const si=shockIndex();
  if(si!==null&&parseFloat(si)>=1.0)c.push('IC \u2265 1,0 ('+si+')');
  return c;
}
function hasCriticalFindings(){
  if(airway.patent==='obstructed')return true;
  if(breathing.status==='absent')return true;
  if(circulation.pulse==='absent')return true;
  const gcs=gcsTotal();
  if(gcs!==null&&gcs<=8)return true;
  if(disability.pupils==='fixed_unilateral'||disability.pupils==='fixed_bilateral')return true;
  return false;
}

// =======================================
// IMAGING + CONDUTA
// =======================================
function suggestedImaging(){
  const imgs=[];
  imgs.push({icon:'\u{1F4F7}',text:'RX Tórax AP',reason:'Rotina de trauma',cat:'img'});
  imgs.push({icon:'\u{1F4F7}',text:'RX Pelve AP',reason:'Rotina de trauma',cat:'img'});
  if(airway.cspine!=='cleared')imgs.push({icon:'\u{1FA7B}',text:'TC Coluna Cervical',reason:'C-spine não liberada',cat:'img'});
  const gcs=gcsTotal();
  if(gcs!==null&&gcs<=14)imgs.push({icon:'\u{1FA7B}',text:'TC Crânio sem contraste',reason:'GCS \u2264 14',cat:'img'});
  const bskull=['raccoon_eyes','battle_sign','csf_otorrhea','csf_rhinorrhea'];
  if(bskull.some(s=>disability.findings.has(s))&&!imgs.some(i=>i.text.includes('Crânio'))){
    imgs.push({icon:'\u{1FA7B}',text:'TC Crânio sem contraste',reason:'Sinais de fratura de base de crânio',cat:'img'});
  }
  if((disability.pupils==='fixed_unilateral'||disability.pupils==='unequal')&&!imgs.some(i=>i.text.includes('Crânio'))){
    imgs.push({icon:'\u{1FA7B}',text:'TC Crânio sem contraste (urgente)',reason:'Anisocoria — risco de herniação',cat:'img'});
  }
  if(mechanism.energy==='high'||breathing.findings.has('subcutaneous_emphysema')||breathing.findings.has('flail_chest')){
    imgs.push({icon:'\u{1FA7B}',text:'TC Tórax com contraste',reason:'Alta energia / achados torácicos',cat:'img'});
  }
  if(fast.ruq==='positive'||fast.luq==='positive'||fast.suprapubic==='positive'){
    imgs.push({icon:'\u{1FA7B}',text:'TC Abdome/Pelve com contraste',reason:'FAST positivo',cat:'img'});
  }
  if(mechanism.energy==='high'&&!imgs.some(i=>i.text.includes('Abdome'))){
    imgs.push({icon:'\u{1FA7B}',text:'TC Abdome/Pelve com contraste',reason:'Alta energia',cat:'img'});
  }
  if(secondary.abdomen.has('seatbelt_sign')&&!imgs.some(i=>i.text.includes('Abdome'))){
    imgs.push({icon:'\u{1FA7B}',text:'TC Abdome/Pelve com contraste',reason:'Sinal do cinto de segurança',cat:'img'});
  }
  if(secondary.abdomen.has('evisceration')&&!imgs.some(i=>i.text.includes('Abdome'))){
    imgs.push({icon:'\u{1FA7B}',text:'TC Abdome/Pelve com contraste',reason:'Evisceração',cat:'img'});
  }
  if(secondary.pelvis.has('instability')){
    imgs.push({icon:'\u{1FA7B}',text:'TC Pelve com reconstrução 3D',reason:'Instabilidade pélvica',cat:'img'});
    imgs.push({icon:'\u{1FA78}',text:'Angio-TC / Angiografia pélvica',reason:'Sangramento pélvico ativo',cat:'img'});
  }
  if(secondary.spine.has('thoracic_tender')||secondary.spine.has('lumbar_tender')||secondary.spine.has('step_off')){
    imgs.push({icon:'\u{1FA7B}',text:'TC Coluna Toracolombar',reason:'Dor/deformidade em coluna',cat:'img'});
  }
  if(secondary.extremities.has('upper_deformity'))imgs.push({icon:'\u{1F4F7}',text:'RX MMSS (áreas de deformidade)',reason:'Deformidade em MMSS',cat:'img'});
  if(secondary.extremities.has('lower_deformity'))imgs.push({icon:'\u{1F4F7}',text:'RX MMII (áreas de deformidade)',reason:'Deformidade em MMII',cat:'img'});
  if(secondary.neck.has('penetrating_wound'))imgs.push({icon:'\u{1FA78}',text:'Angio-TC cervical',reason:'Ferida penetrante cervical',cat:'img'});
  if(secondary.chest.has('widened_mediastinum'))imgs.push({icon:'\u{1FA78}',text:'Angio-TC de Aorta torácica',reason:'Alargamento de mediastino',cat:'img'});
  if(secondary.chest.has('sternal_fracture'))imgs.push({icon:'\u{1F9EA}',text:'ECG 12 derivações + Troponina',reason:'Fratura esternal — descartar contusão miocárdica',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'Hemograma, Tipagem sanguínea + Prova cruzada',reason:'Rotina de trauma',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'Gasometria arterial + Lactato',reason:'Avaliação perfusional',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'Coagulograma (TP, TTPa, Fibrinogênio)',reason:'Coagulopatia traumática',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'Ureia, Creatinina, Eletrólitos',reason:'Função renal',cat:'lab'});
  imgs.push({icon:'\u{1F9EA}',text:'Beta-HCG (mulher em idade fértil)',reason:'Descartar gravidez',cat:'lab'});
  if(vitals.glic){
    const g=parseFloat(vitals.glic);
    if(g<70||g>200)imgs.push({icon:'\u{1F9EA}',text:'Glicemia de controle',reason:g<70?'Hipoglicemia':'Hiperglicemia',cat:'lab'});
  }
  const sc=shockClass();
  if(sc&&sc>=2)imgs.push({icon:'\u{1F9EA}',text:'Tromboelastografia (TEG/ROTEM) se disponível',reason:'Choque hemorrágico',cat:'lab'});
  if(secondary.extremities.has('crush_injury'))imgs.push({icon:'\u{1F9EA}',text:'CPK, Mioglobina sérica, EAS',reason:'Esmagamento — rabdomiólise',cat:'lab'});
  if(secondary.pelvis.has('blood_meatus')){
    imgs.push({icon:'\u{1F9EA}',text:'Uretrocistografia retrógrada',reason:'Sangue em meato — antes de cateter',cat:'img'});
  }else if((sc&&sc>=2)||secondary.abdomen.size>0){
    imgs.push({icon:'\u{1F9EA}',text:'Sondagem vesical + débito urinário',reason:'Monitorar perfusão renal',cat:'lab'});
  }
  return imgs;
}
function suggestConduta(){
  const items=[];
  const gcs=gcsTotal();
  const sc=shockClass();
  if(airway.patent==='obstructed'||airway.patent==='compromised'){
    items.push({icon:'\u{1F6A8}',text:'<strong>Via aérea definitiva:</strong> IOT com ISR. Preparar via cirúrgica como backup.',urgent:true});
  }
  if(gcs!==null&&gcs<=8&&!airway.interventions.has('orotracheal')&&!airway.interventions.has('surgical_airway')){
    items.push({icon:'\u{1F6A8}',text:'<strong>GCS \u2264 8:</strong> Indicação formal de IOT para proteção de via aérea.',urgent:true});
  }
  if(breathing.findings.has('deviated_trachea')&&(breathing.findings.has('decreased_breath_left')||breathing.findings.has('decreased_breath_right'))){
    items.push({icon:'\u{1F6A8}',text:'<strong>Pneumotórax hipertensivo:</strong> Descompressão com agulha (2\u00BA EIC, LMC) + drenagem em selo d\'água (5\u00BA EIC, LAM).',urgent:true});
  }
  if(breathing.findings.has('open_wound')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Pneumotórax aberto:</strong> Curativo de 3 pontas + drenagem torácica.',warn:true});
  }
  if(breathing.findings.has('flail_chest')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Tórax instável:</strong> Analgesia agressiva. IOT se insuficiência respiratória.',warn:true});
  }
  if(sc&&sc>=3){
    items.push({icon:'\u{1F6A8}',text:'<strong>Choque hemorrágico Classe '+sc+':</strong> Protocolo de transfusão maciça (1:1:1). TXA 1 g IV se < 3 h do trauma.',urgent:true});
  }else if(sc===2){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Choque Classe II:</strong> Cristaloide aquecido (RL). Reavaliar resposta. Preparar hemoderivados.',warn:true});
  }
  if(fast.pericardial==='positive'){
    items.push({icon:'\u{1F6A8}',text:'<strong>Tamponamento cardíaco:</strong> Pericardiocentese ou toracotomia de reanimação. Chamar cirurgia.',urgent:true});
  }else if(hasBeckTriad()){
    items.push({icon:'\u{1F6A8}',text:'<strong>Tríade de Beck (TJP + Hipotensão + Bulhas abafadas):</strong> Suspeita de tamponamento. FAST subxifoideo.',urgent:true});
  }
  if((fast.ruq==='positive'||fast.luq==='positive'||fast.suprapubic==='positive')&&sc&&sc>=3){
    items.push({icon:'\u{1F6A8}',text:'<strong>FAST + e instável:</strong> Laparotomia exploradora. NÃO aguardar TC.',urgent:true});
  }else if(fast.ruq==='positive'||fast.luq==='positive'||fast.suprapubic==='positive'){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>FAST + e estável:</strong> TC abdome/pelve com contraste. Cirurgia de sobreaviso.',warn:true});
  }
  if(secondary.pelvis.has('instability')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Fratura pélvica instável:</strong> Cinta pélvica imediata. Não repetir compressão. Angioembolização se sangramento refratário.',urgent:true});
  }
  if(circulation.bleeding.has('external_uncontrolled')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Hemorragia externa não controlada:</strong> Pressão direta + torniquete em extremidades.',urgent:true});
  }
  if(disability.pupils==='fixed_unilateral'){
    items.push({icon:'\u{1F6A8}',text:'<strong>Herniação cerebral:</strong> Manitol 1 g/kg IV ou NaCl 23,4% 30 mL. Cabeceira 30\u00B0. TC crânio urgente.',urgent:true});
  }
  if(disability.pupils==='fixed_bilateral'){
    items.push({icon:'\u{1F6A8}',text:'<strong>Pupilas fixas bilaterais:</strong> Avaliar causa (herniação, hipotermia, intoxicação). TC urgente.',urgent:true});
  }
  if(disability.findings.has('seizure')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Convulsão pós-traumática:</strong> Fenitoína 20 mg/kg IV ou Levetiracetam 20 mg/kg IV.',warn:true});
  }
  if(hasCushingTriad()){
    items.push({icon:'\u{1F6A8}',text:'<strong>Tríade de Cushing:</strong> HIC grave. Manitol ou NaCl hipertônico. Cabeceira 30\u00B0. TC crânio.',urgent:true});
  }
  if(hasLethalTriad()){
    items.push({icon:'\u{1F6A8}',text:'<strong>TRÍADE LETAL (Hipotermia + Acidose + Coagulopatia):</strong> Damage control. Aquecer. Corrigir coagulopatia.',urgent:true});
  }
  if(exposure.tempStatus==='hypothermic'){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Hipotermia:</strong> Aquecimento ativo (cobertores, fluidos a 39\u00B0C).',warn:true});
  }
  if(exposure.findings.has('impaled_object')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Objeto empalado:</strong> NÃO remover no PS. Estabilizar. Remoção em centro cirúrgico.',warn:true});
  }
  if(exposure.findings.has('open_fracture')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Fratura exposta:</strong> ATB (Cefazolina 2 g IV). Irrigação. Imobilização.',warn:true});
  }
  if(exposure.findings.has('burns')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Queimaduras:</strong> SCQ (regra dos 9). Parkland: 4 mL \u00D7 kg \u00D7 %SCQ em 24 h.',warn:true});
  }
  if(secondary.extremities.has('compartment_syndrome')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Síndrome compartimental:</strong> Fasciotomia de emergência.',urgent:true});
  }
  if(secondary.extremities.has('crush_injury')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Esmagamento:</strong> Hidratação agressiva. Monitorar CPK, K\u207A, mioglobinúria.',warn:true});
  }
  if(secondary.abdomen.has('evisceration')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Evisceração:</strong> NÃO reintroduzir. Cobrir com compressas umedecidas em SF morno. Laparotomia.',urgent:true});
  }
  if(secondary.skin.has('tetanus_needed')){
    items.push({icon:'\u{1F489}',text:'<strong>Profilaxia tétano:</strong> Cartão vacinal. dT + IGHAT se indicado.',warn:false});
  }
  if(mechanism.type==='penetrating'&&secondary.neck.has('penetrating_wound')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Ferida penetrante cervical:</strong> Avaliar zona. Angio-TC. Exploração cirúrgica se sinais duros.',urgent:true});
  }
  if(secondary.chest.has('widened_mediastinum')){
    items.push({icon:'\u{1F6A8}',text:'<strong>Alargamento de mediastino:</strong> Suspeita de lesão aórtica. Angio-TC. PAS 80\u2013100, FC < 80.',urgent:true});
  }
  if(secondary.chest.has('sternal_fracture')){
    items.push({icon:'\u26A0\uFE0F',text:'<strong>Fratura esternal:</strong> Monitor cardíaco. ECG + Troponina seriada.',warn:true});
  }
  if(!circulation.interventions.has('iv_access_2')&&!circulation.interventions.has('iv_access_central')){
    items.push({icon:'\u{1F4A7}',text:'<strong>Acesso venoso:</strong> 2 acessos IV calibrosos (14\u201316G) em MMSS. IO se falha.',warn:false});
  }
  if(ample.medications){
    const meds=ample.medications.toLowerCase();
    if(meds.includes('varfarina')||meds.includes('warfarina')||meds.includes('marevan'))items.push({icon:'\u26A0\uFE0F',text:'<strong>Reversão varfarina:</strong> Vit. K 10 mg IV + CCP 25\u201350 UI/kg. INR alvo < 1,5.',warn:true});
    if(meds.includes('rivaroxaban')||meds.includes('xarelto')||meds.includes('apixaban')||meds.includes('eliquis')||meds.includes('doac'))items.push({icon:'\u26A0\uFE0F',text:'<strong>Reversão DOAC:</strong> Andexanet alfa se disponível. Caso contrário CCP 50 UI/kg.',warn:true});
    if(meds.includes('dabigatran')||meds.includes('pradaxa'))items.push({icon:'\u26A0\uFE0F',text:'<strong>Reversão dabigatrana:</strong> Idarucizumab (Praxbind) 5 g IV.',warn:true});
    if(meds.includes('heparina')||meds.includes('enoxaparina')||meds.includes('clexane'))items.push({icon:'\u26A0\uFE0F',text:'<strong>Reversão heparina:</strong> Protamina 1 mg / 100 UI HNF.',warn:true});
    if(meds.includes('aas')||meds.includes('aspirina')||meds.includes('clopidogrel')||meds.includes('plavix'))items.push({icon:'\u26A0\uFE0F',text:'<strong>Antiplaquetários:</strong> Transfusão de plaquetas se sangramento. DDAVP 0,3 \u00B5g/kg IV.',warn:true});
  }
  const map=calcMAP();
  if(map!==null&&map<65)items.push({icon:'\u{1F6A8}',text:'<strong>PAM < 65 mmHg ('+map+' mmHg):</strong> Reposição agressiva. Vasopressores se refratário.',urgent:true});
  if(sc&&sc>=2&&!circulation.interventions.has('tranexamic'))items.push({icon:'\u26A0\uFE0F',text:'<strong>Ácido tranexâmico:</strong> 1 g IV em 10 min se < 3 h do trauma, seguido de 1 g em 8 h.',warn:true});
  if(items.length===0)items.push({icon:'\u2705',text:'<strong>Trauma de baixa complexidade:</strong> Observação, reavaliação seriada. Reavaliar em 30\u201360 min.',warn:false});
  return items;
}

// =======================================
// UI HELPERS
// =======================================
function progHTML(idx,allDone){
  let h='<div class="progress-bar">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done':i===idx?'active':'';h+='<div class="progress-step '+c+'"></div>'}
  h+='</div><div class="progress-meta">';
  if(allDone){
    h+='<span class="step-name">Resultado</span>';
    h+='<span>'+TOTAL_STEPS+'/'+TOTAL_STEPS+' etapas</span>';
  }else{
    h+='<span class="step-name">'+STEP_LABELS[idx]+'</span>';
    h+='<span>'+(idx+1)+'/'+TOTAL_STEPS+'</span>';
  }
  h+='</div>';
  return h;
}
function collapsible(id,title,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+='<div class="collapse-header" onclick="toggleSection(\''+id+'\')">';
  h+='<h3>'+title+'</h3><span class="collapse-arrow '+(open?'open':'')+'">\u25BC</span></div>';
  h+='<div class="collapse-body '+(open?'':'hidden')+'" style="margin-top:'+(open?'.6rem':'0')+'">';
  if(open)h+=contentFn();
  h+='</div></div>';
  return h;
}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms||12)}catch(e){}}
function optBtn(action,value,icon,label,tagClass,tagText,isSelected){
  return '<button type="button" class="option-btn '+(isSelected?'selected':'')+'" onclick="handleOption(\''+action+'\',\''+value+'\')"><span class="icon">'+icon+'</span><span class="label">'+label+'</span><span class="tag '+tagClass+'">'+tagText+'</span></button>';
}
function navRow(showBack,canNext,nextLabel){
  let h='<div class="nav-row">';
  if(showBack)h+='<button type="button" class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h+='<button type="button" class="nav-btn primary" '+(canNext?'':'disabled')+' onclick="next()">'+(nextLabel||'Próximo \u2192')+'</button>';
  h+='</div>';
  return h;
}
function inputField(label,field,value,placeholder,unit,range){
  let cls='vital-input';
  const v=parseFloat(value);
  if(!isNaN(v)){
    if(field==='hr'&&(v>120||v<50))cls+=' danger';
    else if(field==='hr'&&v>100)cls+=' warn';
    else if(field==='sbp'&&v<90)cls+=' danger';
    else if(field==='sbp'&&v<100)cls+=' warn';
    else if(field==='dbp'&&v<50)cls+=' danger';
    else if(field==='dbp'&&v<60)cls+=' warn';
    else if(field==='rr'&&(v<10||v>30))cls+=' danger';
    else if(field==='rr'&&(v<12||v>20))cls+=' warn';
    else if(field==='spo2'&&v<90)cls+=' danger';
    else if(field==='spo2'&&v<94)cls+=' warn';
    else if(field==='temp'&&v<35)cls+=' danger';
    else if(field==='temp'&&(v<36||v>38))cls+=' warn';
    else if(field==='glic'&&(v<60||v>250))cls+=' danger';
    else if(field==='glic'&&(v<70||v>200))cls+=' warn';
  }
  let h='<div class="input-group"><span class="input-label">'+label+'</span><input type="number" inputmode="decimal" step="any" class="'+cls+'" data-field="vital_'+field+'" value="'+value+'" placeholder="'+placeholder+'" oninput="setVitalInput(\''+field+'\',this.value);debouncedRender()"><span class="input-unit">'+unit+'</span>';
  if(range)h+='<span class="input-hint">Normal: '+range+'</span>';
  h+='</div>';
  return h;
}
function escHTML(str){
  return String(str===null||str===undefined?'':str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
}
function banner(type,icon,text){
  return '<div class="banner '+type+'"><span class="bi">'+icon+'</span><span class="bt">'+text+'</span></div>';
}

// =======================================
// RENDER ROUTER
// =======================================
function render(){
  const activeEl=document.activeElement;
  const wasFocusedInput=activeEl&&(activeEl.tagName==='INPUT');
  let focusField=null,focusPos=null;
  if(wasFocusedInput&&activeEl.getAttribute('data-field')){
    focusField=activeEl.getAttribute('data-field');
    focusPos=activeEl.selectionStart;
  }
  const prevScroll=window.scrollY;

  switch(currentStep){
    case 0:renderMechanism();break;
    case 1:renderAirway();break;
    case 2:renderBreathing();break;
    case 3:renderCirculation();break;
    case 4:renderDisability();break;
    case 5:renderExposure();break;
    case 6:renderFAST();break;
    case 7:renderSecondary();break;
    case 8:renderAMPLE();break;
    case 9:renderVitals();break;
    default:renderResult();break;
  }

  if(currentStep>=TOTAL_STEPS&&!evalEndTime){
    evalEndTime=new Date();
    const el=document.getElementById('evalTimer');
    if(el)el.classList.add('stopped');
  }

  if(focusField){
    const el=document.querySelector('[data-field="'+focusField+'"]');
    if(el){
      el.focus();
      if(focusPos!==null&&el.setSelectionRange){
        try{el.setSelectionRange(focusPos,focusPos)}catch(e){}
      }
    }
  }

  // Only scroll-to-top on actual step change, not on toggling within page
  if(!wasFocusedInput&&window._needsScrollTop){
    window.scrollTo({top:0,behavior:'smooth'});
    window._needsScrollTop=false;
  }
}

    h+=banner('alert','\u{1F6A8}','Tríade clássica de PNEUMOTÓRAX HIPERTENSIVO — Descompressão com agulha (2\u00BA EIC, LMC) + drenagem torácica (5\u00BA EIC, LAM)!');
  }else if(breathing.findings.has('deviated_trachea')&&(breathing.findings.has('decreased_breath_left')||breathing.findings.has('decreased_breath_right'))){
    h+=banner('alert','\u{1F6A8}','Desvio de traqueia + MV diminuído — Alta suspeita de PNEUMOTÓRAX HIPERTENSIVO.');
  }
  if((breathing.findings.has('decreased_breath_left')||breathing.findings.has('decreased_breath_right'))&&breathing.findings.has('dullness')&&!breathing.findings.has('deviated_trachea')){
    h+=banner('warn','\u26A0\uFE0F','MV diminuído + macicez — Suspeita de HEMOTÓRAX. Drenagem 5\u00BA EIC/LAM. Se débito > 1500 mL ou > 200 mL/h, toracotomia.');
  }else if((breathing.findings.has('decreased_breath_left')||breathing.findings.has('decreased_breath_right'))&&!breathing.findings.has('deviated_trachea')&&breathing.findings.has('hypoxia')){
    h+=banner('warn','\u26A0\uFE0F','MV diminuído + hipóxia — Considerar HEMOTÓRAX. Drenagem 5\u00BA EIC/LAM.');
  }
  if(breathing.findings.has('flail_chest')){
    h+=banner('warn','\u26A0\uFE0F','TÓRAX INSTÁVEL — Risco de contusão pulmonar. Analgesia multimodal. Monitorizar.');
  }

  h+='<div class="option-group-label">Intervenções</div>';
  const bInterv=[
    {id:'o2_mask',label:'O\u2082 máscara não reinalante (10\u201315 L/min)'},
    {id:'o2_nasal',label:'O\u2082 cânula nasal'},
    {id:'bvm',label:'Ventilação com ambu (BVM)'},
    {id:'chest_tube_left',label:'Drenagem torácica à E'},
    {id:'chest_tube_right',label:'Drenagem torácica à D'},
    {id:'needle_decompression_left',label:'Descompressão com agulha à E'},
    {id:'needle_decompression_right',label:'Descompressão com agulha à D'},
    {id:'occlusive_dressing',label:'Curativo de 3 pontas / valvulado'}
  ];
  for(const i of bInterv){
    const ck=breathing.interventions.has(i.id);
    h+='<button type="button" class="check-btn '+(ck?'checked':'')+'" onclick="toggleSetField(\'breathing\',\'interventions\',\''+i.id+'\')"><span class="check-box">'+(ck?'\u2713':'')+'</span><span class="label">'+i.label+'</span><span class="intervention-tag">Feito</span></button>';
  }
  h+='</div>';

  if(breathing.status||breathing.findings.size>0||breathing.interventions.size>0){
    h+='<div class="step-summary">';
    if(breathing.status==='normal')h+='<span class="chip ok-chip">Ventilação normal</span>';
    if(breathing.status==='abnormal')h+='<span class="chip alert-chip">Ventilação anormal</span>';
    if(breathing.status==='absent')h+='<span class="chip alert-chip">Apneia</span>';
    if(breathing.findings.size>0)h+='<span class="chip">'+breathing.findings.size+' achado(s)</span>';
    if(breathing.interventions.size>0)h+='<span class="chip info-chip">'+breathing.interventions.size+' intervenção(ões)</span>';
    h+='</div>';
  }

  h+=navRow(true,true);
  h+='</div>';
  app.innerHTML=h;
}

// =======================================
// STEP 6: FAST
// =======================================
function renderFAST(){
  let h=progHTML(6,false);
  h+='<div class="card">';
  h+='<h2><span class="step-badge">7/'+TOTAL_STEPS+'</span> FAST</h2>';
  h+='<p class="subtitle">Toque para alternar: Não avaliado \u2192 Negativo \u2192 Positivo \u2192 Indeterminado.</p>';

  h+='<div class="fast-grid">';
  const quadrants=[
    {id:'ruq',label:'Hepatorrenal (Morrison)',icon:'\u{1FAC0}'},
    {id:'luq',label:'Esplenorrenal (LUQ)',icon:'\u{1FAC0}'},
    {id:'suprapubic',label:'Suprapúbico (Douglas)',icon:'\u{1FAC0}'},
    {id:'pericardial',label:'Subxifoideo (Pericárdio)',icon:'\u2764\uFE0F'}
  ];
  for(const q of quadrants){
    const val=fast[q.id];
    let cls='fast-btn';
    let status='Toque para avaliar';
    if(val==='positive'){cls+=' positive';status='\u2716 POSITIVO';}
    else if(val==='negative'){cls+=' negative';status='\u2713 Negativo';}
    else if(val==='indeterminate'){cls+=' indeterminate';status='\u2014 Indeterminado';}
    h+='<div class="'+cls+'" onclick="cycleFAST(\''+q.id+'\')">';
    h+='<div class="fast-icon">'+q.icon+'</div>';
    h+='<div class="fast-label">'+q.label+'</div>';
    h+='<div class="fast-status">'+status+'</div>';
    h+='</div>';
  }
  h+='</div>';

  const anyPos=[fast.ruq,fast.luq,fast.suprapubic,fast.pericardial].some(v=>v==='positive');
  if(anyPos){
    let msg='FAST POSITIVO — ';
    if(fast.pericardial==='positive')msg+='Líquido pericárdico: tamponamento? Pericardiocentese ou toracotomia. ';
    if(fast.ruq==='positive'||fast.luq==='positive'||fast.suprapubic==='positive')msg+='Líquido livre abdominal: se instável \u2192 laparotomia; se estável \u2192 TC.';
    h+=banner('alert','\u{1F6A8}',msg);
  }
  const anyInd=[fast.ruq,fast.luq,fast.suprapubic,fast.pericardial].some(v=>v==='indeterminate');
  if(anyInd&&!anyPos){
    h+=banner('warn','\u26A0\uFE0F','FAST indeterminado — Repetir em 15\u201330 min ou TC se alta suspeita clínica.');
  }
  const allNeg=[fast.ruq,fast.luq,fast.suprapubic,fast.pericardial].every(v=>v==='negative');
  if(allNeg){
    h+=banner('info','\u2139\uFE0F','FAST negativo NÃO exclui lesão intra-abdominal (sensibilidade ~85%). Repetir ou TC se suspeita.');
  }

  const evaluated=[fast.ruq,fast.luq,fast.suprapubic,fast.pericardial].filter(v=>v!==null).length;
  if(evaluated>0){
    h+='<div class="step-summary">';
    h+='<span class="chip">'+evaluated+'/4 avaliados</span>';
    if(anyPos)h+='<span class="chip alert-chip">FAST positivo</span>';
    else if(evaluated===4&&!anyInd)h+='<span class="chip ok-chip">FAST negativo</span>';
    else if(evaluated===4)h+='<span class="chip info-chip">FAST indeterminado</span>';
    h+='</div>';
  }

  h+=navRow(true,true);
  h+='</div>';
  app.innerHTML=h;
}

function renderVitals(){
  let h=progHTML(9,false);
  h+='<div class="card">';
  h+='<h2><span class="step-badge">10/'+TOTAL_STEPS+'</span> Sinais Vitais</h2>';
  h+='<p class="subtitle">Parâmetros hemodinâmicos e classificação do choque.</p>';

  h+='<div class="input-row">';
  h+=inputField('FC','hr',vitals.hr,'80','bpm','60\u2013100');
  h+=inputField('PAS','sbp',vitals.sbp,'120','mmHg','90\u2013140');
  h+=inputField('PAD','dbp',vitals.dbp,'80','mmHg','60\u201390');
  h+='</div>';
  h+='<div class="input-row">';
  h+=inputField('FR','rr',vitals.rr,'16','irpm','12\u201320');
  h+=inputField('SpO\u2082','spo2',vitals.spo2,'98','%','\u2265 95');
  h+=inputField('Temp','temp',vitals.temp,'36,5','\u00B0C','36\u201337,5');
  h+='</div>';
  h+='<div class="input-row">';
  h+=inputField('Glicemia','glic',vitals.glic,'100','mg/dL','70\u2013140');
  h+='<div class="input-group" style="flex:2"></div>';
  h+='</div>';

  h+='<div class="option-group-label">Status mental (AVPU)</div>';
  h+='<div style="display:flex;gap:.3rem;margin-top:.4rem">';
  const avpu=[{v:'alert',l:'A — Alerta'},{v:'verbal',l:'V — Verbal'},{v:'pain',l:'P — Dor'},{v:'unresponsive',l:'U — Irresp.'}];
  for(const a of avpu)h+='<button type="button" class="score-opt '+(vitals.mentalStatus===a.v?'picked':'')+'" onclick="setVital(\'mentalStatus\',\''+a.v+'\')" style="flex:1">'+a.l+'</button>';
  h+='</div>';

  const hr=parseInt(vitals.hr),sbp=parseInt(vitals.sbp),rr=parseInt(vitals.rr),spo2=parseInt(vitals.spo2),temp=parseFloat(vitals.temp),glic=parseFloat(vitals.glic);
  const warnings=[];
  if(!isNaN(hr)&&(hr>120||hr<50))warnings.push(hr>120?'Taquicardia (FC > 120)':'Bradicardia (FC < 50)');
  if(!isNaN(sbp)&&sbp<90)warnings.push('Hipotensão (PAS < 90)');
  if(!isNaN(rr)&&(rr<10||rr>30))warnings.push(rr<10?'Bradipneia (FR < 10)':'Taquipneia (FR > 30)');
  if(!isNaN(spo2)&&spo2<90)warnings.push('Hipoxemia (SpO\u2082 < 90%)');
  if(!isNaN(temp)&&temp<35)warnings.push('Hipotermia (< 35\u00B0C)');
  if(!isNaN(glic)&&glic<60)warnings.push('Hipoglicemia (< 60)');
  if(warnings.length>0){
    h+=banner('alert','\u{1F6A8}',warnings.join(' &middot; '));
  }

  if(hasCushingTriad()){
    h+=banner('purple','\u{1F9E0}','TRÍADE DE CUSHING (HAS + Bradicardia + Padrão respiratório anormal) — HIC grave. TC crânio urgente.');
  }

  const map=calcMAP();
  if(map!==null){
    const mapClass=map<65?'map-danger':map<70?'map-warn':'map-normal';
    const mapLabel=map<65?'PAM baixa — Hipoperfusão':map<70?'PAM limítrofe':'PAM adequada';
    h+='<div class="map-display '+mapClass+'"><strong style="margin-right:.35rem">PAM: '+map+' mmHg</strong> \u2014 '+mapLabel+'</div>';
  }

  const si=shockIndex();
  if(si!==null){
    const siVal=parseFloat(si);
    const siClass=siVal>=1.0?'si-critical':siVal>=0.7?'si-elevated':'si-normal';
    const siLabel=siVal>=1.0?'Elevado — Alta probabilidade de choque. Hemoderivados precoces.':siVal>=0.7?'Limítrofe — Monitorar de perto.':'Normal — Baixo risco.';
    h+='<div class="si-display '+siClass+'">';
    h+='<div class="si-value">'+si+'</div>';
    h+='<div class="si-info"><strong>Índice de Choque (FC/PAS):</strong> '+siLabel+'</div>';
    h+='</div>';
  }

  const sc=shockClass();
  const sinfo=sc?shockInfo(sc):shockInfo(null);
  h+='<div class="shock-display '+sinfo.css+'" style="margin-top:.65rem">';
  h+='<div class="shock-class">'+(sc||'?')+'</div>';
  h+='<div class="shock-info"><div class="shock-label">Choque Hemorrágico '+sinfo.label+'</div><div class="shock-detail">'+sinfo.detail+'</div></div>';
  h+='</div>';

  if(sc&&sc>=3){
    h+=banner('alert','\u{1F6A8}','Choque grave — Hemoderivados + PTM (1:1:1). TXA se < 3 h. Controlar fonte.');
  }

  const rts=calcRTS();
  if(rts!==null){
    const rtsVal=parseFloat(rts);
    const rtsClass=rtsVal<4?'rts-poor':rtsVal<6?'rts-moderate':'rts-good';
    const rtsLabel=rtsVal<4?'RTS baixo — Alta mortalidade. Centro de trauma nível I.':rtsVal<6?'RTS moderado — Lesões potencialmente graves.':'RTS favorável.';
    h+='<div class="rts-display '+rtsClass+'" style="margin-top:.5rem">';
    h+='<div class="rts-value">'+rts+'</div>';
    h+='<div class="rts-info"><strong>Revised Trauma Score:</strong> '+rtsLabel+'</div>';
    h+='</div>';
  }

  h+=navRow(true,true,'Ver Resultado \u2192');
  h+='</div>';
  app.innerHTML=h;
}

// =======================================
// RESULT PAGE
// =======================================
function renderResult(){
  const gcs=gcsTotal();
  const sc=shockClass();
  const si=shockIndex();
  const map=calcMAP();
  const rts=calcRTS();
  const gcsP=gcsPupilScore();
  const activation=isTraumaTeamActivation();
  const imgs=suggestedImaging();
  const condutas=suggestConduta();

  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  let severity,badgeCls,icon;
  if(activation.length>=3||(sc&&sc>=3)||(gcs!==null&&gcs<=8)){severity='Crítico';badgeCls='badge-red';icon='\u{1F6A8}';}
  else if(activation.length>=1||(sc&&sc>=2)||(gcs!==null&&gcs<=12)){severity='Grave';badgeCls='badge-yellow';icon='\u26A0\uFE0F';}
  else if(mechanism.energy==='high'){severity='Moderado';badgeCls='badge-blue';icon='\u{1F4CB}';}
  else{severity='Leve';badgeCls='badge-green';icon='\u2714\uFE0F';}

  h+='<div class="result-badge '+badgeCls+'">'+icon+'</div>';
  h+='<div class="result-title">Trauma '+severity+'</div>';

  const parts=[];
  if(mechanism.type)parts.push(mechanism.type==='blunt'?'Contuso':'Penetrante');
  if(mechanism.energy)parts.push(mechanism.energy==='high'?'Alta energia':'Baixa energia');
  if(gcs!==null)parts.push('GCS '+gcs);
  if(gcsP!==null)parts.push('GCS-P '+gcsP);
  if(sc)parts.push('Choque '+sc);
  if(si)parts.push('IC '+si);
  if(map!==null)parts.push('PAM '+map);
  if(rts!==null)parts.push('RTS '+rts);
  h+='<div class="result-desc">'+(parts.length?parts.join(' &middot; '):'Avaliação mínima')+'</div>';

  const endTime=evalEndTime||new Date();
  const elapsed=Math.floor((endTime.getTime()-evalStartTime.getTime())/1000);
  h+='<div class="result-elapsed">Tempo: '+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')+'</div>';

  if(hasLethalTriad()){
    h+='<div class="team-activation" style="background:#2d0000;border-color:#ff4444">';
    h+='<h3 style="color:#ff9999">\u2620\uFE0F Tríade Letal</h3>';
    h+='<p style="color:#ff9999">Hipotermia + Acidose + Coagulopatia — Damage control.</p>';
    h+='</div>';
  }

  if(activation.length>0){
    h+='<div class="team-activation">';
    h+='<h3>\u{1F6A8} Ativação do Time de Trauma</h3>';
    h+='<p>'+activation.join(' &middot; ')+'</p>';
    h+='</div>';
  }

  // Conduta (open by default)
  h+=collapsible('conduta','Conduta sugerida',function(){
    let s='<div class="conduta-list">';
    for(const c of condutas){
      const cls=c.urgent?'conduta-card urgent':c.warn?'conduta-card warning':'conduta-card';
      s+='<div class="'+cls+'"><span class="c-icon">'+c.icon+'</span><span class="c-text">'+c.text+'</span></div>';
    }
    s+='</div>';
    return s;
  });

  // Imaging (open by default)
  h+=collapsible('imaging','Exames sugeridos',function(){
    let s='';
    const img=imgs.filter(i=>i.cat==='img');
    const lab=imgs.filter(i=>i.cat==='lab');
    if(img.length>0){
      s+='<div style="font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:.45rem;font-weight:600">Imagem</div>';
      for(const i of img)s+='<div class="imaging-item"><span class="imaging-icon">'+i.icon+'</span><span><strong>'+i.text+'</strong><br><span style="font-size:.7rem;color:#64748b">'+i.reason+'</span></span></div>';
    }
    if(lab.length>0){
      s+='<div style="font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin:.8rem 0 .45rem;font-weight:600;border-top:1px solid #1e293b;padding-top:.65rem">Laboratório</div>';
      for(const l of lab)s+='<div class="imaging-item"><span class="imaging-icon">'+l.icon+'</span><span><strong>'+l.text+'</strong><br><span style="font-size:.7rem;color:#64748b">'+l.reason+'</span></span></div>';
    }
    return s;
  });

  // Collapsible summaries

function buildNote(){

  n+='Tempo de avaliação: '+eMin+' min\n';

  n+='MECANISMO\n';

  n+='    C-Spine: '+(airway.cspine==='immobilized'?'Imobilizada':airway.cspine==='cleared'?'Liberada':airway.cspine==='not_immobilized'?'Não imobilizada':'—')+'\n';

  n+='E - Exposição: '+(tL[exposure.tempStatus]||'—')+'\n';
  if(exposure.findings.size>0){
    const fL={burns:'Queimaduras',amputation:'Amputação',impaled_object:'Objeto empalado',abrasions:'Escoriações',lacerations:'Lacerações',contusions:'Equimoses',swelling:'Edema',log_roll_done:'Log roll feito',rectal_done:'Toque retal feito'};
    n+='    Achados: '+[...exposure.findings].map(f=>fL[f]||f).join(', ')+'\n';
  }

  n+='\nFAST\n----------------------------------------\n';
  const fastL={ruq:'Hepatorrenal',luq:'Esplenorrenal',suprapubic:'Suprapúbico',pericardial:'Pericárdio'};
  const stL={positive:'POSITIVO',negative:'Negativo',indeterminate:'Indeterminado'};
  for(const q of ['ruq','luq','suprapubic','pericardial'])n+=fastL[q]+': '+(stL[fast[q]]||'—')+'\n';

  if(ample.allergies||ample.medications||ample.pastHistory||ample.lastMeal||ample.events){
    n+='\nAMPLE\n----------------------------------------\n';
    if(ample.allergies)n+='A - Alergias: '+ample.allergies+'\n';
    if(ample.medications)n+='M - Medicamentos: '+ample.medications+'\n';
    if(ample.pastHistory)n+='P - Passado: '+ample.pastHistory+'\n';
    if(ample.lastMeal)n+='L - Última refeição: '+ample.lastMeal+'\n';
    if(ample.events)n+='E - Eventos: '+ample.events+'\n';
  }

  n+='\nSINAIS VITAIS\n----------------------------------------\n';
  if(vitals.hr)n+='FC: '+vitals.hr+' bpm\n';
  if(vitals.sbp)n+='PA: '+vitals.sbp+'/'+(vitals.dbp||'--')+' mmHg\n';
  if(map!==null)n+='PAM: '+map+' mmHg\n';
  if(vitals.rr)n+='FR: '+vitals.rr+' irpm\n';
  if(vitals.spo2)n+='SpO2: '+vitals.spo2+'%\n';
  if(vitals.temp)n+='Temp: '+vitals.temp+'°C\n';
  if(vitals.glic)n+='Glicemia: '+vitals.glic+' mg/dL\n';
  const avL={alert:'Alerta',verbal:'Verbal',pain:'Dor',unresponsive:'Irresponsivo'};
  if(vitals.mentalStatus)n+='AVPU: '+avL[vitals.mentalStatus]+'\n';
  if(si)n+='IC: '+si+'\n';
  if(rts)n+='RTS: '+rts+'\n';
  if(sc)n+='Choque Classe '+sc+' - '+shockInfo(sc).detail+'\n';

  const regionL={head:'Cabeça/Face',neck:'Pescoço',chest:'Tórax',abdomen:'Abdome',pelvis:'Pelve',extremities:'Extremidades',spine:'Coluna',skin:'Pele'};
  const iL={scalp_lac:'Lac. couro cab.',skull_deformity:'Deform. craniana',facial_fracture:'Fratura facial',eye_injury:'Lesão ocular',ear_injury:'Lesão otológica',dental_injury:'Lesão dentária',c_spine_tender:'Dor cervical',tracheal_deviation:'Desvio traqueia',jvd:'TJP',subcutaneous_emphysema:'Enfisema SC',carotid_bruit:'Sopro carotídeo',penetrating_wound:'Ferida penetrante',expanding_hematoma:'Hematoma expansivo',rib_fracture:'Fratura costela',sternal_fracture:'Fratura esternal',flail_segment:'Tórax instável',crepitus:'Crepitação',chest_wall_tender:'Dor parede',pneumothorax_signs:'Pneumotórax',hemothorax_signs:'Hemotórax',muffled_heart_sounds:'Bulhas abafadas',widened_mediastinum:'Alarg. mediastino',distension:'Distensão',rigidity:'Rigidez',guarding:'Blumberg +',tenderness_ruq:'Dor QSD',tenderness_luq:'Dor QSE',tenderness_rlq:'Dor QID',tenderness_llq:'Dor QIE',ecchymosis_flank:'Grey-Turner',cullen_sign:'Cullen',seatbelt_sign:'Sinal cinto',evisceration:'Evisceração',instability:'Instab. pélvica',perineal_ecchymosis:'Equimose perineal',blood_meatus:'Sangue meato',high_riding_prostate:'Próstata elevada',vaginal_bleeding:'Sangramento vag.',upper_deformity:'Deform. MMSS',upper_neurovascular:'Neurovasc. MMSS',lower_deformity:'Deform. MMII',lower_neurovascular:'Neurovasc. MMII',compartment_syndrome:'Sd. compart.',open_fracture:'Fratura exposta',crush_injury:'Esmagamento',joint_dislocation:'Luxação',cervical_tender:'Dor cervical',thoracic_tender:'Dor torácica',lumbar_tender:'Dor lombar',step_off:'Step-off',neuro_deficit:'Déficit neuro.',burns_partial:'Queim. 2°',burns_full:'Queim. 3°',degloving:'Degloving',large_laceration:'Lac. extensa',contaminated_wound:'Ferida contam.',tetanus_needed:'Tétano necessário'};
  let hasSec=false;
  for(const k of Object.keys(regionL))if(secondary[k].size>0){hasSec=true;break}
  if(hasSec){
    n+='\nSECONDARY SURVEY\n----------------------------------------\n';
    for(const k of Object.keys(regionL)){
      if(secondary[k].size>0)n+=regionL[k]+': '+[...secondary[k]].map(id=>iL[id]||id).join(', ')+'\n';
    }
  }

  const crit=isTraumaTeamActivation();
  if(crit.length>0){
    n+='\nATIVAÇÃO DO TIME DE TRAUMA\n----------------------------------------\n';
    for(const c of crit)n+='- '+c+'\n';
  }
  if(hasCushingTriad())n+='\n*** TRÍADE DE CUSHING — HIC grave ***\n';
  if(hasLethalTriad())n+='\n*** TRÍADE LETAL — Damage control ***\n';

  const condutas=suggestConduta();
  if(condutas.length>0){
    n+='\nCONDUTA\n----------------------------------------\n';
    for(const c of condutas)n+='- '+c.text.replace(/<[^>]*>/g,'')+'\n';
  }
  const imgs=suggestedImaging();
  n+='\nEXAMES SOLICITADOS\n----------------------------------------\n';
  const img=imgs.filter(i=>i.cat==='img'),lab=imgs.filter(i=>i.cat==='lab');
  if(img.length>0){n+='Imagem:\n';for(const i of img)n+='  - '+i.text+' ('+i.reason+')\n';}
  if(lab.length>0){n+='Laboratório:\n';for(const l of lab)n+='  - '+l.text+' ('+l.reason+')\n';}

  const esc=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="note-text" id="noteContent">'+esc+'</div><button type="button" class="copy-btn" id="copyBtn" onclick="copyNote()">Copiar nota</button>';
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el)return;
  const text=el.textContent;
  const done=()=>{
    const btn=document.getElementById('copyBtn');
    if(!btn)return;
    btn.textContent='\u2713 Copiado';
    btn.classList.add('copied');
    vibrate(30);
    setTimeout(()=>{btn.textContent='Copiar nota';btn.classList.remove('copied');},1800);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else fallback();
  function fallback(){
    const range=document.createRange();
    range.selectNodeContents(el);
    const sel=window.getSelection();
    sel.removeAllRanges();sel.addRange(range);
    try{document.execCommand('copy');done();}catch(e){}
    sel.removeAllRanges();
  }
}

// =======================================
// ACTIONS
// =======================================
function handleOption(action,value){
  vibrate(12);
  switch(action){
    case 'mechanism_type':mechanism.type=mechanism.type===value?null:value;break;
    case 'mechanism_energy':mechanism.energy=mechanism.energy===value?null:value;break;
    case 'airway_patent':airway.patent=airway.patent===value?null:value;break;
    case 'airway_cspine':airway.cspine=airway.cspine===value?null:value;break;
    case 'breathing_status':breathing.status=breathing.status===value?null:value;break;
    case 'circ_pulse':circulation.pulse=circulation.pulse===value?null:value;break;
    case 'circ_skin':circulation.skinStatus=circulation.skinStatus===value?null:value;break;
    case 'disability_pupils':
      if(disability.pupils===value){disability.pupils=null;disability.laterality=null;}
      else{disability.pupils=value;if(value==='equal_reactive'||value==='fixed_bilateral'||value==='miosis')disability.laterality=null;}
      break;
    case 'exposure_temp':exposure.tempStatus=exposure.tempStatus===value?null:value;break;
  }
  render();
}
function toggleMechDetail(id){vibrate(12);mechanism.details.has(id)?mechanism.details.delete(id):mechanism.details.add(id);render()}
function toggleSetField(obj,field,id){
  vibrate(12);
  const map={airway,breathing,circulation,exposure,disability};
  const t=map[obj];
  if(!t)return;
  t[field].has(id)?t[field].delete(id):t[field].add(id);
  render();
}
function setGCS(c,v){
  vibrate(12);
  if(c==='eye')disability.gcsEye=disability.gcsEye===v?null:v;
  else if(c==='verbal')disability.gcsVerbal=disability.gcsVerbal===v?null:v;
  else if(c==='motor')disability.gcsMotor=disability.gcsMotor===v?null:v;
  render();
}
function setLaterality(s){vibrate(12);disability.laterality=disability.laterality===s?null:s;render()}
function setPupilReactivity(v){vibrate(12);disability.pupilReactivity=disability.pupilReactivity===v?null:v;render()}
function cycleFAST(q){
  vibrate(12);
  const order=[null,'negative','positive','indeterminate'];
  const idx=order.indexOf(fast[q]);
  fast[q]=order[(idx+1)%order.length];
  render();
}
function toggleSecondary(r,i){
  vibrate(12);
  secondary[r].has(i)?secondary[r].delete(i):secondary[r].add(i);
  render();
}
window._activeSecondaryRegion='head';
function switchSecondaryRegion(k){window._activeSecondaryRegion=k;render()}

function setVitalInput(f,v){vitals[f]=v}
function setVital(f,v){vibrate(12);vitals[f]=v;render()}
function setAmple(f,v){ample[f]=v}
function setAmpleMeds(v){ample.medications=v;if(_ampleMedsTimer)clearTimeout(_ampleMedsTimer);_ampleMedsTimer=setTimeout(()=>render(),400);}
let _ampleMedsTimer=null;

function toggleSection(id){sections[id]=!sections[id];render()}
function jumpToResult(){currentStep=TOTAL_STEPS;window._needsScrollTop=true;render()}

function next(){if(currentStep<=TOTAL_STEPS-1){currentStep++;window._needsScrollTop=true;render()}}
function prev(){if(currentStep>0){currentStep--;window._needsScrollTop=true;render()}}

function requestRestart(){showRestartConfirm=true;render()}
function cancelRestart(){showRestartConfirm=false;render()}
function confirmRestart(){
  currentStep=0;
  evalEndTime=null;
  showRestartConfirm=false;
  mechanism={type:null,energy:null,details:new Set()};
  airway={patent:null,cspine:null,findings:new Set(),interventions:new Set()};
  breathing={status:null,findings:new Set(),interventions:new Set()};
  circulation={pulse:null,skinStatus:null,bleeding:new Set(),interventions:new Set()};
  disability={gcsEye:null,gcsVerbal:null,gcsMotor:null,pupils:null,pupilReactivity:null,laterality:null,findings:new Set()};
  exposure={tempStatus:null,findings:new Set(),interventions:new Set()};
  fast={ruq:null,luq:null,suprapubic:null,pericardial:null};
  secondary={head:new Set(),neck:new Set(),chest:new Set(),abdomen:new Set(),pelvis:new Set(),extremities:new Set(),spine:new Set(),skin:new Set()};
  ample={allergies:'',medications:'',pastHistory:'',lastMeal:'',events:''};
  vitals={hr:'',sbp:'',dbp:'',rr:'',spo2:'',temp:'',glic:'',mentalStatus:null};
  sections={conduta:true,mechanism:false,primary:false,gcs:false,fast:false,secondary:false,vitals:false,ample_result:false,imaging:true,note:false};
  window._activeSecondaryRegion='head';
  window._needsScrollTop=true;
  render();
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();if(currentStep<TOTAL_STEPS)next();}
  if(e.key==='ArrowLeft'||e.key==='Backspace'){e.preventDefault();prev();}
});

// Swipe
let touchX=null,touchY=null;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('.fast-grid,.score-options,.tab-bar,.options,.note-text,input,textarea,button'))return;
  touchX=e.touches[0].clientX;
  touchY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(touchX===null)return;
  const dx=e.changedTouches[0].clientX-touchX;
  const dy=e.changedTouches[0].clientY-touchY;
  touchX=null;touchY=null;
  if(Math.abs(dx)<80||Math.abs(dy)>Math.abs(dx)*0.7)return;
  if(dx<0&&currentStep<TOTAL_STEPS)next();
  else if(dx>0&&currentStep>0)prev();
},{passive:true});

// Init
window._needsScrollTop=false;
render();
</script>
