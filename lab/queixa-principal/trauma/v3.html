function navRow(showBack,canNext,nextLabel){
  let h='<div class="nav-row">';
  if(showBack)h+='<button class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h+=`<button class="nav-btn primary" ${canNext?'':'disabled'} onclick="next()">${nextLabel||'Próximo \u2192'}</button>`;
  h+='</div>';
  return h;
}

function inputField(label,field,value,placeholder,unit){
  let inputClass='vital-input';
  const v=parseFloat(value);
  if(!isNaN(v)){
    if(field==='hr'&&(v>120||v<50))inputClass+=' danger';
    else if(field==='hr'&&v>100)inputClass+=' warn';
    else if(field==='sbp'&&v<90)inputClass+=' danger';
    else if(field==='sbp'&&v<100)inputClass+=' warn';
    else if(field==='rr'&&(v<10||v>30))inputClass+=' danger';
    else if(field==='rr'&&(v<12||v>20))inputClass+=' warn';
    else if(field==='spo2'&&v<90)inputClass+=' danger';
    else if(field==='spo2'&&v<94)inputClass+=' warn';
    else if(field==='temp'&&v<35)inputClass+=' danger';
    else if(field==='temp'&&(v<36||v>38))inputClass+=' warn';
    else if(field==='glic'&&(v<60||v>250))inputClass+=' danger';
    else if(field==='glic'&&(v<70||v>200))inputClass+=' warn';
  }
  return `<div class="input-group"><span class="input-label">${label}</span><input type="number" inputmode="decimal" class="${inputClass}" data-field="vital_${field}" value="${value}" placeholder="${placeholder}" onchange="setVitalInput('${field}',this.value);render()" oninput="setVitalInput('${field}',this.value)"><span class="input-unit">${unit}</span></div>`;
}

function escHTML(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
}

// =======================================
// ACTIONS
// =======================================
function handleOption(action,value){
  switch(action){
    case'mechanism_type':mechanism.type=mechanism.type===value?null:value;break;
    case'mechanism_energy':mechanism.energy=mechanism.energy===value?null:value;break;
    case'airway_patent':airway.patent=airway.patent===value?null:value;break;
    case'airway_cspine':airway.cspine=airway.cspine===value?null:value;break;
    case'breathing_status':breathing.status=breathing.status===value?null:value;break;
    case'circ_pulse':circulation.pulse=circulation.pulse===value?null:value;break;
    case'circ_skin':circulation.skinStatus=circulation.skinStatus===value?null:value;break;
    case'disability_pupils':
      if(disability.pupils===value){disability.pupils=null;disability.laterality=null;}
      else{disability.pupils=value;if(value==='equal_reactive'||value==='fixed_bilateral')disability.laterality=null;}
      break;
    case'exposure_temp':exposure.tempStatus=exposure.tempStatus===value?null:value;break;
  }
  render();
}

function toggleMechDetail(id){mechanism.details.has(id)?mechanism.details.delete(id):mechanism.details.add(id);render()}

function toggleSetField(obj,field,id){
  const map={airway,breathing,circulation,exposure,disability};
  const target=map[obj];
  if(!target)return;
  target[field].has(id)?target[field].delete(id):target[field].add(id);
  render();
}

function setGCS(component,value){
  if(component==='eye')disability.gcsEye=disability.gcsEye===value?null:value;
  else if(component==='verbal')disability.gcsVerbal=disability.gcsVerbal===value?null:value;
  else if(component==='motor')disability.gcsMotor=disability.gcsMotor===value?null:value;
  render();
}

function setLaterality(side){disability.laterality=disability.laterality===side?null:side;render()}

function cycleFAST(quadrant){
  const order=[null,'negative','positive','indeterminate'];
  const current=fast[quadrant];
  const idx=order.indexOf(current);
  fast[quadrant]=order[(idx+1)%order.length];
  render();
}

function toggleSecondary(region,item){
  secondary[region].has(item)?secondary[region].delete(item):secondary[region].add(item);
  render();
}

window._activeSecondaryRegion='head';
function switchSecondaryRegion(key){window._activeSecondaryRegion=key;render()}

function setVitalInput(field,value){vitals[field]=value;}
function setVital(field,value){vitals[field]=value;render()}
function setAmple(field,value){ample[field]=value;}

function toggleSection(id){sections[id]=!sections[id];render()}

function next(){if(currentStep<=TOTAL_STEPS-1){currentStep++;render()}}
function prev(){if(currentStep>0){currentStep--;render()}}
function restart(){
  if(!confirm('Iniciar nova avaliação? Todos os dados atuais serão perdidos.'))return;
  currentStep=0;
  mechanism={type:null,energy:null,details:new Set(),mvcSpeed:null,fallHeight:null};
  airway={patent:null,cspine:null,findings:new Set(),interventions:new Set()};
  breathing={status:null,findings:new Set(),interventions:new Set()};
  circulation={pulse:null,skinStatus:null,bleeding:new Set(),interventions:new Set()};
  disability={gcsEye:null,gcsVerbal:null,gcsMotor:null,pupils:null,laterality:null,findings:new Set()};
  exposure={tempStatus:null,findings:new Set(),interventions:new Set()};
  fast={ruq:null,luq:null,suprapubic:null,pericardial:null};
  secondary={head:new Set(),neck:new Set(),chest:new Set(),abdomen:new Set(),pelvis:new Set(),extremities:new Set(),spine:new Set(),skin:new Set()};
  ample={allergies:'',medications:'',pastHistory:'',lastMeal:'',events:''};
  vitals={hr:'',sbp:'',dbp:'',rr:'',spo2:'',temp:'',glic:'',mentalStatus:null};
  sections={mechanism:true,primary:true,gcs:true,fast:true,secondary:true,vitals:true,shock:true,activation:true,imaging:true,conduta:true,note:true};
  window._activeSecondaryRegion='head';
  render();
}

// Keyboard navigation
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='Enter'){
    e.preventDefault();
    if(currentStep<TOTAL_STEPS)next();
  }
  if(e.key==='ArrowLeft'||e.key==='Backspace'){e.preventDefault();prev();}
});

// Init
render();
</script>
</body>
</html>
