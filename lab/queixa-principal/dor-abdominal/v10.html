<!-- VERSION: 10 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dor Abdominal &mdash; PS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg-primary:#0e1628;--bg-card:#1a2336;--bg-input:#0e1628;
    --border:#2b3650;--border-soft:#334155;
    --text-primary:#e8edf7;--text-secondary:#94a3b8;--text-muted:#64748b;
    --accent:#5b8def;--accent-light:#8eb4ff;--accent-bg:#172849;
    --red:#ef4444;--red-dark:#7f1d1d;--red-light:#fca5a5;--red-bg:#3a0a0a;
    --yellow:#f59e0b;--yellow-dark:#78350f;--yellow-light:#fcd34d;--yellow-bg:#3d1803;
    --green:#22c55e;--green-dark:#14532d;--green-light:#86efac;--green-bg:#042e16;
    --radius:.75rem;--radius-sm:.5rem;
    --transition:all .18s ease;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --serif:'Iowan Old Style','Palatino','Book Antiqua',Georgia,serif;
    --mono:'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg-primary);color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;padding-bottom:var(--safe-bottom);background-image:radial-gradient(1200px 600px at 50% -120px,rgba(91,141,239,.07),transparent 60%)}

  /* Header */
  header{width:100%;padding:calc(1rem + var(--safe-top)) 1.25rem 1rem;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:rgba(14,22,40,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  header h1{font-family:var(--serif);font-size:1.3rem;font-weight:600;letter-spacing:.005em;color:var(--text-primary)}
  header .sub{font-size:.62rem;color:var(--text-muted);margin-top:.22rem;text-transform:uppercase;letter-spacing:.22em;font-weight:500}
  .back-link{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--text-secondary);text-decoration:none;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:.3rem;padding:.45rem .55rem;border-radius:var(--radius-sm);transition:var(--transition)}
  .back-link:hover{color:var(--text-primary)}
  .back-link:active{background:rgba(255,255,255,.05)}

  .container{max-width:700px;width:100%;padding:1.15rem 1rem 2rem;display:flex;flex-direction:column;gap:1rem}

  /* Progress */
  .progress-bar{display:flex;align-items:center;gap:.3rem;padding:.1rem .1rem 0}
  .progress-step{flex:1;height:3px;border-radius:2px;background:#1f2c46;transition:background .4s ease}
  .progress-step.clickable{cursor:pointer}
  .progress-step.clickable:hover{background:#334155}
  .progress-step.done{background:var(--accent)}
  .progress-step.done:hover{background:var(--accent-light)}
  .progress-step.active{background:var(--accent-light);animation:pulse-bar 2s ease-in-out infinite}
  @keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.55}}
  .progress-labels{display:flex;justify-content:space-between;font-size:.55rem;color:var(--text-muted);padding:.35rem .1rem 0;text-transform:uppercase;letter-spacing:.08em}
  .progress-labels span{transition:color .3s;font-weight:500}
  .progress-labels span.clickable{cursor:pointer}
  .progress-labels span.clickable:hover{color:#cbd5e1}
  .progress-labels span.active-label{color:var(--accent-light);font-weight:700}
  .progress-labels span.done-label{color:var(--accent)}

  /* Step chip */
  .step-chip{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:.62rem;color:var(--text-muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.5rem}
  .step-chip .step-num{color:var(--accent-light);font-weight:700}
  .step-chip::before{content:'';width:14px;height:1px;background:var(--border);display:inline-block}

  /* Cards */
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:.9rem;padding:1.5rem 1.35rem;animation:slideUp .3s ease;position:relative}
  @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-family:var(--serif);font-size:1.3rem;color:var(--text-primary);margin-bottom:.15rem;font-weight:600;letter-spacing:.005em}
  .card .subtitle{font-size:.78rem;color:var(--text-secondary);margin-bottom:1.2rem;line-height:1.5}

  /* Option groups */
  .options{display:flex;flex-direction:column;gap:.55rem}
  .option-group-label{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.13em;color:var(--text-muted);margin-top:.85rem;margin-bottom:-.05rem;font-weight:600;display:flex;align-items:center;gap:.55rem}
  .option-group-label::after{content:'';flex:1;height:1px;background:var(--border);opacity:.45}
  .option-group-label:first-child{margin-top:0}

  /* Option buttons */
  .option-btn{background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem;color:#cbd5e1;font-size:.9rem;cursor:pointer;transition:var(--transition);text-align:left;display:flex;align-items:center;gap:.75rem;-webkit-user-select:none;user-select:none;font-family:inherit}
  .option-btn:hover{border-color:var(--accent);background:#172040;color:var(--text-primary)}
  .option-btn:active{transform:scale(.985)}
  .option-btn.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary)}
  .option-btn .label{flex:1;line-height:1.3}
  .option-btn .hint{display:block;font-size:.72rem;color:var(--text-muted);margin-top:.15rem;font-family:var(--serif);font-style:italic}
  .option-btn.selected .hint{color:#93c5fd}

  /* Check buttons */
  .check-btn{background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--radius);padding:.72rem .95rem;color:#cbd5e1;font-size:.87rem;cursor:pointer;transition:var(--transition);text-align:left;display:flex;align-items:center;gap:.65rem;-webkit-user-select:none;user-select:none;font-family:inherit}
  .check-btn:hover{border-color:var(--accent);background:#172040;color:var(--text-primary)}
  .check-btn:active{transform:scale(.985)}
  .check-btn.checked{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary)}
  .check-box{width:17px;height:17px;border:1.5px solid #475569;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:var(--transition);font-size:.7rem;line-height:1;color:#fff}
  .check-btn.checked .check-box{background:var(--accent);border-color:var(--accent)}
  .check-btn .sign-hint{font-size:.62rem;color:var(--text-muted);margin-left:auto;flex-shrink:0;background:#0b1222;padding:.2rem .5rem;border-radius:9999px;font-family:var(--serif);font-style:italic;letter-spacing:.01em}
  .check-btn.checked .sign-hint{color:var(--accent-light);background:#0d1b38}
  .check-btn.relevant:not(.checked){border-color:rgba(91,141,239,.3);box-shadow:inset 0 0 0 1px rgba(91,141,239,.08)}

  /* Nav */
  .nav-row{display:flex;gap:.6rem;margin-top:1.4rem}
  .nav-btn{flex:1;padding:.88rem;border-radius:var(--radius);font-size:.88rem;font-weight:600;cursor:pointer;transition:var(--transition);border:none;-webkit-user-select:none;user-select:none;font-family:inherit}
  .nav-btn:active{transform:scale(.97)}
  .nav-btn.secondary{background:#2a3855;color:#cbd5e1}.nav-btn.secondary:hover{background:#344366}
  .nav-btn.primary{background:var(--accent);color:#fff}.nav-btn.primary:hover{background:#4a7ce0}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}

  /* Shake */
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  .shake{animation:shake .45s ease}

  /* Result */
  .result-card{text-align:center;padding:1.75rem 1.35rem}
  .result-plate{display:inline-flex;align-items:center;justify-content:center;width:4rem;height:4rem;border-radius:50%;font-family:var(--serif);font-size:1.4rem;font-weight:700;margin-bottom:1rem;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);letter-spacing:.02em}
  @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .result-plate.p-surgical{background:var(--red-bg);color:var(--red-light);border:2px solid var(--red);animation:popIn .4s cubic-bezier(.34,1.56,.64,1),pulse-red 1.8s ease-in-out .4s infinite}
  .result-plate.p-urgent{background:var(--yellow-bg);color:var(--yellow-light);border:2px solid var(--yellow)}
  .result-plate.p-medical{background:#0d2551;color:#93c5fd;border:2px solid var(--accent)}
  .result-plate.p-low{background:var(--green-bg);color:var(--green-light);border:2px solid var(--green)}
  @keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
  .result-title{font-family:var(--serif);font-size:1.35rem;font-weight:600;margin-bottom:.25rem;letter-spacing:.005em}
  .result-desc{color:var(--text-secondary);font-size:.84rem;margin-bottom:1.1rem;line-height:1.5;max-width:36ch;margin-left:auto;margin-right:auto}
  .patient-line{font-family:var(--mono);font-size:.68rem;color:var(--text-muted);margin-bottom:1.25rem;letter-spacing:.05em;padding-bottom:1rem;border-bottom:1px dashed var(--border)}

  /* Dark box */
  .dark-box{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:1.05rem 1.1rem;text-align:left;margin-bottom:.7rem;transition:border-color .2s}
  .dark-box h3{font-family:var(--mono);font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.13em;margin-bottom:0;font-weight:600}
  .summary-row{display:flex;justify-content:space-between;align-items:baseline;padding:.4rem 0;border-bottom:1px solid rgba(43,54,80,.55);font-size:.82rem;gap:.5rem}
  .summary-row:last-child{border-bottom:none}
  .summary-row:first-child{padding-top:.15rem}
  .summary-row .criteria{color:var(--text-muted);flex-shrink:0;font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;min-width:32%}
  .summary-row .value{font-weight:500;display:flex;align-items:center;gap:.4rem;color:var(--text-primary);text-align:right;flex-wrap:wrap;justify-content:flex-end;min-width:0;word-break:break-word;font-size:.8rem;line-height:1.4}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-red{background:var(--red)}.dot-yellow{background:var(--yellow)}.dot-green{background:var(--green)}

  /* Abdomen SVG — anatomical textbook feel */
  .abdomen-plate{display:flex;flex-direction:column;align-items:center;margin:.5rem 0 .5rem}
  .abdomen-svg{width:100%;max-width:290px;height:auto;display:block}
  .abd-region{fill:#0e1628;stroke:var(--border);stroke-width:1.3;cursor:pointer;transition:fill .18s,stroke .18s}
  .abd-region:hover{fill:#18233c;stroke:var(--accent)}
  .abd-region.selected{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.8}
  .abd-label{font-family:var(--mono);font-size:8.5px;fill:var(--text-muted);text-anchor:middle;pointer-events:none;letter-spacing:.05em;font-weight:500}
  .abd-label.selected{fill:var(--accent-light);font-weight:700}
  .abd-outline{fill:none;stroke:var(--border-soft);stroke-width:1.5;stroke-dasharray:3 3;opacity:.55}
  .abd-umb{fill:var(--text-muted);opacity:.7}
  .abd-side{font-family:var(--serif);font-style:italic;font-size:8px;fill:var(--text-muted);opacity:.65;letter-spacing:.1em}
  .abd-fig-label{font-family:var(--serif);font-style:italic;font-size:.7rem;color:var(--text-muted);text-align:center;margin-top:.25rem;letter-spacing:.02em}
  .abd-diffuse-btn{width:100%;max-width:290px;margin:.6rem auto 0;display:block}

  /* Score section */
  .score-tabs{display:flex;gap:.35rem;margin-bottom:1rem}
  .score-tab{flex:1;padding:.6rem .3rem;border-radius:var(--radius-sm);font-size:.76rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--bg-input);color:var(--text-muted);text-align:center;transition:var(--transition);-webkit-user-select:none;user-select:none;position:relative;font-family:inherit}
  .score-tab.active{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary)}
  .score-tab.suggested::before{content:'';position:absolute;top:.3rem;left:.3rem;width:5px;height:5px;background:var(--accent-light);border-radius:50%;box-shadow:0 0 6px var(--accent-light)}
  .score-tab:hover{border-color:var(--accent)}
  .score-tab .tab-check{position:absolute;top:-.3rem;right:-.3rem;font-size:.55rem;background:var(--accent);color:#fff;width:.95rem;height:.95rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
  .score-row{margin-bottom:.6rem}
  .score-row-label{font-size:.78rem;color:var(--text-secondary);margin-bottom:.3rem;display:flex;justify-content:space-between;align-items:center;line-height:1.35;gap:.5rem}
  .score-row-label .auto-tag{font-size:.55rem;background:var(--accent-bg);color:var(--accent-light);padding:.12rem .45rem;border-radius:9999px;font-weight:600;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;flex-shrink:0}
  .score-options{display:flex;gap:.35rem}
  .score-opt{flex:1;padding:.5rem .3rem;border-radius:var(--radius-sm);font-size:.72rem;cursor:pointer;border:1.5px solid var(--border);background:var(--bg-input);color:var(--text-muted);text-align:center;transition:var(--transition);line-height:1.25;-webkit-user-select:none;user-select:none;font-family:inherit}
  .score-opt:hover{border-color:var(--accent);color:#cbd5e1}
  .score-opt:active{transform:scale(.96)}
  .score-opt.picked{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary);font-weight:600}
  .score-opt .pts{display:block;font-size:.55rem;color:var(--text-muted);margin-top:.1rem;font-family:var(--mono)}
  .score-opt.picked .pts{color:#93c5fd}
  .score-result{display:flex;align-items:center;gap:.85rem;padding:.85rem;border-radius:var(--radius);margin-top:.65rem}
  .score-result.sr-high{background:var(--red-bg);border:1px solid var(--red-dark)}
  .score-result.sr-mod{background:var(--yellow-bg);border:1px solid var(--yellow-dark)}
  .score-result.sr-low{background:var(--green-bg);border:1px solid var(--green-dark)}
  .score-result.sr-pending{background:var(--bg-card);border:1px dashed var(--border)}
  .score-num{font-family:var(--serif);font-size:1.9rem;font-weight:700;min-width:2.2rem;text-align:center;line-height:1}
  .score-result.sr-high .score-num{color:var(--red-light)}
  .score-result.sr-mod .score-num{color:var(--yellow-light)}
  .score-result.sr-low .score-num{color:var(--green-light)}
  .score-result.sr-pending .score-num{color:var(--text-muted)}
  .score-info{flex:1;min-width:0}
  .score-info .score-label{font-size:.82rem;font-weight:600;color:var(--text-primary)}
  .score-info .score-detail{font-size:.72rem;color:var(--text-secondary);margin-top:.15rem;line-height:1.45}
  .score-phase{font-family:var(--mono);font-size:.62rem;color:var(--accent-light);font-weight:700;margin-bottom:.6rem;letter-spacing:.12em;text-transform:uppercase}
  .score-phase.second{margin-top:.85rem}
  .score-intro{font-size:.74rem;color:var(--text-secondary);margin-bottom:.85rem;line-height:1.55;font-family:var(--serif);font-style:italic}
  .score-intro .auto-tag{font-style:normal;display:inline-block;vertical-align:baseline}
  .score-footnote{font-size:.68rem;color:var(--text-muted);line-height:1.6;margin-top:.55rem;font-family:var(--serif);font-style:italic}

  /* Conduta box */
  .conduta-box{border-radius:var(--radius);padding:1.05rem 1.1rem;text-align:left;margin-bottom:.7rem}
  .conduta-box h3{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.13em;margin-bottom:0;font-weight:700}
  .conduta-box.alta-prob{background:var(--red-bg);border:1px solid var(--red-dark)}.conduta-box.alta-prob h3{color:var(--red-light)}
  .conduta-box.mod-prob{background:var(--yellow-bg);border:1px solid var(--yellow-dark)}.conduta-box.mod-prob h3{color:var(--yellow-light)}
  .conduta-box.baixa-prob{background:var(--green-bg);border:1px solid var(--green-dark)}.conduta-box.baixa-prob h3{color:var(--green-light)}
  .conduta-box.neutra-prob{background:var(--bg-card);border:1px solid var(--border)}.conduta-box.neutra-prob h3{color:var(--text-secondary)}
  .conduta-item{display:flex;align-items:flex-start;gap:.6rem;padding:.42rem 0;font-size:.82rem;color:#cbd5e1;line-height:1.5;border-bottom:1px solid rgba(43,54,80,.35)}
  .conduta-item:last-child{border-bottom:none}
  .conduta-bul{flex-shrink:0;width:.5rem;height:.5rem;margin-top:.45rem;border-radius:50%;background:currentColor;opacity:.55}
  .conduta-box.alta-prob .conduta-bul{color:var(--red)}
  .conduta-box.mod-prob .conduta-bul{color:var(--yellow)}
  .conduta-box.baixa-prob .conduta-bul{color:var(--green)}
  .conduta-box.neutra-prob .conduta-bul{color:var(--accent)}

  /* Dx list */
  .dx-list{display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem}
  .dx-item{display:flex;align-items:center;gap:.65rem;padding:.58rem .75rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.82rem;color:#cbd5e1;transition:var(--transition)}
  .dx-item:hover{border-color:rgba(91,141,239,.35)}
  .dx-item .dx-rank{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--accent-light);min-width:1.2rem;text-align:center}
  .dx-item .dx-name{flex:1;min-width:0;font-family:var(--serif);letter-spacing:.005em}
  .dx-item .dx-prob{font-family:var(--mono);font-size:.55rem;font-weight:600;padding:.2rem .55rem;border-radius:9999px;flex-shrink:0;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em}
  .dx-prob.prob-high{background:#5a0f0f;color:var(--red-light)}
  .dx-prob.prob-mod{background:#3a2706;color:var(--yellow-light)}
  .dx-prob.prob-low{background:#0b2e17;color:var(--green-light)}

  /* Collapsible */
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;padding:.1rem 0}
  .collapse-header:hover h3{color:var(--text-secondary)}
  .collapse-header:active{opacity:.8}
  .collapse-header h3{transition:color .2s}
  .collapse-arrow{font-size:.6rem;color:var(--text-muted);transition:transform .3s ease;padding:.15rem}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .32s ease,opacity .22s ease}
  .collapse-body.hidden{max-height:0!important;padding-top:0;margin-top:0;opacity:0}
  .collapse-body.visible{max-height:5000px;opacity:1}

  /* Note */
  .note-text{background:#07101f;border:1px solid var(--border);border-radius:var(--radius-sm);padding:.85rem;font-family:var(--mono);font-size:.66rem;color:#cbd5e1;white-space:pre-wrap;line-height:1.65;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:.6rem}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.6rem;padding:.7rem;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg-card);color:#cbd5e1;font-size:.8rem;font-weight:600;cursor:pointer;transition:var(--transition);-webkit-user-select:none;user-select:none;font-family:inherit}
  .copy-btn:hover{border-color:var(--accent);background:#172040;color:var(--text-primary)}
  .copy-btn:active{transform:scale(.98)}
  .copy-btn.copied{border-color:var(--green);background:var(--green-bg);color:var(--green-light)}

  /* Workup tags */
  .workup-section{margin-top:.5rem}
  .workup-heading{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.13em;margin-bottom:.45rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
  .workup-heading.urgent-h{color:var(--red-light)}
  .workup-heading.routine-h{color:var(--accent-light);margin-top:.85rem}
  .workup-heading::after{content:'';flex:1;height:1px;background:var(--border);opacity:.4}
  .workup-tags{display:flex;flex-wrap:wrap;gap:.3rem}
  .workup-tag{font-size:.72rem;padding:.3rem .6rem;border-radius:9999px;background:var(--bg-card);border:1px solid var(--border);color:#cbd5e1}
  .workup-tag.urgent{background:#3a0a0a;border-color:var(--red-dark);color:var(--red-light)}
  .workup-tag.routine{background:#0d1b38;border-color:#1e40af;color:#93c5fd}

  /* Info hint */
  .info-hint{font-size:.76rem;color:var(--text-secondary);background:rgba(91,141,239,.05);border-left:2px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.65rem .85rem;margin-top:.9rem;line-height:1.5;animation:fadeIn .25s ease}
  .info-hint strong{color:var(--accent-light);font-weight:600}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* Red flag */

  {id:'liver_disease',label:'Hepatopatia crônica'},
  {id:'obesity',label:'Obesidade'},
  {id:'transplant',label:'Transplante de órgão'},

const ALVARADO=[
  {id:'alv_migration',label:'Migração da dor para FID',pts:1},
  {id:'alv_anorexia',label:'Anorexia',pts:1},
  {id:'alv_nausea',label:'Náusea / Vômitos',pts:1},
  {id:'alv_rlq_tender',label:'Dor à palpação em FID',pts:2},
  {id:'alv_rebound',label:'Descompressão brusca +',pts:1},
  {id:'alv_fever',label:'Temperatura > 37,3 \u00B0C',pts:1},
  {id:'alv_leukocytosis',label:'Leucocitose > 10.000',pts:2},
  {id:'alv_left_shift',label:'Desvio à esquerda (> 75% neutrófilos)',pts:1},
];

const RANSON_ADMIT=[
  {id:'ran_age',label:'Idade > 55 anos',pts:1},
  {id:'ran_wbc',label:'Leucócitos > 16.000',pts:1},

  {id:'ran_ldh',label:'LDH > 350 U/L',pts:1},

];

const RANSON_48H=[
  {id:'ran_hct',label:'Queda Hct > 10%',pts:1},
  {id:'ran_bun',label:'Aumento BUN > 5 mg/dL',pts:1},
  {id:'ran_calcium',label:'Cálcio < 8 mg/dL',pts:1},
  {id:'ran_pao2',label:'PaO\u2082 < 60 mmHg',pts:1},
  {id:'ran_base',label:'Déficit de base > 4 mEq/L',pts:1},
  {id:'ran_fluid',label:'Sequestro líquido > 6L',pts:1},
];

const BISAP=[
  {id:'bisap_bun',label:'BUN > 25 mg/dL',pts:1},
  {id:'bisap_mental',label:'Alteração do nível de consciência (Glasgow < 15)',pts:1},
  {id:'bisap_sirs',label:'SIRS (\u2265 2 critérios)',pts:1},
  {id:'bisap_age',label:'Idade > 60 anos',pts:1},
  {id:'bisap_effusion',label:'Derrame pleural na imagem',pts:1},
];

const AGE_LABELS=['< 18','18-40','40-65','> 65'];
const DUR_LABELS=['< 6h','6-24h','24-72h','> 72h'];
const INT_LABELS=['Leve','Moderada','Intensa'];

// =============================================
// STATE
// =============================================
let step=0;
let painLocation=null;
let painOnset=null;
let painQuality=new Set();
let painRadiation=new Set();
let aggravating=new Set();
let relieving=new Set();
let assocSymptoms=new Set();
let peritonealSigns=new Set();
let specificSigns=new Set();
let vitalSigns=new Set();
let pastHistory=new Set();
let patAge=null;
let patSex=null;
let lmpStatus=null;
let painDuration=null;
let painIntensity=null;
let activeScoreTab='alvarado';
let alvaradoState={};
let ransonAdmitState={};
let ranson48hState={};
let bisapState={};
let sections={summary:true,ddx:true,scores:true,workup:true,conduta:true,analgesia:false,note:false};
let analgesiaAutoExpanded=false;
const evalStartTime=new Date();

const app=document.getElementById('app');

// =============================================
// HELPERS
// =============================================
function labelById(arr,id){const o=arr.find(x=>x.id===id);return o?o.label:'';}
function labelsFromSet(arr,set){return [...set].map(id=>labelById(arr,id)).filter(Boolean);}
function isPregnancyPossible(){return patSex==='F'&&lmpStatus==='possible';}

// =============================================
// AUTO-FILL SCORES
// =============================================
function autoAlvarado(){
  const a={...alvaradoState};
  if(assocSymptoms.has('anorexia')&&a['alv_anorexia']===undefined) a['alv_anorexia']=1;
  if((assocSymptoms.has('nausea')||assocSymptoms.has('vomiting'))&&a['alv_nausea']===undefined) a['alv_nausea']=1;
  if(specificSigns.has('mcburney')&&a['alv_rlq_tender']===undefined) a['alv_rlq_tender']=1;
  if((peritonealSigns.has('rebound')||specificSigns.has('dunphy'))&&a['alv_rebound']===undefined) a['alv_rebound']=1;
  if((assocSymptoms.has('fever')||vitalSigns.has('fever_vs'))&&a['alv_fever']===undefined) a['alv_fever']=1;
  if(painLocation==='rlq'&&a['alv_migration']===undefined) a['alv_migration']=1;
  return a;
}

function autoRansonAdmit(){
  const r={...ransonAdmitState};
  if(patAge===3&&r['ran_age']===undefined) r['ran_age']=1;
  return r;
}

function autoBISAP(){
  const b={...bisapState};
  if(patAge===3&&b['bisap_age']===undefined) b['bisap_age']=1;
  let sirs=0;
  if(vitalSigns.has('tachycardia')) sirs++;
  if(vitalSigns.has('fever_vs')||vitalSigns.has('hypothermia')) sirs++;
  if(vitalSigns.has('tachypnea')) sirs++;
  if(sirs>=2&&b['bisap_sirs']===undefined) b['bisap_sirs']=1;
  return b;
}

function sumScore(items,state){
  let total=0,filled=0;
  for(const i of items){
    if(state[i.id]!==undefined){filled++;if(state[i.id])total+=i.pts;}
  }
  return filled<items.length?null:total;
}

function getAlvaradoScore(){return sumScore(ALVARADO,autoAlvarado());}
function getRansonAdmitScore(){return sumScore(RANSON_ADMIT,autoRansonAdmit());}
function getRanson48hScore(){return sumScore(RANSON_48H,ranson48hState);}
function getRansonDisplay(){
  const a=getRansonAdmitScore();if(a===null) return null;
  const b=getRanson48hScore();
  if(b===null) return {score:a,partial:true};
  return {score:a+b,partial:false};
}
function getBISAPScore(){return sumScore(BISAP,autoBISAP());}

// =============================================
// RISK STRATIFICATION
// =============================================
function isSurgicalAbdomen(){
  if(peritonealSigns.has('rigidity')) return true;
  if(peritonealSigns.has('guarding')&&peritonealSigns.has('rebound')) return true;
  if(peritonealSigns.has('absent_bs')&&(peritonealSigns.has('guarding')||peritonealSigns.has('rebound'))) return true;
  if(vitalSigns.has('hypotension')&&peritonealSigns.size>0) return true;
  return false;
}

function isUrgent(){
  if(vitalSigns.has('hypotension')) return true;
  if(vitalSigns.has('tachycardia')&&(assocSymptoms.has('hematochezia')||assocSymptoms.has('hematemesis'))) return true;
  if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')) return true;
  if(peritonealSigns.size>=2) return true;
  if(painOnset==='sudden'&&painIntensity===2) return true;
  if(assocSymptoms.has('syncope')) return true;
  if(painQuality.has('tearing')) return true;
  if(isPregnancyPossible()&&(assocSymptoms.has('vaginal_bleeding')||assocSymptoms.has('amenorrhea'))) return true;
  if(patAge===3&&painOnset==='sudden'&&(painLocation==='diffuse'||painLocation==='periumbilical')) return true;
  if(pastHistory.has('corticosteroid')&&peritonealSigns.size>=1) return true;
  if(vitalSigns.has('hypothermia')) return true;
  if((pastHistory.has('immunosupp')||pastHistory.has('transplant'))&&assocSymptoms.has('fever')) return true;
  return false;
}

function getRiskLevel(){
  if(isSurgicalAbdomen()) return 'surgical';
  if(isUrgent()) return 'urgent';
  if(peritonealSigns.size===0&&!vitalSigns.has('hypotension')&&!vitalSigns.has('tachycardia')&&!assocSymptoms.has('syncope')) return 'low';
  return 'medical';
}

function getRiskInfo(){
  const r=getRiskLevel();
  if(r==='surgical') return {level:'surgical',title:'Abdome Cirúrgico',desc:'Irritação peritoneal difusa e/ou instabilidade. Avaliação cirúrgica de urgência.',badge:'p-surgical',initial:'C'};
  if(r==='urgent') return {level:'urgent',title:'Urgência',desc:'Sinais de alarme presentes. Investigação rápida e reavaliação frequente.',badge:'p-urgent',initial:'U'};
  if(r==='medical') return {level:'medical',title:'Manejo Clínico',desc:'Achados sugestivos de etiologia clínica. Investigação direcionada.',badge:'p-medical',initial:'M'};
  return {level:'low',title:'Baixo Risco',desc:'Sem sinais de alarme. Considerar avaliação ambulatorial ou observação breve.',badge:'p-low',initial:'B'};
}

// =============================================
// RED FLAGS
// =============================================
function getRedFlags(){
  const flags=[];
  if(vitalSigns.has('hypotension')) flags.push('Hipotensão \u2014 avaliar choque');
  if(peritonealSigns.has('rigidity')) flags.push('Abdome em tábua \u2014 peritonite difusa');
  if(painOnset==='sudden'&&painIntensity===2) flags.push('Dor súbita intensa \u2014 considerar perfuração, rotura ou torção');
  if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')&&painLocation==='ruq') flags.push('Tríade de Charcot \u2014 colangite aguda');
  if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')&&vitalSigns.has('hypotension')) flags.push('Pêntade de Reynolds \u2014 colangite supurativa');
  if(assocSymptoms.has('syncope')) flags.push('Síncope \u2014 avaliar sangramento ou instabilidade');
  if(patAge===3&&painOnset==='sudden'&&(painLocation==='diffuse'||painLocation==='periumbilical')) flags.push('Idoso + dor difusa súbita \u2014 excluir isquemia mesentérica e AAA');
  if(assocSymptoms.has('hematemesis')||assocSymptoms.has('hematochezia')) flags.push('Sangramento GI \u2014 avaliar estabilidade e Hb');
  if(isPregnancyPossible()&&(assocSymptoms.has('vaginal_bleeding')||vitalSigns.has('hypotension'))) flags.push('Gravidez ectópica rota até prova em contrário');
  if(isPregnancyPossible()&&assocSymptoms.has('amenorrhea')) flags.push('Amenorreia em idade fértil \u2014 beta-hCG obrigatório');
  if(specificSigns.has('cullen')||specificSigns.has('grey_turner')) flags.push('Sinais de hemorragia retroperitoneal');
  if(painIntensity===2&&peritonealSigns.size===0&&patAge===3) flags.push('Dor intensa sem peritonismo em idoso \u2014 considerar isquemia mesentérica');
  if(painIntensity===2&&peritonealSigns.size===0&&patAge===2&&pastHistory.has('atrial_fib')) flags.push('Dor intensa sem peritonismo + FA \u2014 considerar isquemia mesentérica');
  if(patAge===3&&vitalSigns.has('tachycardia')&&!assocSymptoms.has('fever')) flags.push('Taquicardia sem febre em idoso \u2014 avaliar hemorragia oculta');
  if(pastHistory.has('immunosupp')&&assocSymptoms.has('fever')) flags.push('Febre em imunossuprimido \u2014 apresentação atípica possível');
  if(pastHistory.has('transplant')&&assocSymptoms.has('fever')) flags.push('Febre em transplantado \u2014 menor limiar para internação');
  if(pastHistory.has('corticosteroid')&&peritonealSigns.size>0) flags.push('Corticoides podem mascarar peritonismo \u2014 menor limiar para imagem');
  if(painQuality.has('tearing')&&painRadiation.has('back')) flags.push('Dor dilacerante com irradiação dorsal \u2014 excluir dissecção / AAA roto');
  if(patAge===0&&assocSymptoms.has('fever')&&peritonealSigns.size>0) flags.push('Pediatria + febre + peritonismo \u2014 apendicite / peritonite primária');
  if(vitalSigns.has('hypothermia')) flags.push('Hipotermia \u2014 possível sepse ou choque');
  if(assocSymptoms.has('chest_pain')&&painLocation==='epigastric') flags.push('Dor torácica + epigastralgia \u2014 excluir IAM / SCA');
  if(patAge===0&&assocSymptoms.has('hematochezia')&&painQuality.has('colicky')) flags.push('Pediatria + cólica + hematoquezia \u2014 considerar intussuscepção');
  return flags;
}

// =============================================
// DDX ENGINE
// =============================================
function buildDifferentials(){
  if(!painLocation) return [];
  const base=LOCATION_DDX[painLocation]||[];
  let scored=base.map((dx,i)=>({name:dx,score:base.length-i}));

  for(const s of scored){
    const n=s.name.toLowerCase();
    if(n.includes('apendicite')){
      if(specificSigns.has('mcburney')) s.score+=5;
      if(specificSigns.has('rovsing')) s.score+=3;
      if(specificSigns.has('psoas')) s.score+=2;
      if(specificSigns.has('obturator')) s.score+=2;
      if(specificSigns.has('dunphy')) s.score+=2;
      if(assocSymptoms.has('anorexia')) s.score+=2;
      if(assocSymptoms.has('nausea')||assocSymptoms.has('vomiting')) s.score+=1;
      if(assocSymptoms.has('fever')) s.score+=1;
      if(painLocation==='rlq') s.score+=3;
      if(patAge===1) s.score+=1;
      if(painDuration!==null&&painDuration<=1) s.score+=1;
    }
    if(n.includes('colecistite')){
      if(specificSigns.has('murphy')) s.score+=5;
      if(painRadiation.has('shoulder_r')||painRadiation.has('scapular')) s.score+=3;
      if(assocSymptoms.has('nausea')||assocSymptoms.has('vomiting')) s.score+=1;
      if(painQuality.has('colicky')) s.score+=2;
      if(aggravating.has('eating')) s.score+=2;
      if(patSex==='F') s.score+=1;
      if(patAge!==null&&patAge>=2) s.score+=1;
      if(assocSymptoms.has('fever')) s.score+=1;
      if(pastHistory.has('obesity')) s.score+=1;
    }
    if(n.includes('biliar')){
      if(painQuality.has('colicky')) s.score+=3;
      if(aggravating.has('eating')) s.score+=3;
      if(painRadiation.has('shoulder_r')||painRadiation.has('scapular')) s.score+=2;
      if(relieving.has('fasting')) s.score+=2;
      if(patSex==='F') s.score+=1;
      if(pastHistory.has('obesity')) s.score+=1;
    }
    if(n.includes('colangite')){
      if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')) s.score+=5;
      if(vitalSigns.has('hypotension')) s.score+=2;
      if(assocSymptoms.has('jaundice')) s.score+=2;
    }
    if(n.includes('pancreatite')){
      if(painRadiation.has('back')) s.score+=4;
      if(relieving.has('flexion')) s.score+=3;
      if(painQuality.has('constant')) s.score+=2;
      if(assocSymptoms.has('vomiting')) s.score+=2;
      if(specificSigns.has('cullen')||specificSigns.has('grey_turner')) s.score+=4;
      if(pastHistory.has('alcohol')) s.score+=3;
      if(painLocation==='epigastric') s.score+=2;
    }
    if(n.includes('obstru')){
      if(assocSymptoms.has('vomiting')&&assocSymptoms.has('constipation')) s.score+=5;
      if(peritonealSigns.has('absent_bs')) s.score+=3;
      if(peritonealSigns.has('hyper_bs')) s.score+=3;
      if(painQuality.has('colicky')) s.score+=3;
      if(assocSymptoms.has('distension')) s.score+=3;
      if(peritonealSigns.has('visible_distension')) s.score+=2;
      if(painLocation==='diffuse'||painLocation==='periumbilical') s.score+=2;
      if(pastHistory.has('prev_surgery')) s.score+=4;
    }
    if(n.includes('peritonite')){
      if(peritonealSigns.has('rigidity')) s.score+=5;
      if(peritonealSigns.has('guarding')&&peritonealSigns.has('rebound')) s.score+=4;
      if(peritonealSigns.has('absent_bs')) s.score+=2;
      if(assocSymptoms.has('fever')) s.score+=1;
      if(specificSigns.has('dunphy')) s.score+=2;
    }
    if(n.includes('cistite')||n.includes('itu')){
      if(assocSymptoms.has('dysuria')) s.score+=5;
      if(assocSymptoms.has('hematuria')) s.score+=3;
      if(patSex==='F') s.score+=1;
    }
    if(n.includes('pielonefrite')){
      if(assocSymptoms.has('fever')) s.score+=3;
      if(assocSymptoms.has('dysuria')) s.score+=2;
      if(specificSigns.has('giordano')) s.score+=4;
    }
    if(n.includes('lica renal')||n.includes('lit')){
      if(painQuality.has('colicky')) s.score+=3;
      if(painRadiation.has('groin')) s.score+=4;
      if(assocSymptoms.has('hematuria')) s.score+=3;
      if(specificSigns.has('giordano')) s.score+=3;
      if(painOnset==='sudden'||painOnset==='acute') s.score+=2;
    }
    if(n.includes('ect\u00F3pica')){
      if(isPregnancyPossible()) s.score+=5;
      if(assocSymptoms.has('vaginal_bleeding')) s.score+=4;
      if(assocSymptoms.has('amenorrhea')) s.score+=3;
      if(vitalSigns.has('hypotension')) s.score+=3;
      if(assocSymptoms.has('syncope')) s.score+=2;
    }
    if(n.includes('tor\u00E7\u00E3o de ov\u00E1rio')){
      if(patSex==='F') s.score+=2;
      if(painOnset==='sudden') s.score+=3;
      if(assocSymptoms.has('nausea')||assocSymptoms.has('vomiting')) s.score+=1;
    }
    if(n.includes('diverticulite')){
      if(patAge!==null&&patAge>=2) s.score+=2;
      if(assocSymptoms.has('fever')) s.score+=2;
      if(assocSymptoms.has('constipation')) s.score+=1;
      if(painLocation==='llq') s.score+=3;
      if(painDuration!==null&&painDuration>=1) s.score+=1;
    }
    if(n.includes('gastroenterite')){
      if(assocSymptoms.has('diarrhea')) s.score+=4;
      if(assocSymptoms.has('nausea')&&assocSymptoms.has('vomiting')) s.score+=2;
      if(peritonealSigns.size===0) s.score+=2;
    }
    if(n.includes('lcera')){
      if(painQuality.has('burning')) s.score+=3;
      if(relieving.has('antacids')) s.score+=3;
      if(aggravating.has('eating')) s.score+=1;
      if(pastHistory.has('nsaid')) s.score+=3;
      if(pastHistory.has('corticosteroid')) s.score+=1;
      if(assocSymptoms.has('hematemesis')) s.score+=3;
    }
    if(n.includes('isquemia mesent')){
      if(patAge===3) s.score+=3;
      if(painOnset==='sudden'&&painIntensity===2) s.score+=3;
      if(painIntensity===2&&peritonealSigns.size===0) s.score+=4;
      if(pastHistory.has('atrial_fib')) s.score+=4;
      if(pastHistory.has('anticoag')) s.score-=1;
    }
    if(n.includes('aaa')||n.includes('aneurisma')){
      if(patAge===3) s.score+=2;
      if(painOnset==='sudden') s.score+=2;
      if(vitalSigns.has('hypotension')) s.score+=3;
      if(painRadiation.has('back')) s.score+=2;
      if(painQuality.has('tearing')) s.score+=3;
      if(pastHistory.has('hypertension')) s.score+=2;
      if(pastHistory.has('smoking')) s.score+=2;
      if(patSex==='M') s.score+=1;
    }
    if(n.includes('dip')||n.includes('fitz-hugh')){
      if(patSex==='F') s.score+=2;
      if(assocSymptoms.has('fever')) s.score+=2;
      if(assocSymptoms.has('vaginal_bleeding')) s.score+=1;
    }
    if(n.includes('rnia')){
      if(aggravating.has('valsalva')) s.score+=3;
      if(pastHistory.has('prev_surgery')) s.score+=1;
      if(pastHistory.has('obesity')) s.score+=1;
    }
    if(n.includes('pneumonia')){
      if(vitalSigns.has('tachypnea')) s.score+=3;
      if(assocSymptoms.has('fever')) s.score+=2;
      if(vitalSigns.has('sat_low')) s.score+=3;
      if(assocSymptoms.has('chest_pain')) s.score+=2;
    }
    if(n.includes('iam')){
      if(patAge!==null&&patAge>=2) s.score+=2;
      if(pastHistory.has('diabetes')) s.score+=2;
      if(pastHistory.has('hypertension')) s.score+=1;
      if(painRadiation.has('chest')) s.score+=2;
      if(assocSymptoms.has('chest_pain')) s.score+=3;
    }
    if(n.includes('prostatite')){
      if(patSex==='M') s.score+=2;
      if(assocSymptoms.has('dysuria')) s.score+=2;
      if(assocSymptoms.has('fever')) s.score+=2;
    }
    if(n.includes('cetoacidose')){
      if(pastHistory.has('diabetes')) s.score+=5;
      if(vitalSigns.has('tachypnea')) s.score+=2;
    }
    if(n.includes('crohn')||n.includes('colite')){
      if(pastHistory.has('ibd')) s.score+=5;
      if(assocSymptoms.has('diarrhea')) s.score+=2;
      if(assocSymptoms.has('hematochezia')) s.score+=2;
      if(assocSymptoms.has('weight_loss')) s.score+=1;
    }
    if(n.includes('hepatite')){
      if(assocSymptoms.has('jaundice')) s.score+=4;
      if(assocSymptoms.has('anorexia')) s.score+=1;
      if(assocSymptoms.has('nausea')) s.score+=1;
      if(pastHistory.has('alcohol')) s.score+=2;
    }
    if(n.includes('abscesso hep')){
      if(assocSymptoms.has('fever')) s.score+=3;
      if(assocSymptoms.has('jaundice')) s.score+=1;
      if(pastHistory.has('diabetes')) s.score+=1;
    }
    if(n.includes('herpes')){
      if(painQuality.has('burning')||painQuality.has('sharp')) s.score+=2;
      if(patAge!==null&&patAge>=2) s.score+=1;
      if(pastHistory.has('immunosupp')) s.score+=2;
    }
    if(n.includes('porfiria')){
      if(patSex==='F') s.score+=1;
      if(painQuality.has('colicky')) s.score+=2;
      if(assocSymptoms.has('constipation')) s.score+=1;
      if(assocSymptoms.has('nausea')||assocSymptoms.has('vomiting')) s.score+=1;
      if(peritonealSigns.size===0) s.score+=2;
    }
    if(n.includes('tiflite')){
      if(pastHistory.has('immunosupp')) s.score+=4;
      if(pastHistory.has('transplant')) s.score+=3;
      if(assocSymptoms.has('fever')) s.score+=2;
      if(assocSymptoms.has('diarrhea')) s.score+=1;
    }
    if(n.includes('vasculite')){
      if(pastHistory.has('immunosupp')) s.score+=2;
      if(assocSymptoms.has('hematochezia')) s.score+=2;
    }
    if(n.includes('reten')){
      if(patSex==='M'&&patAge===3) s.score+=3;
      if(assocSymptoms.has('dysuria')) s.score+=1;
    }
    if(n.includes('perfura')||n.includes('rotura')){
      if(painOnset==='sudden') s.score+=3;
    }
    if(n.includes('infarto espl')){
      if(specificSigns.has('kehr')) s.score+=3;
    }
    if(n.includes('intussus')){
      if(patAge===0) s.score+=3;
      if(painQuality.has('colicky')&&assocSymptoms.has('hematochezia')) s.score+=4;
    }
  }

  if(patSex==='M'){
    scored=scored.filter(d=>{
      const dl=d.name.toLowerCase();
      return !['ect\u00F3pica','tor\u00E7\u00E3o de ov\u00E1rio','dip','endometriose','fitz-hugh'].some(g=>dl.includes(g));
    });
  }
  if(patSex==='F'){
    scored=scored.filter(d=>!d.name.toLowerCase().includes('prostatite'));
  }

  if(patAge===0){
    scored.forEach(d=>{
      const dl=d.name.toLowerCase();
      if(dl.includes('aneurisma')||dl.includes('aaa')) d.score-=3;
      if(dl.includes('diverticulite')) d.score-=3;
      if(dl.includes('iam')) d.score-=4;
      if(dl.includes('isquemia mesent')) d.score-=3;
      if(dl.includes('linfadenite')) d.score+=2;
    });
  }
  if(patAge===3){
    scored.forEach(d=>{
      const dl=d.name.toLowerCase();
      if(dl.includes('isquemia')||dl.includes('aneurisma')||dl.includes('aaa')) d.score+=2;
      if(dl.includes('linfadenite')) d.score-=2;
    });
  }

  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,7);
}

// =============================================
// WORKUP
// =============================================
function buildWorkup(){
  const risk=getRiskLevel();
  const urgent=[],routine=[];

  routine.push('Hemograma completo','PCR','Ureia / Creatinina','Eletrólitos (Na, K, Mg)');

  if(risk==='surgical'||risk==='urgent'){
    urgent.push('Tipo sanguíneo + Reserva','Lactato','Gasometria arterial');
  }

  if(painLocation==='ruq'||assocSymptoms.has('jaundice')){
    routine.push('TGO / TGP / FA / GGT','Bilirrubinas');
    urgent.push('USG de abdome superior');
  }
  if(painLocation==='epigastric'||painLocation==='ruq'||painLocation==='diffuse') routine.push('Amilase / Lipase');
  if((painLocation==='rlq'||painLocation==='llq'||painLocation==='periumbilical')&&risk!=='low') urgent.push('TC de abdome com contraste');
  if(painLocation==='flank_r'||painLocation==='flank_l'){
    routine.push('EAS / Urina tipo I');
    if(painQuality.has('colicky')||assocSymptoms.has('hematuria')) urgent.push('TC de abdome sem contraste (protocolo litíase)');
    else urgent.push('USG de vias urinárias');
  }
  if(painLocation==='suprapubic'||assocSymptoms.has('dysuria')||assocSymptoms.has('hematuria')){
    routine.push('EAS / Urina tipo I','Urocultura');
  }
  if(isPregnancyPossible()){
    urgent.push('Beta-hCG quantitativo');
    if(assocSymptoms.has('vaginal_bleeding')||vitalSigns.has('hypotension')||assocSymptoms.has('syncope')) urgent.push('USG transvaginal');
  }
  if(patSex==='F'&&lmpStatus!=='na'&&lmpStatus!=='possible'&&patAge!==0&&patAge!==null) routine.push('Beta-hCG (se idade fértil)');
  if(patSex==='F'&&assocSymptoms.has('amenorrhea')&&lmpStatus!=='na') urgent.push('Beta-hCG quantitativo');
  if(assocSymptoms.has('constipation')||peritonealSigns.has('absent_bs')||assocSymptoms.has('distension')||peritonealSigns.has('visible_distension')) urgent.push('Rx abdome (3 incidências)');
  if(assocSymptoms.has('hematemesis')) urgent.push('EDA de urgência');
  if(assocSymptoms.has('hematochezia')) routine.push('Colonoscopia (programar)');
  if((assocSymptoms.has('hematochezia')||assocSymptoms.has('hematemesis'))&&(vitalSigns.has('tachycardia')||vitalSigns.has('hypotension'))){
    urgent.push('Hemotransfusão se Hb baixa');
  }
  if(painLocation==='diffuse'){
    urgent.push('TC de abdome com contraste');
    routine.push('TGO / TGP / FA / GGT');
  }
  if(vitalSigns.has('hypotension')) urgent.push('Acesso venoso calibroso x2','Reposição volêmica agressiva');
  if(assocSymptoms.has('fever')) routine.push('Hemoculturas (2 pares)');
  if(pastHistory.has('anticoag')) urgent.push('Coagulograma (TAP/INR + TTPA)');
  if(pastHistory.has('diabetes')){
    routine.push('Glicemia','HbA1c');
    if(painLocation==='diffuse'||vitalSigns.has('tachypnea')) routine.push('Cetonúria / Cetonemia');
  }
  if(painLocation==='epigastric'&&patAge!==null&&patAge>=2) routine.push('ECG (excluir IAM inferior)');
  if(assocSymptoms.has('chest_pain')) urgent.push('ECG 12 derivações','Troponina');
  if(vitalSigns.has('tachypnea')||vitalSigns.has('sat_low')) urgent.push('Rx de tórax');
  if(pastHistory.has('liver_disease')) routine.push('Albumina','Coagulograma (TAP/INR + TTPA)');
  if(patAge===3&&(painLocation==='diffuse'||painLocation==='periumbilical')&&painIntensity===2) urgent.push('Angio-TC de abdome');
  if(pastHistory.has('immunosupp')||pastHistory.has('transplant')) routine.push('Procalcitonina');

  // Dedupe preserving order; urgent takes precedence
  const uSet=new Set(),rSet=new Set();
  const uFinal=[],rFinal=[];
  for(const u of urgent) if(!uSet.has(u)){uSet.add(u);uFinal.push(u);}
  for(const r of routine) if(!rSet.has(r)&&!uSet.has(r)){rSet.add(r);rFinal.push(r);}
  return {urgent:uFinal,routine:rFinal};
}

// =============================================
// ANALGESIA PROTOCOL
// =============================================
function buildAnalgesiaProtocol(){
  const steps=[];
  const renalInsuff=pastHistory.has('renal_insuff');
  const giBleed=assocSymptoms.has('hematemesis')||assocSymptoms.has('hematochezia');
  const isChild=patAge===0;
  const isElderly=patAge===3;
  const ciReason=giBleed?'sangramento GI':'insuficiência renal';

  if(painIntensity===0){
    steps.push({n:'1',text:isChild?'Dipirona 15 mg/kg EV ou Paracetamol 15 mg/kg VO':'Dipirona 1g EV ou Paracetamol 750mg VO'});
    steps.push({n:'2',text:'Hioscina (Buscopan\u00AE) 20mg EV se cólica'});
    steps.push({n:'R',text:'Reavaliar dor em 30\u201360 min'});
  } else if(painIntensity===1){
    if(renalInsuff||giBleed) steps.push({n:'1',text:'Dipirona 1g EV (evitar AINEs \u2014 '+ciReason+')'});
    else if(isChild) steps.push({n:'1',text:'Dipirona 15 mg/kg EV + Ibuprofeno 10 mg/kg VO (se > 6 meses)'});
    else if(isElderly) steps.push({n:'1',text:'Dipirona 1g EV (cautela com AINEs em idoso)'});
    else steps.push({n:'1',text:'Dipirona 1g EV + Cetoprofeno 100mg EV (ou Tenoxicam 20mg EV)'});
    steps.push({n:'2',text:'Hioscina 20mg EV se componente cólico'});
    steps.push({n:'3',text:isChild?'Se sem melhora: Tramadol 1\u20132 mg/kg EV (> 12 anos) ou Morfina 0,1 mg/kg EV':'Se sem melhora: Tramadol 50\u2013100mg EV diluído'});
    steps.push({n:'R',text:'Reavaliar dor em 30 min'});
  } else {
    if(renalInsuff||giBleed) steps.push({n:'1',text:'Dipirona 2g EV (evitar AINEs \u2014 '+ciReason+')'});
    else if(isChild) steps.push({n:'1',text:'Dipirona 15\u201325 mg/kg EV'});
    else steps.push({n:'1',text:'Dipirona 2g EV + Cetoprofeno 100mg EV'});
    if(isChild) steps.push({n:'2',text:'Morfina 0,1\u20130,2 mg/kg EV (titular a cada 5 min)'});
    else if(isElderly) steps.push({n:'2',text:'Morfina 1\u20132mg EV (titular com cautela a cada 5\u201310 min)'});
    else steps.push({n:'2',text:'Morfina 2\u20134mg EV (titular a cada 5 min até alívio)'});
    steps.push({n:'3',text:'Ondansetrona 4mg EV se náuseas com opioide'});
    steps.push({n:'!',text:'NÃO retardar analgesia por avaliação cirúrgica'});
    steps.push({n:'R',text:'Reavaliar dor a cada 15\u201330 min'});
  }
  if(pastHistory.has('nsaid')&&!giBleed) steps.push({n:'!',text:'Cautela com AINEs \u2014 uso crônico relatado'});
  if(pastHistory.has('liver_disease')) steps.push({n:'!',text:'Cautela com Paracetamol \u2014 hepatopatia crônica'});
  if(giBleed) steps.push({n:'!',text:'AINEs CONTRAINDICADOS \u2014 sangramento GI'});
  if(isChild) steps.push({n:'!',text:'Doses pediátricas \u2014 calcular pelo peso exato'});
  if(isElderly&&!renalInsuff) steps.push({n:'!',text:'Idoso \u2014 iniciar com doses menores e titular'});
  if(renalInsuff) steps.push({n:'!',text:'Ajustar opioides e evitar AINEs \u2014 insuficiência renal'});
  return steps;
}

// =============================================
// PROGRESS BAR
// =============================================
function progHTML(idx,allDone){
  let h='<div class="progress-bar">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const done=allDone||i<idx;
    const c=done?'done':i===idx?'active':'';
    const canNav=(!allDone&&i<idx)||allDone;
    const clk=canNav?'clickable':'';
    h+=`<div class="progress-step ${c} ${clk}" role="button" tabindex="${canNav?'0':'-1'}" aria-label="Etapa ${i+1}: ${STEP_LABELS[i]}"${canNav?` onclick="goToStep(${i})"`:''}></div>`;
  }
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const done=allDone||i<idx;
    const c=done?'done-label':i===idx?'active-label':'';
    const canNav=(!allDone&&i<idx)||allDone;
    const clk=canNav?'clickable':'';
    h+=`<span class="${c} ${clk}"${canNav?` onclick="goToStep(${i})"`:''}>${STEP_LABELS[i]}</span>`;
  }
  h+='</div>';
  return h;
}

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id,title,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')" role="button" tabindex="0" aria-expanded="${open}" aria-label="${title}">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">&#x25BC;</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.7rem':'0'}">`;
  if(open) h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  if(step===0) renderPatient();
  else if(step===1) renderLocation();
  else if(step===2) renderCharacteristics();
  else if(step===3) renderSymptoms();
  else if(step===4) renderExam();
  else if(step===5) renderScores();
  else renderResult();
}

function requestRestart(){
  if(window.confirm('Recomeçar avaliação? Todos os dados preenchidos serão perdidos.')){
    step=0;painLocation=null;painOnset=null;
    painQuality=new Set();painRadiation=new Set();
    aggravating=new Set();relieving=new Set();
    assocSymptoms=new Set();peritonealSigns=new Set();
    specificSigns=new Set();vitalSigns=new Set();pastHistory=new Set();
    patAge=null;patSex=null;lmpStatus=null;
    painDuration=null;painIntensity=null;
    activeScoreTab='alvarado';
    alvaradoState={};ransonAdmitState={};ranson48hState={};bisapState={};
    sections={summary:true,ddx:true,scores:true,workup:true,conduta:true,analgesia:false,note:false};

  for(const s of ordered){
    const ck=specificSigns.has(s.id);
    const rel=relevantIds.has(s.id)?'relevant':'';
    h+=`<button class="check-btn ${ck?'checked':''} ${rel}" onclick="toggleSet('specificSigns','${s.id}')" role="checkbox" aria-checked="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${s.label}</span><span class="sign-hint">${s.hint}</span></button>`;

function getRelevantSignIds(){
  const baseMap={
    ruq:['murphy'],
    rlq:['mcburney','rovsing','psoas','obturator','blumberg','dunphy'],
    llq:['blumberg'],
    epigastric:['carnett'],
    periumbilical:['mcburney','carnett'],
    flank_r:['giordano'],
    flank_l:['giordano'],
    suprapubic:['blumberg'],
    luq:['kehr'],
    diffuse:['blumberg','cullen','grey_turner','dunphy'],
  };
  const ids=[...(baseMap[painLocation]||[])];
  if(painRadiation.has('back')&&(painLocation==='epigastric'||painLocation==='diffuse')){
    if(!ids.includes('cullen')) ids.push('cullen');
    if(!ids.includes('grey_turner')) ids.push('grey_turner');
  }
  if(painRadiation.has('shoulder_l')&&!ids.includes('kehr')) ids.push('kehr');
  if(!ids.includes('carnett')) ids.push('carnett');
  if(peritonealSigns.has('rebound')&&!ids.includes('dunphy')) ids.push('dunphy');
  return ids;
}

  const showPancreatitis=(painLocation==='epigastric'||painLocation==='diffuse'||painRadiation.has('back'));

  else if(showPancreatitis&&!showAlvarado&&activeScoreTab==='alvarado') activeScoreTab='bisap';

  const alvFilled=ALVARADO.filter(i=>autoAlvarado()[i.id]!==undefined||alvaradoState[i.id]!==undefined).length;
  const ranFilled=RANSON_ADMIT.filter(i=>autoRansonAdmit()[i.id]!==undefined||ransonAdmitState[i.id]!==undefined).length;
  const bisapFilled=BISAP.filter(i=>autoBISAP()[i.id]!==undefined||bisapState[i.id]!==undefined).length;

  h+='<div class="score-tabs">';
  h+=`<button class="score-tab ${activeScoreTab==='alvarado'?'active':''} ${showAlvarado?'suggested':''}" onclick="switchTab('alvarado')">Alvarado${alvFilled===ALVARADO.length?'<span class="tab-check">\u2713</span>':''}</button>`;
  h+=`<button class="score-tab ${activeScoreTab==='ranson'?'active':''} ${showPancreatitis?'suggested':''}" onclick="switchTab('ranson')">Ranson${ranFilled===RANSON_ADMIT.length?'<span class="tab-check">\u2713</span>':''}</button>`;
  h+=`<button class="score-tab ${activeScoreTab==='bisap'?'active':''} ${showPancreatitis?'suggested':''}" onclick="switchTab('bisap')">BISAP${bisapFilled===BISAP.length?'<span class="tab-check">\u2713</span>':''}</button>`;
  h+='</div>';

  if(activeScoreTab==='alvarado') h+=buildAlvarado();

  else h+=buildBISAP();

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Resultado</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function scoreRowHTML(item,auto,state,setter){
  const val=auto[item.id]!==undefined?auto[item.id]:state[item.id];
  const isAuto=auto[item.id]!==undefined&&state[item.id]===undefined;
  const pts=item.pts>1?`${item.pts} pts`:'1 pt';
  return `<div class="score-row"><div class="score-row-label"><span>${item.label}</span>${isAuto?'<span class="auto-tag">Auto</span>':''}</div>`
    +'<div class="score-options">'
    +`<button class="score-opt ${val===0?'picked':''}" onclick="${setter}('${item.id}',0)">Não<span class="pts">0 pt</span></button>`
    +`<button class="score-opt ${val===1?'picked':''}" onclick="${setter}('${item.id}',1)">Sim<span class="pts">${pts}</span></button>`
    +'</div></div>';
}

function buildAlvarado(){
  const auto=autoAlvarado();
  let h='<p class="score-intro">Alvarado (MANTRELS) &mdash; apendicite aguda. Campos <span class="auto-tag">Auto</span> são alteráveis.</p>';
  for(const item of ALVARADO) h+=scoreRowHTML(item,auto,alvaradoState,'setAlvarado');
  const total=getAlvaradoScore();
  if(total!==null){
    let sc,sl,sd;
    if(total<=4){sc='sr-low';sl='Baixa probabilidade';sd=`Alvarado ${total}/10 \u2014 Apendicite improvável.`;}
    else if(total<=6){sc='sr-mod';sl='Probabilidade intermediária';sd=`Alvarado ${total}/10 \u2014 Observação + imagem. Reavaliar em 6\u201312h.`;}
    else if(total<=8){sc='sr-mod';sl='Alta probabilidade';sd=`Alvarado ${total}/10 \u2014 TC e/ou avaliação cirúrgica.`;}
    else{sc='sr-high';sl='Muito alta probabilidade';sd=`Alvarado ${total}/10 \u2014 Avaliação cirúrgica imediata.`;}
    h+=`<div class="score-result ${sc}"><div class="score-num">${total}</div><div class="score-info"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    const filled=ALVARADO.filter(i=>auto[i.id]!==undefined||alvaradoState[i.id]!==undefined).length;
    h+=`<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Preencha (${filled}/${ALVARADO.length})</div><div class="score-detail">Campos Auto já vieram das etapas anteriores.</div></div></div>`;
  }
  return h;
}

function buildRanson(){
  const autoR=autoRansonAdmit();
  let h='<p class="score-intro">Ranson &mdash; gravidade de pancreatite. 48h opcional no PS.</p>';
  h+='<div class="score-phase">Na admissão</div>';
  for(const item of RANSON_ADMIT) h+=scoreRowHTML(item,autoR,ransonAdmitState,'setRansonAdmit');
  h+='<div class="score-phase second">Após 48h (opcional)</div>';
  for(const item of RANSON_48H) h+=scoreRowHTML(item,{},ranson48hState,'setRanson48');
  const ranDisplay=getRansonDisplay();
  if(ranDisplay!==null){
    let sc,sl,sd;
    const maxLabel=ranDisplay.partial?'5 (admissão)':'11';
    if(ranDisplay.score<=2){sc='sr-low';sl='Pancreatite leve';sd=`Ranson ${ranDisplay.score}/${maxLabel} \u2014 Mortalidade < 5%.`;}
    else if(ranDisplay.score<=4){sc='sr-mod';sl='Pancreatite moderada';sd=`Ranson ${ranDisplay.score}/${maxLabel} \u2014 Mortalidade ~15\u201320%. Considerar UTI.`;}
    else if(ranDisplay.score<=6){sc='sr-high';sl='Pancreatite grave';sd=`Ranson ${ranDisplay.score}/${maxLabel} \u2014 Mortalidade ~40%. UTI obrigatória.`;}
    else{sc='sr-high';sl='Pancreatite muito grave';sd=`Ranson ${ranDisplay.score}/${maxLabel} \u2014 Mortalidade > 99%.`;}
    const partial=ranDisplay.partial?' (admissão)':'';
    h+=`<div class="score-result ${sc}"><div class="score-num">${ranDisplay.score}</div><div class="score-info"><div class="score-label">${sl}${partial}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    const filled=RANSON_ADMIT.filter(i=>autoR[i.id]!==undefined||ransonAdmitState[i.id]!==undefined).length;
    h+=`<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Preencha admissão (${filled}/${RANSON_ADMIT.length})</div><div class="score-detail">Critérios 48h opcionais.</div></div></div>`;
  }
  return h;
}

function buildBISAP(){
  const auto=autoBISAP();
  let h='<p class="score-intro">BISAP &mdash; Bedside Index for Severity in Acute Pancreatitis. Prático nas primeiras 24h.</p>';
  for(const item of BISAP) h+=scoreRowHTML(item,auto,bisapState,'setBISAP');
  const total=getBISAPScore();
  if(total!==null){
    let sc,sl,sd;
    if(total<=1){sc='sr-low';sl='Baixo risco';sd=`BISAP ${total}/5 \u2014 Mortalidade < 2%.`;}
    else if(total===2){sc='sr-mod';sl='Risco intermediário';sd=`BISAP ${total}/5 \u2014 Mortalidade ~5\u201310%. Considerar UTI.`;}
    else if(total===3){sc='sr-mod';sl='Alto risco';sd=`BISAP ${total}/5 \u2014 Mortalidade ~15\u201320%. UTI.`;}
    else{sc='sr-high';sl='Muito alto risco';sd=`BISAP ${total}/5 \u2014 Mortalidade > 22%. UTI obrigatória.`;}
    h+=`<div class="score-result ${sc}"><div class="score-num">${total}</div><div class="score-info"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    const filled=BISAP.filter(i=>auto[i.id]!==undefined||bisapState[i.id]!==undefined).length;
    h+=`<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Preencha (${filled}/${BISAP.length})</div><div class="score-detail">Calculável nas primeiras 24h.</div></div></div>`;
  }
  return h;
}

// =============================================
// RESULT
// =============================================
function renderResult(){
  const risk=getRiskInfo();
  const ddx=buildDifferentials();
  const workup=buildWorkup();
  const flags=getRedFlags();

  if((risk.level==='surgical'||risk.level==='urgent')&&!analgesiaAutoExpanded&&painIntensity!==null){
    sections.analgesia=true;
    analgesiaAutoExpanded=true;
  }

  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  h+=`<div class="result-plate ${risk.badge}">${risk.initial}</div>`;
  h+=`<div class="result-title">${risk.title}</div>`;
  h+=`<div class="result-desc">${risk.desc}</div>`;

  const locLabel=labelById(LOCATIONS,painLocation);
  const sexLabel=patSex==='M'?'M':'F';
  const ageLabel=AGE_LABELS[patAge]||'';
  const durLabel=DUR_LABELS[painDuration]||'';
  h+=`<p class="patient-line">${sexLabel} &middot; ${ageLabel}a &middot; ${locLabel} &middot; ${durLabel}</p>`;

  if(flags.length>0){
    h+='<div class="red-flag" style="text-align:left;margin-bottom:1rem"><strong>Sinais de alarme &middot; '+flags.length+'</strong>';
    h+=flags.map(f=>'&bull; '+f).join('<br>');
    h+='</div>';
  }

  // Summary
  h+=collapsible('summary','Resumo da avaliação',()=>{
    const onsetLabel=labelById(PAIN_ONSET,painOnset);
    const qualLabels=labelsFromSet(PAIN_QUALITY,painQuality);
    const radLabels=labelsFromSet(PAIN_RADIATION,painRadiation);
    const aggLabels=labelsFromSet(AGGRAVATING,aggravating);
    const relLabels=labelsFromSet(RELIEVING,relieving);
    const periLabels=labelsFromSet(PERITONEAL_SIGNS,peritonealSigns);
    const specLabels=labelsFromSet(SPECIFIC_SIGNS,specificSigns);
    const vsLabels=labelsFromSet(VITAL_SIGNS_OPTS,vitalSigns);
    const symLabels=labelsFromSet(ASSOC_SYMPTOMS,assocSymptoms);
    const histLabels=labelsFromSet(PAST_HISTORY,pastHistory);
    const intLabel=INT_LABELS[painIntensity]||'N/A';
    let s='';
    s+=`<div class="summary-row"><span class="criteria">Localização</span><span class="value">${locLabel}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Início</span><span class="value">${onsetLabel}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Qualidade</span><span class="value">${qualLabels.length?qualLabels.join(', '):'N/A'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Irradiação</span><span class="value">${radLabels.length?radLabels.join(', '):'Sem'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Intensidade</span><span class="value">${intLabel}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Duração</span><span class="value">${durLabel}</span></div>`;
    if(aggLabels.length) s+=`<div class="summary-row"><span class="criteria">Piora</span><span class="value">${aggLabels.join(', ')}</span></div>`;
    if(relLabels.length) s+=`<div class="summary-row"><span class="criteria">Melhora</span><span class="value">${relLabels.join(', ')}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Peritoneais</span><span class="value">${periLabels.length?'<span class="dot dot-red"></span> '+periLabels.join(', '):'<span class="dot dot-green"></span> Ausentes'}</span></div>`;
    if(specLabels.length) s+=`<div class="summary-row"><span class="criteria">Específicos</span><span class="value">${specLabels.join(', ')}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Vitais</span><span class="value">${vsLabels.length?'<span class="dot dot-yellow"></span> '+vsLabels.join(', '):'<span class="dot dot-green"></span> Estáveis'}</span></div>`;
    if(symLabels.length) s+=`<div class="summary-row"><span class="criteria">Sintomas</span><span class="value">${symLabels.join(', ')}</span></div>`;
    if(histLabels.length) s+=`<div class="summary-row"><span class="criteria">Antecedentes</span><span class="value">${histLabels.join(', ')}</span></div>`;
    if(patSex==='F'&&lmpStatus){
      const lmpLabel={possible:'Possível',unlikely:'Improvável',na:'Pós-menopausa'}[lmpStatus];
      s+=`<div class="summary-row"><span class="criteria">Gravidez</span><span class="value">${lmpLabel}</span></div>`;
    }
    return s;
  });

  // DDx
  h+=collapsible('ddx','Diagnósticos diferenciais',()=>{
    let s='<div class="dx-list">';
    ddx.forEach((d,i)=>{
      const probCls=i===0?'prob-high':i<3?'prob-mod':'prob-low';
      const probLabel=i===0?'Mais provável':i<3?'Provável':'Considerar';
      s+=`<div class="dx-item"><span class="dx-rank">#${i+1}</span><span class="dx-name">${d.name}</span><span class="dx-prob ${probCls}">${probLabel}</span></div>`;
    });
    s+='</div>';
    return s;
  });

  // Scores — only show if at least one is filled
  const alvScoreVal=getAlvaradoScore();
  const ranDisplayVal=getRansonDisplay();
  const bisapScoreVal=getBISAPScore();
  if(alvScoreVal!==null||ranDisplayVal!==null||bisapScoreVal!==null){
    h+=collapsible('scores','Scores de risco',()=>{
      let s='';
      if(alvScoreVal!==null){
        const sc=alvScoreVal<=4?'sr-low':alvScoreVal<=8?'sr-mod':'sr-high';
        const sl=alvScoreVal<=4?'Baixa probabilidade':alvScoreVal<=6?'Probabilidade intermediária':alvScoreVal<=8?'Alta probabilidade':'Muito alta';
        s+=`<div class="score-result ${sc}"><div class="score-num">${alvScoreVal}</div><div class="score-info"><div class="score-label">Alvarado &mdash; ${sl}</div><div class="score-detail">${alvScoreVal}/10 para apendicite</div></div></div>`;
      }
      if(ranDisplayVal!==null){
        const sc=ranDisplayVal.score<=2?'sr-low':ranDisplayVal.score<=4?'sr-mod':'sr-high';
        const sl=ranDisplayVal.score<=2?'Pancreatite leve':ranDisplayVal.score<=4?'Pancreatite moderada':'Pancreatite grave';
        const partial=ranDisplayVal.partial?' (admissão)':'';
        const maxLabel=ranDisplayVal.partial?'5':'11';
        s+=`<div class="score-result ${sc}" style="margin-top:.5rem"><div class="score-num">${ranDisplayVal.score}</div><div class="score-info"><div class="score-label">Ranson${partial} &mdash; ${sl}</div><div class="score-detail">${ranDisplayVal.score}/${maxLabel} para pancreatite</div></div></div>`;
      }
      if(bisapScoreVal!==null){
        const sc=bisapScoreVal<=1?'sr-low':bisapScoreVal<=2?'sr-mod':'sr-high';
        const sl=bisapScoreVal<=1?'Baixo risco':bisapScoreVal<=2?'Intermediário':'Alto risco';
        s+=`<div class="score-result ${sc}" style="margin-top:.5rem"><div class="score-num">${bisapScoreVal}</div><div class="score-info"><div class="score-label">BISAP &mdash; ${sl}</div><div class="score-detail">${bisapScoreVal}/5 para pancreatite</div></div></div>`;
      }
      return s;
    });
  }

  // Workup
  h+=collapsible('workup','Propedêutica sugerida',()=>{
    let s='';
    if(workup.urgent.length){
      s+='<div class="workup-section"><div class="workup-heading urgent-h">Urgente</div><div class="workup-tags">';
      for(const w of workup.urgent) s+=`<span class="workup-tag urgent">${w}</span>`;
      s+='</div></div>';
    }
    if(workup.routine.length){
      s+='<div class="workup-section"><div class="workup-heading routine-h">Rotina</div><div class="workup-tags">';
      for(const w of workup.routine) s+=`<span class="workup-tag routine">${w}</span>`;
      s+='</div></div>';
    }
    return s;
  });

  // Conduta
  h+=buildCondutaSection(risk);

  // Analgesia
  if(painIntensity!==null){
    h+=collapsible('analgesia','Protocolo de analgesia',()=>{
      const protocol=buildAnalgesiaProtocol();
      let s='<div class="analgesia-box"><h4>'+['Dor Leve','Dor Moderada','Dor Intensa'][painIntensity]+'</h4>';
      for(const st of protocol){
        const isWarning=st.n==='!';
        s+=`<div class="analgesia-step"><span class="step-marker ${isWarning?'warn':''}">${st.n}</span><span>${st.text}</span></div>`;
      }
      s+='</div>';
      s+='<p class="score-footnote">'+(patAge===0?'Doses pediátricas &mdash; calcular pelo peso.':'Doses para adultos. Ajustar conforme função renal/hepática.')+'</p>';
      return s;
    });
  }

  // Note
  h+=collapsible('note','Nota para prontuário',()=>buildNoteContent(risk,ddx,workup));

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="requestRestart()">Recomeçar</button>';
  h+='</div></div>';

  h+='<p class="disclaimer">Ferramenta de apoio à decisão clínica. Não substitui o julgamento médico.</p>';

  app.innerHTML=h;
}

// =============================================
// CONDUTA
// =============================================
function buildCondutaSection(risk){
  let cls,title,items;
  if(risk.level==='surgical'){
    cls='alta-prob';title='Abdome cirúrgico \u2014 Intervenção urgente';
    items=[
      'Avaliação cirúrgica IMEDIATA',
      'Acesso venoso calibroso x2 + Reposição volêmica agressiva',
      'Tipo sanguíneo + Reserva de hemocomponentes',
      'Exames pré-op: hemograma, coagulograma, função renal, ECG',
      'Sonda nasogástrica se obstrução / vômitos',
      'Antibiótico empírico se peritonite (ex: Ceftriaxona + Metronidazol)',
      'Manter paciente em JEJUM',
      'Comunicar centro cirúrgico e anestesiologia',
      'Reservar vaga em UTI no pós-operatório',
    ];
  } else if(risk.level==='urgent'){
    cls='mod-prob';title='Urgência \u2014 Investigação rápida';
    items=[
      'Exames laboratoriais STAT',
      'Imagem direcionada (TC/USG) conforme suspeita',
      'Acesso venoso periférico + Hidratação EV',
      'Analgesia (NÃO retardar pela avaliação cirúrgica)',
      'Reavaliação seriada a cada 2\u20134h com exame físico',
      'Manter paciente em jejum até definição diagnóstica',
      'Considerar interconsulta precoce (cirurgia / gastro / GO)',
    ];
    if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')) items.push('Colangite: iniciar antibiótico empírico (Ciprofloxacino + Metronidazol ou Pipe/Tazo)');
    if(isPregnancyPossible()) items.push('Confirmar/excluir gravidez antes de radiação ou medicação teratogênica');
  } else if(risk.level==='medical'){
    cls='neutra-prob';title='Investigar \u2014 Manejo clínico';
    items=[
      'Exames laboratoriais direcionados',
      'Imagem conforme hipótese diagnóstica principal',
      'Analgesia + Sintomáticos (antieméticos, IBP se indicado)',
      'Reavaliação clínica em 4\u20136h',
      'Avaliar alta com orientações se melhora clínica',
      'Orientar sinais de alarme para retorno ao PS',
    ];
  } else {
    cls='baixa-prob';title='Baixo risco \u2014 Observação';
    items=[
      'Exames básicos se clinicamente indicado',
      'Sintomáticos (analgesia simples, hidratação oral)',
      'Considerar alta com retorno se piora',
      'Orientar sinais de alarme: febre, vômitos persistentes, piora da dor, sangramento',
      'Encaminhamento ambulatorial se dor recorrente',
    ];
    if(patAge===3||pastHistory.has('immunosupp')||pastHistory.has('transplant')) items.push('Paciente de risco \u2014 período de observação mais longo antes da alta');
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${cls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')" role="button" tabindex="0" aria-expanded="${open}"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">&#x25BC;</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.65rem':'0'}">`;
  if(open) for(const text of items) h+=`<div class="conduta-item"><span class="conduta-bul"></span><span>${text}</span></div>`;
  h+='</div></div>';
  return h;
}

// =============================================
// CLINICAL NOTE
// =============================================
function buildNoteContent(risk,ddx,workup){
  const pad=n=>String(n).padStart(2,'0');
  const now=evalStartTime;
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const locLabel=labelById(LOCATIONS,painLocation);
  const onsetLabel=labelById(PAIN_ONSET,painOnset);
  const qualLabels=labelsFromSet(PAIN_QUALITY,painQuality);
  const radLabels=labelsFromSet(PAIN_RADIATION,painRadiation);
  const intLabel=['Leve (1-3)','Moderada (4-6)','Intensa (7-10)'][painIntensity]||'N/A';
  const durLabel=['< 6 horas','6-24 horas','24-72 horas','> 72 horas'][painDuration]||'';
  const aggLabels=labelsFromSet(AGGRAVATING,aggravating);
  const relLabels=labelsFromSet(RELIEVING,relieving);
  const symLabels=labelsFromSet(ASSOC_SYMPTOMS,assocSymptoms);
  const periLabels=labelsFromSet(PERITONEAL_SIGNS,peritonealSigns);
  const specLabels=labelsFromSet(SPECIFIC_SIGNS,specificSigns);
  const vsLabels=labelsFromSet(VITAL_SIGNS_OPTS,vitalSigns);
  const histLabels=labelsFromSet(PAST_HISTORY,pastHistory);

  let n='';
  n+=`DOR ABDOMINAL - AVALIAÇÃO NO PS\n`;
  n+=`Data/hora: ${ts}\n`;
  n+=`----------------------------------------\n\n`;
  n+=`PACIENTE: ${patSex==='M'?'Masculino':'Feminino'}, ${AGE_LABELS[patAge]} anos\n`;
  if(patSex==='F'&&lmpStatus){
    const lmpLabel={possible:'Possibilidade de gravidez',unlikely:'Gravidez improvável',na:'Pós-menopausa'}[lmpStatus];
    n+=`Status gestacional: ${lmpLabel}\n`;
  }
  n+=`Duração do quadro: ${durLabel}\n`;
  if(histLabels.length) n+=`Antecedentes: ${histLabels.join(', ')}\n`;
  n+='\n';

  n+=`HISTÓRIA DA DOR\n`;
  n+=`  Localização: ${locLabel}\n`;
  n+=`  Início: ${onsetLabel}\n`;
  n+=`  Qualidade: ${qualLabels.length?qualLabels.join(', '):'Não especificada'}\n`;
  n+=`  Irradiação: ${radLabels.length?radLabels.join(', '):'Sem irradiação'}\n`;
  n+=`  Intensidade: ${intLabel}\n`;
  if(aggLabels.length) n+=`  Piora com: ${aggLabels.join(', ')}\n`;
  if(relLabels.length) n+=`  Melhora com: ${relLabels.join(', ')}\n`;
  n+='\n';

  n+=`SINTOMAS ASSOCIADOS\n`;
  n+=`  ${symLabels.length?symLabels.join(', '):'Nenhum relatado'}\n\n`;

  n+=`EXAME FÍSICO\n`;
  n+=`  Sinais vitais: ${vsLabels.length?vsLabels.join(', '):'Estáveis'}\n`;
  n+=`  Sinais peritoneais: ${periLabels.length?periLabels.join(', '):'Ausentes'}\n`;
  if(specLabels.length) n+=`  Sinais específicos: ${specLabels.join(', ')}\n`;
  n+='\n';

  n+=`ESTRATIFICAÇÃO: ${risk.title}\n`;
  n+=`  ${risk.desc}\n\n`;

  const flags=getRedFlags();
  if(flags.length){
    n+=`SINAIS DE ALARME\n`;
    flags.forEach(f=>{n+=`  - ${f}\n`;});
    n+='\n';
  }

  n+=`DIAGNÓSTICOS DIFERENCIAIS\n`;
  ddx.forEach((d,i)=>{n+=`  ${i+1}. ${d.name}\n`;});
  n+='\n';

  const alvScore=getAlvaradoScore();
  const ranDisplay=getRansonDisplay();
  const bisapScore=getBISAPScore();
  if(alvScore!==null||ranDisplay!==null||bisapScore!==null){
    n+=`SCORES CLÍNICOS\n`;
    if(alvScore!==null){
      const alvRisk=alvScore<=4?'Baixa':alvScore<=6?'Intermediária':alvScore<=8?'Alta':'Muito alta';
      n+=`  Alvarado: ${alvScore}/10 - ${alvRisk}\n`;
    }
    if(ranDisplay!==null){
      const rRisk=ranDisplay.score<=2?'Leve':ranDisplay.score<=4?'Moderada':ranDisplay.score<=6?'Grave':'Muito grave';
      const partial=ranDisplay.partial?' (admissão)':'';
      const maxLabel=ranDisplay.partial?'5':'11';
      n+=`  Ranson${partial}: ${ranDisplay.score}/${maxLabel} - ${rRisk}\n`;
    }
    if(bisapScore!==null){
      const bRisk=bisapScore<=1?'Baixo':bisapScore<=2?'Intermediário':bisapScore<=3?'Alto':'Muito alto';
      n+=`  BISAP: ${bisapScore}/5 - ${bRisk}\n`;
    }
    n+='\n';
  }

  n+=`PROPEDÊUTICA SUGERIDA\n`;
  if(workup.urgent.length) n+=`  Urgente: ${workup.urgent.join(', ')}\n`;
  if(workup.routine.length) n+=`  Rotina: ${workup.routine.join(', ')}\n`;
  n+='\n';

  if(painIntensity!==null){
    const protocol=buildAnalgesiaProtocol();
    n+=`ANALGESIA\n`;
    protocol.forEach(st=>{n+=`  ${st.n}. ${st.text}\n`;});
  }

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()" aria-label="Copiar nota">Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  const text=el.textContent||el.innerText;
  const done=()=>{
    const btn=document.getElementById('copyBtn');
    if(!btn) return;
    btn.textContent='\u2713 Copiado';btn.classList.add('copied');
    setTimeout(()=>{if(btn){btn.textContent='Copiar nota';btn.classList.remove('copied');}},2000);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else {
    fallbackCopy(text,done);
  }
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(ta);
  ta.focus();ta.select();
  try{document.execCommand('copy');done();}catch(e){alert('Não foi possível copiar.');}
  document.body.removeChild(ta);
}

// =============================================
// ACTIONS
// =============================================
function setLocation(id){painLocation=id;render();}
function setPainOnset(id){painOnset=id;render();}
function setPainIntensity(v){painIntensity=v;render();}
function toggleSet(setName,id){
  const sets={painQuality,painRadiation,aggravating,relieving,assocSymptoms,peritonealSigns,specificSigns,vitalSigns,pastHistory};
  const s=sets[setName];
  if(!s) return;
  if(s.has(id)) s.delete(id); else s.add(id);
  render();
}
function setPatField(field,val){
  if(field==='patAge') patAge=val;
  else if(field==='patSex'){patSex=val;if(val==='M') lmpStatus=null;}
  else if(field==='lmpStatus') lmpStatus=val;
  else if(field==='painDuration') painDuration=val;
  render();
}
function switchTab(t){activeScoreTab=t;render();}
function setAlvarado(id,val){alvaradoState[id]=val;render();}
function setRansonAdmit(id,val){ransonAdmitState[id]=val;render();}
function setRanson48(id,val){ranson48hState[id]=val;render();}
function setBISAP(id,val){bisapState[id]=val;render();}
function toggleSection(id){sections[id]=!sections[id];render();}
function goToStep(idx){step=idx;render();window.scrollTo({top:0,behavior:'smooth'});}
function next(){
  if(step===0&&!(patAge!==null&&patSex!==null&&painDuration!==null&&painIntensity!==null)){shakeNav();return;}
  if(step===1&&painLocation===null){shakeNav();return;}
  if(step===2&&painOnset===null){shakeNav();return;}
  step++;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function shakeNav(){
  const navRow=document.getElementById('navRow')||document.querySelector('.nav-row');
  if(navRow){navRow.classList.add('shake');setTimeout(()=>navRow.classList.remove('shake'),450);}
}
function prev(){if(step>0){step--;render();window.scrollTo({top:0,behavior:'smooth'});}}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const el=document.activeElement;
    if(el&&(el.classList.contains('history-pill')||el.classList.contains('abd-region')||el.classList.contains('collapse-header')||el.getAttribute('role')==='button'||el.getAttribute('role')==='checkbox')){
      el.click();e.preventDefault();
    }
  }
});

render();
</script>
