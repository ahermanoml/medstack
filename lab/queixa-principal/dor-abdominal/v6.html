  h+='<h2>Scores clinicos</h2><p class="subtitle">Opcionais. Campos pre-preenchidos podem ser ajustados.</p>';

  const showAlvarado=(location==='rlq'||location==='periumbilical');
  const showRanson=(location==='epigastric'||location==='diffuse'||painRadiation.has('back'));

  // Auto-pick suggested tab if user hasn't changed it yet
  if(showAlvarado&&!showRanson){activeScoreTab='alvarado';}
  else if(showRanson&&!showAlvarado&&activeScoreTab==='alvarado'){activeScoreTab='bisap';}

  const alvFilled=getScoreFilledCount('alvarado');
  const ranFilled=getScoreFilledCount('ranson');
  const bisapFilled=getScoreFilledCount('bisap');

  h+='<div class="score-tabs">';
  h+=`<button class="score-tab ${activeScoreTab==='alvarado'?'active':''} ${showAlvarado?'suggested':''}" onclick="switchTab('alvarado')">Alvarado${alvFilled===ALVARADO.length?'<span class="tab-check">\u2713</span>':''}</button>`;
  h+=`<button class="score-tab ${activeScoreTab==='ranson'?'active':''} ${showRanson?'suggested':''}" onclick="switchTab('ranson')">Ranson${ranFilled===RANSON_ADMIT.length?'<span class="tab-check">\u2713</span>':''}</button>`;
  h+=`<button class="score-tab ${activeScoreTab==='bisap'?'active':''} ${showRanson?'suggested':''}" onclick="switchTab('bisap')">BISAP${bisapFilled===BISAP.length?'<span class="tab-check">\u2713</span>':''}</button>`;
  h+='</div>';

  if(activeScoreTab==='alvarado') h+=buildAlvarado();
  else if(activeScoreTab==='ranson') h+=buildRanson();
  else h+=buildBISAP();

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn skip" onclick="next()">Pular</button>';
  h+='<button class="nav-btn primary" onclick="next()">Resultado</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function getScoreFilledCount(type){
  if(type==='alvarado'){const auto=autoAlvarado();return ALVARADO.filter(i=>auto[i.id]!==undefined||alvaradoState[i.id]!==undefined).length;}
  if(type==='ranson'){const auto=autoRansonAdmit();return RANSON_ADMIT.filter(i=>auto[i.id]!==undefined||ransonAdmitState[i.id]!==undefined).length;}
  if(type==='bisap'){const auto=autoBISAP();return BISAP.filter(i=>auto[i.id]!==undefined||bisapState[i.id]!==undefined).length;}
  return 0;
}

function buildAlvarado(){
  const auto=autoAlvarado();
  let h='<p style="font-size:.72rem;color:var(--text-muted);margin-bottom:.85rem;line-height:1.55">Alvarado (MANTRELS) &mdash; apendicite aguda. Campos <span class="auto-tag" style="display:inline-block;vertical-align:baseline">Auto</span> sao alteraveis.</p>';
  for(const item of ALVARADO){
    const val=auto[item.id]!==undefined?auto[item.id]:(alvaradoState[item.id]!==undefined?alvaradoState[item.id]:undefined);
    const isAuto=auto[item.id]!==undefined&&alvaradoState[item.id]===undefined;
    h+=`<div class="score-row"><div class="score-row-label"><span>${item.label}</span>${isAuto?'<span class="auto-tag">Auto</span>':''}</div>`;
    h+='<div class="score-options">';
    h+=`<button class="score-opt ${val===0?'picked':''}" onclick="setAlvarado('${item.id}',0)">Nao<span class="pts">0 pt</span></button>`;
    h+=`<button class="score-opt ${val===1?'picked':''}" onclick="setAlvarado('${item.id}',1)">Sim<span class="pts">${item.pts} pt${item.pts>1?'s':''}</span></button>`;
    h+='</div></div>';
  }
  const total=getAlvaradoScore();
  if(total!==null){
    let sc,sl,sd;
    if(total<=4){sc='sr-low';sl='Baixa probabilidade';sd=`Alvarado ${total}/10 \u2014 Apendicite improvavel.`;}
    else if(total<=6){sc='sr-mod';sl='Probabilidade intermediaria';sd=`Alvarado ${total}/10 \u2014 Observacao + imagem. Reavaliar em 6\u201312h.`;}
    else if(total<=8){sc='sr-mod';sl='Alta probabilidade';sd=`Alvarado ${total}/10 \u2014 TC e/ou avaliacao cirurgica.`;}
    else{sc='sr-high';sl='Muito alta probabilidade';sd=`Alvarado ${total}/10 \u2014 Avaliacao cirurgica imediata.`;}
    h+=`<div class="score-result ${sc}"><div class="score-num">${total}</div><div class="score-info"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    const filled=ALVARADO.filter(i=>auto[i.id]!==undefined||alvaradoState[i.id]!==undefined).length;
    h+=`<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Preencha (${filled}/${ALVARADO.length})</div><div class="score-detail">Campos Auto ja vieram das etapas anteriores.</div></div></div>`;
  }
  return h;
}

function buildRanson(){
  const autoR=autoRansonAdmit();
  let h='<p style="font-size:.72rem;color:var(--text-muted);margin-bottom:.85rem;line-height:1.55">Ranson \u2014 gravidade de pancreatite. 48h opcional no PS.</p>';
  h+='<div style="font-family:var(--mono);font-size:.64rem;color:var(--accent-light);font-weight:700;margin-bottom:.6rem;letter-spacing:.1em;text-transform:uppercase">Na admissao</div>';
  for(const item of RANSON_ADMIT){
    const val=autoR[item.id]!==undefined?autoR[item.id]:(ransonAdmitState[item.id]!==undefined?ransonAdmitState[item.id]:undefined);
    const isAuto=autoR[item.id]!==undefined&&ransonAdmitState[item.id]===undefined;
    h+=`<div class="score-row"><div class="score-row-label"><span>${item.label}</span>${isAuto?'<span class="auto-tag">Auto</span>':''}</div>`;
    h+='<div class="score-options">';
    h+=`<button class="score-opt ${val===0?'picked':''}" onclick="setRansonAdmit('${item.id}',0)">Nao<span class="pts">0 pt</span></button>`;
    h+=`<button class="score-opt ${val===1?'picked':''}" onclick="setRansonAdmit('${item.id}',1)">Sim<span class="pts">1 pt</span></button>`;
    h+='</div></div>';
  }
  h+='<div style="font-family:var(--mono);font-size:.64rem;color:var(--accent-light);font-weight:700;margin:.85rem 0 .6rem;letter-spacing:.1em;text-transform:uppercase">Apos 48h (opcional)</div>';
  for(const item of RANSON_48H){
    const val=ranson48hState[item.id];
    h+=`<div class="score-row"><div class="score-row-label"><span>${item.label}</span></div>`;
    h+='<div class="score-options">';
    h+=`<button class="score-opt ${val===0?'picked':''}" onclick="setRanson48('${item.id}',0)">Nao<span class="pts">0 pt</span></button>`;
    h+=`<button class="score-opt ${val===1?'picked':''}" onclick="setRanson48('${item.id}',1)">Sim<span class="pts">1 pt</span></button>`;
    h+='</div></div>';
  }
  const ranDisplay=getRansonDisplay();
  if(ranDisplay!==null){
    let sc,sl,sd;
    const maxLabel=ranDisplay.partial?'5 (admissao)':'11';
    if(ranDisplay.score<=2){sc='sr-low';sl='Pancreatite leve';sd=`Ranson ${ranDisplay.score}/${maxLabel} \u2014 Mortalidade < 5%.`;}
    else if(ranDisplay.score<=4){sc='sr-mod';sl='Pancreatite moderada';sd=`Ranson ${ranDisplay.score}/${maxLabel} \u2014 Mortalidade ~15\u201320%. Considerar UTI.`;}
    else if(ranDisplay.score<=6){sc='sr-high';sl='Pancreatite grave';sd=`Ranson ${ranDisplay.score}/${maxLabel} \u2014 Mortalidade ~40%. UTI obrigatoria.`;}
    else{sc='sr-high';sl='Pancreatite muito grave';sd=`Ranson ${ranDisplay.score}/${maxLabel} \u2014 Mortalidade > 99%.`;}
    const partial=ranDisplay.partial?' (admissao)':'';
    h+=`<div class="score-result ${sc}"><div class="score-num">${ranDisplay.score}</div><div class="score-info"><div class="score-label">${sl}${partial}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    const filled=RANSON_ADMIT.filter(i=>autoR[i.id]!==undefined||ransonAdmitState[i.id]!==undefined).length;
    h+=`<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Preencha admissao (${filled}/${RANSON_ADMIT.length})</div><div class="score-detail">Criterios 48h opcionais.</div></div></div>`;
  }
  return h;
}

function buildBISAP(){
  const auto=autoBISAP();
  let h='<p style="font-size:.72rem;color:var(--text-muted);margin-bottom:.85rem;line-height:1.55">BISAP &mdash; Bedside Index for Severity in Acute Pancreatitis. Pratico para PS nas primeiras 24h.</p>';
  for(const item of BISAP){
    const val=auto[item.id]!==undefined?auto[item.id]:(bisapState[item.id]!==undefined?bisapState[item.id]:undefined);
    const isAuto=auto[item.id]!==undefined&&bisapState[item.id]===undefined;
    h+=`<div class="score-row"><div class="score-row-label"><span>${item.label}</span>${isAuto?'<span class="auto-tag">Auto</span>':''}</div>`;
    h+='<div class="score-options">';
    h+=`<button class="score-opt ${val===0?'picked':''}" onclick="setBISAP('${item.id}',0)">Nao<span class="pts">0 pt</span></button>`;
    h+=`<button class="score-opt ${val===1?'picked':''}" onclick="setBISAP('${item.id}',1)">Sim<span class="pts">1 pt</span></button>`;
    h+='</div></div>';
  }
  const total=getBISAPScore();
  if(total!==null){
    let sc,sl,sd;
    if(total<=1){sc='sr-low';sl='Baixo risco';sd=`BISAP ${total}/5 \u2014 Mortalidade < 2%.`;}
    else if(total===2){sc='sr-mod';sl='Risco intermediario';sd=`BISAP ${total}/5 \u2014 Mortalidade ~5\u201310%. Considerar UTI.`;}
    else if(total===3){sc='sr-mod';sl='Alto risco';sd=`BISAP ${total}/5 \u2014 Mortalidade ~15\u201320%. UTI.`;}
    else{sc='sr-high';sl='Muito alto risco';sd=`BISAP ${total}/5 \u2014 Mortalidade > 22%. UTI obrigatoria.`;}
    h+=`<div class="score-result ${sc}"><div class="score-num">${total}</div><div class="score-info"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  } else {
    const filled=BISAP.filter(i=>auto[i.id]!==undefined||bisapState[i.id]!==undefined).length;
    h+=`<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Preencha (${filled}/${BISAP.length})</div><div class="score-detail">Calculavel nas primeiras 24h.</div></div></div>`;
  }
  return h;
}

// =============================================
// RESULT PAGE
// =============================================
function renderResult(){
  const risk=getRiskInfo();
  const ddx=buildDifferentials();
  const workup=buildWorkup();
  const flags=getRedFlags();

  if(risk.level==='surgical'||risk.level==='urgent'){
    if(sections.analgesia===false&&painIntensity!==null) sections.analgesia=true;
  }

  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  h+=`<div class="result-plate ${risk.badge}">${risk.initial}</div>`;
  h+=`<div class="result-title">${risk.title}</div>`;
  h+=`<div class="result-desc">${risk.desc}</div>`;

  const locLabel=LOCATIONS.find(l=>l.id===location)?.label||location;
  const onsetLabel=PAIN_ONSET.find(o=>o.id===painOnset)?.label||'';
  const sexLabel=patSex==='M'?'M':'F';
  const ageLabel=['<18','18\u201340','40\u201365','>65'][patAge]||'';
  const durLabel=['<6h','6\u201324h','24\u201372h','>72h'][painDuration]||'';
  h+=`<p class="patient-line">${sexLabel} &middot; ${ageLabel}a &middot; ${locLabel} &middot; ${durLabel}</p>`;

  if(flags.length>0){
    h+='<div class="red-flag" style="text-align:left;margin-bottom:1rem"><strong>Sinais de alarme &middot; '+flags.length+'</strong>';
    h+=flags.map(f=>'&bull; '+f).join('<br>');
    h+='</div>';
  }

  // Summary
  h+=collapsible('summary','Resumo da avaliacao',()=>{
    let s='';
    s+=`<div class="summary-row"><span class="criteria">Localizacao</span><span class="value">${locLabel}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Inicio</span><span class="value">${onsetLabel}</span></div>`;
    const qualLabels=[...painQuality].map(q=>PAIN_QUALITY.find(p=>p.id===q)?.label).filter(Boolean);
    s+=`<div class="summary-row"><span class="criteria">Qualidade</span><span class="value">${qualLabels.length?qualLabels.join(', '):'N/A'}</span></div>`;
    const radLabels=[...painRadiation].map(r=>PAIN_RADIATION.find(p=>p.id===r)?.label).filter(Boolean);
    s+=`<div class="summary-row"><span class="criteria">Irradiacao</span><span class="value">${radLabels.length?radLabels.join(', '):'Sem'}</span></div>`;
    const intLabel=['Leve','Moderada','Intensa'][painIntensity]||'N/A';
    s+=`<div class="summary-row"><span class="criteria">Intensidade</span><span class="value">${intLabel}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Duracao</span><span class="value">${durLabel}</span></div>`;
    const aggLabels=[...aggravating].map(a=>AGGRAVATING.find(x=>x.id===a)?.label).filter(Boolean);
    if(aggLabels.length) s+=`<div class="summary-row"><span class="criteria">Piora</span><span class="value">${aggLabels.join(', ')}</span></div>`;
    const relLabels=[...relieving].map(r=>RELIEVING.find(x=>x.id===r)?.label).filter(Boolean);
    if(relLabels.length) s+=`<div class="summary-row"><span class="criteria">Melhora</span><span class="value">${relLabels.join(', ')}</span></div>`;
    const periLabels=[...peritonealSigns].map(p=>PERITONEAL_SIGNS.find(x=>x.id===p)?.label).filter(Boolean);
    s+=`<div class="summary-row"><span class="criteria">Peritoneais</span><span class="value">${periLabels.length?'<span class="dot dot-red"></span> '+periLabels.join(', '):'<span class="dot dot-green"></span> Ausentes'}</span></div>`;
    const specLabels=[...specificSigns].map(p=>SPECIFIC_SIGNS.find(x=>x.id===p)?.label).filter(Boolean);
    if(specLabels.length) s+=`<div class="summary-row"><span class="criteria">Especificos</span><span class="value">${specLabels.join(', ')}</span></div>`;
    const vsLabels=[...vitalSigns].map(v=>Object.values(VITAL_SIGNS_OPTS).find(x=>x.id===v)?.label).filter(Boolean);
    s+=`<div class="summary-row"><span class="criteria">Vitais</span><span class="value">${vsLabels.length?'<span class="dot dot-yellow"></span> '+vsLabels.join(', '):'<span class="dot dot-green"></span> Estaveis'}</span></div>`;
    const symLabels=[...assocSymptoms].map(a=>ASSOC_SYMPTOMS.find(x=>x.id===a)?.label).filter(Boolean);
    if(symLabels.length) s+=`<div class="summary-row"><span class="criteria">Sintomas</span><span class="value">${symLabels.join(', ')}</span></div>`;
    const histLabels=[...pastHistory].map(ph=>PAST_HISTORY.find(x=>x.id===ph)?.label).filter(Boolean);
    if(histLabels.length) s+=`<div class="summary-row"><span class="criteria">Antecedentes</span><span class="value">${histLabels.join(', ')}</span></div>`;
    if(patSex==='F'&&lmpStatus){
      const lmpLabel={possible:'Possivel',unlikely:'Improvavel',na:'Pos-menopausa'}[lmpStatus];
      s+=`<div class="summary-row"><span class="criteria">Gravidez</span><span class="value">${lmpLabel}</span></div>`;
    }
    return s;
  });

  // DDx
  h+=collapsible('ddx','Diagnosticos diferenciais',()=>{
    let s='<div class="dx-list">';
    ddx.forEach((d,i)=>{
      const probCls=i===0?'prob-high':i<3?'prob-mod':'prob-low';
      const probLabel=i===0?'Mais provavel':i<3?'Provavel':'Considerar';
      s+=`<div class="dx-item"><span class="dx-rank">#${i+1}</span><span class="dx-name">${d.name}</span><span class="dx-prob ${probCls}">${probLabel}</span></div>`;
    });
    s+='</div>';
    return s;
  });

  // Scores
  h+=collapsible('scores','Scores de risco',()=>{
    let s='';
    const alvScore=getAlvaradoScore();
    if(alvScore!==null){
      let sc,sl;
      if(alvScore<=4){sc='sr-low';sl='Baixa probabilidade';}
      else if(alvScore<=6){sc='sr-mod';sl='Probabilidade intermediaria';}
      else if(alvScore<=8){sc='sr-mod';sl='Alta probabilidade';}
      else{sc='sr-high';sl='Muito alta';}
      s+=`<div class="score-result ${sc}"><div class="score-num">${alvScore}</div><div class="score-info"><div class="score-label">Alvarado \u2014 ${sl}</div><div class="score-detail">${alvScore}/10 para apendicite</div></div></div>`;
    }
    const ranDisplay=getRansonDisplay();
    if(ranDisplay!==null){
      let sc,sl;
      if(ranDisplay.score<=2){sc='sr-low';sl='Pancreatite leve';}
      else if(ranDisplay.score<=4){sc='sr-mod';sl='Pancreatite moderada';}
      else{sc='sr-high';sl='Pancreatite grave';}
      const partial=ranDisplay.partial?' (admissao)':'';
      const maxLabel=ranDisplay.partial?'5':'11';
      s+=`<div class="score-result ${sc}" style="margin-top:.5rem"><div class="score-num">${ranDisplay.score}</div><div class="score-info"><div class="score-label">Ranson${partial} \u2014 ${sl}</div><div class="score-detail">${ranDisplay.score}/${maxLabel} para pancreatite</div></div></div>`;
    }
    const bisapScore=getBISAPScore();
    if(bisapScore!==null){
      let sc,sl;
      if(bisapScore<=1){sc='sr-low';sl='Baixo risco';}
      else if(bisapScore<=2){sc='sr-mod';sl='Intermediario';}
      else{sc='sr-high';sl='Alto risco';}
      s+=`<div class="score-result ${sc}" style="margin-top:.5rem"><div class="score-num">${bisapScore}</div><div class="score-info"><div class="score-label">BISAP \u2014 ${sl}</div><div class="score-detail">${bisapScore}/5 para pancreatite</div></div></div>`;
    }
    if(alvScore===null&&ranDisplay===null&&bisapScore===null){
      s+='<p style="font-size:.8rem;color:var(--text-muted);text-align:center;padding:.5rem;font-style:italic">Nenhum score preenchido.</p>';
    }
    return s;
  });

  // Workup
  h+=collapsible('workup','Propedeutica sugerida',()=>{
    let s='';
    if(workup.urgent.length){
      s+='<div class="workup-section"><div class="workup-heading urgent-h">Urgente</div>';
      s+='<div class="workup-tags">';
      for(const w of workup.urgent) s+=`<span class="workup-tag urgent">${w}</span>`;
      s+='</div></div>';
    }
    if(workup.routine.length){
      s+='<div class="workup-section"><div class="workup-heading routine-h">Rotina</div>';
      s+='<div class="workup-tags">';
      for(const w of workup.routine) s+=`<span class="workup-tag routine">${w}</span>`;
      s+='</div></div>';
    }
    return s;
  });

  // Conduta
  h+=buildCondutaSection(risk);

  // Analgesia
  if(painIntensity!==null){
    h+=collapsible('analgesia','Protocolo de analgesia',()=>{
      const protocol=buildAnalgesiaProtocol();
      let s='<div class="analgesia-box"><h4>'+['Dor Leve','Dor Moderada','Dor Intensa'][painIntensity]+'</h4>';
      for(const st of protocol){
        const isWarning=st.n==='!';
        s+=`<div class="analgesia-step"><span class="step-marker ${isWarning?'warn':''}">${st.n}</span><span>${st.text}</span></div>`;
      }
      s+='</div>';
      s+='<p style="font-size:.66rem;color:var(--text-muted);line-height:1.6;margin-top:.55rem;font-style:italic">* Doses para '+(patAge===0?'pediatria (calcular pelo peso).':'adultos. Ajustar conforme funcao renal/hepatica.')+'</p>';
      return s;
    });
  }

  // Note
  h+=collapsible('note','Nota para prontuario',()=>buildNoteContent(risk,ddx,workup));

  // Nav
  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="requestRestart()">Recomecar</button>';
  h+='</div></div>';

  h+='<p class="disclaimer">Ferramenta de apoio a decisao clinica. Nao substitui o julgamento medico.</p>';

  app.innerHTML=h;
}

// =============================================
// CONDUTA
// =============================================
function buildCondutaSection(risk){
  let cls,title,items;
  if(risk.level==='surgical'){
    cls='alta-prob';title='Abdome cirurgico \u2014 Intervencao urgente';
    items=[
      'Avaliacao cirurgica IMEDIATA',
      'Acesso venoso calibroso x2 + Reposicao volemica agressiva',
      'Tipo sanguineo + Reserva de hemocomponentes',
      'Exames pre-op: hemograma, coagulograma, funcao renal, ECG',
      'Sonda nasogastrica se obstrucao / vomitos',
      'Antibiotico empirico se peritonite (ex: Ceftriaxona + Metronidazol)',
      'Manter paciente em JEJUM',
      'Comunicar centro cirurgico e anestesiologia',
      'Reservar vaga em UTI no pos-operatorio',
    ];
  } else if(risk.level==='urgent'){
    cls='mod-prob';title='Urgencia \u2014 Investigacao rapida';
    items=[
      'Exames laboratoriais STAT',
      'Imagem direcionada (TC/USG) conforme suspeita',
      'Acesso venoso periferico + Hidratacao EV',
      'Analgesia (NAO retardar pela avaliacao cirurgica)',
      'Reavaliacao seriada a cada 2\u20134h com exame fisico',
      'Manter paciente em jejum ate definicao diagnostica',
      'Considerar interconsulta precoce (cirurgia / gastro / GO)',
    ];
    if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')){
      items.push('Colangite: iniciar antibiotico empirico (Ciprofloxacino + Metronidazol ou Pipe/Tazo)');
    }
    if(patSex==='F'&&lmpStatus==='possible'){
      items.push('Confirmar/excluir gravidez antes de radiacao ou medicacao teratogenica');
    }
  } else if(risk.level==='medical'){
    cls='neutra-prob';title='Investigar \u2014 Manejo clinico';
    items=[
      'Exames laboratoriais direcionados',
      'Imagem conforme hipotese diagnostica principal',
      'Analgesia + Sintomaticos (antiemeticos, IBP se indicado)',
      'Reavaliacao clinica em 4\u20136h',
      'Avaliar alta com orientacoes se melhora clinica',
      'Orientar sinais de alarme para retorno ao PS',
    ];
  } else {
    cls='baixa-prob';title='Baixo risco \u2014 Observacao';
    items=[
      'Exames basicos se clinicamente indicado',
      'Sintomaticos (analgesia simples, hidratacao oral)',
      'Considerar alta com retorno se piora',
      'Orientar sinais de alarme: febre, vomitos persistentes, piora da dor, sangramento',
      'Encaminhamento ambulatorial se dor recorrente',
    ];
    if(patAge===3||pastHistory.has('immunosupp')||pastHistory.has('transplant')){
      items.push('Paciente de risco \u2014 periodo de observacao mais longo antes da alta');
    }
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${cls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')" role="button" tabindex="0" aria-expanded="${open}"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">&#x25BC;</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.65rem':'0'}">`;
  if(open) for(const text of items) h+=`<div class="conduta-item"><span class="conduta-bul"></span><span>${text}</span></div>`;
  h+='</div></div>';
  return h;
}

// =============================================
// CLINICAL NOTE

function buildNoteContent(risk,ddx,workup){
  const pad=n=>String(n).padStart(2,'0');
  const now=evalStartTime;
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const locLabel=LOCATIONS.find(l=>l.id===location)?.label||location;
  const onsetLabel=PAIN_ONSET.find(o=>o.id===painOnset)?.label||'';
  const qualLabels=[...painQuality].map(q=>PAIN_QUALITY.find(p=>p.id===q)?.label).filter(Boolean);
  const radLabels=[...painRadiation].map(r=>PAIN_RADIATION.find(p=>p.id===r)?.label).filter(Boolean);
  const intLabel=['Leve (1-3)','Moderada (4-6)','Intensa (7-10)'][painIntensity]||'N/A';
  const durLabel=['< 6 horas','6-24 horas','24-72 horas','> 72 horas'][painDuration]||'';
  const aggLabels=[...aggravating].map(a=>AGGRAVATING.find(x=>x.id===a)?.label).filter(Boolean);
  const relLabels=[...relieving].map(r=>RELIEVING.find(x=>x.id===r)?.label).filter(Boolean);
  const symLabels=[...assocSymptoms].map(a=>ASSOC_SYMPTOMS.find(x=>x.id===a)?.label).filter(Boolean);
  const periLabels=[...peritonealSigns].map(p=>PERITONEAL_SIGNS.find(x=>x.id===p)?.label).filter(Boolean);
  const specLabels=[...specificSigns].map(p=>SPECIFIC_SIGNS.find(x=>x.id===p)?.label).filter(Boolean);
  const vsLabels=[...vitalSigns].map(v=>Object.values(VITAL_SIGNS_OPTS).find(x=>x.id===v)?.label).filter(Boolean);
  const histLabels=[...pastHistory].map(ph=>PAST_HISTORY.find(x=>x.id===ph)?.label).filter(Boolean);

  let n='';
  n+=`DOR ABDOMINAL - AVALIACAO NO PS\n`;
  n+=`Data/hora: ${ts}\n`;
  n+=`----------------------------------------\n\n`;
  n+=`PACIENTE: ${patSex==='M'?'Masculino':'Feminino'}, ${['< 18','18-40','40-65','> 65'][patAge]} anos\n`;
  if(patSex==='F'&&lmpStatus){
    const lmpLabel={possible:'Possibilidade de gravidez',unlikely:'Gravidez improvavel',na:'Pos-menopausa'}[lmpStatus];
    n+=`Status gestacional: ${lmpLabel}\n`;
  }
  n+=`Duracao do quadro: ${durLabel}\n`;
  if(histLabels.length) n+=`Antecedentes: ${histLabels.join(', ')}\n`;
  n+='\n';

  n+=`HISTORIA DA DOR\n`;
  n+=`  Localizacao: ${locLabel}\n`;
  n+=`  Inicio: ${onsetLabel}\n`;
  n+=`  Qualidade: ${qualLabels.length?qualLabels.join(', '):'Nao especificada'}\n`;
  n+=`  Irradiacao: ${radLabels.length?radLabels.join(', '):'Sem irradiacao'}\n`;
  n+=`  Intensidade: ${intLabel}\n`;
  if(aggLabels.length) n+=`  Piora com: ${aggLabels.join(', ')}\n`;
  if(relLabels.length) n+=`  Melhora com: ${relLabels.join(', ')}\n`;
  n+='\n';

  n+=`SINTOMAS ASSOCIADOS\n`;
  n+=`  ${symLabels.length?symLabels.join(', '):'Nenhum relatado'}\n\n`;

  n+=`EXAME FISICO\n`;
  n+=`  Sinais vitais: ${vsLabels.length?vsLabels.join(', '):'Estaveis'}\n`;
  n+=`  Sinais peritoneais: ${periLabels.length?periLabels.join(', '):'Ausentes'}\n`;
  if(specLabels.length) n+=`  Sinais especificos: ${specLabels.join(', ')}\n`;
  n+='\n';

  n+=`ESTRATIFICACAO: ${risk.title}\n`;
  n+=`  ${risk.desc}\n\n`;

  const flags=getRedFlags();
  if(flags.length){
    n+=`SINAIS DE ALARME\n`;
    flags.forEach(f=>{n+=`  - ${f}\n`;});
    n+='\n';
  }

  n+=`DIAGNOSTICOS DIFERENCIAIS\n`;
  ddx.forEach((d,i)=>{n+=`  ${i+1}. ${d.name}\n`;});
  n+='\n';

  const alvScore=getAlvaradoScore();
  const ranDisplay=getRansonDisplay();
  const bisapScore=getBISAPScore();
  if(alvScore!==null||ranDisplay!==null||bisapScore!==null){
    n+=`SCORES CLINICOS\n`;
    if(alvScore!==null){
      const alvRisk=alvScore<=4?'Baixa':alvScore<=6?'Intermediaria':alvScore<=8?'Alta':'Muito alta';
      n+=`  Alvarado: ${alvScore}/10 - ${alvRisk}\n`;
    }
    if(ranDisplay!==null){
      const rRisk=ranDisplay.score<=2?'Leve':ranDisplay.score<=4?'Moderada':ranDisplay.score<=6?'Grave':'Muito grave';
      const partial=ranDisplay.partial?' (admissao)':'';
      const maxLabel=ranDisplay.partial?'5':'11';
      n+=`  Ranson${partial}: ${ranDisplay.score}/${maxLabel} - ${rRisk}\n`;
    }
    if(bisapScore!==null){
      const bRisk=bisapScore<=1?'Baixo':bisapScore<=2?'Intermediario':bisapScore<=3?'Alto':'Muito alto';
      n+=`  BISAP: ${bisapScore}/5 - ${bRisk}\n`;
    }
    n+='\n';
  }

  n+=`PROPEDEUTICA SUGERIDA\n`;
  if(workup.urgent.length) n+=`  Urgente: ${workup.urgent.join(', ')}\n`;
  if(workup.routine.length) n+=`  Rotina: ${workup.routine.join(', ')}\n`;
  n+='\n';

  if(painIntensity!==null){
    const protocol=buildAnalgesiaProtocol();
    n+=`ANALGESIA\n`;
    protocol.forEach(st=>{n+=`  ${st.n}. ${st.text}\n`;});
  }

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()" aria-label="Copiar nota">Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  const text=el.textContent||el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showCopied()).catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(ta);
  ta.focus();ta.select();
  try{document.execCommand('copy');showCopied();}catch(e){alert('Nao foi possivel copiar.');}
  document.body.removeChild(ta);
}
function showCopied(){
  const btn=document.getElementById('copyBtn');
  if(!btn) return;
  btn.textContent='\u2713 Copiado';btn.classList.add('copied');
  setTimeout(()=>{if(btn){btn.textContent='Copiar nota';btn.classList.remove('copied');}},2000);
}

// =============================================
// ACTIONS
// =============================================
function setLocation(id){location=id;render();}
function setPainOnset(id){painOnset=id;render();}
function setPainIntensity(v){painIntensity=v;render();}
function toggleRadiation(id){
  if(id==='none'){
    if(painRadiation.has('none')) painRadiation.delete('none');
    else{painRadiation.clear();painRadiation.add('none');}
  } else {
    painRadiation.delete('none');
    if(painRadiation.has(id)) painRadiation.delete(id); else painRadiation.add(id);
  }
  render();
}
function toggleSet(setName,id){
  const sets={painQuality,painRadiation,aggravating,relieving,assocSymptoms,peritonealSigns,specificSigns,vitalSigns,pastHistory};
  const s=sets[setName];
  if(!s) return;
  if(s.has(id)) s.delete(id); else s.add(id);
  render();
}
function setPatField(field,val){
  if(field==='patAge') patAge=val;
  else if(field==='patSex'){patSex=val;if(val==='M') lmpStatus=null;}
  else if(field==='lmpStatus') lmpStatus=val;
  else if(field==='painDuration') painDuration=val;
  render();
}
function switchTab(t){activeScoreTab=t;render();}
function setAlvarado(id,val){alvaradoState[id]=val;render();}
function setRansonAdmit(id,val){ransonAdmitState[id]=val;render();}
function setRanson48(id,val){ranson48hState[id]=val;render();}
function setBISAP(id,val){bisapState[id]=val;render();}
function toggleSection(id){sections[id]=!sections[id];render();}
function goToStep(idx){step=idx;render();window.scrollTo({top:0,behavior:'smooth'});}
function next(){
  if(step===0){
    if(patAge===null||patSex===null||painDuration===null||painIntensity===null){
      const navRow=document.getElementById('navRow');
      if(navRow){navRow.classList.add('shake');setTimeout(()=>navRow.classList.remove('shake'),450);}
      return;
    }
  }
  if(step===1&&location===null){
    const navRow=document.querySelector('.nav-row');
    if(navRow){navRow.classList.add('shake');setTimeout(()=>navRow.classList.remove('shake'),450);}
    return;
  }
  if(step===2&&painOnset===null){
    const navRow=document.querySelector('.nav-row');
    if(navRow){navRow.classList.add('shake');setTimeout(()=>navRow.classList.remove('shake'),450);}
    return;
  }
  step++;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){if(step>0){step--;render();window.scrollTo({top:0,behavior:'smooth'});}}
function requestRestart(){showRestartModal=true;render();}

// Keyboard
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    const el=document.activeElement;
    if(el&&(el.classList.contains('history-pill')||el.classList.contains('abd-region')||el.classList.contains('collapse-header')||el.getAttribute('role')==='button'||el.getAttribute('role')==='checkbox')){
      el.click();e.preventDefault();
    }
  }
  if(e.key==='Escape'&&showRestartModal) cancelRestart();
});

render();
</script>
