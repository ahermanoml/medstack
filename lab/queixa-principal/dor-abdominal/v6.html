<!-- VERSION: 6 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dor Abdominal — Avaliacao no PS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg-primary:#0e1628;--bg-card:#1a2336;--bg-input:#0e1628;
    --border:#2b3650;--border-soft:#334155;
    --text-primary:#e8edf7;--text-secondary:#94a3b8;--text-muted:#64748b;
    --accent:#5b8def;--accent-light:#8eb4ff;--accent-bg:#172849;
    --red:#ef4444;--red-dark:#7f1d1d;--red-light:#fca5a5;--red-bg:#3a0a0a;
    --yellow:#f59e0b;--yellow-dark:#78350f;--yellow-light:#fcd34d;--yellow-bg:#3d1803;
    --green:#22c55e;--green-dark:#14532d;--green-light:#86efac;--green-bg:#042e16;
    --radius:.75rem;--radius-sm:.5rem;
    --transition:all .18s ease;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --serif:'Iowan Old Style','Palatino','Book Antiqua',Georgia,serif;
    --mono:'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg-primary);color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;padding-bottom:var(--safe-bottom);background-image:radial-gradient(1200px 600px at 50% -100px,rgba(91,141,239,.06),transparent 60%)}

  /* Header — anatomical-plate styling */
  header{width:100%;padding:calc(1rem + var(--safe-top)) 1.25rem 1rem;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:rgba(14,22,40,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  header h1{font-family:var(--serif);font-size:1.3rem;font-weight:600;letter-spacing:.005em;color:var(--text-primary)}
  header .sub{font-size:.68rem;color:var(--text-muted);margin-top:.2rem;text-transform:uppercase;letter-spacing:.14em;font-weight:500}
  .back-link{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-secondary);text-decoration:none;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:.3rem;padding:.35rem .5rem;border-radius:var(--radius-sm);transition:var(--transition)}
  .back-link:hover{color:var(--text-primary)}
  .back-link:active{background:rgba(255,255,255,.05)}

  .container{max-width:700px;width:100%;padding:1.15rem 1rem 2rem;display:flex;flex-direction:column;gap:1rem}

  /* Progress — textbook fig. numbering */
  .progress-bar{display:flex;align-items:center;gap:.3rem;padding:.1rem .1rem 0}
  .progress-step{flex:1;height:3px;border-radius:2px;background:#1f2c46;transition:background .4s ease;cursor:pointer}
  .progress-step.clickable:hover{background:#334155}
  .progress-step.done{background:var(--accent)}
  .progress-step.done:hover{background:var(--accent-light)}
  .progress-step.active{background:var(--accent-light);animation:pulse-bar 2s ease-in-out infinite}
  @keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.55}}
  .progress-labels{display:flex;justify-content:space-between;font-size:.54rem;color:var(--text-muted);padding:.35rem .1rem 0;text-transform:uppercase;letter-spacing:.08em}
  .progress-labels span{transition:color .3s;cursor:pointer;font-weight:500}
  .progress-labels span:hover{color:#cbd5e1}
  .progress-labels span.active-label{color:var(--accent-light);font-weight:700}
  .progress-labels span.done-label{color:var(--accent)}

  /* Step chip */
  .step-chip{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.62rem;color:var(--text-muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.45rem}
  .step-chip .step-num{color:var(--accent-light);font-weight:700}
  .step-chip::before{content:'';width:12px;height:1px;background:var(--border);display:inline-block}

  /* Cards — subtle textbook plate */
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:.9rem;padding:1.5rem 1.35rem;animation:slideUp .3s ease;position:relative}
  @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-family:var(--serif);font-size:1.3rem;color:var(--text-primary);margin-bottom:.15rem;font-weight:600;letter-spacing:.005em}
  .card .subtitle{font-size:.78rem;color:var(--text-secondary);margin-bottom:1.2rem;line-height:1.5}

  /* Option groups */
  .options{display:flex;flex-direction:column;gap:.55rem}
  .option-group-label{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.13em;color:var(--text-muted);margin-top:.85rem;margin-bottom:-.1rem;font-weight:600;display:flex;align-items:center;gap:.55rem}
  .option-group-label::after{content:'';flex:1;height:1px;background:var(--border);opacity:.45}
  .option-group-label:first-child{margin-top:0}

  /* Primary option button */
  .option-btn{background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem;color:#cbd5e1;font-size:.9rem;cursor:pointer;transition:var(--transition);text-align:left;display:flex;align-items:center;gap:.75rem;-webkit-user-select:none;user-select:none}
  .option-btn:hover{border-color:var(--accent);background:#172040;color:var(--text-primary)}
  .option-btn:active{transform:scale(.985)}
  .option-btn.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary)}
  .option-btn .label{flex:1;line-height:1.3}
  .option-btn .hint{display:block;font-size:.7rem;color:var(--text-muted);margin-top:.15rem;font-style:italic}
  .option-btn.selected .hint{color:#93c5fd}

  /* Check buttons */
  .check-btn{background:var(--bg-input);border:1.5px solid var(--border);border-radius:var(--radius);padding:.7rem .95rem;color:#cbd5e1;font-size:.87rem;cursor:pointer;transition:var(--transition);text-align:left;display:flex;align-items:center;gap:.65rem;-webkit-user-select:none;user-select:none}
  .check-btn:hover{border-color:var(--accent);background:#172040;color:var(--text-primary)}
  .check-btn:active{transform:scale(.985)}
  .check-btn.checked{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary)}
  .check-box{width:17px;height:17px;border:1.5px solid #475569;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:var(--transition);font-size:.7rem;line-height:1;color:#fff}
  .check-btn.checked .check-box{background:var(--accent);border-color:var(--accent)}
  .check-btn .sign-hint{font-size:.6rem;color:var(--text-muted);margin-left:auto;flex-shrink:0;background:#0b1222;padding:.18rem .45rem;border-radius:9999px;font-family:var(--mono);letter-spacing:.04em}
  .check-btn.checked .sign-hint{color:var(--accent-light);background:#0d1b38}
  .check-btn.relevant:not(.checked){border-color:rgba(91,141,239,.28)}

  /* Nav */
  .nav-row{display:flex;gap:.6rem;margin-top:1.4rem}
  .nav-btn{flex:1;padding:.85rem;border-radius:var(--radius);font-size:.88rem;font-weight:600;cursor:pointer;transition:var(--transition);border:none;-webkit-user-select:none;user-select:none;font-family:inherit}
  .nav-btn:active{transform:scale(.97)}
  .nav-btn.secondary{background:#2a3855;color:#cbd5e1}.nav-btn.secondary:hover{background:#344366}
  .nav-btn.primary{background:var(--accent);color:#fff}.nav-btn.primary:hover{background:#4a7ce0}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
  .nav-btn.skip{background:transparent;border:1.5px solid var(--border);color:var(--text-muted);font-weight:500;font-size:.8rem}
  .nav-btn.skip:hover{border-color:var(--accent);color:var(--text-secondary)}

  /* Shake */
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  .shake{animation:shake .45s ease}

  /* Result */
  .result-card{text-align:center;padding:1.75rem 1.35rem}
  .result-plate{display:inline-flex;align-items:center;justify-content:center;width:4rem;height:4rem;border-radius:50%;font-family:var(--serif);font-size:1.4rem;font-weight:700;margin-bottom:1rem;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);letter-spacing:.02em}
  @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .result-plate.p-surgical{background:var(--red-bg);color:var(--red-light);border:2px solid var(--red);animation:popIn .4s cubic-bezier(.34,1.56,.64,1),pulse-red 1.8s ease-in-out .4s infinite}
  .result-plate.p-urgent{background:var(--yellow-bg);color:var(--yellow-light);border:2px solid var(--yellow)}
  .result-plate.p-medical{background:#0d2551;color:#93c5fd;border:2px solid var(--accent)}
  .result-plate.p-low{background:var(--green-bg);color:var(--green-light);border:2px solid var(--green)}
  @keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
  .result-title{font-family:var(--serif);font-size:1.35rem;font-weight:600;margin-bottom:.25rem;letter-spacing:.005em}
  .result-desc{color:var(--text-secondary);font-size:.84rem;margin-bottom:1.1rem;line-height:1.5;max-width:36ch;margin-left:auto;margin-right:auto}
  .patient-line{font-family:var(--mono);font-size:.68rem;color:var(--text-muted);margin-bottom:1.25rem;letter-spacing:.05em;padding-bottom:1rem;border-bottom:1px dashed var(--border)}

  /* Dark box */
  .dark-box{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:1.05rem 1.1rem;text-align:left;margin-bottom:.7rem;transition:border-color .2s}
  .dark-box h3{font-family:var(--mono);font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.13em;margin-bottom:0;font-weight:600}
  .summary-row{display:flex;justify-content:space-between;align-items:baseline;padding:.4rem 0;border-bottom:1px solid rgba(43,54,80,.55);font-size:.82rem;gap:.5rem}
  .summary-row:last-child{border-bottom:none}
  .summary-row:first-child{padding-top:.15rem}
  .summary-row .criteria{color:var(--text-muted);flex-shrink:0;font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;min-width:30%}
  .summary-row .value{font-weight:500;display:flex;align-items:center;gap:.4rem;color:var(--text-primary);text-align:right;flex-wrap:wrap;justify-content:flex-end;min-width:0;word-break:break-word;font-size:.8rem}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-red{background:var(--red)}.dot-yellow{background:var(--yellow)}.dot-green{background:var(--green)}

  /* Abdomen SVG anatomical plate */
  .abdomen-plate{display:flex;justify-content:center;margin:.5rem 0 .75rem}
  .abdomen-svg{width:100%;max-width:290px;height:auto}
  .abd-region{fill:#0e1628;stroke:var(--border);stroke-width:1.3;cursor:pointer;transition:fill .18s,stroke .18s}
  .abd-region:hover{fill:#18233c;stroke:var(--accent)}
  .abd-region.selected{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.8}
  .abd-label{font-family:var(--mono);font-size:8.5px;fill:var(--text-muted);text-anchor:middle;pointer-events:none;letter-spacing:.05em;font-weight:500}
  .abd-region.selected + text.abd-label,
  .abd-region.selected ~ .abd-label{fill:var(--accent-light);font-weight:700}
  .abd-outline{fill:none;stroke:var(--border-soft);stroke-width:1.5;stroke-dasharray:3 3;opacity:.5}
  .abd-umb{fill:var(--text-muted);opacity:.6}
  .abd-side{font-family:var(--mono);font-size:7px;fill:var(--text-muted);opacity:.55;letter-spacing:.1em}
  .abd-caption{font-family:var(--mono);font-size:.6rem;color:var(--text-muted);text-align:center;margin-top:.15rem;letter-spacing:.08em;text-transform:uppercase}
  .abd-diffuse-btn{width:100%;max-width:290px;margin:.5rem auto 0;display:block}

  /* Score section */
  .score-section{background:var(--bg-input);border-radius:var(--radius);padding:1.05rem;text-align:left;margin-bottom:.7rem}
  .score-tabs{display:flex;gap:.35rem;margin-bottom:1rem}
  .score-tab{flex:1;padding:.55rem .3rem;border-radius:var(--radius-sm);font-size:.76rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--bg-input);color:var(--text-muted);text-align:center;transition:var(--transition);-webkit-user-select:none;user-select:none;position:relative;font-family:inherit}
  .score-tab.active{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary)}
  .score-tab.suggested::before{content:'';position:absolute;top:.3rem;left:.3rem;width:5px;height:5px;background:var(--accent-light);border-radius:50%;box-shadow:0 0 6px var(--accent-light)}
  .score-tab:hover{border-color:var(--accent)}
  .score-tab .tab-check{position:absolute;top:-.3rem;right:-.3rem;font-size:.55rem;background:var(--accent);color:#fff;width:.95rem;height:.95rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
  .score-row{margin-bottom:.6rem}
  .score-row-label{font-size:.78rem;color:var(--text-secondary);margin-bottom:.3rem;display:flex;justify-content:space-between;align-items:center;line-height:1.35}
  .score-row-label .auto-tag{font-size:.55rem;background:var(--accent-bg);color:var(--accent-light);padding:.1rem .4rem;border-radius:9999px;font-weight:600;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase}
  .score-options{display:flex;gap:.35rem}
  .score-opt{flex:1;padding:.5rem .3rem;border-radius:var(--radius-sm);font-size:.72rem;cursor:pointer;border:1.5px solid var(--border);background:var(--bg-input);color:var(--text-muted);text-align:center;transition:var(--transition);line-height:1.25;-webkit-user-select:none;user-select:none;font-family:inherit}
  .score-opt:hover{border-color:var(--accent);color:#cbd5e1}
  .score-opt:active{transform:scale(.96)}
  .score-opt.picked{border-color:var(--accent);background:var(--accent-bg);color:var(--text-primary);font-weight:600}
  .score-opt .pts{display:block;font-size:.55rem;color:var(--text-muted);margin-top:.1rem;font-family:var(--mono)}.score-opt.picked .pts{color:#93c5fd}
  .score-result{display:flex;align-items:center;gap:.85rem;padding:.85rem;border-radius:var(--radius);margin-top:.65rem}
  .score-result.sr-high{background:var(--red-bg);border:1px solid var(--red-dark)}
  .score-result.sr-mod{background:var(--yellow-bg);border:1px solid var(--yellow-dark)}
  .score-result.sr-low{background:var(--green-bg);border:1px solid var(--green-dark)}
  .score-result.sr-pending{background:var(--bg-card);border:1px dashed var(--border)}
  .score-num{font-family:var(--serif);font-size:1.9rem;font-weight:700;min-width:2.2rem;text-align:center;line-height:1}
  .score-result.sr-high .score-num{color:var(--red-light)}
  .score-result.sr-mod .score-num{color:var(--yellow-light)}
  .score-result.sr-low .score-num{color:var(--green-light)}
  .score-result.sr-pending .score-num{color:var(--text-muted)}
  .score-info{flex:1}.score-info .score-label{font-size:.82rem;font-weight:600;color:var(--text-primary)}
  .score-info .score-detail{font-size:.72rem;color:var(--text-secondary);margin-top:.15rem;line-height:1.45}

  /* Conduta box */
  .conduta-box{border-radius:var(--radius);padding:1.05rem 1.1rem;text-align:left;margin-bottom:.7rem}
  .conduta-box h3{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.13em;margin-bottom:0;font-weight:700}
  .conduta-box.alta-prob{background:var(--red-bg);border:1px solid var(--red-dark)}.conduta-box.alta-prob h3{color:var(--red-light)}
  .conduta-box.mod-prob{background:var(--yellow-bg);border:1px solid var(--yellow-dark)}.conduta-box.mod-prob h3{color:var(--yellow-light)}
  .conduta-box.baixa-prob{background:var(--green-bg);border:1px solid var(--green-dark)}.conduta-box.baixa-prob h3{color:var(--green-light)}
  .conduta-box.neutra-prob{background:var(--bg-card);border:1px solid var(--border)}.conduta-box.neutra-prob h3{color:var(--text-secondary)}
  .conduta-item{display:flex;align-items:flex-start;gap:.6rem;padding:.4rem 0;font-size:.82rem;color:#cbd5e1;line-height:1.5;border-bottom:1px solid rgba(43,54,80,.35)}
  .conduta-item:last-child{border-bottom:none}
  .conduta-bul{flex-shrink:0;width:.5rem;height:.5rem;margin-top:.45rem;border-radius:50%;background:currentColor;opacity:.55}
  .conduta-box.alta-prob .conduta-bul{color:var(--red)}
  .conduta-box.mod-prob .conduta-bul{color:var(--yellow)}
  .conduta-box.baixa-prob .conduta-bul{color:var(--green)}
  .conduta-box.neutra-prob .conduta-bul{color:var(--accent)}

  /* Dx list */
  .dx-list{display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem}
  .dx-item{display:flex;align-items:center;gap:.65rem;padding:.55rem .75rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.82rem;color:#cbd5e1;transition:var(--transition)}
  .dx-item:hover{border-color:rgba(91,141,239,.35)}
  .dx-item .dx-rank{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--accent-light);min-width:1.2rem;text-align:center}
  .dx-item .dx-name{flex:1;min-width:0}
  .dx-item .dx-prob{font-family:var(--mono);font-size:.58rem;font-weight:600;padding:.18rem .5rem;border-radius:9999px;flex-shrink:0;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
  .dx-prob.prob-high{background:#5a0f0f;color:var(--red-light)}
  .dx-prob.prob-mod{background:#3a2706;color:var(--yellow-light)}
  .dx-prob.prob-low{background:#0b2e17;color:var(--green-light)}

  /* Collapsible */
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;padding:.1rem 0}
  .collapse-header:hover h3{color:var(--text-secondary)}
  .collapse-header:active{opacity:.8}
  .collapse-header h3{transition:color .2s}
  .collapse-arrow{font-size:.6rem;color:var(--text-muted);transition:transform .3s ease;padding:.15rem}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .32s ease,opacity .22s ease}
  .collapse-body.hidden{max-height:0!important;padding-top:0;margin-top:0;opacity:0}
  .collapse-body.visible{max-height:5000px;opacity:1}

  /* Note */
  .note-text{background:#07101f;border:1px solid var(--border);border-radius:var(--radius-sm);padding:.85rem;font-family:var(--mono);font-size:.66rem;color:#cbd5e1;white-space:pre-wrap;line-height:1.65;max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:.6rem}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.6rem;padding:.7rem;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg-card);color:#cbd5e1;font-size:.8rem;font-weight:600;cursor:pointer;transition:var(--transition);-webkit-user-select:none;user-select:none;font-family:inherit}
  .copy-btn:hover{border-color:var(--accent);background:#172040;color:var(--text-primary)}
  .copy-btn:active{transform:scale(.98)}
  .copy-btn.copied{border-color:var(--green);background:var(--green-bg);color:var(--green-light)}

  /* Connector */
  .flow-connector{display:flex;justify-content:center;padding:.1rem 0}
  .flow-connector .arrow{width:1px;height:14px;background:var(--border)}

  /* Workup tags */
  .workup-section{margin-top:.5rem}
  .workup-heading{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.13em;margin-bottom:.45rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
  .workup-heading.urgent-h{color:var(--red-light)}
  .workup-heading.routine-h{color:var(--accent-light);margin-top:.85rem}
  .workup-heading::after{content:'';flex:1;height:1px;background:var(--border);opacity:.4}
  .workup-tags{display:flex;flex-wrap:wrap;gap:.3rem}
  .workup-tag{font-size:.72rem;padding:.3rem .6rem;border-radius:9999px;background:var(--bg-card);border:1px solid var(--border);color:#cbd5e1}
  .workup-tag.urgent{background:#3a0a0a;border-color:var(--red-dark);color:var(--red-light)}
  .workup-tag.routine{background:#0d1b38;border-color:#1e40af;color:#93c5fd}

  /* Info hint */
  .info-hint{font-size:.74rem;color:var(--text-secondary);background:rgba(91,141,239,.05);border-left:2px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.6rem .85rem;margin-top:.8rem;line-height:1.5;animation:fadeIn .25s ease}
  .info-hint strong{color:var(--accent-light);font-weight:600}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* Red flag */
  .red-flag{background:rgba(239,68,68,.06);border-left:2px solid var(--red);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.65rem .85rem;margin-top:.8rem;font-size:.77rem;color:#fecaca;line-height:1.5;animation:fadeIn .25s ease}
  .red-flag strong{display:block;margin-bottom:.25rem;color:var(--red-light);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}

  /* Analgesia */

  {id:'hypertension',label:'Hipertensao'},

  {id:'prev_episodes',label:'Episodios previos semelhantes'},
  {id:'renal_insuff',label:'Insuficiencia renal'},
  {id:'liver_disease',label:'Hepatopatia cronica'},
  {id:'obesity',label:'Obesidade'},
  {id:'transplant',label:'Transplante de orgao'},
];

const ALVARADO=[
  {id:'alv_migration',label:'Migracao da dor para FID',pts:1},
  {id:'alv_anorexia',label:'Anorexia',pts:1},
  {id:'alv_nausea',label:'Nausea / Vomitos',pts:1},
  {id:'alv_rlq_tender',label:'Dor a palpacao em FID',pts:2},
  {id:'alv_rebound',label:'Descompressao brusca +',pts:1},
  {id:'alv_fever',label:'Temperatura > 37,3 \u00B0C',pts:1},
  {id:'alv_leukocytosis',label:'Leucocitose > 10.000',pts:2},
  {id:'alv_left_shift',label:'Desvio a esquerda (> 75% neutrofilos)',pts:1},
];

const RANSON_ADMIT=[
  {id:'ran_age',label:'Idade > 55 anos',pts:1},
  {id:'ran_wbc',label:'Leucocitos > 16.000',pts:1},
  {id:'ran_glucose',label:'Glicose > 200 mg/dL',pts:1},
  {id:'ran_ldh',label:'LDH > 350 U/L',pts:1},
  {id:'ran_ast',label:'AST > 250 U/L',pts:1},
];

const RANSON_48H=[
  {id:'ran_hct',label:'Queda Hct > 10%',pts:1},
  {id:'ran_bun',label:'Aumento BUN > 5 mg/dL',pts:1},
  {id:'ran_calcium',label:'Calcio < 8 mg/dL',pts:1},
  {id:'ran_pao2',label:'PaO\u2082 < 60 mmHg',pts:1},
  {id:'ran_base',label:'Deficit de base > 4 mEq/L',pts:1},
  {id:'ran_fluid',label:'Sequestro liquido > 6L',pts:1},
];

const BISAP=[
  {id:'bisap_bun',label:'BUN > 25 mg/dL',pts:1},
  {id:'bisap_mental',label:'Alteracao do nivel de consciencia (Glasgow < 15)',pts:1},
  {id:'bisap_sirs',label:'SIRS (\u2265 2 criterios)',pts:1},
  {id:'bisap_age',label:'Idade > 60 anos',pts:1},
  {id:'bisap_effusion',label:'Derrame pleural na imagem',pts:1},
];

// =============================================
// STATE
// =============================================
let step=0;
let location=null;
let painOnset=null;
let painQuality=new Set();
let painRadiation=new Set();
let aggravating=new Set();
let relieving=new Set();
let assocSymptoms=new Set();
let peritonealSigns=new Set();
let specificSigns=new Set();
let vitalSigns=new Set();
let pastHistory=new Set();
let patAge=null;
let patSex=null;
let lmpStatus=null;
let painDuration=null;
let painIntensity=null;
let activeScoreTab='alvarado';
let alvaradoState={};
let ransonAdmitState={};
let ranson48hState={};
let bisapState={};
let sections={summary:true,ddx:true,scores:true,workup:true,conduta:true,analgesia:false,note:false};
let showRestartModal=false;
const evalStartTime=new Date();

const app=document.getElementById('app');

// =============================================
// AUTO-FILL HELPERS
// =============================================
function autoAlvarado(){
  const a={...alvaradoState};
  if(assocSymptoms.has('anorexia')&&a['alv_anorexia']===undefined) a['alv_anorexia']=1;
  if((assocSymptoms.has('nausea')||assocSymptoms.has('vomiting'))&&a['alv_nausea']===undefined) a['alv_nausea']=1;
  if(specificSigns.has('mcburney')&&a['alv_rlq_tender']===undefined) a['alv_rlq_tender']=1;
  if(peritonealSigns.has('rebound')&&a['alv_rebound']===undefined) a['alv_rebound']=1;
  if((assocSymptoms.has('fever')||vitalSigns.has('fever_vs'))&&a['alv_fever']===undefined) a['alv_fever']=1;
  if(location==='rlq'&&a['alv_migration']===undefined) a['alv_migration']=1;
  if(specificSigns.has('dunphy')&&a['alv_rebound']===undefined) a['alv_rebound']=1;
  return a;
}

function autoRansonAdmit(){
  const r={...ransonAdmitState};
  if(patAge===3&&r['ran_age']===undefined) r['ran_age']=1;
  return r;
}

function autoBISAP(){
  const b={...bisapState};
  if(patAge===3&&b['bisap_age']===undefined) b['bisap_age']=1;
  let sirsCount=0;
  if(vitalSigns.has('tachycardia')) sirsCount++;
  if(vitalSigns.has('fever_vs')||vitalSigns.has('hypothermia')) sirsCount++;
  if(vitalSigns.has('tachypnea')) sirsCount++;
  if(sirsCount>=2&&b['bisap_sirs']===undefined) b['bisap_sirs']=1;
  return b;
}

function getAlvaradoScore(){
  const a=autoAlvarado();
  let total=0,filled=0;
  for(const i of ALVARADO){if(a[i.id]!==undefined){filled++;if(a[i.id])total+=i.pts;}}
  return filled<ALVARADO.length?null:total;
}
function getRansonAdmitScore(){
  const r=autoRansonAdmit();
  let total=0,filled=0;
  for(const i of RANSON_ADMIT){if(r[i.id]!==undefined){filled++;if(r[i.id])total+=i.pts;}}
  return filled<RANSON_ADMIT.length?null:total;
}
function getRanson48hScore(){
  let total=0,filled=0;
  for(const i of RANSON_48H){if(ranson48hState[i.id]!==undefined){filled++;if(ranson48hState[i.id])total+=i.pts;}}
  return filled<RANSON_48H.length?null:total;
}
function getRansonTotal(){const a=getRansonAdmitScore(),b=getRanson48hScore();return a===null?null:(b===null?null:a+b);}
function getRansonDisplay(){
  const t=getRansonTotal();if(t!==null) return {score:t,partial:false};
  const a=getRansonAdmitScore();if(a!==null) return {score:a,partial:true};
  return null;
}
function getBISAPScore(){
  const b=autoBISAP();
  let total=0,filled=0;
  for(const i of BISAP){if(b[i.id]!==undefined){filled++;if(b[i.id])total+=i.pts;}}
  return filled<BISAP.length?null:total;
}

// =============================================
// RISK STRATIFICATION
// =============================================
function isSurgicalAbdomen(){
  if(peritonealSigns.has('rigidity')) return true;
  if(peritonealSigns.has('guarding')&&peritonealSigns.has('rebound')) return true;
  if(peritonealSigns.has('absent_bs')&&(peritonealSigns.has('guarding')||peritonealSigns.has('rebound'))) return true;
  if(vitalSigns.has('hypotension')&&peritonealSigns.size>0) return true;
  return false;
}

function isUrgent(){
  if(vitalSigns.has('hypotension')) return true;
  if(vitalSigns.has('tachycardia')&&(assocSymptoms.has('hematochezia')||assocSymptoms.has('hematemesis'))) return true;
  if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')) return true;
  if(peritonealSigns.size>=2) return true;
  if(painOnset==='sudden'&&painIntensity===2) return true;
  if(assocSymptoms.has('syncope')&&vitalSigns.has('tachycardia')) return true;
  if(painQuality.has('tearing')&&painRadiation.has('back')) return true;
  if(patSex==='F'&&lmpStatus==='possible'&&assocSymptoms.has('vaginal_bleeding')) return true;
  if(patSex==='F'&&lmpStatus==='possible'&&assocSymptoms.has('syncope')) return true;
  if(patAge===3&&painOnset==='sudden'&&(location==='diffuse'||location==='periumbilical')) return true;
  if(painQuality.has('tearing')&&(vitalSigns.has('tachycardia')||assocSymptoms.has('syncope'))) return true;
  if(pastHistory.has('corticosteroid')&&peritonealSigns.size>=1&&assocSymptoms.has('fever')) return true;
  if(vitalSigns.has('hypothermia')&&assocSymptoms.has('fever')) return true;
  if(pastHistory.has('transplant')&&assocSymptoms.has('fever')) return true;
  if(pastHistory.has('immunosupp')&&assocSymptoms.has('fever')&&painIntensity>=1) return true;
  return false;
}

function getRiskLevel(){
  if(isSurgicalAbdomen()) return 'surgical';
  if(isUrgent()) return 'urgent';
  if(peritonealSigns.size===0&&!vitalSigns.has('hypotension')&&!vitalSigns.has('tachycardia')&&!assocSymptoms.has('syncope')) return 'low';
  return 'medical';
}

function getRiskInfo(){
  const r=getRiskLevel();
  if(r==='surgical') return {level:'surgical',title:'Abdome Cirurgico',desc:'Irritacao peritoneal difusa e/ou instabilidade. Avaliacao cirurgica de urgencia.',badge:'p-surgical',initial:'C'};
  if(r==='urgent') return {level:'urgent',title:'Urgencia',desc:'Sinais de alarme presentes. Investigacao rapida e reavaliacao frequente.',badge:'p-urgent',initial:'U'};
  if(r==='medical') return {level:'medical',title:'Manejo Clinico',desc:'Achados sugestivos de etiologia clinica. Investigacao direcionada.',badge:'p-medical',initial:'M'};
  return {level:'low',title:'Baixo Risco',desc:'Sem sinais de alarme. Considerar avaliacao ambulatorial ou observacao breve.',badge:'p-low',initial:'B'};
}

// =============================================
// RED FLAGS
// =============================================
function getRedFlags(){
  const flags=[];
  if(vitalSigns.has('hypotension')) flags.push('Hipotensao \u2014 avaliar choque');
  if(peritonealSigns.has('rigidity')) flags.push('Abdome em tabua \u2014 peritonite difusa');
  if(painOnset==='sudden'&&painIntensity===2) flags.push('Dor subita intensa \u2014 considerar perfuracao, rotura ou torcao');
  if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')&&location==='ruq') flags.push('Triade de Charcot \u2014 colangite aguda');
  if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')&&vitalSigns.has('hypotension')) flags.push('Pentade de Reynolds \u2014 colangite supurativa');
  if(assocSymptoms.has('syncope')) flags.push('Sincope \u2014 avaliar sangramento ou instabilidade');
  if(patAge===3&&painOnset==='sudden'&&(location==='diffuse'||location==='periumbilical')) flags.push('Idoso + dor difusa subita \u2014 excluir isquemia mesenterica e AAA');
  if(assocSymptoms.has('hematemesis')||assocSymptoms.has('hematochezia')) flags.push('Sangramento GI \u2014 avaliar estabilidade e Hb');
  if(patSex==='F'&&lmpStatus==='possible'&&(assocSymptoms.has('vaginal_bleeding')||vitalSigns.has('hypotension'))) flags.push('Gravidez ectopica rota ate que se prove o contrario');
  if(patSex==='F'&&lmpStatus==='possible'&&assocSymptoms.has('amenorrhea')) flags.push('Amenorreia em idade fertil \u2014 beta-hCG obrigatorio');
  if(specificSigns.has('cullen')||specificSigns.has('grey_turner')) flags.push('Sinais de hemorragia retroperitoneal');
  if(painIntensity===2&&peritonealSigns.size===0&&patAge!==null&&patAge>=3) flags.push('Dor intensa sem peritonismo em idoso \u2014 considerar isquemia mesenterica');
  if(painIntensity===2&&peritonealSigns.size===0&&patAge===2&&pastHistory.has('atrial_fib')) flags.push('Dor intensa sem peritonismo + FA \u2014 considerar isquemia mesenterica');
  if(patAge===3&&vitalSigns.has('tachycardia')&&!assocSymptoms.has('fever')) flags.push('Taquicardia sem febre em idoso \u2014 avaliar hemorragia oculta');
  if(pastHistory.has('immunosupp')&&assocSymptoms.has('fever')) flags.push('Febre em imunossuprimido \u2014 infeccao oportunista / apresentacao atipica');
  if(pastHistory.has('transplant')&&assocSymptoms.has('fever')) flags.push('Febre em transplantado \u2014 menor limiar para internacao');
  if(pastHistory.has('corticosteroid')&&peritonealSigns.size>0) flags.push('Corticoides podem mascarar peritonismo \u2014 menor limiar para imagem');
  if(painQuality.has('tearing')&&painRadiation.has('back')) flags.push('Dor dilacerante com irradiacao dorsal \u2014 excluir disseccao / AAA roto');
  if(patAge===0&&assocSymptoms.has('fever')&&peritonealSigns.size>0) flags.push('Pediatria + febre + peritonismo \u2014 apendicite / peritonite primaria');
  if(vitalSigns.has('hypothermia')) flags.push('Hipotermia \u2014 possivel sepse ou choque');
  if(assocSymptoms.has('chest_pain')&&location==='epigastric') flags.push('Dor toracica + epigastralgia \u2014 excluir IAM / SCA');
  if(patAge===0&&assocSymptoms.has('hematochezia')&&painQuality.has('colicky')) flags.push('Pediatria + colica + hematoquezia \u2014 considerar intussuscepcao');
  return flags;
}

// =============================================
// DIFFERENTIAL DIAGNOSIS ENGINE
// =============================================
function buildDifferentials(){
  if(!location) return [];
  const base=LOCATION_DDX[location]||[];
  let scored=base.map((dx,i)=>({name:dx,score:base.length-i}));

  for(const s of scored){
    const n=s.name.toLowerCase();
    if(n.includes('apendicite')){
      if(specificSigns.has('mcburney')) s.score+=5;
      if(specificSigns.has('rovsing')) s.score+=3;
      if(specificSigns.has('psoas')) s.score+=2;
      if(specificSigns.has('obturator')) s.score+=2;
      if(specificSigns.has('dunphy')) s.score+=2;
      if(assocSymptoms.has('anorexia')) s.score+=2;
      if(assocSymptoms.has('nausea')||assocSymptoms.has('vomiting')) s.score+=1;
      if(assocSymptoms.has('fever')) s.score+=1;
      if(location==='rlq') s.score+=3;
      if(patAge===1) s.score+=1;
      if(painDuration!==null&&painDuration<=1) s.score+=1;
    }
    if(n.includes('colecistite')){
      if(specificSigns.has('murphy')) s.score+=5;
      if(painRadiation.has('shoulder_r')||painRadiation.has('scapular')) s.score+=3;
      if(assocSymptoms.has('nausea')||assocSymptoms.has('vomiting')) s.score+=1;
      if(painQuality.has('colicky')) s.score+=2;
      if(aggravating.has('eating')) s.score+=2;
      if(patSex==='F') s.score+=1;
      if(patAge!==null&&patAge>=2) s.score+=1;
      if(assocSymptoms.has('fever')) s.score+=1;
      if(pastHistory.has('obesity')) s.score+=1;
    }
    if(n.includes('biliar')){
      if(painQuality.has('colicky')) s.score+=3;
      if(aggravating.has('eating')) s.score+=3;
      if(painRadiation.has('shoulder_r')||painRadiation.has('scapular')) s.score+=2;
      if(relieving.has('fasting')) s.score+=2;
      if(patSex==='F') s.score+=1;
      if(pastHistory.has('obesity')) s.score+=1;
    }
    if(n.includes('colangite')){
      if(assocSymptoms.has('fever')&&assocSymptoms.has('jaundice')) s.score+=5;
      if(vitalSigns.has('hypotension')) s.score+=2;
      if(assocSymptoms.has('jaundice')) s.score+=2;
    }
    if(n.includes('pancreatite')){
      if(painRadiation.has('back')) s.score+=4;
      if(relieving.has('flexion')) s.score+=3;
      if(painQuality.has('constant')) s.score+=2;
      if(assocSymptoms.has('vomiting')) s.score+=2;
      if(specificSigns.has('cullen')||specificSigns.has('grey_turner')) s.score+=4;
      if(pastHistory.has('alcohol')) s.score+=3;
      if(location==='epigastric') s.score+=2;
    }
    if(n.includes('obstru')){
      if(assocSymptoms.has('vomiting')&&assocSymptoms.has('constipation')) s.score+=5;
      if(peritonealSigns.has('absent_bs')) s.score+=3;
      if(peritonealSigns.has('hyper_bs')) s.score+=3;
      if(painQuality.has('colicky')) s.score+=3;
      if(assocSymptoms.has('distension')) s.score+=3;
      if(peritonealSigns.has('visible_distension')) s.score+=2;
      if(location==='diffuse'||location==='periumbilical') s.score+=2;
      if(pastHistory.has('prev_surgery')) s.score+=4;
    }
    if(n.includes('peritonite')){
      if(peritonealSigns.has('rigidity')) s.score+=5;
      if(peritonealSigns.has('guarding')&&peritonealSigns.has('rebound')) s.score+=4;
      if(peritonealSigns.has('absent_bs')) s.score+=2;
      if(assocSymptoms.has('fever')) s.score+=1;
      if(specificSigns.has('dunphy')) s.score+=2;
    }
    if(n.includes('cistite')||n.includes('itu')){
      if(assocSymptoms.has('dysuria')) s.score+=5;
      if(assocSymptoms.has('hematuria')) s.score+=3;
      if(patSex==='F') s.score+=1;
    }
    if(n.includes('pielonefrite')){
      if(assocSymptoms.has('fever')) s.score+=3;
      if(assocSymptoms.has('dysuria')) s.score+=2;
      if(specificSigns.has('giordano')) s.score+=4;
    }
    if(n.includes('lica renal')||n.includes('lit')){
      if(painQuality.has('colicky')) s.score+=3;
      if(painRadiation.has('groin')) s.score+=4;
      if(assocSymptoms.has('hematuria')) s.score+=3;
      if(specificSigns.has('giordano')) s.score+=3;
      if(painOnset==='sudden'||painOnset==='acute') s.score+=2;
    }
    if(n.includes('ect\u00F3pica')||n.includes('ectopica')){
      if(patSex==='F'&&lmpStatus==='possible') s.score+=5;
      if(assocSymptoms.has('vaginal_bleeding')) s.score+=4;
      if(assocSymptoms.has('amenorrhea')) s.score+=3;
      if(vitalSigns.has('hypotension')) s.score+=3;
      if(assocSymptoms.has('syncope')) s.score+=2;
    }
    if(n.includes('tor\u00E7\u00E3o de ov\u00E1rio')||n.includes('torcao de ovario')){
      if(patSex==='F') s.score+=2;
      if(painOnset==='sudden') s.score+=3;
      if(assocSymptoms.has('nausea')||assocSymptoms.has('vomiting')) s.score+=1;
    }
    if(n.includes('diverticulite')){
      if(patAge!==null&&patAge>=2) s.score+=2;
      if(assocSymptoms.has('fever')) s.score+=2;
      if(assocSymptoms.has('constipation')) s.score+=1;
      if(location==='llq') s.score+=3;
      if(painDuration!==null&&painDuration>=1) s.score+=1;
    }
    if(n.includes('gastroenterite')){
      if(assocSymptoms.has('diarrhea')) s.score+=4;
      if(assocSymptoms.has('nausea')&&assocSymptoms.has('vomiting')) s.score+=2;
      if(peritonealSigns.size===0) s.score+=2;
    }
    if(n.includes('lcera')){
      if(painQuality.has('burning')) s.score+=3;
      if(relieving.has('antacids')) s.score+=3;
      if(aggravating.has('eating')) s.score+=1;
      if(pastHistory.has('nsaid')) s.score+=3;
      if(pastHistory.has('corticosteroid')) s.score+=1;
      if(assocSymptoms.has('hematemesis')) s.score+=3;
    }
    if(n.includes('isquemia mesent')){
      if(patAge!==null&&patAge>=3) s.score+=3;
      if(painOnset==='sudden'&&painIntensity===2) s.score+=3;
      if(painIntensity===2&&peritonealSigns.size===0) s.score+=4;
      if(pastHistory.has('atrial_fib')) s.score+=4;
      if(pastHistory.has('anticoag')) s.score-=1;
    }
    if(n.includes('aaa')||n.includes('aneurisma')){
      if(patAge!==null&&patAge>=3) s.score+=2;
      if(painOnset==='sudden') s.score+=2;
      if(vitalSigns.has('hypotension')) s.score+=3;
      if(painRadiation.has('back')) s.score+=2;
      if(painQuality.has('tearing')) s.score+=3;
      if(pastHistory.has('hypertension')) s.score+=2;
      if(pastHistory.has('smoking')) s.score+=2;
      if(patSex==='M') s.score+=1;
    }
    if(n.includes('dip')||n.includes('fitz-hugh')){
      if(patSex==='F') s.score+=2;
      if(assocSymptoms.has('fever')) s.score+=2;
      if(assocSymptoms.has('vaginal_bleeding')) s.score+=1;
    }
    if(n.includes('rnia')){
      if(aggravating.has('valsalva')) s.score+=3;
      if(pastHistory.has('prev_surgery')) s.score+=1;
      if(pastHistory.has('obesity')) s.score+=1;
    }
    if(n.includes('pneumonia')){
      if(vitalSigns.has('tachypnea')) s.score+=3;
      if(assocSymptoms.has('fever')) s.score+=2;
      if(vitalSigns.has('sat_low')) s.score+=3;
      if(assocSymptoms.has('chest_pain')) s.score+=2;
    }
    if(n.includes('iam')){
      if(patAge!==null&&patAge>=2) s.score+=2;
      if(pastHistory.has('diabetes')) s.score+=2;
      if(pastHistory.has('hypertension')) s.score+=1;
      if(painRadiation.has('chest')) s.score+=2;
      if(assocSymptoms.has('chest_pain')) s.score+=3;
    }
    if(n.includes('prostatite')){
      if(patSex==='M') s.score+=2;
      if(assocSymptoms.has('dysuria')) s.score+=2;
      if(assocSymptoms.has('fever')) s.score+=2;
    }
    if(n.includes('cetoacidose')){
      if(pastHistory.has('diabetes')) s.score+=5;
      if(vitalSigns.has('tachypnea')) s.score+=2;
    }
    if(n.includes('crohn')||n.includes('colite')){
      if(pastHistory.has('ibd')) s.score+=5;
      if(assocSymptoms.has('diarrhea')) s.score+=2;
      if(assocSymptoms.has('hematochezia')) s.score+=2;
      if(assocSymptoms.has('weight_loss')) s.score+=1;
    }
    if(n.includes('hepatite')){
      if(assocSymptoms.has('jaundice')) s.score+=4;
      if(assocSymptoms.has('anorexia')) s.score+=1;
      if(assocSymptoms.has('nausea')) s.score+=1;
      if(pastHistory.has('alcohol')) s.score+=2;
    }
    if(n.includes('abscesso hepatico')||n.includes('abscesso hep')){
      if(assocSymptoms.has('fever')) s.score+=3;
      if(assocSymptoms.has('jaundice')) s.score+=1;
      if(pastHistory.has('diabetes')) s.score+=1;
    }
    if(n.includes('herpes')){
      if(painQuality.has('burning')||painQuality.has('sharp')) s.score+=2;
      if(painRadiation.has('none')) s.score+=1;
      if(patAge!==null&&patAge>=2) s.score+=1;
      if(pastHistory.has('immunosupp')) s.score+=2;
    }
    if(n.includes('porfiria')){
      if(patSex==='F') s.score+=1;
      if(painQuality.has('colicky')) s.score+=2;
      if(assocSymptoms.has('constipation')) s.score+=1;
      if(assocSymptoms.has('nausea')||assocSymptoms.has('vomiting')) s.score+=1;
      if(peritonealSigns.size===0) s.score+=2;
    }
    if(n.includes('tiflite')){
      if(pastHistory.has('immunosupp')) s.score+=4;
      if(pastHistory.has('transplant')) s.score+=3;
      if(assocSymptoms.has('fever')) s.score+=2;
      if(assocSymptoms.has('diarrhea')) s.score+=1;
    }
    if(n.includes('vasculite')){
      if(pastHistory.has('immunosupp')) s.score+=2;
      if(assocSymptoms.has('hematochezia')) s.score+=2;
    }
    if(n.includes('retencao urinaria')){
      if(patSex==='M'&&patAge!==null&&patAge>=3) s.score+=3;
      if(assocSymptoms.has('dysuria')) s.score+=1;
    }
    if(n.includes('perfura')||n.includes('rotura')){
      if(painOnset==='sudden') s.score+=3;
    }
    if(n.includes('infarto esplenico')||n.includes('pneumonia')){
      if(specificSigns.has('kehr')) s.score+=3;
    }
    if(n.includes('intussus')){
      if(patAge===0) s.score+=3;
      if(painQuality.has('colicky')&&assocSymptoms.has('hematochezia')) s.score+=4;
    }
  }

  if(patSex==='M'){
    scored=scored.filter(d=>{
      const dl=d.name.toLowerCase();
      return !['ect\u00F3pica','ectopica','tor\u00E7\u00E3o de ov\u00E1rio','torcao de ovario','dip','endometriose','fitz-hugh','amenorr'].some(g=>dl.includes(g));
    });
  }
  if(patSex==='F'){
    scored=scored.filter(d=>!d.name.toLowerCase().includes('prostatite'));
  }

  if(patAge===0){
    scored.forEach(d=>{
      const dl=d.name.toLowerCase();
      if(dl.includes('aneurisma')||dl.includes('aaa')) d.score-=3;
      if(dl.includes('diverticulite')) d.score-=3;
      if(dl.includes('iam')) d.score-=4;
      if(dl.includes('isquemia mesent')) d.score-=3;
      if(dl.includes('linfadenite')) d.score+=2;
    });
  }
  if(patAge===3){
    scored.forEach(d=>{
      const dl=d.name.toLowerCase();
      if(dl.includes('isquemia')||dl.includes('aneurisma')||dl.includes('aaa')) d.score+=2;
      if(dl.includes('dispepsia funcional')) d.score-=2;
      if(dl.includes('linfadenite')) d.score-=2;
    });
  }

  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,7);
}

// =============================================
// WORKUP
// =============================================
function buildWorkup(){
  const risk=getRiskLevel();
  const urgent=[];
  const routine=[];

  routine.push('Hemograma completo');
  routine.push('PCR');

  if(risk==='surgical'||risk==='urgent'){
    urgent.push('Tipo sanguineo + Reserva');
    urgent.push('Lactato');
    urgent.push('Gasometria arterial');
  }

  if(location==='ruq'||assocSymptoms.has('jaundice')){
    routine.push('TGO / TGP / FA / GGT');
    routine.push('Bilirrubinas');
    urgent.push('USG de abdome superior');
  }
  if(location==='epigastric'||location==='ruq'){
    routine.push('Amilase / Lipase');
  }
  if(location==='rlq'||location==='llq'||location==='periumbilical'){
    if(risk!=='low') urgent.push('TC de abdome com contraste');
  }
  if(location==='flank_r'||location==='flank_l'){
    routine.push('EAS / Urina tipo I');
    routine.push('Ureia / Creatinina');
    if(painQuality.has('colicky')||assocSymptoms.has('hematuria')){
      urgent.push('TC de abdome sem contraste (protocolo litiase)');
    } else {
      urgent.push('USG de vias urinarias');
    }
  }
  if(location==='suprapubic'||assocSymptoms.has('dysuria')||assocSymptoms.has('hematuria')){
    routine.push('EAS / Urina tipo I');
    routine.push('Urocultura');
  }
  if(patSex==='F'&&lmpStatus==='possible'){
    urgent.push('Beta-hCG quantitativo');
    if(assocSymptoms.has('vaginal_bleeding')||vitalSigns.has('hypotension')||assocSymptoms.has('syncope')){
      urgent.push('USG transvaginal');
    }
  }
  if(patSex==='F'&&lmpStatus!=='na'&&lmpStatus!=='possible'&&patAge!==0&&patAge!==null){
    routine.push('Beta-hCG (se idade fertil)');
  }
  if(patSex==='F'&&assocSymptoms.has('amenorrhea')&&lmpStatus!=='na'){
    urgent.push('Beta-hCG quantitativo');
  }
  if(assocSymptoms.has('constipation')||peritonealSigns.has('absent_bs')||assocSymptoms.has('distension')||peritonealSigns.has('visible_distension')){
    urgent.push('Rx abdome (3 incidencias)');
  }
  if(assocSymptoms.has('hematochezia')||assocSymptoms.has('hematemesis')){
    if(vitalSigns.has('tachycardia')||vitalSigns.has('hypotension')){
      urgent.push('Hemotransfusao se Hb baixa');
    }
    if(assocSymptoms.has('hematemesis')) urgent.push('EDA de urgencia');
    if(assocSymptoms.has('hematochezia')) routine.push('Colonoscopia (programar)');
  }
  if(location==='diffuse'){
    urgent.push('TC de abdome com contraste');
    routine.push('Amilase / Lipase');
    routine.push('TGO / TGP / FA / GGT');
  }
  if(vitalSigns.has('hypotension')){
    urgent.push('Acesso venoso calibroso x2');
    urgent.push('Reposicao volemica agressiva');
  }
  if(assocSymptoms.has('fever')){
    routine.push('Hemoculturas (2 pares)');
  }
  if(pastHistory.has('anticoag')){
    urgent.push('Coagulograma (TAP/INR + TTPA)');
  }
  if(pastHistory.has('diabetes')){
    routine.push('Glicemia');
    routine.push('HbA1c');
    if(location==='diffuse'||vitalSigns.has('tachypnea')){
      routine.push('Cetonuria / Cetonemia');
    }
  }
  if(location==='epigastric'&&patAge!==null&&patAge>=2){
    routine.push('ECG (excluir IAM inferior)');
  }
  if(assocSymptoms.has('chest_pain')){
    urgent.push('ECG 12 derivacoes');
    urgent.push('Troponina');
  }
  if(vitalSigns.has('tachypnea')||vitalSigns.has('sat_low')){
    urgent.push('Rx de torax');
    if(risk==='surgical'||risk==='urgent') urgent.push('Gasometria arterial');
  }
  if(pastHistory.has('renal_insuff')){
    routine.push('Ureia / Creatinina');
    routine.push('Eletrolitos (Na, K, Mg)');
  }
  if(pastHistory.has('liver_disease')){
    routine.push('TGO / TGP / FA / GGT');
    routine.push('Albumina');
    routine.push('Coagulograma (TAP/INR + TTPA)');
  }
  if(patAge===3&&(location==='diffuse'||location==='periumbilical')&&painIntensity===2){
    urgent.push('Lactato');
    urgent.push('Angio-TC de abdome');
  }
  if(pastHistory.has('immunosupp')||pastHistory.has('transplant')){
    routine.push('Hemoculturas (2 pares)');
    routine.push('Procalcitonina');
  }

  routine.push('Ureia / Creatinina');
  routine.push('Eletrolitos (Na, K, Mg)');

  const uSet=new Set(),rSet=new Set();
  const uFinal=[],rFinal=[];
  for(const u of urgent) if(!uSet.has(u)){uSet.add(u);uFinal.push(u);}
  for(const r of routine) if(!rSet.has(r)&&!uSet.has(r)){rSet.add(r);rFinal.push(r);}

  return {urgent:uFinal,routine:rFinal};
}

// =============================================
// ANALGESIA
// =============================================
function buildAnalgesiaProtocol(){
  const intensity=painIntensity;
  const steps=[];
  const hasRenalInsuff=pastHistory.has('renal_insuff');
  const hasGIBleed=assocSymptoms.has('hematemesis')||assocSymptoms.has('hematochezia');
  const isChild=patAge===0;
  const isElderly=patAge===3;

  if(intensity===0){
    if(isChild) steps.push({n:'1',text:'Dipirona 15 mg/kg EV ou Paracetamol 15 mg/kg VO'});
    else steps.push({n:'1',text:'Dipirona 1g EV ou Paracetamol 750mg VO'});
    steps.push({n:'2',text:'Hioscina (Buscopan\u00AE) 20mg EV se colica'});
    steps.push({n:'R',text:'Reavaliar dor em 30\u201360 min'});
  } else if(intensity===1){
    if(hasRenalInsuff||hasGIBleed){
      steps.push({n:'1',text:'Dipirona 1g EV (evitar AINEs \u2014 '+(hasGIBleed?'sangramento GI':'insuficiencia renal')+')'});
    } else if(isChild){
      steps.push({n:'1',text:'Dipirona 15 mg/kg EV + Ibuprofeno 10 mg/kg VO (se > 6 meses)'});
    } else if(isElderly){
      steps.push({n:'1',text:'Dipirona 1g EV (cautela com AINEs em idoso)'});
    } else {
      steps.push({n:'1',text:'Dipirona 1g EV + Cetoprofeno 100mg EV (ou Tenoxicam 20mg EV)'});
    }
    steps.push({n:'2',text:'Hioscina 20mg EV se componente colico'});
    if(isChild){
      steps.push({n:'3',text:'Se sem melhora: Tramadol 1\u20132 mg/kg EV (> 12 anos) ou Morfina 0,1 mg/kg EV'});
    } else {
      steps.push({n:'3',text:'Se sem melhora: Tramadol 50\u2013100mg EV diluido'});
    }
    steps.push({n:'R',text:'Reavaliar dor em 30 min'});
  } else {
    if(hasRenalInsuff||hasGIBleed){
      steps.push({n:'1',text:'Dipirona 2g EV (evitar AINEs \u2014 '+(hasGIBleed?'sangramento GI':'insuficiencia renal')+')'});
    } else if(isChild){
      steps.push({n:'1',text:'Dipirona 15\u201325 mg/kg EV'});
    } else {
      steps.push({n:'1',text:'Dipirona 2g EV + Cetoprofeno 100mg EV'});
    }
    if(isChild){
      steps.push({n:'2',text:'Morfina 0,1\u20130,2 mg/kg EV (titular a cada 5 min)'});
    } else if(isElderly){
      steps.push({n:'2',text:'Morfina 1\u20132mg EV (titular com cautela a cada 5\u201310 min \u2014 idoso)'});
    } else {
      steps.push({n:'2',text:'Morfina 2\u20134mg EV (titular a cada 5 min ate alivio)'});
    }
    steps.push({n:'3',text:'Ondansetrona 4mg EV se nauseas com opioide'});
    steps.push({n:'!',text:'NAO retardar analgesia por avaliacao cirurgica'});
    steps.push({n:'R',text:'Reavaliar dor a cada 15\u201330 min'});
  }
  if(pastHistory.has('nsaid')&&!hasGIBleed) steps.push({n:'!',text:'Cautela com AINEs \u2014 uso cronico relatado'});
  if(pastHistory.has('liver_disease')) steps.push({n:'!',text:'Cautela com Paracetamol \u2014 hepatopatia cronica'});
  if(hasGIBleed) steps.push({n:'!',text:'AINEs CONTRAINDICADOS \u2014 sangramento GI'});
  if(isChild) steps.push({n:'!',text:'Doses pediatricas \u2014 calcular conforme peso exato'});
  if(isElderly&&!hasRenalInsuff) steps.push({n:'!',text:'Idoso \u2014 iniciar com doses menores e titular'});
  if(pastHistory.has('renal_insuff')) steps.push({n:'!',text:'Ajustar opioides e evitar AINEs \u2014 insuficiencia renal'});
  return steps;
}

// =============================================
// PROGRESS BAR
// =============================================
function progHTML(idx,allDone){
  let h='<div class="progress-bar">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c=allDone||i<idx?'done':i===idx?'active':'';
    const clickable=(!allDone&&i<idx)?'clickable':'';
    const onclick=(!allDone&&i<idx)||allDone?` onclick="goToStep(${i})"`:'';
    h+=`<div class="progress-step ${c} ${clickable}" role="button" tabindex="${((!allDone&&i<idx)||allDone)?'0':'-1'}" aria-label="Etapa ${i+1}: ${STEP_LABELS[i]}"${onclick}></div>`;
  }
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c=allDone||i<idx?'done-label':i===idx?'active-label':'';
    const onclick=(!allDone&&i<idx)||allDone?` onclick="goToStep(${i})"`:'';
    h+=`<span class="${c}"${onclick}>${STEP_LABELS[i]}</span>`;
  }
  h+='</div>';
  if(!allDone) h+='<div class="flow-connector"><div class="arrow"></div></div>';
  return h;
}

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id,title,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')" role="button" tabindex="0" aria-expanded="${open}" aria-label="${title}">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">&#x25BC;</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.7rem':'0'}">`;
  if(open) h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  if(showRestartModal){renderRestartModal();return;}
  if(step===0) renderPatient();
  else if(step===1) renderLocation();
  else if(step===2) renderCharacteristics();
  else if(step===3) renderSymptoms();
  else if(step===4) renderExam();
  else if(step===5) renderScores();
  else renderResult();
}

// =============================================
// RESTART MODAL
// =============================================
function renderRestartModal(){
  let h='<div class="modal-overlay" onclick="cancelRestart(event)">';
  h+='<div class="modal-box">';
  h+='<h3>Recomecar avaliacao?</h3>';
  h+='<p>Todos os dados preenchidos serao perdidos.</p>';
  h+='<div class="modal-actions">';
  h+='<button class="nav-btn secondary" onclick="cancelRestart()">Cancelar</button>';
  h+='<button class="nav-btn primary" style="background:var(--red)" onclick="confirmRestart()">Recomecar</button>';
  h+='</div></div></div>';
  const existing=document.querySelector('.modal-overlay');
  if(!existing){
    const div=document.createElement('div');
    div.innerHTML=h;
    document.body.appendChild(div.firstElementChild);
  }
}
function cancelRestart(e){
  if(e&&e.target!==e.currentTarget) return;
  showRestartModal=false;
  const overlay=document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();
}
function confirmRestart(){
  showRestartModal=false;
  const overlay=document.querySelector('.modal-overlay');
  if(overlay) overlay.remove();
  step=0;location=null;painOnset=null;
  painQuality=new Set();painRadiation=new Set();
  aggravating=new Set();relieving=new Set();
  assocSymptoms=new Set();peritonealSigns=new Set();
  specificSigns=new Set();vitalSigns=new Set();pastHistory=new Set();
  patAge=null;patSex=null;lmpStatus=null;
  painDuration=null;painIntensity=null;
  activeScoreTab='alvarado';
  alvaradoState={};ransonAdmitState={};ranson48hState={};bisapState={};
  sections={summary:true,ddx:true,scores:true,workup:true,conduta:true,analgesia:false,note:false};
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildAbdomenSVG(){
  // 9-quadrant anatomical plate. Torso outline + grid cells.
  // Coordinates (viewBox 0 0 300 340)
  const cells=[
    {id:'ruq',label:'HCD',x:55,y:60,w:60,h:70},
    {id:'epigastric',label:'Epigastrio',x:120,y:60,w:60,h:70},
    {id:'luq',label:'HCE',x:185,y:60,w:60,h:70},
    {id:'flank_r',label:'Flanco D',x:55,y:135,w:60,h:70},
    {id:'periumbilical',label:'Periumbilical',x:120,y:135,w:60,h:70},
    {id:'flank_l',label:'Flanco E',x:185,y:135,w:60,h:70},
    {id:'rlq',label:'FID',x:55,y:210,w:60,h:70},
    {id:'suprapubic',label:'Suprapubico',x:120,y:210,w:60,h:70},
    {id:'llq',label:'FIE',x:185,y:210,w:60,h:70},
  ];
  let s='<svg class="abdomen-svg" viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg" aria-label="Diagrama abdominal">';
  // Torso outline (ribs + pelvis suggestion)
  s+='<path class="abd-outline" d="M 55 50 Q 150 20 245 50 L 250 215 Q 250 270 200 290 Q 150 300 100 290 Q 50 270 50 215 Z"/>';
  // Side labels (D/E)
  s+='<text x="20" y="172" class="abd-side">D</text>';
  s+='<text x="275" y="172" class="abd-side">E</text>';
  // Draw regions
  for(const c of cells){
    const sel=location===c.id?'selected':'';
    const labelFill=location===c.id?'var(--accent-light)':'var(--text-muted)';
    const labelWeight=location===c.id?'700':'500';
    s+=`<g onclick="setLocation('${c.id}')" role="button" tabindex="0" aria-label="${c.label}" aria-pressed="${location===c.id}" style="cursor:pointer">`;
    s+=`<rect class="abd-region ${sel}" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="4"/>`;
    s+=`<text x="${c.x+c.w/2}" y="${c.y+c.h/2+3}" class="abd-label" style="fill:${labelFill};font-weight:${labelWeight}">${c.label}</text>`;
    s+='</g>';
  }
  // Umbilicus marker (in center of periumbilical)
  s+='<circle class="abd-umb" cx="150" cy="170" r="2.5"/>';
  s+='</svg>';
  return s;
}

// =============================================
function renderExam(){
  let h=progHTML(4,false);
  h+='<div class="card">';

    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSet('vitalSigns','${v.id}')" role="checkbox" aria-checked="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${v.label}</span></button>`;
  }

  // Peritoneal
  h+='<div class="option-group-label">Sinais peritoneais / Ausculta';
  if(peritonealSigns.size>0) h+=`<span class="count-badge">${peritonealSigns.size}</span>`;
  h+='</div>';
  for(const p of PERITONEAL_SIGNS){
    const ck=peritonealSigns.has(p.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSet('peritonealSigns','${p.id}')" role="checkbox" aria-checked="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${p.label}</span></button>`;
  }

  // Specific signs — unified list, relevant ones highlighted
  h+='<div class="option-group-label">Sinais especificos';
  if(specificSigns.size>0) h+=`<span class="count-badge">${specificSigns.size}</span>`;
  h+='</div>';
  const relevantIds=new Set(getRelevantSignIds());
  const ordered=[...SPECIFIC_SIGNS].sort((a,b)=>{
    const ar=relevantIds.has(a.id)?0:1;
    const br=relevantIds.has(b.id)?0:1;
    return ar-br;
  });
  for(const s of ordered){
    const ck=specificSigns.has(s.id);
    const rel=relevantIds.has(s.id)?'relevant':'';
    h+=`<button class="check-btn ${ck?'checked':''} ${rel}" onclick="toggleSet('specificSigns','${s.id}')" role="checkbox" aria-checked="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${s.label}</span><span class="sign-hint">${s.hint}</span></button>`;
  }

  // Red flags
  const flags=getRedFlags();
  if(flags.length>0){
    h+='<div class="red-flag"><strong>Sinais de alarme</strong>';
    h+=flags.map(f=>'&bull; '+f).join('<br>');
    h+='</div>';
  }

  h+='</div><div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Proximo</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function getRelevantSignIds(){
  const baseMap={
    ruq:['murphy'],
    rlq:['mcburney','rovsing','psoas','obturator','blumberg','dunphy'],
    llq:['blumberg'],
    epigastric:['carnett'],
    periumbilical:['mcburney','carnett'],
    flank_r:['giordano'],
    flank_l:['giordano'],
    suprapubic:['blumberg'],
    luq:['kehr'],
    diffuse:['blumberg','cullen','grey_turner','dunphy'],
  };
  const ids=[...(baseMap[location]||[])];
  if(painRadiation.has('back')&&(location==='epigastric'||location==='diffuse')){
    if(!ids.includes('cullen')) ids.push('cullen');
    if(!ids.includes('grey_turner')) ids.push('grey_turner');
  }
  if(painRadiation.has('shoulder_l')&&!ids.includes('kehr')) ids.push('kehr');
  if(!ids.includes('carnett')) ids.push('carnett');
  if(peritonealSigns.has('rebound')&&!ids.includes('dunphy')) ids.push('dunphy');
  return ids;
}

// =============================================
function renderScores(){
  let h=progHTML(5,false);
  h+='<div class="card">';
