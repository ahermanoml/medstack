  let h=progHTML(0,false);
  h+='<div class="card">';
  h+=`<h2>Qual o tipo de tontura? <span class="step-count">1/${TOTAL_STEPS}</span></h2>`;
  h+='<p class="subtitle">Caracterização da queixa principal</p>';
  h+='<div class="options">';
  for(const t of DIZZINESS_TYPES){
    h+=`<button class="option-btn ${dizType===t.id?'selected':''}" onclick="setDizType('${t.id}')" aria-pressed="${dizType===t.id}">`;
    h+=`<span class="icon">${t.icon}</span>`;
    h+=`<span class="label">${t.label}<small>${t.desc}</small></span>`;
    h+=`<span class="tag">${t.tag}</span></button>`;
  }
  h+='</div>';
  const hintsMap={
    vertigo:'<strong>Vertigem rotatória</strong> \u2014 tipo-chave para diferenciar central vs periférico. As próximas etapas usam timing, HINTS e red flags.',
    presyncope:'<strong>Pré-síncope</strong> \u2014 causa geralmente cardiovascular. HINTS não se aplica. Avaliar ECG, PA ortostática, glicemia.',
    disequilibrium:'<strong>Desequilíbrio</strong> sem rotação \u2014 frequentemente multifatorial (idoso): neuropatia, déficit visual, medicação.',
    nonspecific:'<strong>Tontura inespecífica</strong> \u2014 considerar ansiedade, hiperventilação, hipoglicemia, medicação.',
  };
  if(dizType&&hintsMap[dizType])h+=`<div class="info">${hintsMap[dizType]}</div>`;
  h+='<div class="nav-row">';
  h+=`<button class="nav-btn primary" ${dizType===null?'disabled':''} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

function renderTiming(){
  let h=progHTML(1,false);
  h+='<div class="card">';
  h+=buildChips();
  h+=`<h2>Tempo e gatilho <span class="step-count">2/${TOTAL_STEPS}</span></h2>`;
  h+='<p class="subtitle">Duração, instalação e fatores desencadeantes</p>';
  h+='<div class="options">';

  h+='<div class="group-label">Duração dos episódios</div>';
  for(const t of TIMING_OPTIONS){
    h+=`<button class="option-btn ${timing===t.id?'selected':''}" onclick="setTiming('${t.id}')" aria-pressed="${timing===t.id}">`;
    h+=`<span class="icon">${t.icon}</span>`;
    h+=`<span class="label">${t.label}<small>${t.desc}</small></span>`;
    h+=`<span class="tag">${t.suggest}</span></button>`;
  }

  h+='<div class="group-label">Modo de instalação</div>';
  h+='<div class="segmented">';
  for(const o of ONSET_OPTIONS){
    h+=`<button class="seg ${onset===o.id?'picked':''}" onclick="setOnset('${o.id}')">${o.label}<span class="sub">${o.sub}</span></button>`;
  }
  h+='</div>';

  h+='<div class="group-label">Gatilhos <span class="hint">(todos que se aplicarem)</span></div>';
  for(const t of TRIGGER_OPTIONS){
    const ck=triggers.has(t.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleTrigger('${t.id}')" aria-pressed="${ck}">`;
    h+=`<span class="check-box">${ck?'\u2713':''}</span>`;
    h+=`<span class="label">${t.label}<small>${t.desc}</small></span></button>`;
  }
  h+='</div>';

  if(timing==='seconds'&&triggers.has('positional')){
    h+='<div class="info"><strong>Padrão sugestivo de VPPB.</strong> Resultado do Dix-Hallpike:</div>';
    h+='<div class="segmented" style="margin-top:.5rem">';
    h+=`<button class="seg ${dixHallpike==='pos'?'picked':''}" onclick="setDixHallpike('pos')">Positivo<span class="sub">Nistagmo com latência</span></button>`;
    h+=`<button class="seg ${dixHallpike==='neg'?'picked':''}" onclick="setDixHallpike('neg')">Negativo<span class="sub">Sem nistagmo</span></button>`;
    h+=`<button class="seg ${dixHallpike==='nr'?'picked':''}" onclick="setDixHallpike('nr')">Não feito<span class="sub">\u2014</span></button>`;
    h+='</div>';
    if(dixHallpike==='pos'){
      h+='<div class="info"><strong>DH positivo:</strong> nistagmo torsional/vertical com latência 1\u20135s, duração <60s, fatigável. Nistagmo puramente vertical (downbeat) ou sem latência \u2192 causa central.</div>';
    }else if(dixHallpike==='neg'){
      h+='<div class="info warn"><strong>DH negativo com clínica posicional:</strong> investigar VPPB de canal lateral (supine roll test). Nistagmo atípico \u2192 considerar central.</div>';
    }
  }
  if(triggers.has('valsalva')){
    h+='<div class="info warn"><strong>Valsalva/sons:</strong> considerar fístula perilinfática ou deiscência de canal superior (Minor). TC alta resolução + VEMP.</div>';
  }
  if(triggers.has('orthostatic')&&dizType==='presyncope'){
    h+='<div class="info"><strong>Ortostase:</strong> medir PA em decúbito, sentado e em pé (1 e 3 min). Queda \u226520 mmHg sist. ou \u226510 diast. confirma hipotensão ortostática.</div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+=`<button class="nav-btn primary" ${timing===null?'disabled':''} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

function renderPatient(){
  let h=progHTML(2,false);
  h+='<div class="card">';
  h+=buildChips();
  h+=`<h2>Paciente <span class="step-count">3/${TOTAL_STEPS}</span></h2>`;
  h+='<p class="subtitle">Idade, sexo, fatores de risco e medicações</p>';
  h+='<div class="options">';

  h+='<div class="group-label">Faixa etária</div>';
  const ages=[{v:0,l:'< 45'},{v:1,l:'45\u201359'},{v:2,l:'60\u201374'},{v:3,l:'\u2265 75'}];
  h+='<div class="segmented">';
  for(const a of ages)h+=`<button class="seg ${patAge===a.v?'picked':''}" onclick="setPatAge(${a.v})">${a.l}</button>`;
  h+='</div>';

  h+='<div class="group-label">Sexo</div>';
  h+='<div class="segmented">';
  h+=`<button class="seg ${patSex==='M'?'picked':''}" onclick="setPatSex('M')">Masculino</button>`;
  h+=`<button class="seg ${patSex==='F'?'picked':''}" onclick="setPatSex('F')">Feminino</button>`;
  h+='</div>';

  h+='<div class="group-label">Fatores de risco p/ AVC</div>';
  for(const rf of RF_STROKE){
    const ck=rfStroke.has(rf.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleRF('${rf.id}')" aria-pressed="${ck}">`;
    h+=`<span class="check-box">${ck?'\u2713':''}</span><span class="label">${rf.label}</span></button>`;
  }

  h+='<div class="group-label">Medicações em uso <span class="hint">(possíveis causas)</span></div>';
  for(const m of MEDS){
    const ck=meds.has(m.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleMed('${m.id}')" aria-pressed="${ck}">`;
    h+=`<span class="check-box">${ck?'\u2713':''}</span><span class="label">${m.label}</span></button>`;
  }
  if(meds.size>0){
    const warns=[];
    if(meds.has('aminoglic'))warns.push('aminoglicosídeos \u2192 ototoxicidade bilateral');
    if(meds.has('benzo')&&patAge>=2)warns.push('BZD em idoso \u2192 risco de quedas');
    if(meds.has('alcohol'))warns.push('álcool \u2192 avaliar intoxicação');
    if(warns.length)h+=`<div class="info warn"><strong>Atenção:</strong> ${warns.join('; ')}.</div>`;
  }

  h+='</div><div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  const ok=patAge!==null&&patSex!==null;
  h+=`<button class="nav-btn primary" ${ok?'':'disabled'} onclick="next()">Próximo</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

function renderHints(){
  let h=progHTML(3,false);
  h+='<div class="card">';
  h+=buildChips();
  h+=`<h2>Exame HINTS <span class="step-count">4/${TOTAL_STEPS}</span></h2>`;
  h+='<p class="subtitle">Head Impulse · Nistagmo · Test of Skew</p>';

  const avs=isAVS();

  if(!avs){
    h+='<div class="info warn"><strong>HINTS é mais útil na SVA</strong> (vertigem contínua há horas/dias). No quadro atual, menor valor diagnóstico \u2014 preencha se realizado ou pule.</div>';
  }else{
    h+='<div class="info"><strong>SVA detectada.</strong> HINTS tem sensibilidade >96% para AVC de fossa posterior \u2014 superior à TC nas primeiras 24\u201348h. Paciente fixando o olhar no nariz do examinador, com nistagmo espontâneo presente.</div>';
  }

  if(!hintsSkipped){
    h+='<div class="hints-block"><div class="hints-header"><span class="h-num">1</span>Head Impulse Test</div>';
    h+='<div class="hints-desc">Rotação rápida da cabeça ~20\u00B0. Há sacada de correção ao retornar o olhar ao alvo?</div>';
    h+='<div class="hints-grid">';
    h+=`<button class="hints-cell ${hints.hi==='p'?'sel-periph':''}" onclick="setHints('hi','p')" aria-pressed="${hints.hi==='p'}"><div class="hints-label">Periférico</div>Sacada <strong>presente</strong><small>HIT anormal = lesão vestibular</small></button>`;
    h+=`<button class="hints-cell ${hints.hi==='c'?'sel-central':''}" onclick="setHints('hi','c')" aria-pressed="${hints.hi==='c'}"><div class="hints-label">Central</div>Sem sacada<small>HIT normal em vertigem = central!</small></button>`;
    h+='</div></div>';

    h+='<div class="hints-block"><div class="hints-header"><span class="h-num">2</span>Nistagmo</div>';
    h+='<div class="hints-desc">Avalie direção no olhar primário e lateral. Muda de direção conforme o lado?</div>';
    h+='<div class="hints-grid">';
    h+=`<button class="hints-cell ${hints.nyst==='p'?'sel-periph':''}" onclick="setHints('nyst','p')" aria-pressed="${hints.nyst==='p'}"><div class="hints-label">Periférico</div>Unidirecional<small>Fase rápida sempre para o mesmo lado</small></button>`;
    h+=`<button class="hints-cell ${hints.nyst==='c'?'sel-central':''}" onclick="setHints('nyst','c')" aria-pressed="${hints.nyst==='c'}"><div class="hints-label">Central</div>Direction-changing<small>Muda conforme olhar lateral</small></button>`;
    h+='</div></div>';

    h+='<div class="hints-block"><div class="hints-header"><span class="h-num">3</span>Test of Skew</div>';
    h+='<div class="hints-desc">Cover-uncover alternado. Há correção vertical ao descobrir o olho?</div>';
    h+='<div class="hints-grid">';
    h+=`<button class="hints-cell ${hints.skew==='p'?'sel-periph':''}" onclick="setHints('skew','p')" aria-pressed="${hints.skew==='p'}"><div class="hints-label">Periférico</div>Ausente<small>Sem desvio vertical</small></button>`;
    h+=`<button class="hints-cell ${hints.skew==='c'?'sel-central':''}" onclick="setHints('skew','c')" aria-pressed="${hints.skew==='c'}"><div class="hints-label">Central</div>Presente<small>Desvio vertical ao desocluir</small></button>`;
    h+='</div></div>';

    const res=getHintsInterp();
    if(res){
      h+=`<div class="hints-result ${res.cls}"><span class="hr-icon">${res.level==='peripheral'?'\u{2705}':'\u{1F6A8}'}</span><span>${res.text}</span></div>`;
    }else{
      const f=[hints.hi,hints.nyst,hints.skew].filter(v=>v!==null).length;
      h+=`<div class="hints-result hr-pending"><span class="hr-icon">\u{2753}</span><span>Preencha os 3 componentes (${f}/3)</span></div>`;
    }

    if(avs&&hintsPlusWarn()){
      h+='<div class="info warn"><strong>HINTS plus:</strong> HINTS periférico + hipoacusia aguda pode indicar infarto de AICA. Manter alta suspeita clínica.</div>';
    }
  }else{
    h+='<div style="text-align:center;padding:1.6rem 0;color:var(--text-faint);font-size:.82rem">HINTS não realizado.</div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  if(!avs&&!hintsSkipped)h+='<button class="nav-btn skip" onclick="skipHints()">Pular</button>';
  if(hintsSkipped)h+='<button class="nav-btn skip" onclick="unskipHints()">Preencher</button>';
  h+='<button class="nav-btn primary" onclick="next()">Próximo</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function renderSymptoms(){
  let h=progHTML(4,false);
  h+='<div class="card">';
  h+=buildChips();
  h+=`<h2>Sintomas associados <span class="step-count">5/${TOTAL_STEPS}</span></h2>`;
  h+='<p class="subtitle">Marque todos os sintomas presentes</p>';
  h+='<div class="options">';

  h+='<div class="group-label">Otológicos</div>';
  for(const s of ASSOCIATED_SYMPTOMS.otologic){
    const ck=symptoms.has(s.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSymptom('${s.id}')" aria-pressed="${ck}">`;
    h+=`<span class="check-box">${ck?'\u2713':''}</span><span class="label">${s.label}</span>`;
    if(s.flag==='yellow')h+='<span class="rf-tag yellow">Atenção</span>';
    h+='</button>';
  }

  h+='<div class="group-label">Neurológicos <span class="flag-hint">SINAIS DE ALARME</span></div>';
  for(const s of ASSOCIATED_SYMPTOMS.neurologic){
    const ck=symptoms.has(s.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSymptom('${s.id}')" aria-pressed="${ck}">`;
    h+=`<span class="check-box">${ck?'\u2713':''}</span><span class="label">${s.label}</span>`;
    if(s.flag==='red')h+='<span class="rf-tag red">Red flag</span>';
    else if(s.flag==='yellow')h+='<span class="rf-tag yellow">Atenção</span>';
    h+='</button>';
  }

  h+='<div class="group-label">Gerais</div>';
  for(const s of ASSOCIATED_SYMPTOMS.general){
    const ck=symptoms.has(s.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSymptom('${s.id}')" aria-pressed="${ck}">`;
    h+=`<span class="check-box">${ck?'\u2713':''}</span><span class="label">${s.label}</span>`;
    if(s.flag==='yellow')h+='<span class="rf-tag yellow">Atenção</span>';
    h+='</button>';
  }

  const live=getRedFlags();
  const red=live.filter(f=>f.flag==='red').length;
  const yel=live.filter(f=>f.flag==='yellow').length;
  if(red||yel){
    h+='<div style="margin-top:.6rem;display:flex;gap:.3rem;flex-wrap:wrap">';
    if(red)h+=`<span class="flag-pill red">${red} red flag${red>1?'s':''}</span>`;
    if(yel)h+=`<span class="flag-pill yellow">${yel} atenção</span>`;
    h+='</div>';
  }

  let synAlert=null;
  if(symptoms.has('headache')&&symptoms.has('ataxia')&&isAVS()){
    synAlert={cls:'danger',label:'Emergência \u2014 hemorragia cerebelar?',text:'Cefaleia intensa + ataxia + vertigem aguda \u2192 TC imediata. Pode necessitar descompressão cirúrgica (risco de herniação).'};
  }else if(symptoms.has('neck_pain')&&dizType==='vertigo'&&(onset==='sudden'||timing==='days')){
    synAlert={cls:'danger',label:'Dissecção arterial?',text:'Cervicalgia + vertigem súbita (especialmente em jovens ou pós-trauma). Angio-TC/RM de vasos cervicais.'};
  }else if(symptoms.has('facial_palsy')&&symptoms.has('hearing_loss')&&dizType==='vertigo'){
    synAlert={cls:'danger',label:'Território da AICA?',text:'Paralisia facial + hipoacusia + vertigem \u2192 infarto de AICA. Neuroimagem urgente.'};
  }else if(symptoms.has('dysphagia')&&symptoms.has('hiccups_horner')&&dizType==='vertigo'){
    synAlert={cls:'danger',label:'Síndrome de Wallenberg?',text:'Disfagia + soluços/Horner + vertigem \u2192 infarto bulbar lateral (PICA/vertebral). RM com difusão urgente.'};
  }else if(symptoms.has('facial_palsy')&&symptoms.has('otorrhea')&&dizType==='vertigo'){
    synAlert={cls:'warn',label:'Síndrome de Ramsay Hunt?',text:'Paralisia facial + vesículas auriculares + vertigem \u2192 herpes zoster oticus. Aciclovir + corticoide precoce.'};
  }
  if(synAlert){
    h+=`<div class="info ${synAlert.cls}" style="margin-top:.55rem"><strong>${synAlert.label}</strong> ${synAlert.text}</div>`;
  }

  h+='</div><div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Ver resultado</button>';
  h+='</div></div>';
  app.innerHTML=h;
}

function renderResult(){
  const cls=getClassification();
  const flags=getRedFlags();
  const cs=getCentralScore();
  const pct=Math.min(100,Math.max(0,cs*10));

  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  if(cls.level==='central'){
    h+='<div class="emergency-banner"><span class="em-icon">\u{1F6A8}</span><span class="em-text">Sinais de alarme. Não liberar sem neuroimagem e avaliação especializada.</span></div>';
  }

  h+=`<div class="result-badge ${cls.badge}">${cls.icon}</div>`;
  h+=`<div class="result-title">${cls.title}</div>`;
  h+=`<div class="result-desc">${cls.desc}</div>`;

  h+='<div class="risk-meter-wrap">';
  h+=`<div class="risk-meter" role="img" aria-label="Índice de risco central: ${cs.toFixed(1)} de 10"><div class="risk-marker" id="riskMarker" style="left:0%"></div></div>`;
  h+='<div class="risk-labels"><span>Periférico</span><span>Indeterminado</span><span>Central</span></div>';
  h+='</div>';

  if(flags.length>0){
    h+='<div style="text-align:left;width:100%;margin-bottom:.7rem">';
    h+='<div class="flags-title">Sinais identificados</div>';
    h+='<div class="flag-list">';
    for(const f of flags){h+=`<span class="flag-pill ${f.flag}">${f.label}</span>`}
    h+='</div></div>';
  }else if(cls.level==='periferico'){
    h+='<div style="text-align:left;width:100%;margin-bottom:.7rem">';
    h+='<span class="no-flag-pill">\u2713 Nenhum sinal de alarme</span></div>';
  }

  h+='<div class="sections">';

  h+=collapsible('classification','Detalhes da avaliação',()=>{
    let s='';
    const t=DIZZINESS_TYPES.find(x=>x.id===dizType);
    const tm=TIMING_OPTIONS.find(x=>x.id===timing);
    const on=ONSET_OPTIONS.find(x=>x.id===onset);
    s+=`<div class="summary-row"><span class="criteria">Tipo</span><span class="value">${t?t.label:'\u2014'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Duração</span><span class="value">${tm?tm.label:'\u2014'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Instalação</span><span class="value">${on?on.label:'Não informado'}</span></div>`;
    const trigLbl=TRIGGER_OPTIONS.filter(x=>triggers.has(x.id)).map(x=>x.label);
    s+=`<div class="summary-row"><span class="criteria">Gatilhos</span><span class="value">${trigLbl.length?trigLbl.join(', '):'Nenhum'}</span></div>`;
    if(dixHallpike)s+=`<div class="summary-row"><span class="criteria">Dix-Hallpike</span><span class="value">${dixHallpike==='pos'?'Positivo':dixHallpike==='neg'?'Negativo':'Não feito'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Paciente</span><span class="value">${patSex==='M'?'Masc.':'Fem.'}, ${['<45','45\u201359','60\u201374','\u226575'][patAge]} anos</span></div>`;
    const rfList=RF_STROKE.filter(x=>rfStroke.has(x.id)).map(x=>x.label);
    s+=`<div class="summary-row"><span class="criteria">FR AVC</span><span class="value">${rfStroke.size} fator${rfStroke.size!==1?'es':''}${rfStroke.size?' ('+rfList.join(', ')+')':''}</span></div>`;
    if(meds.size>0){
      const ml=MEDS.filter(x=>meds.has(x.id)).map(x=>x.label);
      s+=`<div class="summary-row"><span class="criteria">Medicações</span><span class="value">${ml.join(', ')}</span></div>`;
    }
    const sl=[];for(const g of [ASSOCIATED_SYMPTOMS.otologic,ASSOCIATED_SYMPTOMS.neurologic,ASSOCIATED_SYMPTOMS.general])for(const s2 of g)if(symptoms.has(s2.id))sl.push(s2.label);
    s+=`<div class="summary-row"><span class="criteria">Sintomas</span><span class="value">${sl.length?sl.join(', '):'Nenhum'}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Score central</span><span class="value">${cs.toFixed(1)} / 10</span></div>`;
    return s;
  });

  if(!hintsSkipped&&(hints.hi!==null||hints.nyst!==null||hints.skew!==null)){
    h+=collapsible('hints_summary','Exame HINTS',()=>{
      const lbl=(v,p,c)=>v==='p'?p:v==='c'?c:'Não avaliado';
      const dot=v=>v==='p'?'dot-periferico':v==='c'?'dot-central':'dot-neutro';
      let s='';
      s+=`<div class="summary-row"><span class="criteria">Head Impulse</span><span class="value"><span class="dot ${dot(hints.hi)}"></span>${lbl(hints.hi,'Sacada presente (periférico)','Sem sacada (central!)')}</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Nistagmo</span><span class="value"><span class="dot ${dot(hints.nyst)}"></span>${lbl(hints.nyst,'Unidirecional (periférico)','Direction-changing (central)')}</span></div>`;
      s+=`<div class="summary-row"><span class="criteria">Test of Skew</span><span class="value"><span class="dot ${dot(hints.skew)}"></span>${lbl(hints.skew,'Ausente (periférico)','Presente (central)')}</span></div>`;
      const r=getHintsInterp();
      if(r)s+=`<div class="hints-result ${r.cls}" style="margin-top:.5rem"><span class="hr-icon">${r.level==='peripheral'?'\u{2705}':'\u{1F6A8}'}</span><span>${r.text}</span></div>`;
      if(hintsPlusWarn()){
        s+='<div class="info warn" style="margin-top:.5rem"><strong>HINTS plus:</strong> HINTS periférico + hipoacusia aguda pode indicar infarto de AICA.</div>';
      }
      return s;
    });
  }

  h+=buildConduta(cls);
  h+=buildDiferenciais(cls);

  const showABCD2=dizType==='vertigo'&&(timing==='minutes'||timing==='hours')&&(rfStroke.size>=2||cls.level!=='periferico');
  if(showABCD2){
    h+=collapsible('abcd2','Score ABCD\u00B2 (suspeita de AIT)',()=>buildABCD2(),'box');
  }

  h+=collapsible('note','Nota para prontuário',()=>buildNote(cls,flags),'box');

  h+='</div>';

  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  h+=`<div class="eval-time">Avaliação · ${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}</div>`;

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">Voltar</button>';
  h+='<button class="nav-btn primary" onclick="confirmRestart()">\u{21BB} Recomeçar</button>';
  h+='</div></div>';
  app.innerHTML=h;

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const m=document.getElementById('riskMarker');if(m)m.style.left=pct+'%';
  }));
}

function buildDiferenciais(cls){
  let items=[];
  if(dizType==='vertigo'){
    if(timing==='seconds')items=[
      {dx:'VPPB',prob:triggers.has('positional')&&dixHallpike==='pos'?'alta':'moderada',detail:'Canal posterior (~80%). Epley terapêutica. DH negativo \u2192 canal lateral (supine roll test).'},
      {dx:'Hipotensão ortostática',prob:triggers.has('orthostatic')?'moderada':'baixa',detail:'PA decúbito/ortostase. Queda \u226520/10 mmHg.'},
      {dx:'Vertigem posicional central',prob:'baixa',detail:'Nistagmo atípico (sem latência, downbeat puro). RM indicada.'},
      {dx:'Deiscência de canal superior',prob:'baixa',detail:'Vertigem com Valsalva/sons altos (Tullio). TC alta resolução + VEMP.'},
    ];
    else if(timing==='minutes')items=[
      {dx:'AIT vertebrobasilar',prob:rfStroke.size>=2?'moderada':'baixa',detail:'Episódios de minutos com FRs. RM com difusão + angio. Vertigem isolada pode ser AIT.'},
      {dx:'Enxaqueca vestibular',prob:symptoms.has('headache')||(patSex==='F'&&patAge<=1)?'alta':'moderada',detail:'Critérios IHS/Barany. Pode ter foto/fonofobia, aura.'},
      {dx:'Ménière inicial',prob:symptoms.has('tinnitus')||symptoms.has('hearing_loss')?'moderada':'baixa',detail:'Flutuação auditiva. Audiometria.'},
    ];
    else if(timing==='hours')items=[
      {dx:'Doença de Ménière',prob:symptoms.has('hearing_loss')||symptoms.has('tinnitus')||symptoms.has('ear_fullness')?'alta':'moderada',detail:'Tríade: vertigem + hipoacusia + zumbido. Plenitude auricular.'},
      {dx:'Enxaqueca vestibular',prob:symptoms.has('headache')?'moderada':'baixa',detail:'Horas de vertigem com foto/fonofobia. Pode não ter cefaleia.'},
      {dx:'AIT vertebrobasilar',prob:rfStroke.size>=3?'moderada':'baixa',detail:'Sintomas transitórios com FRs. Neuroimagem indicada.'},
    ];
    else if(timing==='days')items=[
      {dx:'Neurite vestibular',prob:cls.level==='periferico'?'alta':'moderada',detail:'Pós-viral, HINTS periférico, resolução em semanas. Reabilitação precoce.'},
      {dx:'AVC de fossa posterior',prob:cls.level==='central'?'alta':'moderada',detail:'HINTS central, FRs vasculares. RM com difusão é padrão-ouro. TC pode ser NORMAL nas primeiras 48h.'},
      {dx:'Hemorragia cerebelar',prob:symptoms.has('headache')&&symptoms.has('ataxia')?'moderada':'baixa',detail:'Cefaleia + ataxia. TC imediata. Pode necessitar descompressão cirúrgica.'},
      {dx:'Labirintite',prob:symptoms.has('hearing_loss')?'moderada':'baixa',detail:'Neurite + perda auditiva. Infecciosa.'},
      {dx:'Dissecção de a. vertebral',prob:symptoms.has('neck_pain')&&onset==='sudden'?'moderada':'baixa',detail:'Cervicalgia + vertigem súbita. Angio-TC/RM.'},
      {dx:'Infarto de AICA',prob:symptoms.has('hearing_loss')&&symptoms.has('facial_palsy')?'moderada':'baixa',detail:'Vertigem + hipoacusia + paralisia facial. RM urgente.'},
      {dx:'Sd. de Wallenberg',prob:symptoms.has('dysphagia')&&symptoms.has('hiccups_horner')?'moderada':'baixa',detail:'Disfagia + soluços + Horner. Infarto bulbar lateral (PICA).'},
    ];
    else items=[
      {dx:'TPPP',prob:'moderada',detail:'Tontura crônica funcional. Critérios Barany. ISRS + TCC + reabilitação vestibular.'},
      {dx:'Causa central crônica',prob:'baixa',detail:'Tumor de fossa posterior, Chiari. RM indicada.'},
      {dx:'Déficit vestibular bilateral',prob:meds.has('aminoglic')?'moderada':'baixa',detail:'Ototoxicidade. vHIT bilateral. Prova calórica.'},
    ];
  }else if(dizType==='presyncope'){
    items=[
      {dx:'Hipotensão ortostática',prob:triggers.has('orthostatic')?'alta':'moderada',detail:'PA em 1 e 3 min. Queda \u226520/10 mmHg.'},
      {dx:'Arritmia cardíaca',prob:symptoms.has('palpitations')||rfStroke.has('fa')?'alta':'moderada',detail:'ECG, Holter 24h. FA, BAV, TVNS.'},
      {dx:'Estenose aórtica',prob:patAge>=2?'moderada':'baixa',detail:'Sopro sistólico, síncope ao esforço. ECO.'},
      {dx:'Vasovagal',prob:'moderada',detail:'Pródromo típico, precipitantes claros, recuperação rápida.'},
      {dx:'Hipoglicemia',prob:rfStroke.has('dm')?'moderada':'baixa',detail:'Glicemia capilar. Insulina/secretagogos.'},
      {dx:'Desidratação / hipovolemia',prob:meds.has('diuretico')?'moderada':'baixa',detail:'Diuréticos, baixa ingesta, perdas. Ureia/creat.'},
      {dx:'TEP',prob:'baixa',detail:'Dispneia + dor torácica. D-dímero, angio-TC.'},
    ];
  }else if(dizType==='disequilibrium'){
    items=[
      {dx:'Multifatorial (idoso)',prob:patAge>=2?'alta':'moderada',detail:'Neuropatia + déficit visual + sarcopenia + polifarmácia. TUG.'},
      {dx:'Efeito medicamentoso',prob:meds.size>0?'alta':'moderada',detail:'Revisar BZDs, anti-HAS, diuréticos, opioides.'},
      {dx:'Neuropatia periférica',prob:rfStroke.has('dm')?'moderada':'baixa',detail:'Monofilamento, reflexos. DM, álcool, B12.'},
      {dx:'Causa cerebelar',prob:symptoms.has('ataxia')?'moderada':'baixa',detail:'Ataxia de marcha, dismetria. RM.'},
      {dx:'Hidrocefalia de pressão normal',prob:'baixa',detail:'Tríade Hakim-Adams: marcha + demência + incontinência.'},
    ];
  }else{
    items=[
      {dx:'Ansiedade / TPPP',prob:'moderada',detail:'Parestesias periorais, taquicardia. GAD-7.'},
      {dx:'Efeito medicamentoso',prob:meds.size>0?'alta':'moderada',detail:'Revisar BZDs, anti-HAS, diuréticos.'},
      {dx:'Hipoglicemia',prob:rfStroke.has('dm')?'moderada':'baixa',detail:'Glicemia capilar.'},
      {dx:'Anemia',prob:'baixa',detail:'Hemograma.'},
      {dx:'Hipotireoidismo',prob:'baixa',detail:'TSH. Fadiga, ganho ponderal.'},
    ];
  }
  return collapsible('diferenciais','Diagnósticos diferenciais',()=>{
    let s='';
    for(const it of items){
      s+=`<div class="diff-item"><span class="diff-prob ${it.prob}">${it.prob}</span>`;
      s+=`<div><div class="diff-name">${it.dx}</div><div class="diff-detail">${it.detail}</div></div></div>`;
    }
    return s;
  });
}

function buildConduta(cls){
  let boxCls,title,items=[];
  if(cls.level==='central'){
    boxCls='alta-prob';title='Conduta \u2014 suspeita de causa central';
    items=[
      {section:'Imagem',list:[
        ['\u{1F6A8}','TC de crânio sem contraste URGENTE (excluir hemorragia)'],
        ['\u{1F9E0}','RM com difusão (padrão-ouro \u2014 TC pode ser NORMAL nas primeiras 48h!)'],
        ['\u{1F4C4}','Angio-TC/RM de vasos cervicais e intracranianos'],
      ]},
      {section:'Laboratório',list:[
        ['\u{1F489}','Hemograma, glicemia, eletrólitos, função renal, coagulograma'],
        ['\u{1F4CB}','ECG em 12 derivações (FA, isquemia)'],
      ]},
      {section:'Conduta',list:[
        ['\u{1F3E5}','Neurologia / protocolo de AVC se < 4,5h'],
        ['\u{26A0}\u{FE0F}','NÃO liberar sem neuroimagem se HINTS central'],
        ['\u{1F6CF}\u{FE0F}','Monitorização, acesso venoso, Glasgow, pupilas'],
      ]},
    ];
    if(symptoms.has('headache')&&symptoms.has('ataxia')){
      items.push({section:'Hemorragia cerebelar?',list:[
        ['\u{1F6A8}','TC imediata \u2014 hemorragia cerebelar visível na TC'],
        ['\u{1F3E5}','Acionar neurocirurgia (risco de herniação)'],
        ['\u{26A0}\u{FE0F}','Monitorar Glasgow a cada 15 min'],
        ['\u{1F48A}','Reverter anticoagulação se em uso'],
      ]});
    }
    if(symptoms.has('neck_pain')&&onset==='sudden'){
      items.push({section:'Dissecção arterial?',list:[
        ['\u{1F6A8}','Angio-TC/RM de vasos cervicais com urgência'],
        ['\u{1F48A}','Anticoagulação após exclusão de hemorragia (discutir neuro)'],
        ['\u{26A0}\u{FE0F}','Evitar manipulação cervical'],
      ]});
    }
    if(symptoms.has('facial_palsy')&&symptoms.has('hearing_loss')){
      items.push({section:'Infarto de AICA?',list:[
        ['\u{1F9E0}','RM com difusão + angio'],
        ['\u{1F442}','Audiometria (hipoacusia neurossensorial aguda)'],
        ['\u{1F3E5}','Internação para monitorização'],
      ]});
    }
    if(symptoms.has('dysphagia')&&symptoms.has('hiccups_horner')){
      items.push({section:'Sd. de Wallenberg?',list:[
        ['\u{1F9E0}','RM com difusão (bulbo lateral)'],
        ['\u{26A0}\u{FE0F}','Avaliar disfagia antes de via oral (aspiração)'],
        ['\u{1F48A}','Antiagregação/anticoagulação conforme etiologia'],
      ]});
    }
  }else if(cls.level==='indeterminado'){
    boxCls='mod-prob';title='Conduta \u2014 risco intermediário';
    items=[
      {section:'Exames',list:[
        ['\u{1F4C4}','TC de crânio para excluir hemorragia'],
        ['\u{1F9E0}','Considerar RM (TC pode ser normal em AVC de fossa posterior)'],
        ['\u{1F4CB}','ECG em 12 derivações'],
        ['\u{1F489}','Hemograma, glicemia, eletrólitos, função renal'],
      ]},
      {section:'Seguimento',list:[
        ['\u{1F50D}','Reavaliação em 24\u201348h obrigatória'],
        ['\u{1F4DE}','Orientar sinais de alarme para retorno imediato'],
      ]},
    ];
    if(dizType==='presyncope'){
      items.push({section:'Cardiovascular',list:[
        ['\u{1FA7A}','PA ortostática (decúbito \u2192 sentado \u2192 em pé, 1 e 3 min)'],
        ['\u{1F4C8}','Holter 24h + ECO se recorrente'],
        ['\u{1F48A}','Revisar anti-HAS, diuréticos, vasodilatadores'],
      ]});
    }
    if(dizType==='vertigo'&&timing==='days'&&hintsSkipped){
      items[0].list.splice(1,0,['\u{26A0}\u{FE0F}','HINTS não realizado em SVA \u2014 neuroimagem obrigatória']);
    }
    if(symptoms.has('facial_palsy')&&symptoms.has('otorrhea')&&dizType==='vertigo'){
      items.push({section:'Ramsay Hunt?',list:[
        ['\u{1F48A}','Aciclovir 800mg VO 5x/dia 7d + prednisona 1mg/kg/d 5d'],
        ['\u{1F442}','Audiometria e avaliação ORL'],
        ['\u{1F50D}','Acompanhar paralisia facial (House-Brackmann)'],
      ]});
    }
  }else{
    boxCls='baixa-prob';title='Conduta \u2014 provável causa periférica';
    if(dixHallpike==='pos'){
      items.push({section:'VPPB \u2014 tratamento',list:[
        ['\u{2705}','Manobra de Epley (canal posterior)'],
        ['\u{1F504}','Repetir se nistagmo persistir (até 3x)'],
        ['\u{1F4CB}','Exercícios de Brandt-Daroff em domicílio'],
        ['\u{1F3E0}','Alta com orientações. Retorno se > 2 semanas'],
      ]});
    }else if(timing==='days'){
      items.push({section:'Neurite vestibular \u2014 tratamento',list:[
        ['\u{1F48A}','Dimenidrinato 50mg 8/8h OU meclizina 25mg 8/8h (48\u201372h)'],
        ['\u{1F48A}','Ondansetrona 4\u20148mg IV/VO se vômitos'],
        ['\u{26A0}\u{FE0F}','Evitar supressores > 72h (atrasa compensação)'],
        ['\u{1F3CB}\u{FE0F}','Reabilitação vestibular precoce'],
        ['\u{1F48A}','Prednisona 1mg/kg/d 5\u20147d com desmame (controverso)'],
      ]});
    }else if(symptoms.has('hearing_loss')||symptoms.has('tinnitus')||symptoms.has('ear_fullness')){
      items.push({section:'Ménière',list:[
        ['\u{1F442}','Encaminhar ORL (audiometria + VNG)'],
        ['\u{1F48A}','Crise: dimenidrinato 50mg + ondansetrona 4mg'],
        ['\u{1F37D}\u{FE0F}','Restrição de sódio (< 2g/d), evitar cafeína/álcool'],
        ['\u{1F48A}','Betaistina 24mg 12/12h (manutenção)'],
      ]});
    }else{
      items.push({section:'Geral',list:[
        ['\u{1F48A}','Sintomáticos conforme quadro'],
        ['\u{1F3E0}','Alta com reavaliação ambulatorial'],
      ]});
    }
    items.push({section:'Orientações',list:[
      ['\u{26A0}\u{FE0F}','Não dirigir até resolução'],
      ['\u{1F4DE}','Retornar se: déficit neurológico, cefaleia intensa, piora, febre, ou > 2 semanas'],
    ]});
  }
  if(meds.size>0){
    items.push({section:'Medicações',list:[['\u{1F48A}','Revisar medicações assinaladas como possíveis causas']]});
  }

  const open=sections.conduta;
  let h=`<div class="box conduta ${boxCls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')" role="button" tabindex="0" aria-expanded="${open}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('conduta')}"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.5rem':'0'}">`;
  if(open){
    for(const g of items){
      h+=`<div class="conduta-section-label">${g.section}</div>`;
      for(const [icon,text] of g.list)h+=`<div class="conduta-item"><span class="conduta-icon">${icon}</span><span>${text}</span></div>`;
    }
  }
  h+='</div></div>';
  return h;
}

function buildABCD2(){
  let s='<p style="font-size:.7rem;color:var(--text-mute);margin-bottom:.75rem;line-height:1.45">Estima risco de AVC em 2\u20147 dias após AIT. Útil para decisão de internação vs alta monitorada.</p>';
  const aAuto=patAge!==null?(patAge>=2?1:0):null;
  const aVal=abcd2.a!==null?abcd2.a:aAuto;
  s+=`<div class="score-row"><div class="score-row-label"><span>A \u2014 Idade \u2265 60 anos</span>${abcd2.a===null&&aAuto!==null?'<span class="auto-tag">Auto</span>':''}</div>`;
  s+='<div class="segmented">';
  s+=`<button class="seg ${aVal===0?'picked':''}" onclick="setABCD2('a',0)">Não<span class="sub">0 pt</span></button>`;
  s+=`<button class="seg ${aVal===1?'picked':''}" onclick="setABCD2('a',1)">Sim<span class="sub">1 pt</span></button>`;
  s+='</div></div>';
  s+=`<div class="score-row"><div class="score-row-label"><span>B \u2014 PA \u2265 140/90</span></div>`;
  s+='<div class="segmented">';
  s+=`<button class="seg ${abcd2.b===0?'picked':''}" onclick="setABCD2('b',0)">Não<span class="sub">0 pt</span></button>`;
  s+=`<button class="seg ${abcd2.b===1?'picked':''}" onclick="setABCD2('b',1)">Sim<span class="sub">1 pt</span></button>`;
  s+='</div></div>';
  s+=`<div class="score-row"><div class="score-row-label"><span>C \u2014 Sintomas</span></div>`;
  s+='<div class="segmented">';
  s+=`<button class="seg ${abcd2.c===0?'picked':''}" onclick="setABCD2('c',0)">Outros<span class="sub">0 pt</span></button>`;
  s+=`<button class="seg ${abcd2.c===1?'picked':''}" onclick="setABCD2('c',1)">Fala<span class="sub">1 pt</span></button>`;
  s+=`<button class="seg ${abcd2.c===2?'picked':''}" onclick="setABCD2('c',2)">Fraqueza<span class="sub">2 pt</span></button>`;
  s+='</div></div>';
  s+=`<div class="score-row"><div class="score-row-label"><span>D \u2014 Duração</span></div>`;
  s+='<div class="segmented">';
  s+=`<button class="seg ${abcd2.d===0?'picked':''}" onclick="setABCD2('d',0)"><10 min<span class="sub">0 pt</span></button>`;
  s+=`<button class="seg ${abcd2.d===1?'picked':''}" onclick="setABCD2('d',1)">10\u201359<span class="sub">1 pt</span></button>`;
  s+=`<button class="seg ${abcd2.d===2?'picked':''}" onclick="setABCD2('d',2)">\u226560<span class="sub">2 pt</span></button>`;
  s+='</div></div>';
  const d2Auto=rfStroke.has('dm')?1:0;
  const d2Val=abcd2.d2!==null?abcd2.d2:d2Auto;
  s+=`<div class="score-row"><div class="score-row-label"><span>D\u00B2 \u2014 Diabetes</span>${abcd2.d2===null?'<span class="auto-tag">Auto</span>':''}</div>`;
  s+='<div class="segmented">';
  s+=`<button class="seg ${d2Val===0?'picked':''}" onclick="setABCD2('d2',0)">Não<span class="sub">0 pt</span></button>`;
  s+=`<button class="seg ${d2Val===1?'picked':''}" onclick="setABCD2('d2',1)">Sim<span class="sub">1 pt</span></button>`;
  s+='</div></div>';
  const t=getABCD2();
  if(t!==null){
    let sc,sl,sd;
    if(t<=3){sc='sr-low';sl='Baixo risco';sd=`ABCD\u00B2 ${t}/7 \u2014 AVC em 2d ~1%. Alta com reavaliação precoce (24\u201348h).`}
    else if(t<=5){sc='sr-mod';sl='Risco moderado';sd=`ABCD\u00B2 ${t}/7 \u2014 AVC em 2d ~4%. Considerar internação.`}
    else{sc='sr-high';sl='Alto risco';sd=`ABCD\u00B2 ${t}/7 \u2014 AVC em 2d ~8%. Internação e investigação vascular.`}
    s+=`<div class="score-result ${sc}"><div class="score-num">${t}</div><div style="flex:1"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  }else{
    s+='<div class="score-result sr-pending"><div class="score-num">?</div><div style="flex:1"><div class="score-label">Preencha todos os campos</div><div class="score-detail">Campos "Auto" pré-preenchidos pelos dados do paciente.</div></div></div>';
  }
  return s;
}

function buildNote(cls,flags){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const ages=['< 45','45\u201359','60\u201374','\u2265 75'];
  const t=DIZZINESS_TYPES.find(x=>x.id===dizType);
  const tm=TIMING_OPTIONS.find(x=>x.id===timing);
  const on=ONSET_OPTIONS.find(x=>x.id===onset);
  let n=`TONTURA \u2014 AVALIAÇÃO ESTRUTURADA NO PS\nData/hora: ${ts}\n${'='.repeat(45)}\n\n`;
  n+=`PACIENTE: ${patSex==='M'?'Masculino':'Feminino'}, ${ages[patAge]} anos\n`;
  const rfNames=RF_STROKE.filter(x=>rfStroke.has(x.id)).map(x=>x.label);
  n+=`FR AVC: ${rfNames.length?rfNames.join(', '):'Nenhum'}\n`;
  if(meds.size>0){n+=`Medicações: ${MEDS.filter(x=>meds.has(x.id)).map(x=>x.label).join(', ')}\n`}
  n+=`\nQUADRO\n  Tipo: ${t?t.label:'\u2014'}\n  Duração: ${tm?tm.label:'\u2014'}\n  Instalação: ${on?on.label:'Não informado'}\n`;
  const trigNames=TRIGGER_OPTIONS.filter(x=>triggers.has(x.id)).map(x=>x.label);
  n+=`  Gatilhos: ${trigNames.length?trigNames.join(', '):'Nenhum'}\n`;
  if(dixHallpike)n+=`  Dix-Hallpike: ${dixHallpike==='pos'?'Positivo':dixHallpike==='neg'?'Negativo':'Não realizado'}\n`;
  const symNames=[];for(const g of [ASSOCIATED_SYMPTOMS.otologic,ASSOCIATED_SYMPTOMS.neurologic,ASSOCIATED_SYMPTOMS.general])for(const s of g)if(symptoms.has(s.id))symNames.push(s.label);
  n+=`  Sintomas: ${symNames.length?symNames.join(', '):'Nenhum'}\n`;
  if(!hintsSkipped&&(hints.hi!==null||hints.nyst!==null||hints.skew!==null)){
    n+=`\nHINTS\n`;
    const lbl=(v,p,c)=>v==='p'?p:v==='c'?c:'Não avaliado';
    n+=`  Head Impulse: ${lbl(hints.hi,'Sacada presente (periférico)','Sem sacada (CENTRAL)')}\n`;
    n+=`  Nistagmo: ${lbl(hints.nyst,'Unidirecional (periférico)','Direction-changing (CENTRAL)')}\n`;
    n+=`  Test of Skew: ${lbl(hints.skew,'Ausente (periférico)','Presente (CENTRAL)')}\n`;
    const r=getHintsInterp();if(r)n+=`  Interpretação: ${r.text}\n`;
    if(hintsPlusWarn())n+=`  Obs: HINTS plus (hipoacusia) \u2192 considerar AICA\n`;
  }else if(hintsSkipped)n+=`\nHINTS: Não realizado\n`;
  else n+=`\nHINTS: Não preenchido\n`;
  n+=`\nCLASSIFICAÇÃO: ${cls.title}\n${cls.desc}\nÍndice de risco central: ${getCentralScore().toFixed(1)}/10\n`;
  if(flags.length>0){n+=`\nSINAIS DE ALARME\n`;for(const f of flags)n+=`  [${f.flag==='red'?'RED FLAG':'ATENÇÃO'}] ${f.label}\n`}
  const ab=getABCD2();
  if(ab!==null){const r=ab<=3?'Baixo':ab<=5?'Moderado':'Alto';n+=`\nABCD\u00B2: ${ab}/7 \u2014 Risco ${r}\n`;if(ab>=4)n+=`  Recomendação: internação p/ investigação vascular\n`}
  n+=`\nCONDUTA\n`;
  if(cls.level==='central'){
    n+=`  - TC crânio urgente + RM com difusão\n  - Angio-TC/RM vasos cervicais e intracranianos\n  - Avaliação neurologia / protocolo AVC\n  - ECG, laboratório completo, monitorização\n`;
    if(symptoms.has('headache')&&symptoms.has('ataxia'))n+=`  - Excluir hemorragia cerebelar / acionar neurocirurgia\n`;
    if(symptoms.has('neck_pain')&&onset==='sudden')n+=`  - Investigar dissecção arterial\n`;
    if(symptoms.has('facial_palsy')&&symptoms.has('hearing_loss'))n+=`  - Investigar infarto de AICA\n`;
    if(symptoms.has('dysphagia')&&symptoms.has('hiccups_horner'))n+=`  - Investigar Sd. de Wallenberg\n`;
  }else if(cls.level==='indeterminado'){
    n+=`  - TC crânio para excluir hemorragia\n  - Considerar RM com difusão\n  - ECG, laboratório básico\n  - Reavaliação em 24\u201348h\n  - Orientações de sinais de alarme\n`;
    if(dizType==='presyncope')n+=`  - PA ortostática, Holter se recorrente\n`;
    if(symptoms.has('facial_palsy')&&symptoms.has('otorrhea')&&dizType==='vertigo')n+=`  - Ramsay Hunt (aciclovir + corticoide)\n`;
  }else{
    if(dixHallpike==='pos')n+=`  - Manobra de Epley realizada\n  - Brandt-Daroff em casa\n  - Reavaliação 1\u20142 semanas\n`;
    else if(timing==='days')n+=`  - Dimenidrinato 50mg 8/8h (máx 72h)\n  - Reabilitação vestibular precoce\n  - Considerar prednisona 1mg/kg/d 5\u20147d\n`;
    n+=`  - Sintomáticos\n  - Não dirigir até resolução\n  - Alta com acompanhamento ambulatorial\n`;
  }
  if(meds.size>0)n+=`  - Revisão medicamentosa\n`;
  n+=`\n${'='.repeat(45)}\nFerramenta de apoio à decisão clínica. Não substitui o julgamento médico.\n`;
  const e=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${e}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()" aria-label="Copiar nota"><span>\u{1F4CB}</span> Copiar para prontuário</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');if(!el)return;
  const text=el.textContent||el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onCopyOk).catch(fallbackCopy);
  }else fallbackCopy();
}
function onCopyOk(){
  const b=document.getElementById('copyBtn');if(!b)return;
  b.innerHTML='<span>\u2713</span> Copiado!';b.classList.add('copied');
  setTimeout(()=>{if(b){b.innerHTML='<span>\u{1F4CB}</span> Copiar para prontuário';b.classList.remove('copied')}},2400);
}
function fallbackCopy(){
  const el=document.getElementById('noteContent');if(!el)return;
  const r=document.createRange();r.selectNodeContents(el);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  try{document.execCommand('copy');onCopyOk()}catch(e){sel.removeAllRanges()}
}

function setDizType(v){dizType=v;render()}
function setTiming(v){timing=v;if(v!=='seconds')dixHallpike=null;render()}
function setOnset(v){onset=onset===v?null:v;render()}
function toggleTrigger(id){triggers.has(id)?triggers.delete(id):triggers.add(id);if(id==='positional'&&!triggers.has('positional'))dixHallpike=null;render()}
function setDixHallpike(v){dixHallpike=dixHallpike===v?null:v;render()}
function setPatAge(v){patAge=patAge===v?null:v;render()}
function setPatSex(v){patSex=patSex===v?null:v;render()}
function toggleRF(id){rfStroke.has(id)?rfStroke.delete(id):rfStroke.add(id);render()}
function toggleMed(id){meds.has(id)?meds.delete(id):meds.add(id);render()}
function setHints(field,v){hints[field]=hints[field]===v?null:v;render()}
function toggleSymptom(id){symptoms.has(id)?symptoms.delete(id):symptoms.add(id);render()}
function toggleSection(id){sections[id]=!sections[id];render()}
function setABCD2(f,v){abcd2[f]=abcd2[f]===v?null:v;render()}
function skipHints(){hintsSkipped=true;hints={hi:null,nyst:null,skew:null};render()}
function unskipHints(){hintsSkipped=false;render()}

function goToStep(i){if(i<step){step=i;render();window.scrollTo({top:0,behavior:'smooth'})}}
function next(){
  if(step===0&&dizType===null)return;
  if(step===1&&timing===null)return;
  if(step===2&&(patAge===null||patSex===null))return;
  step++;render();window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){if(step>0){step--;render();window.scrollTo({top:0,behavior:'smooth'})}}

function confirmRestart(){
  if(step===5){
    const o=document.createElement('div');
    o.className='modal-overlay';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
    o.innerHTML=`<div class="modal-box">
      <div style="font-size:1.15rem;margin-bottom:.35rem">\u{26A0}\u{FE0F}</div>
      <div style="font-size:.9rem;font-weight:600;color:var(--text-hi);margin-bottom:.25rem">Recomeçar avaliação?</div>
      <div style="font-size:.74rem;color:var(--text-mute);margin-bottom:.9rem;line-height:1.4">Todos os dados serão perdidos.</div>
      <div style="display:flex;gap:.45rem">
        <button id="cancelRestartBtn" class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
        <button class="modal-btn confirm" onclick="this.closest('.modal-overlay').remove();restart()">Recomeçar</button>
      </div></div>`;
    document.body.appendChild(o);
    o.addEventListener('click',e=>{if(e.target===o)o.remove()});
    requestAnimationFrame(()=>{const b=document.getElementById('cancelRestartBtn');if(b)b.focus()});
    document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){o.remove();document.removeEventListener('keydown',esc)}});
  }else restart();
}
function restart(){
  step=0;dizType=null;timing=null;triggers=new Set();onset=null;
  patAge=null;patSex=null;rfStroke=new Set();meds=new Set();
  hints={hi:null,nyst:null,skew:null};dixHallpike=null;hintsSkipped=false;
  symptoms=new Set();abcd2={a:null,b:null,c:null,d:null,d2:null};
  sections={classification:false,hints_summary:false,diferenciais:false,conduta:true,abcd2:false,note:true};
  render();window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
</body>
</html>
