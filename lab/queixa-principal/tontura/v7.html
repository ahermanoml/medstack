<!-- VERSION: 7 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>Tontura · Avaliação estruturada</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0f1a;--bg-elev:#151d2e;--bg-elev2:#1a2436;--bg-deep:#0d1424;
    --border:#1e293b;--border-soft:#334155;
    --text:#e2e8f0;--text-dim:#94a3b8;--text-mute:#64748b;--text-faint:#475569;--text-hi:#f1f5f9;
    --accent:#3b82f6;--accent-lt:#60a5fa;--accent-soft:#93c5fd;--accent-deep:#1e3a5f;
    --red:#ef4444;--red-dk:#7f1d1d;--red-soft:#fca5a5;
    --amber:#f59e0b;--amber-dk:#78350f;--amber-soft:#fcd34d;
    --green:#22c55e;--green-dk:#14532d;--green-soft:#86efac;
  }
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0);overflow-x:hidden}

  /* ===============================================
     HEADER — vestibular orbital identity
     =============================================== */
  header{background:linear-gradient(135deg,#111827 0%,#1a2332 100%);width:100%;padding:1.1rem 1.25rem 1rem;padding-top:calc(1.1rem + env(safe-area-inset-top,0));text-align:center;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
  header::before,header::after{content:'';position:absolute;left:50%;top:50%;border:1px solid rgba(59,130,246,.15);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
  header::before{width:280px;height:160px;border-color:rgba(59,130,246,.12);animation:orbit-drift 22s ease-in-out infinite}
  header::after{width:420px;height:240px;border-color:rgba(96,165,250,.08);animation:orbit-drift 30s ease-in-out infinite reverse}
  @keyframes orbit-drift{0%,100%{transform:translate(-50%,-50%) rotate(0deg);opacity:.6}50%{transform:translate(-50%,-50%) rotate(6deg);opacity:.9}}
  header h1{font-size:1.22rem;font-weight:700;color:var(--text-hi);letter-spacing:-.02em;position:relative;z-index:1}
  header .subtitle{font-size:.7rem;color:var(--text-mute);margin-top:.22rem;letter-spacing:.04em;position:relative;z-index:1;font-variant:small-caps}
  .back-link{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-mute);text-decoration:none;font-size:.78rem;font-weight:500;transition:color .2s;display:flex;align-items:center;gap:.25rem;min-height:44px;min-width:44px;z-index:2}
  .back-link:hover,.back-link:focus-visible{color:var(--accent-soft);outline:none}

  .container{max-width:680px;width:100%;padding:1rem;display:flex;flex-direction:column;gap:.9rem}

  /* ===============================================
     PROGRESS — nystagmus sweep line
     =============================================== */
  .progress{position:relative;padding:0 .25rem}
  .progress-bar{display:flex;align-items:center;gap:3px}
  .progress-step{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .4s ease,box-shadow .4s ease}
  .progress-step.done{background:var(--accent)}
  .progress-step.active{background:var(--accent-lt);box-shadow:0 0 10px rgba(96,165,250,.5);position:relative;overflow:hidden}
  .progress-step.active::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:nystagmus 1.6s ease-in-out infinite}
  @keyframes nystagmus{0%,100%{transform:translateX(-100%)}60%{transform:translateX(100%)}65%{transform:translateX(-100%)}}
  .progress-labels{display:flex;justify-content:space-between;font-size:.56rem;color:var(--text-faint);padding:0 .25rem;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
  .progress-labels span{transition:color .3s;min-height:24px;display:flex;align-items:center;padding:0 2px;font-weight:600}
  .progress-labels span.active-label{color:var(--accent-soft)}
  .progress-labels span.done-label{cursor:pointer;color:var(--accent)}
  .progress-labels span.done-label:hover{color:var(--accent-soft)}
  .progress-labels span.done-label:focus-visible{outline:2px solid var(--accent-lt);outline-offset:2px;border-radius:2px}

  /* ===============================================
     CARD
     =============================================== */
  .card{background:linear-gradient(180deg,var(--bg-elev) 0%,var(--bg-elev2) 100%);border:1px solid var(--border);border-radius:.95rem;padding:1.4rem 1.2rem;animation:cardIn .3s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 24px rgba(0,0,0,.25)}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-size:1.02rem;color:var(--text-hi);margin-bottom:.2rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
  .card .subtitle{font-size:.74rem;color:var(--text-mute);margin-bottom:1rem}
  .step-count{display:inline-flex;align-items:center;justify-content:center;background:var(--accent-deep);color:var(--accent-lt);font-size:.58rem;font-weight:700;padding:.15rem .45rem;border-radius:9999px;letter-spacing:.05em}

  .chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.7rem}
  .chip{font-size:.62rem;padding:.18rem .5rem;border-radius:9999px;background:rgba(30,58,95,.6);color:var(--accent-soft);font-weight:600;border:1px solid rgba(37,99,235,.25);letter-spacing:.01em}

  /* ===============================================
     OPTION BUTTONS
     =============================================== */
  .options{display:flex;flex-direction:column;gap:.5rem}
  .group-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint);margin-top:.7rem;margin-bottom:-.05rem;font-weight:700}
  .group-label:first-child{margin-top:0}
  .group-label .hint{font-size:.58rem;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-mute);margin-left:.35rem}
  .group-label .flag-hint{color:var(--red-soft);font-weight:700;margin-left:.35rem;font-size:.55rem}

  .option-btn{background:var(--bg-deep);border:1.5px solid var(--border);border-radius:.7rem;padding:.72rem .8rem;color:var(--text-dim);font-size:.86rem;cursor:pointer;transition:border-color .15s,background .15s,color .15s,transform .08s;text-align:left;display:flex;align-items:center;gap:.6rem;-webkit-tap-highlight-color:transparent;min-height:52px;width:100%;font-family:inherit}
  .option-btn:hover{border-color:var(--accent);color:var(--text)}
  .option-btn:active{transform:scale(.985)}
  .option-btn:focus-visible{outline:2px solid var(--accent-lt);outline-offset:2px}
  .option-btn.selected{border-color:var(--accent);background:#0f2847;color:var(--text-hi);box-shadow:0 0 0 1px rgba(59,130,246,.25),0 2px 14px rgba(37,99,235,.18)}
  .option-btn .icon{font-size:1.15rem;flex-shrink:0;width:1.7rem;text-align:center}
  .option-btn .label{flex:1;line-height:1.3}
  .option-btn .label small{display:block;font-size:.68rem;color:var(--text-mute);margin-top:.1rem;font-weight:400;line-height:1.4}
  .option-btn.selected .label small{color:var(--accent-soft)}
  .option-btn .tag{font-size:.57rem;text-transform:uppercase;letter-spacing:.06em;padding:.18rem .45rem;border-radius:9999px;font-weight:700;flex-shrink:0;background:var(--border);color:var(--text-mute)}
  .option-btn.selected .tag{background:var(--accent-deep);color:var(--accent-soft)}

  .check-btn{background:var(--bg-deep);border:1.5px solid var(--border);border-radius:.6rem;padding:.58rem .78rem;color:var(--text-dim);font-size:.82rem;cursor:pointer;transition:border-color .15s,background .15s,color .15s;text-align:left;display:flex;align-items:center;gap:.6rem;-webkit-tap-highlight-color:transparent;min-height:46px;width:100%;font-family:inherit}
  .check-btn:hover{border-color:var(--accent);color:var(--text)}
  .check-btn:focus-visible{outline:2px solid var(--accent-lt);outline-offset:2px}
  .check-btn.checked{border-color:var(--accent);background:#0f2847;color:var(--text-hi)}
  .check-box{width:16px;height:16px;border:2px solid var(--border-soft);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:.65rem;color:transparent;line-height:1}
  .check-btn.checked .check-box{background:var(--accent);border-color:var(--accent);color:#fff}
  .check-btn .label{flex:1;line-height:1.3}
  .check-btn .label small{display:block;font-size:.66rem;color:var(--text-mute);margin-top:.08rem;font-weight:400;line-height:1.4}
  .check-btn .rf-tag{font-size:.55rem;text-transform:uppercase;letter-spacing:.05em;padding:.12rem .38rem;border-radius:9999px;font-weight:700;flex-shrink:0}
  .rf-tag.red{background:var(--red-dk);color:var(--red-soft)}.rf-tag.yellow{background:var(--amber-dk);color:var(--amber-soft)}

  .segmented{display:flex;gap:.3rem}
  .seg{flex:1;padding:.5rem .2rem;border-radius:.55rem;font-size:.72rem;cursor:pointer;border:1.5px solid var(--border);background:var(--bg-deep);color:var(--text-faint);text-align:center;transition:all .15s;line-height:1.25;-webkit-tap-highlight-color:transparent;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit}
  .seg:hover{border-color:var(--accent);color:var(--text-dim)}
  .seg:focus-visible{outline:2px solid var(--accent-lt);outline-offset:2px}
  .seg.picked{border-color:var(--accent);background:#0f2847;color:var(--text-hi);font-weight:600}
  .seg .sub{display:block;font-size:.54rem;color:var(--text-faint);margin-top:.15rem;font-weight:400}
  .seg.picked .sub{color:var(--accent-soft)}

  /* ===============================================
     NAV
     =============================================== */
  .nav-row{display:flex;gap:.5rem;margin-top:1rem}
  .nav-btn{flex:1;padding:.72rem;border-radius:.65rem;font-size:.86rem;font-weight:600;cursor:pointer;transition:all .15s;border:none;letter-spacing:.01em;-webkit-tap-highlight-color:transparent;min-height:46px;display:flex;align-items:center;justify-content:center;gap:.35rem;font-family:inherit}
  .nav-btn.secondary{background:var(--border);color:var(--text-dim);border:1.5px solid var(--border-soft)}
  .nav-btn.secondary:hover{background:var(--border-soft);color:var(--text)}
  .nav-btn.primary{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;box-shadow:0 2px 12px rgba(37,99,235,.25)}
  .nav-btn.primary:hover{box-shadow:0 4px 16px rgba(37,99,235,.35);transform:translateY(-1px)}
  .nav-btn.primary:active{transform:translateY(0) scale(.98)}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}
  .nav-btn:focus-visible{outline:2px solid var(--accent-lt);outline-offset:2px}
  .nav-btn.skip{background:transparent;color:var(--text-faint);border:1.5px dashed var(--border-soft);flex:.7}
  .nav-btn.skip:hover{color:var(--text-dim);border-color:var(--text-faint)}

  /* ===============================================
     INFO BOX
     =============================================== */
  .info{background:rgba(12,26,51,.7);border:1px solid var(--accent-deep);border-left:3px solid var(--accent);border-radius:.5rem;padding:.62rem .8rem;margin-top:.65rem;font-size:.76rem;color:var(--accent-soft);line-height:1.5}
  .info strong{color:var(--accent-lt)}
  .info.warn{background:rgba(26,18,5,.7);border-color:var(--amber-dk);border-left-color:var(--amber);color:var(--amber-soft)}
  .info.warn strong{color:#fbbf24}
  .info.danger{background:rgba(26,5,5,.8);border-color:var(--red-dk);border-left-color:var(--red);color:var(--red-soft)}
  .info.danger strong{color:#f87171}

  /* ===============================================
     HINTS
     =============================================== */
  .hints-block{margin-top:1rem;padding-top:.85rem;border-top:1px solid var(--border)}
  .hints-block:first-of-type{margin-top:.5rem;padding-top:0;border-top:none}
  .hints-header{font-size:.85rem;color:var(--text);font-weight:700;margin-bottom:.25rem;display:flex;align-items:center;gap:.4rem}
  .h-num{display:inline-flex;align-items:center;justify-content:center;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--border);color:var(--text-mute);font-size:.65rem;font-weight:700;flex-shrink:0}
  .hints-desc{font-size:.68rem;color:var(--text-mute);margin-bottom:.42rem;line-height:1.5}
  .hints-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
  .hints-cell{background:var(--bg-deep);border:1.5px solid var(--border);border-radius:.55rem;padding:.55rem;text-align:center;cursor:pointer;transition:all .15s ease;font-size:.74rem;line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:52px;color:var(--text-dim);font-family:inherit;width:100%}
  .hints-cell:hover{border-color:var(--accent);transform:translateY(-1px)}
  .hints-cell:focus-visible{outline:2px solid var(--accent-lt);outline-offset:2px}
  .hints-cell.sel-periph{border-color:var(--green);background:#051a0e;color:var(--green-soft)}
  .hints-cell.sel-central{border-color:var(--red);background:#1a0808;color:var(--red-soft)}
  .hints-cell .hints-label{font-size:.54rem;text-transform:uppercase;color:var(--text-faint);margin-bottom:.16rem;letter-spacing:.08em;font-weight:700}
  .hints-cell.sel-periph .hints-label{color:#4ade80}
  .hints-cell.sel-central .hints-label{color:#f87171}
  .hints-cell small{display:block;font-size:.6rem;color:var(--text-faint);margin-top:.14rem;font-weight:400;line-height:1.35}

  .hints-result{display:flex;align-items:center;gap:.6rem;padding:.68rem .82rem;border-radius:.55rem;margin-top:.85rem;font-size:.78rem;font-weight:600;animation:fadeIn .25s ease;line-height:1.4}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .hints-result.hr-central{background:linear-gradient(135deg,#1a0808,#2a0a0a);border:1.5px solid var(--red-dk);color:var(--red-soft)}
  .hints-result.hr-periph{background:linear-gradient(135deg,#081f12,#0a2a16);border:1.5px solid var(--green-dk);color:var(--green-soft)}
  .hints-result.hr-pending{background:var(--bg-deep);border:1.5px solid var(--border);color:var(--text-faint)}
  .hr-icon{font-size:1.02rem;flex-shrink:0}

  /* ===============================================
     RESULT
     =============================================== */
  .result-card{text-align:center;padding:1.6rem 1.15rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:3.8rem;height:3.8rem;border-radius:50%;font-size:1.35rem;margin-bottom:.6rem;animation:badgeIn .45s cubic-bezier(.4,0,.2,1);position:relative}
  @keyframes badgeIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .result-badge::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:1.5px solid currentColor;opacity:.2;animation:badge-orbit 4s linear infinite}
  @keyframes badge-orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .badge-central{background:linear-gradient(135deg,#991b1b,#7f1d1d);color:var(--red-soft);border:3px solid var(--red)}
  .badge-periferico{background:linear-gradient(135deg,#166534,#14532d);color:var(--green-soft);border:3px solid var(--green)}
  .badge-indeterminado{background:linear-gradient(135deg,#92400e,#78350f);color:var(--amber-soft);border:3px solid var(--amber)}
  .result-title{font-size:1.12rem;font-weight:700;margin-bottom:.22rem;letter-spacing:-.01em;color:var(--text-hi)}
  .result-desc{color:var(--text-dim);font-size:.8rem;margin-bottom:1.1rem;line-height:1.55;max-width:480px;margin-left:auto;margin-right:auto}

  .emergency-banner{background:linear-gradient(135deg,#450a0a,#7f1d1d);border:1.5px solid var(--red);border-radius:.65rem;padding:.7rem .88rem;display:flex;align-items:center;gap:.55rem;margin-bottom:.85rem;text-align:left;animation:pulse-em 2.4s ease-in-out infinite}
  @keyframes pulse-em{0%,100%{box-shadow:0 0 6px rgba(239,68,68,.2)}50%{box-shadow:0 0 18px rgba(239,68,68,.4)}}
  .em-icon{font-size:1.25rem;flex-shrink:0}
  .em-text{font-size:.76rem;color:var(--red-soft);font-weight:600;line-height:1.4}

  .risk-meter-wrap{text-align:left;width:100%;margin-bottom:.95rem}
  .risk-meter{height:8px;border-radius:4px;background:linear-gradient(to right,#166534 0%,#166534 28%,#78350f 50%,#991b1b 72%,#991b1b 100%);position:relative;overflow:visible}
  .risk-marker{position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--text-hi);border:2.5px solid var(--bg);transform:translateX(-50%);transition:left .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(241,245,249,.35)}
  .risk-labels{display:flex;justify-content:space-between;font-size:.55rem;color:var(--text-faint);font-weight:600;letter-spacing:.05em;margin-top:.32rem;text-transform:uppercase}

  .flag-list{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
  .flag-pill{font-size:.66rem;padding:.2rem .55rem;border-radius:9999px;font-weight:600;animation:fadeIn .25s ease;letter-spacing:.01em}
  .flag-pill.red{background:var(--red-dk);color:var(--red-soft);border:1px solid #991b1b}
  .flag-pill.green{background:var(--green-dk);color:var(--green-soft);border:1px solid #166534}
  .flag-pill.yellow{background:var(--amber-dk);color:var(--amber-soft);border:1px solid #92400e}
  .flags-title{font-size:.58rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.32rem;font-weight:700}
  .no-flag-pill{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .55rem;background:#051a0e;border:1px solid var(--green-dk);border-radius:9999px;font-size:.7rem;color:var(--green-soft);font-weight:600}

  .sections{display:flex;flex-direction:column;gap:.6rem;width:100%;margin-top:.9rem;text-align:left}

  .box{background:#111827;border:1px solid var(--border);border-radius:.7rem;padding:.95rem;transition:border-color .15s}
  .box h3{font-size:.72rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;font-weight:700}
  .box.conduta.alta-prob{background:linear-gradient(180deg,#1a0808,#1f0a0a);border:1.5px solid var(--red-dk)}
  .box.conduta.alta-prob h3{color:var(--red-soft)}
  .box.conduta.mod-prob{background:linear-gradient(180deg,#1a1205,#1f1508);border:1.5px solid var(--amber-dk)}
  .box.conduta.mod-prob h3{color:var(--amber-soft)}
  .box.conduta.baixa-prob{background:linear-gradient(180deg,#051a0e,#081f12);border:1.5px solid var(--green-dk)}
  .box.conduta.baixa-prob h3{color:var(--green-soft)}

  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid #1a2234;font-size:.78rem;gap:.4rem}
  .summary-row:last-child{border-bottom:none}
  .summary-row .criteria{color:var(--text-mute);flex-shrink:0}
  .summary-row .value{font-weight:600;display:flex;align-items:center;gap:.35rem;color:var(--text);text-align:right;word-break:break-word;justify-content:flex-end;flex:1}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .dot-central{background:var(--red);box-shadow:0 0 4px rgba(239,68,68,.4)}
  .dot-periferico{background:var(--green);box-shadow:0 0 4px rgba(34,197,94,.4)}
  .dot-neutro{background:var(--text-faint)}

  .conduta-item{display:flex;align-items:flex-start;gap:.5rem;padding:.28rem 0;font-size:.78rem;color:#cbd5e1;line-height:1.45}
  .conduta-icon{flex-shrink:0;width:1.1rem;text-align:center;font-size:.86rem}
  .conduta-section-label{font-size:.56rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:700;margin-top:.55rem;margin-bottom:.08rem}
  .conduta-section-label:first-child{margin-top:0}

  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:.15rem 0;-webkit-tap-highlight-color:transparent;min-height:32px}
  .collapse-header:hover h3{color:var(--text-dim)}
  .collapse-header:focus-visible{outline:2px solid var(--accent-lt);outline-offset:2px;border-radius:3px}
  .collapse-header h3{margin-bottom:0;transition:color .15s}
  .collapse-arrow{font-size:.65rem;color:var(--text-faint);transition:transform .25s ease}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .25s ease,opacity .2s ease}
  .collapse-body.hidden{max-height:0!important;opacity:0;padding-top:0;margin-top:0}
  .collapse-body.visible{max-height:6000px;opacity:1}

  .diff-item{display:flex;align-items:flex-start;gap:.5rem;padding:.5rem .6rem;background:var(--bg-deep);border-radius:.45rem;border:1px solid var(--border);margin-bottom:.32rem}
  .diff-item:last-child{margin-bottom:0}
  .diff-prob{font-size:.55rem;text-transform:uppercase;letter-spacing:.06em;padding:.15rem .4rem;border-radius:9999px;font-weight:700;flex-shrink:0;margin-top:.1rem;white-space:nowrap}
  .diff-prob.alta{background:var(--red-dk);color:var(--red-soft)}
  .diff-prob.moderada{background:var(--amber-dk);color:var(--amber-soft)}
  .diff-prob.baixa{background:var(--green-dk);color:var(--green-soft)}
  .diff-name{font-size:.8rem;font-weight:600;color:var(--text)}
  .diff-detail{font-size:.68rem;color:var(--text-mute);margin-top:.08rem;line-height:1.45}

  .score-row{margin-bottom:.55rem}
  .score-row:last-child{margin-bottom:0}
  .score-row-label{font-size:.76rem;color:var(--text-dim);margin-bottom:.28rem;display:flex;justify-content:space-between;align-items:center}
  .auto-tag{font-size:.52rem;background:var(--accent-deep);color:var(--accent-lt);padding:.1rem .35rem;border-radius:9999px;font-weight:700;letter-spacing:.04em}
  .score-result{display:flex;align-items:center;gap:.8rem;padding:.72rem;border-radius:.6rem;margin-top:.55rem;animation:fadeIn .25s ease}
  .score-result.sr-high{background:linear-gradient(135deg,#1f0808,#2a0a0a);border:1.5px solid var(--red-dk)}
  .score-result.sr-mod{background:linear-gradient(135deg,#1f1508,#2a1c0a);border:1.5px solid var(--amber-dk)}
  .score-result.sr-low{background:linear-gradient(135deg,#081f12,#0a2a16);border:1.5px solid var(--green-dk)}

  .score-num{font-size:1.65rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace;min-width:2rem;text-align:center;line-height:1}

  .sr-mod .score-num{color:var(--amber-soft)}

  .score-label{font-size:.78rem;font-weight:700;color:var(--text-hi)}
  .score-detail{font-size:.68rem;color:var(--text-dim);margin-top:.08rem;line-height:1.4}

  .note-text{background:#060a14;border:1px solid var(--border);border-radius:.45rem;padding:.78rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.66rem;color:var(--text-dim);white-space:pre-wrap;line-height:1.62;max-height:300px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;-webkit-overflow-scrolling:touch}
  .note-text::-webkit-scrollbar{width:4px}
  .note-text::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.35rem;width:100%;margin-top:.5rem;padding:.6rem;border-radius:.5rem;border:1.5px solid var(--border);background:var(--bg-deep);color:var(--text-dim);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;min-height:44px;font-family:inherit}
  .copy-btn:hover{border-color:var(--accent);background:#0f2847;color:var(--text-hi)}
  .copy-btn.copied{border-color:var(--green);background:#051a0e;color:var(--green-soft)}

  .eval-time{font-size:.56rem;color:var(--text-faint);text-align:center;margin-top:.2rem;letter-spacing:.04em;text-transform:uppercase}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:999;animation:fadeIn .18s ease;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:1rem}
  .modal-box{background:var(--bg-elev2);border:1px solid var(--border-soft);border-radius:.8rem;padding:1.3rem 1.15rem;max-width:320px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .modal-btn{flex:1;padding:.6rem;border-radius:.5rem;font-size:.8rem;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit}
  .modal-btn.cancel{border:1.5px solid var(--border-soft);background:var(--border);color:var(--text-dim)}
  .modal-btn.confirm{border:none;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}

  @media(max-width:500px){
    .container{padding:.75rem}
    .card{padding:1.15rem .95rem}

    header::before{width:240px;height:140px}
    header::after{width:360px;height:220px}
    .progress-labels{font-size:.5rem}
    .progress-labels span{min-height:28px}
    .seg{font-size:.66rem;padding:.42rem .15rem}
    .seg .sub{font-size:.5rem}
    .hints-grid{gap:.3rem}
    .hints-cell{font-size:.7rem;padding:.5rem .4rem}
    .result-title{font-size:1.02rem}
    .result-desc{font-size:.76rem}
    .back-link{left:.75rem;font-size:.72rem}
    header{padding:1rem .9rem .95rem}
    .nav-btn{font-size:.8rem;padding:.65rem}
    .conduta-item{font-size:.76rem}
    .summary-row{font-size:.76rem;flex-wrap:wrap}
    .summary-row .value{max-width:100%}
    .emergency-banner{flex-direction:column;text-align:center;gap:.4rem}
    .result-badge{width:3.4rem;height:3.4rem;font-size:1.15rem}
  }
  @media(max-width:360px){
    .hints-grid{grid-template-columns:1fr}
    .progress-labels{font-size:.46rem}
    .card{padding:1rem .85rem}
    .container{padding:.6rem}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
  @media print{
    body{background:#fff;color:#111}
    .card{box-shadow:none;border:1px solid #ccc;background:#fff}
    .nav-row,.back-link,.progress,.copy-btn{display:none!important}
    header{background:#fff;border-bottom:2px solid #333}
    header::before,header::after{display:none}
    header h1{color:#111}header .subtitle{color:#666}
    .note-text{background:#f9f9f9;color:#333;border-color:#ccc;max-height:none}
    .box{background:#f9f9f9;border-color:#ccc}

    .summary-row .criteria{color:#666}.summary-row .value{color:#111}
    .conduta-item{color:#333}
    .result-badge{border-width:2px}
    .result-badge::before{display:none}
    .flag-pill.red{background:#fee2e2;color:#991b1b}
    .flag-pill.yellow{background:#fef3c7;color:#92400e}

    .collapse-body.hidden{max-height:none!important;opacity:1!important}
    .collapse-arrow{display:none}
  }
</style>

<body>
<header>
  <a href="../tontura.html" class="back-link" aria-label="Voltar">&larr; Voltar</a>
  <h1>Avaliação de tontura</h1>
  <p class="subtitle">periférico · central · HINTS</p>
</header>
<div class="container" id="app" role="main" aria-live="polite"></div>
<script>
const STEP_LABELS=['Tipo','Tempo','Paciente','HINTS','Sintomas','Resultado'];
const TOTAL_STEPS=6;

const DIZZINESS_TYPES=[
  {id:'vertigo',icon:'\u{1F300}',label:'Vertigem rotatória',desc:'Rotação do ambiente ou do corpo',tag:'Vestibular'},
  {id:'presyncope',icon:'\u{1F4AB}',label:'Pré-síncope',desc:'Sensação de desmaio, escurecimento visual',tag:'Cardiovascular'},
  {id:'disequilibrium',icon:'\u{1F6B6}',label:'Desequilíbrio',desc:'Instabilidade postural, sem rotação',tag:'Multifatorial'},
  {id:'nonspecific',icon:'\u{1F32B}\u{FE0F}',label:'Tontura inespecífica',desc:'Cabeça leve, flutuação',tag:'Inespecífico'},
];

const TIMING_OPTIONS=[
  {id:'seconds',icon:'\u{26A1}',label:'Segundos',desc:'Episódios breves, posicionais',suggest:'VPPB'},
  {id:'minutes',icon:'\u{23F1}\u{FE0F}',label:'Minutos a 1h',desc:'Pode haver flutuação auditiva',suggest:'AIT / Enxaqueca'},
  {id:'hours',icon:'\u{23F0}',label:'Horas',desc:'Episódios com sintomas auditivos',suggest:'Ménière'},
  {id:'days',icon:'\u{1F4C5}',label:'Dias (agudo)',desc:'Vertigem contínua, início súbito',suggest:'Neurite / AVC'},
  {id:'chronic',icon:'\u{1F504}',label:'Crônico',desc:'Semanas a meses, persistente',suggest:'TPPP / Central'},
];

const TRIGGER_OPTIONS=[
  {id:'positional',label:'Posicional',desc:'Mudança de posição da cabeça'},
  {id:'spontaneous',label:'Espontânea',desc:'Sem fator desencadeante claro'},
  {id:'orthostatic',label:'Ortostática',desc:'Ao levantar'},
  {id:'valsalva',label:'Valsalva / sons',desc:'Tosse, esforço, sons altos (Tullio)'},
  {id:'head_movement',label:'Mov. cefálicos',desc:'Rotação/extensão cervical'},
];

const ONSET_OPTIONS=[
  {id:'sudden',label:'Súbito',sub:'Segundos'},
  {id:'rapid',label:'Rápido',sub:'Minutos'},
  {id:'gradual',label:'Gradual',sub:'Horas/dias'},
];

const ASSOCIATED_SYMPTOMS={
  otologic:[
    {id:'hearing_loss',label:'Hipoacusia'},
    {id:'tinnitus',label:'Zumbido'},
    {id:'ear_fullness',label:'Plenitude auricular'},
    {id:'otorrhea',label:'Otorreia / otorragia',flag:'yellow'},
  ],
  neurologic:[
    {id:'headache',label:'Cefaleia intensa / súbita',flag:'red'},
    {id:'diplopia',label:'Diplopia',flag:'red'},
    {id:'dysarthria',label:'Disartria',flag:'red'},
    {id:'dysphagia',label:'Disfagia',flag:'red'},
    {id:'ataxia',label:'Ataxia / não deambula',flag:'red'},
    {id:'focal_weakness',label:'Fraqueza / dormência unilateral',flag:'red'},
    {id:'facial_palsy',label:'Paralisia facial',flag:'yellow'},
    {id:'visual_field',label:'Alteração de campo visual',flag:'red'},
    {id:'altered_consciousness',label:'Rebaixamento de consciência',flag:'red'},
    {id:'vertical_nystagmus',label:'Nistagmo vertical puro',flag:'red'},
    {id:'hiccups_horner',label:'Soluços intratáveis / Horner',flag:'red'},
  ],
  general:[
    {id:'nausea',label:'Náusea / vômitos'},
    {id:'palpitations',label:'Palpitações'},
    {id:'syncope',label:'Síncope',flag:'yellow'},
    {id:'chest_pain',label:'Dor torácica',flag:'yellow'},
    {id:'neck_pain',label:'Cervicalgia',flag:'yellow'},
    {id:'dyspnea',label:'Dispneia',flag:'yellow'},
    {id:'fever',label:'Febre',flag:'yellow'},
  ],
};

const RF_STROKE=[
  {id:'has',label:'HAS'},{id:'dm',label:'DM'},{id:'dislip',label:'Dislipidemia'},
  {id:'fa',label:'Fibrilação atrial'},{id:'avc_prev',label:'AVC / AIT prévio'},
  {id:'tab',label:'Tabagismo'},{id:'idade60',label:'Idade > 60 anos'},
  {id:'obesity',label:'Obesidade'},{id:'anticoag',label:'Anticoagulante em uso'},
  {id:'coronario',label:'Doença coronariana'},
];

const MEDS=[
  {id:'anti_ht',label:'Anti-hipertensivos'},{id:'diuretico',label:'Diuréticos'},
  {id:'benzo',label:'Benzodiazepínicos'},{id:'anticonv',label:'Anticonvulsivantes'},
  {id:'aminoglic',label:'Aminoglicosídeos'},{id:'antidep',label:'Antidepressivos'},
  {id:'opioid',label:'Opioides'},{id:'alcohol',label:'Álcool / drogas'},
];

let step=0;
let dizType=null,timing=null,onset=null;
let triggers=new Set();
let patAge=null,patSex=null;
let rfStroke=new Set(),meds=new Set();
let hints={hi:null,nyst:null,skew:null};
let dixHallpike=null;
let symptoms=new Set();
let hintsSkipped=false;
let abcd2={a:null,b:null,c:null,d:null,d2:null};
let sections={classification:false,hints_summary:false,diferenciais:false,conduta:true,abcd2:false,note:true};
const app=document.getElementById('app');

function progHTML(idx,allDone){
  let h='<div class="progress"><div class="progress-bar" role="progressbar" aria-valuenow="'+(allDone?TOTAL_STEPS:idx)+'" aria-valuemin="0" aria-valuemax="'+TOTAL_STEPS+'">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c=allDone||i<idx?'done':i===idx?'active':'';
    h+=`<div class="progress-step ${c}"></div>`;
  }
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c=allDone||i<idx?'done-label':i===idx?'active-label':'';
    const canClick=(!allDone&&i<idx)||(allDone&&i<TOTAL_STEPS-1);
    const click=canClick?` onclick="goToStep(${i})" role="button" tabindex="0" aria-label="Voltar para ${STEP_LABELS[i]}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goToStep(${i})}"`:'';
    h+=`<span class="${c}"${click}>${STEP_LABELS[i]}</span>`;
  }
  h+='</div></div>';
  return h;
}

function collapsible(id,title,contentFn,extraClass){
  const open=sections[id];
  let h=`<div class="${extraClass||'box'}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')" role="button" tabindex="0" aria-expanded="${open}" aria-controls="collapse-${id}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('${id}')}">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" id="collapse-${id}" style="margin-top:${open?'.5rem':'0'}">`;
  if(open)h+=contentFn();
  h+='</div></div>';
  return h;
}

function buildChips(){
  if(step===0)return '';
  const chips=[];
  if(dizType){const t=DIZZINESS_TYPES.find(x=>x.id===dizType);if(t)chips.push(`${t.icon} ${t.label}`)}
  if(timing&&step>1){const t=TIMING_OPTIONS.find(x=>x.id===timing);if(t)chips.push(`${t.icon} ${t.label}`)}
  if(patAge!==null&&step>2){
    const ages=['<45','45\u201359','60\u201374','\u226575'];
    chips.push(`${patSex==='M'?'M':'F'} ${ages[patAge]}`);
  }
  if(rfStroke.size>0&&step>2)chips.push(`${rfStroke.size} FR AVC`);
  if(chips.length===0)return '';
  return '<div class="chips">'+chips.map(c=>`<span class="chip">${c}</span>`).join('')+'</div>';
}

function isAVS(){return dizType==='vertigo'&&(timing==='days'||timing==='hours')}

function getRedFlags(){
  const flags=[],seen=new Set();
  const add=(id,label,flag)=>{if(!seen.has(id)){seen.add(id);flags.push({id,label,flag})}};
  for(const s of ASSOCIATED_SYMPTOMS.neurologic)if(symptoms.has(s.id)&&s.flag)add(s.id,s.label,s.flag);
  for(const s of ASSOCIATED_SYMPTOMS.otologic)if(symptoms.has(s.id)&&s.flag)add(s.id,s.label,s.flag);
  for(const s of ASSOCIATED_SYMPTOMS.general)if(symptoms.has(s.id)&&s.flag)add(s.id,s.label,s.flag);
  if(hints.hi==='c')add('hi_c','HIT normal (central)','red');
  if(hints.nyst==='c')add('nyst_c','Nistagmo direction-changing','red');
  if(hints.skew==='c')add('skew_c','Skew deviation','red');
  if(rfStroke.has('fa'))add('fa','Fibrilação atrial','yellow');
  if(rfStroke.has('avc_prev'))add('avc','AVC/AIT prévio','yellow');
  if(onset==='sudden'&&dizType==='vertigo'&&(timing==='days'||timing==='hours'))add('sudden','Início súbito','yellow');
  if(symptoms.has('neck_pain')&&dizType==='vertigo'&&onset==='sudden')add('diss','Cervicalgia + vertigem súbita (dissecção?)','red');
  if(symptoms.has('facial_palsy')&&isAVS())add('aica','Paralisia facial em SVA (AICA?)','red');
  if(symptoms.has('headache')&&symptoms.has('ataxia')&&isAVS())add('cereb','Cefaleia + ataxia (hemorragia cerebelar?)','red');
  if(rfStroke.size>=4&&isAVS())add('mult_rf','Múltiplos FR vasculares em SVA','yellow');
  return flags;
}

function getCentralScore(){
  let s=0;
  if(hints.hi==='c')s+=2;
  if(hints.nyst==='c')s+=2;
  if(hints.skew==='c')s+=2;
  const neuro=['headache','diplopia','dysarthria','dysphagia','ataxia','focal_weakness','visual_field','altered_consciousness','vertical_nystagmus','hiccups_horner'];
  for(const n of neuro)if(symptoms.has(n))s+=1.5;
  if(symptoms.has('facial_palsy')&&dizType==='vertigo')s+=1;
  if(timing==='days'&&dizType==='vertigo')s+=1;
  if(timing==='chronic')s+=0.5;
  if(onset==='sudden'&&isAVS())s+=0.5;
  if(rfStroke.has('fa'))s+=1;
  if(rfStroke.has('avc_prev'))s+=1;
  if(rfStroke.size>=3)s+=0.5;
  if(rfStroke.size>=5)s+=0.5;
  if(dizType==='vertigo'&&timing==='seconds'&&triggers.has('positional')&&dixHallpike==='neg')s+=0.5;
  if(patAge>=2)s+=0.5;
  if(patAge>=3)s+=0.5;
  if(symptoms.has('neck_pain')&&dizType==='vertigo'&&(timing==='days'||timing==='hours'))s+=1.5;
  else if(symptoms.has('neck_pain'))s+=0.5;
  if(symptoms.has('headache')&&symptoms.has('ataxia')&&isAVS())s+=1;
  return Math.min(10,s);
}

function hintsPlusWarn(){
  return symptoms.has('hearing_loss')&&isAVS()&&hints.hi==='p'&&hints.nyst==='p'&&hints.skew==='p';
}

function getClassification(){
  const cs=getCentralScore();
  const flags=getRedFlags().filter(f=>f.flag==='red');
  const hintsComplete=hints.hi!==null&&hints.nyst!==null&&hints.skew!==null;
  const hintsAllPeriph=hintsComplete&&hints.hi==='p'&&hints.nyst==='p'&&hints.skew==='p';
  const hintsAnyCentral=hints.hi==='c'||hints.nyst==='c'||hints.skew==='c';

  if(hintsAnyCentral||flags.length>=2||cs>=5){
    return {level:'central',title:'Alto risco \u2014 causa central provável',badge:'badge-central',icon:'\u{1F6A8}',
      desc:'Sinais sugestivos de causa central. Considerar AVC de fossa posterior ou lesão expansiva. Neuroimagem obrigatória.'};
  }
  if(cs>=2.5||flags.length===1||(dizType==='vertigo'&&timing==='days'&&!hintsAllPeriph&&!hintsSkipped)){
    return {level:'indeterminado',title:'Risco intermediário',badge:'badge-indeterminado',icon:'\u{26A0}\u{FE0F}',
      desc:'Não é possível excluir causa central com segurança. Investigação adicional recomendada.'};
  }
  if(dizType==='vertigo'&&timing==='seconds'&&triggers.has('positional')&&dixHallpike==='pos'){
    return {level:'periferico',title:'Periférico \u2014 VPPB provável',badge:'badge-periferico',icon:'\u{2705}',
      desc:'Vertigem posicional breve com Dix-Hallpike positivo. Tratar com manobra de Epley.'};
  }
  if(dizType==='vertigo'&&timing==='hours'&&(symptoms.has('hearing_loss')||symptoms.has('tinnitus')||symptoms.has('ear_fullness'))){
    return {level:'periferico',title:'Periférico \u2014 Ménière provável',badge:'badge-periferico',icon:'\u{2705}',
      desc:'Horas de vertigem com sintomas auditivos. Encaminhar para otorrinolaringologia.'};
  }
  if(dizType==='vertigo'&&timing==='days'&&hintsAllPeriph){
    return {level:'periferico',title:'Periférico \u2014 neurite vestibular provável',badge:'badge-periferico',icon:'\u{2705}',
      desc:'Vertigem aguda persistente com HINTS periférico. Iniciar reabilitação vestibular precoce.'};
  }
  if(dizType==='vertigo'&&timing==='minutes'&&!hintsAnyCentral){
    const mig=symptoms.has('headache')||(patSex==='F'&&patAge<=1);
    if(mig){
      return {level:'indeterminado',title:'Enxaqueca vestibular \u2014 investigar',badge:'badge-indeterminado',icon:'\u{26A0}\u{FE0F}',
        desc:'Episódios de minutos com cefaleia ou perfil sugestivo. Excluir AIT.'};
    }
  }
  if(hintsAllPeriph){
    return {level:'periferico',title:'Provável causa periférica',badge:'badge-periferico',icon:'\u{2705}',
      desc:'HINTS periférico sem sinais de alarme. Baixa probabilidade central.'};
  }
  if(dizType==='presyncope'){
    const card=symptoms.has('chest_pain')||symptoms.has('syncope')||symptoms.has('palpitations')||symptoms.has('dyspnea');
    return {level:'indeterminado',title:card?'Pré-síncope \u2014 alto risco cardiovascular':'Pré-síncope \u2014 avaliar causa cardiovascular',badge:'badge-indeterminado',icon:'\u{26A0}\u{FE0F}',
      desc:card?'Sinais de alarme cardiovasculares. ECG, troponina, PA ortostática.':'ECG, PA ortostática. Considerar arritmia, estenose aórtica, desidratação.'};
  }
  if(dizType==='disequilibrium'){
    return {level:'indeterminado',title:patAge>=2?'Desequilíbrio \u2014 causa multifatorial':'Desequilíbrio \u2014 investigar',badge:'badge-indeterminado',icon:'\u{26A0}\u{FE0F}',
      desc:patAge>=2?'Em idoso costuma ser multifatorial: neuropatia, déficit visual, sarcopenia, polifarmácia.':'Considerar causas cerebelares, proprioceptivas, otológicas, medicamentosas.'};
  }
  if(dizType==='nonspecific'&&meds.size>=2){
    return {level:'indeterminado',title:'Tontura inespecífica \u2014 polifarmácia',badge:'badge-indeterminado',icon:'\u{26A0}\u{FE0F}',
      desc:'Múltiplas medicações. Avaliar interação medicamentosa.'};
  }
  if(dizType==='vertigo'&&timing==='seconds'&&triggers.has('positional')&&dixHallpike!=='pos'){
    return {level:'indeterminado',title:'Vertigem posicional \u2014 investigar',badge:'badge-indeterminado',icon:'\u{26A0}\u{FE0F}',
      desc:'Sem Dix-Hallpike positivo: considerar VPPB de canal lateral (supine roll test) ou causa central.'};
  }
  if(dizType==='vertigo'&&timing==='days'&&hintsSkipped){
    return {level:'indeterminado',title:'Risco intermediário \u2014 HINTS não realizado',badge:'badge-indeterminado',icon:'\u{26A0}\u{FE0F}',
      desc:'SVA sem HINTS: neuroimagem recomendada para estratificação.'};
  }
  return {level:'indeterminado',title:'Investigação necessária',badge:'badge-indeterminado',icon:'\u{26A0}\u{FE0F}',
    desc:'Classificação inconclusiva. Correlacionar com exame físico e exames complementares.'};
}

function getHintsInterp(){
  if(hints.hi===null||hints.nyst===null||hints.skew===null)return null;
  const c=[hints.hi,hints.nyst,hints.skew].filter(v=>v==='c').length;
  if(c===0)return {level:'peripheral',text:'HINTS periférico \u2014 sensibilidade >96% para excluir AVC de fossa posterior (superior à TC nas primeiras 24\u201348h).',cls:'hr-periph'};
  if(c>=2)return {level:'central',text:'HINTS central \u2014 alta probabilidade de causa central. RM com difusão é o exame de escolha.',cls:'hr-central'};
  return {level:'central',text:'Sinal central isolado \u2014 não é possível excluir AVC. Prosseguir com neuroimagem.',cls:'hr-central'};
}

function getABCD2(){
  const a=abcd2.a!==null?abcd2.a:(patAge!==null?(patAge>=2?1:0):null);
  const d2=abcd2.d2!==null?abcd2.d2:(rfStroke.has('dm')?1:0);
  const {b,c,d}=abcd2;
  if([a,b,c,d,d2].some(v=>v===null))return null;
  return a+b+c+d+d2;
}

function render(){
  const fn=[renderType,renderTiming,renderPatient,renderHints,renderSymptoms,renderResult][step];
  fn();
}
