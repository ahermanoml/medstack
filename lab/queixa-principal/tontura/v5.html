      {dx:'TPPP (Tontura Postural-Perceptual Persistente)',prob:'moderada',detail:'Tontura crônica funcional. Critérios da Barany Society. Tratamento: ISRS + TCC + reabilitação vestibular.'},
      {dx:'Causa central crônica',prob:'baixa',detail:'Tumor de fossa posterior, malformação de Chiari. RM indicada.'},
      {dx:'Déficit vestibular bilateral',prob:meds.has('aminoglic')?'moderada':'baixa',detail:'Ototoxicidade, autoimune. vHIT bilateral anormal. Prova calórica.'},
      {dx:'Vertigem cervicogênica',prob:symptoms.has('neck_pain')?'baixa':'muito baixa',detail:'Diagnóstico de exclusão. Tontura associada a dor cervical e movimentos cefálicos. Excluir VPPB e insuficiência vertebrobasilar.'},
    ];
  }else if(dizType==='presyncope'){
    items=[
      {dx:'Hipotensão ortostática',prob:triggers.has('orthostatic')?'alta':'moderada',detail:'PA decúbito vs ortostase. Queda \u226520/10 mmHg. Medir em 1 e 3 minutos.'},
      {dx:'Arritmia cardíaca',prob:symptoms.has('palpitations')||rfStroke.has('fa')?'alta':'moderada',detail:'ECG, Holter 24h. FA, bradicardia, TVNS, BAV.'},
      {dx:'Estenose aórtica',prob:patAge>=2?'moderada':'baixa',detail:'Sopro sistólico ejetivo, síncope ao esforço. Ecocardiograma.'},
      {dx:'Vasovagal',prob:'moderada',detail:'Pródromo típico (palidez, sudorese, náusea), fatores precipitantes claros, recuperação rápida.'},
      {dx:'Hipoglicemia',prob:rfStroke.has('dm')?'moderada':'baixa',detail:'Glicemia capilar. Uso de insulina/secretagogos.'},
      {dx:'Desidratação / Hipovolemia',prob:meds.has('diuretico')?'moderada':'baixa',detail:'Uso de diuréticos, baixa ingesta, diarreia/vômitos. Avaliar turgor, mucosas, ureia/creatinina.'},
      {dx:'TEP (embolia pulmonar)',prob:symptoms.has('chest_pain')||symptoms.has('dyspnea')?'baixa':'muito baixa',detail:'Dispneia + taquicardia + dor torácica. D-dímero, angio-TC de tórax.'},
    ];
  }else if(dizType==='disequilibrium'){
    items=[
      {dx:'Multifatorial (idoso)',prob:patAge>=2?'alta':'moderada',detail:'Neuropatia + déficit visual + sarcopenia + polifarmácia. Avaliar marcha (Timed Up and Go).'},
      {dx:'Efeito medicamentoso',prob:meds.size>0?'alta':'moderada',detail:'Revisar BZDs, anti-HAS, diuréticos, anticonvulsivantes, opioides.'},
      {dx:'Neuropatia periférica',prob:rfStroke.has('dm')?'moderada':'baixa',detail:'Monofilamento, reflexos aquileus. DM, alcoolismo, deficiência de B12.'},
      {dx:'Causa cerebelar',prob:symptoms.has('ataxia')?'moderada':'baixa',detail:'Ataxia de marcha, dismetria. RM de encéfalo.'},
      {dx:'Hidrocefalia de pressão normal',prob:patAge>=2?'baixa':'muito baixa',detail:'Tríade de Hakim-Adams: distúrbio de marcha + demência + incontinência urinária. TC/RM de encéfalo.'},
    ];
  }else{
    items=[
      {dx:'Ansiedade / TPPP',prob:'moderada',detail:'Tontura crônica com parestesias periorais, taquicardia, dispneia. Escalas de ansiedade (GAD-7).'},
      {dx:'Efeito medicamentoso',prob:meds.size>0?'alta':'moderada',detail:'Revisar BZDs, anti-HAS, diuréticos, anticonvulsivantes.'},
      {dx:'Hipoglicemia',prob:rfStroke.has('dm')?'moderada':'baixa',detail:'Glicemia capilar. Uso de insulina/secretagogos.'},
      {dx:'Anemia',prob:'baixa',detail:'Hemograma. Tontura por baixa perfusão cerebral.'},
      {dx:'Hipotireoidismo',prob:'baixa',detail:'TSH. Tontura inespecífica com fadiga, ganho ponderal.'},
    ];
  }

  return collapsible('diferenciais','Diagnósticos Diferenciais',()=>{
    let s='<div style="display:flex;flex-direction:column;gap:.4rem">';
    for(const item of items){
      const isHigh=item.prob==='alta';
      const isMod=item.prob==='moderada';
      const probColor=isHigh?'#fca5a5':isMod?'#fcd34d':'#86efac';
      const probBg=isHigh?'#7f1d1d':isMod?'#78350f':'#14532d';
      s+=`<div style="display:flex;align-items:flex-start;gap:.6rem;padding:.5rem .6rem;background:#0d1424;border-radius:.5rem;border:1px solid #1e293b">`;
      s+=`<span style="font-size:.55rem;text-transform:uppercase;letter-spacing:.04em;padding:.15rem .35rem;border-radius:9999px;font-weight:700;flex-shrink:0;background:${probBg};color:${probColor};margin-top:.1rem;white-space:nowrap">${item.prob}</span>`;
      s+=`<div><div style="font-size:.82rem;font-weight:600;color:#e2e8f0">${item.dx}</div>`;
      s+=`<div style="font-size:.7rem;color:#64748b;margin-top:.1rem;line-height:1.4">${item.detail}</div></div></div>`;
    }
    s+='</div>';
    return s;
  });
}

// ===============================================
// CONDUTA
// ===============================================
function buildConduta(cls){
  let boxCls,title,items;
  if(cls.level==='central'){
    boxCls='alta-prob';title='Conduta \u2014 Suspeita de Causa Central';
    items=[
      {section:'Imagem',list:[
        ['\u{1F6A8}','TC de crânio SEM contraste URGENTE (excluir hemorragia)'],
        ['\u{1F9E0}','RM de encéfalo com difusão (padrão-ouro para AVC de fossa posterior \u2014 TC pode ser NORMAL nas primeiras 24\u201348h!)'],
        ['\u{1F4C4}','Angio-TC ou angio-RM de vasos cervicais e intracranianos'],
      ]},
      {section:'Laboratório',list:[
        ['\u{1F489}','Hemograma, glicemia, eletrólitos, ureia/creatinina, coagulograma'],
        ['\u{1F4CB}','ECG em 12 derivações (avaliar FA, isquemia)'],
      ]},
      {section:'Conduta imediata',list:[
        ['\u{1F3E5}','Avaliação por neurologia / ativar protocolo de AVC se < 4,5h do início'],
        ['\u{26A0}\u{FE0F}','NÃO liberar paciente sem neuroimagem se HINTS central'],
        ['\u{1F6CF}\u{FE0F}','Monitorização contínua, acesso venoso, cabeceira a 0\u00B0'],
        ['\u{1F4CB}','Avaliar Glasgow, pupilas, força muscular, coordenação, marcha (se possível)'],
      ]},
    ];
    // Cerebellar hemorrhage
    if(symptoms.has('headache')&&symptoms.has('ataxia')){
      items.push({section:'Suspeita de hemorragia cerebelar',list:[
        ['\u{1F6A8}','TC de crânio IMEDIATA (hemorragia cerebelar visível na TC)'],
        ['\u{1F3E5}','Acionar neurocirurgia \u2014 risco de herniação com necessidade de descompressão'],
        ['\u{26A0}\u{FE0F}','Monitorar nível de consciência (Glasgow) a cada 15 min \u2014 deterioração rápida possível'],
        ['\u{1F4CB}','Reverter anticoagulação se em uso (vitamina K, CCP, idarucizumab conforme indicação)'],
      ]});
    }
    // Dissection-specific
    if(symptoms.has('neck_pain')&&onset==='sudden'){
      items.push({section:'Suspeita de dissecção',list:[
        ['\u{1F6A8}','Angio-TC ou angio-RM de vasos cervicais com urgência'],
        ['\u{1F48A}','Considerar anticoagulação após excluir hemorragia (discutir com neurologia)'],
        ['\u{26A0}\u{FE0F}','Evitar manipulação cervical até exclusão de dissecção'],
      ]});
    }
    // AICA territory
    if(symptoms.has('facial_palsy')&&symptoms.has('hearing_loss')){
      items.push({section:'Suspeita de infarto de AICA',list:[
        ['\u{1F9E0}','RM de encéfalo com difusão + angio-RM/angio-TC'],
        ['\u{1F442}','Audiometria (hipoacusia neurossensorial aguda)'],
        ['\u{1F3E5}','Internação para monitorização e investigação etiológica'],
      ]});
    }
    // Wallenberg
    if(symptoms.has('dysphagia')&&symptoms.has('hiccups_horner')){
      items.push({section:'Suspeita de Sd. de Wallenberg',list:[
        ['\u{1F9E0}','RM de encéfalo com difusão (bulbo lateral)'],
        ['\u{26A0}\u{FE0F}','Avaliar disfagia antes de liberar via oral (risco de aspiração)'],
        ['\u{1F48A}','Antiagregação ou anticoagulação conforme etiologia'],
      ]});
    }
  }else if(cls.level==='indeterminado'){
    boxCls='mod-prob';title='Conduta \u2014 Risco Intermediário';
    items=[
      {section:'Exames',list:[
        ['\u{1F4C4}','TC de crânio para excluir hemorragia'],
        ['\u{1F9E0}','Considerar RM de encéfalo (TC pode ser normal em AVC de fossa posterior)'],
        ['\u{1F4CB}','ECG em 12 derivações'],
        ['\u{1F489}','Hemograma, glicemia, eletrólitos, função renal'],
      ]},
      {section:'Seguimento',list:[
        ['\u{1F50D}','Reavaliação clínica em 24\u201348h obrigatória'],
        ['\u{1F4DE}','Orientar sinais de alarme para retorno imediato ao PS'],
        ['\u{1F4CB}','Documentar orientações de alta e garantir compreensão do paciente'],
      ]},
    ];
    if(dizType==='presyncope'){
      items.push({section:'Avaliação cardiovascular',list:[
        ['\u{1FA7A}','PA ortostática (decúbito \u2192 sentado \u2192 em pé, 1 e 3 min)'],
        ['\u{1F4C8}','Considerar Holter 24h e ecocardiograma se recorrente'],
        ['\u{1F48A}','Revisar medicações (anti-hipertensivos, diuréticos, vasodilatadores)'],
      ]});
    }
    // If HINTS was skipped in AVS, emphasize need for imaging
    if(dizType==='vertigo'&&timing==='days'&&hintsSkipped){
      items[0].list.splice(1,0,['\u{26A0}\u{FE0F}','HINTS não realizado em SVA \u2014 neuroimagem é obrigatória para estratificação']);
    }
    // Ramsay Hunt
    if(symptoms.has('facial_palsy')&&symptoms.has('otorrhea')&&dizType==='vertigo'){
      items.push({section:'Suspeita de Ramsay Hunt',list:[
        ['\u{1F48A}','Aciclovir 800mg VO 5x/dia por 7 dias + prednisona 1mg/kg/dia por 5 dias'],
        ['\u{1F442}','Audiometria e avaliação otorrinolaringológica'],
        ['\u{1F50D}','Acompanhamento da paralisia facial (House-Brackmann)'],
      ]});
    }
  }else{
    boxCls='baixa-prob';title='Conduta \u2014 Provável Causa Periférica';
    items=[];
    if(dixHallpike==='pos'){
      items.push({section:'VPPB \u2014 Tratamento',list:[
        ['\u{2705}','Manobra de Epley (reposicionamento canalicular) \u2014 canal posterior'],
        ['\u{1F504}','Repetir manobra se nistagmo persistir (até 3x por sessão)'],
        ['\u{1F4CB}','Orientar exercícios de Brandt-Daroff em domicílio'],
        ['\u{1F3E0}','Alta com orientações. Retorno se persistência > 2 semanas ou sintomas novos'],
        ['\u{26A0}\u{FE0F}','Contraindicações relativas da Epley: estenose carotídea grave, instabilidade cervical'],
        ['\u{1F4CB}','Reavaliação em 1\u20142 semanas para confirmar resolução'],
      ]});
    }else if(timing==='days'){
      items.push({section:'Neurite vestibular \u2014 Tratamento',list:[
        ['\u{1F48A}','Fase aguda (48\u201372h): dimenidrinato 50mg 8/8h OU meclizina 25mg 8/8h'],
        ['\u{1F48A}','Ondansetrona 4\u20148mg IV/VO se náusea/vômitos refratários'],
        ['\u{26A0}\u{FE0F}','Evitar supressores vestibulares por mais de 72h (atrasa compensação central)'],
        ['\u{1F3CB}\u{FE0F}','Iniciar reabilitação vestibular precocemente (exercícios de habituação)'],
        ['\u{1F48A}','Considerar corticoterapia: prednisona 1mg/kg/dia por 5\u20137 dias com desmame (controverso, mas pode acelerar recuperação)'],
        ['\u{1F4DE}','Retorno imediato se piora, surgimento de déficit focal ou cefaleia intensa'],
      ]});
    }else if(symptoms.has('hearing_loss')||symptoms.has('tinnitus')||symptoms.has('ear_fullness')){
      items.push({section:'Ménière \u2014 Conduta',list:[
        ['\u{1F442}','Encaminhar para otorrinolaringologia (audiometria + videonistagmografia)'],
        ['\u{1F48A}','Crise: dimenidrinato 50mg + ondansetrona 4mg'],
        ['\u{1F37D}\u{FE0F}','Orientar restrição de sódio (< 2g/dia) e evitar cafeína/álcool'],
        ['\u{1F48A}','Considerar betaistina 24mg 12/12h (manutenção)'],
      ]});
    }else{
      items.push({section:'Conduta geral',list:[
        ['\u{1F48A}','Sintomáticos conforme quadro clínico'],
        ['\u{1F4CB}','Orientações de segurança e sinais de alarme para retorno'],
        ['\u{1F3E0}','Alta com reavaliação ambulatorial'],
      ]});
    }
    items.push({section:'Laboratório básico',list:[
      ['\u{1F489}','Primeiro episódio ou quadro atípico: hemograma, glicemia, eletrólitos, TSH'],
    ]});
    items.push({section:'Orientações de segurança',list:[
      ['\u{26A0}\u{FE0F}','Não dirigir até resolução dos sintomas'],
      ['\u{1F4DE}','Retornar ao PS se: déficit neurológico novo, cefaleia intensa, piora progressiva, febre, ou sintomas > 2 semanas sem melhora'],
    ]});
  }

  // Medication-related
  if(meds.size>0){
    const medDetails=[];
    if(meds.has('aminoglic'))medDetails.push('Aminoglicosídeos \u2014 risco de ototoxicidade bilateral');
    if(meds.has('diuretico'))medDetails.push('Diuréticos \u2014 risco de depleção volêmica e hipotensão');
    if(meds.has('benzo'))medDetails.push('Benzodiazepínicos \u2014 sedação, risco de quedas em idosos');
    if(meds.has('alcohol'))medDetails.push('Álcool/drogas \u2014 avaliar intoxicação aguda vs uso crônico');
    const mainItem=['\u{1F48A}','Revisar necessidade e dose das medicações assinaladas como possíveis causas'];
    const medList=[mainItem];
    for(const d of medDetails)medList.push(['\u{26A0}\u{FE0F}',d]);
    items.push({section:'Medicações',list:medList});
  }

  const open=sections.conduta;
  let h=`<div class="conduta-box ${boxCls}">`;
  h+=`<div class="collapse-header" onclick="toggleSection('conduta')" role="button" tabindex="0" aria-expanded="${open}" aria-controls="collapse-conduta" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('conduta')}"><h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" id="collapse-conduta" style="margin-top:${open?'.65rem':'0'}">`;
  if(open){
    for(const group of items){
      h+=`<div class="conduta-section-label">${group.section}</div>`;
      for(const[icon,text]of group.list){
        h+=`<div class="conduta-item"><span class="conduta-icon">${icon}</span><span>${text}</span></div>`;
      }
    }
  }
  h+='</div></div>';
  return h;
}

// ===============================================
// ABCD2 SCORE
// ===============================================
function buildABCD2(){
  let s='<p style="font-size:.72rem;color:#64748b;margin-bottom:.85rem;line-height:1.4">Estima risco de AVC em 2\u20147 dias após evento de AIT. Útil para decisão de internação vs alta monitorada.</p>';

  // A - Age >=60
  const aAuto=patAge!==null&&patAge>=2?1:(patAge!==null?0:null);
  const aVal=abcd2.a!==null?abcd2.a:aAuto;
  s+=`<div class="score-row"><div class="score-row-label"><span>A \u2014 Idade \u2265 60 anos</span>${aAuto!==null?'<span class="auto-tag">Auto</span>':''}</div>`;
  s+='<div class="score-options">';
  s+=`<button class="score-opt ${aVal===0?'picked':''}" onclick="setABCD2('a',0)">Não<span class="pts">0 pt</span></button>`;
  s+=`<button class="score-opt ${aVal===1?'picked':''}" onclick="setABCD2('a',1)">Sim<span class="pts">1 pt</span></button>`;
  s+='</div></div>';

  // B - Blood pressure >=140/90
  const bVal=abcd2.b;
  s+=`<div class="score-row"><div class="score-row-label"><span>B \u2014 PA \u2265 140/90 mmHg</span></div>`;
  s+='<div class="score-options">';
  s+=`<button class="score-opt ${bVal===0?'picked':''}" onclick="setABCD2('b',0)">Não<span class="pts">0 pt</span></button>`;
  s+=`<button class="score-opt ${bVal===1?'picked':''}" onclick="setABCD2('b',1)">Sim<span class="pts">1 pt</span></button>`;
  s+='</div></div>';

  // C - Clinical features
  const cVal=abcd2.c;
  s+=`<div class="score-row"><div class="score-row-label"><span>C \u2014 Sintomas clínicos</span></div>`;
  s+='<div class="score-options">';
  s+=`<button class="score-opt ${cVal===0?'picked':''}" onclick="setABCD2('c',0)">Outros<span class="pts">0 pt</span></button>`;
  s+=`<button class="score-opt ${cVal===1?'picked':''}" onclick="setABCD2('c',1)">Fala s/ fraqueza<span class="pts">1 pt</span></button>`;
  s+=`<button class="score-opt ${cVal===2?'picked':''}" onclick="setABCD2('c',2)">Fraqueza unilat.<span class="pts">2 pt</span></button>`;
  s+='</div></div>';

  // D - Duration
  const dVal=abcd2.d;
  s+=`<div class="score-row"><div class="score-row-label"><span>D \u2014 Duração dos sintomas</span></div>`;
  s+='<div class="score-options">';
  s+=`<button class="score-opt ${dVal===0?'picked':''}" onclick="setABCD2('d',0)">< 10 min<span class="pts">0 pt</span></button>`;
  s+=`<button class="score-opt ${dVal===1?'picked':''}" onclick="setABCD2('d',1)">10\u201359 min<span class="pts">1 pt</span></button>`;
  s+=`<button class="score-opt ${dVal===2?'picked':''}" onclick="setABCD2('d',2)">\u2265 60 min<span class="pts">2 pt</span></button>`;
  s+='</div></div>';

  // D2 - Diabetes
  const d2Auto=rfStroke.has('dm')?1:0;
  const d2Val=abcd2.d2!==null?abcd2.d2:d2Auto;
  s+=`<div class="score-row"><div class="score-row-label"><span>D\u00B2 \u2014 Diabetes</span><span class="auto-tag">Auto</span></div>`;
  s+='<div class="score-options">';
  s+=`<button class="score-opt ${d2Val===0?'picked':''}" onclick="setABCD2('d2',0)">Não<span class="pts">0 pt</span></button>`;
  s+=`<button class="score-opt ${d2Val===1?'picked':''}" onclick="setABCD2('d2',1)">Sim<span class="pts">1 pt</span></button>`;
  s+='</div></div>';

  const total=getABCD2();
  if(total!==null){
    let sc,sl,sd;
    if(total<=3){sc='sr-low';sl='Baixo risco';sd=`ABCD\u00B2 ${total}/7 \u2014 Risco de AVC em 2 dias ~1%. Considerar alta com reavaliação precoce (24\u201348h).`}
    else if(total<=5){sc='sr-mod';sl='Risco moderado';sd=`ABCD\u00B2 ${total}/7 \u2014 Risco de AVC em 2 dias ~4%. Considerar internação para investigação.`}
    else{sc='sr-high';sl='Alto risco';sd=`ABCD\u00B2 ${total}/7 \u2014 Risco de AVC em 2 dias ~8%. Internação e investigação vascular urgente.`}
    s+=`<div class="score-result ${sc}"><div class="score-num">${total}</div><div class="score-info"><div class="score-label">${sl}</div><div class="score-detail">${sd}</div></div></div>`;
  }else{
    s+='<div class="score-result sr-pending"><div class="score-num">?</div><div class="score-info"><div class="score-label">Preencha todos os campos</div><div class="score-detail">Campos com "Auto" são preenchidos pelos dados do paciente.</div></div></div>';
  }
  return s;
}

// ===============================================
// NOTE
// ===============================================
function buildNoteContent(cls,flags){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const ageLabels=['< 45','45\u201359','60\u201374','\u2265 75'];
  const typeObj=DIZZINESS_TYPES.find(t=>t.id===dizType);
  const timObj=TIMING_OPTIONS.find(t=>t.id===timing);
  const onsetObj=ONSET_OPTIONS.find(o=>o.id===onset);

  let n='';
  n+=`TONTURA \u2014 AVALIAÇÃO ESTRUTURADA NO PS\n`;
  n+=`Data/hora: ${ts}\n`;
  n+=`${'='.repeat(45)}\n\n`;
  n+=`PACIENTE: ${patSex==='M'?'Masculino':'Feminino'}, ${ageLabels[patAge]} anos\n`;
  const rfNames=[];for(const rf of RF_STROKE)if(rfStroke.has(rf.id))rfNames.push(rf.label);
  n+=`Fatores de risco p/ AVC: ${rfNames.length>0?rfNames.join(', '):'Nenhum identificado'}\n`;
  if(meds.size>0){
    const medNames=[];for(const m of MEDICATIONS_DIZZINESS)if(meds.has(m.id))medNames.push(m.label);
    n+=`Medicações em uso: ${medNames.join(', ')}\n`;
  }

  n+=`\nQUADRO CLÍNICO\n`;
  n+=`  Tipo: ${typeObj?typeObj.label:'\u2014'}\n`;
  n+=`  Duração: ${timObj?timObj.label:'\u2014'}\n`;
  n+=`  Instalação: ${onsetObj?onsetObj.label:'Não informado'}\n`;
  const trigNames=[];for(const t of TRIGGER_OPTIONS)if(triggers.has(t.id))trigNames.push(t.label);
  n+=`  Gatilhos: ${trigNames.length>0?trigNames.join(', '):'Nenhum especificado'}\n`;
  if(dixHallpike)n+=`  Dix-Hallpike: ${dixHallpike==='pos'?'Positivo':dixHallpike==='neg'?'Negativo':'Não realizado'}\n`;

  const symNames=[];
  for(const group of [ASSOCIATED_SYMPTOMS.otologic,ASSOCIATED_SYMPTOMS.neurologic,ASSOCIATED_SYMPTOMS.general])
    for(const s of group)if(symptoms.has(s.id))symNames.push(s.label);
  n+=`  Sintomas associados: ${symNames.length>0?symNames.join(', '):'Nenhum'}\n`;

  if(!hintsSkipped&&(hints.hi!==null||hints.nyst!==null||hints.skew!==null)){
    n+=`\nEXAME HINTS\n`;
    const hiLabel=hints.hi==='p'?'Anormal \u2014 sacada corretiva presente (periférico)':hints.hi==='c'?'Normal \u2014 sem sacada corretiva (CENTRAL)':'Não avaliado';
    const nystLabel=hints.nyst==='p'?'Unidirecional (periférico)':hints.nyst==='c'?'Direction-changing (CENTRAL)':'Não avaliado';
    const skewLabel=hints.skew==='p'?'Ausente (periférico)':hints.skew==='c'?'Presente \u2014 skew deviation (CENTRAL)':'Não avaliado';
    n+=`  Head Impulse: ${hiLabel}\n`;
    n+=`  Nistagmo: ${nystLabel}\n`;
    n+=`  Test of Skew: ${skewLabel}\n`;
    const hintsRes=getHintsInterpretation();
    if(hintsRes)n+=`  Interpretação: ${hintsRes.text}\n`;
    // HINTS plus note
    if(symptoms.has('hearing_loss')&&dizType==='vertigo'&&(timing==='days'||timing==='hours')){
      n+=`  Obs: Hipoacusia presente \u2014 considerar HINTS plus\n`;
    }
  }else if(hintsSkipped){
    n+=`\nEXAME HINTS: Não realizado\n`;
  }else{
    n+=`\nEXAME HINTS: Não preenchido\n`;
  }

  n+=`\nCLASSIFICAÇÃO: ${cls.title}\n`;
  n+=`${cls.desc}\n`;
  n+=`Índice de risco central: ${getCentralScore().toFixed(1)}/10\n`;

  if(flags.length>0){
    n+=`\nSINAIS DE ALARME\n`;
    for(const f of flags){
      const level=f.flag==='red'?'RED FLAG':'ATENÇÃO';
      n+=`  [${level}] ${f.label}\n`;
    }
  }

  const abcd2Total=getABCD2();
  if(abcd2Total!==null){
    const risk=abcd2Total<=3?'Baixo':abcd2Total<=5?'Moderado':'Alto';
    n+=`\nABCD\u00B2: ${abcd2Total}/7 \u2014 Risco ${risk}\n`;
    if(abcd2Total>=4)n+=`  Recomendação: internação para investigação vascular\n`;
  }

  n+=`\nCONDUTA\n`;
  if(cls.level==='central'){
    n+=`  - TC crânio urgente / RM encéfalo com difusão\n`;
    n+=`  - Angio-TC/RM vasos cervicais e intracranianos\n`;
    n+=`  - Avaliação por neurologia / protocolo de AVC\n`;
    n+=`  - ECG, laboratório completo, monitorização\n`;
    if(symptoms.has('headache')&&symptoms.has('ataxia')){
      n+=`  - Excluir hemorragia cerebelar (TC urgente) / acionar neurocirurgia\n`;
    }
    if(symptoms.has('neck_pain')&&onset==='sudden'){
      n+=`  - Investigar dissecção de artéria vertebral\n`;
    }
    if(symptoms.has('facial_palsy')&&symptoms.has('hearing_loss')){
      n+=`  - Investigar infarto de AICA (paralisia facial + hipoacusia)\n`;
    }
    if(symptoms.has('dysphagia')&&symptoms.has('hiccups_horner')){
      n+=`  - Investigar Sd. de Wallenberg (infarto bulbar lateral)\n`;
    }
  }else if(cls.level==='indeterminado'){
    n+=`  - TC crânio para excluir hemorragia\n`;
    n+=`  - Considerar RM encéfalo (TC pode ser normal em AVC fossa posterior)\n`;
    n+=`  - ECG, laboratório básico\n`;
    n+=`  - Reavaliação obrigatória em 24\u201348h\n`;
    n+=`  - Orientações de sinais de alarme para retorno\n`;
    if(dizType==='presyncope'){
      n+=`  - PA ortostática, Holter se recorrente\n`;
    }
    if(symptoms.has('facial_palsy')&&symptoms.has('otorrhea')&&dizType==='vertigo'){
      n+=`  - Avaliar Sd. de Ramsay Hunt (aciclovir + corticoide)\n`;
    }
  }else{
    if(dixHallpike==='pos'){
      n+=`  - Manobra de Epley realizada\n`;
      n+=`  - Orientações: exercícios de Brandt-Daroff\n`;
      n+=`  - Reavaliação em 1-2 semanas\n`;
    }else if(timing==='days'){
      n+=`  - Sintomáticos: dimenidrinato 50mg 8/8h (máx 72h)\n`;
      n+=`  - Reabilitação vestibular precoce\n`;
      n+=`  - Considerar corticoterapia (prednisona 1mg/kg/dia x 5-7 dias)\n`;
    }
    n+=`  - Sintomáticos conforme necessidade\n`;
    n+=`  - Orientações de sinais de alarme\n`;
    n+=`  - Não dirigir até resolução dos sintomas\n`;
    n+=`  - Alta com acompanhamento ambulatorial\n`;
  }

  if(meds.size>0){
    n+=`  - Revisão medicamentosa (possível causa iatrogênica)\n`;
  }

  n+=`\n${'='.repeat(45)}\n`;
  n+=`Ferramenta de apoio à decisão clínica. Não substitui o julgamento médico.\n`;

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()" aria-label="Copiar nota para a área de transferência"><span>\u{1F4CB}</span> Copiar nota para prontuário</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el)return;
  const text=el.textContent||el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onCopySuccess).catch(fallbackCopy);
  }else{
    fallbackCopy();
  }
}
function onCopySuccess(){
  const btn=document.getElementById('copyBtn');
  if(!btn)return;
  btn.innerHTML='<span>\u2713</span> Copiado!';btn.classList.add('copied');
  setTimeout(()=>{if(btn){btn.innerHTML='<span>\u{1F4CB}</span> Copiar nota para prontuário';btn.classList.remove('copied')}},2500);
}
function fallbackCopy(){
  const el=document.getElementById('noteContent');
  if(!el)return;
  const range=document.createRange();
  range.selectNodeContents(el);
  const sel=window.getSelection();
  sel.removeAllRanges();sel.addRange(range);
  try{document.execCommand('copy');onCopySuccess()}catch(e){
    sel.removeAllRanges();
  }
}

// ===============================================
// ACTIONS
// ===============================================
function setDizType(v){dizType=v;render()}
function setTiming(v){timing=v;
  // Clear Dix-Hallpike if timing changes away from seconds
  if(v!=='seconds')dixHallpike=null;
  render();
}
function setOnset(v){onset=onset===v?null:v;render()}
function toggleTrigger(id){triggers.has(id)?triggers.delete(id):triggers.add(id);
  // Clear Dix-Hallpike if positional is deselected
  if(id==='positional'&&!triggers.has('positional'))dixHallpike=null;
  render();
}
function setDixHallpike(v){dixHallpike=dixHallpike===v?null:v;render()}
function setPatAge(v){patAge=patAge===v?null:v;render()}
function setPatSex(v){patSex=patSex===v?null:v;render()}
function toggleRF(id){rfStroke.has(id)?rfStroke.delete(id):rfStroke.add(id);render()}
function toggleMed(id){meds.has(id)?meds.delete(id):meds.add(id);render()}
function setHints(field,v){hints[field]=hints[field]===v?null:v;render()}
function toggleSymptom(id){symptoms.has(id)?symptoms.delete(id):symptoms.add(id);render()}
function toggleSection(id){sections[id]=!sections[id];render()}
function setABCD2(field,v){abcd2[field]=abcd2[field]===v?null:v;render()}
function skipHints(){hintsSkipped=true;hints={hi:null,nyst:null,skew:null};render()}
function unskipHints(){hintsSkipped=false;render()}

function goToStep(idx){
  if(idx<step){step=idx;render();window.scrollTo({top:0,behavior:'smooth'})}
}

function next(){
  if(step===0&&dizType===null)return;
  if(step===1&&timing===null)return;
  if(step===2&&(patAge===null||patSex===null))return;
  step++;render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function prev(){if(step>0){step--;render();window.scrollTo({top:0,behavior:'smooth'})}}

function confirmRestart(){
  if(step===5){
    const overlay=document.createElement('div');
    overlay.className='modal-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Confirmar recomeço');
    overlay.innerHTML=`<div class="modal-box">
      <div style="font-size:1.2rem;margin-bottom:.5rem">\u{26A0}\u{FE0F}</div>
      <div style="font-size:.92rem;font-weight:600;color:#f1f5f9;margin-bottom:.35rem">Recomeçar avaliação?</div>
      <div style="font-size:.78rem;color:#64748b;margin-bottom:1rem;line-height:1.4">Todos os dados preenchidos serão perdidos.</div>
      <div style="display:flex;gap:.5rem">
        <button id="cancelRestartBtn" onclick="this.closest('.modal-overlay').remove()" style="flex:1;padding:.6rem;border-radius:.5rem;border:1.5px solid #334155;background:#1e293b;color:#94a3b8;font-size:.82rem;font-weight:600;cursor:pointer;min-height:44px">Cancelar</button>
        <button onclick="this.closest('.modal-overlay').remove();restart()" style="flex:1;padding:.6rem;border-radius:.5rem;border:none;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-size:.82rem;font-weight:600;cursor:pointer;min-height:44px">Recomeçar</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove()});
    // Focus the cancel button for keyboard accessibility
    requestAnimationFrame(()=>{
      const cancelBtn=document.getElementById('cancelRestartBtn');
      if(cancelBtn)cancelBtn.focus();
    });
    // Allow Escape to close the dialog
    overlay.addEventListener('keydown',(e)=>{if(e.key==='Escape')overlay.remove()});
  }else{
    restart();
  }
}

function restart(){
  step=0;dizType=null;timing=null;triggers=new Set();onset=null;
  patAge=null;patSex=null;rfStroke=new Set();meds=new Set();
  hints={hi:null,nyst:null,skew:null};dixHallpike=null;hintsSkipped=false;
  symptoms=new Set();
  abcd2={a:null,b:null,c:null,d:null,d2:null};
  sections={classification:false,hints_summary:false,diferenciais:false,flags:true,conduta:true,abcd2:true,note:true};
  render();window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
