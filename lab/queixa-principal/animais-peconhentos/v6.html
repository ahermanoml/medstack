<!-- VERSION: 6 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Animais Peçonhentos — Avaliação de Envenenamento</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b1220;--surface:#0f172a;--card:#141e33;--card2:#1a2540;
    --ink:#e2e8f0;--ink-dim:#94a3b8;--ink-mute:#64748b;--ink-hi:#f1f5f9;
    --line:#253149;--line-2:#334155;
    --accent:#3b82f6;--accent-soft:#1e3a5f;--accent-hi:#93c5fd;
    --warn:#f59e0b;--warn-bg:#451a03;--warn-line:#78350f;--warn-ink:#fcd34d;
    --danger:#ef4444;--danger-bg:#450a0a;--danger-line:#991b1b;--danger-ink:#fca5a5;
    --ok:#22c55e;--ok-bg:#052e16;--ok-line:#14532d;--ok-ink:#86efac;
    --ped:#8b5cf6;--ped-bg:#2e1065;--ped-ink:#c4b5fd;
    --gest:#ec4899;--gest-bg:#4a0d2d;--gest-ink:#f9a8d4;
    --mono:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,monospace;
    --serif:'Iowan Old Style','Palatino','Georgia',serif;
  }
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;line-height:1.5}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(59,130,246,.05),transparent 60%);pointer-events:none;z-index:0}
  header{background:linear-gradient(180deg,#1e293b,#141e33);padding:.9rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
  .header-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.75rem}
  .back-link{color:var(--ink-dim);text-decoration:none;font-size:.8rem;font-weight:500;transition:color .2s;padding:.25rem .4rem;margin-left:-.4rem}
  .back-link:hover,.back-link:focus{color:var(--ink-hi);outline:none}
  .brand{text-align:center;min-width:0}
  .brand h1{font-family:var(--serif);font-size:1.05rem;font-weight:600;color:var(--ink-hi);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .brand-sub{font-size:.65rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.12em;margin-top:.1rem;font-weight:600}
  .timer-badge{background:var(--surface);border:1px solid var(--line);border-radius:2rem;padding:.25rem .6rem;font-size:.68rem;color:var(--ink-mute);font-family:var(--mono);display:flex;align-items:center;gap:.3rem;white-space:nowrap}
  .timer-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);animation:pulse-dot 2s ease-in-out infinite}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}
  .container{max-width:720px;margin:0 auto;padding:1rem;display:flex;flex-direction:column;gap:1rem;position:relative;z-index:1}

  /* Progress bar */
  .progress{display:flex;flex-direction:column;gap:.35rem;padding:0 .25rem}
  .progress-bar{display:flex;gap:.3rem}
  .progress-step{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .4s}
  .progress-step.done{background:var(--accent)}
  .progress-step.active{background:var(--accent-hi);box-shadow:0 0 8px rgba(147,197,253,.3)}
  .progress-labels{display:flex;justify-content:space-between;font-size:.58rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
  .progress-labels span.active-label{color:var(--accent-hi)}
  .progress-labels span.done-label{color:var(--accent)}

  /* Card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:1.25rem;animation:fadeSlide .3s ease;box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 4px 14px rgba(0,0,0,.25)}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card h2{font-family:var(--serif);font-size:1.1rem;color:var(--ink-hi);margin-bottom:.35rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-weight:600}
  .card h2 .step-badge{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-hi);font-size:.6rem;font-weight:700;padding:.15rem .5rem;border-radius:9999px;letter-spacing:.05em;font-family:var(--mono)}
  .subtitle{font-size:.8rem;color:var(--ink-dim);margin-bottom:1rem;line-height:1.5}

  /* Patient toggle + time row (compact) */
  .meta-row{display:grid;grid-template-columns:1fr;gap:.5rem;margin-bottom:.85rem}
  .patient-toggle{display:flex;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-radius:.55rem;padding:.25rem}
  .patient-toggle-btn{flex:1;padding:.45rem .3rem;border-radius:.35rem;font-size:.72rem;cursor:pointer;border:none;background:transparent;color:var(--ink-mute);text-align:center;transition:all .2s;font-weight:600;-webkit-user-select:none;user-select:none;font-family:inherit}
  .patient-toggle-btn:hover{color:var(--ink)}
  .patient-toggle-btn.active{background:var(--accent-soft);color:var(--accent-hi)}
  .patient-toggle-btn.active-child{background:var(--ped-bg);color:var(--ped-ink)}
  .patient-toggle-btn.active-pregnant{background:var(--gest-bg);color:var(--gest-ink)}

  .time-row{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:.55rem;padding:.5rem .75rem}
  .time-row label{font-size:.72rem;color:var(--ink-dim);flex:1}
  .time-input{background:var(--bg);border:1px solid var(--line-2);border-radius:.35rem;padding:.35rem .5rem;color:var(--ink);font-size:.82rem;font-family:var(--mono);outline:none;width:4.2rem;text-align:center;transition:border-color .2s}
  .time-input:focus{border-color:var(--accent)}
  .time-unit{font-size:.72rem;color:var(--ink-mute)}
  .time-window{font-size:.7rem;padding:.45rem .65rem;border-radius:.4rem;line-height:1.45;display:flex;gap:.4rem;align-items:flex-start;margin-top:.25rem}
  .tw-green{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink)}
  .tw-yellow{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink)}
  .tw-red{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger-ink)}

  /* Search */
  .search-wrap{position:relative;margin-bottom:.5rem}
  .search-box{width:100%;padding:.65rem 2.25rem .65rem 2.25rem;border-radius:.6rem;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:.88rem;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit}
  .search-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .search-wrap .search-icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--ink-mute);font-size:.85rem;pointer-events:none}
  .search-wrap .clear-search{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);color:var(--ink-mute);font-size:1rem;cursor:pointer;border:none;background:none;padding:.35rem;line-height:1;transition:color .2s;display:none;font-family:inherit}
  .search-wrap .clear-search.visible{display:block}
  .search-wrap .clear-search:hover{color:var(--ink-hi)}

  /* Specimen / option buttons */
  .options{display:flex;flex-direction:column;gap:.45rem}
  .group-label{font-family:var(--serif);font-style:italic;font-size:.75rem;color:var(--ink-mute);margin-top:.75rem;padding-left:.25rem;border-left:2px solid var(--line);padding-top:.15rem;padding-bottom:.15rem;letter-spacing:.02em}
  .group-label:first-child{margin-top:.25rem}
  .option-btn{background:var(--surface);border:1px solid var(--line-2);border-radius:.6rem;padding:.7rem .85rem;color:var(--ink);font-size:.88rem;cursor:pointer;transition:all .2s ease;text-align:left;display:flex;align-items:center;gap:.7rem;-webkit-user-select:none;user-select:none;font-family:inherit;width:100%}
  .option-btn:hover{border-color:var(--accent);background:var(--card2)}
  .option-btn:active{transform:scale(.98);transition-duration:.08s}
  .option-btn.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent), 0 2px 10px rgba(59,130,246,.15)}
  .option-btn.hidden-animal{display:none}
  .option-btn .icon{font-size:1.25rem;flex-shrink:0;width:1.75rem;text-align:center}
  .option-btn .label{flex:1;min-width:0;font-weight:500}
  .option-btn .label small{display:block;font-size:.7rem;color:var(--ink-mute);margin-top:.1rem;font-weight:400;line-height:1.4;font-family:var(--serif);font-style:italic}
  .option-btn.selected .label small{color:var(--accent-hi);font-style:italic}
  .option-btn .tag{font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;padding:.18rem .45rem;border-radius:9999px;font-weight:700;flex-shrink:0;font-family:var(--mono)}
  .tag-serpente{background:#7f1d1d;color:#fca5a5}
  .tag-aranha{background:#4c1d95;color:#c4b5fd}
  .tag-escorpiao{background:#92400e;color:#fcd34d}
  .tag-outro{background:#374151;color:#d1d5db}

  /* Check buttons */
  .check-btn{background:var(--surface);border:1px solid var(--line-2);border-radius:.55rem;padding:.6rem .85rem;color:var(--ink);font-size:.85rem;cursor:pointer;transition:all .15s ease;text-align:left;display:flex;align-items:center;gap:.65rem;-webkit-user-select:none;user-select:none;font-family:inherit;width:100%}
  .check-btn:hover{border-color:var(--accent);background:var(--card2)}
  .check-btn:active{transform:scale(.98);transition-duration:.08s}
  .check-btn.checked{border-color:var(--accent);background:var(--accent-soft)}
  .check-btn.checked-warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn-ink)}
  .check-box{width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:.72rem;color:#fff}
  .check-btn.checked .check-box{background:var(--accent);border-color:var(--accent)}
  .check-btn.checked-warn .check-box{background:var(--warn);border-color:var(--warn)}

  /* Symptom counter */
  .sym-counter{display:flex;align-items:center;justify-content:space-between;padding:.55rem .85rem;background:var(--surface);border:1px solid var(--line);border-radius:.5rem;margin-bottom:.65rem;font-size:.75rem;color:var(--ink-dim)}
  .sym-counter .sc-num{font-family:var(--mono);color:var(--ink-hi);font-weight:700}
  .sym-counter .sc-split{display:flex;gap:.65rem;color:var(--ink-mute);font-size:.7rem}

  /* Nav buttons */
  .nav-row{display:flex;gap:.6rem;margin-top:1.1rem}
  .nav-btn{flex:1;padding:.78rem;border-radius:.55rem;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s ease;border:none;-webkit-user-select:none;user-select:none;font-family:inherit}
  .nav-btn.secondary{background:#2a3654;color:var(--ink)}
  .nav-btn.secondary:hover{background:#334155}
  .nav-btn.primary{background:var(--accent);color:#fff}
  .nav-btn.primary:hover{background:#2563eb;box-shadow:0 4px 12px rgba(59,130,246,.3)}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none!important}
  .nav-btn.danger{background:#7f1d1d;color:#fca5a5}
  .nav-btn.danger:hover{background:#991b1b}
  .nav-btn:active:not(:disabled){transform:scale(.97);transition-duration:.08s}

  /* Result */
  .result-card{text-align:center;padding:1.75rem 1.25rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:4.5rem;height:4.5rem;border-radius:50%;font-size:1.6rem;font-weight:800;margin-bottom:.75rem;animation:pop .45s ease;font-family:var(--mono)}
  @keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .badge-leve{background:var(--ok-bg);color:var(--ok-ink);border:2px solid var(--ok)}
  .badge-moderado{background:var(--warn-bg);color:var(--warn-ink);border:2px solid var(--warn)}
  .badge-grave{background:var(--danger-bg);color:var(--danger-ink);border:2px solid var(--danger)}
  .result-title{font-family:var(--serif);font-size:1.2rem;font-weight:600;color:var(--ink-hi);margin-bottom:.25rem}
  .result-meta{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;font-size:.7rem;color:var(--ink-dim);margin-bottom:.5rem}
  .result-meta .chip{background:var(--surface);border:1px solid var(--line);border-radius:9999px;padding:.15rem .55rem;font-family:var(--mono);font-size:.66rem}
  .cid-chip{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:.4rem;padding:.25rem .55rem;font-size:.7rem;color:var(--ink-dim);font-family:var(--mono);margin-top:.25rem}

  /* Boxes */
  .dark-box{background:var(--surface);border:1px solid var(--line);border-radius:.6rem;padding:.9rem 1rem;text-align:left;margin-bottom:.65rem}
  .dark-box h3{font-size:.72rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;font-weight:700}
  .summary-row{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.82rem;line-height:1.45}
  .summary-row:last-child{border-bottom:none}
  .summary-row .criteria{color:var(--ink-dim)}
  .summary-row .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;margin-top:.4rem}
  .dot-leve{background:var(--ok)}.dot-moderado{background:var(--warn)}.dot-grave{background:var(--danger)}

  .conduta-box{border-radius:.6rem;padding:.9rem 1rem;text-align:left;margin-bottom:.65rem}
  .conduta-box h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;font-weight:700}
  .grave-box{background:var(--danger-bg);border:1px solid var(--danger-line)}.grave-box h3{color:var(--danger-ink)}
  .moderado-box{background:var(--warn-bg);border:1px solid var(--warn-line)}.moderado-box h3{color:var(--warn-ink)}
  .leve-box{background:var(--ok-bg);border:1px solid var(--ok-line)}.leve-box h3{color:var(--ok-ink)}
  .conduta-item{display:flex;align-items:flex-start;gap:.5rem;padding:.3rem 0;font-size:.82rem;color:var(--ink);line-height:1.5}
  .conduta-icon{flex-shrink:0;width:1.1rem;text-align:center;color:var(--ink-mute)}

  .red-flag-box{background:var(--danger-bg);border:1px solid var(--danger-line);border-radius:.6rem;padding:.9rem 1rem;text-align:left;margin-bottom:.65rem}
  .red-flag-box h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;color:var(--danger-ink);font-weight:700}
  .red-flag-item{display:flex;align-items:flex-start;gap:.5rem;padding:.3rem 0;font-size:.8rem;color:var(--danger-ink);line-height:1.5}
  .red-flag-item.present{font-weight:700;color:#fecaca}
  .red-flag-marker{flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--danger-ink);margin-top:.5rem;opacity:.5}
  .red-flag-item.present .red-flag-marker{background:var(--danger);opacity:1;box-shadow:0 0 0 2px rgba(239,68,68,.25)}

  /* Collapsibles */
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:.1rem 0;-webkit-tap-highlight-color:transparent;gap:.5rem}
  .collapse-header h3{margin-bottom:0;transition:color .2s;flex:1}
  .collapse-header:hover h3{color:var(--ink-hi)}
  .collapse-arrow{font-size:.7rem;color:var(--ink-mute);transition:transform .3s ease}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .3s ease, opacity .25s ease}
  .collapse-body.hidden{max-height:0!important;padding-top:0;margin-top:0;opacity:0;pointer-events:none}
  .collapse-body.visible{opacity:1;margin-top:.55rem}

  /* Note */
  .note-text{background:var(--bg);border:1px solid var(--line);border-radius:.45rem;padding:.85rem;font-family:var(--mono);font-size:.7rem;color:var(--ink-dim);white-space:pre-wrap;line-height:1.6;max-height:360px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.6rem;padding:.6rem;border-radius:.5rem;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
  .copy-btn:hover{border-color:var(--accent);background:var(--card2)}
  .copy-btn:active{transform:scale(.97)}
  .copy-btn.copied{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}

  /* Banners */
  .banner{border-radius:.6rem;padding:.75rem .9rem;font-size:.78rem;line-height:1.5;margin-bottom:.6rem;display:flex;align-items:flex-start;gap:.55rem}
  .banner strong{font-weight:700}
  .info-banner{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.3);color:var(--accent-hi)}
  .info-banner strong{color:#bfdbfe}
  .warn-banner{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink)}
  .warn-banner strong{color:#fef3c7}
  .danger-banner{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger-ink)}
  .danger-banner strong{color:#fecaca}
  .ped-banner{background:var(--ped-bg);border:1px solid #6d28d9;color:var(--ped-ink)}
  .ped-banner strong{color:#ddd6fe}
  .gest-banner{background:var(--gest-bg);border:1px solid #9d174d;color:var(--gest-ink)}
  .gest-banner strong{color:#fbcfe8}
  .banner .b-icon{flex-shrink:0;margin-top:.05rem}

  /* Vial display */
  .vial-display{display:flex;align-items:center;gap:1rem;padding:1rem 1.1rem;margin:.6rem 0;background:var(--surface);border-radius:.6rem;border:1px solid var(--line);position:relative;overflow:hidden}
  .vial-display::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
  .vial-number{font-size:2.5rem;font-weight:800;font-family:var(--mono);color:var(--warn);line-height:1}
  .vial-label{flex:1;min-width:0}
  .vial-title{font-size:.92rem;font-weight:700;color:var(--ink-hi);font-family:var(--serif)}
  .vial-sub{font-size:.72rem;color:var(--ink-dim);margin-top:.2rem;line-height:1.5}

  .lab-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
  .lab-item{background:var(--surface);border:1px solid var(--line);border-radius:.4rem;padding:.5rem .65rem;font-size:.75rem;color:var(--ink);transition:border-color .2s}
  .lab-item.lab-urgent{border-color:var(--danger-line);background:#1a0505;color:var(--danger-ink)}

  /* Severity cards */
  .severity-cards{display:flex;gap:.5rem;margin-top:.4rem}
  .sev-card{flex:1;border-radius:.6rem;padding:.85rem .6rem;cursor:pointer;transition:all .2s ease;text-align:center;border:1px solid var(--line-2);background:var(--surface);-webkit-user-select:none;user-select:none}
  .sev-card:hover{border-color:var(--accent);background:var(--card2)}
  .sev-card:active{transform:scale(.97);transition-duration:.08s}
  .sev-card.selected{border-width:2px;padding:calc(.85rem - 1px) calc(.6rem - 1px)}
  .sev-card.sel-leve{border-color:var(--ok);background:var(--ok-bg)}
  .sev-card.sel-moderado{border-color:var(--warn);background:var(--warn-bg)}
  .sev-card.sel-grave{border-color:var(--danger);background:var(--danger-bg)}
  .sev-card .sev-dot{width:10px;height:10px;border-radius:50%;margin:0 auto .35rem}
  .sev-card.disabled{opacity:.35;pointer-events:none;position:relative}
  .sev-card.disabled::after{content:'N/A';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.65rem;color:var(--ink-mute);font-weight:700;background:var(--bg);padding:.1rem .4rem;border-radius:.25rem;font-family:var(--mono)}
  .sev-card .sev-title{font-size:.82rem;font-weight:700;color:var(--ink-hi);margin-bottom:.2rem;font-family:var(--serif)}
  .sev-card .sev-desc{font-size:.65rem;color:var(--ink-dim);line-height:1.4}
  .sev-card.sel-leve .sev-desc{color:var(--ok-ink)}
  .sev-card.sel-moderado .sev-desc{color:var(--warn-ink)}
  .sev-card.sel-grave .sev-desc{color:var(--danger-ink)}

  /* Reaction triad (antivenom reaction) */
  .reaction-triad{display:flex;flex-direction:column;gap:.35rem;margin-top:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:.55rem;padding:.65rem .8rem}
  .reaction-triad h4{font-size:.68rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem;font-weight:700}
  .reaction-row{font-size:.75rem;color:var(--ink-dim);line-height:1.55;padding:.2rem 0}
  .reaction-row strong{color:var(--ink-hi);font-weight:700}

  /* First aid */
  .first-aid-box{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.25);border-radius:.6rem;padding:.85rem 1rem;margin-top:.85rem}
  .first-aid-box h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-hi);margin-bottom:.4rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
  .first-aid-item{font-size:.78rem;color:#bfdbfe;padding:.2rem 0 .2rem 1rem;position:relative;line-height:1.5}

  .obs-box h4{font-size:.68rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem;font-weight:700;display:flex;align-items:center;gap:.35rem}
  .obs-item{font-size:.78rem;color:var(--ink);line-height:1.5}

  .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;animation:fade .2s ease;padding:1rem}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .confirm-dialog{background:var(--card);border:1px solid var(--line-2);border-radius:.9rem;padding:1.5rem;max-width:340px;width:100%;text-align:center;animation:popd .25s ease}
  @keyframes popd{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .confirm-dialog h3{color:var(--ink-hi);font-size:1rem;margin-bottom:.4rem;font-family:var(--serif)}
  .confirm-dialog p{color:var(--ink-dim);font-size:.82rem;margin-bottom:1rem;line-height:1.5}
  .dialog-btns{display:flex;gap:.6rem}
  .dialog-btns button{flex:1;padding:.6rem;border-radius:.45rem;font-size:.82rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}

  /* Empty state */
  .empty-search{text-align:center;padding:1.5rem 1rem;color:var(--ink-mute);font-size:.82rem}

  /* Phones */
  .phone-strip{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.75rem}
  .phone-chip{background:var(--surface);border:1px solid var(--line);border-radius:9999px;padding:.3rem .7rem;font-size:.7rem;color:var(--ink-dim);display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap;text-decoration:none;transition:border-color .2s}
  .phone-chip:hover{border-color:var(--accent)}
  .phone-chip strong{color:var(--ink-hi);font-family:var(--mono)}

  /* 5 Ps */
  .five-ps{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:.3rem;margin-top:.5rem}
  .five-ps-item{background:#1a0505;border:1px solid var(--danger-line);border-radius:.35rem;padding:.35rem .5rem;font-size:.7rem;color:var(--danger-ink);text-align:center;font-weight:600;font-family:var(--mono);letter-spacing:.02em}

  /* Print */
  @media print{
    body{background:#fff;color:#000}
    body::before{display:none}
    header{position:static;background:#fff;border-bottom:1px solid #000}
    .brand h1{color:#000}
    .back-link,.timer-badge,.nav-row,.copy-btn,.search-wrap,.patient-toggle,.phone-strip,.meta-row{display:none!important}
    .card{background:#fff;border:1px solid #ccc;box-shadow:none;break-inside:avoid}
    .card h2{color:#000}
    .dark-box,.conduta-box,.red-flag-box,.banner{break-inside:avoid}
    .dark-box{background:#f5f5f5;border:1px solid #ccc}
    .conduta-box{border-width:2px}
    .collapse-body.hidden{max-height:none!important;opacity:1!important;margin-top:.55rem!important}
    .note-text{background:#fff;border:1px solid #ccc;color:#000;max-height:none}
    .progress{display:none}
    .container{padding:0;max-width:100%}
    .result-badge{border-width:2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

  /* Mobile tweaks */
  @media(max-width:500px){
    .container{padding:.85rem;gap:.85rem}
    .card{padding:1rem}
    .card h2{font-size:1rem}
    .severity-cards{flex-direction:column}
    .lab-grid{grid-template-columns:1fr}
    .vial-number{font-size:2.1rem}
    .brand h1{font-size:.95rem}
    .brand .brand-sub{font-size:.58rem}
    .timer-badge{font-size:.6rem;padding:.2rem .45rem}
    .header-inner{gap:.5rem}
  }
  @media(max-width:360px){
    .brand h1{font-size:.88rem}

    .patient-toggle-btn{font-size:.68rem;padding:.4rem .25rem}
  }

  /* Safe area */
  @supports(padding-bottom: env(safe-area-inset-bottom)){
    .container{padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))}
  }
</style>

let searchTimeout = null;
function debounce(fn, delay){
  return function(...args){
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(()=> fn.apply(this, args), delay);
  };
}

// =============================================
// TIMER
// =============================================
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
}
function updateTimer(){
  const elapsed = Math.floor((Date.now() - evalStartTime) / 1000);
  const mm = String(Math.floor(elapsed / 60)).padStart(2,'0');
  const ss = String(elapsed % 60).padStart(2,'0');
  const el = document.getElementById('timerDisplay');
  if(el) el.textContent = mm + ':' + ss;
}
startTimer();

// =============================================
// PROGRESS
// =============================================
function progHTML(idx, allDone){
  let h='<div class="progress" role="progressbar" aria-valuenow="'+(allDone?TOTAL_STEPS:idx)+'" aria-valuemin="0" aria-valuemax="'+TOTAL_STEPS+'"><div class="progress-bar">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c = allDone||i<idx?'done':i===idx?'active':'';
    h+='<div class="progress-step '+c+'"></div>';
  }
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){
    const c = allDone||i<idx?'done-label':i===idx?'active-label':'';
    h+='<span class="'+c+'">'+STEP_LABELS[i]+'</span>';
  }
  h+='</div></div>';
  return h;
}

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id, title, contentFn, customClass){
  const open = sections[id];
  let h = customClass ? `<div class="${customClass}">` : '<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')" role="button" aria-expanded="${open}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('${id}');}">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BE</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}">`;
  h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// PATIENT + TIME (compact meta)
// =============================================
function metaRowHTML(){
  const opts = [
    {val:'adulto', label:'Adulto', cls:'active'},
    {val:'crianca', label:'Criança', cls:'active-child'},
    {val:'gestante', label:'Gestante', cls:'active-pregnant'},
  ];
  let h = '<div class="meta-row">';
  h += '<div class="patient-toggle" role="group" aria-label="Tipo de paciente">';
  for(const o of opts){
    const isActive = patientType === o.val;
    h += `<button class="patient-toggle-btn ${isActive?o.cls:''}" onclick="setPatientType('${o.val}')" aria-pressed="${isActive}">${o.label}</button>`;
  }
  h += '</div>';
  const val = timeSinceAccidentHours !== null ? timeSinceAccidentHours : '';
  h += '<div class="time-row">';
  h += `<label for="timeSinceInput">Tempo desde o acidente</label>`;
  h += `<input class="time-input" type="number" inputmode="decimal" min="0" max="720" step="0.5" value="${val}" placeholder="—" oninput="setTimeSince(this.value)" id="timeSinceInput">`;
  h += '<span class="time-unit">h</span>';
  h += '</div>';
  if(timeSinceAccidentHours !== null && selectedAnimal && ANTIVENOM_TIME_WINDOW[selectedAnimal]){
    h += timeWindowHTML();
  }
  h += '</div>';
  return h;
}

function timeWindowHTML(){
  const tw = ANTIVENOM_TIME_WINDOW[selectedAnimal];
  const t = timeSinceAccidentHours;
  let cls, msg;
  if(t > tw.acceptable){
    cls = 'tw-red';
    msg = `<strong>${t}h · janela tardia.</strong> ${tw.textLate}`;
  } else if(t > tw.ideal){
    cls = 'tw-yellow';
    msg = `<strong>${t}h · janela ideal passou (${tw.ideal}h)</strong>, mas soroterapia ainda indicada.`;
  } else {
    cls = 'tw-green';
    msg = `<strong>${t}h · dentro da janela ideal (${tw.ideal}h).</strong>`;
  }
  return `<div class="time-window ${cls}"><span>\u{23F1}\u{FE0F}</span><span>${msg}</span></div>`;
}

// STEP 0: ANIMAL
function renderAnimalSelect(){
  let h = progHTML(0, false);
  h += '<div class="card">';
  h += `<h2><span class="step-badge">1/${TOTAL_STEPS}</span> Qual animal?</h2>`;
  h += '<p class="subtitle">Identifique o animal ou a síndrome clínica.</p>';

  h += metaRowHTML();

  h += '<div class="search-wrap"><span class="search-icon">\u{1F50D}</span>';
  h += `<input class="search-box" type="text" placeholder="Filtrar animais..." value="${escAttr(searchFilter)}" oninput="filterAnimalsDebounced(this.value)" id="animalSearch" autocomplete="off" aria-label="Filtrar animais">`;
  h += `<button class="clear-search ${searchFilter?'visible':''}" onclick="clearSearch()" aria-label="Limpar busca">\u2715</button>`;
  h += '</div>';

  h += '<div class="options" id="animalOptions">';
  let visibleCount = 0;
  const filter = normalizeSearch(searchFilter);
  for(const g of ANIMAL_GROUPS){
    let groupHasVisible = false;
    let groupButtons = '';
    for(const a of g.animals){
      const searchText = normalizeSearch(a.name + ' ' + a.desc + ' ' + g.groupLabel);
      const visible = !filter || searchText.includes(filter);
      if(visible){ groupHasVisible = true; visibleCount++; }
      groupButtons += `<button class="option-btn ${selectedAnimal===a.id?'selected':''} ${visible?'':'hidden-animal'}" onclick="selectAnimal('${a.id}')" aria-pressed="${selectedAnimal===a.id}">`;
      groupButtons += `<span class="icon">${a.icon}</span>`;
      groupButtons += `<span class="label">${a.name}<small>${a.desc}</small></span>`;
      groupButtons += `<span class="tag ${g.tag}">${g.tagText}</span>`;
      groupButtons += '</button>';
    }
    if(groupHasVisible || !filter){
      h += `<div class="group-label" ${groupHasVisible?'':'style="display:none"'}>${g.groupLabel}</div>`;
      h += groupButtons;
    }
  }
  if(visibleCount === 0 && filter){
    h += '<div class="empty-search">Nenhum animal para "'+escHTML(searchFilter)+'"</div>';
  }
  h += '</div>';

  h += emergencyPhonesHTML();

  h += '<div class="nav-row">';
  h += `<button class="nav-btn primary" ${selectedAnimal?'':'disabled'} onclick="next()">Próximo \u2192</button>`;
  h += '</div></div>';
  app.innerHTML = h;

  if(searchFilter){
    const searchEl = document.getElementById('animalSearch');
    if(searchEl){ searchEl.focus(); searchEl.setSelectionRange(searchFilter.length, searchFilter.length); }
  }
}

  h += '<div class="nav-row">';
  h += '<button class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h += '<button class="nav-btn primary" onclick="next()">Próximo \u2192</button>';
  h += '</div></div>';
  app.innerHTML = h;
}

// STEP 2: SEVERITY
function renderSeverity(){
  const sev = SEVERITY[selectedAnimal];
  let h = progHTML(2, false);
  h += '<div class="card">';
  h += `<h2><span class="step-badge">3/${TOTAL_STEPS}</span> Gravidade</h2>`;
  h += `<p class="subtitle">${ANIMAL_NAMES[selectedAnimal]}. Critérios do Ministério da Saúde.</p>`;

  if(selectedAnimal === 'laquetico'){
    h += '<div class="banner danger-banner"><span class="b-icon">\u{26A0}\u{FE0F}</span><span>Acidente laquético não possui classificação leve. Tratar como no mínimo moderado.</span></div>';
  }
  if(selectedAnimal === 'elapidico'){
    h += '<div class="banner danger-banner"><span class="b-icon">\u{26A0}\u{FE0F}</span><span>Elapídico: dose fixa de 10 ampolas de SAE independente da gravidade.</span></div>';
  }
  if(patientType === 'crianca' && (selectedAnimal==='tityus' || selectedAnimal==='phoneutria')){
    h += '<div class="banner ped-banner"><span class="b-icon">\u{1F476}</span><span>Criança: classifique pelo menos como MODERADO. Evolução pode ser rápida.</span></div>';
  }

  const suggestedSev = suggestSeverity();
  if(suggestedSev && !severity){
    const displaySug = (selectedAnimal==='laquetico' && suggestedSev==='leve') ? 'moderado' : suggestedSev;
    h += `<div class="banner info-banner"><span class="b-icon">\u{1F4A1}</span><span>Sugestão pelos sintomas: <strong>${displaySug.toUpperCase()}</strong>.</span></div>`;
  }

  h += '<div class="severity-cards">';
  for(const sKey of ['leve','moderado','grave']){
    const sv = sev[sKey];
    const dotCls = {leve:'dot-leve', moderado:'dot-moderado', grave:'dot-grave'}[sKey];
    if(!sv){
      h += `<div class="sev-card disabled"><div class="sev-dot ${dotCls}"></div><div class="sev-title">Leve</div><div class="sev-desc">—</div></div>`;
      continue;
    }
    const sel = severity === sKey;
    const selCls = sel ? ` selected sel-${sKey}` : '';
    h += `<div class="sev-card${selCls}" onclick="setSeverity('${sKey}')" role="button" tabindex="0" aria-pressed="${sel}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setSeverity('${sKey}');}">`;
    h += `<div class="sev-dot ${dotCls}"></div>`;
    h += `<div class="sev-title">${sKey.charAt(0).toUpperCase()+sKey.slice(1)}</div>`;
    h += `<div class="sev-desc">${sv.desc}</div>`;
    h += '</div>';
  }
  h += '</div>';

  if(severity){
    const sv = sev[severity];
    if(!sv){ severity = null; render(); return; }
    h += '<div id="severityDetail" style="margin-top:1rem">';
    if(sv.vials > 0){
      h += '<div class="vial-display">';
      h += `<div class="vial-number">${sv.vials}</div>`;
      h += '<div class="vial-label">';
      h += `<div class="vial-title">${sv.antivenom} · ampolas</div>`;
      const dilInfo = DILUTION_GUIDE[patientType==='crianca'?'crianca':'adulto'];
      h += `<div class="vial-sub">Via ${sv.route} · ${dilInfo.volume} de ${dilInfo.fluid} · infundir em ${dilInfo.time} · dose única</div>`;
      h += '</div></div>';

      if(patientType === 'crianca'){
        h += '<div class="banner ped-banner" style="font-size:.72rem;padding:.55rem .75rem"><span class="b-icon">\u{1F476}</span><span><strong>Dose pediátrica:</strong> mesma do adulto (baseada no veneno, não no peso). Apenas volume de diluição é ajustado.</span></div>';
      }

      if(timeSinceAccidentHours !== null && ANTIVENOM_TIME_WINDOW[selectedAnimal] && timeSinceAccidentHours > ANTIVENOM_TIME_WINDOW[selectedAnimal].acceptable){
        h += `<div class="banner danger-banner"><span class="b-icon">\u{23F1}\u{FE0F}</span><span><strong>Janela tardia:</strong> ${ANTIVENOM_TIME_WINDOW[selectedAnimal].textLate}</span></div>`;
      }

      h += '<div class="reaction-triad">';
      h += '<h4>\u{26A0}\u{FE0F} Reações ao soro</h4>';
      h += `<div class="reaction-row"><strong>Antes:</strong> ${ANTIVENOM_REACTION.pre}</div>`;
      h += `<div class="reaction-row"><strong>Reação precoce:</strong> ${ANTIVENOM_REACTION.early}</div>`;
      h += `<div class="reaction-row"><strong>Doença do soro:</strong> ${ANTIVENOM_REACTION.late}</div>`;
      h += '</div>';
    } else {
      h += `<div class="banner info-banner"><span class="b-icon">\u{2139}\u{FE0F}</span><span><strong>${sv.antivenom}.</strong> ${sv.antivenom==='Não indicado'?'Tratamento sintomático e suporte clínico.':'Tratamento de suporte.'}</span></div>`;
    }
    h += '</div>';
  }

  if(selectedAnimal === 'botropico' && severity === 'grave'){
    h += '<div class="banner danger-banner" style="margin-top:.75rem"><span class="b-icon">\u{1F6A8}</span><span><strong>Síndrome compartimental — 5 P\'s:</strong> fasciotomia APÓS corrigir coagulopatia.</span></div>';
    h += '<div class="five-ps">';
    h += '<div class="five-ps-item">Pain</div>';
    h += '<div class="five-ps-item">Pallor</div>';
    h += '<div class="five-ps-item">Pulseless</div>';
    h += '<div class="five-ps-item">Paresthesia</div>';
    h += '<div class="five-ps-item">Paralysis</div>';
    h += '</div>';
  }

  if(FIRST_AID[selectedAnimal]){
    h += '<div class="first-aid-box">';
    h += '<h4>\u{1F6A8} Primeiros socorros (pré-hospitalar)</h4>';
    for(const item of FIRST_AID[selectedAnimal]){
      h += `<div class="first-aid-item">${item}</div>`;
    }
    h += '</div>';
  }

  h += '<div class="nav-row">';
  h += '<button class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h += `<button class="nav-btn primary" ${severity?'':'disabled'} onclick="next()">Próximo \u2192</button>`;
  h += '</div></div>';
  app.innerHTML = h;

  if(severity){
    const detail = document.getElementById('severityDetail');
    if(detail) detail.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}

// STEP 3: SUPPORT
function renderSupportCare(){
  let h = progHTML(3, false);
  h += '<div class="card">';
  h += `<h2><span class="step-badge">4/${TOTAL_STEPS}</span> Cuidados de suporte</h2>`;
  h += `<p class="subtitle">Checklist para ${ANIMAL_NAMES[selectedAnimal]} — ${severity}.</p>`;

  if(severity === 'grave'){
    h += '<div class="banner danger-banner"><span class="b-icon">\u{1F6A8}</span><span><strong>Caso GRAVE:</strong> estabilização hemodinâmica e via aérea primeiro. Iniciar soroterapia rapidamente.</span></div>';
  }

  if(patientType === 'gestante' && GESTANTE_ALERTS[selectedAnimal]){
    h += `<div class="banner gest-banner"><span class="b-icon">\u{1F930}</span><span><strong>Gestante:</strong> ${GESTANTE_ALERTS[selectedAnimal]}</span></div>`;
  }

  const totalItems = SUPPORT_COMMON.length + (SUPPORT_SPECIFIC[selectedAnimal] || []).length;
  const checkedCount = checkedSupport.size;
  if(totalItems > 0){
    const pct = Math.round((checkedCount / totalItems) * 100);
    h += `<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem">`;
    h += `<div style="flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct===100?'var(--ok)':'var(--accent)'};transition:width .3s"></div></div>`;
    h += `<span style="font-size:.7rem;color:var(--ink-mute);white-space:nowrap;font-family:var(--mono)">${checkedCount}/${totalItems}</span>`;
    h += '</div>';
  }

  h += '<div class="options">';
  h += '<div class="group-label">Medidas gerais</div>';
  for(const item of SUPPORT_COMMON){
    const ck = checkedSupport.has(item.text);
    h += `<button class="check-btn ${ck?'checked':''}" onclick="toggleSupport(${JSON.stringify(item.text)})" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${item.icon} ${item.text}</span></button>`;
  }

  const specific = SUPPORT_SPECIFIC[selectedAnimal];
  if(specific && specific.length > 0){
    h += `<div class="group-label">Específicos — ${ANIMAL_NAMES[selectedAnimal]}</div>`;
    for(const item of specific){
      const ck = checkedSupport.has(item.text);
      h += `<button class="check-btn ${ck?'checked':''}" onclick="toggleSupport(${JSON.stringify(item.text)})" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${item.icon} ${item.text}</span></button>`;
    }
  }
  h += '</div>';

  if(OBS_TIME[selectedAnimal] && severity && OBS_TIME[selectedAnimal][severity]){
    h += '<div class="obs-box">';
    h += '<h4>\u{23F0} Tempo de observação</h4>';
    h += `<div class="obs-item">${OBS_TIME[selectedAnimal][severity]}</div>`;
    if(patientType === 'crianca' && (selectedAnimal==='tityus' || selectedAnimal==='phoneutria' || selectedAnimal==='abelha')){
      h += '<div class="obs-item" style="color:var(--ped-ink);margin-top:.3rem;font-size:.75rem">\u{1F476} Criança: considerar observação estendida.</div>';
    }
    h += '</div>';
  }

  h += '<div class="nav-row">';
  h += '<button class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h += '<button class="nav-btn primary" onclick="next()">Ver resultado \u2192</button>';
  h += '</div></div>';
  app.innerHTML = h;
}

// STEP 4: RESULT
function renderResult(){
  const sev = SEVERITY[selectedAnimal];
  const sv = sev[severity];
  const badgeCls = {leve:'badge-leve', moderado:'badge-moderado', grave:'badge-grave'};
  const badgeIcon = {leve:'\u2713', moderado:'!', grave:'\u2717'};
  const sevLabel = severity.charAt(0).toUpperCase() + severity.slice(1);
  const ptLabels = {adulto:'Adulto', crianca:'Criança', gestante:'Gestante'};

  let h = progHTML(TOTAL_STEPS, true);
  h += '<div class="card result-card">';
  h += `<div class="result-badge ${badgeCls[severity]}">${badgeIcon[severity]}</div>`;
  h += `<div class="result-title">${ANIMAL_NAMES[selectedAnimal]}</div>`;
  h += '<div class="result-meta">';
  h += `<span class="chip">${sevLabel}</span>`;
  h += `<span class="chip">${ptLabels[patientType]}</span>`;
  h += `<span class="chip">${checkedSymptoms.local.size + checkedSymptoms.sistemico.size} sintomas</span>`;
  if(timeSinceAccidentHours !== null) h += `<span class="chip">${timeSinceAccidentHours}h</span>`;
  h += `<span class="chip">${getElapsedStr()}</span>`;
  h += '</div>';
  if(CID10[selectedAnimal]) h += `<div class="cid-chip">CID-10 ${CID10[selectedAnimal].code} · ${CID10[selectedAnimal].desc}</div>`;

  // Sintomas
  h += collapsible('symptoms', '\u{1F4CB} Sintomas identificados', ()=>{
    let s = '';
    if(checkedSymptoms.local.size > 0){
      s += '<div style="font-size:.68rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.4rem;font-weight:700">Locais</div>';
      for(const sym of checkedSymptoms.local) s += `<div class="summary-row"><span class="criteria">${sym}</span><span class="dot dot-moderado"></span></div>`;
    }
    if(checkedSymptoms.sistemico.size > 0){
      s += '<div style="font-size:.68rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.08em;margin-top:.6rem;margin-bottom:.4rem;font-weight:700">Sistêmicos</div>';
      for(const sym of checkedSymptoms.sistemico) s += `<div class="summary-row"><span class="criteria">${sym}</span><span class="dot dot-grave"></span></div>`;
    }
    if(checkedSymptoms.local.size===0 && checkedSymptoms.sistemico.size===0){
      s += '<p style="color:var(--ink-mute);text-align:center;padding:.5rem 0;font-size:.82rem">Nenhum sintoma (possível picada seca).</p>';
    }
    return s;
  });

  // Soroterapia
  h += collapsible('antivenom', '\u{1F489} Soroterapia', ()=>{
    let s = '';
    const boxCls = {leve:'leve-box', moderado:'moderado-box', grave:'grave-box'};
    s += `<div class="conduta-box ${boxCls[severity]}">`;
    s += `<h3>${sevLabel}</h3>`;
    s += `<div class="conduta-item"><span class="conduta-icon">•</span><span>${sv.desc}</span></div>`;
    if(sv.vials > 0){
      const dilInfo = DILUTION_GUIDE[patientType==='crianca'?'crianca':'adulto'];
      s += `<div class="conduta-item"><span class="conduta-icon">\u{1F489}</span><span><strong>${sv.vials} ampolas</strong> de ${sv.antivenom}</span></div>`;
      s += `<div class="conduta-item"><span class="conduta-icon">\u{1F4A7}</span><span>Via ${sv.route} · ${dilInfo.volume} de ${dilInfo.fluid}</span></div>`;
      s += `<div class="conduta-item"><span class="conduta-icon">\u{23F0}</span><span>Infundir em ${dilInfo.time} (dose única, não fracionar)</span></div>`;
      s += `<div class="conduta-item"><span class="conduta-icon">\u{26A0}\u{FE0F}</span><span>Material para anafilaxia à beira-leito</span></div>`;
      if(patientType === 'crianca'){
        s += `<div class="conduta-item"><span class="conduta-icon">\u{1F476}</span><span>Dose igual à do adulto (baseada no veneno)</span></div>`;
      }
    } else {
      s += `<div class="conduta-item"><span class="conduta-icon">\u{2139}\u{FE0F}</span><span>${sv.antivenom==='Não indicado'?'Soroterapia não indicada. Tratamento sintomático.':sv.antivenom+'. Tratamento de suporte.'}</span></div>`;
    }
    s += '</div>';
    if(OBS_TIME[selectedAnimal] && OBS_TIME[selectedAnimal][severity]){
      s += `<div style="font-size:.78rem;color:var(--ink-dim);padding:.3rem 0 0"><strong style="color:var(--ink-hi)">\u{23F0} Observação:</strong> ${OBS_TIME[selectedAnimal][severity]}</div>`;
    }
    return s;
  });

  // Red flags
  const flags = RED_FLAGS[selectedAnimal];
  const presentFlags = countPresentRedFlags();
  h += collapsible('redflags', `\u{26A0}\u{FE0F} Sinais de alarme${presentFlags>0?` (${presentFlags} presente${presentFlags>1?'s':''})`:''}`, ()=>{
    let s = '';
    for(const f of flags){
      const isPresent = isRedFlagPresent(f);
      s += `<div class="red-flag-item ${isPresent?'present':''}"><span class="red-flag-marker"></span><span>${f}${isPresent?' · presente':''}</span></div>`;
    }
    return s;
  }, 'red-flag-box');

  // Labs
  h += collapsible('labs', '\u{1F52C} Exames', ()=>{
    const labData = LABS[selectedAnimal];

    const urgentList = labData.urgent || [];
    let s = '';
    if(severity === 'grave' || severity === 'moderado'){
      s += '<div style="font-size:.66rem;color:var(--danger-ink);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700">● Urgente / colher imediatamente</div>';
    }
    s += '<div class="lab-grid">';
    for(const lab of labList){
      const isUrgent = (severity === 'grave' || severity === 'moderado') && urgentList.includes(lab);
      s += `<div class="lab-item ${isUrgent?'lab-urgent':''}">${isUrgent?'● ':''}${lab}</div>`;
    }
    s += '</div>';
    if(patientType === 'gestante'){
      s += '<div style="margin-top:.6rem;font-size:.75rem;color:var(--gest-ink);line-height:1.5">\u{1F930} <strong>Gestante:</strong> BCF (cardiotocografia), USG obstétrica se > 20 sem., tipagem + Coombs indireto.</div>';
    }
    return s;
  });

  // Support
  h += collapsible('support', `\u{1F3E5} Suporte (${checkedSupport.size} marcado${checkedSupport.size===1?'':'s'})`, ()=>{
    let s = '';
    if(checkedSupport.size === 0){
      s += '<p style="color:var(--ink-mute);text-align:center;padding:.5rem 0;font-size:.82rem">Nenhum cuidado marcado.</p>';
    } else {
      for(const item of checkedSupport){
        s += `<div class="conduta-item"><span class="conduta-icon">\u2713</span><span>${item}</span></div>`;
      }
    }
    return s;
  });

  // Note
  h += collapsible('note', '\u{1F4DD} Nota para prontuário', ()=> buildNoteContent());

  h += '<div class="nav-row">';
  h += '<button class="nav-btn secondary" onclick="prev()">\u2190 Editar</button>';
  h += '<button class="nav-btn danger" onclick="confirmRestart()">Recomeçar</button>';
  h += '</div>';
  h += '<div style="margin-top:.5rem"><button class="nav-btn secondary" style="width:100%" onclick="window.print()">\u{1F5A8}\u{FE0F} Imprimir</button></div>';

  h += '</div>';
  app.innerHTML = h;
}

// =============================================
// NOTE
// =============================================
function buildNoteContent(){
  const pad = n => String(n).padStart(2,'0');
  const now = new Date(evalStartTime);
  const ts = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const sv = SEVERITY[selectedAnimal][severity];
  const sevLabel = severity.charAt(0).toUpperCase() + severity.slice(1);
  const cid = CID10[selectedAnimal];
  const ptLabels = {adulto:'Adulto', crianca:'Criança', gestante:'Gestante'};

  let n = '';
  n += `ACIDENTE POR ANIMAL PEÇONHENTO — AVALIAÇÃO ESTRUTURADA\n`;
  n += `Data/hora: ${ts}\n`;
  n += `Tempo de atendimento: ${getElapsedStr()}\n`;
  n += `Paciente: ${ptLabels[patientType]}\n`;
  if(timeSinceAccidentHours !== null) n += `Tempo desde o acidente: ${timeSinceAccidentHours}h\n`;
  n += `========================================\n\n`;

  n += `ANIMAL: ${ANIMAL_NAMES[selectedAnimal]}\n`;
  n += `GRAVIDADE: ${sevLabel}\n`;
  if(cid) n += `CID-10: ${cid.code} — ${cid.desc}\n`;
  n += '\n';

  n += `MANIFESTAÇÕES CLÍNICAS\n`;
  if(checkedSymptoms.local.size > 0){
    n += `  Locais:\n`;
    for(const s of checkedSymptoms.local) n += `    - ${s}\n`;
  }
  if(checkedSymptoms.sistemico.size > 0){
    n += `  Sistêmicas:\n`;
    for(const s of checkedSymptoms.sistemico) n += `    - ${s}\n`;
  }
  if(checkedSymptoms.local.size === 0 && checkedSymptoms.sistemico.size === 0){
    n += `  Nenhum sintoma registrado (possível picada seca).\n`;
  }

  n += `\nSOROTERAPIA\n`;
  if(sv.vials > 0){
    const dilInfo = DILUTION_GUIDE[patientType==='crianca'?'crianca':'adulto'];
    n += `  ${sv.antivenom}: ${sv.vials} ampolas, via ${sv.route}\n`;
    n += `  Diluído em ${dilInfo.volume} de ${dilInfo.fluid}, infundir em ${dilInfo.time}\n`;
    n += `  Dose única, não fracionar. Material para anafilaxia à beira-leito.\n`;
    if(patientType === 'crianca'){
      n += `  NOTA PEDIÁTRICA: Dose igual à do adulto.\n`;
    }
  } else {
    n += `  ${sv.antivenom}\n`;
  }

  const flagsList = RED_FLAGS[selectedAnimal];
  const presentFlagsList = flagsList.filter(f => isRedFlagPresent(f));
  if(presentFlagsList.length > 0){
    n += `\nSINAIS DE ALARME PRESENTES\n`;
    for(const f of presentFlagsList) n += `  [!] ${f}\n`;
  }

  n += `\nEXAMES SOLICITADOS\n`;
  const labData = LABS[selectedAnimal];
  for(const lab of labData.labs) n += `  - ${lab}\n`;
  if(patientType === 'gestante'){
    n += `  - Cardiotocografia (BCF)\n`;
    n += `  - USG obstétrica (se > 20 semanas)\n`;
  }

  if(checkedSupport.size > 0){
    n += `\nCUIDADOS DE SUPORTE\n`;
    for(const item of checkedSupport) n += `  - ${item}\n`;
  }

  n += `\nOBSERVAÇÃO RECOMENDADA\n`;
  if(OBS_TIME[selectedAnimal] && OBS_TIME[selectedAnimal][severity]){
    n += `  ${OBS_TIME[selectedAnimal][severity]}\n`;
  }

  if(patientType === 'gestante'){
    n += `\nALERTA GESTANTE\n`;
    n += `  Monitorizar BCF. Soroterapia não contraindicada.\n`;
    if(GESTANTE_ALERTS[selectedAnimal]) n += `  ${GESTANTE_ALERTS[selectedAnimal]}\n`;
  }

  if(patientType === 'crianca' && PED_ALERTS[selectedAnimal]){
    n += `\nALERTA PEDIÁTRICO\n`;
    n += `  ${PED_ALERTS[selectedAnimal]}\n`;
  }

  n += `\nPROFILAXIA ANTITETÂNICA: verificar cartão vacinal\n`;
  n += `NOTIFICAÇÃO COMPULSÓRIA: preencher ficha SINAN`;
  if(cid) n += ` (CID-10: ${cid.code})`;
  n += `\n`;

  const escaped = n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">\u{1F4CB} Copiar nota</button>`;
}

function copyNote(){
  const el = document.getElementById('noteContent');
  if(!el) return;
  const text = el.textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onCopySuccess).catch(()=> fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); onCopySuccess(); }
  catch(e){ alert('Não foi possível copiar. Selecione o texto manualmente.'); }
  document.body.removeChild(ta);
}
function onCopySuccess(){
  const btn = document.getElementById('copyBtn');
  if(!btn) return;
  btn.textContent = '\u2713 Copiado!';
  btn.classList.add('copied');
  setTimeout(()=>{
    if(btn){ btn.textContent = '\u{1F4CB} Copiar nota'; btn.classList.remove('copied'); }
  }, 2000);
}

// =============================================
// RED FLAG MATCHING
// =============================================
function isSymptomRedFlag(animalId, symptom){
  const flags = RED_FLAGS[animalId];
  if(!flags) return false;
  const symNorm = normalizeSearch(symptom);
  return flags.some(rf => {
    const rfNorm = normalizeSearch(rf);
    const symWords = symNorm.split(/\s+/).filter(w => w.length >= 3);
    const rfWords = rfNorm.split(/\s+/).filter(w => w.length >= 3);
    return symWords.some(sw => rfWords.some(rw => rw.includes(sw) || sw.includes(rw)));
  });
}
function isRedFlagPresent(flag){
  const flagNorm = normalizeSearch(flag);
  const flagWords = flagNorm.split(/\s+/).filter(w => w.length >= 3);
  const allSymptoms = [...checkedSymptoms.local, ...checkedSymptoms.sistemico];
  return allSymptoms.some(sym => {
    const symNorm = normalizeSearch(sym);
    const symWords = symNorm.split(/\s+/).filter(w => w.length >= 3);
    let matchCount = 0;
    let hasLongMatch = false;
    for(const fw of flagWords){
      for(const sw of symWords){
        if(fw.includes(sw) || sw.includes(fw)){
          matchCount++;
          if(fw.length >= 6 || sw.length >= 6) hasLongMatch = true;
          break;
        }
      }
    }
    return matchCount >= 2 || (matchCount >= 1 && hasLongMatch);
  });
}
function countPresentRedFlags(){
  const flags = RED_FLAGS[selectedAnimal];
  if(!flags) return 0;
  return flags.filter(f => isRedFlagPresent(f)).length;
}

// =============================================
// SEVERITY SUGGESTION
// =============================================
function suggestSeverity(){
  const nLocal = checkedSymptoms.local.size;
  const nSis = checkedSymptoms.sistemico.size;
  if(nLocal === 0 && nSis === 0) return null;

  const allSis = [...checkedSymptoms.sistemico];
  const allLocal = [...checkedSymptoms.local];
  const sisHas = (...ks) => allSis.some(s => ks.some(k => s.toLowerCase().includes(k.toLowerCase())));
  const localHas = (...ks) => allLocal.some(s => ks.some(k => s.toLowerCase().includes(k.toLowerCase())));
  const isChild = patientType === 'crianca';
  let suggested = null;

  switch(selectedAnimal){
    case 'botropico':
      if(sisHas('Choque','anúria','Oligúria','Sangramento digestivo')) suggested = 'grave';
      else if(sisHas('Incoagulabilidade','Hematúria') || nSis >= 2) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else if(localHas('Bolhas','necrose')) suggested = 'moderado';
      else suggested = 'leve';
      break;
    case 'crotalico':
      if(sisHas('Oligúria','insuficiência renal','Urina escura')) suggested = 'grave';
      else if(nSis >= 3) suggested = 'grave';
      else if(sisHas('Fácies','Diplopia','Oftalmoplegia')) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;
    case 'elapidico':
      if(sisHas('Insuficiência respiratória','Paralisia','Disfagia')) suggested = 'grave';
      else if(sisHas('Ptose','Diplopia')) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;
    case 'laquetico':
      if(sisHas('Choque','Sangramento sistêmico','hemorragia')) suggested = 'grave';
      else suggested = 'moderado';
      break;
    case 'phoneutria':
      if(sisHas('Edema pulmonar','Choque')) suggested = 'grave';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      if(isChild && nSis >= 1 && suggested === 'moderado') suggested = 'grave';
      if(isChild && suggested === 'leve' && nLocal > 0) suggested = 'moderado';
      break;
    case 'loxosceles':
      if(sisHas('hemolítica','Insuficiência renal','CIVD','Hemoglobinúria')) suggested = 'grave';
      else if(localHas('marmórea','Necrose')) suggested = 'moderado';
      else if(sisHas('Icterícia','Febre')) suggested = 'moderado';
      else if(nSis >= 2) suggested = 'grave';
      else suggested = 'leve';
      if(isChild && suggested === 'moderado' && nSis >= 1) suggested = 'grave';
      break;
    case 'latrodectus':
      if(sisHas('Contraturas musculares','Hipertensão') && nSis >= 3) suggested = 'grave';
      else if(nSis >= 2) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;
    case 'tityus':
      if(sisHas('edema pulmonar','Choque','Dispneia')) suggested = 'grave';
      else if(nSis >= 2) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      if(isChild && nSis >= 2 && suggested === 'moderado') suggested = 'grave';
      if(isChild && suggested === 'leve' && nLocal > 0) suggested = 'moderado';
      break;
    case 'abelha':
      if(sisHas('choque','Rabdomiólise','Insuficiência renal')) suggested = 'grave';
      else if(sisHas('Broncoespasmo','Angioedema')) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;
    case 'lonomia':
      if(sisHas('Hemorragia intracraniana','Insuficiência renal')) suggested = 'grave';
      else if(sisHas('Sangramento','Gengivorragia','Hematúria','Equimoses')) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;
    case 'marinho':
      if(sisHas('Hipotensão','Paralisia')) suggested = 'grave';
      else if(nSis >= 2) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;
    default:
      if(nSis >= 3) suggested = 'grave';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
  }
  return suggested;
}

// =============================================
// HELPERS
// =============================================
function escHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function normalizeSearch(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function getElapsedStr(){
  const elapsed = Math.floor((Date.now() - evalStartTime) / 1000);
  const mm = Math.floor(elapsed / 60);
  const ss = elapsed % 60;
  if(mm === 0) return ss + 's';
  return mm + 'min ' + ss + 's';
}

// =============================================
// ACTIONS
// =============================================
function selectAnimal(id){
  if(selectedAnimal !== id){
    selectedAnimal = id;
    checkedSymptoms = {local:new Set(), sistemico:new Set()};
    severity = null;
    checkedSupport = new Set();
  }
  render();
}
const filterAnimalsDebounced = debounce(function(val){
  searchFilter = val;
  render();
}, 150);
function clearSearch(){
  searchFilter = '';
  render();
  const el = document.getElementById('animalSearch');
  if(el) el.focus();
}
function toggleSymptom(type, sym){
  if(checkedSymptoms[type].has(sym)) checkedSymptoms[type].delete(sym);
  else checkedSymptoms[type].add(sym);
  render();
}
function setSeverity(s){
  if(SEVERITY[selectedAnimal] && !SEVERITY[selectedAnimal][s]) return;
  severity = s;
  render();
}
function toggleSupport(text){
  if(checkedSupport.has(text)) checkedSupport.delete(text);
  else checkedSupport.add(text);
  render();
}
function toggleSection(id){
  sections[id] = !sections[id];
  render();
}
function setPatientType(type){
  patientType = type;
  render();
}
function setTimeSince(val){
  const v = parseFloat(val);
  timeSinceAccidentHours = isNaN(v) || val === '' ? null : Math.max(0, Math.min(720, v));
  render();
  const input = document.getElementById('timeSinceInput');
  if(input){
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
  }
}
function next(){
  if(step===0 && !selectedAnimal) return;
  if(step===2 && !severity) return;
  step++;
  searchFilter = '';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function prev(){
  if(step > 0){ step--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
}
function confirmRestart(){
  const overlay = document.getElementById('confirmOverlay');
  overlay.innerHTML = `<div class="confirm-overlay" onclick="handleOverlayClick(event)">
    <div class="confirm-dialog">
      <h3>Recomeçar avaliação?</h3>
      <p>Todos os dados preenchidos serão perdidos.</p>
      <div class="dialog-btns">
        <button style="background:#334155;color:var(--ink)" onclick="closeOverlay()">Cancelar</button>
        <button style="background:#7f1d1d;color:#fca5a5" onclick="doRestart()">Recomeçar</button>
      </div>
    </div>
  </div>`;
}
function handleOverlayClick(e){
  if(e.target.classList.contains('confirm-overlay')) closeOverlay();
}
function closeOverlay(){
  document.getElementById('confirmOverlay').innerHTML = '';
}
function doRestart(){
  document.getElementById('confirmOverlay').innerHTML = '';
  step = 0;
  selectedAnimal = null;
  checkedSymptoms = {local:new Set(), sistemico:new Set()};
  severity = null;
  checkedSupport = new Set();
  searchFilter = '';
  patientType = 'adulto';
  timeSinceAccidentHours = null;
  evalStartTime = Date.now();
  sections = {symptoms:false, antivenom:true, redflags:true, labs:false, support:false, note:true};
  startTimer();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const overlay = document.getElementById('confirmOverlay');
    if(overlay && overlay.innerHTML){ closeOverlay(); return; }
  }
});

render();
</script>
