<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Animais Peçonhentos - Avaliação de Envenenamento</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;overflow-x:hidden}

  .card .subtitle{font-size:.8rem;color:#94a3b8;margin-bottom:1.25rem;line-height:1.5}
  .search-box{width:100%;padding:.7rem 1rem .7rem 2.4rem;border-radius:.75rem;border:1.5px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.9rem;outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:.75rem}

  .options{display:flex;flex-direction:column;gap:.6rem}

  .tag-serpente{background:#7f1d1d;color:#fca5a5}
  .tag-aranha{background:#4c1d95;color:#c4b5fd}
  .tag-escorpiao{background:#92400e;color:#fcd34d}
  .tag-outro{background:#374151;color:#d1d5db}
  .check-btn{background:#0f172a;border:1.5px solid #334155;border-radius:.75rem;padding:.7rem 1rem;color:#cbd5e1;font-size:.88rem;cursor:pointer;transition:all .2s ease;text-align:left;display:flex;align-items:center;gap:.75rem;-webkit-user-select:none;user-select:none}

  .result-card{text-align:center;padding:2rem 1.5rem}

  .note-box{background:#0f172a;border-radius:.75rem;padding:1.25rem;text-align:left;margin-bottom:1rem}

  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.75rem;padding:.7rem;border-radius:.5rem;border:1.5px solid #334155;background:#1e293b;color:#cbd5e1;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}

  .score-opt:hover{border-color:#3b82f6;color:#cbd5e1}

  .info-banner{background:#172554;border:1px solid #1e40af;border-radius:.75rem;padding:1rem 1.15rem;font-size:.8rem;color:#93c5fd;line-height:1.6;margin-bottom:.5rem;display:flex;align-items:flex-start;gap:.6rem}

  .warn-banner{background:#451a03;border:1px solid #78350f;border-radius:.75rem;padding:1rem 1.15rem;font-size:.8rem;color:#fcd34d;line-height:1.6;margin-bottom:.5rem;display:flex;align-items:flex-start;gap:.6rem}
  .warn-banner .warn-icon{font-size:1.1rem;flex-shrink:0;margin-top:.05rem}
  .warn-banner strong{color:#fef3c7}
  .danger-banner{background:#450a0a;border:1px solid #991b1b;border-radius:.75rem;padding:1rem 1.15rem;font-size:.8rem;color:#fca5a5;line-height:1.6;margin-bottom:.5rem;display:flex;align-items:flex-start;gap:.6rem}
  .danger-banner .danger-icon{font-size:1.1rem;flex-shrink:0;margin-top:.05rem}

  .sev-card.sel-moderado .sev-desc{color:#fcd34d}
  .sev-card.sel-grave .sev-desc{color:#fca5a5}
  .first-aid-box{background:#172554;border:1px solid #1e40af;border-radius:.75rem;padding:1.15rem;text-align:left;margin-top:1rem}

// Debounce utility
let searchTimeout = null;
function debounce(fn, delay){
  return function(...args){
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(()=> fn.apply(this, args), delay);
  };
}

// =============================================
// TIMER
// =============================================
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer(){
  const elapsed = Math.floor((Date.now() - evalStartTime) / 1000);
  const mm = String(Math.floor(elapsed / 60)).padStart(2,'0');
  const ss = String(elapsed % 60).padStart(2,'0');
  const el = document.getElementById('timerDisplay');
  if(el) el.textContent = mm + ':' + ss;
}
startTimer();

function progHTML(idx, allDone){
  let h='<div class="progress-bar" role="progressbar" aria-valuenow="'+(allDone?TOTAL_STEPS:idx)+'" aria-valuemin="0" aria-valuemax="'+TOTAL_STEPS+'">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done':i===idx?'active':'';h+=`<div class="progress-step ${c}"></div>`}
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done-label':i===idx?'active-label':'';h+=`<span class="${c}">${STEP_LABELS[i]}</span>`}
  h+='</div><div class="flow-connector"><div class="arrow"></div></div>';
  h+='<div class="swipe-hint">Deslize para navegar</div>';
  return h;
}

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id, title, contentFn, customClass){
  const open = sections[id];
  let h = customClass ? `<div class="${customClass}">` : '<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')" role="button" aria-expanded="${open}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('${id}');}">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}" style="margin-top:${open?'.75rem':'0'}">`;
  h+=contentFn();
  h+='</div></div>';
  return h;
}

    const isDelayed = timeSinceAccidentHours > tw.ideal && timeSinceAccidentHours <= tw.acceptable;
    if(isLate){
      h += `<div class="time-since-banner time-urgent"><span>\u{26A0}\u{FE0F}</span><span><strong>${timeSinceAccidentHours}h desde o acidente.</strong> ${tw.text_late}</span></div>`;
    } else if(isDelayed){
      h += `<div class="time-since-banner" style="border-color:#78350f;color:#fcd34d"><span>\u{1F7E1}</span><span><strong>${timeSinceAccidentHours}h desde o acidente.</strong> Janela ideal já passou (${tw.ideal}h). ${tw.text_ideal}</span></div>`;
    } else {
      h += `<div class="time-since-banner" style="border-color:#14532d;color:#86efac"><span>\u{1F7E2}</span><span><strong>${timeSinceAccidentHours}h desde o acidente.</strong> Dentro da janela ideal. ${tw.text_ideal}</span></div>`;
    }
  }
  return h;
}

// =============================================
// EMERGENCY PHONES
// =============================================
function emergencyPhonesHTML(){
  let h = '<div class="phone-strip">';
  for(const p of EMERGENCY_PHONES){
    h += `<a href="tel:${p.number}" class="phone-chip" style="text-decoration:none;color:inherit"><span>\u{1F4DE}</span><strong>${p.label}:</strong> ${p.number}</a>`;
  }
  h += '</div>';
  return h;
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  if(step===0) renderAnimalSelect();
  else if(step===1) renderSymptoms();
  else if(step===2) renderSeverity();
  else if(step===3) renderSupportCare();
  else renderResult();
}

// =============================================
// STEP 0: ANIMAL SELECTION
// =============================================
function renderAnimalSelect(){
  let h = progHTML(0, false);
  h+='<div class="card">';
  h+='<h2><span class="step-badge">1/'+TOTAL_STEPS+'</span> Qual animal causou o acidente?</h2>';
  h+='<p class="subtitle">Selecione com base na identificação do animal ou síndrome clínica.</p>';

  // Patient type
  h += patientToggleHTML();

  // Time since accident
  h += timeSinceHTML();

  // Search
  h+='<div class="search-wrap"><span class="search-icon">\u{1F50D}</span>';
  h+=`<input class="search-box" type="text" placeholder="Filtrar animais..." value="${escAttr(searchFilter)}" oninput="filterAnimalsDebounced(this.value)" id="animalSearch" autocomplete="off" aria-label="Filtrar animais">`;
  h+=`<button class="clear-search ${searchFilter ? 'visible' : ''}" onclick="clearSearch()" aria-label="Limpar busca">\u2715</button>`;
  h+='</div>';

  h+='<div class="options" id="animalOptions">';
  let visibleCount = 0;
  const filter = normalizeSearch(searchFilter);
  for(const g of ANIMAL_GROUPS){
    let groupHasVisible = false;
    let groupButtons = '';
    for(const a of g.animals){
      const searchText = normalizeSearch(a.name + ' ' + a.desc + ' ' + g.groupLabel);
      const visible = !filter || searchText.includes(filter);
      if(visible) {groupHasVisible = true; visibleCount++;}
      groupButtons+=`<button class="option-btn ${selectedAnimal===a.id?'selected':''} ${visible?'':'hidden-animal'}" onclick="selectAnimal('${a.id}')" aria-pressed="${selectedAnimal===a.id}">`;
      groupButtons+=`<span class="icon">${a.icon}</span>`;
      groupButtons+=`<span class="label">${a.name}<small>${a.desc}</small></span>`;
      groupButtons+=`<span class="tag ${g.tag}">${g.tagText}</span>`;
      groupButtons+='</button>';
    }
    if(groupHasVisible || !filter){
      h+=`<div class="option-group-label" ${groupHasVisible?'':'style="display:none"'}>${g.groupLabel}</div>`;
      h+=groupButtons;
    }
  }
  if(visibleCount === 0 && filter){
    h+='<div class="empty-search">Nenhum animal encontrado para "'+escHTML(searchFilter)+'"</div>';
  }
  h+='</div>';

  // SINAN info
  h+='<div class="sinan-banner"><span>\u{1F4CB}</span><span><strong>Lembrete:</strong> Acidentes por animais peçonhentos são de notificação compulsória no SINAN.</span></div>';

  // Emergency phones
  h += emergencyPhonesHTML();

  h+='<div class="nav-row">';
  h+=`<button class="nav-btn primary ${selectedAnimal ? 'ready-pulse' : ''}" ${selectedAnimal?'':'disabled'} onclick="next()">Próximo \u2192</button>`;
  h+='</div></div>';
  app.innerHTML = h;

  // Keep focus on search if was typing
  if(searchFilter){
    const searchEl = document.getElementById('animalSearch');
    if(searchEl){searchEl.focus(); searchEl.setSelectionRange(searchFilter.length, searchFilter.length);}
  }
}

// =============================================
// STEP 1: SYMPTOMS
// =============================================
function renderSymptoms(){
  const s = SYMPTOMS[selectedAnimal];
  const nLocal = checkedSymptoms.local.size;
  const nSis = checkedSymptoms.sistemico.size;
  const nTotal = nLocal + nSis;
  const totalLocal = s.local.length;
  const totalSis = s.sistemico.length;

  let h = progHTML(1, false);
  h+='<div class="card">';
  h+=`<h2><span class="step-badge">2/${TOTAL_STEPS}</span> Manifestações clínicas</h2>`;
  h+=`<p class="subtitle">Marque os sinais e sintomas presentes. ${ANIMAL_NAMES[selectedAnimal]}.`;
  if(CID10[selectedAnimal]) h+=` <span class="cid-badge">CID-10: ${CID10[selectedAnimal].code}</span>`;
  h+='</p>';

  // Patient type reminder
  if(patientType === 'crianca'){
    h += '<div class="ped-alert" style="margin-bottom:.75rem"><span class="ped-icon">\u{1F476}</span><span><strong>Paciente pediátrico.</strong> Lembrar que gravidade pode ser maior em crianças pela relação veneno/peso corporal.</span></div>';
  } else if(patientType === 'gestante'){
    h += '<div class="warn-banner" style="margin-bottom:.75rem"><span class="warn-icon">\u{1F930}</span><span><strong>Gestante.</strong> Monitorar BCF. Soroterapia NÃO é contraindicada na gravidez.</span></div>';
  }

  // Symptom counter
  h+='<div class="symptom-counter">';
  h+=`<div class="sc-item"><span class="sc-num">${nTotal}</span> total</div>`;
  h+='<div class="sc-divider"></div>';
  h+=`<div class="sc-item"><span class="sc-num">${nLocal}</span> locais</div>`;
  h+='<div class="sc-divider"></div>';
  h+=`<div class="sc-item"><span class="sc-num">${nSis}</span> sistêmicos</div>`;
  h+='</div>';

  // Dry bite info if no symptoms selected
  if(nTotal === 0 && DRY_BITE_INFO[selectedAnimal]){
    const db = DRY_BITE_INFO[selectedAnimal];
    h += `<div class="dry-bite-banner"><span>\u{2139}\u{FE0F}</span><span><strong>Picada seca (~${db.rate}):</strong> ${db.text}</span></div>`;
  }

  h+='<div class="options">';

  // Local symptoms with select all
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:.75rem;margin-bottom:0;padding-left:.25rem">';
  h+='<span class="option-group-label" style="margin:0">Manifestações locais</span>';
  const allLocalChecked = nLocal === totalLocal;
  h+=`<button class="select-all-btn" onclick="toggleAllSymptoms('local')">${allLocalChecked ? 'Desmarcar todos' : 'Marcar todos'}</button>`;
  h+='</div>';
  for(const sym of s.local){
    const ck = checkedSymptoms.local.has(sym);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSymptom('local',${JSON.stringify(sym)})" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${sym}</span></button>`;
  }

  // Systemic symptoms with select all
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:.75rem;margin-bottom:0;padding-left:.25rem">';
  h+='<span class="option-group-label" style="margin:0">Manifestações sistêmicas</span>';
  const allSisChecked = nSis === totalSis;
  h+=`<button class="select-all-btn" onclick="toggleAllSymptoms('sistemico')">${allSisChecked ? 'Desmarcar todos' : 'Marcar todos'}</button>`;
  h+='</div>';
  for(const sym of s.sistemico){
    const ck = checkedSymptoms.sistemico.has(sym);
    const isRedFlag = isSymptomRedFlag(selectedAnimal, sym);
    h+=`<button class="check-btn ${ck?(isRedFlag?'checked-warn':'checked'):''}" onclick="toggleSymptom('sistemico',${JSON.stringify(sym)})" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${sym}${isRedFlag?' \u{26A0}\u{FE0F}':''}</span></button>`;
  }

  h+='</div>';

  // Auto-suggest severity
  const suggestedSev = suggestSeverity();
  if(suggestedSev){
    const displaySev = (selectedAnimal === 'laquetico' && suggestedSev === 'leve') ? 'moderado' : suggestedSev;
    const bannerClass = displaySev === 'grave' ? 'danger-banner' : displaySev === 'moderado' ? 'warn-banner' : 'info-banner';
    const iconClass = displaySev === 'grave' ? 'danger-icon' : displaySev === 'moderado' ? 'warn-icon' : 'info-icon';
    const icon = displaySev === 'grave' ? '\u{1F534}' : displaySev === 'moderado' ? '\u{1F7E1}' : '\u{1F7E2}';
    h+=`<div class="${bannerClass}" style="margin-top:1rem"><span class="${iconClass}">${icon}</span><span><strong>Sugestão automática:</strong> Com base nos sintomas, a gravidade sugerida é <strong>${displaySev.toUpperCase()}</strong>. Confirme na próxima etapa.</span></div>`;
  }

  // Pediatric alert if applicable AND patient is child
  if(PED_ALERTS[selectedAnimal] && patientType === 'crianca'){
    h+=`<div class="ped-alert"><span class="ped-icon">\u{1F476}</span><span><strong>Alerta pediátrico:</strong> ${PED_ALERTS[selectedAnimal]}</span></div>`;
  }
  // Always show pediatric alert for phoneutria and tityus (even if adult selected) since children may present
  if(PED_ALERTS[selectedAnimal] && patientType === 'adulto' && (selectedAnimal === 'phoneutria' || selectedAnimal === 'tityus')){
    h+=`<div class="ped-alert" style="opacity:.7"><span class="ped-icon">\u{1F476}</span><span><strong>Nota pediátrica (se aplicável):</strong> ${PED_ALERTS[selectedAnimal]}</span></div>`;
  }

  // Gestante alert if applicable
  if(GESTANTE_ALERTS[selectedAnimal] && patientType === 'gestante'){
    h+=`<div class="warn-banner" style="margin-top:.75rem"><span class="warn-icon">\u{1F930}</span><span><strong>Alerta gestante:</strong> ${GESTANTE_ALERTS[selectedAnimal]}</span></div>`;
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h+=`<button class="nav-btn primary" onclick="next()">Próximo \u2192</button>`;
  h+='</div></div>';
  app.innerHTML = h;
}

// =============================================
// STEP 2: SEVERITY
// =============================================
function renderSeverity(){
  const sev = SEVERITY[selectedAnimal];
  let h = progHTML(2, false);
  h+='<div class="card">';
  h+=`<h2><span class="step-badge">3/${TOTAL_STEPS}</span> Classificação de gravidade</h2>`;
  h+=`<p class="subtitle">${ANIMAL_NAMES[selectedAnimal]}. Classifique conforme critérios do Ministério da Saúde.</p>`;

  // Urgency strip for laquetico
  if(selectedAnimal === 'laquetico'){
    h+='<div class="urgency-strip urgency-alta">\u{26A0}\u{FE0F} Acidente laquético não possui classificação leve. Tratar como no mínimo moderado.</div>';
  }
  if(selectedAnimal === 'elapidico'){
    h+='<div class="urgency-strip urgency-alta">\u{26A0}\u{FE0F} Acidente elapídico: mesma dose de SAE (10 ampolas) independente da gravidade.</div>';
  }

  // Child severity warning
  if(patientType === 'crianca' && (selectedAnimal === 'tityus' || selectedAnimal === 'phoneutria')){
    h+='<div class="urgency-strip urgency-alta">\u{1F476} Criança: considerar classificar pelo menos como MODERADO. Evolução pode ser rápida.</div>';
  }

  // Pre-select suggestion
  const suggestedSev = suggestSeverity();
  if(suggestedSev && !severity){
    const displaySug = (selectedAnimal === 'laquetico' && suggestedSev === 'leve') ? 'moderado' : suggestedSev;
    h+=`<div class="info-banner" style="margin-bottom:.75rem"><span class="info-icon">\u{1F4A1}</span><span>Gravidade sugerida pelos sintomas: <strong>${displaySug.toUpperCase()}</strong>. Selecione abaixo para confirmar ou alterar.</span></div>`;
  }

  h+='<div class="severity-cards">';
  for(const sKey of ['leve','moderado','grave']){
    const sv = sev[sKey];
    if(!sv){
      h+=`<div class="sev-card sev-card-disabled">`;
      h+=`<div class="sev-icon">\u{1F7E2}</div>`;
      h+=`<div class="sev-title">Leve</div>`;
      h+=`<div class="sev-desc">Não aplicável para este animal</div>`;
      h+='</div>';
      continue;
    }
    const sel = severity === sKey;
    const selCls = sel ? ` selected sel-${sKey}` : '';
    const icons = {leve:'\u{1F7E2}', moderado:'\u{1F7E1}', grave:'\u{1F534}'};
    h+=`<div class="sev-card${selCls}" onclick="setSeverity('${sKey}')" role="button" tabindex="0" aria-pressed="${sel}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setSeverity('${sKey}');}">`;
    h+=`<div class="sev-icon">${icons[sKey]}</div>`;
    h+=`<div class="sev-title">${sKey.charAt(0).toUpperCase()+sKey.slice(1)}</div>`;
    h+=`<div class="sev-desc">${sv.desc}</div>`;
    h+='</div>';
  }
  h+='</div>';

  // Show antivenom preview
  if(severity){
    const sv = sev[severity];
    if(!sv) {
      severity = null;
      render();
      return;
    }
    h+='<div style="margin-top:1.25rem" id="severityDetail">';
    if(sv.vials > 0){
      h+='<div class="vial-display">';
      h+=`<div class="vial-number">${sv.vials}</div>`;
      h+='<div class="vial-label">';
      h+=`<div class="vial-title">Ampolas de ${sv.antivenom}</div>`;
      const dilInfo = DILUTION_GUIDE[patientType === 'crianca' ? 'crianca' : 'adulto'];
      h+=`<div class="vial-sub">Via ${sv.route}, diluído em ${dilInfo.fluid}<br>Volume: ${dilInfo.volume}<br>Infundir em ${dilInfo.time}. Dose única (não fracionar).</div>`;
      h+='</div></div>';

      // Pediatric dilution note
      if(patientType === 'crianca'){
        h+='<div class="dilution-info"><strong>Dose pediátrica:</strong> A dose do soro antiveneno é a MESMA do adulto (baseada na quantidade de veneno, não no peso do paciente). Apenas o volume de diluição é ajustado.</div>';
      }

      // Time window alert for antivenom
      if(timeSinceAccidentHours !== null && ANTIVENOM_TIME_WINDOW[selectedAnimal]){
        const tw = ANTIVENOM_TIME_WINDOW[selectedAnimal];
        if(timeSinceAccidentHours > tw.acceptable){
          h += `<div class="danger-banner" style="margin-top:.5rem"><span class="danger-icon">\u{23F0}</span><span><strong>Atenção:</strong> ${tw.text_late}</span></div>`;
        }
      }

      // Antivenom reaction management
      h+='<div class="antivenom-reaction">';
      h+='<h4>\u{26A0}\u{FE0F} Manejo de reações ao soro</h4>';
      h+=`<p><strong>Antes:</strong> ${ANTIVENOM_REACTION.premedication}</p>`;
      h+=`<p style="margin-top:.5rem"><strong>Reação precoce:</strong> ${ANTIVENOM_REACTION.earlyReaction}</p>`;
      h+=`<p style="margin-top:.5rem"><strong>Doença do soro:</strong> ${ANTIVENOM_REACTION.lateReaction}</p>`;
      h+='</div>';
    } else {
      h+=`<div class="info-banner"><span class="info-icon">\u{2139}\u{FE0F}</span><span><strong>${sv.antivenom}</strong> \u2014 ${sv.antivenom === 'Não indicado' ? 'Tratamento sintomático e suporte clínico.' : 'Tratar com suporte clínico e medidas específicas.'}</span></div>`;
    }
    h+='</div>';
  }

  // Compartment syndrome 5 P's for botropico
  if(selectedAnimal === 'botropico' && severity === 'grave'){
    h+='<div class="danger-banner" style="margin-top:.75rem"><span class="danger-icon">\u{1F6A8}</span><span><strong>Síndrome compartimental \u2014 5 P\'s:</strong> Avaliar antes de fasciotomia. Fasciotomia somente APÓS corrigir coagulopatia.</span></div>';
    h+='<div class="five-ps">';
    h+='<div class="five-ps-item">Pain (Dor)</div>';
    h+='<div class="five-ps-item">Pallor (Palidez)</div>';
    h+='<div class="five-ps-item">Pulselessness (Sem pulso)</div>';
    h+='<div class="five-ps-item">Paresthesia (Parestesia)</div>';
    h+='<div class="five-ps-item">Paralysis (Paralisia)</div>';
    h+='</div>';
  }

  // GCS quick reference for severe neurotoxic cases
  if((selectedAnimal === 'elapidico' || selectedAnimal === 'crotalico' || selectedAnimal === 'tityus') && severity === 'grave'){
    h+='<div style="margin-top:.75rem">';
    h+='<div class="info-banner"><span class="info-icon">\u{1F9E0}</span><span><strong>Escala de Coma de Glasgow (referência rápida):</strong> Registrar na admissão e a cada reavaliação.</span></div>';
    h+='<div class="gcs-grid">';
    h+='<div class="gcs-col"><strong>Abertura ocular</strong>4 - Espontânea<br>3 - Ao comando<br>2 - À dor<br>1 - Nenhuma</div>';
    h+='<div class="gcs-col"><strong>Resposta verbal</strong>5 - Orientada<br>4 - Confusa<br>3 - Palavras<br>2 - Sons<br>1 - Nenhuma</div>';
    h+='<div class="gcs-col"><strong>Resposta motora</strong>6 - Obedece<br>5 - Localiza dor<br>4 - Flexão normal<br>3 - Flexão anormal<br>2 - Extensão<br>1 - Nenhuma</div>';
    h+='</div>';
    h+='</div>';
  }

  // First aid box
  if(FIRST_AID[selectedAnimal]){
    h+='<div class="first-aid-box">';
    h+='<h4>\u{1F6A8} Orientações pré-hospitalares (primeiros socorros)</h4>';
    for(const item of FIRST_AID[selectedAnimal]){
      h+=`<div class="first-aid-item">${item}</div>`;
    }
    h+='</div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h+=`<button class="nav-btn primary ${severity ? 'ready-pulse' : ''}" ${severity?'':'disabled'} onclick="next()">Próximo \u2192</button>`;
  h+='</div></div>';
  app.innerHTML = h;

  // Scroll to severity detail on selection
  if(severity){
    const detail = document.getElementById('severityDetail');
    if(detail) detail.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}

// =============================================
// STEP 3: SUPPORTIVE CARE CHECKLIST
// =============================================
function renderSupportCare(){
  let h = progHTML(3, false);
  h+='<div class="card">';
  h+=`<h2><span class="step-badge">4/${TOTAL_STEPS}</span> Cuidados de suporte</h2>`;
  h+=`<p class="subtitle">Checklist de medidas adjuvantes para ${ANIMAL_NAMES[selectedAnimal]}.</p>`;

  // Urgency banner for grave cases
  if(severity === 'grave'){
    h+='<div class="danger-banner" style="margin-bottom:1rem"><span class="danger-icon">\u{1F6A8}</span><span><strong>Caso GRAVE:</strong> Priorizar estabilização hemodinâmica e vias aéreas. Soroterapia deve ser iniciada o mais rápido possível.</span></div>';
  }

  // Gestante-specific support
  if(patientType === 'gestante' && GESTANTE_ALERTS[selectedAnimal]){
    h+=`<div class="warn-banner" style="margin-bottom:1rem"><span class="warn-icon">\u{1F930}</span><span><strong>Gestante:</strong> ${GESTANTE_ALERTS[selectedAnimal]}</span></div>`;
  }

  // Completed count
  const totalItems = SUPPORT_COMMON.length + (SUPPORT_SPECIFIC[selectedAnimal] || []).length;
  const checkedCount = checkedSupport.size;
  if(totalItems > 0){
    const pct = Math.round((checkedCount / totalItems) * 100);
    h += `<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem">`;
    h += `<div style="flex:1;height:4px;background:#1e293b;border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct===100?'#22c55e':'#3b82f6'};transition:width .3s"></div></div>`;
    h += `<span style="font-size:.7rem;color:#64748b;white-space:nowrap">${checkedCount}/${totalItems}</span>`;
    h += '</div>';
  }

  h+='<div class="options">';

  h+='<div class="option-group-label">Medidas gerais</div>';
  for(const item of SUPPORT_COMMON){
    const ck = checkedSupport.has(item.text);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSupport(${JSON.stringify(item.text)})" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${item.icon} ${item.text}</span></button>`;
  }

  const specific = SUPPORT_SPECIFIC[selectedAnimal];
  if(specific && specific.length > 0){
    h+=`<div class="option-group-label">Específicos para ${ANIMAL_NAMES[selectedAnimal]}</div>`;
    for(const item of specific){
      const ck = checkedSupport.has(item.text);
      h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleSupport(${JSON.stringify(item.text)})" aria-pressed="${ck}"><span class="check-box">${ck?'\u2713':''}</span><span class="label">${item.icon} ${item.text}</span></button>`;
    }
  }

  h+='</div>';

  // Observation time
  if(OBS_TIME[selectedAnimal] && severity && OBS_TIME[selectedAnimal][severity]){
    h+='<div class="obs-time-box">';
    h+='<h4>\u{23F0} Tempo de observação recomendado</h4>';
    h+=`<div class="obs-time-item"><strong>${severity.charAt(0).toUpperCase()+severity.slice(1)}:</strong> ${OBS_TIME[selectedAnimal][severity]}</div>`;
    // Add pediatric observation note if child
    if(patientType === 'crianca' && (selectedAnimal === 'tityus' || selectedAnimal === 'phoneutria' || selectedAnimal === 'abelha')){
      h += '<div class="obs-time-item" style="color:#c4b5fd">\u{1F476} <strong>Criança:</strong> Considerar tempo de observação estendido. Monitorar evolução clínica rigorosamente.</div>';
    }
    h+='</div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h+='<button class="nav-btn primary" onclick="next()">Ver Resultado \u2192</button>';
  h+='</div></div>';
  app.innerHTML = h;
}

// =============================================
// STEP 4: RESULT
// =============================================
function renderResult(){
  const sev = SEVERITY[selectedAnimal];
  const sv = sev[severity];
  const badgeCls = {leve:'badge-leve', moderado:'badge-moderado', grave:'badge-grave'};
  const badgeIcon = {leve:'\u2713', moderado:'!', grave:'\u2717'};
  const sevLabel = severity.charAt(0).toUpperCase() + severity.slice(1);

  let h = progHTML(TOTAL_STEPS, true);
  h+='<div class="card result-card">';

  // Badge
  h+=`<div class="result-badge ${badgeCls[severity]}">${badgeIcon[severity]}</div>`;
  h+=`<div class="result-title">${ANIMAL_NAMES[selectedAnimal]}</div>`;

  // Patient type indicator
  const ptLabels = {adulto:'Adulto', crianca:'Criança', gestante:'Gestante'};
  h+=`<div class="result-desc">Gravidade: ${sevLabel} | ${ptLabels[patientType]} | ${checkedSymptoms.local.size + checkedSymptoms.sistemico.size} sintomas | ${getElapsedStr()}</div>`;
  if(CID10[selectedAnimal]) h+=`<div class="result-cid">CID-10: ${CID10[selectedAnimal].code} \u2014 ${CID10[selectedAnimal].desc}</div>`;

  // Time since accident in result
  if(timeSinceAccidentHours !== null){
    h += `<div style="font-size:.75rem;color:#94a3b8;margin-top:.35rem">\u{23F0} Tempo desde o acidente: ${timeSinceAccidentHours}h</div>`;
  }

  // -- Sintomas
  h+=collapsible('symptoms', '\u{1F4CB} Sintomas identificados', ()=>{
    let s='';
    if(checkedSymptoms.local.size > 0){
      s+='<div style="font-size:.7rem;color:#64748b;text-transform:uppercase;margin-bottom:.5rem">Locais</div>';
      for(const sym of checkedSymptoms.local) s+=`<div class="summary-row"><span class="criteria">${sym}</span><span class="value"><span class="dot dot-moderado"></span></span></div>`;
    }
    if(checkedSymptoms.sistemico.size > 0){
      s+='<div style="font-size:.7rem;color:#64748b;text-transform:uppercase;margin-top:.75rem;margin-bottom:.5rem">Sistêmicos</div>';
      for(const sym of checkedSymptoms.sistemico) s+=`<div class="summary-row"><span class="criteria">${sym}</span><span class="value"><span class="dot dot-grave"></span></span></div>`;
    }
    if(checkedSymptoms.local.size===0 && checkedSymptoms.sistemico.size===0){
      s+='<p style="color:#64748b;text-align:center;padding:.5rem 0;font-size:.85rem">Nenhum sintoma selecionado (possível picada seca?).</p>';
      if(DRY_BITE_INFO[selectedAnimal]){
        const db = DRY_BITE_INFO[selectedAnimal];
        s+=`<p style="color:#94a3b8;font-size:.78rem;text-align:center;padding:.25rem 0">Picada seca (~${db.rate}): ${db.text}</p>`;
      }
    }
    return s;
  });

  // -- Gravidade + Antiveneno
  h+=collapsible('antivenom', '\u{1F489} Soroterapia / Antiveneno', ()=>{
    let s='';
    const boxCls = {leve:'leve-box', moderado:'moderado-box', grave:'grave-box'};
    s+=`<div class="conduta-box ${boxCls[severity]}" style="margin-bottom:.75rem">`;
    s+=`<h3>Classificação: ${sevLabel}</h3>`;
    s+=`<div class="conduta-item"><span class="conduta-icon">\u{1F4CB}</span><span>${sv.desc}</span></div>`;
    if(sv.vials > 0){
      const dilInfo = DILUTION_GUIDE[patientType === 'crianca' ? 'crianca' : 'adulto'];
      s+=`<div class="conduta-item"><span class="conduta-icon">\u{1F489}</span><span><strong>${sv.vials} ampolas</strong> de ${sv.antivenom}</span></div>`;
      s+=`<div class="conduta-item"><span class="conduta-icon">\u{1F4A7}</span><span>Via ${sv.route}, diluído em ${dilInfo.volume} de ${dilInfo.fluid}</span></div>`;
      s+=`<div class="conduta-item"><span class="conduta-icon">\u{23F0}</span><span>Infundir em ${dilInfo.time} (dose única, não fracionar)</span></div>`;
      s+=`<div class="conduta-item"><span class="conduta-icon">\u{26A0}\u{FE0F}</span><span>Material para anafilaxia à beira-leito (adrenalina, corticoide, anti-H1)</span></div>`;
      s+=`<div class="conduta-item"><span class="conduta-icon">\u{1F504}</span><span>Reavaliar: dose adicional se piora clínica ou laboratorial em 12h</span></div>`;
      if(patientType === 'crianca'){
        s+=`<div class="conduta-item"><span class="conduta-icon">\u{1F476}</span><span><strong>Nota:</strong> Dose do antiveneno é a MESMA do adulto (baseada no veneno, não no peso).</span></div>`;
      }
    } else {
      s+=`<div class="conduta-item"><span class="conduta-icon">\u{2139}\u{FE0F}</span><span>${sv.antivenom === 'Não indicado' ? 'Soroterapia não indicada nesta gravidade. Tratamento sintomático.' : sv.antivenom + '. Tratamento de suporte.'}</span></div>`;
    }
    s+='</div>';

    // Observation time in result
    if(OBS_TIME[selectedAnimal] && severity && OBS_TIME[selectedAnimal][severity]){
      s+=`<div style="font-size:.8rem;color:#94a3b8;padding:.5rem 0">\u{23F0} <strong>Observação:</strong> ${OBS_TIME[selectedAnimal][severity]}</div>`;
    }
    return s;
  });

  // -- Red Flags
  const flags = RED_FLAGS[selectedAnimal];
  const presentFlags = countPresentRedFlags();
  h+=collapsible('redflags', `\u{26A0}\u{FE0F} Sinais de alarme${presentFlags > 0 ? ' (' + presentFlags + ' PRESENTE' + (presentFlags > 1 ? 'S' : '') + ')' : ''}`, ()=>{
    let s='';
    for(const f of flags){
      const isPresent = isRedFlagPresent(f);
      s+=`<div class="red-flag-item"><span style="flex-shrink:0">${isPresent ? '\u{1F534}' : '\u{26A0}\u{FE0F}'}</span><span${isPresent?' style="font-weight:700"':''}>${f}${isPresent?' (PRESENTE)':''}</span></div>`;
    }
    return s;
  }, 'red-flag-box');

  // -- Labs
  h+=collapsible('labs', '\u{1F52C} Exames complementares', ()=>{
    const labData = LABS[selectedAnimal];
    const labList = labData.labs;
    const urgentList = labData.urgent || [];
    let s='';
    if(severity === 'grave' || severity === 'moderado'){
      s+='<div style="font-size:.7rem;color:#fca5a5;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.05em">\u{1F534} = Urgente / colher imediatamente</div>';
    }
    s+='<div class="lab-grid">';
    for(const lab of labList){
      const isUrgent = (severity === 'grave' || severity === 'moderado') && urgentList.includes(lab);
      s+=`<div class="lab-item ${isUrgent?'lab-urgent':''}"><span class="lab-name">${isUrgent?'\u{1F534} ':''}${lab}</span></div>`;
    }
    s+='</div>';
    // Gestante-specific lab
    if(patientType === 'gestante'){
      s+='<div style="margin-top:.75rem;font-size:.78rem;color:#f9a8d4;line-height:1.5">\u{1F930} <strong>Gestante:</strong> Solicitar também: cardiotocografia (BCF), ultrassonografia obstétrica se > 20 semanas, tipagem sanguínea + Coombs indireto.</div>';
    }
    return s;
  });

  // -- Suporte
  h+=collapsible('support', `\u{1F3E5} Cuidados de suporte (${checkedSupport.size} marcados)`, ()=>{
    let s='';
    if(checkedSupport.size === 0){
      s+='<p style="color:#64748b;text-align:center;padding:.5rem 0;font-size:.85rem">Nenhum cuidado marcado.</p>';
    } else {
      for(const item of checkedSupport){
        s+=`<div class="conduta-item"><span class="conduta-icon">\u2713</span><span>${item}</span></div>`;
      }
    }
    return s;
  });

  // -- Note
  h+=collapsible('note', '\u{1F4DD} Nota para prontuário', ()=> buildNoteContent());

  // Nav
  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">\u2190 Editar</button>';
  h+='<button class="nav-btn danger" onclick="confirmRestart()">Recomeçar</button>';
  h+='</div>';

  // Print button
  h+='<div style="margin-top:.5rem"><button class="nav-btn secondary" style="width:100%" onclick="window.print()">\u{1F5A8}\u{FE0F} Imprimir</button></div>';

  h+='</div>';
  app.innerHTML = h;
}

// =============================================
// NOTE GENERATION
// =============================================
function buildNoteContent(){
  const pad = n => String(n).padStart(2,'0');
  const now = new Date(evalStartTime);
  const ts = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const sv = SEVERITY[selectedAnimal][severity];
  const sevLabel = severity.charAt(0).toUpperCase() + severity.slice(1);
  const cid = CID10[selectedAnimal];
  const ptLabels = {adulto:'Adulto', crianca:'Criança', gestante:'Gestante'};

  let n = '';
  n += `ACIDENTE POR ANIMAL PEÇONHENTO \u2014 AVALIAÇÃO ESTRUTURADA\n`;
  n += `Data/hora da avaliação: ${ts}\n`;
  n += `Tempo de atendimento: ${getElapsedStr()}\n`;
  n += `Paciente: ${ptLabels[patientType]}\n`;
  if(timeSinceAccidentHours !== null) n += `Tempo desde o acidente: ${timeSinceAccidentHours}h\n`;
  n += `========================================\n\n`;

  n += `ANIMAL: ${ANIMAL_NAMES[selectedAnimal]}\n`;
  n += `GRAVIDADE: ${sevLabel}\n`;
  if(cid) n += `CID-10: ${cid.code} \u2014 ${cid.desc}\n`;
  n += '\n';

  n += `MANIFESTAÇÕES CLÍNICAS\n`;
  if(checkedSymptoms.local.size > 0){
    n += `  Locais:\n`;
    for(const s of checkedSymptoms.local) n += `    - ${s}\n`;
  }
  if(checkedSymptoms.sistemico.size > 0){
    n += `  Sistêmicas:\n`;
    for(const s of checkedSymptoms.sistemico) n += `    - ${s}\n`;
  }
  if(checkedSymptoms.local.size === 0 && checkedSymptoms.sistemico.size === 0){
    n += `  Nenhum sintoma registrado (possível picada seca).\n`;
  }

  n += `\nSOROTERAPIA\n`;
  if(sv.vials > 0){
    const dilInfo = DILUTION_GUIDE[patientType === 'crianca' ? 'crianca' : 'adulto'];
    n += `  ${sv.antivenom}: ${sv.vials} ampolas, via ${sv.route}\n`;
    n += `  Diluído em ${dilInfo.volume} de ${dilInfo.fluid}, infundir em ${dilInfo.time}\n`;
    n += `  Dose única, não fracionar. Material para anafilaxia à beira-leito.\n`;
    if(patientType === 'crianca'){
      n += `  NOTA PEDIÁTRICA: Dose de antiveneno igual à do adulto.\n`;
    }
  } else {
    n += `  ${sv.antivenom}\n`;
  }

  // Red flags present
  const flagsList = RED_FLAGS[selectedAnimal];
  const presentFlagsList = flagsList.filter(f => isRedFlagPresent(f));
  if(presentFlagsList.length > 0){
    n += `\nSINAIS DE ALARME PRESENTES\n`;
    for(const f of presentFlagsList) n += `  [!] ${f}\n`;
  }

  n += `\nEXAMES SOLICITADOS\n`;
  const labData = LABS[selectedAnimal];
  for(const lab of labData.labs) n += `  - ${lab}\n`;
  if(patientType === 'gestante'){
    n += `  - Cardiotocografia (BCF)\n`;
    n += `  - USG obstétrica (se > 20 semanas)\n`;
  }

  if(checkedSupport.size > 0){
    n += `\nCUIDADOS DE SUPORTE\n`;
    for(const item of checkedSupport) n += `  - ${item}\n`;
  }

  n += `\nOBSERVAÇÃO RECOMENDADA\n`;
  if(OBS_TIME[selectedAnimal] && severity && OBS_TIME[selectedAnimal][severity]){
    n += `  ${OBS_TIME[selectedAnimal][severity]}\n`;
  }

  if(patientType === 'gestante'){
    n += `\nALERTA GESTANTE\n`;
    n += `  Monitorizar BCF. Soroterapia não contraindicada.\n`;
    if(GESTANTE_ALERTS[selectedAnimal]) n += `  ${GESTANTE_ALERTS[selectedAnimal]}\n`;
  }

  if(patientType === 'crianca' && PED_ALERTS[selectedAnimal]){
    n += `\nALERTA PEDIÁTRICO\n`;
    n += `  ${PED_ALERTS[selectedAnimal]}\n`;
  }

  n += `\nPROFILAXIA ANTITETÂNICA: verificar cartão vacinal\n`;
  n += `NOTIFICAÇÃO COMPULSÓRIA: preencher ficha SINAN`;
  if(cid) n += ` (CID-10: ${cid.code})`;
  n += `\n`;

  const escaped = n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">\u{1F4CB} Copiar nota para prontuário</button>`;
}

function copyNote(){
  const el = document.getElementById('noteContent');
  if(!el) return;
  const text = el.textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onCopySuccess).catch(()=> fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); onCopySuccess(); }
  catch(e) { alert('Não foi possível copiar. Selecione o texto manualmente.'); }
  document.body.removeChild(ta);
}

function onCopySuccess(){
  const btn = document.getElementById('copyBtn');
  if(!btn) return;
  btn.textContent = '\u2713 Copiado!';
  btn.classList.add('copied');
  setTimeout(()=>{
    if(btn){btn.textContent='\u{1F4CB} Copiar nota para prontuário';btn.classList.remove('copied');}
  },2000);
}

// =============================================
// RED FLAG MATCHING (improved heuristic)
// =============================================
function isSymptomRedFlag(animalId, symptom){
  const flags = RED_FLAGS[animalId];
  if(!flags) return false;
  const symNorm = normalizeSearch(symptom);
  return flags.some(rf => {
    const rfNorm = normalizeSearch(rf);
    const symWords = symNorm.split(/\s+/).filter(w => w.length >= 3);
    const rfWords = rfNorm.split(/\s+/).filter(w => w.length >= 3);
    return symWords.some(sw => rfWords.some(rw => rw.includes(sw) || sw.includes(rw)));
  });
}

function isRedFlagPresent(flag){
  const flagNorm = normalizeSearch(flag);
  const flagWords = flagNorm.split(/\s+/).filter(w => w.length >= 3);
  const allSymptoms = [...checkedSymptoms.local, ...checkedSymptoms.sistemico];
  return allSymptoms.some(sym => {
    const symNorm = normalizeSearch(sym);
    const symWords = symNorm.split(/\s+/).filter(w => w.length >= 3);
    let matchCount = 0;
    let hasLongMatch = false;
    for(const fw of flagWords){
      for(const sw of symWords){
        if(fw.includes(sw) || sw.includes(fw)){
          matchCount++;
          if(fw.length >= 6 || sw.length >= 6) hasLongMatch = true;
          break;
        }
      }
    }
    return matchCount >= 2 || (matchCount >= 1 && hasLongMatch);
  });
}

function countPresentRedFlags(){
  const flags = RED_FLAGS[selectedAnimal];
  if(!flags) return 0;
  return flags.filter(f => isRedFlagPresent(f)).length;
}

// =============================================
// SEVERITY SUGGESTION -- ANIMAL-SPECIFIC
// =============================================
function suggestSeverity(){
  const nLocal = checkedSymptoms.local.size;
  const nSis = checkedSymptoms.sistemico.size;
  if(nLocal === 0 && nSis === 0) return null;

  const allSis = [...checkedSymptoms.sistemico];
  const allLocal = [...checkedSymptoms.local];

  const sisHas = (...keywords) => allSis.some(s => keywords.some(k => s.toLowerCase().includes(k.toLowerCase())));
  const localHas = (...keywords) => allLocal.some(s => keywords.some(k => s.toLowerCase().includes(k.toLowerCase())));

  // Pediatric escalation: child + certain animals = bump severity
  const isChild = patientType === 'crianca';

  let suggested = null;

  switch(selectedAnimal){
    case 'botropico':
      if(sisHas('Choque','anúria','Oligúria','Sangramento digestivo')) suggested = 'grave';
      else if(sisHas('Incoagulabilidade','Hematúria') || nSis >= 2) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else if(localHas('Bolhas','necrose')) suggested = 'moderado';
      else suggested = 'leve';
      break;

    case 'crotalico':
      if(sisHas('Oligúria','insuficiência renal','Urina escura')) suggested = 'grave';
      else if(nSis >= 3) suggested = 'grave';
      else if(sisHas('Fácies','Diplopia','Oftalmoplegia')) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;

    case 'elapidico':
      if(sisHas('Insuficiência respiratória','Paralisia','Disfagia')) suggested = 'grave';
      else if(sisHas('Ptose','Diplopia')) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;

    case 'laquetico':
      if(sisHas('Choque','Sangramento sistêmico','hemorragia')) suggested = 'grave';
      else suggested = 'moderado'; // No leve for laquetico
      break;

    case 'phoneutria':
      if(sisHas('Edema pulmonar','Choque')) suggested = 'grave';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      // Escalate for children with any systemic symptoms
      if(isChild && nSis >= 1 && suggested === 'moderado') suggested = 'grave';
      if(isChild && suggested === 'leve' && nLocal > 0) suggested = 'moderado';
      break;

    case 'loxosceles':
      if(sisHas('hemolítica','Insuficiência renal','CIVD','Hemoglobinúria')) suggested = 'grave';
      else if(localHas('marmórea','Necrose')) suggested = 'moderado';
      else if(sisHas('Icterícia','Febre')) suggested = 'moderado';
      else if(nSis >= 2) suggested = 'grave';
      else suggested = 'leve';
      // Children: hemolytic form more common
      if(isChild && suggested === 'moderado' && nSis >= 1) suggested = 'grave';
      break;

    case 'latrodectus':
      if(sisHas('Contraturas musculares','Hipertensão') && nSis >= 3) suggested = 'grave';
      else if(nSis >= 2) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;

    case 'tityus':
      if(sisHas('edema pulmonar','Choque','Dispneia')) suggested = 'grave';
      else if(nSis >= 2) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      // Escalate for children: any systemic = at least moderado, 2+ systemic = grave
      if(isChild && nSis >= 2 && suggested === 'moderado') suggested = 'grave';
      if(isChild && suggested === 'leve' && nLocal > 0) suggested = 'moderado';
      break;

    case 'abelha':
      if(sisHas('choque','Rabdomiólise','Insuficiência renal')) suggested = 'grave';
      else if(sisHas('Broncoespasmo','Angioedema')) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;

    case 'lonomia':
      if(sisHas('Hemorragia intracraniana','Insuficiência renal')) suggested = 'grave';
      else if(sisHas('Sangramento','Gengivorragia','Hematúria','Equimoses')) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;

    case 'marinho':
      if(sisHas('Hipotensão','Paralisia')) suggested = 'grave';
      else if(nSis >= 2) suggested = 'moderado';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
      break;

    default:
      if(nSis >= 3) suggested = 'grave';
      else if(nSis >= 1) suggested = 'moderado';
      else suggested = 'leve';
  }

  return suggested;
}

// =============================================
// HELPERS
// =============================================
function escHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function normalizeSearch(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function getElapsedStr(){
  const elapsed = Math.floor((Date.now() - evalStartTime) / 1000);
  const mm = Math.floor(elapsed / 60);
  const ss = elapsed % 60;
  if(mm === 0) return ss + 's';
  return mm + 'min ' + ss + 's';
}

// =============================================
// ACTIONS
// =============================================
function selectAnimal(id){
  if(selectedAnimal !== id){
    selectedAnimal = id;
    checkedSymptoms = {local: new Set(), sistemico: new Set()};
    severity = null;
    checkedSupport = new Set();
  }
  render();
}

function filterAnimals(val){
  searchFilter = val;
  render();
}

const filterAnimalsDebounced = debounce(function(val){
  searchFilter = val;
  render();
}, 150);

function clearSearch(){
  searchFilter = '';
  render();
  const searchEl = document.getElementById('animalSearch');
  if(searchEl) searchEl.focus();
}

function toggleSymptom(type, sym){
  if(checkedSymptoms[type].has(sym)) checkedSymptoms[type].delete(sym);
  else checkedSymptoms[type].add(sym);
  render();
}

function toggleAllSymptoms(type){
  const s = SYMPTOMS[selectedAnimal];
  const syms = s[type];
  const allChecked = checkedSymptoms[type].size === syms.length;
  if(allChecked){
    checkedSymptoms[type] = new Set();
  } else {
    checkedSymptoms[type] = new Set(syms);
  }
  render();
}

function setSeverity(s){
  if(SEVERITY[selectedAnimal] && !SEVERITY[selectedAnimal][s]) return;
  severity = s;
  render();
}

function toggleSupport(text){
  if(checkedSupport.has(text)) checkedSupport.delete(text);
  else checkedSupport.add(text);
  render();
}

function toggleSection(id){
  sections[id] = !sections[id];
  render();
}

function setPatientType(type){
  patientType = type;
  render();
}

function setTimeSince(val){
  const v = parseFloat(val);
  timeSinceAccidentHours = isNaN(v) || val === '' ? null : Math.max(0, Math.min(720, v));
  render();
  const input = document.getElementById('timeSinceInput');
  if(input){
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
  }
}

function next(){
  if(step===0 && !selectedAnimal) return;
  if(step===2 && !severity) return;
  step++;
  searchFilter = '';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function prev(){
  if(step>0){step--;render();window.scrollTo({top:0, behavior:'smooth'});}
}

function confirmRestart(){
  const overlay = document.getElementById('confirmOverlay');
  overlay.innerHTML = `<div class="confirm-overlay" onclick="handleOverlayClick(event)">
    <div class="confirm-dialog">
      <h3>Recomeçar avaliação?</h3>
      <p>Todos os dados preenchidos serão perdidos.</p>
      <div class="dialog-btns">
        <button style="background:#334155;color:#cbd5e1" onclick="closeOverlay()">Cancelar</button>
        <button style="background:#991b1b;color:#fca5a5" onclick="doRestart()">Recomeçar</button>
      </div>
    </div>
  </div>`;
}

function handleOverlayClick(e){
  if(e.target.classList.contains('confirm-overlay')){
    closeOverlay();
  }
}

function closeOverlay(){
  document.getElementById('confirmOverlay').innerHTML = '';
}

function doRestart(){
  document.getElementById('confirmOverlay').innerHTML = '';
  step = 0;
  selectedAnimal = null;
  checkedSymptoms = {local: new Set(), sistemico: new Set()};
  severity = null;
  checkedSupport = new Set();
  searchFilter = '';
  patientType = 'adulto';
  timeSinceAccidentHours = null;
  evalStartTime = Date.now();
  sections = {symptoms:true, severity:true, antivenom:true, redflags:true, labs:true, support:true, note:true, firstaid:false, obstime:true, avreaction:false};
  startTimer();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

// Keyboard navigation
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const overlay = document.getElementById('confirmOverlay');
    if(overlay && overlay.innerHTML) {closeOverlay(); return;}
  }
  if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
  if(e.key === 'ArrowRight' && e.altKey){e.preventDefault(); next();}
  if(e.key === 'ArrowLeft' && e.altKey){e.preventDefault(); prev();}
});

// Swipe navigation on mobile
let touchStartX = null;
let touchStartY = null;
document.addEventListener('touchstart', (e) => {
  if(e.touches.length === 1){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, {passive: true});

document.addEventListener('touchend', (e) => {
  if(touchStartX === null || touchStartY === null) return;
  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;
  const dx = touchEndX - touchStartX;
  const dy = touchEndY - touchStartY;
  touchStartX = null;
  touchStartY = null;

  // Only trigger if horizontal swipe is dominant and substantial
  if(Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2){
    // Don't trigger if user was interacting with a scrollable element
    const target = e.target;
    if(target.closest('.note-text, .options, input, textarea')) return;
    if(dx < 0) next(); // swipe left = next
    else prev(); // swipe right = prev
  }
}, {passive: true});

// Initial render
render();
</script>
</body>
</html>
