<!-- VERSION: 5 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#0f172a">
<title>Queimaduras - Avaliacao e Manejo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  header{background:linear-gradient(135deg,#1e293b,#334155);width:100%;padding:1.5rem;text-align:center;border-bottom:2px solid #f59e0b;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  header h1{font-size:1.5rem;font-weight:600;color:#f1f5f9}
  header p{font-size:.875rem;color:#94a3b8;margin-top:.25rem}
  .back-link{position:absolute;left:1.5rem;top:50%;transform:translateY(-50%);color:#94a3b8;text-decoration:none;font-size:.85rem;font-weight:500;transition:color .2s;padding:.5rem}
  .back-link:hover{color:#f1f5f9}
  .container{max-width:700px;width:100%;padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem}

  /* Progress bar */
  .progress-bar{display:flex;align-items:center;gap:.35rem;padding:0 .5rem}
  .progress-step{flex:1;height:6px;border-radius:3px;background:#1e293b;transition:background .4s ease, box-shadow .4s ease}
  .progress-step.done{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,0.3)}
  .progress-step.active{background:#fbbf24;animation:pulse-bar 1.5s infinite;box-shadow:0 0 8px rgba(251,191,36,0.4)}
  @keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.5}}
  .progress-labels{display:flex;justify-content:space-between;font-size:.55rem;color:#64748b;padding:0 .5rem;margin-top:.25rem}
  .progress-labels span{transition:color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;flex:1}
  .progress-labels span.active-label{color:#fde68a;font-weight:600}.progress-labels span.done-label{color:#f59e0b}
  .progress-pct{text-align:center;font-size:.6rem;color:#64748b;margin-top:.15rem}
  .flow-connector{display:flex;justify-content:center;padding:.25rem 0}
  .flow-connector .arrow{width:2px;height:24px;background:#334155;position:relative}
  .flow-connector .arrow::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #334155}

  /* Cards */
  .card{background:#1e293b;border:1px solid #334155;border-radius:1rem;padding:2rem;animation:fadeSlideIn .4s cubic-bezier(.16,1,.3,1)}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .card h2{font-size:1.15rem;color:#f8fafc;margin-bottom:.35rem}
  .card .subtitle{font-size:.8rem;color:#94a3b8;margin-bottom:1.25rem}
  .step-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.65rem;color:#64748b;background:#0f172a;padding:.2rem .6rem;border-radius:9999px;margin-bottom:.75rem;border:1px solid #1e293b}

  /* Options */
  .options{display:flex;flex-direction:column;gap:.75rem}
  .option-group-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-top:.5rem;margin-bottom:-.25rem}
  .option-group-label:first-child{margin-top:0}
  .option-btn{background:#0f172a;border:1.5px solid #334155;border-radius:.75rem;padding:.9rem 1.1rem;color:#cbd5e1;font-size:.95rem;cursor:pointer;transition:all .2s ease;text-align:left;display:flex;align-items:center;gap:.75rem;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .option-btn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(245,158,11,0.08),transparent 60%);opacity:0;transition:opacity .3s}
  .option-btn:hover::before{opacity:1}
  .option-btn:hover{border-color:#f59e0b;background:#172040;color:#f1f5f9;transform:translateX(2px)}
  .option-btn.selected{border-color:#f59e0b;background:#422006;color:#f1f5f9;box-shadow:0 0 12px rgba(245,158,11,0.15)}
  .option-btn .icon{font-size:1.25rem;flex-shrink:0;width:2rem;text-align:center}
  .option-btn .label{flex:1}
  .option-btn .tag{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .5rem;border-radius:9999px;font-weight:600;flex-shrink:0}
  .option-btn .selected-check{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);color:#f59e0b;font-size:1rem;opacity:0;transition:opacity .2s}
  .option-btn.selected .selected-check{opacity:1}

  /* Checkbox buttons */
  .check-btn{background:#0f172a;border:1.5px solid #334155;border-radius:.75rem;padding:.75rem 1rem;color:#cbd5e1;font-size:.9rem;cursor:pointer;transition:all .2s ease;text-align:left;display:flex;align-items:center;gap:.75rem;-webkit-tap-highlight-color:transparent}
  .check-btn:hover{border-color:#f59e0b;background:#172040;color:#f1f5f9}
  .check-btn.checked{border-color:#f59e0b;background:#422006;color:#f1f5f9}
  .check-box{width:20px;height:20px;border:2px solid #475569;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:.75rem}
  .check-btn.checked .check-box{background:#f59e0b;border-color:#f59e0b}

  /* Navigation */
  .nav-row{display:flex;gap:.75rem;margin-top:1.25rem}
  .nav-btn{flex:1;padding:.8rem;border-radius:.75rem;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s ease;border:none;-webkit-tap-highlight-color:transparent}
  .nav-btn.secondary{background:#334155;color:#cbd5e1}.nav-btn.secondary:hover{background:#475569}
  .nav-btn.primary{background:#f59e0b;color:#1e293b}.nav-btn.primary:hover{background:#d97706;transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,158,11,0.3)}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}

  /* Result */
  .result-card{text-align:center;padding:2rem 1.5rem}
  .result-badge{display:inline-flex;align-items:center;justify-content:center;width:5rem;height:5rem;border-radius:50%;font-size:1.5rem;font-weight:800;margin-bottom:1rem;animation:badgePop .5s cubic-bezier(.16,1,.3,1)}
  @keyframes badgePop{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
  .result-badge.sev-minor{background:#166534;color:#86efac;border:3px solid #22c55e;box-shadow:0 0 20px rgba(34,197,94,0.2)}
  .result-badge.sev-moderate{background:#92400e;color:#fcd34d;border:3px solid #f59e0b;box-shadow:0 0 20px rgba(245,158,11,0.2)}
  .result-badge.sev-major{background:#991b1b;color:#fca5a5;border:3px solid #ef4444;box-shadow:0 0 20px rgba(239,68,68,0.3);animation:badgePop .5s cubic-bezier(.16,1,.3,1), dangerPulse 2s infinite}
  @keyframes dangerPulse{0%,100%{box-shadow:0 0 20px rgba(239,68,68,0.3)}50%{box-shadow:0 0 30px rgba(239,68,68,0.5)}}
  .result-title{font-size:1.3rem;font-weight:700;margin-bottom:.25rem}
  .result-desc{color:#94a3b8;font-size:.9rem;margin-bottom:1.5rem}

  /* Dark boxes / collapsibles */
  .dark-box{background:#1e293b;border-radius:.75rem;padding:1.25rem;text-align:left;margin-bottom:1.25rem;border:1px solid #334155;transition:border-color .3s}
  .dark-box:hover{border-color:#475569}
  .dark-box h3{font-size:.8rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #1e293b;font-size:.85rem}
  .summary-row:last-child{border-bottom:none}.summary-row .criteria{color:#94a3b8}
  .summary-row .value{font-weight:600;display:flex;align-items:center;gap:.4rem}
  .conduta-box{border-radius:.75rem;padding:1.25rem;text-align:left;margin-bottom:1.25rem}
  .conduta-box h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
  .conduta-box.alta-prob{background:#450a0a;border:1.5px solid #991b1b}.conduta-box.alta-prob h3{color:#fca5a5}
  .conduta-box.mod-prob{background:#451a03;border:1.5px solid #78350f}.conduta-box.mod-prob h3{color:#fcd34d}
  .conduta-box.baixa-prob{background:#052e16;border:1.5px solid #14532d}.conduta-box.baixa-prob h3{color:#86efac}
  .conduta-item{display:flex;align-items:flex-start;gap:.5rem;padding:.4rem 0;font-size:.85rem;color:#cbd5e1}
  .conduta-icon{flex-shrink:0;width:1.2rem;text-align:center}
  .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:.25rem 0;border-radius:.5rem;transition:background .2s;-webkit-tap-highlight-color:transparent}
  .collapse-header:hover{background:rgba(255,255,255,.03)}
  .collapse-header h3{margin-bottom:0;transition:color .2s}
  .collapse-header:hover h3{color:#94a3b8}
  .collapse-arrow{font-size:.8rem;color:#64748b;transition:transform .3s cubic-bezier(.16,1,.3,1)}
  .collapse-arrow.open{transform:rotate(180deg)}
  .collapse-body{overflow:hidden;transition:max-height .4s cubic-bezier(.16,1,.3,1),opacity .3s ease,margin-top .3s ease}
  .collapse-body.hidden{max-height:0!important;opacity:0;margin-top:0}
  .collapse-body.visible{max-height:5000px;opacity:1;margin-top:.75rem}

  /* Body map */
  .body-map{display:flex;flex-direction:column;gap:.5rem;margin:1rem 0}
  .body-row{display:flex;gap:.5rem}
  .body-region{flex:1;background:#0f172a;border:1.5px solid #334155;border-radius:.75rem;padding:.6rem .5rem;cursor:pointer;transition:all .25s ease;text-align:center;position:relative;overflow:hidden;min-height:4rem;-webkit-tap-highlight-color:transparent}
  .body-region::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(245,158,11,0.15),transparent 70%);opacity:0;transition:opacity .3s}
  .body-region:hover{border-color:#f59e0b;background:#172040}
  .body-region.active{border-color:#f59e0b;background:#422006;box-shadow:0 0 10px rgba(245,158,11,0.15)}
  .body-region.active::after{opacity:1}
  .body-region .region-icon{font-size:1.3rem;display:block;margin-bottom:.2rem}
  .body-region .region-name{font-size:.65rem;color:#94a3b8;display:block;line-height:1.2}
  .body-region .region-pct{font-size:.85rem;font-weight:700;color:#fbbf24;display:block;margin-top:.15rem;font-family:'SF Mono','Fira Code',monospace;transition:transform .2s}
  .body-region.active .region-name{color:#fde68a}
  .body-region.active .region-pct{transform:scale(1.1)}
  .tbsa-total{text-align:center;margin:1rem 0;padding:1rem;background:#0f172a;border-radius:.75rem;border:1.5px solid #334155;transition:border-color .3s}
  .tbsa-total.has-value{border-color:#f59e0b}
  .tbsa-total .number{font-size:2.5rem;font-weight:800;font-family:'SF Mono','Fira Code',monospace;color:#fbbf24;transition:all .3s}
  .tbsa-total .label{font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-top:.25rem}
  .tbsa-total .severity-hint{font-size:.75rem;margin-top:.35rem;font-weight:600;transition:color .3s}

  /* Input fields */
  .input-group{margin-bottom:1rem}
  .input-group label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:.4rem;font-weight:500}
  .input-row{display:flex;align-items:center;gap:.75rem}
  .input-field{background:#0f172a;border:1.5px solid #334155;border-radius:.5rem;padding:.7rem .9rem;color:#f1f5f9;font-size:1rem;font-family:'SF Mono','Fira Code','Consolas',monospace;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
  .input-field:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,0.15)}
  .input-field::placeholder{color:#475569}
  .input-field.input-error{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,0.15)}
  .input-unit{font-size:.8rem;color:#64748b;min-width:2.5rem}
  .input-hint{font-size:.65rem;color:#475569;margin-top:.25rem}
  .input-error-msg{font-size:.65rem;color:#fca5a5;margin-top:.25rem}

  /* Parkland result */
  .parkland-result{background:#0f172a;border-radius:.75rem;padding:1.25rem;margin-top:1rem;border:1.5px solid #334155}
  .parkland-result.active{border-color:#f59e0b}
  .parkland-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #1e293b;font-size:.85rem}
  .parkland-row:last-child{border-bottom:none}
  .parkland-row .pk-label{color:#94a3b8}
  .parkland-row .pk-value{font-weight:700;font-family:'SF Mono','Fira Code',monospace;color:#fbbf24}
  .parkland-row .pk-value.highlight{font-size:1.1rem;color:#f59e0b}

  /* Score opt buttons */
  .score-opt{flex:1;padding:.6rem .4rem;border-radius:.5rem;font-size:.8rem;cursor:pointer;border:1.5px solid #334155;background:#0f172a;color:#94a3b8;text-align:center;transition:all .2s ease;line-height:1.3;-webkit-tap-highlight-color:transparent}
  .score-opt:hover{border-color:#f59e0b;color:#cbd5e1;background:#172040}
  .score-opt.picked{border-color:#f59e0b;background:#422006;color:#f1f5f9;font-weight:600;box-shadow:0 0 8px rgba(245,158,11,0.15)}

  /* Depth cards */
  .depth-card{background:#0f172a;border:1.5px solid #334155;border-radius:.75rem;padding:1rem;cursor:pointer;transition:all .25s ease;margin-bottom:.5rem;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .depth-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;transition:background .3s}
  .depth-card:hover{border-color:#f59e0b;background:#172040;transform:translateX(2px)}
  .depth-card.selected{border-color:#f59e0b;background:#422006;box-shadow:0 0 12px rgba(245,158,11,0.15)}
  .depth-card.selected::before{background:#f59e0b}
  .depth-card .depth-title{font-size:.95rem;font-weight:600;color:#f1f5f9;margin-bottom:.35rem;display:flex;align-items:center;gap:.5rem}
  .depth-card .depth-desc{font-size:.75rem;color:#94a3b8;line-height:1.5}
  .depth-card .depth-clinical{font-size:.7rem;color:#64748b;line-height:1.4;margin-top:.35rem;padding-top:.35rem;border-top:1px solid #1e293b}
  .depth-card .depth-tag{font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;padding:.15rem .45rem;border-radius:9999px;font-weight:600}
  .tag-1{background:#166534;color:#86efac}
  .tag-2s{background:#854d0e;color:#fde68a}
  .tag-2d{background:#9a3412;color:#fed7aa}
  .tag-3{background:#991b1b;color:#fca5a5}
  .tag-4{background:#4c0519;color:#fda4af}

  /* Transfer criteria */
  .criteria-met{background:#450a0a;border:1.5px solid #991b1b;border-radius:.75rem;padding:1rem;margin-top:.75rem}
  .criteria-met h4{font-size:.85rem;color:#fca5a5;margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem}
  .criteria-met ul{list-style:none;padding:0}
  .criteria-met li{font-size:.8rem;color:#fca5a5;padding:.25rem 0;display:flex;align-items:flex-start;gap:.5rem}
  .criteria-met li::before{content:'\26A0';flex-shrink:0}
  .criteria-none{background:#052e16;border:1.5px solid #14532d;border-radius:.75rem;padding:1rem;margin-top:.75rem}
  .criteria-none h4{font-size:.85rem;color:#86efac;margin-bottom:.25rem;display:flex;align-items:center;gap:.5rem}
  .criteria-none p{font-size:.8rem;color:#86efac}

  /* Severity indicator */
  .severity-indicator{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;margin:.75rem 0;transition:all .3s}
  .severity-indicator.minor{background:#052e16;border:1.5px solid #14532d}
  .severity-indicator.moderate{background:#451a03;border:1.5px solid #78350f}
  .severity-indicator.major{background:#450a0a;border:1.5px solid #991b1b}
  .severity-indicator .sev-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .severity-indicator.minor .sev-dot{background:#22c55e}
  .severity-indicator.moderate .sev-dot{background:#f59e0b}
  .severity-indicator.major .sev-dot{background:#ef4444;animation:dotBlink 1.5s infinite}
  @keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.4}}
  .severity-indicator .sev-text{font-size:.85rem;font-weight:600}
  .severity-indicator.minor .sev-text{color:#86efac}
  .severity-indicator.moderate .sev-text{color:#fcd34d}
  .severity-indicator.major .sev-text{color:#fca5a5}

  /* Management */
  .mgmt-section{margin-bottom:1rem}
  .mgmt-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:.5rem}

  /* Callouts */
  .info-callout{background:#172554;border:1px solid #1e40af;border-radius:.75rem;padding:.75rem 1rem;font-size:.8rem;color:#93c5fd;margin:.75rem 0;display:flex;align-items:flex-start;gap:.5rem;line-height:1.5}
  .info-callout .callout-icon{flex-shrink:0}
  .warning-callout{background:#451a03;border:1px solid #78350f;border-radius:.75rem;padding:.75rem 1rem;font-size:.8rem;color:#fde68a;margin:.75rem 0;display:flex;align-items:flex-start;gap:.5rem;line-height:1.5}
  .warning-callout .callout-icon{flex-shrink:0}
  .danger-callout{background:#450a0a;border:1px solid #991b1b;border-radius:.75rem;padding:.75rem 1rem;font-size:.8rem;color:#fca5a5;margin:.75rem 0;display:flex;align-items:flex-start;gap:.5rem;line-height:1.5}
  .danger-callout .callout-icon{flex-shrink:0}

  /* Nota para prontuario */
  .note-box{background:#0f172a;border-radius:.75rem;padding:1.25rem;text-align:left;margin-bottom:1.25rem}
  .note-box h3{font-size:.8rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
  .note-text{background:#020617;border:1px solid #1e293b;border-radius:.5rem;padding:1rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.72rem;color:#94a3b8;white-space:pre-wrap;line-height:1.6;max-height:400px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;margin-top:.75rem;padding:.7rem;border-radius:.5rem;border:1.5px solid #334155;background:#1e293b;color:#cbd5e1;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .25s ease;-webkit-tap-highlight-color:transparent}
  .copy-btn:hover{border-color:#f59e0b;background:#172040;color:#f1f5f9;transform:translateY(-1px)}
  .copy-btn.copied{border-color:#22c55e;background:#052e16;color:#86efac}

  /* Quick summary bar during data collection */
  .quick-summary{background:#0f172a;border:1px solid #334155;border-radius:.75rem;padding:.6rem 1rem;font-size:.75rem;color:#64748b;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .quick-summary .qs-item{display:flex;align-items:center;gap:.3rem}
  .quick-summary .qs-value{color:#cbd5e1;font-weight:600}
  .quick-summary .qs-sep{color:#334155}

  /* Time input */
  .time-input-group{display:flex;gap:.5rem;align-items:center;margin:.5rem 0}
  .time-input{background:#0f172a;border:1.5px solid #334155;border-radius:.5rem;padding:.5rem .6rem;color:#f1f5f9;font-size:.9rem;font-family:'SF Mono','Fira Code',monospace;width:80px;text-align:center;outline:none;transition:border-color .2s}
  .time-input:focus{border-color:#f59e0b}
  .time-sep{color:#64748b;font-weight:600;font-size:1.1rem}

  /* Pediatric toggle */
  .toggle-row{display:flex;align-items:center;gap:.75rem;padding:.5rem 0}
  .toggle-switch{position:relative;width:44px;height:24px;cursor:pointer;flex-shrink:0}
  .toggle-switch input{opacity:0;width:0;height:0}
  .toggle-slider{position:absolute;inset:0;background:#334155;border-radius:12px;transition:all .3s}
  .toggle-slider::before{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;background:#94a3b8;border-radius:50%;transition:all .3s}
  .toggle-switch input:checked+.toggle-slider{background:#f59e0b}
  .toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px);background:#1e293b}
  .toggle-label{font-size:.85rem;color:#94a3b8}

  /* Partial percentage */
  .partial-pct{display:flex;gap:.3rem;margin-top:.35rem;justify-content:center}
  .pct-btn{font-size:.6rem;padding:.2rem .4rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#64748b;cursor:pointer;transition:all .2s;font-family:'SF Mono','Fira Code',monospace;min-width:1.6rem;text-align:center;-webkit-tap-highlight-color:transparent}
  .pct-btn:hover{border-color:#f59e0b;color:#cbd5e1}
  .pct-btn.active{border-color:#f59e0b;background:#422006;color:#fde68a}

  /* Animated counter */
  @keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .count-anim{animation:countUp .3s ease}

  /* Baux score meter */
  .baux-bar{height:6px;background:#1e293b;border-radius:3px;margin:.5rem 0;overflow:hidden}
  .baux-fill{height:100%;border-radius:3px;transition:width .5s ease, background .5s ease}

  /* Circumferential tag */
  .circ-tag{font-size:.55rem;background:#991b1b;color:#fca5a5;padding:.1rem .35rem;border-radius:4px;margin-left:.3rem;vertical-align:middle;font-weight:600;letter-spacing:.03em}

  /* Comorbidity chips */
  .comorb-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
  .comorb-chip{font-size:.75rem;padding:.35rem .65rem;border-radius:9999px;border:1.5px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none}
  .comorb-chip:hover{border-color:#f59e0b;color:#cbd5e1}
  .comorb-chip.active{border-color:#f59e0b;background:#422006;color:#fde68a}

  /* Lund-Browder age hint */
  .lb-hint{font-size:.6rem;color:#475569;text-align:center;margin-top:.25rem}

  /* Disclaimer footer */
  .disclaimer{text-align:center;font-size:.6rem;color:#475569;padding:1rem .5rem 2rem;line-height:1.5;max-width:600px}
  .disclaimer a{color:#64748b;text-decoration:underline}

  /* Clear-all / reset-regions helper */
  .reset-link{font-size:.7rem;color:#64748b;cursor:pointer;text-decoration:underline;text-underline-offset:2px;transition:color .2s;margin-left:auto}

  /* Allergy warning chip */
  .allergy-chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.65rem;padding:.2rem .5rem;border-radius:9999px;border:1px solid #991b1b;background:#450a0a;color:#fca5a5;cursor:pointer;transition:all .2s;user-select:none}
  .allergy-chip.active{background:#991b1b;color:#fecaca;border-color:#dc2626}

  @media(max-width:500px){
    .container{padding:.75rem}.card{padding:1.25rem}
    header{padding:1rem .75rem}
    header h1{font-size:1.15rem}.back-link{left:.75rem;font-size:.8rem}
    .option-btn{padding:.75rem .9rem;font-size:.85rem}.check-btn{padding:.65rem .85rem;font-size:.8rem}
    .progress-labels{font-size:.45rem}
    .body-region{padding:.5rem .3rem;min-height:3.5rem}
    .body-region .region-icon{font-size:1rem}
    .body-region .region-name{font-size:.55rem}
    .body-region .region-pct{font-size:.7rem}
    .pct-btn{font-size:.5rem;padding:.15rem .3rem;min-width:1.3rem}
    .score-opt{font-size:.65rem;padding:.45rem .2rem}
    .quick-summary{font-size:.65rem;padding:.5rem .75rem}

    .depth-card .depth-desc{font-size:.7rem}
    .depth-card .depth-clinical{font-size:.65rem}
    .tbsa-total .number{font-size:2rem}
    .nav-btn{padding:.7rem;font-size:.85rem}
    .result-desc{font-size:.8rem}
    .conduta-item{font-size:.8rem}
    .summary-row{font-size:.8rem}
    .comorb-chip{font-size:.65rem;padding:.25rem .5rem}
  }

  @media(max-width:360px){
    .body-row{gap:.3rem}
    .body-region{padding:.4rem .2rem;border-radius:.5rem;min-height:3rem}
    .body-region .region-icon{font-size:.85rem;margin-bottom:.1rem}

    .pct-btn{font-size:.45rem;padding:.1rem .25rem;min-width:1.1rem}

  /* Print styles */
  @media print{
    body{background:#fff;color:#000}
    header{background:#fff;border-bottom:2px solid #000;position:static}
    header h1,header p,.back-link{color:#000}
    .card,.dark-box,.conduta-item,.summary-row,.parkland-row{background:#fff;border-color:#ccc;color:#000}
    .dark-box h3,.mgmt-section-title{color:#333}
    .summary-row .criteria,.conduta-icon,.pk-label{color:#555}
    .summary-row .value,.pk-value,.conduta-item span{color:#000}
    .info-callout,.warning-callout,.danger-callout{background:#f5f5f5;border-color:#999;color:#000}
    .collapse-body.hidden{max-height:none!important;opacity:1;margin-top:.75rem}

    .severity-indicator .sev-text{color:#000}

    .criteria-met h4,.criteria-met li{color:#c00}

<body>
<header>
  <a href="../queimaduras.html" class="back-link" aria-label="Voltar ao menu principal">&larr; Voltar</a>
  <h1>Avalia&ccedil;&atilde;o de Queimaduras</h1>
  <p>Classifica&ccedil;&atilde;o + SCQ + Parkland + Manejo Inicial</p>
</header>
<div class="container" id="app" role="main"></div>
<script>
// =============================================
// DATA
// =============================================
const STEP_LABELS=['Mecanismo','Profundidade','SCQ','Inala\u00E7\u00E3o','Paciente','Resultado'];
const TOTAL_STEPS=STEP_LABELS.length;

const MECHANISMS=[
  {id:'thermal',icon:'\uD83D\uDD25',label:'T\u00E9rmica',desc:'Chama, l\u00EDquidos quentes, contato com superf\u00EDcie quente, vapor'},
  {id:'scald',icon:'\u2615',label:'Escaldadura',desc:'L\u00EDquidos quentes (mais comum em crian\u00E7as). \u00C1gua, \u00F3leo, leite, caf\u00E9'},
  {id:'chemical',icon:'\u2697\uFE0F',label:'Qu\u00EDmica',desc:'\u00C1cidos, \u00E1lcalis, agentes org\u00E2nicos'},
  {id:'electrical',icon:'\u26A1',label:'El\u00E9trica',desc:'Baixa tens\u00E3o (<1000V), alta tens\u00E3o (\u22651000V), raio'},
  {id:'inhalation',icon:'\uD83D\uDCA8',label:'Inala\u00E7\u00E3o',desc:'Les\u00E3o t\u00E9rmica de via a\u00E9rea, inala\u00E7\u00E3o de fuma\u00E7a/toxinas'},
  {id:'radiation',icon:'\u2622\uFE0F',label:'Radia\u00E7\u00E3o',desc:'Solar, radioterapia, exposi\u00E7\u00E3o nuclear'},
  {id:'friction',icon:'\uD83C\uDFCD\uFE0F',label:'Fric\u00E7\u00E3o',desc:'Abras\u00E3o + queimadura t\u00E9rmica por atrito (ex: asfalto, esteira)'},
];

const CHEMICAL_AGENTS=[
  {id:'acid',label:'\u00C1cido',desc:'Necrose coagulativa \u2014 les\u00E3o mais delimitada'},
  {id:'alkali',label:'\u00C1lcali',desc:'Necrose liquefativa \u2014 penetra\u00E7\u00E3o mais profunda, PIOR progn\u00F3stico'},
  {id:'organic',label:'Org\u00E2nico/Outros',desc:'Fen\u00F3is, f\u00F3sforo, cimento, \u00E1cido fluor\u00EDdrico \u2014 manejo espec\u00EDfico'},
];

const DEPTHS=[
  {id:'1st',label:'1\u00BA Grau (Superficial)',tag:'tag-1',tagText:'1\u00BA',
   desc:'Epiderme apenas. Eritema, dor, sem bolhas. Ex: queimadura solar.',
   clinical:'Cura em 5\u20137 dias sem cicatriz. N\u00E3o entra no c\u00E1lculo da SCQ.'},
  {id:'2nd_s',label:'2\u00BA Grau Superficial',tag:'tag-2s',tagText:'2\u00BA Sup',
   desc:'Epiderme + derme papilar. Bolhas \u00EDntegras, base rosada, muito dolorosa, branqueia \u00E0 press\u00E3o.',
   clinical:'Cura em 10\u201314 dias. Pouca cicatriz se n\u00E3o infectar. Sensibilidade preservada.'},
  {id:'2nd_d',label:'2\u00BA Grau Profundo',tag:'tag-2d',tagText:'2\u00BA Prof',
   desc:'Epiderme + derme reticular. Bolhas rotas, base esbranqui\u00E7ada/vermelha, dor reduzida, n\u00E3o branqueia.',
   clinical:'Cura >21 dias, cicatriz significativa. Pode necessitar de enxerto. Risco de convers\u00E3o para 3\u00BA grau.'},
  {id:'3rd',label:'3\u00BA Grau (Espessura Total)',tag:'tag-3',tagText:'3\u00BA',
   desc:'Toda derme destru\u00EDda. Aspecto c\u00E9reo, couro, marrom/preto. Indolor (nervos destru\u00EDdos).',
   clinical:'Requer enxerto obrigatoriamente. N\u00E3o reepiteliza. Risco de retraturas cicatriciais.'},
  {id:'4th',label:'4\u00BA Grau',tag:'tag-4',tagText:'4\u00BA',
   desc:'Estende-se al\u00E9m da pele: f\u00E1scia, m\u00FAsculo, osso. Carboniza\u00E7\u00E3o.',
   clinical:'Requer desbridamento extenso ou amputa\u00E7\u00E3o. Alta mortalidade. Risco de rabdomi\u00F3lise.'},
];

// Lund-Browder age-adjusted percentages
const LUND_BROWDER={
  head:    [{age:0,pct:19},{age:1,pct:17},{age:5,pct:13},{age:10,pct:11},{age:15,pct:9},{age:999,pct:7}],
  leg_r:   [{age:0,pct:13},{age:1,pct:13},{age:5,pct:16},{age:10,pct:17},{age:15,pct:18},{age:999,pct:18}],
  leg_l:   [{age:0,pct:13},{age:1,pct:13},{age:5,pct:16},{age:10,pct:17},{age:15,pct:18},{age:999,pct:18}],
};

const BODY_REGIONS=[
  {id:'head',icon:'\uD83D\uDDE3\uFE0F',name:'Cabe\u00E7a e\npesco\u00E7o',pct:9,row:0,adultPct:9,childPct:18},
  {id:'ant_trunk',icon:'\uD83D\uDC55',name:'Tronco\nanterior',pct:18,row:1,adultPct:18,childPct:18},
  {id:'post_trunk',icon:'\uD83D\uDCE6',name:'Tronco\nposterior',pct:18,row:1,adultPct:18,childPct:18},
  {id:'arm_r',icon:'\uD83E\uDDBE',name:'MSD\n(direito)',pct:9,row:2,adultPct:9,childPct:9},
  {id:'arm_l',icon:'\uD83E\uDDBE',name:'MSE\n(esquerdo)',pct:9,row:2,adultPct:9,childPct:9},
  {id:'leg_r',icon:'\uD83E\uDDB5',name:'MID\n(direito)',pct:18,row:3,adultPct:18,childPct:14},
  {id:'leg_l',icon:'\uD83E\uDDB5',name:'MIE\n(esquerdo)',pct:18,row:3,adultPct:18,childPct:14},
  {id:'perineum',icon:'\u26AB',name:'Per\u00EDneo/\ngenit\u00E1lia',pct:1,row:4,adultPct:1,childPct:1},
];

const INHALATION_SIGNS=[
  {id:'singed',label:'Pelos nasais/faciais chamuscados'},
  {id:'soot',label:'Fuligem em orofaringe ou narina'},
  {id:'hoarse',label:'Rouquid\u00E3o / disfonia'},
  {id:'stridor',label:'Estridor'},
  {id:'carbonaceous',label:'Escarro carbon\u00E1ceo'},
  {id:'face_burn',label:'Queimadura de face / cervical'},
  {id:'dyspnea',label:'Dispneia / taquidispneia'},
  {id:'enclosed',label:'Inc\u00EAndio em ambiente fechado'},
  {id:'confusion',label:'Rebaixamento de consci\u00EAncia / confus\u00E3o'},
  {id:'cyanosis',label:'Cianose ou SpO\u2082 < 92%'},
];

const CRITICAL_AREAS=[
  {id:'hands',label:'M\u00E3os'},
  {id:'feet',label:'P\u00E9s'},
  {id:'joints',label:'Articula\u00E7\u00F5es maiores (cotovelo, joelho, ombro, tornozelo)'},
];

const COMORBIDITIES=[
  {id:'diabetes',label:'Diabetes',abbr:'DM'},
  {id:'cardiac',label:'Cardiopatia',abbr:'Cardio'},
  {id:'renal',label:'Doen\u00E7a renal',abbr:'DRC'},
  {id:'immuno',label:'Imunodepress\u00E3o',abbr:'Imuno'},
  {id:'hepatic',label:'Hepatopatia',abbr:'Hep'},
  {id:'pulm',label:'Pneumopatia',abbr:'Pulm'},
  {id:'coag',label:'Coagulopatia / Anticoagulante',abbr:'Coag'},
];

// =============================================
// STATE
// =============================================
let step=0;
let mechanism=null;
let elecVoltage=null;
let chemAgent=null;
let depth=null;
let activeRegions=new Set();
let regionPartial={};
let circumferential=false;
let criticalAreas=new Set();
let inhalationSigns=new Set();
let patWeight='';
let patAge='';
let patSex=null;
let burnHour='';
let burnMinute='';
let usePediatric=false;
let comorbidities=new Set();
let sulfaAllergy=false;
let sections={summary:true, tbsa:true, parkland:true, inhalation:false, transfer:true, management:true, note:true};
const evalStartTime=new Date();

const app=document.getElementById('app');

// =============================================
// HELPERS
// =============================================
function getLundBrowderPct(regionId, age) {
  const table = LUND_BROWDER[regionId];
  if (!table) return null;
  if (isNaN(age) || age < 0) return null;
  for (let i = 0; i < table.length; i++) {
    if (age <= table[i].age) return table[i].pct;
  }
  return table[table.length - 1].pct;
}

function getRegionPct(r){
  const age=parseInt(patAge);
  if(usePediatric && !isNaN(age) && age<=14){
    const lb = getLundBrowderPct(r.id, age);
    if(lb !== null) return lb;
    return r.childPct;
  }
  return r.adultPct;
}

function getTBSA(){
  let total=0;
  for(const r of BODY_REGIONS){
    if(activeRegions.has(r.id)){
      const frac=regionPartial[r.id]||1;
      total+=getRegionPct(r)*frac;
    }
  }
  return Math.round(total*100)/100;
}

function getTBSADisplay(){
  const v=getTBSA();
  return v%1===0?v+'%':v.toFixed(1)+'%';
}

function getParkland(){
  const w=parseFloat(patWeight);
  const tbsa=getTBSA();
  if(isNaN(w)||w<=0||tbsa<=0) return null;
  const total=4*w*tbsa;
  return {total:Math.round(total), first8h:Math.round(total/2), next16h:Math.round(total/2), rateFirst:Math.round((total/2)/8), rateSecond:Math.round((total/2)/16)};
}

function getBurnTime(){
  const h=parseInt(burnHour);
  const m=parseInt(burnMinute);
  if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59) return null;
  const now=new Date();
  const burnDate=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);
  if(burnDate>now) burnDate.setDate(burnDate.getDate()-1);
  return burnDate;
}

function getElapsedHours(){
  const bt=getBurnTime();
  if(!bt) return null;
  const elapsed=(new Date()-bt)/(1000*60*60);
  return elapsed>0?elapsed:null;
}

function getDepthLabel(id){
  const d=DEPTHS.find(x=>x.id===id);
  return d?d.label:'';
}

function getMechanismLabel(id){
  const m=MECHANISMS.find(x=>x.id===id);
  return m?m.label:'';
}

function getBauxScore(){
  const age=parseInt(patAge);
  const tbsa=getTBSA();
  const inhBonus=inhalationSigns.size>=2?17:0;
  if(isNaN(age)) return null;
  return age+tbsa+inhBonus;
}

function getSeverity(){
  const tbsa=getTBSA();
  const age=parseInt(patAge);
  const hasInhalation=inhalationSigns.size>=2;
  const isElectrical=mechanism==='electrical';
  const isChemical=mechanism==='chemical';
  const isDeep=depth==='3rd'||depth==='4th';
  const is2dDeep=depth==='2nd_d';

  // Grande queimado (criterios ABA)
  if(depth==='4th') return 'major';
  if(tbsa>20) return 'major';
  if(isDeep && tbsa>5) return 'major';
  if(is2dDeep && tbsa>10) return 'major';
  if(isElectrical && elecVoltage==='high') return 'major';
  if(hasInhalation) return 'major';
  if(!isNaN(age) && (age<2||age>60) && tbsa>10) return 'major';
  if(activeRegions.has('perineum') && (isDeep||is2dDeep)) return 'major';
  if(circumferential && (isDeep||is2dDeep)) return 'major';
  if(criticalAreas.has('hands') && isDeep && tbsa>2) return 'major';
  if(criticalAreas.has('feet') && isDeep && tbsa>2) return 'major';
  if(comorbidities.size>=2 && tbsa>10) return 'major';
  // Friction with deep injury can be major
  if(mechanism==='friction' && isDeep && tbsa>5) return 'major';

  // Medio queimado
  if(tbsa>10) return 'moderate';
  if(isDeep && tbsa>=2) return 'moderate';
  if(is2dDeep && tbsa>5) return 'moderate';
  if(isElectrical) return 'moderate';
  if(isChemical && tbsa>2) return 'moderate';
  if(!isNaN(age) && (age<10||age>50) && tbsa>5) return 'moderate';
  if(activeRegions.has('head') && tbsa>5) return 'moderate';
  if(inhalationSigns.size===1) return 'moderate';
  if(circumferential) return 'moderate';
  if(criticalAreas.size>0 && (is2dDeep||isDeep)) return 'moderate';
  if(comorbidities.size>=1 && tbsa>5) return 'moderate';

  return 'minor';
}

function getSeverityLabel(s){
  return s==='major'?'Grande Queimado':s==='moderate'?'M\u00E9dio Queimado':'Pequeno Queimado';
}

function getSeverityColor(s){
  return s==='major'?'#fca5a5':s==='moderate'?'#fcd34d':'#86efac';
}

function getTransferCriteria(){
  const criteria=[];
  const tbsa=getTBSA();
  const age=parseInt(patAge);

  if(depth==='2nd_s' && tbsa>10) criteria.push('2\u00BA grau superficial >10% SCQ');
  if(depth==='2nd_d' && tbsa>5) criteria.push('2\u00BA grau profundo >5% SCQ');
  if(depth==='3rd'||depth==='4th') criteria.push('Queimadura de 3\u00BA/4\u00BA grau (qualquer extens\u00E3o)');
  if(mechanism==='electrical') criteria.push('Queimadura el\u00E9trica (incluindo raio)');
  if(mechanism==='chemical') criteria.push('Queimadura qu\u00EDmica significativa');
  if(inhalationSigns.size>=2) criteria.push('Les\u00E3o inalat\u00F3ria associada');

  if(activeRegions.has('head')) criteria.push('Queimadura de face/pesco\u00E7o (risco de via a\u00E9rea e est\u00E9tico)');
  if(activeRegions.has('perineum')) criteria.push('Queimadura de per\u00EDneo/genit\u00E1lia');
  if(criticalAreas.has('hands')) criteria.push('Queimadura de m\u00E3os (risco funcional)');
  if(criticalAreas.has('feet')) criteria.push('Queimadura de p\u00E9s (risco funcional)');
  if(criticalAreas.has('joints')) criteria.push('Queimadura sobre articula\u00E7\u00F5es maiores');

  if(!isNaN(age) && age<2) criteria.push('Idade < 2 anos (alto risco)');
  else if(!isNaN(age) && age<10 && tbsa>5) criteria.push('Crian\u00E7a < 10 anos com queimadura >5% SCQ');
  else if(!isNaN(age) && age>60 && tbsa>5) criteria.push('Idoso > 60 anos com queimadura >5% SCQ');

  const anyDeep=depth==='3rd'||depth==='4th'||depth==='2nd_d';
  if(circumferential) criteria.push('Queimadura circunferencial \u2192 risco de s\u00EDndrome compartimental / restri\u00E7\u00E3o ventilat\u00F3ria');
  else if(anyDeep && tbsa>=5) criteria.push('Avaliar queimadura circunferencial \u2192 escarotomia');

  if(comorbidities.size>0) criteria.push('Comorbidade(s) significativa(s): '+COMORBIDITIES.filter(c=>comorbidities.has(c.id)).map(c=>c.label).join(', '));

  return [...new Set(criteria)];
}

function needsIV(){
  const tbsa=getTBSA();
  const age=parseInt(patAge);
  if(!isNaN(age) && age<=14) return tbsa>=10;
  return tbsa>=15;
}

function hasComorbidity(id){ return comorbidities.has(id); }

function clamp(val,min,max){return Math.min(Math.max(val,min),max)}

function validateAge(v){
  const n=parseInt(v);
  if(v===''||isNaN(n)) return {valid:v==='',msg:''};
  if(n<0) return {valid:false,msg:'Idade n\u00E3o pode ser negativa'};
  if(n>120) return {valid:false,msg:'Idade m\u00E1xima: 120 anos'};
  return {valid:true,msg:''};
}

function validateWeight(v){
  const n=parseFloat(v);
  if(v===''||isNaN(n)) return {valid:v==='',msg:''};
  if(n<=0) return {valid:false,msg:'Peso deve ser maior que zero'};
  if(n>350) return {valid:false,msg:'Verifique o peso informado (>350 kg)'};
  return {valid:true,msg:''};
}

// =============================================
// PROGRESS
// =============================================
function progHTML(idx,allDone){
  const pct=allDone?100:Math.round((idx/TOTAL_STEPS)*100);
  let h='<div class="progress-bar" role="progressbar" aria-valuenow="'+(allDone?TOTAL_STEPS:idx)+'" aria-valuemin="0" aria-valuemax="'+TOTAL_STEPS+'">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done':i===idx?'active':'';h+=`<div class="progress-step ${c}"></div>`}
  h+='</div><div class="progress-labels">';
  for(let i=0;i<TOTAL_STEPS;i++){const c=allDone||i<idx?'done-label':i===idx?'active-label':'';h+=`<span class="${c}">${STEP_LABELS[i]}</span>`}
  h+='</div>';
  if(!allDone) h+=`<div class="progress-pct">${pct}% completo</div>`;
  h+='<div class="flow-connector"><div class="arrow"></div></div>';
  return h;
}

function quickSummaryHTML(){
  const items=[];
  if(mechanism) items.push('<span class="qs-item"><span class="qs-value">'+getMechanismLabel(mechanism)+'</span></span>');
  if(depth) items.push('<span class="qs-item"><span class="qs-value">'+getDepthLabel(depth).split('(')[0].trim()+'</span></span>');
  if(activeRegions.size>0) items.push('<span class="qs-item">SCQ <span class="qs-value">'+getTBSADisplay()+'</span></span>');
  if(circumferential) items.push('<span class="qs-item"><span class="qs-value" style="color:#fca5a5">CIRC</span></span>');
  if(inhalationSigns.size>0) items.push('<span class="qs-item">Inala\u00E7\u00E3o <span class="qs-value">'+inhalationSigns.size+' sinal(is)</span></span>');
  if(items.length===0) return '';
  return '<div class="quick-summary" aria-label="Resumo dos dados coletados">'+items.join('<span class="qs-sep">\u00B7</span>')+'</div>';
}

// =============================================
// RENDER ROUTER
// =============================================
function render(){
  if(step===0) renderMechanism();
  else if(step===1) renderDepth();
  else if(step===2) renderTBSA();
  else if(step===3) renderInhalation();
  else if(step===4) renderPatient();
  else renderResult();
  window.scrollTo({top:0,behavior:'smooth'});
}

// =============================================
// STEP 0: MECHANISM
// =============================================
function renderMechanism(){
  let h=progHTML(0,false);
  h+='<div class="card">';
  h+='<div class="step-badge">Etapa 1 de '+TOTAL_STEPS+'</div>';
  h+='<h2>Mecanismo da Queimadura</h2>';
  h+='<p class="subtitle">Selecione o mecanismo principal da les\u00E3o</p>';
  h+='<div class="options" role="radiogroup" aria-label="Mecanismo da queimadura">';
  for(const m of MECHANISMS){
    h+=`<button class="option-btn ${mechanism===m.id?'selected':''}" onclick="setMechanism('${m.id}')" role="radio" aria-checked="${mechanism===m.id}" aria-label="${m.label}: ${m.desc}">`;
    h+=`<span class="icon">${m.icon}</span>`;
    h+=`<span class="label"><strong>${m.label}</strong><br><span style="font-size:.75rem;color:#94a3b8">${m.desc}</span></span>`;
    h+=`<span class="selected-check">\u2713</span>`;
    h+='</button>';
  }

  // Electrical voltage sub-option
  if(mechanism==='electrical'){
    h+='<div class="option-group-label" style="margin-top:.75rem">Tens\u00E3o el\u00E9trica</div>';
    h+='<div style="display:flex;gap:.5rem">';
    h+=`<button class="score-opt ${elecVoltage==='low'?'picked':''}" onclick="setElecV('low')" style="flex:1" aria-label="Baixa tens\u00E3o, menor que 1000 volts">Baixa tens\u00E3o<br><span style="font-size:.6rem;color:#64748b">&lt; 1000V</span></button>`;
    h+=`<button class="score-opt ${elecVoltage==='high'?'picked':''}" onclick="setElecV('high')" style="flex:1" aria-label="Alta tens\u00E3o, 1000 volts ou mais, ou raio">Alta tens\u00E3o<br><span style="font-size:.6rem;color:#64748b">&ge; 1000V / Raio</span></button>`;
    h+='</div>';
    if(elecVoltage==='high'){
      h+='<div class="danger-callout"><span class="callout-icon">\u26A1</span><span>Queimadura el\u00E9trica de alta tens\u00E3o causa les\u00E3o profunda desproporcional \u00E0 superf\u00EDcie vis\u00EDvel. Les\u00E3o muscular, arritmias e rabdomi\u00F3lise s\u00E3o comuns. A SCQ subestima a gravidade real. <strong>Ponto de entrada e sa\u00EDda:</strong> examinar cuidadosamente.</span></div>';
    }
    if(elecVoltage==='low'){
      h+='<div class="info-callout"><span class="callout-icon">\u2139\uFE0F</span><span>Baixa tens\u00E3o (<1000V): les\u00E3o geralmente localizada ao ponto de contato. Ainda requer ECG e monitoriza\u00E7\u00E3o card\u00EDaca por 24h se houver perda de consci\u00EAncia, ECG anormal ou passagem transtor\u00E1cica de corrente.</span></div>';
    }
  }

  // Chemical agent sub-option
  if(mechanism==='chemical'){
    h+='<div class="option-group-label" style="margin-top:.75rem">Tipo de agente qu\u00EDmico</div>';
    h+='<div class="options">';
    for(const a of CHEMICAL_AGENTS){
      h+=`<button class="option-btn ${chemAgent===a.id?'selected':''}" onclick="setChemAgent('${a.id}')" style="padding:.65rem .9rem" aria-label="${a.label}: ${a.desc}">`;
      h+=`<span class="label"><strong>${a.label}</strong><br><span style="font-size:.7rem;color:#94a3b8">${a.desc}</span></span>`;
      h+=`<span class="selected-check">\u2713</span>`;
      h+='</button>';
    }
    h+='</div>';
    if(chemAgent==='alkali'){
      h+='<div class="danger-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>\u00C1lcalis penetram mais profundamente (necrose liquefativa). Irrigar por no m\u00EDnimo 30\u201360 minutos. N\u00C3O neutralizar. Manter irriga\u00E7\u00E3o at\u00E9 pH da pele normalizar (pH <8,0). Remover part\u00EDculas s\u00F3lidas antes de irrigar.</span></div>';
    }
    if(chemAgent==='acid'){
      h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>\u00C1cidos causam necrose coagulativa. Irrigar copiosamente por no m\u00EDnimo 20\u201330 minutos. Verificar pH da pele. \u00C1cido fluor\u00EDdrico: tratar como agente org\u00E2nico/espec\u00EDfico.</span></div>';
    }
    if(chemAgent==='organic'){
      h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>Agentes org\u00E2nicos podem ter toxicidade sist\u00EAmica (fen\u00F3is, \u00E1cido fluor\u00EDdrico). Consultar protocolo espec\u00EDfico do agente. \u00C1cido fluor\u00EDdrico: gluconato de c\u00E1lcio t\u00F3pico/infiltrativo + monitorar c\u00E1lcio s\u00E9rico (risco de hipocalcemia fatal). F\u00F3sforo branco: remover part\u00EDculas com pir\u00F3scopo, manter \u00FAmido.</span></div>';
    }
  }

  // Friction-specific note
  if(mechanism==='friction'){
    h+='<div class="info-callout"><span class="callout-icon">\uD83C\uDFCD\uFE0F</span><span>Queimadura por fric\u00E7\u00E3o combina les\u00E3o t\u00E9rmica + abras\u00E3o mec\u00E2nica. Avalie contamina\u00E7\u00E3o da ferida (asfalto, terra). Desbridamento cuidadoso e profilaxia tet\u00E2nica s\u00E3o fundamentais. Risco de tatuagem traum\u00E1tica se corpos estranhos n\u00E3o removidos.</span></div>';
  }

  h+='</div><div class="nav-row">';
  const canNext=mechanism!==null
    && (mechanism!=='electrical'||elecVoltage!==null)
    && (mechanism!=='chemical'||chemAgent!==null);
  h+=`<button class="nav-btn primary" ${canNext?'':'disabled'} onclick="next()" aria-label="Ir para pr\u00F3xima etapa">Pr\u00F3ximo \u2192</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP 1: DEPTH
// =============================================

  // Scald + mechanism-specific depth hints
  if(mechanism==='scald'){
    h+='<div class="info-callout"><span class="callout-icon">\u2615</span><span>Escaldadura em crian\u00E7as frequentemente causa 2\u00BA grau superficial, mas \u00F3leos quentes podem causar les\u00F5es mais profundas. Avaliar tempo de contato e temperatura do l\u00EDquido.</span></div>';

  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP 2: TBSA (RULE OF 9s / LUND-BROWDER)
// =============================================
function renderTBSA(){
  const tbsa=getTBSA();
  let h=progHTML(2,false);
  h+=quickSummaryHTML();
  h+='<div class="card">';
  h+='<div class="step-badge">Etapa 3 de '+TOTAL_STEPS+'</div>';
  h+='<h2>Superf\u00EDcie Corporal Queimada (SCQ)</h2>';

  const age=parseInt(patAge);
  const isChild=usePediatric && !isNaN(age) && age<=14;
  h+='<p class="subtitle">'+(isChild?'Lund-Browder simplificado (ajustado para idade)':'Regra dos 9 de Wallace')+' \u2014 Selecione as regi\u00F5es afetadas</p>';

  if(depth==='1st'){
    h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>Queimaduras de 1\u00BA grau <strong>n\u00E3o entram</strong> no c\u00E1lculo da SCQ para ressuscita\u00E7\u00E3o vol\u00EAmica. Mesmo assim, registre a extens\u00E3o para documenta\u00E7\u00E3o.</span></div>';
  } else {
    h+='<div class="info-callout"><span class="callout-icon">\u2139\uFE0F</span><span>Toque uma regi\u00E3o para selecionar e use os bot\u00F5es de fra\u00E7\u00E3o para ajustar a \u00E1rea parcial. <strong>Dica:</strong> A palma da m\u00E3o do paciente (incluindo dedos) equivale a ~1% da SCQ \u2014 \u00FAtil para queimaduras irregulares/dispersas.</span></div>';
  }

  // Pediatric notice
  if(isChild){
    h+='<div class="warning-callout"><span class="callout-icon">\uD83D\uDC76</span><span>Paciente pedi\u00E1trico ('+patAge+' anos). Valores ajustados por Lund-Browder: Cabe\u00E7a e MMII variam com a idade.</span></div>';
  }

  // Body map header with reset link
  h+='<div style="display:flex;align-items:center;margin-bottom:.25rem">';
  h+='<span style="font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em">Mapa corporal</span>';
  if(activeRegions.size>0){
    h+='<span class="reset-link" onclick="resetAllRegions()" aria-label="Limpar todas as regi\u00F5es selecionadas">Limpar tudo</span>';
  }
  h+='</div>';

  // Body map - organized by rows
  const rows=[[],[],[],[],[]];
  for(const r of BODY_REGIONS) rows[r.row].push(r);

  h+='<div class="body-map">';
  for(const row of rows){
    if(row.length===0) continue;
    h+='<div class="body-row">';
    for(const r of row){
      const isActive=activeRegions.has(r.id);
      const frac=regionPartial[r.id]||1;
      const pct=getRegionPct(r);
      const displayPct=isActive?(pct*frac)%1===0?pct*frac:(pct*frac).toFixed(1):pct;
      h+=`<div class="body-region ${isActive?'active':''}" onclick="toggleRegion('${r.id}')" role="checkbox" aria-checked="${isActive}" aria-label="${r.name.replace('\n',' ')} ${pct}%">`;
      h+=`<span class="region-icon">${r.icon}</span>`;
      h+=`<span class="region-name">${r.name}</span>`;
      h+=`<span class="region-pct">${displayPct}%</span>`;
      if(isActive){
        h+='<div class="partial-pct" onclick="event.stopPropagation()">';
        h+=`<button class="pct-btn ${frac===0.25?'active':''}" onclick="event.stopPropagation();setFrac('${r.id}',0.25)" aria-label="25% da regi\u00E3o">\u00BC</button>`;
        h+=`<button class="pct-btn ${frac===0.5?'active':''}" onclick="event.stopPropagation();setFrac('${r.id}',0.5)" aria-label="50% da regi\u00E3o">\u00BD</button>`;
        h+=`<button class="pct-btn ${frac===0.75?'active':''}" onclick="event.stopPropagation();setFrac('${r.id}',0.75)" aria-label="75% da regi\u00E3o">\u00BE</button>`;
        h+=`<button class="pct-btn ${frac===1?'active':''}" onclick="event.stopPropagation();setFrac('${r.id}',1)" aria-label="100% da regi\u00E3o">1</button>`;
        h+='</div>';
      }
      h+='</div>';
    }
    h+='</div>';
  }
  h+='</div>';

  // Total
  const hasVal=tbsa>0;
  h+=`<div class="tbsa-total ${hasVal?'has-value':''}">`;
  h+=`<div class="number count-anim">${getTBSADisplay()}</div>`;
  h+='<div class="label">Superf\u00EDcie corporal queimada total</div>';
  if(hasVal){
    const tempSev=getSeverityPreview();
    h+=`<div class="severity-hint" style="color:${getSeverityColor(tempSev)}">${getSeverityLabel(tempSev)} (preliminar)</div>`;
  }
  h+='</div>';

  // Critical areas (don't add to SCQ but affect transfer criteria)
  if(depth!=='1st' && activeRegions.size>0){
    h+='<div style="margin-top:.75rem">';
    h+='<div class="option-group-label">\u00C1reas cr\u00EDticas envolvidas? (n\u00E3o alteram a SCQ)</div>';
    h+='<div style="display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem">';
    for(const ca of CRITICAL_AREAS){
      const ck=criticalAreas.has(ca.id);
      h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleCritArea('${ca.id}')" style="padding:.6rem .85rem" aria-pressed="${ck}">`;
      h+=`<span class="check-box">${ck?'\u2713':''}</span>`;
      h+=`<span class="label" style="font-size:.85rem">${ca.label}</span>`;
      h+='</button>';
    }
    h+='</div>';

    // Circumferential burn - now shown for 2nd_s as well when relevant
    const showCirc=depth==='3rd'||depth==='4th'||depth==='2nd_d'||depth==='2nd_s';
    if(showCirc){
      h+='<div style="margin-top:.75rem">';
      h+=`<button class="check-btn ${circumferential?'checked':''}" onclick="toggleCirc()" style="padding:.6rem .85rem" aria-pressed="${circumferential}">`;
      h+=`<span class="check-box">${circumferential?'\u2713':''}</span>`;
      h+=`<span class="label" style="font-size:.85rem">Queimadura circunferencial (membro ou t\u00F3rax)</span>`;
      h+='</button>';
      if(circumferential){
        const deepCirc=depth==='3rd'||depth==='4th'||depth==='2nd_d';
        if(deepCirc){
          h+='<div class="danger-callout"><span class="callout-icon">\uD83D\uDEA8</span><span><strong>Queimadura circunferencial profunda:</strong> ALTO risco de s\u00EDndrome compartimental em extremidades e/ou restri\u00E7\u00E3o ventilat\u00F3ria se t\u00F3rax. Avaliar escarotomia de emerg\u00EAncia. Monitorar pulsos distais com Doppler. <strong>Elevar extremidades acima do n\u00EDvel do cora\u00E7\u00E3o.</strong></span></div>';
        } else {
          h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Queimadura circunferencial superficial:</strong> Vigil\u00E2ncia neurovascular. Menor risco de s\u00EDndrome compartimental, mas monitorar evolu\u00E7\u00E3o (convers\u00E3o pode ocorrer em 24\u201372h). Elevar extremidades.</span></div>';
        }
      }
      h+='</div>';
    }
    h+='</div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()" aria-label="Voltar para etapa anterior">\u2190 Voltar</button>';
  h+=`<button class="nav-btn primary" onclick="next()" aria-label="Ir para pr\u00F3xima etapa">Pr\u00F3ximo \u2192</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

function getSeverityPreview(){
  const tbsa=getTBSA();
  const isDeep=depth==='3rd'||depth==='4th';
  const is2dDeep=depth==='2nd_d';
  if(depth==='4th') return 'major';
  if(tbsa>20) return 'major';
  if(isDeep && tbsa>5) return 'major';
  if(is2dDeep && tbsa>10) return 'major';
  if(mechanism==='electrical' && elecVoltage==='high') return 'major';
  if(circumferential && (isDeep||is2dDeep)) return 'major';
  if(tbsa>10) return 'moderate';
  if(isDeep && tbsa>=2) return 'moderate';
  if(is2dDeep && tbsa>5) return 'moderate';
  if(mechanism==='electrical') return 'moderate';
  if(circumferential) return 'moderate';
  return 'minor';
}

// =============================================
// STEP 3: INHALATION
// =============================================
function renderInhalation(){
  let h=progHTML(3,false);
  h+=quickSummaryHTML();
  h+='<div class="card">';
  h+='<div class="step-badge">Etapa 4 de '+TOTAL_STEPS+'</div>';
  h+='<h2>Les\u00E3o Inalat\u00F3ria</h2>';
  h+='<p class="subtitle">Marque os sinais presentes na avalia\u00E7\u00E3o</p>';

  h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>Les\u00E3o inalat\u00F3ria aumenta mortalidade em at\u00E9 20%. Considere intuba\u00E7\u00E3o precoce se \u22652 sinais presentes \u2014 edema progressivo pode impossibilitar IOT tardiamente. <strong>Sempre reavaliar via a\u00E9rea a cada 2h nas primeiras 12h.</strong></span></div>';

  h+='<div class="options">';
  for(const s of INHALATION_SIGNS){
    const ck=inhalationSigns.has(s.id);
    h+=`<button class="check-btn ${ck?'checked':''}" onclick="toggleInhSign('${s.id}')" aria-pressed="${ck}" aria-label="${s.label}">`;
    h+=`<span class="check-box">${ck?'\u2713':''}</span>`;
    h+=`<span class="label">${s.label}</span>`;
    h+='</button>';
  }
  h+='</div>';

  // Dynamic feedback based on selection count
  if(inhalationSigns.size>=3){
    h+='<div class="danger-callout"><span class="callout-icon">\uD83D\uDEA8</span><span><strong>ALTA SUSPEITA de les\u00E3o inalat\u00F3ria ('+inhalationSigns.size+' sinais).</strong><br>\u2022 IOT precoce OBRIGAT\u00D3RIA \u2014 usar tubo \u22657.5 se poss\u00EDvel<br>\u2022 O\u2082 umidificado a 100%<br>\u2022 Broncoscopia diagn\u00F3stica<br>\u2022 Aumentar Parkland em 30\u201350%<br>\u2022 Interna\u00E7\u00E3o em CTQ (Centro de Tratamento de Queimados)</span></div>';
  } else if(inhalationSigns.size===2){
    h+='<div class="danger-callout"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Suspeita de les\u00E3o inalat\u00F3ria.</strong> Considerar IOT precoce, O\u2082 a 100%, broncoscopia e centro de queimados.</span></div>';
  } else if(inhalationSigns.size===1){
    h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>1 sinal presente \u2014 manter vigil\u00E2ncia rigorosa. Reavaliar em 2\u20134h. Baixo limiar para IOT.</span></div>';
  }

  // CO/cyanide hint if enclosed fire
  if(inhalationSigns.has('enclosed') && inhalationSigns.size>=1){
    h+='<div class="info-callout"><span class="callout-icon">\uD83E\uDDEA</span><span><strong>Inc\u00EAndio em ambiente fechado:</strong> Dosar carboxi-hemoglobina (COHb) e lactato. Se COHb >15% ou lactato >8: considerar O\u2082 hiperb\u00E1rico. Se materiais sint\u00E9ticos envolvidos (pl\u00E1sticos, espuma): suspeitar de intoxica\u00E7\u00E3o por cianeto.</span></div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()" aria-label="Voltar para etapa anterior">\u2190 Voltar</button>';
  h+=`<button class="nav-btn primary" onclick="next()" aria-label="Ir para pr\u00F3xima etapa">Pr\u00F3ximo \u2192</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP 4: PATIENT DATA
// =============================================

  // Sex

  // Age

  h+='<div class="input-group" style="margin-top:1rem">';

  h+='<span class="input-unit">anos</span>';
  h+='</div>';
  if(ageValid.msg) h+=`<div class="input-error-msg">${ageValid.msg}</div>`;
  h+='</div>';

  // Weight
  const wValid=validateWeight(patWeight);
  h+='<div class="input-group">';
  h+='<div class="option-group-label">Peso (kg)</div>';
  h+='<div class="input-row" style="margin-top:.4rem">';
  h+=`<input type="number" class="input-field ${!wValid.valid&&patWeight!==''?'input-error':''}" id="weightInput" value="${patWeight}" placeholder="Ex: 70" min="1" max="350" step="0.1" inputmode="decimal" oninput="setPatWeight(this.value)">`;
  h+='<span class="input-unit">kg</span>';
  h+='</div>';
  if(wValid.msg) h+=`<div class="input-error-msg">${wValid.msg}</div>`;
  h+='</div>';

  // Time of burn
  h+='<div class="input-group">';
  h+='<div class="option-group-label">Hora da queimadura (opcional)</div>';
  h+='<p style="font-size:.7rem;color:#64748b;margin-top:.2rem;margin-bottom:.4rem">Para calcular o tempo j\u00E1 decorrido e ajustar o volume restante nas primeiras 8h</p>';
  h+='<div class="time-input-group">';
  h+=`<input type="number" class="time-input" id="burnHourInput" value="${burnHour}" placeholder="HH" min="0" max="23" inputmode="numeric" oninput="setBurnHour(this.value)">`;
  h+='<span class="time-sep">:</span>';
  h+=`<input type="number" class="time-input" id="burnMinInput" value="${burnMinute}" placeholder="MM" min="0" max="59" inputmode="numeric" oninput="setBurnMin(this.value)">`;
  h+='</div>';

  // Show elapsed time feedback if valid
  const elapsed=getElapsedHours();
  if(elapsed!==null){
    if(elapsed>48){
      h+='<div class="input-hint" style="color:#fca5a5">Tempo decorrido: '+elapsed.toFixed(1)+'h. Verifique se a hora est\u00E1 correta (>48h).</div>';
    } else {
      h+='<div class="input-hint" style="color:#86efac">Tempo decorrido: '+elapsed.toFixed(1)+'h</div>';
    }
  }
  h+='</div>';

  // Comorbidities
  h+='<div class="input-group">';
  h+='<div class="option-group-label">Comorbidades relevantes (opcional)</div>';
  h+='<p style="font-size:.7rem;color:#64748b;margin-top:.2rem;margin-bottom:.4rem">Comorbidades que influenciam o manejo e progn\u00F3stico</p>';
  h+='<div class="comorb-chips">';
  for(const c of COMORBIDITIES){
    h+=`<span class="comorb-chip ${comorbidities.has(c.id)?'active':''}" onclick="toggleComorb('${c.id}')" role="checkbox" aria-checked="${comorbidities.has(c.id)}" aria-label="${c.label}">${c.label}</span>`;
  }
  h+='</div>';
  h+='</div>';

  // Sulfa allergy (affects wound dressing choice)
  h+='<div class="input-group">';
  h+='<div class="option-group-label">Alergias relevantes</div>';
  h+=`<span class="allergy-chip ${sulfaAllergy?'active':''}" onclick="toggleSulfaAllergy()" role="checkbox" aria-checked="${sulfaAllergy}" aria-label="Alergia a sulfonamidas">Alergia a Sulfonamidas ${sulfaAllergy?'\u2713':''}</span>`;
  if(sulfaAllergy){
    h+='<div class="warning-callout" style="margin-top:.5rem"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Alergia a sulfa:</strong> Sulfadiazina de prata \u00E9 <strong>CONTRAINDICADA</strong>. Usar alternativas: curativo de prata nanocristalina (Acticoat), curativo de alginato com prata, ou mupirocina t\u00F3pica.</span></div>';
  }
  h+='</div>';

  h+='</div>';

  // Age-specific warnings
  const age=parseInt(patAge);
  if(!isNaN(age) && age<2){
    h+='<div class="danger-callout"><span class="callout-icon">\uD83D\uDC76</span><span><strong>Lactente/neonato (&lt;2 anos):</strong> Maior rela\u00E7\u00E3o superf\u00EDcie/volume, maior risco de hipotermia e desidrata\u00E7\u00E3o. Lund-Browder para SCQ mais preciso. Limiar de interna\u00E7\u00E3o mais baixo. Risco de hipoglicemia. Acesso intra\u00F3sseo se IV dif\u00EDcil.</span></div>';
  } else if(!isNaN(age) && age<=14){
    h+='<div class="info-callout"><span class="callout-icon">\uD83D\uDC76</span><span><strong>Paciente pedi\u00E1trico:</strong> Valores da SCQ ajustados (Lund-Browder). Ressuscita\u00E7\u00E3o IV indicada se SCQ \u226510%. Alvo de d\u00E9bito urin\u00E1rio: 1\u20132 mL/kg/h. Acrescentar soro de manuten\u00E7\u00E3o com glicose (Holliday-Segar). Monitorar glicemia capilar.</span></div>';
  } else if(!isNaN(age) && age>60){
    h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Idoso (&gt;60 anos):</strong> Maior mortalidade. Pele mais fina, queimaduras mais profundas. Cuidado com sobrecarga h\u00EDdrica (avaliar fun\u00E7\u00E3o card\u00EDaca). Comorbidades podem alterar a conduta. Investigar maus-tratos se padr\u00E3o suspeito.</span></div>';
  }

  // Comorbidity-specific warnings
  if(comorbidities.has('diabetes')){
    h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Diabetes:</strong> Risco aumentado de infec\u00E7\u00E3o e cicatriza\u00E7\u00E3o lenta. Monitorar glicemia capilar rigorosamente. Insulina conforme protocolo. Avaliar perfus\u00E3o distal com aten\u00E7\u00E3o redobrada.</span></div>';
  }
  if(comorbidities.has('cardiac')){
    h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Cardiopatia:</strong> Cuidado com sobrecarga vol\u00EAmica na ressuscita\u00E7\u00E3o. Monitoriza\u00E7\u00E3o hemodin\u00E2mica invasiva pode ser necess\u00E1ria. Ajustar Parkland pelo d\u00E9bito urin\u00E1rio com aten\u00E7\u00E3o a sinais de congest\u00E3o.</span></div>';
  }
  if(comorbidities.has('renal')){
    h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Doen\u00E7a renal:</strong> D\u00E9bito urin\u00E1rio pode n\u00E3o ser par\u00E2metro confi\u00E1vel. Monitorar eletr\u00F3litos com frequ\u00EAncia. Risco de hipervolemia e hipercalemia. Considerar monitoriza\u00E7\u00E3o hemodin\u00E2mica alternativa.</span></div>';
  }
  if(comorbidities.has('immuno')){
    h+='<div class="danger-callout"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Imunodepress\u00E3o:</strong> Risco significativamente aumentado de sepse e infec\u00E7\u00E3o da ferida queimada. Considerar antibioticoterapia precoce. Internar com menor limiar de SCQ. Avalia\u00E7\u00E3o por infectologista.</span></div>';
  }
  if(comorbidities.has('coag')){
    h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Coagulopatia/Anticoagulante:</strong> Risco aumentado de sangramento. Se em uso de anticoagulante, considerar revers\u00E3o antes de procedimentos (escarotomia). Ajustar tromboprofilaxia. Monitorar coagulograma seriado.</span></div>';
  }

  // Weight validation warning
  if(patWeight!=='' && patAge!==''){
    const w=parseFloat(patWeight);
    const a=parseInt(patAge);
    if(!isNaN(w) && !isNaN(a)){
      if(a<=2 && w>20) h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>Peso de '+w+' kg parece elevado para idade de '+a+' anos. Verifique se o valor est\u00E1 correto.</span></div>';
      else if(a<=14 && w>80) h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>Peso de '+w+' kg parece elevado para idade de '+a+' anos. Verifique se o valor est\u00E1 correto.</span></div>';
      if(a>14 && w<30) h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>Peso de '+w+' kg parece baixo para adulto. Verifique se o valor est\u00E1 correto.</span></div>';
    }
  }

  // Parkland preview (live)
  const pk=getParkland();
  if(pk && depth!=='1st'){
    const tbsa=getTBSA();
    h+='<div class="info-callout"><span class="callout-icon">\uD83D\uDCA7</span><span>F\u00F3rmula de Parkland: 4 mL \u00D7 '+patWeight+' kg \u00D7 '+tbsa+'% SCQ = <strong>'+pk.total.toLocaleString('pt-BR')+' mL</strong> em 24h (Ringer Lactato)';
    if(elapsed!==null && elapsed<24){
      const hoursLeft8=Math.max(0,8-elapsed);
      if(hoursLeft8>0){
        const adjRate=hoursLeft8>0?Math.round(pk.first8h/hoursLeft8):0;
        h+=`<br><strong>\u23F1\uFE0F Tempo decorrido: ${elapsed.toFixed(1)}h</strong> \u2014 restam ${hoursLeft8.toFixed(1)}h para as primeiras 8h \u2192 <strong>${adjRate>0?adjRate.toLocaleString('pt-BR'):0} mL/h</strong> (se nenhum volume administrado)`;
      } else {
        const hoursLeft16=Math.max(0,24-elapsed);
        h+=`<br><strong>\u23F1\uFE0F Tempo decorrido: ${elapsed.toFixed(1)}h</strong> \u2014 j\u00E1 passou das 8h iniciais. ${hoursLeft16.toFixed(1)}h restantes \u2192 <strong>${pk.rateSecond.toLocaleString('pt-BR')} mL/h</strong>`;
      }
    }
    h+='</span></div>';

    // Fluid creep warning
    const w=parseFloat(patWeight);
    if(!isNaN(w) && w>0 && tbsa>0){
      const mlPerKgPctSCQ = pk.total / w / tbsa;
      if(mlPerKgPctSCQ > 5){
        h+='<div class="warning-callout"><span class="callout-icon">\u26A0\uFE0F</span><span>Volume calculado = '+mlPerKgPctSCQ.toFixed(1)+' mL/kg/%SCQ. Valores >6 mL/kg/%SCQ/24h est\u00E3o associados a fluid creep e complica\u00E7\u00F5es. Titular conforme d\u00E9bito urin\u00E1rio.</span></div>';
      }
    }

    // Warning about glucose-containing fluids
    h+='<div class="info-callout"><span class="callout-icon">\u2139\uFE0F</span><span><strong>Importante:</strong> N\u00C3O usar solu\u00E7\u00F5es glicosadas (SG 5%) para ressuscita\u00E7\u00E3o vol\u00EAmica \u2014 apenas Ringer Lactato ou SF 0,9%. Solu\u00E7\u00F5es glicosadas agravam edema e hiperglicemia.</span></div>';
  }

  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()" aria-label="Voltar para etapa anterior">\u2190 Voltar</button>';
  const canNext=patSex!==null && patAge!=='' && patWeight!=='' && validateAge(patAge).valid && validateWeight(patWeight).valid;
  h+=`<button class="nav-btn primary" ${canNext?'':'disabled'} onclick="next()" aria-label="Ver resultado final">Ver Resultado \u2192</button>`;
  h+='</div></div>';
  app.innerHTML=h;
}

// =============================================
// STEP 5: RESULT
// =============================================
function renderResult(){
  const tbsa=getTBSA();
  const pk=getParkland();
  const sev=getSeverity();
  const criteria=getTransferCriteria();
  const sevLabel=getSeverityLabel(sev);
  const baux=getBauxScore();

  // Auto-open inhalation section if signs were selected
  if(inhalationSigns.size>0 && !sections._inhAutoOpened){
    sections.inhalation=true;
    sections._inhAutoOpened=true;
  }

  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  // Badge
  const badgeCls=sev==='major'?'sev-major':sev==='moderate'?'sev-moderate':'sev-minor';
  const badgeIcon=sev==='major'?'\uD83D\uDD25':sev==='moderate'?'\u26A0\uFE0F':'\u2705';
  h+=`<div class="result-badge ${badgeCls}">${badgeIcon}</div>`;
  h+=`<div class="result-title" style="color:${getSeverityColor(sev)}">${sevLabel}</div>`;
  h+=`<div class="result-desc">${getMechanismLabel(mechanism)} | ${getDepthLabel(depth)} | SCQ ${getTBSADisplay()} | ${patSex==='M'?'Masc':'Fem'}, ${patAge}a, ${patWeight}kg</div>`;

  // Severity indicator bar
  h+=`<div class="severity-indicator ${sev}"><span class="sev-dot"></span><span class="sev-text">${sevLabel} \u2014 ${sev==='major'?'Interna\u00E7\u00E3o em CTQ/UTI + transfer\u00EAncia':sev==='moderate'?'Interna\u00E7\u00E3o hospitalar':'\u00C9 poss\u00EDvel manejo ambulatorial'}</span></div>`;

  // Baux score (prognostic, adults only)
  const ageNum=parseInt(patAge);
  if(baux!==null && !isNaN(ageNum) && ageNum>=15 && tbsa>0){
    const bauxPct=Math.min(baux,140);
    const bauxColor=baux>=140?'#ef4444':baux>=100?'#f59e0b':baux>=75?'#eab308':'#22c55e';
    const bauxPrognosis=baux>=140?'Progn\u00F3stico muito reservado (mortalidade >90%)':baux>=100?'Mortalidade muito elevada (~75-90%)':baux>=75?'Mortalidade significativa (~50%)':'Mortalidade relativamente baixa (<30%)';
    h+='<div style="text-align:left;background:#0f172a;border-radius:.75rem;padding:.75rem 1rem;margin:.5rem 0;border:1px solid #334155">';
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem"><span style="font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em">\u00CDndice de Baux${inhalationSigns.size>=2?' Modificado':''}</span><span style="font-size:1rem;font-weight:800;font-family:'SF Mono',monospace;color:${bauxColor}">${baux}</span></div>`;
    h+=`<div class="baux-bar"><div class="baux-fill" style="width:${Math.min(bauxPct/140*100,100)}%;background:${bauxColor}"></div></div>`;
    h+=`<div style="font-size:.7rem;color:#94a3b8">${bauxPrognosis} (Idade ${patAge} + SCQ ${tbsa}%${inhalationSigns.size>=2?' + 17 (inala\u00E7\u00E3o)':''})</div>`;
    h+='</div>';
  }

  // -- COLLAPSIBLE: Resumo --
  h+=collapsible('summary','Resumo da Avalia\u00E7\u00E3o',()=>{
    let s='';
    s+=`<div class="summary-row"><span class="criteria">Mecanismo</span><span class="value">${getMechanismLabel(mechanism)}${mechanism==='electrical'?' ('+(elecVoltage==='high'?'Alta':'Baixa')+' tens\u00E3o)':''}${mechanism==='chemical'&&chemAgent?' ('+CHEMICAL_AGENTS.find(a=>a.id===chemAgent).label+')':''}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Profundidade</span><span class="value">${getDepthLabel(depth)}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">SCQ (${usePediatric?'Lund-Browder':'Regra dos 9'})</span><span class="value" style="color:#fbbf24">${getTBSADisplay()}</span></div>`;

    const regNames=BODY_REGIONS.filter(r=>activeRegions.has(r.id)).map(r=>{
      const frac=regionPartial[r.id]||1;
      const pctVal=getRegionPct(r)*frac;
      return r.name.replace('\n',' ')+(frac<1?' ('+(pctVal%1===0?pctVal:pctVal.toFixed(1))+'%)':' ('+getRegionPct(r)+'%)');
    });
    if(regNames.length>0) s+=`<div class="summary-row"><span class="criteria">Regi\u00F5es</span><span class="value" style="font-weight:400;font-size:.8rem;text-align:right;max-width:60%">${regNames.join(', ')}</span></div>`;

    if(criticalAreas.size>0){
      const caNames=CRITICAL_AREAS.filter(c=>criticalAreas.has(c.id)).map(c=>c.label);
      s+=`<div class="summary-row"><span class="criteria">\u00C1reas cr\u00EDticas</span><span class="value" style="color:#fca5a5">${caNames.join(', ')}</span></div>`;
    }
    if(circumferential) s+=`<div class="summary-row"><span class="criteria">Circunferencial</span><span class="value" style="color:#fca5a5">Sim <span class="circ-tag">CIRC</span></span></div>`;

    s+=`<div class="summary-row"><span class="criteria">Sinais de inala\u00E7\u00E3o</span><span class="value">${inhalationSigns.size} de ${INHALATION_SIGNS.length}${inhalationSigns.size>=2?' \u26A0\uFE0F':''}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Paciente</span><span class="value">${patSex==='M'?'Masc':'Fem'}, ${patAge} anos, ${patWeight} kg</span></div>`;

    if(comorbidities.size>0){
      const combNames=COMORBIDITIES.filter(c=>comorbidities.has(c.id)).map(c=>c.label);
      s+=`<div class="summary-row"><span class="criteria">Comorbidades</span><span class="value" style="font-weight:400;font-size:.8rem;text-align:right;max-width:60%">${combNames.join(', ')}</span></div>`;
    }
    if(sulfaAllergy){
      s+=`<div class="summary-row"><span class="criteria">Alergias</span><span class="value" style="color:#fca5a5">Sulfonamidas</span></div>`;
    }

    if(getBurnTime()){
      const elapsed=getElapsedHours();
      s+=`<div class="summary-row"><span class="criteria">Hora da queimadura</span><span class="value">${burnHour.padStart(2,'0')}:${burnMinute.padStart(2,'0')} (${elapsed!==null?elapsed.toFixed(1):'?'}h atr\u00E1s)</span></div>`;
    }

    s+=`<div class="summary-row"><span class="criteria">Gravidade</span><span class="value" style="color:${getSeverityColor(sev)};font-weight:700">${sevLabel}</span></div>`;
    return s;
  });

  // -- COLLAPSIBLE: SCQ Detalhado --
  h+=collapsible('tbsa','Superf\u00EDcie Corporal Queimada',()=>{
    let s='<div style="text-align:center;margin-bottom:1rem"><span style="font-size:2rem;font-weight:800;font-family:\'SF Mono\',monospace;color:#fbbf24">'+getTBSADisplay()+'</span><div style="font-size:.7rem;color:#64748b;text-transform:uppercase">SCQ Total ('+(usePediatric?'Lund-Browder':'Regra dos 9')+')</div></div>';
    for(const r of BODY_REGIONS){
      const active=activeRegions.has(r.id);
      const frac=regionPartial[r.id]||1;
      const pct=getRegionPct(r);
      const val=active?(pct*frac)%1===0?pct*frac:(pct*frac).toFixed(1):'\u2014';
      s+=`<div class="summary-row"><span class="criteria">${r.icon} ${r.name.replace('\n',' ')}</span><span class="value" style="color:${active?'#fbbf24':'#475569'}">${active?val+'%'+(frac<1?' (\u00D7'+Math.round(frac*100)+'%)':''):'\u2014'}</span></div>`;
    }
    return s;
  });

  // -- COLLAPSIBLE: Parkland --
  if(depth!=='1st'){
    h+=collapsible('parkland','F\u00F3rmula de Parkland',()=>{
      let s='';
      if(!pk||tbsa===0){
        s+='<p style="color:#64748b;text-align:center;padding:.5rem;font-size:.85rem">Sem indica\u00E7\u00E3o de ressuscita\u00E7\u00E3o vol\u00EAmica (SCQ = 0% ou peso n\u00E3o informado).</p>';
        return s;
      }

      if(!needsIV()){
        const threshold=parseInt(patAge)<=14?'10':'15';
        s+='<div class="info-callout"><span class="callout-icon">\u2139\uFE0F</span><span>SCQ < '+threshold+'% \u2014 hidrata\u00E7\u00E3o oral pode ser suficiente. Ressuscita\u00E7\u00E3o IV de grandes volumes geralmente indicada para SCQ \u2265 '+threshold+'%. Considerar IV se v\u00F4mitos, recusa oral ou intoler\u00E2ncia.</span></div>';
      }

      s+='<div style="text-align:center;font-family:\'SF Mono\',monospace;font-size:.75rem;color:#64748b;margin-bottom:1rem">4 mL \u00D7 '+patWeight+' kg \u00D7 '+tbsa+'% = <strong style="color:#fbbf24">'+pk.total.toLocaleString('pt-BR')+' mL</strong></div>';
      s+=`<div class="parkland-result active">`;
      s+=`<div class="parkland-row"><span class="pk-label">Volume total em 24h (RL)</span><span class="pk-value highlight">${pk.total.toLocaleString('pt-BR')} mL</span></div>`;
      s+=`<div class="parkland-row"><span class="pk-label">\uD83D\uDD52 Primeiras 8h (50%)</span><span class="pk-value">${pk.first8h.toLocaleString('pt-BR')} mL</span></div>`;
      s+=`<div class="parkland-row"><span class="pk-label">\u2003\u2003Velocidade</span><span class="pk-value">${pk.rateFirst.toLocaleString('pt-BR')} mL/h</span></div>`;
      s+=`<div class="parkland-row"><span class="pk-label">\uD83D\uDD52 Pr\u00F3ximas 16h (50%)</span><span class="pk-value">${pk.next16h.toLocaleString('pt-BR')} mL</span></div>`;
      s+=`<div class="parkland-row"><span class="pk-label">\u2003\u2003Velocidade</span><span class="pk-value">${pk.rateSecond.toLocaleString('pt-BR')} mL/h</span></div>`;
      s+='</div>';

      // Time-adjusted volume
      const elapsed=getElapsedHours();
      if(elapsed!==null && elapsed<24){
        s+='<div class="warning-callout" style="margin-top:.75rem"><span class="callout-icon">\u23F1\uFE0F</span><span>';
        s+=`<strong>Ajuste por tempo decorrido (${elapsed.toFixed(1)}h desde a queimadura):</strong><br>`;
        const hoursLeft8=Math.max(0,8-elapsed);
        if(hoursLeft8>0){
          const remaining=pk.first8h;
          const adjRate=Math.round(remaining/hoursLeft8);
          s+=`\u2022 Restam ${hoursLeft8.toFixed(1)}h das primeiras 8h \u2192 infundir ${remaining.toLocaleString('pt-BR')} mL a <strong>${adjRate.toLocaleString('pt-BR')} mL/h</strong> (se nenhum volume foi administrado)<br>`;
          s+=`\u2022 Se j\u00E1 iniciou reposi\u00E7\u00E3o: subtrair volume j\u00E1 infundido e recalcular velocidade<br>`;
          s+=`\u2022 Pr\u00F3ximas 16h: ${pk.rateSecond.toLocaleString('pt-BR')} mL/h (sem altera\u00E7\u00E3o)`;
        } else {
          const hoursLeft=Math.max(0,24-elapsed);
          s+=`\u2022 J\u00E1 ultrapassou as 8h iniciais. Restam ${hoursLeft.toFixed(1)}h do per\u00EDodo de 24h.`;
          s+=`<br>\u2022 Manter ${pk.rateSecond.toLocaleString('pt-BR')} mL/h`;
        }
        s+='</span></div>';
      } else if(elapsed!==null && elapsed>=24){

      if(comorbidities.has('cardiac')){

  // -- COLLAPSIBLE: Lesao Inalatoria --
  h+=collapsible('inhalation','Les\u00E3o Inalat\u00F3ria',()=>{

  // -- COLLAPSIBLE: Transfer Criteria --
  h+=collapsible('transfer','Crit\u00E9rios de Transfer\u00EAncia (CTQ/ABA)',()=>{
