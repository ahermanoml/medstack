    s+='<div class="mgmt-section-title">\uD83D\uDC89 Profilaxia Tet\u00E2nica</div>';
    s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC89</span><span>Verificar status vacinal. Refor\u00E7o de dT/dTpa se \u00FAltima dose > 5 anos ou esquema incompleto.</span></div>';
    s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC89</span><span>SAT (soro antitet\u00E2nico) ou IGHAT se esquema desconhecido ou < 3 doses. Queimaduras de 2\u00BA e 3\u00BA grau s\u00E3o feridas tet\u00E2nicas.</span></div>';
    s+='</div>';

    // Escharotomy
    if(depth==='3rd'||depth==='4th'||circumferential||sev==='major'){
      s+='<div class="mgmt-section">';
      s+='<div class="mgmt-section-title">\uD83D\uDD2A Escarotomia</div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span><strong>Indica\u00E7\u00F5es:</strong> Queimadura circunferencial de t\u00F3rax (restri\u00E7\u00E3o ventilat\u00F3ria) ou extremidades (s\u00EDndrome compartimental)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCCF</span><span>Monitorar: pulsos distais (Doppler), oximetria de pulso, press\u00E3o compartimental, enchimento capilar, dor desproporcional, parestesias</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83C\uDFE5</span><span>Procedimento de emerg\u00EAncia \u2014 incis\u00E3o longitudinal medial e lateral pela escara, at\u00E9 gordura subcut\u00E2nea s\u00E3</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u23F0</span><span>Realizar nas primeiras 6h se sinais de comprometimento vascular/ventilat\u00F3rio</span></div>';
      if(circumferential){
        s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDEA8</span><span><strong>Queimadura circunferencial confirmada nesta avalia\u00E7\u00E3o.</strong> Avalia\u00E7\u00E3o neurovascular seriada obrigat\u00F3ria (a cada 1h nas primeiras 6h). Elevar extremidades.</span></div>';
      }
      if(comorbidities.has('coag')){
        s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span><strong>Coagulopatia:</strong> Corrigir coagulograma antes de escarotomia, se poss\u00EDvel. Preparar hemoderivados.</span></div>';
      }
      s+='</div>';
    }

    // Electrical specific
    if(mechanism==='electrical'){
      s+='<div class="mgmt-section">';
      s+='<div class="mgmt-section-title">\u26A1 Espec\u00EDfico \u2014 Queimadura El\u00E9trica</div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC93</span><span>ECG 12 deriva\u00E7\u00F5es + monitoriza\u00E7\u00E3o cont\u00EDnua por 24h (risco de arritmias ventriculares)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>CPK, mioglobina s\u00E9rica e urin\u00E1ria, troponina (rabdomi\u00F3lise e les\u00E3o mioc\u00E1rdica)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCA7</span><span>Aumentar volume de ressuscita\u00E7\u00E3o: manter DU > 1\u20132 mL/kg/h se mioglobin\u00FAria (urina escura/avermelhada)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span>Se mioglobin\u00FAria: NaHCO\u2083 para alcalinizar urina (pH urin\u00E1rio >6,5) + Manitol 12,5\u201325g IV</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDB4</span><span>Avaliar les\u00E3o musculoesquel\u00E9tica profunda, s\u00EDndrome compartimental e fraturas (contra\u00E7\u00E3o muscular violenta ou queda)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC41\uFE0F</span><span>Avalia\u00E7\u00E3o oftalmol\u00F3gica (risco de catarata) e neurologia (neuropatia perif\u00E9rica tardia)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>SCQ subestima gravidade real \u2014 les\u00E3o profunda desproporcional \u00E0 \u00E1rea de superf\u00EDcie vis\u00EDvel. Examinar pontos de entrada e sa\u00EDda da corrente.</span></div>';
      s+='</div>';
    }

    // Labs
    s+='<div class="mgmt-section">';
    s+='<div class="mgmt-section-title">\uD83E\uDDEA Exames Complementares</div>';
    if(sev==='major'||sev==='moderate'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Hemograma completo, eletr\u00F3litos (Na, K, Ca, Mg), ureia, creatinina, glicemia</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Gasometria arterial + lactato</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Tipagem sangu\u00EDnea + prova cruzada, coagulograma (TP, TTPa, fibrinog\u00EAnio)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Albumina s\u00E9rica (perda prot\u00E9ica \u00E9 significativa em grandes queimados)</span></div>';
      if(inhalationSigns.size>0) s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Carboxi-hemoglobina (COHb) \u2014 alvo <10%. COHb >25% = O\u2082 hiperb\u00E1rico</span></div>';
      if(mechanism==='electrical') s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>CPK total, mioglobina s\u00E9rica/urin\u00E1ria, troponina, ECG</span></div>';
      if(comorbidities.has('diabetes')) s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>HbA1c, glicemia capilar a cada 2\u20134h. Insulina conforme protocolo.</span></div>';
      if(comorbidities.has('hepatic')) s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Fun\u00E7\u00E3o hep\u00E1tica (TGO, TGP, bilirrubinas). Ajustar drogas metabolizadas pelo f\u00EDgado.</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCF7</span><span>Radiografia de t\u00F3rax (edema pulmonar, SDRA)</span></div>';
    } else {
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Exames conforme necessidade cl\u00EDnica. Queimadura menor geralmente n\u00E3o exige laborat\u00F3rio extenso.</span></div>';
      if(comorbidities.has('diabetes')) s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Glicemia capilar (paciente diab\u00E9tico).</span></div>';
    }
    s+='</div>';

    // Profilaxias (DVT + Curling's ulcer)
    if(sev==='major'||sev==='moderate'){
      s+='<div class="mgmt-section">';
      s+='<div class="mgmt-section-title">\uD83D\uDEE1\uFE0F Profilaxias (Internados)</div>';
      if(comorbidities.has('coag')){
        s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span><strong>Coagulopatia/anticoagulante:</strong> Avaliar risco-benef\u00EDcio da tromboprofilaxia. Se coagulograma permitir: mec\u00E2nica (meias compressivas / compress\u00E3o pneum\u00E1tica). Discutir com hematologia.</span></div>';
      } else {
        s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC89</span><span><strong>Tromboprofilaxia (TEV):</strong> Enoxaparina 40mg SC 1x/dia (iniciar ap\u00F3s estabiliza\u00E7\u00E3o hemost\u00E1tica, geralmente 24\u201348h). Ajustar para fun\u00E7\u00E3o renal. Meias compressivas se dispon\u00EDvel.</span></div>';
      }
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span><strong>\u00DAlcera de Curling:</strong> Protetor g\u00E1strico \u2014 Omeprazol 40mg IV 1x/dia ou Ranitidina 50mg IV 8/8h. Grandes queimados t\u00EAm alto risco de \u00FAlcera de estresse.</span></div>';
      if(sev==='major'){
        s+='<div class="conduta-item"><span class="conduta-icon">\uD83C\uDF5C</span><span><strong>Nutri\u00E7\u00E3o precoce:</strong> Iniciar dieta enteral nas primeiras 6\u201312h se poss\u00EDvel. Grandes queimados t\u00EAm necessidade cal\u00F3rica 1,5\u20132x o basal (Curreri: 25 kcal/kg + 40 kcal/%SCQ). Avalia\u00E7\u00E3o nutricional precoce.</span></div>';
      }
      s+='</div>';
    }

    // Disposition
    s+='<div class="mgmt-section">';
    s+='<div class="mgmt-section-title">\uD83C\uDFE5 Disposi\u00E7\u00E3o</div>';
    if(sev==='major'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDEA8</span><span><strong>Interna\u00E7\u00E3o obrigat\u00F3ria</strong> \u2014 CTQ ou UTI. Contato com central de regula\u00E7\u00E3o para transfer\u00EAncia.</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCDE</span><span>Contatar CTQ de refer\u00EAncia. Estabilizar antes de transferir (ABCDE, Parkland iniciado, analgesia, curativo provis\u00F3rio).</span></div>';
    } else if(sev==='moderate'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83C\uDFE5</span><span>Interna\u00E7\u00E3o hospitalar para observa\u00E7\u00E3o m\u00EDnima 24\u201348h. Avaliar necessidade de CTQ.</span></div>';
    } else {
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83C\uDFE0</span><span>Manejo ambulatorial poss\u00EDvel. Revis\u00E3o em 24\u201348h obrigat\u00F3ria. Retorno subsequente a cada 2\u20133 dias at\u00E9 completa epiteliza\u00E7\u00E3o.</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span>Receita: Analgesia VO + orienta\u00E7\u00F5es de curativo ('+(sulfaAllergy?'prata nanocristalina ou mupirocina 2%':'sulfadiazina de prata 1%')+', trocar 1\u20132x/dia, lavar com SF 0,9%)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span><strong>Sinais de alarme (orientar paciente):</strong> febre, aumento progressivo da dor, secre\u00E7\u00E3o purulenta/f\u00E9tida, extens\u00E3o do eritema ao redor da ferida, linhas vermelhas (linfangite), mal-estar geral. Retornar imediatamente se presentes.</span></div>';
    }
    s+='</div>';

    // Child abuse screening
    const ageNum2=parseInt(patAge);
    if(!isNaN(ageNum2) && ageNum2<10){
      s+='<div class="mgmt-section">';
      s+='<div class="mgmt-section-title">\uD83D\uDC76 Rastreio de Maus-Tratos</div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>Em crian\u00E7as, avaliar padr\u00E3o da queimadura. Sinais sugestivos de maus-tratos: les\u00E3o em \u201Cluva/meia\u201D (imers\u00E3o), limites n\u00EDtidos, aus\u00EAncia de salpicos, hist\u00F3ria incompat\u00EDvel com les\u00E3o, atraso na busca de atendimento, les\u00F5es em diferentes est\u00E1gios de cicatriza\u00E7\u00E3o.</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCCB</span><span>Se suspeita: notifica\u00E7\u00E3o obrigat\u00F3ria ao Conselho Tutelar (ECA, Art. 13). Documentar detalhadamente. Solicitar avalia\u00E7\u00E3o do servi\u00E7o social.</span></div>';
      s+='</div>';
    }

    // Elder abuse screening
    if(!isNaN(ageNum) && ageNum>60){
      s+='<div class="mgmt-section">';
      s+='<div class="mgmt-section-title">\uD83D\uDC74 Rastreio de Maus-Tratos ao Idoso</div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>Avaliar contexto social e padr\u00E3o de les\u00E3o. Sinais de alerta: hist\u00F3ria incompat\u00EDvel, atraso na busca de atendimento, les\u00F5es anteriores, cuidador hostil ou ausente.</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCCB</span><span>Se suspeita: notifica\u00E7\u00E3o ao Minist\u00E9rio P\u00FAblico ou Delegacia do Idoso (Estatuto do Idoso, Art. 19).</span></div>';
      s+='</div>';
    }

    return s;
  });

  // -- COLLAPSIBLE: Note --
  h+=collapsible('note','Nota para Prontu\u00E1rio',()=>buildNoteContent());

  // Nav
  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()" aria-label="Voltar para a etapa anterior">\u2190 Voltar</button>';
  h+='<button class="nav-btn primary" onclick="restart()" aria-label="Recome\u00E7ar avalia\u00E7\u00E3o">\u21BB Recome\u00E7ar</button>';
  h+='</div></div>';

  // Disclaimer
  h+='<div class="disclaimer">Esta ferramenta \u00E9 um auxiliar de decis\u00E3o cl\u00EDnica e n\u00E3o substitui o julgamento m\u00E9dico. Sempre considere o contexto cl\u00EDnico individual. Baseado em diretrizes ABA, SBQ e ATLS.</div>';

  app.innerHTML=h;
}

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id,title,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')" role="button" aria-expanded="${open}" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('${id}')}">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}">`;
  if(open) h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// NOTE
// =============================================
function buildNoteContent(){
  const tbsa=getTBSA();
  const pk=getParkland();
  const sev=getSeverity();
  const sevLabel=getSeverityLabel(sev);
  const criteria=getTransferCriteria();
  const baux=getBauxScore();

  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  let n='';
  n+=`QUEIMADURA - AVALIA\u00C7\u00C3O ESTRUTURADA\n`;
  n+=`Data/hora da avalia\u00E7\u00E3o: ${ts}\n`;
  if(getBurnTime()){
    const elapsed=getElapsedHours();
    n+=`Hora da queimadura: ${burnHour.padStart(2,'0')}:${burnMinute.padStart(2,'0')} (${elapsed!==null?elapsed.toFixed(1):'?'}h antes da avalia\u00E7\u00E3o)\n`;
  }
  n+=`========================================\n\n`;

  n+=`PACIENTE: ${patSex==='M'?'Masculino':'Feminino'}, ${patAge} anos, ${patWeight} kg\n`;
  if(comorbidities.size>0){
    n+=`Comorbidades: ${COMORBIDITIES.filter(c=>comorbidities.has(c.id)).map(c=>c.label).join(', ')}\n`;
  }
  if(sulfaAllergy) n+=`Alergia: Sulfonamidas\n`;
  n+='\n';

  n+=`MECANISMO: ${getMechanismLabel(mechanism)}`;
  if(mechanism==='electrical') n+=` (${elecVoltage==='high'?'Alta':'Baixa'} tens\u00E3o)`;
  if(mechanism==='chemical' && chemAgent) n+=` (${CHEMICAL_AGENTS.find(a=>a.id===chemAgent).label})`;
  n+='\n';

  n+=`PROFUNDIDADE: ${getDepthLabel(depth)}\n`;
  n+=`SCQ (${usePediatric?'Lund-Browder':'Regra dos 9'}): ${getTBSADisplay()}\n`;

  const regNames=BODY_REGIONS.filter(r=>activeRegions.has(r.id)).map(r=>{
    const frac=regionPartial[r.id]||1;
    const pct=getRegionPct(r)*frac;
    return r.name.replace('\n',' ')+' ('+(pct%1===0?pct:pct.toFixed(1))+'%)';
  });
  if(regNames.length>0) n+=`Regi\u00F5es: ${regNames.join(', ')}\n`;

  if(criticalAreas.size>0){
    const caNames=CRITICAL_AREAS.filter(c=>criticalAreas.has(c.id)).map(c=>c.label);
    n+=`\u00C1reas cr\u00EDticas: ${caNames.join(', ')}\n`;
  }
  if(circumferential) n+=`Queimadura circunferencial: SIM\n`;

  n+=`\nGRAVIDADE: ${sevLabel}\n`;

  // Baux
  const ageNum=parseInt(patAge);
  if(baux!==null && !isNaN(ageNum) && ageNum>=15 && tbsa>0){
    n+=`\u00CDndice de Baux${inhalationSigns.size>=2?' Modificado':''}: ${baux} (Idade ${patAge} + SCQ ${tbsa}%${inhalationSigns.size>=2?' + 17 inala\u00E7\u00E3o':''})\n`;
  }

  // Inhalation
  const inhPresent=INHALATION_SIGNS.filter(s=>inhalationSigns.has(s.id));
  if(inhPresent.length>0){
    n+=`\nLES\u00C3O INALAT\u00D3RIA: ${inhPresent.length} sinal(is)\n`;
    for(const s of inhPresent) n+=`  [+] ${s.label}\n`;
    if(inhPresent.length>=2) n+=`  >> Alta suspeita - considerar IOT precoce\n`;
  } else {
    n+=`\nLES\u00C3O INALAT\u00D3RIA: Sem sinais identificados\n`;
  }

  // Parkland
  if(pk && depth!=='1st' && tbsa>0){
    n+=`\nRESSUSCITA\u00C7\u00C3O VOL\u00CAMICA (Parkland):\n`;
    n+=`  4 mL x ${patWeight} kg x ${tbsa}% = ${pk.total.toLocaleString('pt-BR')} mL/24h (RL)\n`;
    n+=`  Primeiras 8h: ${pk.first8h.toLocaleString('pt-BR')} mL (${pk.rateFirst.toLocaleString('pt-BR')} mL/h)\n`;
    n+=`  Pr\u00F3ximas 16h: ${pk.next16h.toLocaleString('pt-BR')} mL (${pk.rateSecond.toLocaleString('pt-BR')} mL/h)\n`;
    n+=`  Alvo DU: ${parseInt(patAge)<=14?'1-2':'0,5-1'} mL/kg/h\n`;

    const elapsed=getElapsedHours();
    if(elapsed!==null && elapsed<24){
      const hoursLeft8=Math.max(0,8-elapsed);
      if(hoursLeft8>0){
        const adjRate=Math.round(pk.first8h/hoursLeft8);
        n+=`  ** AJUSTE: ${elapsed.toFixed(1)}h decorridas -> max ${adjRate.toLocaleString('pt-BR')} mL/h (se nada infundido) **\n`;
      }
    }

    if(inhalationSigns.size>=2){
      n+=`  ** Les\u00E3o inalat\u00F3ria: considerar +30-50% volume (~${Math.round(pk.total*1.4).toLocaleString('pt-BR')} mL) **\n`;
    }
  }

  // Transfer criteria
  if(criteria.length>0){
    n+=`\nCRIT\u00C9RIOS DE TRANSFER\u00CANCIA (CTQ/ABA): ${criteria.length} crit\u00E9rio(s)\n`;
    for(const c of criteria) n+=`  [!] ${c}\n`;
  } else {
    n+=`\nCRIT\u00C9RIOS DE TRANSFER\u00CANCIA (CTQ/ABA): Nenhum\n`;
  }

  n+=`\nCONDUTA INICIAL:\n`;
  // Airway
  if(inhalationSigns.size>=2 || sev==='major'){
    n+=`  Via a\u00E9rea: Avaliar IOT precoce. O2 100%.\n`;
  } else {
    n+=`  Via a\u00E9rea: Patente. Monitorar.\n`;
  }
  // Fluids
  if(pk && needsIV() && depth!=='1st'){
    n+=`  Ressuscita\u00E7\u00E3o: RL ${pk.rateFirst.toLocaleString('pt-BR')} mL/h (8h), ${pk.rateSecond.toLocaleString('pt-BR')} mL/h (16h)\n`;
    const elapsed=getElapsedHours();
    if(elapsed!==null && elapsed<8){
      const hoursLeft=Math.max(0,8-elapsed);
      const adjRate=hoursLeft>0?Math.round(pk.first8h/hoursLeft):0;
      n+=`  ** Ajuste temporal: max ${adjRate.toLocaleString('pt-BR')} mL/h agora (${elapsed.toFixed(1)}h decorridas) **\n`;
    }
  } else {
    n+=`  Hidrata\u00E7\u00E3o: Oral/IV conforme necessidade\n`;
  }
  // Pain
  if(sev==='major') n+=`  Analgesia: Opioide IV (morfina/fentanil) + adjuvante IV\n`;
  else if(sev==='moderate') n+=`  Analgesia: Tramadol/morfina IV + dipirona IV\n`;
  else n+=`  Analgesia: Dipirona/paracetamol +/- tramadol VO\n`;

  // Wound dressing in note
  if(sulfaAllergy){
    n+=`  Ferida: Limpeza + curativo com prata nanocristalina ou mupirocina 2% (ALERGIA A SULFA)\n`;
  } else {
    n+=`  Ferida: Limpeza + curativo com sulfadiazina de prata 1%\n`;
  }
  n+=`  Profilaxia tet\u00E2nica: Verificar status vacinal\n`;

  if(mechanism==='electrical') n+=`  Espec\u00EDfico: ECG 12D, CPK, mioglobina, monitor cont\u00EDnuo 24h\n`;
  if(mechanism==='chemical') n+=`  Espec\u00EDfico: Irriga\u00E7\u00E3o prolongada (${chemAgent==='alkali'?'at\u00E9 pH<8,0, ':''}m\u00EDnimo 30-60min)\n`;
  if(mechanism==='friction') n+=`  Espec\u00EDfico: Desbridamento de corpos estranhos, profilaxia tet\u00E2nica\n`;
  if(inhalationSigns.has('enclosed')) n+=`  Suspeita de cianeto: considerar hidroxocobalamina 5g IV\n`;
  if(circumferential) n+=`  Circunferencial: Monitorar pulsos distais, avaliar escarotomia\n`;

  // Prophylaxis for admitted
  if(sev==='major'||sev==='moderate'){
    if(comorbidities.has('coag')){
      n+=`  Tromboprofilaxia: Mec\u00E2nica (coagulopatia). Avaliar com hematologia.\n`;
    } else {
      n+=`  Tromboprofilaxia: Enoxaparina 40mg SC 1x/dia (ap\u00F3s estabiliza\u00E7\u00E3o)\n`;
    }
    n+=`  Protetor g\u00E1strico: Omeprazol 40mg IV 1x/dia\n`;
  }
  if(sev==='major'){
    n+=`  Nutri\u00E7\u00E3o: Dieta enteral precoce (6-12h)\n`;
  }

  n+=`\nDISPOSI\u00C7\u00C3O: ${sev==='major'?'Interna\u00E7\u00E3o CTQ/UTI + transfer\u00EAncia':sev==='moderate'?'Interna\u00E7\u00E3o hospitalar':'Manejo ambulatorial com revis\u00E3o 24-48h'}\n`;

  // Follow-up for ambulatory
  if(sev==='minor'){
    n+=`\nORIENTA\u00C7\u00D5ES DE ALTA:\n`;
    n+=`  - Retorno em 24-48h para reavalia\u00E7\u00E3o\n`;
    n+=`  - Retornos subsequentes a cada 2-3 dias\n`;
    n+=`  - Sinais de alarme: febre, aumento da dor, secre\u00E7\u00E3o purulenta, extens\u00E3o do eritema\n`;
    n+=`  - Troca de curativo 1-2x/dia, lavar com SF 0,9%\n`;
    n+=`  - Manter ferida elevada quando poss\u00EDvel\n`;
  }

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()" aria-label="Copiar nota para \u00E1rea de transfer\u00EAncia">\uD83D\uDCCB Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el) return;
  const text=el.textContent||el.innerText;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showCopied();
    }).catch(()=>{
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.left='-9999px';
  ta.style.top='0';
  ta.setAttribute('readonly','');
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0,ta.value.length);
  try{document.execCommand('copy');showCopied();}catch(e){/* silently fail */}
  document.body.removeChild(ta);
}

function showCopied(){
  const btn=document.getElementById('copyBtn');
  if(!btn) return;
  btn.textContent='\u2713 Copiado!';btn.classList.add('copied');
  setTimeout(()=>{if(document.getElementById('copyBtn')){btn.textContent='\uD83D\uDCCB Copiar nota';btn.classList.remove('copied')}},2000);
}

// =============================================
// ACTIONS
// =============================================
function setMechanism(id){
  mechanism=id;
  if(id!=='electrical') elecVoltage=null;
  if(id!=='chemical') chemAgent=null;
  render();
}
function setElecV(v){elecVoltage=v;render()}
function setChemAgent(id){chemAgent=id;render()}
function setDepth(id){depth=id;render()}
function toggleRegion(id){
  if(activeRegions.has(id)){activeRegions.delete(id);delete regionPartial[id]}
  else{activeRegions.add(id);regionPartial[id]=1}
  render();
}
function setFrac(id,f){regionPartial[id]=f;render()}
function toggleCirc(){circumferential=!circumferential;render()}
function toggleCritArea(id){criticalAreas.has(id)?criticalAreas.delete(id):criticalAreas.add(id);render()}
function toggleInhSign(id){inhalationSigns.has(id)?inhalationSigns.delete(id):inhalationSigns.add(id);render()}
function setPatSex(v){patSex=v;render()}
function toggleComorb(id){comorbidities.has(id)?comorbidities.delete(id):comorbidities.add(id);render()}
function toggleSulfaAllergy(){sulfaAllergy=!sulfaAllergy;render()}
function resetAllRegions(){activeRegions=new Set();regionPartial={};circumferential=false;criticalAreas=new Set();render()}
function setPatAge(v){
  patAge=v;
  const age=parseInt(v);
  if(!isNaN(age) && age<=14) usePediatric=true;
  else usePediatric=false;
  clearTimeout(setPatAge._timer);
  setPatAge._timer=setTimeout(()=>render(),400);
}
function setPatWeight(v){
  patWeight=v;
  clearTimeout(setPatWeight._timer);
  setPatWeight._timer=setTimeout(()=>render(),400);
}
function setBurnHour(v){
  burnHour=v;
  clearTimeout(setBurnHour._timer);
  setBurnHour._timer=setTimeout(()=>render(),400);
}
function setBurnMin(v){
  burnMinute=v;
  clearTimeout(setBurnMin._timer);
  setBurnMin._timer=setTimeout(()=>render(),400);
}
function toggleSection(id){sections[id]=!sections[id];render()}

function next(){
  if(step===0 && (!mechanism || (mechanism==='electrical' && !elecVoltage) || (mechanism==='chemical' && !chemAgent))) return;
  if(step===1 && !depth) return;
  if(step===4 && (!patSex || !patAge || !patWeight)) return;
  if(step===4){
    const w=parseFloat(patWeight);
    const a=parseInt(patAge);
    if(isNaN(w)||w<=0||isNaN(a)||a<0) return;
    if(!validateAge(patAge).valid || !validateWeight(patWeight).valid) return;
  }
  step++;
  render();
}
function prev(){if(step>0){step--;render()}}
function restart(){
  if(!confirm('Recome\u00E7ar avalia\u00E7\u00E3o? Todos os dados ser\u00E3o perdidos.')) return;
  step=0;mechanism=null;elecVoltage=null;chemAgent=null;depth=null;
  activeRegions=new Set();regionPartial={};circumferential=false;criticalAreas=new Set();
  inhalationSigns=new Set();comorbidities=new Set();sulfaAllergy=false;
  patWeight='';patAge='';patSex=null;burnHour='';burnMinute='';usePediatric=false;
  sections={summary:true,tbsa:true,parkland:true,inhalation:false,transfer:true,management:true,note:true};
  render();
}

// Focus management: keep input focus after render
const _render=render;
render=function(){
  const ae=document.activeElement;
  const aeid=ae?ae.id:null;
  const aeVal=ae?ae.value:null;
  const aeSel=ae?ae.selectionStart:null;
  _render();
  if(aeid){
    const el=document.getElementById(aeid);
    if(el){
      el.focus();
      if(typeof aeVal==='string' && typeof aeSel==='number'){
        try{el.setSelectionRange(aeSel,aeSel)}catch(e){}
      }
    }
  }
};

// Keyboard navigation: Enter/Space on option-btn
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('option-btn')){
    e.preventDefault();
    e.target.click();
  }
});

render();
</script>
