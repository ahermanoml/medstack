function renderResult(){
  const tbsa=getTBSA();
  const pk=getParkland();
  const sev=getSeverity();
  const criteria=getTransferCriteria();
  const sevLabel=getSeverityLabel(sev);
  const baux=getBauxScore();

  let h=progHTML(TOTAL_STEPS,true);
  h+='<div class="card result-card">';

  // Badge
  const badgeCls=sev==='major'?'sev-major':sev==='moderate'?'sev-moderate':'sev-minor';
  const badgeIcon=sev==='major'?'\uD83D\uDD25':sev==='moderate'?'\u26A0\uFE0F':'\u2705';
  h+=`<div class="result-badge ${badgeCls}">${badgeIcon}</div>`;
  h+=`<div class="result-title" style="color:${getSeverityColor(sev)}">${sevLabel}</div>`;
  h+=`<div class="result-desc">${getMechanismLabel(mechanism)} | ${getDepthLabel(depth)} | SCQ ${getTBSADisplay()} | ${patSex==='M'?'Masc':'Fem'}, ${patAge}a, ${patWeight}kg</div>`;

  // Severity indicator bar
  h+=`<div class="severity-indicator ${sev}"><span class="sev-dot"></span><span class="sev-text">${sevLabel} \u2014 ${sev==='major'?'Interna\u00E7\u00E3o em CTQ/UTI + transfer\u00EAncia':sev==='moderate'?'Interna\u00E7\u00E3o hospitalar':'\u00C9 poss\u00EDvel manejo ambulatorial'}</span></div>`;

  // Baux score (prognostic, adults only)
  const ageNum=parseInt(patAge);
  if(baux!==null && !isNaN(ageNum) && ageNum>=15 && tbsa>0){
    const bauxPct=Math.min(baux,140);
    const bauxColor=baux>=140?'#ef4444':baux>=100?'#f59e0b':baux>=75?'#eab308':'#22c55e';
    const bauxPrognosis=baux>=140?'Progn\u00F3stico muito reservado':baux>=100?'Mortalidade muito elevada':baux>=75?'Mortalidade significativa':'Mortalidade relativamente baixa';
    h+='<div style="text-align:left;background:#0f172a;border-radius:.75rem;padding:.75rem 1rem;margin:.5rem 0;border:1px solid #334155">';
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem"><span style="font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em">\u00CDndice de Baux${inhalationSigns.size>=2?' Modificado':''}</span><span style="font-size:1rem;font-weight:800;font-family:'SF Mono',monospace;color:${bauxColor}">${baux}</span></div>`;
    h+=`<div class="baux-bar"><div class="baux-fill" style="width:${Math.min(bauxPct/140*100,100)}%;background:${bauxColor}"></div></div>`;
    h+=`<div style="font-size:.7rem;color:#94a3b8">${bauxPrognosis} (Idade ${patAge} + SCQ ${tbsa}%${inhalationSigns.size>=2?' + 17 (inala\u00E7\u00E3o)':''})</div>`;
    h+='</div>';
  }

  // ── COLLAPSIBLE: Resumo ──
  h+=collapsible('summary','Resumo da Avalia\u00E7\u00E3o',()=>{
    let s='';
    s+=`<div class="summary-row"><span class="criteria">Mecanismo</span><span class="value">${getMechanismLabel(mechanism)}${mechanism==='electrical'?' ('+(elecVoltage==='high'?'Alta':'Baixa')+' tens\u00E3o)':''}${mechanism==='chemical'&&chemAgent?' ('+CHEMICAL_AGENTS.find(a=>a.id===chemAgent).label+')':''}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Profundidade</span><span class="value">${getDepthLabel(depth)}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">SCQ (Regra dos 9)</span><span class="value" style="color:#fbbf24">${getTBSADisplay()}</span></div>`;

    const regNames=BODY_REGIONS.filter(r=>activeRegions.has(r.id)).map(r=>{
      const frac=regionPartial[r.id]||1;
      const pctVal=getRegionPct(r)*frac;
      return r.name.replace('\n',' ')+(frac<1?' ('+(pctVal%1===0?pctVal:pctVal.toFixed(1))+'%)':' ('+getRegionPct(r)+'%)');
    });
    if(regNames.length>0) s+=`<div class="summary-row"><span class="criteria">Regi\u00F5es</span><span class="value" style="font-weight:400;font-size:.8rem;text-align:right;max-width:60%">${regNames.join(', ')}</span></div>`;

    // Critical areas
    if(criticalAreas.size>0){
      const caNames=CRITICAL_AREAS.filter(c=>criticalAreas.has(c.id)).map(c=>c.label);
      s+=`<div class="summary-row"><span class="criteria">\u00C1reas cr\u00EDticas</span><span class="value" style="color:#fca5a5">${caNames.join(', ')}</span></div>`;
    }
    if(circumferential) s+=`<div class="summary-row"><span class="criteria">Circunferencial</span><span class="value" style="color:#fca5a5">Sim <span class="circ-tag">CIRC</span></span></div>`;

    s+=`<div class="summary-row"><span class="criteria">Sinais de inala\u00E7\u00E3o</span><span class="value">${inhalationSigns.size} de ${INHALATION_SIGNS.length}${inhalationSigns.size>=2?' \u26A0\uFE0F':''}</span></div>`;
    s+=`<div class="summary-row"><span class="criteria">Paciente</span><span class="value">${patSex==='M'?'Masc':'Fem'}, ${patAge} anos, ${patWeight} kg</span></div>`;

    if(getBurnTime()){
      const elapsed=getElapsedHours();
      s+=`<div class="summary-row"><span class="criteria">Hora da queimadura</span><span class="value">${burnHour.padStart(2,'0')}:${burnMinute.padStart(2,'0')} (${elapsed!==null?elapsed.toFixed(1):'?'}h atr\u00E1s)</span></div>`;
    }

    s+=`<div class="summary-row"><span class="criteria">Gravidade</span><span class="value" style="color:${getSeverityColor(sev)};font-weight:700">${sevLabel}</span></div>`;
    return s;
  });

  // ── COLLAPSIBLE: SCQ Detalhado ──
  h+=collapsible('tbsa','Superf\u00EDcie Corporal Queimada',()=>{
    let s='<div style="text-align:center;margin-bottom:1rem"><span style="font-size:2rem;font-weight:800;font-family:\'SF Mono\',monospace;color:#fbbf24">'+getTBSADisplay()+'</span><div style="font-size:.7rem;color:#64748b;text-transform:uppercase">SCQ Total (Regra dos 9)</div></div>';
    for(const r of BODY_REGIONS){
      const active=activeRegions.has(r.id);
      const frac=regionPartial[r.id]||1;
      const pct=getRegionPct(r);
      const val=active?(pct*frac)%1===0?pct*frac:(pct*frac).toFixed(1):'\u2014';
      s+=`<div class="summary-row"><span class="criteria">${r.icon} ${r.name.replace('\n',' ')}</span><span class="value" style="color:${active?'#fbbf24':'#475569'}">${active?val+'%'+(frac<1?' (\u00D7'+Math.round(frac*100)+'%)':''):'\u2014'}</span></div>`;
    }
    return s;
  });

  // ── COLLAPSIBLE: Parkland ──
  if(depth!=='1st'){
    h+=collapsible('parkland','F\u00F3rmula de Parkland',()=>{
      let s='';
      if(!pk||tbsa===0){
        s+='<p style="color:#64748b;text-align:center;padding:.5rem;font-size:.85rem">Sem indica\u00E7\u00E3o de ressuscita\u00E7\u00E3o vol\u00EAmica (SCQ = 0% ou peso n\u00E3o informado).</p>';
        return s;
      }

      if(!needsIV()){
        const threshold=parseInt(patAge)<=14?'10':'15';
        s+='<div class="info-callout"><span class="callout-icon">\u2139\uFE0F</span><span>SCQ < '+threshold+'% \u2014 hidrata\u00E7\u00E3o oral pode ser suficiente. Ressuscita\u00E7\u00E3o IV de grandes volumes geralmente indicada para SCQ \u2265 '+threshold+'%.</span></div>';
      }

      s+='<div style="text-align:center;font-family:\'SF Mono\',monospace;font-size:.75rem;color:#64748b;margin-bottom:1rem">4 mL \u00D7 '+patWeight+' kg \u00D7 '+tbsa+'% = <strong style="color:#fbbf24">'+pk.total.toLocaleString('pt-BR')+' mL</strong></div>';
      s+=`<div class="parkland-result active">`;
      s+=`<div class="parkland-row"><span class="pk-label">Volume total em 24h (RL)</span><span class="pk-value highlight">${pk.total.toLocaleString('pt-BR')} mL</span></div>`;
      s+=`<div class="parkland-row"><span class="pk-label">\uD83D\uDD52 Primeiras 8h (50%)</span><span class="pk-value">${pk.first8h.toLocaleString('pt-BR')} mL</span></div>`;
      s+=`<div class="parkland-row"><span class="pk-label">\u2003\u2003Velocidade</span><span class="pk-value">${pk.rateFirst.toLocaleString('pt-BR')} mL/h</span></div>`;
      s+=`<div class="parkland-row"><span class="pk-label">\uD83D\uDD52 Pr\u00F3ximas 16h (50%)</span><span class="pk-value">${pk.next16h.toLocaleString('pt-BR')} mL</span></div>`;
      s+=`<div class="parkland-row"><span class="pk-label">\u2003\u2003Velocidade</span><span class="pk-value">${pk.rateSecond.toLocaleString('pt-BR')} mL/h</span></div>`;
      s+='</div>';

      // Time-adjusted volume
      const elapsed=getElapsedHours();
      if(elapsed!==null && elapsed<24){
        s+='<div class="warning-callout" style="margin-top:.75rem"><span class="callout-icon">\u23F1\uFE0F</span><span>';
        s+=`<strong>Ajuste por tempo decorrido (${elapsed.toFixed(1)}h desde a queimadura):</strong><br>`;
        const hoursLeft8=Math.max(0,8-elapsed);
        if(hoursLeft8>0){
          const infused=Math.round(pk.rateFirst*Math.min(elapsed,8));
          const remaining=Math.max(0,pk.first8h-infused);
          const adjRate=hoursLeft8>0?Math.round(remaining/hoursLeft8):0;
          s+=`\u2022 Nas primeiras 8h: restam ${hoursLeft8.toFixed(1)}h \u2192 infundir ${remaining.toLocaleString('pt-BR')} mL a <strong>${adjRate.toLocaleString('pt-BR')} mL/h</strong><br>`;
          s+=`\u2022 Pr\u00F3ximas 16h: ${pk.rateSecond.toLocaleString('pt-BR')} mL/h (sem altera\u00E7\u00E3o)`;
        } else {
          const hoursLeft=Math.max(0,24-elapsed);
          s+=`\u2022 J\u00E1 ultrapassou as 8h iniciais. Restam ${hoursLeft.toFixed(1)}h do per\u00EDodo de 24h.`;
          s+=`<br>\u2022 Manter ${pk.rateSecond.toLocaleString('pt-BR')} mL/h`;
        }
        s+='</span></div>';
      }

      // Pediatric maintenance
      const age=parseInt(patAge);
      if(!isNaN(age) && age<=14){
        const w=parseFloat(patWeight);
        let maint=0;
        if(w<=10) maint=w*100;
        else if(w<=20) maint=1000+(w-10)*50;
        else maint=1500+(w-20)*20;
        s+=`<div class="info-callout" style="margin-top:.75rem"><span class="callout-icon">\uD83D\uDC76</span><span><strong>Crian\u00E7a:</strong> Acrescentar soro de manuten\u00E7\u00E3o (Holliday-Segar): ~${Math.round(maint)} mL/24h com glicose (SG 5% + eletr\u00F3litos). Volume de Parkland \u00E9 ADICIONAL \u00E0 manuten\u00E7\u00E3o.</span></div>`;
      }

      s+='<div class="warning-callout" style="margin-top:.75rem"><span class="callout-icon">\u26A0\uFE0F</span><span><strong>Importante:</strong> O tempo de 8h \u00E9 contado a partir do momento da queimadura, N\u00C3O da chegada ao hospital. Ajustar volume conforme d\u00E9bito urin\u00E1rio-alvo: adultos 0,5\u20131 mL/kg/h, crian\u00E7as 1\u20132 mL/kg/h. Usar <strong>Ringer Lactato</strong> preferencialmente. Evitar volumes >6 mL/kg/%SCQ/24h (fluid creep).</span></div>';

      if(inhalationSigns.size>=2){
        s+='<div class="danger-callout" style="margin-top:.75rem"><span class="callout-icon">\uD83D\uDEA8</span><span><strong>Les\u00E3o inalat\u00F3ria:</strong> Considerar aumento de 30\u201350% no volume total de Parkland. Volume ajustado: ~'+Math.round(pk.total*1.4).toLocaleString('pt-BR')+' mL (\u00D71.4).</span></div>';
      }

      return s;
    });
  }

  // ── COLLAPSIBLE: Les\u00E3o Inalat\u00F3ria ──
  h+=collapsible('inhalation','Les\u00E3o Inalat\u00F3ria',()=>{
    let s='';
    if(inhalationSigns.size===0){
      s+='<p style="color:#64748b;text-align:center;padding:.5rem;font-size:.85rem">Sem sinais de les\u00E3o inalat\u00F3ria identificados.</p>';
    } else {
      for(const sign of INHALATION_SIGNS){
        const present=inhalationSigns.has(sign.id);
        if(present) s+=`<div class="summary-row"><span class="criteria">\u2713 ${sign.label}</span><span class="value" style="color:#fca5a5">Presente</span></div>`;
      }
      if(inhalationSigns.size>=2){
        s+='<div class="danger-callout" style="margin-top:.75rem"><span class="callout-icon">\uD83D\uDEA8</span><span><strong>Alta suspeita de les\u00E3o inalat\u00F3ria ('+inhalationSigns.size+' sinais).</strong><br>\u2022 IOT precoce (tubo \u22657.5, antes do edema)<br>\u2022 O\u2082 umidificado a 100% por m\u00E1scara n\u00E3o-reinalante<br>\u2022 Broncoscopia para confirma\u00E7\u00E3o diagn\u00F3stica<br>\u2022 Aumentar volume de Parkland em 30\u201350%<br>\u2022 Dosar carboxi-hemoglobina (COHb)<br>\u2022 Se COHb >15%: considerar O\u2082 hiperb\u00E1rico (se dispon\u00EDvel)<br>\u2022 Se suspeita de cianeto (inc\u00EAndio em ambiente fechado com pl\u00E1sticos): hidroxocobalamina 5g IV<br>\u2022 Interna\u00E7\u00E3o em CTQ</span></div>';
      } else {
        s+='<div class="warning-callout" style="margin-top:.75rem"><span class="callout-icon">\u26A0\uFE0F</span><span>Manter vigil\u00E2ncia rigorosa. Reavaliar via a\u00E9rea a cada 2\u20134h. Baixo limiar para IOT se sinais progredirem. Dosar COHb.</span></div>';
      }
    }
    return s;
  });

  // ── COLLAPSIBLE: Transfer Criteria ──
  h+=collapsible('transfer','Crit\u00E9rios de Transfer\u00EAncia (CTQ/ABA)',()=>{
    let s='';
    if(criteria.length>0){
      s+='<div class="criteria-met">';
      s+=`<h4>\uD83D\uDEA8 ${criteria.length} crit\u00E9rio${criteria.length>1?'s':''} para centro de queimados</h4>`;
      s+='<ul>';
      for(const c of criteria) s+=`<li>${c}</li>`;
      s+='</ul></div>';
      s+='<div style="font-size:.75rem;color:#94a3b8;margin-top:.5rem;padding:.5rem">Crit\u00E9rios da American Burn Association (ABA) / Sociedade Brasileira de Queimaduras (SBQ). Considerar transfer\u00EAncia para Centro de Tratamento de Queimados (CTQ) quando \u22651 crit\u00E9rio presente.<br><br><strong>Estabilizar antes de transferir:</strong> via a\u00E9rea, acesso venoso, ressuscita\u00E7\u00E3o vol\u00EAmica iniciada, analgesia, curativo provis\u00F3rio, sonda vesical (se grande queimado), documenta\u00E7\u00E3o fotogr\u00E1fica.</div>';
    } else {
      s+='<div class="criteria-none">';
      s+='<h4>\u2705 Sem crit\u00E9rios de transfer\u00EAncia</h4>';
      s+='<p>Nenhum crit\u00E9rio de transfer\u00EAncia para CTQ identificado. Manejo pode ser ambulatorial ou em enfermaria geral, conforme avalia\u00E7\u00E3o cl\u00EDnica.</p>';
      s+='</div>';
    }
    return s;
  });

  // ── COLLAPSIBLE: Manejo Inicial ──
  h+=collapsible('management','Manejo Inicial',()=>{
    let s='';

    // ABCDE reminder
    s+='<div class="info-callout" style="margin-bottom:1rem"><span class="callout-icon">\uD83C\uDFE5</span><span><strong>Lembrete:</strong> Queimados s\u00E3o pacientes de trauma. Seguir ABCDE do ATLS. A avalia\u00E7\u00E3o prim\u00E1ria precede o manejo espec\u00EDfico da queimadura.</span></div>';

    // A - Airway
    s+='<div class="mgmt-section">';
    s+='<div class="mgmt-section-title">\uD83C\uDD70\uFE0F Via A\u00E9rea (A)</div>';
    if(inhalationSigns.size>=2 || sev==='major'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDEA8</span><span>Avaliar via a\u00E9rea imediatamente \u2014 IOT precoce se sinais de inala\u00E7\u00E3o ou queimadura circunferencial de pesco\u00E7o</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83C\uDF2C\uFE0F</span><span>O\u2082 a 100% por m\u00E1scara n\u00E3o-reinalante (15L/min)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>Se suspeita de intoxica\u00E7\u00E3o por CO: manter O\u2082 100% por no m\u00EDnimo 6h. Se COHb >25%: O\u2082 hiperb\u00E1rico</span></div>';
      if(inhalationSigns.has('enclosed')){
        s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Inc\u00EAndio em ambiente fechado com pl\u00E1sticos/sint\u00E9ticos: considerar intoxica\u00E7\u00E3o por cianeto \u2192 <strong>Hidroxocobalamina 5g IV</strong> (ant\u00EDdoto de primeira linha)</span></div>';
      }
    } else {
      s+='<div class="conduta-item"><span class="conduta-icon">\u2705</span><span>Via a\u00E9rea patente. Monitorar sinais de obstru\u00E7\u00E3o. O\u2082 suplementar se necess\u00E1rio.</span></div>';
    }
    s+='</div>';

    // B - Breathing
    if(sev==='major' || circumferential || (activeRegions.has('ant_trunk') && activeRegions.has('post_trunk') && (depth==='3rd'||depth==='4th'))){
      s+='<div class="mgmt-section">';
      s+='<div class="mgmt-section-title">\uD83C\uDD71\uFE0F Ventila\u00E7\u00E3o (B)</div>';
      if(circumferential && (activeRegions.has('ant_trunk') || activeRegions.has('post_trunk'))){
        s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDEA8</span><span><strong>Queimadura circunferencial de t\u00F3rax identificada</strong> \u2192 avaliar escarotomia tor\u00E1cica de emerg\u00EAncia se houver restri\u00E7\u00E3o ventilat\u00F3ria</span></div>';
      } else {
        s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>Queimadura extensa de t\u00F3rax pode restringir ventila\u00E7\u00E3o \u2192 avaliar escarotomia tor\u00E1cica se necess\u00E1rio</span></div>';
      }
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCCF</span><span>Monitorar SpO\u2082, FR, padr\u00E3o ventilat\u00F3rio. Gasometria arterial seriada.</span></div>';
      s+='</div>';
    }

    // C - Fluid resuscitation
    s+='<div class="mgmt-section">';
    s+='<div class="mgmt-section-title">\uD83C\uDD72\uFE0F Ressuscita\u00E7\u00E3o Vol\u00EAmica (C)</div>';
    if(pk && needsIV() && depth!=='1st'){
      s+=`<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC89</span><span><strong>Ringer Lactato: ${pk.rateFirst.toLocaleString('pt-BR')} mL/h</strong> nas primeiras 8h (desde a queimadura)</span></div>`;
      s+=`<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC89</span><span>Ringer Lactato: ${pk.rateSecond.toLocaleString('pt-BR')} mL/h nas pr\u00F3ximas 16h</span></div>`;

      const elapsed=getElapsedHours();
      if(elapsed!==null && elapsed<8){
        const hoursLeft=Math.max(0,8-elapsed);
        const remaining=Math.max(0,pk.first8h-Math.round(pk.rateFirst*Math.min(elapsed,8)));
        const adjRate=hoursLeft>0?Math.round(remaining/hoursLeft):0;
        s+=`<div class="conduta-item"><span class="conduta-icon">\u23F1\uFE0F</span><span><strong>AJUSTADO:</strong> ${elapsed.toFixed(1)}h desde a queimadura \u2192 infundir ${remaining.toLocaleString('pt-BR')} mL em ${hoursLeft.toFixed(1)}h = <strong>${adjRate.toLocaleString('pt-BR')} mL/h AGORA</strong></span></div>`;
      } else if(elapsed!==null && elapsed>=8 && elapsed<24){
        s+=`<div class="conduta-item"><span class="conduta-icon">\u23F1\uFE0F</span><span><strong>AJUSTADO:</strong> J\u00E1 ultrapassou as 8h iniciais (${elapsed.toFixed(1)}h). Manter ${pk.rateSecond.toLocaleString('pt-BR')} mL/h.</span></div>`;
      }

      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCCF</span><span>Alvo de d\u00E9bito urin\u00E1rio: 0,5\u20131 mL/kg/h (adulto) ou 1\u20132 mL/kg/h (crian\u00E7a)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCCA</span><span>Sonda vesical de demora para monitoriza\u00E7\u00E3o cont\u00EDnua do d\u00E9bito urin\u00E1rio</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>Se DU < 0,5 mL/kg/h: aumentar 20% do volume. Se DU > 1 mL/kg/h: reduzir 20%. Evitar fluid creep (&gt;6 mL/kg/%SCQ)</span></div>';

      // Pediatric
      const age=parseInt(patAge);
      if(!isNaN(age) && age<=14){
        const w=parseFloat(patWeight);
        let maint=0;
        if(w<=10) maint=w*100;
        else if(w<=20) maint=1000+(w-10)*50;
        else maint=1500+(w-20)*20;
        s+=`<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC76</span><span><strong>Manuten\u00E7\u00E3o pedi\u00E1trica (Holliday-Segar):</strong> ~${Math.round(maint/24)} mL/h (${Math.round(maint)} mL/24h) de SG 5% + NaCl 0,45%. ADICIONAL ao Parkland. Monitorar glicemia capilar a cada 2\u20134h.</span></div>`;
      }
    } else if(depth==='1st'){
      s+='<div class="conduta-item"><span class="conduta-icon">\u2705</span><span>Queimadura de 1\u00BA grau \u2014 hidrata\u00E7\u00E3o oral geralmente suficiente</span></div>';
    } else {
      const threshold=parseInt(patAge)<=14?'10':'15';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCA7</span><span>SCQ < '+threshold+'% \u2014 hidrata\u00E7\u00E3o oral pode ser suficiente. Manter acesso venoso perif\u00E9rico.</span></div>';
    }
    s+='</div>';

    // D - Pain/disability
    s+='<div class="mgmt-section">';
    s+='<div class="mgmt-section-title">\uD83C\uDD73\uFE0F Analgesia (D)</div>';
    if(sev==='major'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC89</span><span><strong>Opioide IV:</strong> Morfina 0,05\u20130,1 mg/kg IV ou Fentanil 1\u20132 mcg/kg IV \u2014 titular conforme dor</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span>Dipirona 1g IV ou Cetoprofeno 100mg IV como adjuvante</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>Evitar IM em grandes queimados (absor\u00E7\u00E3o err\u00E1tica por edema). Apenas IV.</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span>Cetamina 0,2\u20130,5 mg/kg IV pode ser \u00FAtil para procedimentos dolorosos (trocas de curativo)</span></div>';
    } else if(sev==='moderate'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC89</span><span>Opioide IV se dor intensa: Tramadol 50\u2013100mg IV ou Morfina dose baixa</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span>Dipirona 1g IV + AINE se n\u00E3o contraindicado</span></div>';
    } else {
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span>Dipirona 1g VO/IV ou Paracetamol 750mg VO + AINE</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span>Tramadol 50\u2013100mg VO se dor refrat\u00E1ria</span></div>';
    }
    s+='</div>';

    // E - Exposure / Wound care
    s+='<div class="mgmt-section">';
    s+='<div class="mgmt-section-title">\uD83C\uDD74\uFE0F Exposi\u00E7\u00E3o / Cuidado com a Ferida (E)</div>';
    s+='<div class="conduta-item"><span class="conduta-icon">\uD83C\uDF21\uFE0F</span><span><strong>Prevenir hipotermia!</strong> Manter ambiente aquecido (>28\u00B0C). Cobrir \u00E1reas n\u00E3o examinadas. Aquecer fluidos IV.</span></div>';
    s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCA7</span><span>Irriga\u00E7\u00E3o com \u00E1gua corrente limpa em temperatura ambiente por 20min (se <3h da queimadura). SF 0,9% para limpeza.</span></div>';
    if(mechanism==='chemical'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDEBF</span><span><strong>Queimadura qu\u00EDmica:</strong> Irriga\u00E7\u00E3o copiosa e prolongada (30\u201360 min, m\u00EDnimo). Remover TODAS as roupas e acess\u00F3rios contaminados. N\u00C3O neutralizar o agente.</span></div>';
      if(chemAgent==='alkali'){
        s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>\u00C1lcali: irrigar at\u00E9 pH da pele < 8,0 (usar fita de pH). Pode necessitar irrigar por horas.</span></div>';
      }
      if(chemAgent==='organic'){
        s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>Agente org\u00E2nico/espec\u00EDfico: consultar protocolo do agente. \u00C1cido fluor\u00EDdrico \u2192 gluconato de c\u00E1lcio 2,5% gel t\u00F3pico e/ou infiltra\u00E7\u00E3o subcut\u00E2nea.</span></div>';
      }
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC41\uFE0F</span><span>Se houve contato ocular: irrigar olhos com SF 0,9% por 30min. Avalia\u00E7\u00E3o oftalmol\u00F3gica urgente.</span></div>';
    }
    s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDF4</span><span>Limpeza com clorexidina aquosa dilu\u00EDda ou SF 0,9%</span></div>';
    if(depth==='2nd_s' || depth==='2nd_d'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDE79</span><span>Bolhas \u00EDntegras <2cm: manter. Bolhas >2cm, tensas ou rotas: aspirar/desbridar pele desvitalizada.</span></div>';
    }
    s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDE4</span><span>Curativo: sulfadiazina de prata 1% (padr\u00E3o) ou curativo biol\u00F3gico/sint\u00E9tico. Trocar a cada 12\u201324h.</span></div>';
    s+='<div class="conduta-item"><span class="conduta-icon">\u274C</span><span>N\u00C3O aplicar gelo, pasta de dente, manteiga, \u00F3leo de cozinha ou outros produtos caseiros</span></div>';
    s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCF7</span><span>Fotografar as les\u00F5es (documentar para evolu\u00E7\u00E3o e m\u00E9dico de refer\u00EAncia)</span></div>';
    s+='</div>';

    // Tetanus
    s+='<div class="mgmt-section">';
    s+='<div class="mgmt-section-title">\uD83D\uDC89 Profilaxia Tet\u00E2nica</div>';
    s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC89</span><span>Verificar status vacinal. Refor\u00E7o de dT/dTpa se \u00FAltima dose > 5 anos ou esquema incompleto.</span></div>';
    s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC89</span><span>SAT (soro antitet\u00E2nico) ou IGHAT se esquema desconhecido ou < 3 doses.</span></div>';
    s+='</div>';

    // Escharotomy
    if(depth==='3rd'||depth==='4th'||circumferential||sev==='major'){
      s+='<div class="mgmt-section">';
      s+='<div class="mgmt-section-title">\uD83D\uDD2A Escarotomia</div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span><strong>Indica\u00E7\u00F5es:</strong> Queimadura circunferencial de t\u00F3rax (restri\u00E7\u00E3o ventilat\u00F3ria) ou extremidades (s\u00EDndrome compartimental)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCCF</span><span>Monitorar: pulsos distais (Doppler), oximetria de pulso, press\u00E3o compartimental, enchimento capilar, dor desproporcional</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83C\uDFE5</span><span>Procedimento de emerg\u00EAncia \u2014 incis\u00E3o longitudinal medial e lateral pela escara, at\u00E9 gordura subcut\u00E2nea s\u00E3</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u23F0</span><span>Realizar nas primeiras 6h se sinais de comprometimento vascular/ventilat\u00F3rio</span></div>';
      if(circumferential){
        s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDEA8</span><span><strong>Queimadura circunferencial confirmada nesta avalia\u00E7\u00E3o.</strong> Avalia\u00E7\u00E3o neurovascular seriada obrigat\u00F3ria. Elevar extremidades.</span></div>';
      }
      s+='</div>';
    }

    // Electrical specific
    if(mechanism==='electrical'){
      s+='<div class="mgmt-section">';
      s+='<div class="mgmt-section-title">\u26A1 Espec\u00EDfico \u2014 Queimadura El\u00E9trica</div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC93</span><span>ECG 12 deriva\u00E7\u00F5es + monitoriza\u00E7\u00E3o cont\u00EDnua por 24h (risco de arritmias ventriculares)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>CPK, mioglobina s\u00E9rica e urin\u00E1ria, troponina (rabdomi\u00F3lise e les\u00E3o mioc\u00E1rdica)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCA7</span><span>Aumentar volume de ressuscita\u00E7\u00E3o: manter DU > 1\u20132 mL/kg/h se mioglobin\u00FAria (urina escura)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span>Se mioglobin\u00FAria: NaHCO\u2083 para alcalinizar urina (pH urin\u00E1rio >6,5) + Manitol 12,5\u201325g IV</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDB4</span><span>Avaliar les\u00E3o musculoesquel\u00E9tica profunda, s\u00EDndrome compartimental e fraturas (contra\u00E7\u00E3o muscular violenta)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC41\uFE0F</span><span>Avalia\u00E7\u00E3o oftalmol\u00F3gica (risco de catarata) e neurologia (neuropatia perif\u00E9rica tardia)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>SCQ subestima gravidade real \u2014 les\u00E3o profunda desproporcional \u00E0 \u00E1rea de superf\u00EDcie vis\u00EDvel</span></div>';
      s+='</div>';
    }

    // Labs
    s+='<div class="mgmt-section">';
    s+='<div class="mgmt-section-title">\uD83E\uDDEA Exames Complementares</div>';
    if(sev==='major'||sev==='moderate'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Hemograma completo, eletr\u00F3litos (Na, K, Ca, Mg), ureia, creatinina, glicemia</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Gasometria arterial + lactato</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Tipagem sangu\u00EDnea + prova cruzada, coagulograma (TP, TTPa, fibrinog\u00EAnio)</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Albumina s\u00E9rica (perda prot\u00E9ica \u00E9 significativa em grandes queimados)</span></div>';
      if(inhalationSigns.size>0) s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Carboxi-hemoglobina (COHb) \u2014 alvo <10%. COHb >25% = O\u2082 hiperb\u00E1rico</span></div>';
      if(mechanism==='electrical') s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>CPK total, mioglobina s\u00E9rica/urin\u00E1ria, troponina, ECG</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCF7</span><span>Radiografia de t\u00F3rax (edema pulmonar, SDRA)</span></div>';
    } else {
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83E\uDDEA</span><span>Exames conforme necessidade cl\u00EDnica. Queimadura menor geralmente n\u00E3o exige laborat\u00F3rio extenso.</span></div>';
    }
    s+='</div>';

    // Disposition
    s+='<div class="mgmt-section">';
    s+='<div class="mgmt-section-title">\uD83C\uDFE5 Disposi\u00E7\u00E3o</div>';
    if(sev==='major'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDEA8</span><span><strong>Interna\u00E7\u00E3o obrigat\u00F3ria</strong> \u2014 CTQ ou UTI. Contato com central de regula\u00E7\u00E3o para transfer\u00EAncia.</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCDE</span><span>Contatar CTQ de refer\u00EAncia. Estabilizar antes de transferir (ABCDE, Parkland iniciado, analgesia).</span></div>';
    } else if(sev==='moderate'){
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83C\uDFE5</span><span>Interna\u00E7\u00E3o hospitalar para observa\u00E7\u00E3o m\u00EDnima 24\u201348h. Avaliar necessidade de CTQ.</span></div>';
    } else {
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83C\uDFE0</span><span>Manejo ambulatorial poss\u00EDvel. Revis\u00E3o em 24\u201348h. Orientar sinais de alarme (febre, aumento da dor, secre\u00E7\u00E3o purulenta, extens\u00E3o do eritema).</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDC8A</span><span>Receita: Analgesia VO + orienta\u00E7\u00F5es de curativo (sulfadiazina de prata 1%, trocar 1\u20132x/dia, lavar com SF 0,9%)</span></div>';
    }
    s+='</div>';

    // Child abuse screening
    const ageNum2=parseInt(patAge);
    if(!isNaN(ageNum2) && ageNum2<10){
      s+='<div class="mgmt-section">';
      s+='<div class="mgmt-section-title">\uD83D\uDC76 Rastreio de Maus-Tratos</div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\u26A0\uFE0F</span><span>Em crian\u00E7as, avaliar padr\u00E3o da queimadura. Sinais sugestivos de maus-tratos: les\u00E3o em \u201Cluva/meia\u201D (imers\u00E3o), limites n\u00EDtidos, aus\u00EAncia de salpicos, hist\u00F3ria incompat\u00EDvel com les\u00E3o, atraso na busca de atendimento.</span></div>';
      s+='<div class="conduta-item"><span class="conduta-icon">\uD83D\uDCCB</span><span>Se suspeita: notifica\u00E7\u00E3o obrigat\u00F3ria ao Conselho Tutelar (ECA, Art. 13). Documentar detalhadamente.</span></div>';
      s+='</div>';
    }

    return s;
  });

  // ── COLLAPSIBLE: Note ──
  h+=collapsible('note','Nota para Prontu\u00E1rio',()=>buildNoteContent());

  // Nav
  h+='<div class="nav-row">';
  h+='<button class="nav-btn secondary" onclick="prev()">\u2190 Voltar</button>';
  h+='<button class="nav-btn primary" onclick="restart()">\u21BB Recome\u00E7ar</button>';
  h+='</div></div>';

  app.innerHTML=h;
}

// =============================================
// COLLAPSIBLE
// =============================================
function collapsible(id,title,contentFn){
  const open=sections[id];
  let h='<div class="dark-box">';
  h+=`<div class="collapse-header" onclick="toggleSection('${id}')">`;
  h+=`<h3>${title}</h3><span class="collapse-arrow ${open?'open':''}">\u25BC</span></div>`;
  h+=`<div class="collapse-body ${open?'visible':'hidden'}">`;
  if(open) h+=contentFn();
  h+='</div></div>';
  return h;
}

// =============================================
// NOTE
// =============================================
function buildNoteContent(){
  const tbsa=getTBSA();
  const pk=getParkland();
  const sev=getSeverity();
  const sevLabel=getSeverityLabel(sev);
  const criteria=getTransferCriteria();
  const baux=getBauxScore();

  const now=evalStartTime;
  const pad=n=>String(n).padStart(2,'0');
  const ts=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  let n='';
  n+=`QUEIMADURA - AVALIA\u00C7\u00C3O ESTRUTURADA\n`;
  n+=`Data/hora da avalia\u00E7\u00E3o: ${ts}\n`;
  if(getBurnTime()){
    const elapsed=getElapsedHours();
    n+=`Hora da queimadura: ${burnHour.padStart(2,'0')}:${burnMinute.padStart(2,'0')} (${elapsed!==null?elapsed.toFixed(1):'?'}h antes da avalia\u00E7\u00E3o)\n`;
  }
  n+=`========================================\n\n`;

  n+=`PACIENTE: ${patSex==='M'?'Masculino':'Feminino'}, ${patAge} anos, ${patWeight} kg\n\n`;

  n+=`MECANISMO: ${getMechanismLabel(mechanism)}`;
  if(mechanism==='electrical') n+=` (${elecVoltage==='high'?'Alta':'Baixa'} tens\u00E3o)`;
  if(mechanism==='chemical' && chemAgent) n+=` (${CHEMICAL_AGENTS.find(a=>a.id===chemAgent).label})`;
  n+='\n';

  n+=`PROFUNDIDADE: ${getDepthLabel(depth)}\n`;
  n+=`SCQ (Regra dos 9): ${getTBSADisplay()}\n`;

  const regNames=BODY_REGIONS.filter(r=>activeRegions.has(r.id)).map(r=>{
    const frac=regionPartial[r.id]||1;
    const pct=getRegionPct(r)*frac;
    return r.name.replace('\n',' ')+' ('+(pct%1===0?pct:pct.toFixed(1))+'%)';
  });
  if(regNames.length>0) n+=`Regi\u00F5es: ${regNames.join(', ')}\n`;

  // Critical areas
  if(criticalAreas.size>0){
    const caNames=CRITICAL_AREAS.filter(c=>criticalAreas.has(c.id)).map(c=>c.label);
    n+=`\u00C1reas cr\u00EDticas: ${caNames.join(', ')}\n`;
  }
  if(circumferential) n+=`Queimadura circunferencial: SIM\n`;

  n+=`\nGRAVIDADE: ${sevLabel}\n`;

  // Baux
  const ageNum=parseInt(patAge);
  if(baux!==null && !isNaN(ageNum) && ageNum>=15 && tbsa>0){
    n+=`\u00CDndice de Baux${inhalationSigns.size>=2?' Modificado':''}: ${baux} (Idade ${patAge} + SCQ ${tbsa}%${inhalationSigns.size>=2?' + 17 inala\u00E7\u00E3o':''})\n`;
  }

  // Inhalation
  const inhPresent=INHALATION_SIGNS.filter(s=>inhalationSigns.has(s.id));
  if(inhPresent.length>0){
    n+=`\nLES\u00C3O INALAT\u00D3RIA: ${inhPresent.length} sinal(is)\n`;
    for(const s of inhPresent) n+=`  [+] ${s.label}\n`;
    if(inhPresent.length>=2) n+=`  >> Alta suspeita - considerar IOT precoce\n`;
  } else {
    n+=`\nLES\u00C3O INALAT\u00D3RIA: Sem sinais identificados\n`;
  }

  // Parkland
  if(pk && depth!=='1st' && tbsa>0){
    n+=`\nRESSUSCITA\u00C7\u00C3O VOL\u00CAMICA (Parkland):\n`;
    n+=`  4 mL x ${patWeight} kg x ${tbsa}% = ${pk.total.toLocaleString('pt-BR')} mL/24h (RL)\n`;
    n+=`  Primeiras 8h: ${pk.first8h.toLocaleString('pt-BR')} mL (${pk.rateFirst.toLocaleString('pt-BR')} mL/h)\n`;
    n+=`  Pr\u00F3ximas 16h: ${pk.next16h.toLocaleString('pt-BR')} mL (${pk.rateSecond.toLocaleString('pt-BR')} mL/h)\n`;
    n+=`  Alvo DU: ${parseInt(patAge)<=14?'1-2':'0,5-1'} mL/kg/h\n`;

    const elapsed=getElapsedHours();
    if(elapsed!==null && elapsed<24){
      const hoursLeft8=Math.max(0,8-elapsed);
      if(hoursLeft8>0){
        const remaining=Math.max(0,pk.first8h-Math.round(pk.rateFirst*Math.min(elapsed,8)));
        const adjRate=hoursLeft8>0?Math.round(remaining/hoursLeft8):0;
        n+=`  ** AJUSTE: ${elapsed.toFixed(1)}h decorridas -> ${adjRate.toLocaleString('pt-BR')} mL/h agora **\n`;
      }
    }

    if(inhalationSigns.size>=2){
      n+=`  ** Les\u00E3o inalat\u00F3ria: considerar +30-50% volume **\n`;
    }
  }

  // Transfer criteria
  if(criteria.length>0){
    n+=`\nCRIT\u00C9RIOS DE TRANSFER\u00CANCIA (CTQ/ABA): ${criteria.length} crit\u00E9rio(s)\n`;
    for(const c of criteria) n+=`  [!] ${c}\n`;
  } else {
    n+=`\nCRIT\u00C9RIOS DE TRANSFER\u00CANCIA (CTQ/ABA): Nenhum\n`;
  }

  n+=`\nCONDUTA INICIAL:\n`;
  // Airway
  if(inhalationSigns.size>=2 || sev==='major'){
    n+=`  Via a\u00E9rea: Avaliar IOT precoce. O2 100%.\n`;
  } else {
    n+=`  Via a\u00E9rea: Patente. Monitorar.\n`;
  }
  // Fluids
  if(pk && needsIV() && depth!=='1st'){
    n+=`  Ressuscita\u00E7\u00E3o: RL ${pk.rateFirst.toLocaleString('pt-BR')} mL/h (8h), ${pk.rateSecond.toLocaleString('pt-BR')} mL/h (16h)\n`;
    const elapsed=getElapsedHours();
    if(elapsed!==null && elapsed<8){
      const hoursLeft=Math.max(0,8-elapsed);
      const remaining=Math.max(0,pk.first8h-Math.round(pk.rateFirst*Math.min(elapsed,8)));
      const adjRate=hoursLeft>0?Math.round(remaining/hoursLeft):0;
      n+=`  ** Ajuste temporal: ${adjRate.toLocaleString('pt-BR')} mL/h agora (${elapsed.toFixed(1)}h decorridas) **\n`;
    }
  } else {
    n+=`  Hidrata\u00E7\u00E3o: Oral/IV conforme necessidade\n`;
  }
  // Pain
  if(sev==='major') n+=`  Analgesia: Opioide IV (morfina/fentanil) + adjuvante IV\n`;
  else if(sev==='moderate') n+=`  Analgesia: Tramadol/morfina IV + dipirona IV\n`;
  else n+=`  Analgesia: Dipirona/paracetamol +/- tramadol VO\n`;

  n+=`  Ferida: Limpeza + curativo com sulfadiazina de prata 1%\n`;
  n+=`  Profilaxia tet\u00E2nica: Verificar status vacinal\n`;

  if(mechanism==='electrical') n+=`  Espec\u00EDfico: ECG 12D, CPK, mioglobina, monitor cont\u00EDnuo 24h\n`;
  if(mechanism==='chemical') n+=`  Espec\u00EDfico: Irriga\u00E7\u00E3o prolongada (${chemAgent==='alkali'?'at\u00E9 pH<8.0, ':''}m\u00EDnimo 30-60min)\n`;
  if(inhalationSigns.has('enclosed')) n+=`  Suspeita de cianeto: considerar hidroxocobalamina 5g IV\n`;
  if(circumferential) n+=`  Circunferencial: Monitorar pulsos distais, avaliar escarotomia\n`;

  n+=`\nDISPOSI\u00C7\u00C3O: ${sev==='major'?'Interna\u00E7\u00E3o CTQ/UTI + transfer\u00EAncia':sev==='moderate'?'Interna\u00E7\u00E3o hospitalar':'Manejo ambulatorial com revis\u00E3o 24-48h'}\n`;

  const escaped=n.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<div class="note-text" id="noteContent">${escaped}</div><button class="copy-btn" id="copyBtn" onclick="copyNote()">\uD83D\uDCCB Copiar nota</button>`;
}

function copyNote(){
  const el=document.getElementById('noteContent');
  if(!el) return;
  const text=el.textContent||el.innerText;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showCopied();
    }).catch(()=>{
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');showCopied();}catch(e){}
  document.body.removeChild(ta);
}

function showCopied(){
  const btn=document.getElementById('copyBtn');
  if(!btn) return;
  btn.textContent='\u2713 Copiado!';btn.classList.add('copied');
  setTimeout(()=>{if(document.getElementById('copyBtn')){btn.textContent='\uD83D\uDCCB Copiar nota';btn.classList.remove('copied')}},2000);
}

// =============================================
// ACTIONS
// =============================================
function setMechanism(id){
  mechanism=id;
  if(id!=='electrical') elecVoltage=null;
  if(id!=='chemical') chemAgent=null;
  render();
}
function setElecV(v){elecVoltage=v;render()}
function setChemAgent(id){chemAgent=id;render()}
function setDepth(id){depth=id;render()}
function toggleRegion(id){
  if(activeRegions.has(id)){activeRegions.delete(id);delete regionPartial[id]}
  else{activeRegions.add(id);regionPartial[id]=1}
  render();
}
function setFrac(id,f){regionPartial[id]=f;render()}
function toggleCirc(){circumferential=!circumferential;render()}
function toggleCritArea(id){criticalAreas.has(id)?criticalAreas.delete(id):criticalAreas.add(id);render()}
function toggleInhSign(id){inhalationSigns.has(id)?inhalationSigns.delete(id):inhalationSigns.add(id);render()}
function setPatSex(v){patSex=v;render()}
function setPatAge(v){
  patAge=v;
  // Auto-adjust pediatric regions
  const age=parseInt(v);
  if(!isNaN(age) && age<=14) usePediatric=true;
  else usePediatric=false;
  render();
}
function setPatWeight(v){patWeight=v;render()}
function setBurnHour(v){burnHour=v;render()}
function setBurnMin(v){burnMinute=v;render()}
function toggleSection(id){sections[id]=!sections[id];render()}

function next(){
  if(step===0 && (!mechanism || (mechanism==='electrical' && !elecVoltage) || (mechanism==='chemical' && !chemAgent))) return;
  if(step===1 && !depth) return;
  if(step===4 && (!patSex || !patAge || !patWeight)) return;
  step++;
  render();
}
function prev(){if(step>0){step--;render()}}
function restart(){
  step=0;mechanism=null;elecVoltage=null;chemAgent=null;depth=null;
  activeRegions=new Set();regionPartial={};circumferential=false;criticalAreas=new Set();
  inhalationSigns=new Set();
  patWeight='';patAge='';patSex=null;burnHour='';burnMinute='';usePediatric=false;
  sections={summary:true,tbsa:true,parkland:true,inhalation:false,transfer:true,management:true,note:true};
  render();
}

// Focus management: keep input focus after render
const _render=render;
render=function(){
  const ae=document.activeElement;
  const aeid=ae?ae.id:null;
  const aeVal=ae?ae.value:null;
  const aeSel=ae?ae.selectionStart:null;
  _render();
  if(aeid){
    const el=document.getElementById(aeid);
    if(el){el.focus();if(aeSel!==null){try{el.setSelectionRange(aeSel,aeSel)}catch(e){}}}
  }
};

render();
</script>
